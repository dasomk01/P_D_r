<title>피부과 문풀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* layout: 상단 고정 필터 묶음 + 한 문제씩 넘기는 카드 한 장 */
:root{
  --bg:#f3f4f8;--card:#ffffff;--fg:#1d2030;--mute:#6b6f85;--line:#d9dbe6;
  --accent:#3550c0;--accent-fg:#ffffff;--accent-soft:#e8ecfb;
  --ok:#23824a;--ok-soft:#e5f4ea;--bad:#c23a32;--bad-soft:#fbeae8;--warn:#8a6400;--warn-soft:#fff4d6;
  --chip:#ebedf3;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161e;--card:#1d2029;--fg:#e8e9f0;--mute:#9a9db0;--line:#333747;
  --accent:#7d93ff;--accent-fg:#0f1220;--accent-soft:#252d4d;
  --ok:#5fcf8a;--ok-soft:#18321f;--bad:#ff7d73;--bad-soft:#3a1d1b;--warn:#f2c552;--warn-soft:#3a3016;--chip:#272a36;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161e;--card:#1d2029;--fg:#e8e9f0;--mute:#9a9db0;--line:#333747;
  --accent:#7d93ff;--accent-fg:#0f1220;--accent-soft:#252d4d;
  --ok:#5fcf8a;--ok-soft:#18321f;--bad:#ff7d73;--bad-soft:#3a1d1b;--warn:#f2c552;--warn-soft:#3a3016;--chip:#272a36;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
h1{font-size:26px;line-height:1.25;margin:4px 0 10px;font-weight:700;letter-spacing:-.01em}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--mute);font-size:14.5px}
.stats b{color:var(--fg);font-family:var(--f-num);font-weight:500;margin-left:4px}
.sync{text-align:right;color:var(--mute);font-size:13px;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input[type=search],textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px}
select,input[type=search]{width:100%;min-width:0;padding:10px 12px;font-size:15px}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip,.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 16px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{border-radius:12px;padding:9px 14px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.navbar{display:flex;align-items:center;gap:8px}
.navbar .pos{flex:1;font-family:var(--f-num);color:var(--mute);font-size:15px;min-width:0}
.navbar .pos b{color:var(--fg);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;color:var(--mute);font-size:14px}
.pill{background:var(--chip);color:var(--fg);border-radius:8px;padding:2px 9px;font-size:13px;font-weight:600}
.pill.area{background:var(--accent-soft);color:var(--accent)}
.pill.king{background:var(--warn-soft);color:var(--warn)}
.meta{color:var(--accent);font-size:14px;margin-top:8px;font-weight:500}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:7px 11px;font-size:13.5px;margin-top:8px}
.note.oos{background:var(--chip);color:var(--mute)}
.stem{font-size:17px;margin:14px 0 12px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.imgs img{display:block;max-width:100%;height:auto;margin:8px auto;border-radius:8px;border:1px solid var(--line)}
.vis{background:var(--chip);border-radius:10px;padding:8px 11px;font-size:14px;white-space:pre-wrap;margin-bottom:8px}
.choices{display:grid;gap:10px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;word-break:keep-all;overflow-wrap:anywhere}
.ch .no{font-family:var(--f-num);color:var(--mute);font-size:14px;flex:none;width:18px;padding-top:2px}
.ch span:last-child{min-width:0}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ch.mine{box-shadow:inset 0 0 0 1px currentColor}
.ch.sel{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--fg)}
.done .ch{cursor:default}
.result{margin-top:14px;font-weight:700;font-size:16px}
.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}
.exp{margin-top:8px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.exp h3{font-size:13px;color:var(--mute);margin:14px 0 4px;font-weight:600;letter-spacing:.02em}
.exp ol{margin:0;padding-left:22px;white-space:normal}
.exp li{margin:3px 0}
.ai{background:var(--accent-soft);border-radius:10px;padding:8px 11px;font-size:14px;margin-top:10px;white-space:pre-wrap}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.acts .chip{font-size:14px;padding:6px 13px}
.memo{margin-top:14px}
.memo label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:600}
.fam{margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px}.fam summary{cursor:pointer;font-weight:600}.famq{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}.famch{margin:6px 0 0;padding-left:24px}.famch li.ok{font-weight:700;color:var(--accent)}
.memo textarea{width:100%;min-height:220px;max-height:75vh;padding:12px 14px;font-size:15px;line-height:1.6;resize:vertical;overflow-y:auto}
.memo .saved{font-size:12px;color:var(--mute);min-height:1em}
.bottomnav{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.sheet{position:fixed;inset:0;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.sheet[hidden]{display:none}
.sheet .box{background:var(--bg);width:100%;max-width:760px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{font-size:18px;margin:0 0 8px}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);padding:9px 2px;cursor:pointer;display:flex;gap:10px}
.list li.cur{background:var(--accent-soft)}
.list .n{font-family:var(--f-num);color:var(--mute);font-size:13px;width:44px;flex:none;padding-top:2px}
.list .t{min-width:0;font-size:14.5px}
.list .s{font-size:12.5px;color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.sheet textarea{width:100%;height:160px;font:12px/1.4 var(--f-num);padding:8px}
.msg{font-size:13px;color:var(--ok);min-height:1.2em;margin:6px 0}
@media (max-width:420px){h1{font-size:23px}.stem{font-size:16.5px}}
@media (prefers-reduced-motion:no-preference){.ch{transition:background .15s,border-color .15s}}
</style>

를 장기간 도포 시 발생하는 흔한 부작용으로 표피가 얇아지거나 피부가 함몰되는 현상은?","choices":["궤양(ulcer)","위축(atrophy)","태선화(licenification)","미란(erosion)","틈새(fissure)"],"ans":[2],"imgs":[],"vis":[],"notes":["✍️ 출제: 박진 교수님 (2025)"],"basis":"📚 학습지 해설: 2022 야마와 같은 문제. 위축: 표피의 위축 = 표피가 얇아짐(스테로이드 장기 도포, 노화, 원반모양 홍반루푸스), 진피의 위축 = 아교질 소실로 함몰(팽창선, 당뇨병 지방괴사, 피부경화증). 원발진: 반점(1cm 미만)/반(1cm 이상) – 융기·함몰 없는 색조 변화, 구진(1cm 미만)/판(1cm 이상) – 경계 뚜렷한 융기, 결절 – 구진보다 크고 깊음(진피·피하지방 유래, 결절홍반), 잔물집(1cm 미만)/물집 – 맑은 액체, 고름물집 – 농, 팽진 – 일시적 부종성 평평한 융기. 속발진: 비늘, 긁은상처, 까짐(미란: 표피만 소실, 흉터 없음), 궤양(표피+진피 소실, 흉터), 열창(틈새: 선상의 틈), 딱지, 흉터, 위축, 태선화(반복 긁음 → 표피 전체·진피 일부가 가죽처럼 두꺼워지고 주름 뚜렷).","exps":[],"ai":"","pick":0,"fl":{}},{"k":"derm-y-sx-dist-2025","fam":"sx-dist","area":"야마","prof":"박진","sec":"11/5 4교시 · 피부의 증상, 징후 및 진단, 피부면역학 (야마 · 수업 전)","meta":"근거: 학습지 「피부의 증상, 징후와 진단」 14–28쪽","year":"2025 객3","type":"객","rep":4,"repyears":"2022 객3 · 2019 객2 · 2018 객3","stem":"피부병터는 질환에 따라 특징적인 분포를 보이거나 흔히 발생하는 신체부위가 정해져 있어 피부질환을 진단하는데 도움이 된다. 질환에 따른 특징적인 분포 및 발생부위로 옳은 것은?","choices":["수두 - 작은 물집이 주로 손발바닥과 손가락 사이에 분포","동전습진 - 고리모양 홍반이 주로 두피와 얼굴에 국한하여 분포","대상포진 - 붉은 반점 위에 군집된 물집이 몸통의 일측으로 선모양으로 분포","2기 매독 - 궤양 및 인설이 덮인 구진이 손발바닥을 제외한 피부와 성기부에 분포","아토피피부염 - 태선화된 판이 성인의 입점막과 팔다리의 폄쪽에 일측성으로 분포"],"ans":[3],"imgs":[],"vis":[],"notes":["✍️ 출제: 박진 교수님 (2025)"],"basis":"📚 학습지 해설: ① 한포진 설명. ② 동전습진은 팔다리 폄쪽에 호발. ③ 정답. ④ 2기 매독은 손발바닥에도 나타난다. ⑤ 성인 아토피는 팔다리 굽힘쪽에 양측성. (복원자: 박진 교수님은 이런 유형을 자주 내고 정답 선지가 명확한 편)","exps":[],"ai":"","pick":0,"fl":{}},{"k":"derm-y-sx-test-2025","fam":"sx-test","area":"야마","prof":"박진","sec":"11/5 4교시 · 피부의 증상, 징후 및 진단, 피부면역학 (야마 · 수업 전)","meta":"근거: 학습지 「피부의 증상, 징후와 진단」 14–28쪽","year":"2025 객4","type":"객","rep":8,"repyears":"2023 객4 · 2022 객4 · 2021 객2 · 2020 객2 · 2019 객4 · 2018 객4 · 2017 객4","stem":"피부질환의 진단을 위해 임상현장에서 흔히 활용되는 피부과학적 검사방법에 대한 설명으로 옳은 것은?","choices":["발톱 각질의 KOH도말검사에서 균사가 발견되면 발톱 무좀으로 진단한다.","저색소병변의 우드등검사에서 황녹색 형광을 보이면 백반증으로 진단한다.","물집병터의 챙크도말검사에서 다핵거대세포가 발견되면 바이러스성 사마귀로 진단한다.","더모스코피 검사를 통해 진균의 포자나 균사를 직접 확인하여 표재진균감염을 확진할 수 병 개선을 위한 환자교육을 하고자 한다. 옳은 것은?","choices":["기구보다는 손발톱으로 긁도록 한다.","보습제는 증상이 없어도 규칙적으로 도포한다.","목욕은 뜨거운 물로 30~1시간 정도 시행한다.","보온을 위해 나일론이나 모직으로 된 의복을 입는다.","보습제는 목욕 후 몸을 충분히 건조시킨 후 도포한다."],"ans":[2],"imgs":[],"vis":[],"notes":["✍️ 출제: 박진 교수님 (2022)"],"basis":"📚 학습지 해설: 매년 선지를 조금씩 바꿔 내는 증례. ① 손발톱으로 긁는 것도 안 좋다(짧게 깎기). ③ 미지근한 물 20분 이내. ④ 순면. ⑤ 목욕 후 3분 이내, 물기를 완전히 말리지 말고 바로(수업 언급). 아토피 피부관리(강의록): 목욕은 매일 미지근한 물(32–34도)로 20분 이내, 때는 밀지 않음, 2–3일에 한 번 저자극(아토피 전용) 비누. 보습제는 목욕 후 3분 이내(물기를 완전히 말리기 전), 증상이 없어도 하루 2회 이상. 피부에 닿는 옷은 순면(모직·나일론은 자극원), 손발톱은 짧게(손톱·기구로 긁지 않기), 사우나·수영은 악화 가능, 심하면 수성밀폐요법(wet wrap).","exps":[],"ai":"","pick":0,"fl":{}},{"k":"derm-y-sd-tx-2022","fam":"sd-tx","area":"야마","prof":"박진","sec":"11/6 4교시 · 11/10 3교시 · 습진 1·2 (야마 · 수업 전)","meta":"근거: 학습지 「습진」 32–63쪽","year":"2022 객11","type":"객","rep":7,"repyears":"2025 객12 · 2021 객9 · 2019 객12 · 2017 객10 · 2016 객13 · 2012 객10","stem":"45세 남자가 수년 전부터 얼굴에 인설이 덮인 홍반이 생겨 개인의원 여러 곳에서 진료 후 완치를 위해 대학병원에 왔다. 두피에는 비듬이 많았고, 눈썹 측면, 양측 뺨, 코입술 주름에서는 홍반 위에 기름진 노란 인설이 덮여 있었다 (사진). 경미한 가려움을 느꼈으며, 음주나 피로 시마다 심해졌다. 비늘을 채취하여 시행한 KOH 도말검사에서 균사 및 포자는 관찰되지 않았다. 적절한 치료는?","choices":["기름진 음식을 피한다.","고용량 스테로이드 전신투여로 완치될 수 있다.","비듬제거를 위해 항진균 샴푸로 머리를 자주 감는다.","기름진 인설에는 각질용해제나 알코올 솜이 효과적이다.","만성에는 스테로이드연고나 칼시뉴린억제제는 사용하지 않는다."],"ans":[3],"imgs":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAFjAW4DASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAwQAAgUBBgf/xABJEAABAwMDAwIDBAUIBwcFAAABAAIRAyExBBJBBVFhInETgZEGMqHRFBWTscEHIyVClNLh8BYkMzVFVnMmRlViZITCQ1JjdIP/xAAZAQADAQEBAAAAAAAAAAAAAAAAAQIEAwX/xAAhEQEBAAICAwEBAQEBAAAAAAAAAQIRAxIhMVETQSIyBP/aAAwDAQACEQMRAD8A+cf6Xfaf/mPrH9vq/wB5VP2v+0//ADH1j+3Vf7yxSb+FIkJG2R9r/tP/AMx9Y/t1X+8oPth9p+ftH1j+31f7yxAZUF+EBvN+1/2mP/ePrH9vq/3kRn2q+075/wC0fWP7dV/vLBYCTZPUGxYYPdTbo5Ntmj9pvtO+3+kHWD/76r/eT1L7Q/aKBu691Y++tqfmkNPSFgBlPNoN2gxdZ8+WtWH 1 객7","type":"객","rep":1,"repyears":"","stem":"9세 남아가 얼굴, 목, 다리오금 부위에 심한 가려움을 동반한 (사진)과 같은 피부병터를 호소하였다. 피부는 전반적으로 건조한 편이었고, 일부는 가죽처럼 두꺼워져 있었다. 알레르기 비염을 앓고 있었으며, 혈액검사에서 호산구와 혈청 IgE가 증가된 소견을 보였다. 이 질환에 대한 설명 중 옳은 것은?","choices":["세균, 바이러스 등 피부감염의 빈도는 정상인과 차이가 없다.","백색 피부묘기증(white dermographism)이 나타나기도 한다.","만성화 될 경우 결절홍반(erythema nodosum)이 관찰될 수 있다.","유아의 경우 주로 굽힘부위에 병변이 발생하며, 성인의 경우 주로 폄부위에 발생한다.","필라그린(filaggrin) 단백질을 생산하는 FLG 유전자의 기능획득돌연변이와 관련이 있다."],"ans":[2],"imgs":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAD/AZ0DASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAABAUDBgACBwEI/8QAVRAAAQMCBAMEBAcJCwsEAwAAAQACEQMhBAUSMQZBURMiYXEHMoGRFHShsbLR0hUWIzVCUnKiwSQlMzZiZJKjpOHwFyY0Q1NUVWOCg4Rzk8LxRJTi/8QAGQEAAwEBAQAAAAAAAAAAAAAAAQIDAAQF/8QAIxEBAQACAgIBBQEBAAAAAAAAAAECEQMxEiETBCIyQVEUQv/aAAwDAQACEQMRAD8A5i3jDijV/GTODeP9Pq/aUn34cT8+I8422+HVd/6SQbHl79rqQXfYwTsloxYWcY8Sj1+Is23Fvh1X2/lKb78+IQB/nBmwEX/dlT7SrLgWjSVC51hcnkk8djtZa3G/EdwziDNh0jG1PrQr+M+KZj7484nwx1X7SRc73Xrr3At0TyaDs7HGPFMT98mcj/z6v2lsOMOKSIHEmc//AL9X7STsY8tho+RGYXDanAlriQZgoXLR5hsc3i/ih0H75M5j4/V+0sPFvFJII4kzjy+H1bfrIJ+FDA54iA4b7L0UTEhoJc7c3sl+Q3gd0OJ+JSKbTxFm2o7k46qf/kjm8S8RkPaOIM0JH88qSPlSGjTNHEMdfSIgjZF2ZU1vJ0TJPMLmzzu+1JjBbuJeJTZvEObiefw2r9pMKGf8SMw3a1M/zO9wDi6m39JJcPTYHFzi5zC8eaNaTUpjQDpBgdVPPky6h5hElHiPidzqlQZ9mpb/ACsZVho96Jw3EXELy4nPc1I8cZU+S6Gw4Y+i5zohxu1buZpe0MgNNweinebIfCDPu/xA+S3PczHT92VPrXj884jY6+e5qRe/wyp9agNEhwLDuJnr1UnZtloY2dXU7JPly/pphHg4i4jZH7+Zn7cZU+taYjO+JKrQaef5syLnTjatv1lpUYSO8IIEiVHTpluxIa7Y9U85sp72F4oCqcVcVYV0Oz7NXN6nG1PrU9HjPP6kRn+ZztBxdT617iMJ2lM6wJmyr+Y4Gph3mrSkcwAF0cfLOT1UMuPS2nijiBxEZ5mYn+eVPrTXhfiDPK3E2U06+dZhUpVMZRa+m/FPLXAvAIIJuqHl2Oa8Bjj3vFWjhJ2rinJRI/0+ht+m1H7sbqk1NPphYsWLtSYsWLFmYsWLFmYsWLFmYsWLFmYsWLFmYsWLFmYsWLFmYsWLFmYsWLFmYsWLFmYsWLFmYsWLFmYsWLFmfFNVs7EiOq0D4MEbeC3qPAmGzCGeZMiEpkjnahEx4rWwJhe2uY : 진피의 일시적 부종(팽진)과 발적, 개개 병터는 수시간(24시간 이내) 지속 후 흔적 없이 소실, 6주(교과서 6–8주) 이상이면 만성. 치료: 2세대 H1 항히스타민제 단독·규칙 복용이 일차 → 반응 없으면 증량(최대 4배)·복합 → 그래도 안 되면 omalizumab(항-IgE). 스테로이드는 잘 반응하지 않는 급성에 단기간만(만성에 규칙적 사용 X), 에피네프린은 급성 전신·후두부종 호흡곤란 때. 만성에서는 아스피린·NSAID, 더운 목욕, 과도한 운동, 술 등 악화요인을 피함. 혈액검사는 항히스타민제에 잘 반응하지 않는 만성에서 필요할 수 있음, 물리적 두드러기가 의심되면 유발검사.","exps":[],"ai":"","pick":0,"fl":{}},{"k":"derm-y-ten-px-2023","fam":"ten-px","area":"야마","prof":"박진","sec":"11/10 4교시 · 약물발진, 홍반 및 두드러기 (야마 · 수업 전)","meta":"근거: 학습지 「약물발진, 홍반 및 두드러기」 64–84쪽","year":"2023 객15","type":"객","rep":5,"repyears":"2025 객13 · 2022 객13 · 2019 객14 · 2018 객13","stem":"45세 여자가 1주 전 갑자기 고열이 있으면서 얼굴과 몸통에 붉은 반점이 생겼다. 점차 붉은 반점이 합쳐지고 물집이 생기더니 전신의 피부가 화상을 입은 것처럼 벗겨졌다(사진). 결막이 충혈되고 입점막은 헐어 있었다. 병력 상 2주 전 통풍을 처음 진단받아 약물 치료를 시작한 것 이외에 특이 기저질환은 없었다. 의심되는 질환의 예후와 경과에 대한 설명으로 옳은 것은?","choices":["노인보다 소아 환자에서 예후가 더 나쁘다.","피부의 침범면적이 넓을수록 예후가 나쁘다.","원인 약물에 반복 노출 시 더 경미하고 빠른 회복을 보인다.","피부와 달리 점막은 유착이나 흉터 없이 더 빨리 치유된다.","의심되는 약물 중단 시 대부분 1~2주 이내 후유증 없이 자연 소실된다."],"ans":[2],"imgs":["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAH6AZwDASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAwQBAgUABgf/xAA/EAACAgEEAQMCBQEECgAGAwABAgADEQQSITEFEyJBUWEGFDJxsoEVIzNCJCU1UlRkdJGhohY0RGKSsYKTwf/EABgBAAMBAQAAAAAAAAAAAAAAAAABAgME/8QAIBEBAQEBAAMBAQEBAQEAAAAAAAERAgMhMRJBE1EiYf/aAAwDAQACEQMRAD8A0/N8+b8h/wBTZ/IxCw5TEf8AOH/XWvx/xNn8jErB7PvJNFH6YYdcwVAyIbG7gfEYUHJwepVsk4PUuRxx8SrnPXxEAXiOo/WP3jz9RC//ABB9cxU4cOfTAPeIKv2n7Q7D+7U/OIAd4+JKh6++Y1WPjuLVKSORwJca+qlWz2JciOusGu1NOl/xsczE8r5M3uK6mwv2iXk9Y+r1GQCV+BHfF+Es1Li272p8AzSRjemfXortQ390u4HtsTc0fj6tGgL4NhH/AGmo1demq9OgDI+kz3c5IbuURe7dvOefpKKrE4HMKqG19qjJmlp9LXp0324zEZbS6AvhrOB95bW6ynRUla8Bsdymu8koG1DgTy+u1JvsOepFqpBb9Y2psLOcyUfnESQwq2DPEheHDfagJRiP2l6fJ6heGYmJNb9JADMZWljZTzLjhlBhl8lXb/iVj+kx6qT2Y5Rpy3QMcpWQ4VptP922CfiA1FWo067mU function exportText(base){var out=(base||Q).filter(function(q){var f=S.f[q.k]||{};return inWrong(q.k)||f.conf||memoOf(q.k)});
  return out.map(function(q,i){var a=S.a[q.k]||{},f=S.f[q.k]||{},tags=[];if(wasWrong(q.k))tags.push('틀림 '+a.w+'회'+(a.ok?' (마지막엔 맞힘)':''));if(f.conf)tags.push('헷갈림');
    return '=== '+(i+1)+'. '+q.sec+' ['+q.area+'] ('+q.prof+') ===\n'+(q.year?'기출: '+q.year+'\n':'')+(tags.length?'표시: '+tags.join(' / ')+'\n':'')+'문제: '+q.stem+(q.imgs&&q.imgs.length?' [사진 있음]':'')+'\n'+q.choices.map(function(c,j){return (j+1)+'. '+c}).join('\n')+
      '\n정답: '+(q.ans.join(',')||'-')+(memoOf(q.k)?'\n내 메모: '+memoOf(q.k):'')+(q.basis?'\n해설: '+q.basis:'')+(q.exps&&q.exps.length?'\n선지해설:\n'+q.exps.map(function(e,j){return (j+1)+'. '+e}).join('\n'):'')}).join('\n\n')}
function scopeName(){var p=[];if(F.prof)p.push(F.prof);if(F.sec)p.push(F.sec);if(F.area)p.push(F.area);if(F.type)p.push(F.type==='주'?'주관식':'객관식');if(F.rep)p.push('킹야 필터');if(F.st)p.push($('fSt').options[$('fSt').selectedIndex].text);if(F.chip){var c=document.querySelector('#chips .chip[data-v="'+F.chip+'"]');if(c)p.push(c.textContent.trim())}if(F.q)p.push('검색: '+F.q);return p.length?p.join(' · '):'전체(필터 없음)'}
$('bExpF').onclick=function(){var t=exportText(Q.filter(pass)),nm=scopeName();copyBox('내보내기 · '+nm,t?('[범위: '+nm+']\n\n'+t):'',t?(t.split('\n=== ').length+'문항 · 지금 걸어 둔 필터 안의 오답노트·헷갈림·메모만 모았어요.'):'이 범위에는 아직 틀리거나 헷갈림·메모를 남긴 문제가 없어요.')};
$('bExp').onclick=function(){var t=exportText();copyBox('오답·헷갈림·메모 내보내기(전체)',t||'아직 틀리거나 헷갈림·메모를 남긴 문제가 없어요.',(t?t.split('\n=== ').length:0)+'문항 · 복사해서 AI 대화창이나 메모장에 붙여넣으세요.')};
$('bBak').onclick=function(){copyBox('기록 백업',JSON.stringify({app:APP,at:new Date().toISOString(),s:S}),'이 글을 복사해 두면 나중에 “백업 불러오기”로 되살릴 수 있어요.')};
$('bRes').onclick=function(){sheet('<h2>백업 불러오기</h2><div class="msg" id="rmsg">“기록 백업”에서 복사한 글을 붙여넣고 불러오기를 누르세요. 지금 기록과 합쳐져요.</div><textarea id="rbox"></textarea><div class="tools"><button class="btn pri" id="rgo">불러오기</button><button class="btn" id="cls">닫기</button></div>');
  $('cls').onclick=closeSheet;$('rgo').onclick=function(){try{var o=JSON.parse($('rbox').value);merge(o.s||o);changed();refilter(true);$('rmsg').textContent='불러왔어요.'}catch(e){$('rmsg').textContent='백업 글 형식이 아니에요. 처음부터 끝까지 그대로 붙여넣었는지 확인해 주세요.'}}};

/* ---------- 저장·계정 동기화 ---------- */
// 계정에서 읽어 온 값은 고칠 수 없는(얼린) 객체라 그대로 넣으면 이후 빼기·헷갈림·풀이 기록이 조용히 무시됨 → 복사해서 넣는다
function merge(o){['a','f','m'].forEach(function(x){var src=(o&&o[x])||{};Object.keys(src).forEach(function(k){var v=src[k];if(!v)return;var c=S[x][k];if(!c||(v.t||0)>(c.t||0))S[x][k]=JSON.parse(JSON.stringify(v))})})}
var DB=null,UID=null,pt=null,dirty=false,busy=false,again=false,fails=0;
// 진단 기록: 최근 40개 동작을 st/<UID>~log 에 남겨 Claude가 읽을 수 있게(오답노트 빼기 문제 추적)
var DBG=[];function dlog(m){DBG.push(new Date().toISOString().slice(11,19)+' '+m);if(DBG.length>40)DBG.shift()}
function dflush(){if(!DB||!UID)return;DB.doc('st/'+UID+'~log').set({v:'11/05 15:05',ua:navigator.userAgent.slice(0,120),log:DBG.slice()}).catch(function(){})}
function changed(){lsSet(LK,S);dirty=true;clearTimeout(pt);pt=setTimeout(push,2500)}
// 메모는 문서 하나에 256KB까지라 4개 문서로 나눠 저장(memo/UID, memo/UID~1~3). 기록(st)은 한 문서.
var MB=4;function mdoc(i){return 'memo/'+UID+(i?'~'+i:'')}
function mbucket(k){var h=0;for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return h%MB}
function readAll(){var ps=[DB.doc('st/'+UID).get()];for(var i=0;i<MB;i++)ps.push(DB.doc(mdoc(i)).get());
  return Promise.all(ps).then(function(r){var s=r[0]&&r[0].exists?r[0].data():null,any=false;if(s)merge({a:s.a,f:s.f});
    for(var i=1;i<r.length;i++){var m=r[i]&&r[i].exists?r[i].data():null;if(m){any=true;merge({m:m.m})}}lsSet(LK,S);return {s:s,m:any}})}
function writeAll(){var ts=new Date().toISOString(),parts=[];for(var i=0;i<MB;i++)parts.push({});
  Object.keys(S.m).forEach(function(k){parts[mbucket(k)][k]=S.m[k]});
  // 같은 문서에 동시에 여러 번 쓰면 거절되므로 하나씩 차례로 쓴다
  var p=DB.doc('st/'+UID).set({a:S.a,f:S.f,updatedAt:ts});
  parts.forEach(function(m,i){p=p.then(function(){return DB.doc(mdoc(i)).set({m:m,updatedAt:ts})})});return p}
function push(){if(!DB||!UID||!dirty){dlog('push skip db='+!!DB+' uid='+!!UID+' dirty='+dirty);return}if(busy){again=true;dlog('push busy->again');return}busy=true;dirty=false;again=false;dlog('push start');
  // 다른 기기·다른 탭이 먼저 저장한 기록(더 최신 t)을 덮어쓰지 않도록 서버 것을 먼저 합친 뒤 저장
  readAll().catch(function(e){dlog('read fail '+(e&&e.code))}).then(writeAll).then(function(){fails=0;busy=false;dlog('push ok');dflush();$('sync').textContent='계정에 저장됨 · 모든 기기 연결';if(again||dirty){dirty=true;push()}},
    function(e){busy=false;dirty=true;fails++;dlog('push fail '+(e&&(e.code+' '+e.message)));$('sync').textContent='계정 저장 실패'+(e&&e.code?' ('+e.code+')':'')+' · 다시 시도 중';
      if(fails<6){clearTimeout(pt);pt=setTimeout(push,2000*fails)}})}
function pull(){if(!DB||!UID)return Promise.resolve();dlog('pull');$('sync').textContent='계정 기록 연결 중…';
  return readAll().then(function(r){refilter(true);$('sync').textContent='계정에 저장됨 · 모든 기기 연결';
    if(!r.s||!r.m||Object.keys(S.a).length){dirty=true;push()}},function(){$('sync').textContent='계정 연결 실패 · 이 기기에만 저장'})}
$('bSync').onclick=function(){if(DB)pull();else{S=lsGet(LK)||S;refilter(true)}};
window.addEventListener('pagehide',function(){lsSet(LK,S);push()});
if(window.claude&&window.claude.use){Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
  if(!r[0]||!r[1]){$('sync').textContent='이 기기에 저장됨';return}DB=r[0];return r[1].id().then(function(id){if(!id){$('sync').textContent='이 기기에 저장됨';DB=null;return}UID=id;return pull()})}).catch(function(){$('sync').textContent='이 기기에 저장됨'})}
else $('sync').textContent='이 기기에 저장됨';

syncCtl();refilter(true);
})();
