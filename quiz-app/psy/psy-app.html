탈야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 강의록 「조현병 2」 5쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병의 연성 신경학적 징후(soft neurological sign)가 아닌 것은?","choices":["편마비","위치지각(proprioception) 장애","SPEM 장애","입체감각인식불능(astereognosis)","피부글씨감각인식불능(agraphesthesia)"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 5쪽: astereognosis(손에 쥔 물건을 알아맞히지 못함), agraphesthesia(등·손에 쓴 글자 인식 장애), proprioception 장애, SPEM. 편마비는 국소 신경학적 징후로 연성 징후가 아니다.","exps":["정답.","연성 징후.","연성 징후.","연성 징후.","연성 징후."],"ai":"","fl":{}},{"k":"psy-sz2-11","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"📌티야방 · 근거: 강의록 「조현병 2」 6쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 조현병 진단 기준에 대한 설명으로 옳은 것은?","choices":["Schneider 1급 증상 하나면 충분하다","망상이 기괴하면 증상 1개만으로 진단한다","전체 지속 기간이 1개월 이상이면 된다","5개 영역 중 2개 이상이 한 달 중 상당 기간 있다","사회적·직업적 기능 저하는 필요 없다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤·정소윤): 지금은 2개 이상 필수, 1급 증상의 가치가 퇴색 (25Y)\n\n강의록 6쪽: 2개 이상이 한 달 중 상당 기간 + 사회적·직업적·대인관계 기능의 현저한 저하 + 위 두 가지가 6개월 이상. DSM-IV의 \"기괴한 망상이나 간섭·대화하는 환청이면 1개로 충분\" 조항은 DSM-5에서 없어져 1급 증상의 가치가 퇴색했다.","exps":["없어진 조항이다.","DSM-IV 조항으로 DSM-5에서 없어졌다.","6개월 이상이다.","정답.","기능 저하가 필요하다."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz2-12","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"📌티야방 · 근거: 강의록 「조현병 2」 6·10쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병 증상이 있으나 전체 기간이 3개월인 경우와 2주인 경우의 진단을 바르게 짝지은 것은?","choices":["단기 정신병적 장애 – 조현양상장애","조현병 – 조현양상장애","망상장애 – 조현병","조현정동장애 – 망상장애","조현양상장애 – 단기 정신병적 장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤): 단기 정신병적 장애는 1개월 이내 100% 회복\n\n강의록 6쪽: 1개월–6개월 schizophreniform, 1일–1개월 brief psychotic disorder. 단기 정신병적 장애는 한 달 안에 병전 기능 수준으로 완전히 회복된다.","exps":["반대다.","6개월이 안 된다.","해당 없다.","해당 없다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz2-13","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"📌티야방 · 근거: 강의록 「조현병 2」 7쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병 아형 중 가장 흔하고, 20–30대에 비교적 늦게 발병해 결혼·취업을 하는 경우가 많으며 예후가 비교적 좋은 것은?","choices":["잔류형","미분화형","와해형","긴장형","편집형"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤): 편집형이 가장 흔한 아형\n\n강의록 7쪽: 편집형 – 피해·과대망상 흔함, 와해 증상 적음, 늦게 발병해 퇴행 정도가 적고 예후 비교적 좋음, 긴장·의심·적대적. 교수님: DSM-5에서 아형은 없어졌지만 여전히 교과서에 소개된다. \"편집\"이라는 말은 환자에게 거부감이 적어 설명에 유용하다.","exps":["음성 증상 위주.","해당 없다.","어린 나이 발병, 예후 나쁨.","현재 아주 드묾.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz2-14","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 강의록 「조현병 2」 8쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"어린 나이에 발병해 사고가 심하게 와해되고 인지능력이 현저히 손상되며 예후가 가장 나쁜 아형은?","choices":["편집형","긴장형","와해형","미분화형","잔류형"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 8쪽: 와해형(파괴형, hebephrenic). 교수님: 정신과 질병은 일반적으로 어린 나이에 발병할수록 예후가 안 좋다.","exps":["예후가 비교적 좋다.","운동기능 장애가 두드러진다.","정답.","해당 없다.","음성 증상 위주."],"ai":"","fl":{}},{"k":"psy-sz2-15","area":"탈야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 강의록 「조현병 2」 9쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신병적 증상은 없거나 경하고 주로 음성 증상을 보이는 조현병 아형은?","choices":["미분화형","잔류형","편집형","긴장형","와해형"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 9쪽: 잔류형. 교수님: 만성화되며 양성 증상이 가라앉아 보이지만 속에 남아 있어 나빠지면 다시 나올 수 있다.","exps":["해당 없다.","정답.","해당 없다.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-sz2-16","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"📌티야방 · 근거: 강의록 「조현병 2」 10쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병 감별 진단에서 교수님이 \"핵심\"이라고 강조한 것은?","choices":["횡적 정신병리와 종적 경과를 함께 본다","오늘 하루의 횡적 증상만 정확히 본다","뇌 MRI 소견으로 최종 결정한다","가족력 유무로 최종 결정한다","약물 반응만으로 최종 결정한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤): 감별진단 핵심은 종적 평가\n\n오늘 하루만 보면 우울증에 정신병 증상이 겹친 것인지, 정신병에 우울이 동반된 것인지 구분이 안 된다. 한두 달 경과(종적)를 보면 구분할 수 있다.","exps":["정답.","그것만으로는 구분이 안 된다.","진단적이지 않다.","해당 없다.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz2-17","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 강의록 「조현병 2」 10쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신병적 증상을 동반한 기분장애와 조현병을 구분하는 포인트로 옳은 것은?","choices":["기분장애에는 정신병 증상이 절대 없다","조현병의 기분 증상은 짧고 전염성이 없다","발병 나이만 보면 구분된다","조현병의 기분 증상이 더 오래 지속된다","환청이 있는지만 보면 구분된다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 10쪽: 조현병에서의 기분 증상은 지속 기간이 짧거나 기분의 전염성이 없다. 기분장애에서 나오는 기분 증상은 더 길다. 그래서 종적 경과를 반드시 봐야 한다.","exps":["정신병 증상이 따라붙는 경우도 있다.","정답.","해당 없다.","반대다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-sz2-18","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"📌티야방 · 근거: 강의록 「조현병 2」 10쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"아내가 바람을 피운다고 확신하는 50세 남자가 배우자와 부딪힐 때만 문제가 되고 직장생활과 다른 대인관계는 문제없다. 와해 증상·음성 증상은 없고 환각도 없다. 가장 가능성 높은 진단은?","choices":["조현정동장애","편집성 인격장애","망상장애(의처증)","단기 정신병적 장애","편집형 조현병"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤): 망상장애는 망상 영역 외 기능이 잘 유지됨 – 염두에 두고 이해\n\n망상장애: 와해 증상·음성 증상이 없고 망상이 기괴하지 않으며 관련 환각이 있더라도 짧다. 교수님: 의처증(질투형)을 떠올리면 이해하기 쉽다. 망상장애 = paranoia = 편집증.","exps":["기분 증상이 함께 있어야 한다.","망상 수준의 확신은 인격장애로 설명되지 않는다.","정답.","한 달 안에 완전히 회복된다.","와해·음성 증상과 기능 저하가 있어야 한다."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz2-19","area":"탈야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 강의록 「조현병 2」 11쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병과 감별해야 할 인격장애로 강의록에 제시되지 않은 것은?","choices":["조현성(분열성) 인격장애","편집성 인격장애","의존성 인격장애","경계선 인격장애","조현형(분열형) 인격장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 11쪽: 분열성·분열형·편집성·경계선 인격장애. 그 밖에 이차적·물질에 의한 정신병적 장애, 전반적 발달장애, 꾀병과 허위성 장애.","exps":["제시됨.","제시됨.","정답.","제시됨.","제시됨."],"ai":"","fl":{}},{"k":"psy-y-scz-dx-2018","area":"야마","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2018 객14","type":"객","rep":6,"repyears":"2017 객14 · 2014 객16 · 2016 객14 · 2013 객5 · 2012 객6","stem":"26세 여성환자로, 오랜 취업준비 끝에 8개월 전 대기업 계약직으로 취직하였으나 익숙하지 않은 업무로 인해 상사에게 반복적으로 지적을 받아 큰 스트레스를 받았다. 평소 내성적인 성격으로 동료와 함께 어울려 회식자리를 참석하는 것에도 어려워하였고 업무를 제시간에 끝내지 못해 야근을 일상적으로 하였다. 내원 4개월 전부터 직장 동료들과 상사들이 자신을 얕잡아 보고 험담하는 것 같은 느낌을 받았다고 한다. 그러던 중 내월 2개월 전부터 혼잣말을 하는 모습이 계속 관찰되었고, 누구가 자신을 몰래 훔쳐보고 있다는 생각 때문에 샤워도 하지 못하였다. 회사 사람들 목소리로 자신을 해치겠다는 소리가 들린다며 출근도 하지 않고 불안해하는 모습이 점점 심해지자 보호자와 함께 정신과에 내원하였다. 이 환자에게 가장 합당한 정신과적 진단은?","choices":["조현병(Schizophrenia)","조현정동장애(Schizoaffective disorder)","조현양상장애(Schizophreniform disorder)","망상장애(Delusional disorder)","단기정신병적장애( Brief psychotic disorder)"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(임채원): 조현병·조현양상장애·단기정신병적장애는 기간으로 구분하는 문제가 계속 출제됨\n\n🎓 올해 수업 기준: 올해 수업(10/14 STT·강의록 6쪽): DSM-IV의 \"괴이한 망상이나 논평·대화 환청이면 1개로 충분\" 조항은 DSM-5에서 없어져 이제는 반드시 2개 이상이 있어야 한다(1급 증상의 가치가 퇴색). 학습지 해설에 인용된 DSM-IV 기준의 \"1개 증상만 있어도 된다\"는 지금은 적용하지 않는다. 기간 기준(6개월 이상 조현병 / 1–6개월 조현양상장애 / 1일–1개월 단기 정신병적 장애)은 그대로이고, 10/20 수업에서도 \"기간으로 구분하는 문제가 계속 나온다\"는 정리가 반복됐다.\n\n📚 학습지 해설: 답 ③. 조현병 진단기준 – A. 망상, 환각, 와해된 언어, 심하게 와해된/긴장증적 행동, 음성증상 중 2개 이상이 한 달 중 상당 기간 B. 직업·대인관계·자기관리 기능이 발병 전보다 현저히 저하 C. 최소 6개월 이상 D. 조현정동장애·기분장애·물질·신체 상태 배제 E. 자폐 병력이 있으면 망상·환각이 한 달 이상일 때만 추가 진단. 이 환자는 증상이 4개월 → 조현병의 전 단계인 조현양상장애(1–6개월), 6개월 이상이면 조현병. 참고로 조현정동장애는 기분증상 없이 망상·환각이 2주 이상 지속되어야 진단.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-dx-2017","area":"야마","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2017 객14","type":"객","rep":6,"repyears":"2018 객14 · 2014 객16 · 2016 객14 · 2013 객5 · 2012 객6","stem":"25세 남자가 4개월 전부터 잠을 자지 않고 횡설수설하며 혼자 웃거나 중얼거리는 일이 많아졌다. 2개월 전 가족에 의해 병원에 내원한 환자는 정신과 의사와의 면담에서 사람들이 자신을 감시하기 위해 도청장치가 설치되어 있고, 신문과 라디오를 hd해 자신의 생각이 보도된다고 하였다. 또한 이웃집 사람들이 자신을 흉보고 욕하는 소리가 들린다며 웃기도 하였다. 입원 후 약 1개월간 치료받고 증상이 사라진 후 퇴원하였다. 이 환자의 진단은?","choices":["망상장애","조현병","조현형 (정신분열장애) 장애","조현정동장애","단기정시병적장애"],"ans":[3],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2014 객16","선지·문제의 오타는 학습지 복원 원문 그대로."],"basis":"📌 티야방(임채원): 조현병·조현양상장애·단기정신병적장애는 기간으로 구분하는 문제가 계속 출제됨\n\n🎓 올해 수업 기준: 올해 수업(10/14 STT·강의록 6쪽): DSM-IV의 \"괴이한 망상이나 논평·대화 환청이면 1개로 충분\" 조항은 DSM-5에서 없어져 이제는 반드시 2개 이상이 있어야 한다(1급 증상의 가치가 퇴색). 학습지 해설에 인용된 DSM-IV 기준의 \"1개 증상만 있어도 된다\"는 지금은 적용하지 않는다. 기간 기준(6개월 이상 조현병 / 1–6개월 조현양상장애 / 1일–1개월 단기 정신병적 장애)은 그대로이고, 10/20 수업에서도 \"기간으로 구분하는 문제가 계속 나온다\"는 정리가 반복됐다.\n\n📚 학습지 해설: 답 ③. 꾸준히 출제되는 야마. 조현병 진단기준(A 특징적 증상 2개 이상 한 달 중 상당 기간, B 사회적·직업적 기능 저하, C 6개월 이상, D·E 배제). 다른 기준을 모두 충족하면서 기간이 1개월–6개월 미만이면 정신분열형(조현양상) 장애, 하루 이상–4주 미만이면 단기 정신병적 장애. 문제의 정보만으로 조현병 기준을 완벽히 판가름하긴 어렵지만(A는 충족), 문제가 묻는 것은 지속 기간에 따른 진단명 – 4개월이므로 조현양상장애. 망상장애는 아주 체계적이고 괴이하지 않은 망상과 그에 맞는 정동을 보이며 인격이 비교적 잘 유지되고, 와해·음성증상이 없으며 관련 환각이 있더라도 짧다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-dx-2016","area":"야마","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2016 객14","type":"객","rep":6,"repyears":"2018 객14 · 2017 객14 · 2014 객16 · 2013 객5 · 2012 객6","stem":"25세 남자가 4개월 전부터 잠을 자지 않고 횡설수설하여 내원하였다. 자신을 감시하기 위해 도청장치가 설치되어 있고 신문과 라디오를 통해 자신의 생각이 보도된다고 하여 2개월 전 가족들에 의해 내원하였다. 이웃집 사람들이 자신을 흉보고 욕하는 소리가 들린다며 킥킥 웃기도 하였다. 1개월 후 완치되어 퇴원하였다. 진단명은?","choices":["망상장애","정신분열병","정신분열형장애","분열정동장애","단기정신병적장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(임채원): 조현병·조현양상장애·단기정신병적장애는 기간으로 구분하는 문제가 계속 출제됨\n\n🎓 올해 수업 기준: 올해 수업(10/14 STT·강의록 6쪽): DSM-IV의 \"괴이한 망상이나 논평·대화 환청이면 1개로 충분\" 조항은 DSM-5에서 없어져 이제는 반드시 2개 이상이 있어야 한다(1급 증상의 가치가 퇴색). 학습지 해설에 인용된 DSM-IV 기준의 \"1개 증상만 있어도 된다\"는 지금은 적용하지 않는다. 기간 기준(6개월 이상 조현병 / 1–6개월 조현양상장애 / 1일–1개월 단기 정신병적 장애)은 그대로이고, 10/20 수업에서도 \"기간으로 구분하는 문제가 계속 나온다\"는 정리가 반복됐다.\n\n📚 학습지 해설: 답 ③. 복원이 정확히 일치하진 않지만 망상·환각·사고전파·부적절한 정동 같은 조현병 유사 증상이 있고 지속 기간이 1–6개월 → 정신분열형(조현양상) 장애. 조현병은 6개월 이상, 단기 정신병적 장애는 1개월 미만, 분열정동장애는 조현병 기준에 주요우울·조증·혼재성 삽화가 함께 있어야 한다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-dx-2013","area":"야마","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2013 객5","type":"객","rep":6,"repyears":"2018 객14 · 2017 객14 · 2014 객16 · 2016 객14 · 2012 객6","stem":"25세 남자가 4개월 전부터 잠을 자지 않고 횡설수설하며 혼자 웃거나 중얼거리는 일이 많아졌다. 2개월 전 가족에 의해 병원에 내원한 환자는 정신과 의사와의 면담에서 사람들이 자신을 감시하기 위해 도청장치가 설치되어 있고, 신문과 라디오를 통해 자신의 생각이 보도된다고 하였다. 또한 이웃집 사람들이 자신을 흉보고 욕하는 소리가 들린다면서 킥킥 웃기도 하였다. 입원 후 약 1개월 간 치료받고 증상이 사라진 후 퇴원하였다. 이 환자의 진단은?","choices":["망상장애","정신분열병","정신분열형장애","정신분열정동장애","단기정신병적 장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(임채원): 조현병·조현양상장애·단기정신병적장애는 기간으로 구분하는 문제가 계속 출제됨\n\n🎓 올해 수업 기준: 올해 수업(10/14 STT·강의록 6쪽): DSM-IV의 \"괴이한 망상이나 논평·대화 환청이면 1개로 충분\" 조항은 DSM-5에서 없어져 이제는 반드시 2개 이상이 있어야 한다(1급 증상의 가치가 퇴색). 학습지 해설에 인용된 DSM-IV 기준의 \"1개 증상만 있어도 된다\"는 지금은 적용하지 않는다. 기간 기준(6개월 이상 조현병 / 1–6개월 조현양상장애 / 1일–1개월 단기 정신병적 장애)은 그대로이고, 10/20 수업에서도 \"기간으로 구분하는 문제가 계속 나온다\"는 정리가 반복됐다.\n\n📚 학습지 해설: 답 ③. DSM-IV-TR 조현병 기준(A 2개 이상·한 달 중 상당 기간, B 기능 저하, C 6개월 이상, D·E 배제)을 적용하면, 다른 기준을 충족하면서 1개월–6개월 미만이면 정신분열형 장애, 하루–4주 미만이면 단기 정신병적 장애. 이 환자는 4개월 → 정신분열형 장애. 망상장애는 체계적이고 괴이하지 않은 망상, 인격이 비교적 유지되고 와해·음성증상이 없다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-dx-2012","area":"야마","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2012 객6","type":"객","rep":6,"repyears":"2018 객14 · 2017 객14 · 2014 객16 · 2016 객14 · 2013 객5","stem":"21세 여자환자가 약 2개월 전부터 혼자서 웃으면서 중얼거리기 시작하였으며, 무엇을 듣는 듯 귀를 기울이는 모습을 보였다. 검은 옷을 입은 사람이 자신을 해치려고 따라 다닌다며 두려워하였고, TV에서는 자신과 관계된 방송이 계속 나온다고 하여 정신건강의학과에서 입원 치료를 받고 증상은 완전히 호전되어 입원 1개월 만에 퇴원하였다. 환자의 진단은?","choices":["망상장애 (Delusional disorder)","조현병 (Schizophrenia)","정신분열형장애 (Schizophreniform disorder)","정신분열정동장애 (Schizoaffective disorder)","단기정신병적 장애 (Brief psychotic disorder)"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(임채원): 조현병·조현양상장애·단기정신병적장애는 기간으로 구분하는 문제가 계속 출제됨\n\n🎓 올해 수업 기준: 올해 수업(10/14 STT·강의록 6쪽): DSM-IV의 \"괴이한 망상이나 논평·대화 환청이면 1개로 충분\" 조항은 DSM-5에서 없어져 이제는 반드시 2개 이상이 있어야 한다(1급 증상의 가치가 퇴색). 학습지 해설에 인용된 DSM-IV 기준의 \"1개 증상만 있어도 된다\"는 지금은 적용하지 않는다. 기간 기준(6개월 이상 조현병 / 1–6개월 조현양상장애 / 1일–1개월 단기 정신병적 장애)은 그대로이고, 10/20 수업에서도 \"기간으로 구분하는 문제가 계속 나온다\"는 정리가 반복됐다.\n\n📚 학습지 해설: 답 ③. 환각(무엇을 듣는 듯 귀를 기울임, 검은 옷 입은 사람이 따라다님), 사고전파·관계망상(TV에서 자신과 관계된 방송), 증상 2개월 → 정신분열형 장애. ① 망상장애 – 실생활에 있을 법한 괴이하지 않은 망상, 환각은 거의 없음 ② 조현병 – 6개월 이상 ④ 정신분열정동장애 – 기분 삽화가 상당 부분 있어야 함 ⑤ 단기 정신병적 장애 – 1일–1개월. (강의록: 조현정동장애는 뚜렷한 기분증상 없이 망상·환각이 2주 이상, 정신분열형장애는 1–6개월·평생 유병률 0.2%·경과는 조현병과 비슷, 단기 정신병적 장애는 회복 후 병전 기능으로 완전히 돌아옴.)","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-del-ref-2015","area":"야마","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2015 객2","type":"객","rep":2,"repyears":"2014 객42","stem":"[아래 각 문항에 해당하는 가장 적절한 망상을 답가지(①~⑬)에서 하나씩 고르시오.] 20대 남성이 전철에서 옆자리에 앉아 있는 사람들이 서로 얘기하는 것을 자신을 비난한다고 생각한다.","choices":["피해망상","과대망상","관계망상","색정망상","빈곤망상","죄책망상","허무망상","조종망상","신체망상","부정망상","사고전파","사고주입","사고유출"],"ans":[3],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2014 객42"],"basis":"🎓 올해 수업 기준: 올해 수업(10/20 STT): 교수님은 관계사고를 \"모르는 사람이 떠들어도 신경 쓰이는 것 – 이유 없이 불특정 다수가 신경 쓰인다\"로 설명하며, 이렇게 체계·논리성이 없는 것이 조현병 쪽 망상·관계사고이고 아는 사람과의 갈등처럼 이유가 있는 것은 망상장애 쪽이라고 구분했다.\n\n📚 학습지 해설: 답 ③(2014 객42와 동일). 관계망상: 실제로 자신과 관계없는 일상 상황을 자신과 관련되어 있다고 잘못 믿는 것. 그 사람의 행동에 영향을 줄 정도면 관계망상, 그런 느낌만 들고 행동에 영향을 줄 정도가 아니면 관계사고. 자신에 대한 비난·간섭·교묘한 압력 등 피해망상의 양상을 띠는 경우가 흔하다. 예: 신문·TV가 자신과 관련된 이야기를 암시한다, 남들의 대화가 자신(대개는 자신을 흉보는 것)에 관한 것이라고 믿는 것.","exps":[],"ai":"","fl":{}},{"k":"psy-y-scz-del-guilt-2015","area":"야마","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2015 객3","type":"객","rep":2,"repyears":"2014 객43","stem":"[아래 각 문항에 해당하는 가장 적절한 망상을 답가지(①~⑬)에서 하나씩 고르시오.] 40대 남성이 경미한 사업 손실 후, 자신은 너무 큰 죄를 지어서 이 세상에서 살 가치가 없는 사람이라고 생각한다.","choices":["피해망상","과대망상","관계망상","색정망상","빈곤망상","죄책망상","허무망상","조종망상","신체망상","부정망상","사고전파","사고주입","사고유출"],"ans":[6],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2014 객43"],"basis":"📚 학습지 해설: 답 ⑥(2014 객43과 동일). 죄책망상: \"나는 이 세상에서 살 가치가 없는 사람\"이라는 식의 생각을 하는 망상(정상과 비정상 강의록 – 망상).","exps":[],"ai":"","fl":{}},{"k":"psy-y-scz-sx-2011","area":"야마","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2011 객14","type":"객","rep":1,"repyears":"","stem":"정신분열병의 증상에 대한 기술 중 가장 적절한 것은?","choices":["환각증상 중 환청이 가장 많은데, 기계잡음이나 음악소리가 가장 흔하다.","사고과장 장애는 정신분열병에서만 나타나는 특징적 증상이다.","병식결여와 지남력 장애, 기억력 장애는 정신분열병에서 흔한 증상이다.","음성증상 중 무의욕증(avolition)이란 취미활동, 친구관계, 성적활동 등에 흥미나 즐거움을 느끼지 못하는 것을 의미한다.","연상 이완(loosening of association)은 정신분열병에서 대표적인 사고과정 장애이다."],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤): 언어의 와해: 연상이완(말비빔·지리멸렬), 사고이탈·우원증, 음향연상\n\n🎓 올해 수업 기준: 올해 수업(10/14 STT): 환청은 전형적으로 사람 목소리(나쁜 내용). 교수님 – 무의욕증·무쾌감증은 심한 우울증에서도 나오므로 그것만으로는 조현병의 음성증상인지 알 수 없고, 정동둔마·무언증 등이 함께 있어야 음성증상으로 판단한다.\n\n📚 학습지 해설: 답 ⑤. ① 사람 목소리나 음악이 흔하다(교과서 421쪽)(X) ② 사고과정 장애는 우울증·조증에서도 나타난다(423쪽)(X) ③ 병식 결여는 흔하지만 지남력·기억력은 정신병적 증상·부주의의 영향이 없으면 대체로 정상(425쪽)(X) ④ 무쾌감증의 설명 – 무의욕증은 목표지향적 행동을 시작하고 완수하는 능력의 상실(X) ⑤ 연상 이완은 대표적인 사고과정 장애(O, 422쪽 와해된 언어).","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-type-2011","area":"야마","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2011 객16","type":"객","rep":1,"repyears":"","stem":"정신분열병에서 임상유형에 대한 기술로 맞는 것은?","choices":["편집형은 다른 아형에 비해 첫 발병 연령이 20-30대로 낮은 편으로 정상적인 사회생활을 하기 어려운 경우가 많다.","와해형은 상동증이나 매너리즘 등이 자주 나타나며, 흥분상태와 혼미상태의 양극단을 오가기도 한다.","미분화형은 모든 다른 아형의 진단 기준을 만족시키는 경우를 의미한다.","잔류형은 한때 정신분열병의 진단기준을 충족하지만 현재는 정신병적 증상 중 현저한 환각이나 망상 증상 중 한 가지만을 보이며 이에 환자가 영향을 받는 경우를 의미한다.","와해형은 혼자서 실실 웃고 부적절하게 킥킥거리거나 퇴행된 행동이 특징적으로 나타내며 주로 어린 나이에 발생한다."],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 올해 수업(10/14 STT·강의록 7–9쪽): 교수님 – DSM-5에서 아형은 없어졌지만 여전히 교과서에 소개된다. 정신과 질환은 일반적으로 어린 나이에 발병할수록 예후가 나쁘다(와해형). \"편집\"이라는 말은 환자·보호자 거부감이 적어 설명에 쓰기 좋다. 잔류형은 양성 증상이 가라앉아 보여도 속에 남아 있어 나빠지면 다시 나온다.\n\n📚 학습지 해설: 답 ⑤. ① 편집형 – 피해·과대망상이 흔하고 와해 증상은 적음, 20–30대로 약간 늦게 발병해 결혼·취업 등 정상 생활을 하는 경우가 많고 퇴행이 적어 예후가 비교적 좋음(X) ② 흥분과 혼미의 양극단은 긴장형(현재는 아주 드묾, 긴장성 혼미·흥분, 괴이한 자세, 함구증, 거부증)(X) ③ 미분화형은 다른 아형으로 정의하기 힘든 경우(X) ④ 잔류형은 정신병적 증상이 없거나 경하고 주로 음성증상(X) ⑤ 와해형(파괴형) – 어린 나이 발병, 심하게 와해된 사고, 인지 손상, 특별한 이유 없이 혼자 실실 웃고 킥킥거림, 어린아이 같은 퇴행, 얼굴 찡그리기, 거울을 뚫어져라 쳐다보기(O).","exps":[],"ai":"","fl":{}},{"k":"psy-y-scz-schneider-2011","area":"야마","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2011 객17","type":"객","rep":1,"repyears":"","stem":"다음은 한 환자의 증상에 대한 기술이다. 이 환자의 정신병리를 가장 잘 설명하는 용어는? \" 언제부턴가 외부의 자극에 매우 민감해져서 내 내면에 뭔가 고무튜브 같은 딱딱하며 플라스틱같이 휘어지는 것이 느껴졌다. 이 이상한 것이 내 행동과 사고를 방해한다. 내가 어떤 사고를 하고 행동을 취하려고 해도 이 이상한 것이 내가 원하는 방향으로 움직이는 것을 막고 외부의 이상한 자극을 받아들여서 내가 견딜 수 없게 만든다. 가령 내가 어떤 행동을 취하려고 해도 이상한 자극이 들어와서 내가 견딜 수 없게 된다. 경험상 예를 들어 친구들과 만나서 눈을 마주치고 인사를 하려고 해도 눈을 마주치면 이상한 자극이 들어와서 이상한 행동을 취하게끔 만든다.\"","choices":["관계망상 (delusion of reference)","사고탈취 (thought withdrawal)","망상적 지각 (delusional percption)","조종망상 (being controlled delusion)","사고전파 (thought broadcasting)"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 올해 수업(10/14 STT): 교수님 – 1급 증상들의 공통점은 자아 경계(ego boundary)가 깨진 경험이다. 내 몸동작·행동이 내 의지대로 되지 않고 외부의 무언가에 조종되는 느낌(somatic passivity·조종망상)이 대표적.\n\n📚 학습지 해설: 답 ④. ① 관계망상 – 자신과 관계없는 일상 상황을 자신과 관련됐다고 잘못 믿음 ② 사고탈취 – 다른 사람·외부의 힘이 생각을 빼앗아 감 ③ 망상적 지각 – 정상적으로 지각한 것에 지극히 개인적인 의미를 부여 ④ 조종망상 – 외부로부터 자신의 의지·감정·충동에 영향을 받거나 강요당한다는 망상, 자신의 생각·행동이 다른 사람에 의해 조종된다(정답) ⑤ 사고전파 – 생각이 방송되어 모두가 안다. 슈나이더 1급 증상(교과서 414쪽)과 사고 내용(98쪽) 참고.","exps":[],"ai":"","fl":{}},{"k":"psy-y-scz-hist-2011","area":"야마","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2011 객19","type":"객","rep":1,"repyears":"","stem":"DSM-IV에서 정신분열병 진단기준은 ( 가 )에서는 크레펠린의 견해를 강조하였고, ( 나 )에서는 슈나이더의 견해를 강조하였고, 블로일러의 핵심증상은 ( 다 )으로 재개념화한 것으로 현재 세계적으로 널리 사용되고 있다. ( ) 안에 들어갈 순서로 옳은 것은?","choices":["가: 경과 – 나: 증상 – 다: 음성증상","가: 원인 – 나: 치료 – 다: 양성증상","가: 증상 – 나: 경과 – 다: 음성증상","가: 치료 – 나: 원인 – 다: 양성증상","가: 경과 – 나: 원인 – 다: 음성증상"],"ans":[1],"imgs":[],"vis":[],"notes":["선지는 학습지의 가·나·다 표를 한 줄로 옮긴 것."],"basis":"🎓 올해 수업 기준: 올해 수업(10/14 STT): Kraepelin은 경과에 주목해(20대에 발병해 만성적으로 나빠짐) \"조발성 치매\", Bleuler는 경과보다 특징 증상(4A)을 강조하고 이름에 \"마음이 쪼개질 만큼 힘든 환자\"를 이해하려는 뜻을 담았으며, Schneider는 1급 증상을 제시했다.\n\n📚 학습지 해설: 답 ①. 미국 정신의학회는 크레펠린·블로일러·슈나이더의 견해를 모두 조합해 진단기준을 만들었다 – 경과에서는 크레펠린, 증상에서는 슈나이더가 중시한 특정 망상과 환각을 강조, 블로일러의 핵심증상은 음성증상으로 재개념화하여 그 중요성을 인정했다(교과서 413쪽).","exps":[],"ai":"","fl":{}},{"k":"psy-ax-fh","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 30쪽(형성평가) · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"🤍형성평가 45세 여자가 평소 걱정이 많아 자주 불면이 있었고 안절부절하다고 병원에 왔다. 최근에는 유행하는 독감에 걸려 죽을지 모른다는 생각이 들어 괴롭고, 집중력이 떨어지며 피곤하고, 근육 긴장과 두통이 자주 생긴다고 하였다. 진단은?","choices":["공황장애","강박장애","범불안장애","질병불안장애","신체증상장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"수업 중 교수님 풀이: 공황장애처럼 피크가 있는 것도 아니고, 강박 생각이 있는 것도 아니며, 특정 질환(암 등)만 걱정하는 질병불안장애나 신체 증상이 주가 되는 신체증상장애와 달리 매사에 불안한 범불안장애. 걱정·불면·안절부절·집중력 저하·피로·근육 긴장이 범불안장애 동반 증상(6개 중 3개 이상)에 해당한다.","exps":["몇 분 안에 최고조에 이르는 공황발작이 없다.","강박사고·강박행동이 없다.","정답.","특정 질병에 대한 집착이 아니라 매사에 대한 걱정이다.","설명되지 않는 신체 증상이 주가 아니다."],"ai":"","fl":{}},{"k":"psy-ax-01","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 6쪽 · 교과서 12장(불안장애) 310쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"불안과 공포에 대한 설명으로 옳은 것은?","choices":["공포는 대상이 모호하고 내부적으로 경험된다","불안은 대상이 모호하고, 공포는 대상이 분명하다","둘은 정신의학적으로 같은 개념이다","공포는 자율신경 반응을 동반하지 않는다","불안은 대상·상황이 알려진 외부적인 것이다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6쪽·교과서 310쪽: 불안은 대상이 모호하고 내부적으로 경험, 공포는 대상 혹은 상황이 알려진 외부적인 것(예: 모서리 공포증 – 모서리만 보면 무서움). 둘 다 빈맥·진전 등 자율신경 반응을 동반한다.","exps":["반대다.","정답.","구분되는 개념이다.","자율신경 반응을 동반한다.","반대다."],"ai":"","fl":{}},{"k":"psy-ax-02","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 6쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"정상 불안과 병적 불안의 차이로 옳지 않은 것은?","choices":["정상 불안은 적응적 기능을 한다","병적 불안은 실제 위험 상황이 아닌데도 생긴다","병적 불안은 시험 공부를 미리 하게 하는 등 도움이 된다","병적 불안은 지나치게 심하고 비적응적 대처로 상황을 악화시킨다","정상 불안은 위험 상황에 대한 정상 반응이다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"시험 전에 불안해서 공부를 미리 하는 것은 정상 불안의 적응적 기능이다. 병적 불안은 실제 위험이 아님에도, 지나치게 심하고, 비적응적 대처로 오히려 불안을 악화시킨다.","exps":["옳다.","옳다.","정답. 정상 불안의 예다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-ax-03","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 6쪽 · 교과서 12장(불안장애) 310쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"불안장애 환자에게 알코올 등 물질사용장애가 흔히 동반되는 이유로 강의에서 설명한 것은?","choices":["불안장애 진단 기준에 음주가 있어서","예민함을 낮추려는 자가처방으로 마셔서","불안과 알코올 의존의 유전자가 같아서","알코올이 세로토닌 재흡수를 억제해서","항불안제가 알코올 갈망을 일으켜서"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"술을 마시면 마음이 편해지고 차분해지므로 너무 예민한 상태를 낮추려고 술을 많이 마신다(자가처방). 불안장애는 다른 불안장애·우울장애와의 공존도 흔하다.","exps":["해당 없다.","정답.","해당 없다.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ax-04","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 이전의 불안장애에서 분리되어 다른 범주가 된 질환으로만 묶인 것은?","choices":["광장공포증, 공황장애","사회불안장애, 특정공포증","강박장애, 외상후 스트레스 장애","공황장애, 범불안장애","분리불안장애, 선택적 함구증"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"DSM-IV까지는 OCD와 PTSD도 불안장애였으나, 뇌 회로 등이 달라 DSM-5에서 강박 및 관련 장애, 외상 및 스트레스 관련 장애로 분리했다. 반대로 분리불안장애·선택적 함구증은 소아 장애에서 불안장애로 들어왔다.","exps":["둘 다 불안장애이며 DSM-5에서 서로 독립 진단이 되었다.","불안장애에 남아 있다.","정답.","불안장애 Big 3에 남아 있다.","불안장애로 들어왔다."],"ai":"","fl":{}},{"k":"psy-ax-05","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 불안장애의 \"Big 3\"라고 한 것은?","choices":["범불안장애 · 질병불안장애 · 신체증상장애","공황장애 · 강박장애 · PTSD","특정공포증 · 광장공포증 · 분리불안장애","공황장애 · 사회불안장애 · 범불안장애","선택적 함구증 · 분리불안장애 · 특정공포증"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"파란색으로 표시된 불안장애 Big 3: 공황장애, 사회불안장애, 범불안장애. 여기에 강박장애와 PTSD를 더해 \"Big 5\"라 하고, 이들 모두 1차 선택약은 SSRI다.","exps":["다른 범주가 섞였다.","OCD·PTSD는 다른 범주로 분리됐다.","Big 3가 아니다.","정답.","소아 관련 불안장애다."],"ai":"","fl":{}},{"k":"psy-ax-06","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 315쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"공황장애와 범불안장애를 구별하는 핵심으로 교수님이 강조한 것은?","choices":["공황은 수 분 안에 최고조, 범불안은 서서히 와서 오래 간다","공황은 6개월 이상 지속, 범불안은 수 분 안에 끝난다","공황은 여성에게만, 범불안은 남성에게만 생긴다","둘 다 수 분 안에 최고조에 이르렀다가 끝난다","범불안에는 신체 증상이 전혀 동반되지 않는다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"환자는 \"불안해 죽겠다\"고 섞어서 말하므로 최고조의 피크가 몇 분 있는지, 몇 시간씩 가는지 자세히 물어 구별해야 하고 치료도 그에 따라 달라진다. 교과서 315쪽: 공황발작은 수분 내 빠르게 증가해 대개 10여 분 짧게 지속, 범불안은 서서히 나타나 오래 지속.","exps":["정답.","반대다.","해당 없다.","범불안은 피크가 없다.","근육 긴장 등 신체 증상이 있다."],"ai":"","fl":{}},{"k":"psy-ax-07","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 13–14쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"공황발작의 DSM-5 기준으로 옳은 것은?","choices":["13개 증상 중 4개 이상이 수 분 이내에 최고조에 이른다","이명·두통 같은 문화 특이 증상도 4개에 포함된다","13개 증상 중 2개 이상이 1시간에 걸쳐 나타난다","반드시 예상 가능한 상황에서만 생긴다","13개 증상 중 6개 이상이 6개월 동안 나타난다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 13–14쪽: 극심한 공포와 고통이 갑작스럽게 발생해 수분 이내 최고조, 13개 중 4개 이상. 문화 특이적 증상(이명, 목의 따끔거림, 두통, 소리 지름·울음)은 4개에 포함되지 않는다. 교수님: DSM-5 이전에는 \"10분\"으로 규정했는데 \"수분\"으로 바꿨다. 증상을 다 외우기보다 교감신경 톤이 올라가는 증상이라고 이해하라.","exps":["정답.","포함되지 않는다.","해당 없다.","예상하지 못한 반복 발작이 공황장애 기준이다.","범불안장애 기준과 혼동이다."],"ai":"","fl":{}},{"k":"psy-ax-08","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 14쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"공황장애 진단 기준 B(발작 후 조건)로 옳은 것은?","choices":["발작 후 1주일 이상 지속되는 우울감","발작 후 1개월 이상 재발 걱정이나 부적응적 회피","발작 후 반드시 입원 치료가 필요함","발작 후 6개월 이상 지속되는 근육 긴장","발작이 사회적 상황에서만 생김"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 14쪽: 1회 이상 발작 이후 1개월 이상 ① 추가 발작이나 그 결과(통제력 상실, 심장발작, 미치는 것)에 대한 지속적 걱정 ② 발작과 관련된 현저한 부적응적 행동 변화 중 하나 이상.","exps":["해당 없다.","정답.","해당 없다.","범불안장애에 가깝다.","사회불안장애로 더 잘 설명된다."],"ai":"","fl":{}},{"k":"psy-ax-09","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 28쪽 · 교과서 12장(불안장애) 315쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"응급실에 공황발작 양상으로 온 환자를 볼 때 교수님이 당부한 것은?","choices":["벤조디아제핀을 주고 바로 귀가시킨다","정신분석 치료를 그 자리에서 시작한다","갑상선·저혈당·뇌질환 등 신체 질환을 먼저 확인한다","항정신병약물을 근육주사한다","공황장애이므로 감별 진단은 생략한다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"공황장애처럼 보여도 MRI·갑상선 호르몬 등으로 신체 질환을 먼저 확인해야 한다. 바로 벤조디아제핀만 주고 보냈다가 뇌종양이 있었던 사례가 있다. 카페인 과다 섭취도 감별 대상(교과서 표 12-2).","exps":["신체 질환을 놓칠 수 있다.","해당 없다.","정답.","해당 없다.","감별이 필요하다."],"ai":"","fl":{}},{"k":"psy-ax-10","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 9–10쪽 · 교과서 12장(불안장애) 310–311쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"벤조디아제핀(GABA 계열)과 SSRI(세로토닌 계열) 항불안 효과의 비교로 옳은 것은?","choices":["BZD는 빠르지만 의존 위험, SSRI는 늦지만 장기 사용에 적합","둘 다 효과 발현 속도와 의존 위험이 같다","SSRI는 즉각 효과가 나고 의존이 잘 생긴다","BZD는 효과가 늦고 의존성이 없다","SSRI는 공황장애 치료에 쓰지 않는다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"아미노산 신경전달물질(GABA) 계열은 빨리 효과가 나지만 빨리 떨어지고 오래 쓰면 의존된다. 세로토닌 제제는 효과가 1–2주 늦게 나오지만 장기간 쓰면 뇌를 근본적으로 안정시키고 남용·의존 가능성이 낮다.","exps":["정답.","다르다.","반대다.","반대다.","1차 선택약이다."],"ai":"","fl":{}},{"k":"psy-ax-11","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 310–311쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"응급실에 처음 온 공황장애 환자의 초기 약물치료 전략으로 교수님이 설명한 것은?","choices":["SSRI 단독으로 시작해 2주를 기다린다","BZD로 빨리 잡고 SSRI를 같이 시작해 SSRI로 유지한다","항정신병약물로 먼저 시작한다","약물 없이 정신분석 치료만 한다","벤조디아제핀만 장기간 계속 쓴다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"\"영리한 사람은 둘을 같이 쓴다\": 초기에는 GABA 제제로 빨리 좋아지게 하고, SSRI는 효과가 늦으니 함께 시작해 장기간(1–2년) 유지해 근본 치료, 벤조디아제핀은 의존성 때문에 줄여 간다(교과서 311쪽: 급성기에 BZD를 적절히 쓰는 것이 임상적으로 매우 중요).","exps":["급성기 증상 조절이 늦다.","정답.","1차가 아니다.","해당 없다.","의존이 생긴다."],"ai":"","fl":{}},{"k":"psy-ax-12","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 10쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"SSRI의 항불안·항우울 효과가 나타나는 데 1–2주가 걸리는 이유로 강의에서 설명한 것은?","choices":["GABA 수용체가 새로 anolol이나 BZD 복용","입원해서 집중적인 인지행동치료","SSRI를 1년 이상 매일 꾸준히 복용"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"수행형 단독(performance only, DSM-5)은 예측 가능하고 가끔 생기므로 발표 전 propranolol이나 BZD를 먼저 써 볼 수 있다. 줄 서 있거나 밥 먹을 때도 다 떨리는 일반적 형태는 SSRI를 쓴다(강의록 25쪽 알고리즘).","exps":["해당 없다.","해당 없다.","정답.","해당 없다.","일반적 형태에 쓴다."],"ai":"","fl":{}},{"k":"psy-ax-33","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 325쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"사회불안장애의 인지행동치료에 대한 교수님 설명으로 옳은 것은?","choices":["웅변학원처럼 큰 소리로 외치게 한다","원인을 찾을 때까지 발표를 금지한다","\"심하게 떨면서 해 보라\"는 식으로 교정·노출한다","약물 없이 충분한 휴식만 권한다","발표 상황을 평생 피하도록 권한다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"웅변학원식으로 하면 긴장이 더 유발된다. 의학적 CBT는 반대로 \"떨면서 해 보라\"는 식의 기법도 쓰며, 핵심은 인지적 재구성(남들이 내 얼굴이 몇 % 빨개졌는지 주시할 거라는 오류 교정)과 사회적 상황에 대한 노출.","exps":["불안이 더 심해진다고 했다.","해당 없다.","정답.","해당 없다.","회피는 악화시킨다."],"ai":"","fl":{}},{"k":"psy-ax-34","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 324쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"사회불안장애의 성별 역학에 대한 설명으로 옳은 것은?","choices":["유병률·치료받는 사람 모두 남성이 많다","유병률은 남성이 높고 병원은 여성이 더 많이 온다","유병률과 치료 모두 성별 차이가 없다","여성에게만 생기는 장애다","유병률은 여성이 높고 병원은 남성이 더 많이 온다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교과서 324쪽: 유병률은 여성이 높지만 병원을 찾는 환자는 남성이 많다. 남성에게 씩씩함을 요구하는 문화에서 그렇지 못하면 병으로 인식해 병원에 오는 것으로 해석.","exps":["아니다.","반대다.","차이가 있다.","아니다.","정답."],"ai":"","fl":{}},{"k":"psy-ax-35","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 323쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"우리나라의 사회불안장애 1년 유병률이 서양보다 매우 낮게(약 0.3%) 보고되는 이유로 교과서와 강의에서 설명한 것은?","choices":["유전적으로 저항성이 있어서","모두 공황장애로 진단되어서","겸손 문화와 대인공포증 같은 문화적 차이 때문에","한국인은 사회적 불안을 느끼지 않아서","국내에는 진단 도구가 전혀 없어서"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"교과서 323쪽: 서양은 자신의 불편에, 동양은 타인에게 불편을 주는 것에 초점. 대인공포증(taijin kyofusho)과 가해형(offensive type)은 서구 기준으로 포괄되지 않음. 교수님: 서양은 발표를 잘해야 하는 문화라 못하면 병으로 인 "생각을 비우는 것은 매우 어렵다. 더 쉬운 단계로 하나의 생각만으로 가득 채우는 것(땅콩·건포도 명상)부터 한다. 교과서 311쪽: 과거 후회나 미래 불안이 아닌 현재에 충실하도록 하는 마인드풀니스 인지치료·MBSR이 불안장애 치료에 쓰인다.","exps":["해당 없다.","쓴다.","비우는 것은 어렵다고 했다.","정답.","현재에 충실하게 한다."],"ai":"","fl":{}},{"k":"psy-y-anx-pd-tx-2025","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2025 객21","type":"객","rep":11,"repyears":"2023 객34 · 2022 객39 · 2021 객31 · 2018 객31 · 2020 객32 · 2017 객32 · 2016 객31 · 2015 객29 · 2014 객25 · 2011 객22","stem":"38세 여자가 갑자기 심장이 두근거리고 숨이 가쁘고 어지럽다며 응급실에 왔다. 3개월 전부터 매주 두 세 차례 비슷한 증상이 있어 ‘이러다가 죽는 것은 아닌가?’ 걱정하였다. 응급실에서 시행한 각종 검사에서 특이한 이상 소견은 없었으나 환자는 계속 불안해하고 초조해 하였다. 우선 시행할 치료는?","choices":["Lithium","Diazepam","Donepezil","Olanzapine","Sertraline"],"ans":[5],"imgs":[],"vis":[],"notes":["복원자: 실제 문제 마지막 문장은 \"재발 방지를 위해 지속적으로 쓸 약물\" 같은 설명이 더 있었던 것 같다고 함."],"basis":"🎓 올해 수업 기준: 교수님(10/14): 공황장애는 1차가 SSRI지만 효과가 1–2주 늦으므로 「영리한 사람은 둘을 같이 쓴다」 – 초기에는 벤조디아제핀으로 빨리 가라앉히고 SSRI를 함께 시작해 1–2년 유지, 벤조는 의존성 때문에 줄여 간다. 공황 환자는 몸 감각에 예민해 SSRI의 초기 자극 효과로 악화될 수 있으니 반 알 같은 저용량부터 서서히 올린다(강박·PTSD는 반대로 처음부터 충분히). 요즘은 「SSRI」가 아니라 약 이름(paroxetine·sertraline·escitalopram·fluoxetine·fluvoxamine·citalopram)으로 내니 이름을 외우라고 했다. 응급실에서는 MRI·갑상선 등 신체 질환 감별을 먼저.\n\n📚 학습지 해설: 공황장애 KY. 공황발작은 수분 이내(약 10분) 최고조, 13가지 중 4가지(심계항진·숨참·어지러움·죽을 것 같은 공포)를 만족하고, 응급실 검사로 내외과 질환을 배제했으므로 공황장애. 치료는 약물치료와 인지행동치료, 약물은 SSRI가 1차 선택제이며 빠른 효과를 위해 BZD를 단기간 SSRI와 병용하기도 한다. ① Lithium 기분안정제 ② Diazepam BZD ③ Donepezil AChE 억제제(알츠하이머) ④ Olanzapine 2세대 항정신병약물 ⑤ Sertraline SSRI. 문제 마지막 문장은 「지속적으로 재발 방지를 위해 사용할 약물」 같은 부연이 있었던 것 같다 – 1차 선택이자 장기간 쓸 수 있는 것은 SSRI인 sertraline. SSRI는 약물 이름으로 출제하신다고 하셨고 국시도 같은 추세이니 외울 것.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-pd-tx-2023","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2023 객34","type":"객","rep":11,"repyears":"2025 객21 · 2022 객39 · 2021 객31 · 2018 객31 · 2020 객32 · 2017 객32 · 2016 객31 · 2015 객29 · 2014 객25 · 2011 객22","stem":"38세 여자가 갑자기 심장이 두근거리고 숨이 가쁘고 어지럽다며 응급실에 왔다. 3개월 전부터 매주 두 세 차례 비슷한 증상이 있어 이러다가 죽는 것은 아닌가? 걱정하였다. 응급실에서 시행한 각종 검사에서 특이한 이상 소견은 없었으나 환자는 계속 불안해하고 초조해하였다. 우선 시행할 치료는?","choices":["sertaline, alprazolam 병합투여","sertaline, busiprone 병합투여","sertaline 단독투여","buspirone","zolpidem"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/14) 설명이 바로 이 선지: 초기에는 BZD로 빨리 좋아지게 하고 SSRI를 함께 시작(병합), BZD는 의존성 때문에 줄여 간다. SSRI 단독은 효과가 늦고, buspirone은 공황에 쓰기엔 약하다(범불안장애용).\n\n📚 학습지 해설: 「갑자기 심장이 두근거리고 숨이 가쁘고 어지럽다」로 공황장애. 공황장애는 세로토닌이 처음에 확 들어가면 더 놀라므로 저용량으로 시작해야 하고, 초기 exacerbation을 해결하려면 benzodiazepine이 중요하므로 alprazolam이 필요하다 → ① sertraline + alprazolam 병합.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-pd-tx-2022","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2022 객39","type":"객","rep":11,"repyears":"2025 객21 · 2023 객34 · 2021 객31 · 2018 객31 · 2020 객32 · 2017 객32 · 2016 객31 · 2015 객29 · 2014 객25 · 2011 객22","stem":"33세 여자가 “갑자기 심장이 두근거리고 숨이 막혀 죽을 것 같다”는 증상으로 응급실에 왔다. 2개월 전부터 매주 두 세 차례 비슷한 증상이 있어 ‘이러다가 죽는 것은 아닌가?’ 걱정하였고, 소주를 한두잔 마시면 증상이 완화되었다. 응급실에서 시행한 각종 검사에서 특이한 이상소견은 없었고 증상은 수분 내 소실되었다. 근본적인 약물 치료는?","choices":["buspirone","paroxetine","donepezil","olenzapine","acomprosate"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 공황장애 환자. 근본적인 약물 치료는 SSRI가 1차 선택 – 소량부터 시작해 점차 증량, 장기간 지속 치료. 인지행동치료도 효과적. SSRI: paroxetine, fluoxetine, fluvoxamine, sertraline, escitalopram.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-pd-tx-2021","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2021 객31","type":"객","rep":11,"repyears":"2025 객21 · 2023 객34 · 2022 객39 · 2018 객31 · 2020 객32 · 2017 객32 · 2016 객31 · 2015 객29 · 2014 객25 · 2011 객22","stem":"41세 여자가 “갑자기 심장이 두근거리고 숨이 막혀 죽을 것 같다” 는 증상으로 응급실에 왔다. 3개월 전부터 매주 두 세 차례 비슷한증상이 있어 ‘이러다가 죽는 것은 아닌가?’ 걱정하였고, 소주를 한두잔 마시면 증상이 완화되었기에 참고 견디었다. 응급실에서 시행한 각종검사에서 특이한 이상소견은 없었고 증상은 수분 내 소실되었다. 치료는?","choices":["lithium","diazepam","donepezil","olanzapine","paroxetine"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 공황장애 환자. 치료는 SSRI(paroxetine, fluoxetine, fluvoxamine, sertraline, escitalopram)가 1차 선택. 근본 치료는 SSRI로 소량부터 점차 증량해 장기간 지속하고, BZD는 급성기에 단기간 사용할 수 있다. 인지행동치료도 효과적.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-pd-tx-2018","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2018 객31","type":"객","rep":11,"repyears":"2025 객21 · 2023 객34 · 2022 객39 · 2021 객31 · 2020 객32 · 2017 객32 · 2016 객31 · 2015 객29 · 2014 객25 · 2011 객22","stem":"33세 남자가 “갑자기 심장이 두근거리고 숨이 막혀 죽을 것 같다”는 증상으로 응급실에 왔다. 2개월 전부터 매주 두 세 차례 비슷한 증상이 있어 ‘이러다가 죽는 것은 아닌가?’ 걱정하였고 소주를 한두잔 마시면 증상이 완화되었기에 참고 견디었다. 응급실에서 시행한 각종 검사에서 특이한 이상소견은 없었고 증상은 수분 내 소실되었다. 적절한 치료와 재발을 위한 방지는?","choices":["Lithium","Diazepam","Donepezil","Olanzapine","Ecsitalopram"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 갑작스러운 두근거림·질식감, 2개월 전부터 매주 반복, 「이러다 죽는 것 아닌가」(예기불안) → 공황장애. 약물치료는 SSRI가 1차, 인지행동치료는 interoceptive exposure. 교과서의 SSRI 종류(fluoxetine, fluvoxamine, paroxetine, sertraline, escitalopram) 암기가 티야. 공황발작 DSM-5: 13가지 중 4가지 이상이 갑자기 생겨 수분 이내 최고조 / 공황장애: 반복적·예기치 못한 발작 + 1개월 이상의 예기불안·행동 변화.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-pd-tx-2020","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2020 객32","type":"객","rep":11,"repyears":"2025 객21 · 2023 객34 · 2022 객39 · 2021 객31 · 2018 객31 · 2017 객32 · 2016 객31 · 2015 객29 · 2014 객25 · 2011 객22","stem":"33세 남자가 “갑자기 심장이 두근거리고 숨이 막혀 죽을 것 같다”는 증상으로 응급실에 왔다. 2개월 전부터 매주 두 세 차례 비슷한 증상이 있어 ‘이러다가 죽는 것은 아닌가?’ 걱정하였고 소주를 한두잔 마시면 증상이 완화되었기에 참고 견디었다. 응급실에서 시행한 각종 검사에서 특이한 이상소견은 없었고 증상은 수분 내 소실되었다. 옳은 것은?","choices":["주 4회의 정신 분석 치료를 즉시 시행한다.","알코올금단을 예방하기 위해 입원치료를 한다.","항정신병 약물을 주사하여 죽음에 대한 망상을 조절한다.","sertraline을 저용랑부터 처방해 점차 증량한다.","고용량 벤조디아제핀을 12개월 또는 18개월 장기 투약한다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/14): 공황장애는 1차가 SSRI지만 효과가 1–2주 늦으므로 「영리한 사람은 둘을 같이 쓴다」 – 초기에는 벤조디아제핀으로 빨리 가라앉히고 SSRI를 함께 시작해 1–2년 유지, 벤조는 의존성 때문에 줄여 간다. 공황 환자는 몸 감각에 예민해 SSRI의 초기 자극 효과로 악화될 수 있으니 반 알 같은 저용량부터 서서히 올린다(강박·PTSD는 반대로 처음부터 충분히). 요즘은 「SSRI」가 아니라 약 이름(paroxetine·sertraline·escitalopram·fluoxetine·fluvoxamine·citalopram)으로 내니 이름을 외우라고 했다. 응급실에서는 MRI·갑상선 등 신체 질환 감별을 먼저.\n\n📚 학습지 해설: 17년 객32와 거의 동일(보기 순서, SSRI→sertraline, 저용량→고용량 BZD만 바뀜). 공황장애는 SSRI를 기본으로 소량부터 증량해 장기간 사용, 효과까지 2–3주 걸리므로 급성기에 BZD를 단기간 사용(장기 X). 인지행동치료 병행 시 더 효과적. ① 정신분석이 아니라 약물·CBT ② 알코올 중독 상태가 아님 ③ 항정신병약이 아니라 항우울제 ④ 정답 ⑤ BZD는 단기간만. 공황장애는 예기불안과 회피가 특징이며 평생 유병률 약 5%, 광장공포증을 포함한 회피로 기능 장애가 심하다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-pd-tx-2017","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2017 객32","type":"객","rep":11,"repyears":"2025 객21 · 2023 객34 · 2022 객39 · 2021 객31 · 2018 객31 · 2020 객32 · 2016 객31 · 2015 객29 · 2014 객25 · 2011 객22","stem":"33세 남자가 “갑자기 심장이 두근거리고 숨이 막혀 죽을 것 같다”는 증상으로 응급실에 왔다. 2개월 전부터 매주 두 세 차례 비슷한 증상이 있어 ‘이러다가 죽는 것은 아닌가?’ 걱정하였고 소주를 한두잔 마시면 증상이 완화되었기에 참고 견디었다. 응급실에서 시행한 각종 검사에서 특이한 이상소견은 없었고 증상은 수분 내 소실되었다. 치료는?","choices":["알코올의존에 대해 입원치료를 한다.","주 4회의 정신분석치료를 즉각 시행한다.","죽음에 대한 망상에 대해 항정신병약물을 사용한다.","벤조다이아제핀(benzodiazepine)을 소량 장기간 사용한다.","SSRI를 저용량부터 처방하고 고용량으로 증량한다."],"ans":[5],"imgs":[],"vis":[],"notes":["학습지 해설 칸 번호는 \"객34\"로 적혀 있다."],"basis":"📚 학습지 해설: 교수님이 티야로 찍어 주신 문제. BZD는 부작용 때문에 오래 쓰면 안 되는 대표 약제로 공황장애에서는 단기용으로만 처방(티야). 불안장애 정리: 해마·편도·전대상피질 관여, 급성은 BZD·베타차단제, 유지는 SSRI·TCA·MAOI 같은 항우울제, 불안과 우울은 같은 뇌회로를 공유해 치료제가 같다, SSRI가 가장 좋지만 효과까지 약 2주, 초기에는 소량으로 시작해 점점 증량(수업 마지막날 티야) → ⑤.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-pd-tx-2016","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2016 객31","type":"객","rep":11,"repyears":"2025 객21 · 2023 객34 · 2022 객39 · 2021 객31 · 2018 객31 · 2020 객32 · 2017 객32 · 2015 객29 · 2014 객25 · 2011 객22","stem":"27세 여자가 “갑자기 숨이 막히고 죽을 것 같다”는 증상으로 응급실에 왔다. 환자는 삼 개월 전부터 일주일에 한 두 차례 갑자기 심장이 두근거리고 땀이 나면서 이러다가 죽는 것이 아닌가 하는 생각이 들어 몇 차례 병원을 방문하여 각종 검사를 받았으나 이상은 없었다. 이 질환에 대한 치료 방법으로 맞는 것은?","choices":["반드시 입원치료를 시행하여야 한다.","세로토닌과의 관련성이 높기 때문에 초기에 항정신병약물을 사용한다.","심각한 성격이상을 동반한 경우에는 인지행동치료를 시행한다.","초기에 벤조디아제핀(benzodiazepine)을 고용량 사용한다.","선택적 세로토닌 재흡수 억제제(SSRI)는 의존성을 예방하기 위해 가급적 저용량으로 1개월만 사용하고 끊어야한다."],"ans":[],"imgs":[],"vis":[],"notes":["⚠ 정답 확인 필요: 학습지 정답 칸이 \"③? ④?\".","학습지 정답 그대로는 채점하지 않고, 확인되면 반영할게요.","복원 불완전·확인 필요 문항이라 정답 자동 채점은 하지 않아요."],"basis":"🎓 올해 수업 기준: 올해 수업 기준으로는 ④ 「초기 BZD」 쪽에 가깝다 – 교수님은 급성기에 BZD를 함께 쓰는 것이 중요하다고 했다(다만 「고용량」은 강조하지 않음). 심한 성격 문제가 동반되면 CBT보다 통찰·정신분석적 치료 쪽이라는 것이 수업 설명이라 ③은 맞지 않아 보인다. 정답은 학습지 그대로 확인 필요로 둔다.\n\n📚 학습지 해설: 공황발작 DSM-5 기준과 교과서 약물치료 인용: SSRI가 우선 권장, 효과까지 2–3주라 초기엔 BZD 병용, 관해 후 BZD는 빨리 줄여 끊고, 재발 방지를 위해 8–12개월 유지 후 12–18개월에 중단 시도, 중단 시 50% 이상 재발. CBT는 약물과 병행 시 더 효과적, 70–80%가 초기 반응하나 장기적으로 약 50%에서만 완전 소실. ① X(반드시 입원 아님) ② X(항정신병약이 아니라 SSRI) ③ ?(심각한 성격이상에서 CBT가 가능할지 모르겠음) ④ ?(초기 고역가 BZD는 맞지만 「고용량」이 맞는지 모르겠음) ⑤ X. 1·2·5가 틀려 답은 ③ 또는 ④인데 정확한 단서를 찾지 못했다.","exps":[],"ai":"","fl":{"warn":1,"chk":1,"inc":1}},{"k":"psy-y-anx-pd-tx-2015","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2015 객29","type":"객","rep":11,"repyears":"2025 객21 · 2023 객34 · 2022 객39 · 2021 객31 · 2018 객31 · 2020 객32 · 2017 객32 · 2016 객31 · 2014 객25 · 2011 객22","stem":"28세 여자가 “갑자기 숨이 막히고 죽을 것 같다”는 증상으로 응급실에 왔다 환자는 2개월 전부터 일주일에 한 두 차례 갑자기 심장이 두근거리고 땀이 나면서 이러다가 죽는 것이 아닌가 하는 생각이 들어 몇 차례 병원을 방문하여 각종 검사를 받았으나 이상은 없었다. 이 질환에 대해 옳은 것은?","choices":["입원치료시 증상이 악화된다.","약물치료에 반응이 없을 때에 인지행동치료를 한다.","질환의 병태생리와 경과를 자세히 알려준다.","SSRI를 초기에 고용량 투여한다.","초기에 Benzodiazepine은 의존성이 높을 수 있으므로 피해야 한다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 공황장애 약물치료는 SSRI 우선, 2–3주 이상 걸려 초기엔 BZD 병용 – 관해되면 BZD는 빨리 줄여 끊는다(⑤ 틀림). CBT는 약물과 병행 시 더 효과적(② 틀림). 통합정신치료는 불안의 무의식적 의미·회피 상황·이차 이득을 깨닫도록 해 준다(③ 맞음). 입원 시 악화는 상식적으로 맞지 않고(①), SSRI는 점차 증량한다(④). 책에 확실한 문장이 있는 것은 아니다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-pd-tx-2014","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2014 객25","type":"객","rep":11,"repyears":"2025 객21 · 2023 객34 · 2022 객39 · 2021 객31 · 2018 객31 · 2020 객32 · 2017 객32 · 2016 객31 · 2015 객29 · 2011 객22","stem":"28세 여아가 “갑자기 숨이 막히고 죽을 것 같다”는 증상으로 응급실에 왔다. 환자는 2개월 전부터 일주일에 한 두 차례 갑자기 심장이 두근거리고 땀이 나면서 이러다가 죽는 것이 아닌가 하는 생각이 들어 몇 차례 병원을 방문하여 각종 검사를 받았으나 이상은 없었다. 이 질환에 대한 치료 방법으로 맞는 것은?","choices":["입원치료를 하면 이차이득으로 증상이 악화된다.","초기 벤조디아제핀(benzodiazepine)은 최소량 사용으로 점점 증량한다.","선택적 세로토닌 재흡수억제제(SSRI)를 사용하되, 저용량으로 시작한다.","대부분의 경우 항정신병약물과 정신분석을 처음부터 같이 시작하는 것이 가장 좋다.","초기에 benzodiazepine, SSRI, 인지행동치료를 동시에 시작하는 것은 약물 남용성이 높아 좋지 않다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 공황장애 치료: 약물치료·CBT·통찰정신치료. SSRI가 우선 권장(부작용이 적고 안전), 2–3주 이상 걸려 초기엔 BZD 병용, BZD는 장기 사용 시 내성·금단 → 관해되면 빨리 줄여 끊는다. paroxetine·sertraline·escitalopram 등을 저용량으로 시작 – 우울증 용량으로 쓰면 자극 효과로 오히려 불안·초조 유발 가능(수업 설명). ① X 공황장애는 이차이득이 없다 ② X BZD는 증량하지 않고 단기간 ③ O ④ X 항정신병약물을 쓰지 않는다 ⑤ X.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-pd-tx-2011","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2011 객22","type":"객","rep":11,"repyears":"2025 객21 · 2023 객34 · 2022 객39 · 2021 객31 · 2018 객31 · 2020 객32 · 2017 객32 · 2016 객31 · 2015 객29 · 2014 객25","stem":"33세 여자가 “갑자기 숨이 막히고 죽을것 같다”는 증상으로 응급실에 왔다. 환자는 3개월 전부터 일주일에 한 두 차례 갑자기 심장이 두근거리고 땀이 나면서 이러다 죽는 것이 아닌가 하는 생각이 들어 몇 차례 병원을 방문하여 각종 검사를 받았으나 이상은 없었다. 이 질환에 대한 치료 방법으로 맞는 것은?","choices":["반드시 입원치료를 시행하여야 한다.","벤조다이아제핀(Benzodiazepine)을 1년 이상 장기간 사용한다.","도파민과의 관련성이 가장 높기 때문에 항정신병약물을 사용한다.","선택적으로 세로토닌 재흡수억제제(SSRI)를 도입할 때는 고용량으로 시작해야 한다.","초기부터 benzodiazepine, SSRI, 인지치료를 동시에 시작하는 것이 좋다."],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 공황장애(정상근 교수님 ppt): 원인 – 카페인 등 공황유발물질, 젖산·CO2(false suffocation alarm), 편도·청반 등. 임상 – 10분 이내 정점, 20–30분 지속, 예기불안, 카페인·알코올로 악화. 치료 – CBT, 응용이완, 종이봉투 호흡훈련, 노출치료, 가족치료, 병식 중심 정신치료 / SSRI 저용량 시작, BZD 급성기에만, TCA. 예후 – 만성, 약 50% 우울증·20% 알코올의존 병발. ① 반드시 입원 X ② BZD 단기간 ③ GABA·NE 등이 관련 ④ SSRI는 저용량 시작 ⑤ 정답 – SSRI가 우선이지만 초기 증상은 BZD로 빠르게 잡고 CBT를 병행할 때 가장 효과적.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-pd-dx-2019","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2019 객31","type":"객","rep":3,"repyears":"2013 객31 · 2012 객27","stem":"44세 여성이 TV를 보다가 \"갑자기 심장이 두근거리고 숨이 안쉬어져 죽을 것 같다\"며 응급실에 내원하였다. 지난 2개월 동안 몇 차례 이러한 적이 있어 '이러다 정말 죽는 것은 아닐까' 라고 생각했지만 소주를 마시면 증상이 완화되었다고 한다. 환자의 성격은 내향적(?) 이었고 고속버스를 타거나 극장에 가는 등 닫힌 공간에 있을 때 무슨 일이 일어나는 것은 아닐까 두려워 혼자 있지 못하였다고 한다. 적절한 진단은?","choices":["공황장애, 광장공포증","범불안장애, 알코올의존","공황장애, 회피성성격장애","범불안장애, 의존성성격장애","사회불안장애, 신체증상장애"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/14): 광장공포증은 광장 자체가 아니라 혼자서 도움을 받지 못하는 상황(대중교통·극장 가운데 자리 등)을 두려워하는 것 – 공황이 오면 도움을 못 받을까 봐 피한다. DSM-5에서는 공황장애와 별개 진단(dual diagnosis)으로 둘 다 붙인다.\n\n📚 학습지 해설: 앞의 증상(갑작스러운 두근거림·호흡곤란·죽을 것 같음)은 공황장애, 뒤의 증상(고속버스·극장 등 닫힌 공간을 두려워해 혼자 있지 못함)은 광장공포증. 공황발작은 순식간에 악화돼 10–20분 지속되다 소실, 광장공포증·건강염려증·회피행동이 동반된다. 광장공포증이 있으면 탈출이 불가능하거나 도움을 청하기 어려운 장소를 두려워한다. 교수님이 수업 끝나고 10문제를 알려 주시며 「공황장애와 광장공포증 구분이 중요하고 두 개가 동시에 나타날 수 있다」고 강조.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-pd-dx-2013","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2013 객31","type":"객","rep":3,"repyears":"2019 객31 · 2012 객27","stem":"[31~32] 30대 중반의 남자가 회사 근무 도중 갑자기 가슴이 답답하고 현기증을 느끼며, 심장이 격렬하게 두근거리고 금방 죽을 것 같은 극심한 공포를 느꼈다. 동료들에 의해 회사 근처 병원 응급실로 내원하였다. 응급실에서 의사가 진찰을 하러 왔더니 증상이 거의 없었고 종합검사에서 특이소견이 없어서 귀가하였다. 이후 일주일에 두 번씩 15분간 이런 증상이 나타났고, 응급실에 재차 방문하여 검사받았으나 이상이 없었다. 결국 그는 부인과 함께 정신건강의학과 외래를 방문하였다. 상기 환자의 진단명으로 가장 적절한 것은?","choices":["범불안장애","공황장애","공포장애","전환장애","신체형장애"],"ans":[2],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2012 객27"],"basis":"📚 학습지 해설: 갑자기 가슴이 답답하고 현기증·두근거림·금방 죽을 것 같은 공포, 5–15분 지속, 응급실 검사 정상 → 공황장애. 공황장애는 다양한 신체 증상을 수반해 심근경색·히스테리·간질로 오인되기도 하며, 응급실에 와서 잠시 안정을 취하면 저절로 호전되는 경과를 밟는다. (2012 해설) 공황발작 DSM-IV-TR: 13가지 중 4가지 이상이 갑자기 생겨 10분 이내 최고조. 역학 – 평생유병률 미국 3.5%·한국 1.7%, 남:여 = 1:2–3, 20–30대.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-pd-food-2013","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2013 객32","type":"객","rep":1,"repyears":"","stem":"[31~32] 30대 중반의 남자가 회사 근무 도중 갑자기 가슴이 답답하고 현기증을 느끼며, 심장이 격렬하게 두근거리고 금방 죽을 것 같은 극심한 공포를 느꼈다. 동료들에 의해 회사 근처 병원 응급실로 내원하였다. 응급실에서 의사가 진찰을 하러 왔더니 증상이 거의 없었고 종합검사에서 특이소견이 없어서 귀가하였다. 이후 일주일에 두 번씩 15분간 이런 증상이 나타났고, 응급실에 재차 방문하여 검사받았으나 이상이 없었다. 결국 그는 부인과 함께 정신건강의학과 외래를 방문하였다. 이 남성이 제한해야 할 음식이 아닌 것은?","choices":["담배","홍차","커피","초콜렛","녹즙"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 공황장애를 악화시키는 식음료는 카페인 함유 식음료, 알코올, 담배. 카페인은 NE·5-HT·GABA 수용체에 작용하는 신경화학적 공황유발물질. 녹즙을 제외하면 모두 카페인(또는 니코틴)이 들어 있다 → ⑤ 녹즙.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-pd-bag-2012","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2012 객28","type":"객","rep":1,"repyears":"","stem":"[27~28] 30대 중반의 남자가 회사 근무 중 갑자기 가슴이 답답하고 현기증을 느끼며, 심장이 격렬하게 두근거리고 금방 죽을 것 같은 극심한 공포를 느꼈다. 동료들에 의해 회사 근처 병원 응급실로 내원하였다. 응급실에서 의사가 진찰을 하러 왔더니 증상이 거의 없었고 귀가하게 되었다. 이후 일주일에 두 번씩 5분내지 10분간 이런 증상이 나타났다. 결국 그는 부인과 함께 정신건강의학과 외래를 방문하였다. 상기 증례 환자가 상기 진단명에 의한 심한 호흡곤란을 느낄 때의 자가 응급 조치로서 가장 적절한 것은?","choices":["휴대용 산소 공급","휴대용 질소 공급","종이 봉지를 이용한 호흡법","빠른 속도의 흉식 호흡법","1분 지속 호흡 중지법"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 공황발작 시 과호흡으로 생긴 호흡성 알칼리증을 완화하기 위해 종이봉투 재호흡을 시켜 볼 수 있다(정상근 교수님 강의록 – 공황장애 정신치료: CBT, 응용이완기법, 호흡훈련(종이봉투), 노출치료, 가족치료, 병식 중심 정신치료) → ③.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-gad-2025","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2025 객22","type":"객","rep":5,"repyears":"2023 객36 · 2020 객33 · 2019 객32 · 2018 객32","stem":"42세 여자가 1년 전부터 유치원에 딸을 보낼 때마다 사고가 날 것 같다고 불안해하며 병원에 왔다. 매사에 지나치게 걱정이 많았고 집중력이 떨어지고 피곤하며 근육긴장이 자주 일어났다. 환자는 주야로 운전하는 일이 많아 잠이 오지 않았으면 좋겠다고 했다. 이 환자에게 적절한 치료는?","choices":["alprazolam","lorazepam","zolpidem","buspirone","lithium"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/14): 범불안장애는 「걱정도 팔자」 – 6가지(안절부절·피로·집중 곤란·짜증·근육 긴장·수면장애) 중 3가지, 6개월. 공황처럼 몇 분짜리 피크가 아니라 몇 시간씩 서서히 지속되는지로 구별. buspirone(azapirone, 5-HT1A 부분 작용제)은 공황·우울에 쓰기엔 약하지만 진정·의존이 없어 장기간 가는 범불안장애에 좋다 – azapirone 중 buspirone만 기억. 성격적 요인이 커서 통찰 정신치료도 꽤 한다.\n\n📚 학습지 해설: 일상 활동에 대한 과도한 걱정이 6개월 이상(1년)이고 안절부절·집중력 저하·피로·근육 긴장이 있어, 6가지 중 3가지 이상을 만족하는 범불안장애. 치료는 주로 SSRI이며, 우울·공황·강박 같은 공존질환이 없으면 azapirone계 buspirone을 쓸 수 있다. 킹야로 SSRI나 진단명을 물은 적도 있지만 대부분 buspirone을 묻는 문제였다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-gad-2023","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2023 객36","type":"객","rep":5,"repyears":"2025 객22 · 2020 객33 · 2019 객32 · 2018 객32","stem":"범불안환자의 장기치료 약물로 사용가능한 것은?","choices":["Alprazolam","Lorazepam","Zolpidem","Buspirone","Lithium"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/14): 범불안장애는 「걱정도 팔자」 – 6가지(안절부절·피로·집중 곤란·짜증·근육 긴장·수면장애) 중 3가지, 6개월. 공황처럼 몇 분짜리 피크가 아니라 몇 시간씩 서서히 지속되는지로 구별. buspirone(azapirone, 5-HT1A 부분 작용제)은 공황·우울에 쓰기엔 약하지만 진정·의존이 없어 장기간 가는 범불안장애에 좋다 – azapirone 중 buspirone만 기억. 성격적 요인이 커서 통찰 정신치료도 꽤 한다.\n\n📚 학습지 해설: 범불안장애에는 인지행동치료, BZD, SSRI, azapirone계 약물을 쓸 수 있다. alprazolam·lorazepam은 BZD라 범불안장애에 쓸 수는 있지만 부작용 때문에 장기치료로는 쓸 수 없다. zolpidem은 불면증 약. buspirone은 azapirone계로 장기 사용 가능(같은 계열: gepirone, tandospirone).","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-gad-2020","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2020 객33","type":"객","rep":5,"repyears":"2025 객22 · 2023 객36 · 2019 객32 · 2018 객32","stem":"45세 여자가 매사에 걱정이 많고 초조하다고 병원에 왔다. 특히 1년 전 새로 사업을 시작하면서 지나치게 불안하고, 집중력이 떨어지고 피곤하며, 근육 긴장이 자주 생긴다고 하였다. 장기간의 약물치료와 상담치료를 같이 받고 싶지만, 주야로 운전을 자주 하기 때문에 졸리는 것은 아주 싫다고 하였다. 처방할 약물은?","choices":["Buspirone","haloperidol","alprazolam","propranolol","carbamazepine"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 19·18년 기출 지문. 매사 걱정·초조, 1년 전부터 불안·집중력 저하·피로·근육 긴장 → 범불안장애. 치료는 정신치료(CBT, 지지, 통찰지향)와 약물치료(SSRI, SNRI, azapirone, BZD, pregabalin) – 이 중 졸리지 않는 약을 골라야 한다. 교과서 322쪽: azapirone계는 BZD에 비해 진정·정신운동장애·인지기능장애가 적고 남용·의존·금단 위험이 없다. 교수님이 수업시간에 azapirone 중 buspirone만 기억하면 된다고 강조, ppt 수업 때 이 문제를 설명하며 졸리지 않도록 buspirone을 처방해야 한다고 하셨다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-gad-2019","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2019 객32","type":"객","rep":5,"repyears":"2025 객22 · 2023 객36 · 2020 객33 · 2018 객32","stem":"60세 남자가 매사에 걱정이 많고 초조하다고 병원에 왔다. 특히 1년 전 새로 사업을 시작하면서 지나치게 불안하고, 집중력이 떨어지고 피곤하며, 근육 긴장이 자주 생긴다고 하였다. 장기간의 약물치료와 상담치료를 같이 받고 싶지만, 주야로 운전을 자주 하기 때문에 졸리는 것은 아주 싫다고 하였다. 처방할 약물은?","choices":["diazepam","alprazolam","propranolol","escitalopram","carbamazepine"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 올해 수업도 범불안장애 장기 약물로 SSRI와 buspirone을 함께 들었다 – 이 해는 선지에 buspirone이 없어 SSRI(escitalopram)가 답. BZD(diazepam·alprazolam)는 장기·운전 조건에서 제외.\n\n📚 학습지 해설: 범불안장애 DSM-5 진단기준(6개월 이상, 조절 어려움, 6가지 중 3가지 이상, 기능 손상, 물질·의학적 상태·다른 정신질환 배제) 인용. 걱정·피로·집중 곤란·근육 긴장으로 범불안장애. 약물치료는 BZD, TCA, buspirone, SSRI, SNRI 등 – 장기간 써야 하므로 BZD(diazepam·alprazolam) 제외, propranolol은 사회불안장애 단기용, carbamazepine은 항경련·항정신병 약물. 따라서 장기간 쓸 수 있는 SSRI인 escitalopram. 수업 마지막 티야: 범불안장애 치료제 SSRI 종류를 외우고 그중 하나 나오니 고르라고 하셨다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-gad-2018","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2018 객32","type":"객","rep":5,"repyears":"2025 객22 · 2023 객36 · 2020 객33 · 2019 객32","stem":"63세 여자가 출가한 딸이 부부 갈등으로 이혼당할 것 같다고 걱정하며 병원에 왔다. 딸이 결혼한 후부터 매사에 지나치게 걱정이 많았고 집중력이 떨어지고 피곤하며 근육 긴장이 자주 일어났다. 환자는 낮에 운전하는 일이 많아 잠이오지 않았으면 좋겠다고 했다. 이 환자에 대한 치료로 적절한 것은?","choices":["Zolpidem","Buspirone","Alprazolam","Propranolol","Escitalopram"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 범불안장애 – 치료 약물로 paroxetine, escitalopram, venlafaxine XR, duloxetine, BZD, buspirone(azapirone), pregabalin 등. buspirone은 5-HT1A 부분 작용제로 진정·인지기능장애·정신운동장애가 적고 남용·의존·금단 위험이 없다는 장점 → 낮에 운전하는 환자에게 ② buspirone.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-gad-dx-2022","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2022 객40","type":"객","rep":2,"repyears":"2021 객32","stem":"49세 여자가 잠이 잘 안오고 안절부절하다고 병원에 왔다. 코로나나 독감에 걸려 죽을까 걱정되고 불안해하고 근육 긴장과 두통을 자주 호소했다. 진단은?","choices":["강박장애","공황장애","범불안장애","질병불안장애","신체증상장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 올해 수업 형성평가(10/14)가 거의 같은 문제: 공황처럼 피크가 있지도, 강박 생각이 있지도 않고, 특정 질환만 걱정하는 질병불안장애나 신체 증상이 주가 되는 신체증상장애와 달리 매사에 불안 → 범불안장애.\n\n📚 학습지 해설: 하루종일 천천히 계속 불안함. 여러 신체 증상을 동반해 안절부절못하거나 긴장·초조하고 신경이 곤두서며 근육 긴장, 수면장애가 나타남. 여자에서 남자보다 많다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-gad-dx-2021","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2021 객32","type":"객","rep":2,"repyears":"2022 객40","stem":"36세 여자가 1년전부터 자신의 딸을 유치원에 보낼 때마다 사고가 날 것 같다고 불안해하며 병원에 왔다. 매사에 지나치게 걱정이 많았고 집중력이 떨어지고 피곤하며 근육 긴장이 자주 일어났다. 환자는 주야로 운전하는 일이 많아 잠이오지 않았으면 좋겠다고 했다. 이 환자에게 가장 합당한 진단은?","choices":["적응장애","정상불안","공황장애","범불안장애","사회불안장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 범불안장애 진단기준: A. 수많은 일상 활동에 대한 과도한 불안과 걱정이 최소 6개월 이상 B. 조절하기 어렵다 C. 6가지(안절부절·긴장, 쉽게 피로, 집중 곤란, 짜증, 근육 긴장, 수면장애) 중 3가지 이상. 환자는 1년 전부터 안절부절, 집중력 저하, 근육 긴장, 수면장애가 있어 범불안장애.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-sad-cbt-2025","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2025 객23","type":"객","rep":3,"repyears":"2021 객33 · 2018 객33","stem":"38세 남자가 여러 사람 앞에서 발표를 하면 목소리가 너무 떨리고 당황되어 얼굴이 붉어진다고 병원에 왔다. 어려서 엄한 부모 밑에서 자라 겁이 많았다고 하였다. 3개월 후에 취업을 위한 면접을 보아야 하는데 너무 떨어 엉망이 될까봐 벌써부터 걱정이 된다고 한다. 이번 구술시험을 위해 권고할 치료는?","choices":["정신분석","혐오요법","가족치료","인지행동치료","전이초점정신치료"],"ans":[4],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2021 객33"],"basis":"🎓 올해 수업 기준: 교수님(10/14): 수행형 단독(performance only)은 예측 가능하고 가끔 생기므로 발표 직전 propranolol이나 BZD를 먼저 쓰고, 줄 서거나 밥 먹을 때도 떨리는 일반형은 SSRI. CBT는 웅변학원식이 아니라 「떨면서 해 보라」, 남들이 내 얼굴이 몇 % 빨개졌는지 본다는 인지 오류를 고치고 노출시키는 것. 시간이 몇 달 있으면 CBT가 답.\n\n📚 학습지 해설: 사회불안장애: 당혹감을 줄 수 있는 특정한 사회적 상황·활동을 지속적으로 두려워해 피하거나, 피할 수 없으면 즉각 불안 반응. 낯선 사람에게 평가받는 상황에서 공포. 치료는 약물치료와 CBT – 약물은 SSRI가 1차, 수행형 단독이면 BZD를 처방할 수 있다. 선택지에 약물이 없고 면접까지 3개월이 남아 있으므로 인지행동치료.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-sad-cbt-2018","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2018 객33","type":"객","rep":3,"repyears":"2025 객23 · 2021 객33","stem":"25세 여성이 발표를 하려고만 하면 당황하고 얼굴이 붉어지고 말도 더듬는 증상 때문에 내원하였다. 어렸을 때 부터 엄한 가정에서 자라서 겁이 많았다. 3개월 후에 교생실습이 있는데 그전까지 해야하는 가장 적절한 치료는 무엇인가?","choices":["정신분석","혐오요법","가족치료","인지행동치료","전이초점정신치료"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 전형적인 사회불안장애 performance only type 증례(통째로 외워도 좋다). 가장 많이 하고 효과가 입증된 치료는 약물치료와 CBT. 수행형 단독이므로 약물은 propranolol·BZD(alprazolam, clonazepam)를 급성기나 수행 직전에 대증치료로 쓸 수 있고, 3개월이면 SSRI도 효과를 보기에 충분(12주)해 보기에 있었다면 답이 될 수 있다. 하지만 보기에 약물치료가 없으므로 인지행동치료(인지적 재구성과 사회적 상황 노출). (2021 해설) 즉시 효과가 필요하면 propranolol, 3개월 여유가 있으면 CBT – 교수님이 마지막 시간에 짚어 주신 문제.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-sad-fast-2023","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2023 객37","type":"객","rep":8,"repyears":"2022 객42 · 2020 객34 · 2019 객33 · 2017 객34 · 2016 객34 · 2015 객30 · 2014 객28","stem":"여러 사람 앞에서 발표할 때만 심하게 긴장하는 사회불안장애 환자가 발표 상황 직전에 증상 완화를 위해 복용할 수 있는 약물은?","choices":["Lithium","Sertraline","Propranolol","Paroxetine","Carbamazepine"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/14): 수행형 단독(performance only)은 예측 가능하고 가끔 생기므로 발표 직전 propranolol이나 BZD를 먼저 쓰고, 줄 서거나 밥 먹을 때도 떨리는 일반형은 SSRI. CBT는 웅변학원식이 아니라 「떨면서 해 보라」, 남들이 내 얼굴이 몇 % 빨개졌는지 본다는 인지 오류를 고치고 노출시키는 것. 시간이 몇 달 있으면 CBT가 답.\n\n📚 학습지 해설: 문제에서 사회불안장애라고 제시했고, 「여러 사람 앞에서 발표할 때만」으로 한정해 수행형 단독. 일반적으로 1차 치료제는 SSRI(최근 SNRI도)지만, 수행형 단독은 베타차단제 propranolol을 수행 상황 전에 미리 쓸 수 있다(교과서). 수행 직전 약물을 묻는 문제라 propranolol. BZD는 즉각적 항불안 작용이 있어 급성기 대증적으로 쓸 수 있으나 남용·의존·부작용·반감기를 고려해야 한다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-sad-fast-2022","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2022 객42","type":"객","rep":8,"repyears":"2023 객37 · 2020 객34 · 2019 객33 · 2017 객34 · 2016 객34 · 2015 객30 · 2014 객28","stem":"46세 남자가 직장에서 발표를 할 때마다 얼굴이 붉어지고 목소리가 떨린다고 왔다. 이틀 후 전체 부서원 앞에서 발표를 하도록 되어 있는데, 그날 가 심해 문제 해결에 오히려 장애. 중요한 시험을 앞두고 느끼는 정상 불안의 범주 → ①.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-child-tx-2013","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2013 객40","type":"객","rep":1,"repyears":"","stem":"다음은 아동의 정신장애와 일차적으로 사용되는 치료법을 짝지은 것이다. 옳은 것은?","choices":["주의력 결핍 과잉 행동장애 - 입원치료","공포장애 - 항정신약물","과잉불안장애 - 정신치료","의사소통장애 - 미술치료","소아 우울증 - 음악치료"],"ans":[3],"imgs":[],"vis":[],"notes":["박태원 교수님 문항(학습지 불안장애 단원에 수록)."],"basis":"🎓 올해 수업 기준: 양종철 교수님 수업 범위가 아닌 박태원 교수님 문항 – 올해 10/22 박태원 교수님 소아 불안 수업에서 다룬 내용(분리불안·선택적 함구증 등)과 같은 단원이다.\n\n📚 학습지 해설: 소아청소년 정신장애와 치료법. ① ADHD – 입원치료 X(핵심은 약물치료, 부모역할 훈련, CBT, 사회기술훈련) ② 공포장애 – 항정신병약물 X(행동치료: 체계적 탈감작, 홍수법, 모델링, 긍정적 강화 / 약물은 성인과 동일) ③ 과잉불안장애 – 정신치료 O(1차 치료, 가족치료·인지·집단·놀이치료, 약물은 항불안제) ④ 의사소통장애 – 미술치료를 1차로 쓰는 질환은 없다 ⑤ 소아 우울증 – 음악치료 X(입원, 가족·개인·인지치료, 사회기술훈련, 항우울제). 매년 보기와 답이 조금씩 바뀌며 출제된다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-child-sep-2013","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2013 객45","type":"객","rep":1,"repyears":"","stem":"분리불안장애의 주요증상으로 일치하지 않는 것은?","choices":["반복적 악몽","애착대상 수시로 확인","반복적 두통, 복통","반복적 전자렌지 확인","등교거부"],"ans":[4],"imgs":[],"vis":[],"notes":["박태원 교수님 문항(학습지 불안장애 단원에 수록)."],"basis":"🎓 올해 수업 기준: 박태원 교수님 문항 – 올해 10/22 소아 불안 수업 범위와 같은 내용이다.\n\n📚 학습지 해설: 분리불안장애: 애착대상에서의 분리불안이 일상생활을 위협할 정도로 심하고 지속적일 때. 남=여, 7–8세 호발, 하류층에 흔함. 원인 – 애착 장애, 부모의 불안(과잉보호), 공황장애·광장공포증 부모, 가족의 죽음·잦은 전학. 증상 – 학교 거부(학교가 무서운 게 아니라 애착대상과의 격리 불안), 악몽·어둠 공포, 복통·두통 등 신체 증상. ① O ② O ③ O ④ X 가스렌지 반복 확인은 강박증상 ⑤ O.","exps":[],"ai":"","fl":{}},{"k":"psy-y-anx-child-mut-2013","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 학습지 「불안장애」 166–188쪽","year":"2013 객47","type":"객","rep":1,"repyears":"","stem":"아래 열거된 질환 중에서 임상적으로 선택적 함구증과 관련이 높다고 알려진 것은 무엇인가?","choices":["사회공포증","광장공포증","범불안장애","주요우울장애","양극성장애"],"ans":[1],"imgs":[],"vis":[],"notes":["박태원 교수님 문항(학습지 불안장애 단원에 수록)."],"basis":"🎓 올해 수업 기준: 박태원 교수님 문항 – 양종철 교수님도 10/14에 DSM-5에서 선택적 함구증이 소아 장애에서 불안장애로 들 ":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 강의록 「1014 양종철pf」 35쪽 · 교과서 13장(강박 및 관련 장애) 343쪽 · STT 10/14 강박장애 강의(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"틱 관련(tic-related) 명시자가 붙는 강박장애의 특징으로 옳은 것은?","choices":["노년 여성에게 흔하고 예후가 좋다","SSRI 단독에 가장 잘 반응한다","저장장애와 같은 질환이다","병식이 항상 양호하다","일찍 발병하고 남자에 많으며 예후가 나쁘다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"틱 가족력이나 강박이 서로 공유될 때가 많고, 틱은 도파민과 관계되므로 도파민 관련성이 시사된다. 틱이 있으면 일찍 발병하고 예후가 안 좋다.","exps":["반대다.","도파민 관련이 시사되어 증강 요법을 쓴다.","해당 없다.","해당 없다.","정답."],"ai":"","fl":{}},{"k":"psy-oc-14","area":"티야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"📌티야방 · 근거: 강의록 「1014 양종철pf」 40쪽 · STT 10/14 강박장애 강의(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"강박장애의 SSRI 반응 특성에 대한 설명으로 옳지 않은 것은?","choices":["저용량으로 천천히 올려도 충분하다","더 높은 용량이 필요하다","세로토닌 선택성이 중요하다","부분 반응이 많다","반응이 늦게 나온다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): 강박장애는 우울증 치료보다 용량을 많이, 오래\n\n강의록 40쪽: serotonin selectivity, slower response, requirement of higher doses, partial responsiveness. 교수님: 공황장애는 저용량부터 서서히 올리지만, 강박장애는 처음부터 세게 써도 부작용이 잘 안 나오고 \"질겨서\" 많이 오래 써야 한다. 매년 물어보는 중요한 내용.","exps":["정답. 공황장애와 다르다.","옳다.","옳다.","옳다(절반은 잘 좋아지지 않음).","옳다."],"ai":"","fl":{"tyb":1}},{"k":"psy-oc-15","area":"티야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"📌티야방 · 근거: 교과서 13장(강박 및 관련 장애) 345쪽 · STT 10/14 강박장애 강의(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"SSRI에 충분히 반응하지 않는 강박장애에서 증강 요법으로 쓰는 약과 그 근거가 바르게 짝지어진 것은?","choices":["리튬 – 조증 예방","벤조디아제핀 – GABA 결핍","베타차단제 – 교감신경 억제","비정형 항정신병약물 – 도파민 관여","부스피론 – 5-HT1A 작용"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): 틱장애·망상 동반 시 도파민 차단제(risperidone, olanzapine 등)\n\n세로토닌 제제만으로 잘 좋아지지 않아 항정신병약물(도파민 차단)을 함께 써 보니 좋아졌고, 이를 근거로 강박장애에 도파민도 관여한다고 본다. SSRI 이전에는 clomipramine(삼환계, 부작용은 많지만 세다)을 썼다.","exps":["해당 없다.","장기간 권장되지 않는다.","해당 없다.","정답.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-oc-16","area":"티야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"📌티야방 · 근거: 강의록 「1014 양  내원하였다. 뽑는 행위를 중단하려해도 더 심해지며, 특히 혼자 있을 때 자제하기 어렵다고 한다. 환자에게 가장 알맞은 치료는?","choices":["홍수법","점진적 노출법","습관전도요법","자기주장훈련","상상노출훈련"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): 발모증·피부벗기기 장애 치료 = 습관전도요법(25Y), 강박장애보다 SSRI 효과는 별로\n\n📚 학습지 해설: 352쪽 발모장애의 치료(습관전도요법: 인식훈련·자극조절·경쟁반응훈련) 인용. 약물치료로는 SSRI, clomipramine, naltrexone, 비전형 항정신병약물, N-acetylcysteine 등이 유용. 발모장애·피부벗기기장애의 일차선택치료인 습관전도요법은 교수님이 강조하신 내용.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-ocd-hair-2016","area":"야마","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 학습지 「강박관련장애」 189–195쪽","year":"2016 객36","type":"객","rep":6,"repyears":"2025 객26 · 2021 객36 · 2023 객39 · 2020 객37 · 2018 객36","stem":"17세 여자가 불안하거나 스트레스를 받으면 자꾸 머리털을 뽑는다고 내원하였다. 끊으려고 하면 더 심해지고 혼자 있을 때 더 심해졌다. 진단과 치료는?","choices":["불안장애 - 홍수법","불안장애 - 습관전도요법","강박 관련 장애 - 홍수법","강박 관련 장애 - 습관전도요법","외상 후 스트레스 장애 – 홍수법"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): 발모증·피부벗기기 장애 치료 = 습관전도요법(25Y), 강박장애보다 SSRI 효과는 별로\n\n📚 학습지 해설: 발모장애(trichotillomania) – 반복적으로 털을 뽑는다. 치료는 습관전도요법(habit reversal therapy) – 털뽑기를 하려 하면 하지 않도록 다른 행동을 하라고 지시, 먼저 awareness를 하고 자극을 control한 뒤 competing 행동으로 대체. 강박 관련 장애 – 습관전도요법 → ④. 양종철 교수님 티야마.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-ocd-tx-2022","area":"야마","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 학습지 「강박관련장애」 189–195쪽","year":"2022 객44","type":"객","rep":2,"repyears":"2015 객32","stem":"29살 여자 1년전부터 손을 계속 씻고 더러운 것을 못 참는다고 호소했다. 더러운 것이 아니라는 걸 아는데 계속 그렇게 되고 이러한 증상때문에 미쳐 죽어버릴듯 한 생각이 들어 내원했다. 치료는 무엇인가?","choices":["즉시입원","즉시 주4회 정신분석치료","항정신병약물로 죽음에 대한 망상 조절","Sertraline 충분한 용량으로 오랫동안 장기복용","Benzodiazepine 고용량으로 12-18개월 복용"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): SSRI 약 이름까지 외우기, 강박장애는 우울증보다 용량을 많이·오래\n\n🎓 올해 수업 기준: 올해 수업 형성평가(10/14)도 같은 유형: 오염–세척형 강박장애, 답은 sertraline. 교수님: 강박장애는 「질겨서」 처음부터 세게, 우울증보다 많은 용량으로 오래 써야 하고 부작용은 잘 안 나온다 – 그래서 SSRI 이름을 알아야 한다(공황장애는 반대로 저용량부터).\n\n📚 학습지 해설: 강박사고를 무시하거나 억제하려 해도 계속하고 현저한 고통을 호소하는 강박장애. 오염 공포로 세척행동을 반복하는 증상이 가장 흔하고 평생 유병률 2–3%. 치료는 약물치료(1차 SSRI나 clomipramine, 2차 비정형 항정신병약물)와 인지행동치료(SSRI + ERP). 강박장애에서는 SSRI를 충분한 용량으로 쓰는 것이 중요 – 로컬에서 안 낫던 환자도 SSRI 양만 늘려도 좋아지는 경우가 많다고 하셨다. → sertraline 충분한 용량으로 장기간. SSRI: sertraline, paroxetine, fluvoxamine, fluoxetine, escitalopram, citalopram.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-ocd-tx-2015","area":"야마","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 학습지 「강박관련장애」 189–195쪽","year":"2015 객32","type":"객","rep":2,"repyears":"2022 객44","stem":"32세 남자가 더러운 이 손에 묻었다며 계속 반복해서 손을 씻고 오염된 것이 묻을까봐 병적으로 걱정하는 증상의 진단명과 관련부위, 약물의 조합으로 옳은 것은?","choices":["범불안장애 - amygdala - benzodiazepine","범불안장애 - amygdala -","강박장애 - amygdala - risperidone","강박장애 - orbitofrontal cortex - SSRI","특정공포증 - thalamus – olanzapine"],"ans":[4],"imgs":[],"vis":[],"notes":["② 선지 끝부분은 학습지에서도 비어 있다(원문 그대로)."],"basis":"📚 학습지 해설: 강박장애 임상양상: 오염 강박사고 → 반복 세척·회피 / 의심 강박사고 → 확인 / 강박사고만 있는 경우(성적·공격적) / 대칭·정확성. 신경해부학: 선조체·변연계·안와전두엽을 잇는 전두엽–선조체–시상–전두엽 고리 이상. 치료: SSRI가 1차 선택 → ④ 강박장애 – orbitofrontal cortex – SSRI.","exps":[],"ai":"","fl":{}},{"k":"psy-y-ocd-tic-2014","area":"야마","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 학습지 「강박관련장애」 189–195쪽","year":"2014 객27","type":"객","rep":1,"repyears":"","stem":"강박장애는 뚜렛장애, Sydenham's Chorea 등과의 병태생리학적 관련성이 크다고 밝혀져 있다. 이에 근거하여 강박장애 치료제로 사용되고 있는 약물은?","choices":["SSRI","Lithium","Risperidone","Clomipramine","Benzodiazepine"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): 틱장애나 망상이 동반되면 도파민 차단제 – risperidone, olanzapine(과거 pimozide, haloperidol)\n\n🎓 올해 수업 기준: 교수님(10/14): SSRI만으로 잘 좋아지지 않아 항정신병약물(도파민 차단)을 함께 써 보니 좋아졌고, 틱 관련 강박장애는 도파민 관련성이 시사된다 – 틱이 있으면 일찍 발병하고 예후가 나쁘다.\n\n📚 학습지 해설: Sydenham's chorea: 사지·안면·체간의 급속하고 불규칙한 불수의 운동(추체외로계 질환). 교과서: 틱장애나 망상이 동반된 강박장애는 SSRI에 도파민 수용체 차단제인 항정신병약물을 추가해 효과를 볼 수 있다 – 과거 pimozide·haloperidol, 최근 risperidone·olanzapine. 틱장애와의 연관성으로 도파민 차단제를 함께 쓰기 시작했으므로 답은 risperidone.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-ocd-bdd-2019","area":"야마","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 학습지 「강박관련장애」 189–195쪽","year":"2019 객34","type":"객","rep":1,"repyears":"","stem":"28세 남자가 코가 삐뚤어져 놀림을 받고 있다며 내원하였다. 거울을 자주 보는데 짜증이 나고 요즘에는 직장도 나가기 싫어졌다고 한다. 1차 치료약제는?","choices":["paroxetine","topiramate","haloperidole","olanzapine","naltrexone"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/14): 신체이형장애는 DSM-IV의 신체형장애에서 강박 관련 장애로 「데려온」 것, 질병불안장애(암에 걸렸다고 걱정)와 감별, 치료는 SSRI. 근육이형증 명시자(근육이 부족하다는 집착, 주로 남자)도 있다.\n\n📚 학습지 해설: 교수님이 수업시간에 들어 주신 예시(코가 정상이라도 완전 대칭일 수 없는데 「교수님, 제 코 너무 비뚤어지지 않았나요?」 하며 계속 확인받으려는 사람). 신체이형장애는 주로 피부·머리·코에 대한 병적 집착으로 강박장애 범주에 속하고 SSRI에 잘 반응 → paroxetine. ② topiramate: 신경성 폭식증의 편법 치료제(식욕이 뚝 떨어짐) ③ haloperidol 1세대 항정신병약물 ④ olanzapine 비정형, 체중 증가 부작용으로 신경성 식욕부진증에 쓰기도 ⑤ naltrexone 아편 길항제(항갈망제). 올해는 수업 마지막에 티야 10개를 주셨고 그 범위에서 모두 출제.","exps":[],"ai":"","fl":{}},{"k":"psy-y-ocd-dsm-2013","area":"야마","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 학습지 「강박관련장애」 189–195쪽","year":"2013 객28","type":"객","rep":1,"repyears":"","stem":"DSM-Ⅴ에서 강박장애에 속하지 않는 것은?","choices":["축적장애","신체이형장애","발모광","피부뜯기장애","뮌하우젠 증후군"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): 강박관련장애 5가지(강박·신체이형·저장·발모·피부벗기기)가 묶인 이유를 잘 알아 두라고 함(TY)\n\n📚 학습지 해설: DSM-5 강박 및 관련 장애: OCD, 신체이형장애, 저장장애, 발모광, 피부뜯기장애, 물질·약물 유발성, 다른 의학적 상태로 인한, 달리 명시된/명시되지 않는 강박 및 관련 장애. 뮌하우젠 증후군은 실제로 앓는 병이 없는데 아프다고 거짓말하거나 자해해 관심을 끄는 질환(인위성장애) → ⑤.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-ocd-rel-2011","area":"야마","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 학습지 「강박관련장애」 189–195쪽","year":"2011 객24","type":"객","rep":1,"repyears":"","stem":"발모광, 뚜렛장애, 신체이형 장애 등과 병태생리학적으로 가장 관련이 많은 것은?","choices":["공황장애","범불안장애","사회불안장애","외상후 스트레스장애","강박장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 발모광 – 털을 뽑으려는 충동을 억제하지 못함, 스트레스 관련, 세로토닌 체계 이상, 털 뽑는 행동에서 큰 쾌감을 얻지 않는 경우가 많아 일종의 강박행동으로 본다. 뚜렛장애 – 약 40%에서 강박장애 공존. 신체이형장애 – 강박증·기분장애 가족력, 세로토닌 관련, 강박장애의 한 변형일 수 있다 → ⑤ 강박장애.","exps":[],"ai":"","fl":{}},{"k":"psy-y-ocd-child-2013","area":"야마","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 학습지 「강박관련장애」 189–195쪽","year":"2013 객37","type":"객","rep":1,"repyears":"","stem":"다음의 증례를 읽고 답가지(1-10) 중에서 지시하는 수만큼 고르시오. 초등학교 4학년 남아가 ‘음, 음’소리를 반복해서 내고 눈을 찡긋거리고 코를 씰룩거리는 증상으로 내원했다. 또한, 아이는 손을 반복적으로 씻거나 정리된 장난감을 누가 만지거나 하면 굉장히 화를 낸다고 한다. 적절한 진단은? (두 가지)","choices":["ADHD","의사소통장애 (언어발달장애)","읽기장애","틱 장애","지적장애","적대적 반항장애","행실장애","분리불안장애","강박불안장애","아스퍼거장애"],"ans":[4,9],"imgs":[],"vis":[],"notes":["박태원 교수님 문항(학습지 강박관련장애 단원에 수록). 두 개를 고르는 문제라 앱에서는 ④·⑨ 중 하나를 고르면 정답 처리."],"basis":"🎓 올해 수업 기준: 박태원 교수님 문항 – 올해 10/22 틱장애 수업과 같은 내용(틱 + 강박 동반).\n\n📚 학습지 해설: 틱: 갑자기 반복적으로 몸짓이나 소리를 내는 현상, 비수의적·리듬 없음·목적 없음, 야단쳐도 고쳐지지 않고 잠시 참을 수는 있지만 곧 늘어남. 뚜렛병: 다발성 운동틱 + 1개 이상 음성틱, 1년 이상, 18세 이전. 강박장애에서 가장 흔한 증상은 오염 강박사고(반복 손 씻기), 의심(확인), 대칭·정확성. 「음음」 음성틱 + 눈 찡긋·코 씰룩 다발성 운동틱이나 기간 언급이 없고 보기에 뚜렛이 없어 ④ 틱장애, 반복적 손 씻기와 정리정돈 강박으로 ⑨ 강박불안장애 동반.","exps":[],"ai":"","fl":{}},{"k":"psy-sz3-01","area":"티야","prof":"정영철","sec":"10/19 · 조현병 3 (치료·항정신병약물)","meta":"근거: 강의록 「조현병 3(항정신병약물)」 2쪽 · STT 10/19 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병 치료의 일반 원칙 중 \"의사-환자 신뢰 관계\"가 이 환자군에서 특히 중요하다고 교수님이 설명한 이유는?","choices":["보호자가 치료를 전적으로 결정하게 되어 있어서","약물 부작용이 거의 없어 설명할 게 적어서","신뢰 관계가 진단 기준에 포함되어 있어서","환자가 대개 의학 지식이 많아 의사를 평가하려 해서","정신병적 상태의 핵심 감정이 공포와 불신이어서"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님 비유: 혼자 남겨진 세 살 아이처럼 무섭고, 지켜 줄 줄 알았던 엄마도 믿지 못하는 마음. 정신병 환자의 마음은 공포와 불신이라 신뢰 관계가 특별한 의미를 가지며, 같은 이유로 치료 순응도도 다른 질환보다 떨어지기 쉽다.","exps":["해당 없다.","부작용은 많다.","진단 기준이 아니다.","해당 없다.","정답."],"ai":"","fl":{}},{"k":"psy-sz3-02","area":"티야","prof":"정영철","sec":"10/19 · 조현병 3 (치료·항정신병약물)","meta":"근거: 강의록 「조현병 3(항정신병약물)」 2쪽 · STT 10/19 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병의 조기 중재에서 \"결정적 시기(critical period)\"로 보는 기간은?","choices":["발병 후 첫 1개월","발병 이후 첫 5년","발병 전 전구기 1년","발병 후 첫 6개월","발병 10년 이후"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 2쪽: 발병 이후 첫 3–5년에 기능 변화가 크다 → 첫 5년 이내를 결정적 시기로 보고 초기에 집중적인 치료. 교수님: 이 5년 안에 회복할 사람, 약은 못 끊어도 생활할 사람, 평생 기능이 떨어질 사람의 패턴이 다 보인다.","exps":["해당 프로락틴 증가에 의한 약 부작용이며 용량을 줄이면 대개 회복된다","유방암을 먼저 배제하러 산부인과에 보내야 한다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 25쪽: 프로락틴 증가 → 유루증, 월경장애, 성욕감퇴, 남성 유방비대. 2세대 중 risperidone, amisulpride는 haloperidol보다 무월경 빈도가 높다. bromocriptine 사용. 교수님: 미리 설명해 주고, 증상이 잡혀 용량을 줄이면 돌아온다고 안심시켜야 한다.","exps":["항도파민 작용이다.","더 높다.","여성형 유방이 생길 수 있다.","정답.","약 부작용 설명이 우선이다."],"ai":"","fl":{}},{"k":"psy-sz3-29","area":"탈야","prof":"정영철","sec":"10/19 · 조현병 3 (치료·항정신병약물)","meta":"근거: 강의록 「조현병 3(항정신병약물)」 25–26쪽 · STT 10/19 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"QTc 간격을 연장해 torsade de pointes를 일으킬 수 있는 항정신병약물로 강의록에 제시된 것은?","choices":["aripiprazole, quetiapine","thioridazine, sertindole, pimozide","risperidone, amisulpride","molindone, perphenazine","clozapine, olanzapine"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 26쪽: thioridazine, sertindole, pimozide는 QTc 연장 → 치명적 심실성 부정맥. 그 밖에 chlorpromazine 피부 색소 침착·황달, thioridazine 색소성 망막염·역행성 사정, 1세대 저역가·clozapine 경련.","exps":["해당 없다.","정답.","고프로락틴이 대표적이다.","molindone은 체중 증가가 적은 1세대.","대사성 부작용이 대표적이다."],"ai":"","fl":{}},{"k":"psy-sz3-30","area":"티야","prof":"정영철","sec":"10/19 · 조현병 3 (치료·항정신병약물)","meta":"근거: 강의록 「조현병 3(항정신병약물)」 26쪽 · STT 10/19 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"항정신병약물과 임신에 대한 기본 원칙으로 교수님이 설명한 것은?","choices":["임신은 약물 선택과 관계없다","임신 중에도 용량을 늘린다","확실한 기형 유발 약이므로 즉시 모두 끊는다","기형 증거는 없으나 가능하면 first trimester에는 피한다","임신 3기에만 피한다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 26쪽: 기형의 증거는 없으나 유해한 영향(neonatal toxicity 등)이 있을 수 있어 first trimester는 피할 것. 교수님: \"가능하면\"이 중요 – 줄이다 나빠져서 못 끊는 경우도 적지 않다.","exps":["중요한 이슈다.","해당 없다.","기형 증거는 없다.","정답.","first trimester다."],"ai":"","fl":{}},{"k":"psy-sz3-31","area":"탈야","prof":"정영철","sec":"10/19 · 조현병 3 (치료·항정신병약물)","meta":"근거: 강의록 「조현병 3(항정신병약물)」 27쪽 · STT 10/19 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"항정신병약물의 혈중 농도를 낮추는 약물로 짝지어진 것은?","choices":["benztropine, trihexyphenidyl","paroxetine, fluoxetine","phenytoin, carbamazepine","cimeti 반응이 없을 때 clozapine(X).","exps":[],"ai":"","fl":{}},{"k":"psy-y-scz-drug-2022","area":"야마","prof":"정영철","sec":"10/19 · 조현병 3 (치료·항정신병약물)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2022 객17","type":"객","rep":9,"repyears":"2023 객17 · 2021 객15 · 2020 객15 · 2019 객15 · 2017 객15 · 2016 객15 · 2015 객14 · 2014 객17","stem":"조현병의 치료에 대하여 옳은 설명은?","choices":["심리치료가 약물보다 우선이다.","1차성 항정신병 약물을 일차치료제로 쓸 수 있다.","초발 정신병 환자가 항정신병 약물 사용 후 증상이 소실된 경우 1,2개월 정도 유지치료 한다.","초발 조현병 환자에게 항정신병약물을 투여하면 일반적으로 7-80%의 관해률을 보인다.","첫번째 항정신병 약물이 효과가 없으면 바로 clozapine을 투여한다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 올해 수업(10/19 STT·강의록 2–7쪽): 발병 후 첫 5년이 결정적 시기(이 안에 회복할 사람·약은 못 끊어도 생활할 사람·기능이 떨어질 사람의 패턴이 보인다). 치료 중단 시 5년 내 재발률 80% – 교수님: 좋아졌다고 끊으면 안 되는 이유를 친절히 설명해 줘야 한다. 효과 판단은 \"4주 이쪽저쪽\"(최소 3–6주), 치료 저항성 = 비정형을 포함한 2개 약물 무반응 → clozapine(초발의 10–15%가 저항, clozapine으로 30–60% 반응).\n\n📚 학습지 해설: 답 ④. 조현병 치료의 일반 원칙(교과서 222쪽~): 가장 효과적이고 중요한 치료는 항정신병약물, 정신사회적 중재는 병행하면 증상 조절·재발 방지에 효과적. 안정기·유지치료 – 초발 환자는 증상 소실 후 최소 1–2년 유지, 중단은 서서히 감량하며 재발 징후 관찰; 여러 번 재발하면 5년 이상, 심각한 자살기도·폭력이 있었으면 5년 이상~환자에 따라 평생. 약물 선택 – clozapine을 제외한 항정신병약물 중 하나를 1차로, 최근에는 추체외로 증상·지연성 운동장애·항콜린 부작용이 덜한 비정형(2세대)을 1차로 쓰는 경향(1세대도 1차로 쓸 수는 있다). 초발 환자 70–80%에서 증상이 충분히 개선. 치료불응성 – 비정형을 포함한 두 종류 약물을 적정 기간 써도 회복이 충분하지 않으면 clozapine을 우선 선택. ① 약물이 우선(X) ② 최근엔 비정형(2세대)을 1차 약물로 쓰는 경향이라 복원자는 X로 처리 ③ 초발은 1–2개월이 아니라 최소 1–2년(X) ④ 관해율 70–80%(O) ⑤ 두 종류를 충분히 써도 효과 없을 때 clozapine(X).","exps":[],"ai":"","fl":{}},{"k":"psy-y-scz-drug-2021","area":"야마","prof":"정영철","sec":"10/19 · 조현병 3 (치료·항정신병약물)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2021 객15","type":"객","rep":9,"repyears":"2023 객17 · 2022 객17 · 2020 객15 · 2019 객15 · 2017 객15 · 2016 객15 · 2015 객14 · 2014 객17","stem":"조현병의 치료에 대하여 옳은 것은?","choices":["심리치료가 약물보다 우선이다","초발해도 평생 약을 복용해야 한다.","2세대 항정신병약물이 처음 사용하는 약물이다.","초발인 경우 관해율은 30퍼 미만이다.","세 종류의 약물을 써도 효과가 없는 경우 clozapine을 시도한다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 올해 수업(10/19 STT·강의 "basis":"🎓 올해 수업 기준: 올해 수업(10/19 STT·강의록 2–7쪽): 발병 후 첫 5년이 결정적 시기(이 안에 회복할 사람·약은 못 끊어도 생활할 사람·기능이 떨어질 사람의 패턴이 보인다). 치료 중단 시 5년 내 재발률 80% – 교수님: 좋아졌다고 끊으면 안 되는 이유를 친절히 설명해 줘야 한다. 효과 판단은 \"4주 이쪽저쪽\"(최소 3–6주), 치료 저항성 = 비정형을 포함한 2개 약물 무반응 → clozapine(초발의 10–15%가 저항, clozapine으로 30–60% 반응).\n\n📚 학습지 해설: 답 ⑤. 보기 ④는 미복원(기존 야마에서 크게 벗어나지 않음). 강의록: 급성기 치료 – 환자 보호·급성 증상 경감, 입원 기준(자해·타해 위험, 신체 건강 위협, 나쁜 환경으로부터 분리, 진단 위한 관찰·검사, ECT·환경치료 필요). 약물치료 – 가장 효과적이고 중요(①X), 비정형이 추체외로 부작용 적고 음성·인지 증상에 효과적(②X – 2세대가 우선), 효과 판단은 최소 3–6주, 교체는 cross titration. 유지치료 – 초발 1–2년, multiple 5년, 자살기도·폭력은 평생, 치료저항성 = 서로 다른 계열 2개 약물에 반응 없을 때 clozapine(⑤O). 예후 – 첫 입원 환자 20% 완전 회복, 30% 양호, 40–50% 어느 정도, 20–30% 상당한 장애(③X). 2014년엔 \"관해율 50% 미만\"이 답이었으나 교수님이 2015년 문제에서 애매한 보기를 수정한 것 같다 – 50% 미만의 \"완전 회복\"과 증상 완화(관해)를 구분할 것.","exps":[],"ai":"","fl":{}},{"k":"psy-y-scz-drug-2014","area":"야마","prof":"정영철","sec":"10/19 · 조현병 3 (치료·항정신병약물)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2014 객17","type":"객","rep":9,"repyears":"2023 객17 · 2022 객17 · 2021 객15 · 2020 객15 · 2019 객15 · 2017 객15 · 2016 객15 · 2015 객14","stem":"조현병의 약물치료에 대한 설명으로 맞는 것은?","choices":["심리치료가 우선이며 약물치료는 보조적인 위치를 가진다.","초발인 경우라도 평생 약을 복용하여야 한다.","여러 번 재발하거나 자살, 폭력성 등이 있으면 평생 약을 복용하여야 한다.","초발인 경우 관해율은 50% 미만이다.","서로 다른 계열의 약물을 3개 이상 썼을 때도 효과가 없으면 clozapine을 시도한다."],"ans":[],"imgs":[],"vis":[],"notes":["⚠ 정답 확인 필요: 학습지 정답 ④ – 이후 해마다 \"관해율 50% 미만\"은 틀린 선지(관해율 70–80%).","학습지 정답 그대로는 채점하지 않고, 확인되면 반영할게요.","복원 불완전·확인 필요 문항이라 정답 자동 채점은 하지 않아요."],"basis":"🎓 올해 수업 기준: 올해 강의록(10/19, 티야방 박도연 정리 128쪽): 초발 환자 70% 이상 호전, 치료해도 5년 내 80% 재발 → 올해 수업 기준으로 \"초발 관해율 50% 미만\"은 틀린 문장이다. 2014년 학습지 정답 ④는 \"첫 입원 환자 20% 완전 회복\"을 관해율로 읽은 것으로 보이고, 2015년부터는 같은 문장이 틀린 선지로 나온다 – 그래서 이 카드는 확인 필요로 채점하지 않는다.\n\n📚 학습지 해설: 정답 ④(복원자). 약물치료: ① 급성기에는 약물치료가 가장 효과적이고 중요 ② 초발 유지치료는 대개 1–2년 ③ 재발 경력이 있으면 5년 이상 유지 후 양성증상 없이 안정적이면 중단해 볼 수 있다 – 심각한 자살기도·폭력·공격 행동이 있었으면 5년 이상, 환자에 따라 평생 ④ 첫 입원 환자의 20% 정도가 완전 회복 ⑤ 서로 다른 계열 2개 약물에 반응이 없을 때 clozapine. (2015 해설: 2014년 답은 ④였으나 교수님이  객14 · 2020 객14","stem":"조현병으로 진단받은 60세 여자환자가 한달 전부터 haloperidol을 복용 중이었다. 최근 들어 입이 마르고 변비가 오고 눈이 잘 안 보이는 증상이 발생하였다. 가장 관련 있는 신경전달물질은?","choices":["GABA","serotonin","dopamine","acetylcholine","norepinephrine"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 올해 수업(10/19 강의록 8·17쪽·STT): haloperidol은 고역가라 진정·자율신경(항콜린) 부작용이 적고 EPS가 많은 쪽이지만, 문제의 입마름·변비·시야 흐림은 항콜린(무스카린) 부작용 묶음 그대로라 답은 acetylcholine. 교수님 – 항콜린 부작용은 노인에서 반드시 고려(중추에서는 기억상실·섬망).\n\n📚 학습지 해설: 답 ④. haloperidol은 D2 수용체에 작용하지만 부작용으로 항콜린성 증상인 구갈, 변비, blurred vision이 나타날 수 있다(위키). 동기들 사이에서 dopamine(D2 작용)과 acetylcholine(항콜린 부작용)으로 답이 갈렸는데, haloperidol이 무스카린 길항제로도 조금 작용한다는 점을 참고하면 acetylcholine이 답일 것 같다(복원자).","exps":[],"ai":"","fl":{}},{"k":"psy-y-scz-cloz-2023","area":"야마","prof":"정영철","sec":"10/19 · 조현병 3 (치료·항정신병약물)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2023 객16","type":"객","rep":1,"repyears":"","stem":"조현병으로 진단받은 30세 여자환자로 clozapine을 복용 중이다. 약물 복용한 후에 여러 부작용을 호소하고 있다. 약의 부작용으로 볼 수 없는 것은?","choices":["체중이 많이 늘었다.","잘 때 침을 많이 흘린다.","말이 어둔하고 발음이 부정확하다.","전당뇨가 생겼다.","고지혈증이 생겼다."],"ans":[3],"imgs":[],"vis":[],"notes":["학습지에서도 ②·③ 사이 고민이 많았다고 적혀 있다(기록 정답 ③)."],"basis":"🎓 올해 수업 기준: 올해 수업(10/19 STT·강의록 15·24쪽): 교수님 – clozapine·quetiapine은 도파민 수용체 차단이 100–200배 약해 파킨슨병 환자의 정신병 증상에도 쓰는 약이다 → 말이 어둔해지는 파킨슨 증상을 부작용으로 보기 어렵다. clozapine은 1%에서 무과립구증(초기 8–12주) → 첫 18주 매주 혈액검사, 400 mg 이상에서 경련 위험 2–3배.\n\n📚 학습지 해설: 답 ③. 2세대 약물 – clozapine·quetiapine: 신경학적 부작용 적음 / clozapine·olanzapine: 체중 증가, 당뇨. 수용체별 부작용(항도파민·항콜린·항아드레날린·항히스타민·세로토닌 항진), 신경학적 부작용(파킨슨 증후군: 진전·강직·무표정·침흘림, 정좌불능, 급성 근긴장이상, NMS, 지연성 운동장애), 비신경학적 부작용(진정 – clozapine·quetiapine, 혈액 – clozapine 매주 CBC, 고프로락틴 – risperidone·amisulpride, 체중·대사 – clozapine·olanzapine, QTc – thioridazine·sertindole·pimozide, 경련 – clozapine) 표를 바탕으로 낸 문제. 강의록에 정확한 언급이 없어 ②(침흘림)와 ③ 사이에서 고민이 많았다 – 의약품 안전사용정보상 clozapine의 흔한 부작용에 타액 분비 증가가 있고, 말이 어둔해지는 것은 파킨슨 증상(bradykinesia)인데 clozapine은 파킨슨병 환자의 망상·환각에도 쓰는 약이라 부작용으로 보기 어렵다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-scz-gen-2025","area":"야마","prof":"정영철","sec":"10/19 · 조현병 3 (치료·항정신병약물)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2025 객4","type":"객","rep":1,"repyears":"","stem":"다음 중 항정신병 약물에 대한 설명으로 옳은 것은?","choices":["2세대 약물은 1세대 약물에 비해 신경학적 부작용이 크다.","파킨슨병 환자에서는 clozapine, quetiapine이 가장 신경학적 부작용이 크다.","환자가 약을 거부하거나 급히 행동조절이 필요한 상황에서는 장기 지속형 주사제를 사용한다.","약물을 중단하면 재발하는 경우가 많다.","환자가 약물에 의존하고 쉽게 끊지 못하는 경향이 있다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 올해 수업(10/19 STT·강의록 14–15쪽): 급히 행동 조절할 때 쓰는 근육주사(haloperidol, olanzapine)는 하루 정도 가는 단기 주사이고, 장기지속형 주사제는 복약 순응도가 낮은 환자용(교수님: 6개월짜리 주사를 맞는 기능 좋은 환자들은 만족도가 높다). 항정신병약물은 남용·의존 가능성이 적고 치료지수가 높다.\n\n📚 학습지 해설: 답 ④. 조현병 강의 시간에 학생들에게 과제로 만들라고 한 퀴즈를 그대로 냈다. ① 1세대가 신경학적 부작용이 더 크다 – 그래서 2세대를 우선 선택(X) ② 파킨슨병 환자에서는 clozapine·quetiapine이 신경학적 부작용이 가장 적다(X) ③ 약을 거부하거나 행동 조절이 필요하면 근육주사(haloperidol, olanzapine)(X) ④ 치료해도 5년 내 재발할 수 있어 유지치료가 필요(O) ⑤ 항정신병약물은 남용·의존 가능성이 적다(X).","exps":[],"ai":"","fl":{}},{"k":"psy-y-scz-psy-2025","area":"야마","prof":"정영철","sec":"조현병 정신사회적 치료·경과·예후 (야마 · 수업 전)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2025 객5","type":"객","rep":10,"repyears":"2023 객18 · 2022 객18 · 2021 객16 · 2020 객16 · 2019 객16 · 2016 객16 · 2017 객16 · 2015 객15 · 2014 객18","stem":"조현병의 심리치료 원칙에 관한 설명 중 올바른 것은?","choices":["분석적 치료가 가장 중요하고 효과적인 치료이다.","현실지향적 지지치료는 가장 기본적이고, 보편적인 치료이다.","사회적인 기능의 회복을 치료목표로 삼을 필요 없다.","가족들의 개입을 허용해서는 안된다.","인지행동치료는 급성기에서의 치료방법이다."],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 올해 수업(10/20 STT): 교수님은 처음 입원하는 정신병 환자에게 \"당신은 안전하다(safe)\"는 느낌을 전달하는 것이 가장 중요하고, 그 바탕 위에서야 인지치료·통찰지향 치료가 올라갈 수 있다고 강조했다 → 현실지향적 지지치료(이해·공감·안전감)가 가장 기본이라는 정답과 같은 맥락이고, 급성기에 분석적 치료·인지치료부터 하는 선지는 틀린다.\n\n📚 학습지 해설: 답 ②. 거의 매년 기출로 나오는 조현병 심리치료 원칙, 선지만 조금씩 변형되는 킹야. 조현병 치료(강의록): 급성기에는 약물치료가 가장 효과적이고 중요 – 효과 판단은 최소 3–6주, 교체는 cross titration 또는 overlap and tapering. 유지치료 – 현실지향적 지지치료: 꾸준한 이해와 공감, 긍정적인 태도(가장 기본) / 인지치료: 왜곡된 인지 → 대체 해석을 통한 현실 검증력 강화, 증상이 약화되는 시기에 더 효과적, 치료자의 적극적 개입과 환자의 협조가 필수 / 사회기술 훈련(집단치료): 문제해결 능력·대인관계 기술 / 가족치료: 환자에 대한 현실적인 기대 유도, 재발 징후·증상 교육, 가족 간 의사소통 향상(비난·과잉보호). 치료 목표에 \"대인관계와 사회기능 향상\"이 명시되어 있다. ① 급성기에는 약물치료가 가장 중요(정신분석적 치료는 무의식을 파고들어 정신증을 악화시킬 수 있다 – 신경증·경한 성격장애 대상) ② 현실지향적 지지치료가 가장 기본·보편적 ③ 사회기능 회복도 치료 목표 ④ 가족에게 현실적인 기대를 갖게 해야 한다 ⑤ 인지(행동)치료는 안정기·유지기에, 환자 협조 필수. 매년 선지 단어 한두 개만 바꿔 나오는 킹야라 문제를 외워 가도 좋다(복원자).","exps":[],"ai":"","fl":{}},{"k":"psy-y-scz-psy-2023","area":"야마","prof":"정영철","sec":"조현병 정신사회적 치료·경과·예후 (야마 · 수업 전)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2023 객18","type":"객","rep":10,"repyears":"2025 객5 · 2022 객18 · 2021 객16 · 2020 객16 · 2019 객16 · 2016 객16 · 2017 객16 · 2015 객15 · 2014 객18","stem":"조현병의 심리치료 원칙에 관한 설명 중 올바른 것은?","choices":["분석적 치료가 가장 중요하고 효과적인 치료이다","현실지향적 지지치료는 가장 기본적인 치료이다.","사회적인 기능의 회복까지 치료목표로 삼을 필요 없다.","가족에게 현실적인 기대를 갖게 하는 것은 너무 비관적인 치료 태도이다.","인치치료는 환자의 협조 없이도 접근이 가능한 치료이다."],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 올해 수업(10/20 STT): 교수님은 처음 입원하는 정신병 환자에게 \"당신은 안전하다(safe)\"는 느낌을 전달하는 것이 가장 중요하고, 그 바탕 위에서야 인지치료·통찰지향 치료가 올라갈 수 있다고 강조했다 → 현실지향적 지지치료(이해·공감·안전감)가 가장 기본이라는 정답과 같은 맥락이고, 급성기에 분석적 치료·인지치료부터 하는 선지는 틀린다.\n\n📚 학습지 해설: 답 ②. 매년 나오는 킹야 – 선지 틀은 그대로이고 단어 한두 개만 바뀐다. 정신사회적 치료는 약물과 통합될 때 효과가 극대화되며, 결핍을 회복해 취약성·스트레스를 줄이고 적응능력·사회기능 회복을 목표로 한다. 현실지향적 지지치료(꾸준한 이해·공감·긍정적 태도)와 인지치료(증상이 약화되는 시기에 더 효과적)가 가장 기본적인 정신사회적 치료. 가족치료 – 현실적인 기대 유도, 재발 징후 교육, 의사소통 향상. 사례관리 – 정신건강복지센터가 일상생활·증상·약물 복용을 관리. 조현병 치료(강의록): 급성기에는 약물치료가 가장 효과적이고 중요 – 효과 판단은 최소 3–6주, 교체는 cross titration 또는 overlap and tapering. 유지치료 – 현실지향적 지지치료: 꾸준한 이해와 공감, 긍정적인 태도(가장 기본) / 인지치료: 왜곡된 인지 → 대체 해석을 통한 현실 검증력 강화, 증상이 약화되는 시기에 더 효과적, 치료자의 적극적 개입과 환자의 협조가 필수 / 사회기술 훈련(집단치료): 문제해결 능력·대인관계 기술 / 가족치료: 환자에 대한 현실적인 기대 유도, 재발 징후·증상 교육, 가족 간 의사소통 향상(비난·과잉보호). 치료 목표에 \"대인관계와 사회기능 향상\"이 명시되어 있다. ① 급성기에는 약물치료가 가장 중요(정신분석적 치료는 무의식을 파고들어 정신증을 악화시킬 수 있다 – 신경증·경한 성격장애 대상) ② 현실지향적 지지치료가 가장 기본·보편적 ③ 사회기능 회복도 치료 목표 ④ 가족에게 현실적인 기대를 갖게 해야 한다 ⑤ 인지(행동)치료는 안정기·유지기에, 환자 협조 필수. 매년 선지 단어 한두 개만 바꿔 나오는 킹야라 문제를 외워 가도 좋다(복원자).","exps":[],"
