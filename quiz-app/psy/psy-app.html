chosis syndrome)에 대한 설명으로 옳은 것은?","choices":["DSM-IV부터 있던 진단이다","노인에게만 진단한다","망상에 100% 확신하는 상태다","정신증 고위험군과 똑같이 예방만 목적으로 하고 치료하지 않는다","관계사고와 망상 사이의 중간 단계로 확신도가 흔들리며, 치료 목표는 정신병 수준 진행 예방이다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 19쪽·교수님: 정신증 고위험군 연구 결과로 DSM-5에 새로 제시. 정신증 고위험은 예방 목적, 약화된 정신병증후군은 병적 상태로 치료에 초점. 확신도가 흔들려 \"30%쯤 그럴 수도, 70%는 아닌 것 같다\"고 말한다 – 망상(psychotic) 수준으로 심해지지 않게 하는 것이 목표.","exps":["DSM-5에 새로 제시.","해당 없다.","확신도가 흔들린다.","병적 상태로 치료에 초점을 둔다.","정답."],"ai":"","fl":{}},{"k":"psy-sz5-17","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 강의록 「조현병 5」 20쪽 · STT 10/20 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5의 긴장증(catatonia)에 대한 설명과 교수님의 입장으로 옳은 것은?","choices":["긴장증은 대개 외래 통원 치료가 원칙이다","긴장증 환자는 주변 인식이 전혀 없다","항정신병약물과는 전혀 관련이 없다","DSM-5는 조현병이 35% 정도라 보나 교수님은 경험상 다르다고 했다","DSM-5는 긴장증의 대부분이 조현병이라고 본다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 20쪽: 과거 조현병의 아형, 정신운동성 무반응(주변 인식은 있음)·혼미·강경증·납굴증·함구증·초조·상동증·반향언어/동작. 조현병의 35%, 대다수는 우울증·양극성장애, 항정신병약물(급성 근긴장이상·NMS), 신경학적 상태. 입원 필요, 영양·고열·위생 관리. 교수님: 30년 동안 우울증으로 긴장증이 온 환자는 본 적이 없다 – 미국 사람들 생각.","exps":["입원이 필요하다.","주변 인식은 있다.","원인이 될 수 있다.","정답.","대다수는 기분장애라고 본다."],"ai":"","fl":{}},{"k":"psy-sz5-18","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: STT 10/20 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신병으로 처음 입원하는 환자에게 \"가장 전달되어야 하는 단어\"로 교수님이 영상(간호 장면)을 보여 주며 강조한 것은?","choices":["reality","family","cure","safe","medicine"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 입원 과정(경찰·119·응급실)이 굉장히 공포스럽기 때문에 \"당신은 safe하다, 안전하다\"는 느낌을 전달하는 것이 가장 중요 – 그 바탕 위에서 인지치료·통찰지향 치료가 올라갈 수 있다. 증례(24세 여자, 다중 트라우마·복약 중단·지연성 운동장애·팔리페리돈 장기지속형 주사)도 트라우마를 잘 어루만져야 한다는 취지.","exps":["해당 없다.","해당 없다.","해당 없다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-sz5-19","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: STT 10/20 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"증례 발표 환자(24세, 반복 복약 중단·입원)에게 쓴 치료와 그 이유의 연결로 옳은 것은?","choices":["lithium – 양극성장애라서","팔리페리돈 월 1회 근육주사 – 낮은 복약 순응도 때문에","ECT – 긴장증이 있어서","clozapine – 치료 저항성이라서","propranolol – 정좌불능 때문에"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"STT 증례: 반복적으로 약을 끊고 재발해 입원 → 낮은 복약 순응도에 대해 paliperidone 100 mg 장기지속형 근육주사(월 1회). 혀·다리의 불수의 운동은 지연성 운동장애로 진단(VMAT2 억제제 tetrabenazine 등은 비급여), 항콜린제 감량, 재발 신호 교육, 공동거주시설 연계.","exps":["해당 없다.","정답.","해당 없다.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-y-scz-dxb-2023","area":"야마","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2023 객19","type":"객","rep":2,"repyears":"2022 객19","stem":"25세 농촌에 사는 기혼 여성이 친정 아버지가 한 달 전에 갑자기 돌아가셔서 매우 우울했다 한다. 보고싶은 마음에 밤 늦게 아버지 산소에 갔다 온 뒤로 마음이 무겁고 평소에 친절하게 대하지 못했던 것이 생각나면서 죄책감이 커지면서 잠을 잘 못 자기 시작했다고 한다. 3일 후 부터는 무서운 소리의 환청이 들리고 누군가 자신을 잡으러 온다면서 문 뒤에 숨는 행동을 해 응급실을 통해 정신과로 입원하였다. 입원 후 주사를 맞고 하루 푹 자고 나더니 모든 증상이 깨끗이 좋아졌다. 1주일 후 퇴원하였고 그 후 좋은 상태를 유지중이다. 이 환자의 진단명은?","choices":["조현병","조현양상장애","단기정신병적장애","망상장애","의존성 인격장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(임채원): 조현병·조현양상장애·단기정신병적장애는 기간으로 구분하는 문제가 계속 출제됨\n\nDSM 기준: 특징적 증상 2개 이상이 한 달 중 상당 기간 + 사회·직업 기능 저하, 전체 경과 6개월 이상 = 조현병 / 1–6개월 = 조현양상장애(정신분열형장애) / 1일–1개월 미만 = 단기 정신병적 장애. 조현정동장애는 기분삽화가 함께 있어야 하고, 망상장애는 괴이하지 않은 망상만 있고 기능이 유지된다. 1개월 미만이고 병전 상태로 완전히 회복 → 단기 정신병적 장애.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-dxb-2022","area":"야마","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2022 객19","type":"객","rep":2,"repyears":"2023 객19","stem":"60세 농촌에 사는 여성이 작년 가을부터 옆 주민들이 자신의 농작물을 훔쳐간다고 의심하고 화를 냈다. 훔쳐가는 주민은 평소에 사이가 안 좋았고 작년에 다툰 일이 있다고 한다. 환청과 기억 장애 증상은 없었고 훔쳐간 주민을 제외한 나머지 주민들과는 잘 지냈다고 한다. 의심되는 진단명은?","choices":["조현병","조현양상장애","잠재정신병적장애","망상장애","의존성인격장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이도연): 망상장애 vs 조현병: 괴이성 유무와 두드러진 환각 여부로 감별, 망상 외 기능 유지\n\n망상장애: 괴이하지 않은(실생활에 있을 법한) 체계적 망상, 특정인을 의심(의처증·의부증), 환각·와해·음성증상이 없고 망상 외 기능은 유지. 조현병은 불특정 다수를 의심하는 경우가 많다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-dd-2025","area":"야마","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2025 객7","type":"객","rep":1,"repyears":"","stem":"망상장애와 조현병을 감별할 수 있는 특징은?","choices":["와해된 언어를 보인다.","전반적인 기능 손상이 동반된다.","망상과 관련된 일시적인 환청이 동반된다.","괴이한 망상이다.","음성증상을 보인다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이도연): 망상장애 vs 조현병: 괴이성 유무와 두드러진 환각 여부로 감별, 망상 외 기능 유지\n\n망상장애: 괴이하지 않은 망상이 1개월 이상, 망상 주제와 연관된 환각은 있을 수 있음, 피해·관계망상이 흔함. ①②④⑤는 조현병의 특징.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-dd2-2011","area":"야마","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2011 객15","type":"객","rep":1,"repyears":"","stem":"다음 망상장애에 대한 설명 중 가장 적절한 것은?","choices":["망상 장애는 인격은 비교적 잘 유지가 되나 체계적이지 않고 괴이한 망상이 특징이다.","망상 장애는 항정신병약물에 잘 반응하지 않기 때문에 통찰지향적 정신치료가 효과적이다.","망상장애는 흔히 성적인 문제와 우울증상을 동반하며, 여자에게 많은 편이다.","망상 장애 중 질투형은 가장 흔한 형태로 여자에게 더 많은 편이다.","망상 장애는 대부분 외래에서 치료가 가능하고, 집단치료가 효과적이다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이도연): 망상장애 vs 조현병: 괴이성 유무와 두드러진 환각 여부로 감별, 망상 외 기능 유지\n\n① 아주 체계적이고 괴이하지 않은 망상. ② 항정신병약물 반응은 떨어지지만 시도는 해야 하고, 의심이 많아 통찰지향 정신치료·집단치료는 도움이 안 된다(⑤도 ×). ③ 중년기 이후, 여자에 많고 성적 문제·우울증상 동반(○). ④ 가장 흔한 형은 피해형, 질투형은 남자에 많다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-pp-2025","area":"야마","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2025 객6","type":"객","rep":3,"repyears":"2023 객20 · 2022 객22","stem":"36세 여자로서 출산 후에 신경이 예민해지고 자신의 아이가 바뀌었다면서 안절부절해 한다. 과거 정신과적 병력은 없었다 한다. 이 환자에 대한 설명으로 올바른 것은?","choices":["자살이나 영아 살해 등의 위험성이 매우 높아 즉각적인 격리가 필요하다.","산후 정신병으로 발생 빈도가 100명당 1-2명이다.","예후는 대개 좋아 일회성으로 끝나며 다음 임신 시 재발이 없다.","조현병의 아형으로 볼 수 있다.","출산 후 4주 이내에 발생한다."],"ans":[5],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2023 객20"],"basis":"📌 티야방(임채원): 산후정신병: 시간이 지나 호전되는 경우가 있어 즉각적 격리는 필요하지 않음, 기분조절제·항우울제 사용\n\n산후정신병: 출산 후 평균 2–3주(대개 4주 이내) 시작, 아기가 바뀌었다·죽었다는 망상, 혼란. 발병 1,000명 출산당 1–2명. 독자적 질병이 아니라 기분삽화로 보며 DSM-5에서는 주로 양극성장애의 아형. 자살·영아살해 행동화 가능성은 크지 않지만 반드시 주의 깊게 감독, 자살 가능성이 있으면 입원. 약 50%에서 1년 내 기저 기분장애 재발. 회복률은 비교적 높다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-pp-2022","area":"야마","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2022 객22","type":"객","rep":3,"repyears":"2025 객6 · 2023 객20","stem":"36세 여자로서 출산 후에 신경이 예민해지고 자신의 아이가 바뀌었다면서 안절부절 해한다. 과거 정신 과거병력은 없었다한다. 이 환자에 대한 설명으로 올바른 조합은?","choices":["자살이나 영아 살해 등의 위험성은 적다.","산후 정신병으로 발생 빈도가 1000명당 1-2명이다.","예후는 대개 좋으나 다음 임신 시 재발할 수 있다.","대개 빨리 회복되므로 즉각적인 조치보다는 기다려 보는 것이 좋다.","출산 후 1-2달 이후에 발생한다."],"ans":[],"imgs":[],"vis":[],"notes":["⚠ 정답 확인 필요: 학습지 정답 ②(복원자도 ①·② 중 확실치 않다고 적음).","학습지 정답 그대로는 채점하지 않고, 확인되면 반영할게요.","복원 불완전·확인 필요 문항이라 정답 자동 채점은 하지 않아요."],"basis":"📌 티야방(임채원): 산후정신병: 시간이 지나 호전되는 경우가 있어 즉각적 격리는 필요하지 않음, 기분조절제·항우울제 사용\n\n산후정신병: 출산 후 평균 2–3주(대개 4주 이내) 시작, 아기가 바뀌었다·죽었다는 망상, 혼란. 발병 1,000명 출산당 1–2명. 독자적 질병이 아니라 기분삽화로 보며 DSM-5에서는 주로 양극성장애의 아형. 자살·영아살해 행동화 가능성은 크지 않지만 반드시 주의 깊게 감독, 자살 가능성이 있으면 입원. 약 50%에서 1년 내 기저 기분장애 재발. 회복률은 비교적 높다. 복원자: 교과서대로면 ①(행동화 가능성은 크지 않다)도 맞아 보여 \"일단 확실한 ②로 표기\"했다고 함.","exps":[],"ai":"","fl":{"warn":1,"chk":1,"inc":1,"tyb":1}},{"k":"psy-ch1-01","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 1」 2쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"소아청소년 정신장애의 특징에 대한 교수님 설명으로 옳은 것은?","choices":["순수하게 한 질환만 있는 경우가 대부분이다","공존질환이 많고 동반되면 예후가 나빠지는 경우가 많다","발달 단계는 평가에 고려하지 않는다","환경의 영향은 거의 없다","성인 정신장애와는 전혀 연속성이 없다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 1 2쪽·교수님: 성인과 연속선적인 측면도 있으나(ADHD·자폐는 성인까지), 소아청소년은 공존질환이 많고(순수한 ADHD만 있는 아이는 흔치 않음 – 틱·우울·불안·행동장애 동반) 환경의 영향에 따라 예후가 좌우되며, 발달학적 개념을 적용해야 한다.","exps":["흔치 않다.","정답.","발달 단계 평가가 중요하다.","환경 영향이 크다.","연속적인 측면도 있다."],"ai":"","fl":{}},{"k":"psy-ch1-02","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 1」 3–4쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"소아청소년 치료 원칙으로 강의록에 제시되지 않은 것은?","choices":["다방면 전문가들의 팀 접근","생물·심리·사회적(bio-psycho-social) 접근","아이 문제는 부모 탓임을 분명히 알려 준다","부모를 보조 치료자로 삼아 치료적 동맹","진단뿐 아니라 발달 수준·발달과제 성취를 포함한 포괄적 평가"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 1 3–4쪽·교수님: 철저하고 포괄적인 평가, bio-psycho-social 접근(nature·nurture), multidisciplinary team, 부모·가족을 보조 치료자로. 교수님: 병원에 올 정도의 부모는 오히려 더 적극적인 분들 – 부모 탓으로 나무라는 것은 도움이 되지 않고, 부모 교육이 중요하다.","exps":["제시됨.","제시됨.","정답.","제시됨.","제시됨."],"ai":"","fl":{}},{"k":"psy-ch1-03","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 1」 5–6쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"소아청소년 정신장애에 대한 \"잘못된 생각\"이 아닌 것(올바른 설명)은?","choices":["발달이 느린 아동은 기다리면 나아진다","아이들이 산만한 것은 크면 저절로 좋아진다","ADHD 증상은 약 3분의 2에서 성인까지 이어진다","틱 증상은 의지로 조절할 수 있는 버릇이다","자폐증은 부모 잘못이다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 1 5–6쪽(잘못된 생각들)·교수님: 발달이 느리면 기다리지 말고 도와야 하고, 자폐는 타고나며 양육과 상관없고, ADHD는 크면 저절로 좋아지지 않아 3분의 2는 성인까지 이어진다. 틱도 타고나는 것으로 본다. 청소년 문제도 대개 어릴 때부터 있던 문제가 불거진 것.","exps":["잘못된 생각.","잘못된 생각.","정답.","잘못된 생각.","잘못된 생각."],"ai":"","fl":{}},{"k":"psy-ch1-04","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 1」 8–11·18쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 신경발달장애(Neurodevelopmental Disorders)에 속하지 않는 것은?","choices":["분리불안장애","지적장애","자폐스펙트럼장애","ADHD","특정학습장애"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 1 18쪽: 신경발달장애 – 지적장애, 의사소통장애, 자폐스펙트럼장애, ADHD, 특정학습장애, 운동장애(발달성 협응장애·상동증적 운동장애·틱장애). 교수님: 신경계 발달 문제로 생애 초기에 시작되고 타고나는 것으로 보는 질환 – DSM-5에서 이렇게 묶였다(소아신경과 것이라는 뜻은 아님). 분리불안장애는 불안장애.","exps":["정답.","포함.","포함.","포함.","포함."],"ai":"","fl":{}},{"k":"psy-ch1-05","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 1」 9·24쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"자폐 특성(대화를 주고받는 화용언어의 어려움)은 있으나 반복·상동 행동이나 제한된 관심은 없는 아이에게 DSM-5에서 붙이는 진단은?","choices":["표현성 언어장애","선택적 함구증","아스퍼거장애(DSM-IV)","사회적 의사소통장애","자폐스펙트럼장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 사회적(pragmatic) 의사소통장애는 새로 들어온 진단으로 의사소통장애 안에 있다 – 일반 대화는 되지만 핑퐁·사회적 대화가 안 되고, 자폐의 반복·상동 행동이나 특이한 집착은 없는 아이. 아스퍼거장애 등 과거 전반적 발달장애는 자폐스펙트럼장애 하나로 통합.","exps":["언어 자체의 문제다.","불안장애다.","DSM-5에서 없어진 진단명이다.","정답.","반복 행동·제한된 관심이 있어야 한다."],"ai":"","fl":{}},{"k":"psy-ch1-06","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 1」 13쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 선택적 함구증과 분리불안장애를 불안장애로 옮긴 이유로 교수님이 설명한 것은?","choices":["SSRI 약물 반응이 같아서","보험 청구를 편하게 하기 위해서","크면서 사회불안으로 가는 경우가 많아서","관련 유전자가 같다고 밝혀져서","발병 연령이 주로 성인이어서"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 1 13쪽·교수님: 예전에는 기타 장애(소아기 장애)로 분류했지만, 선택적 함구증 아이들이 커서 사람들 앞 발표·낯선 사람을 힘들어하는 사회불안으로 가더라 – 밖에서 말을 안 하는 이유도 부끄러움·불편함.","exps":["해당 없다.","해당 없다.","정답.","해당 없다.","소아기 발병이다."],"ai":"","fl":{}},{"k":"psy-ch1-07","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 1」 14쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 급식 및 섭식장애의 진단 위계(hierarchy)에 대한 교수님 설명으로 옳은 것은?","choices":["세 진단을 동시에 모두 붙인다","신경성 폭식증은 체중이 심각하게 낮아야 한다","식욕부진증 → 폭식증 → 폭식장애 순으로 본다","폭식장애를 가장 먼저 고려한다","체중은 진단과 관계없다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 진단에는 위계가 있어 가장 specific한 기준을 가진 anorexia nervosa가 우선권(제한형·폭식/제거형) – 체중이 심각하게 떨어지면 식욕부진증, 아니면 bulimia(먹고 토하거나 설사약·이뇨제), 보상행동 없는 폭식은 binge-eating disorder.","exps":["위계에 따라 하나를 붙인다.","심각한 저체중이면 식욕부진증이다.","정답.","반대다.","핵심 기준이다."],"ai":"","fl":{}},{"k":"psy-ch1-08","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 1」 15쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"배변·배뇨 가리기의 발달 순서와 진단 기준 연령에 대한 교수님 설명으로 옳은 것은?","choices":["밤 소변 → 낮 소변 → 낮 대변 → 밤 대변 순으로 가린다","유뇨증은 만 3세 이후 진단한다","유분증은 만 6세 이후 진단한다","밤 대변 → 낮 대변 → 낮 소변 → 밤 소변 순이라 야뇨증이 가장 흔하다","95% 기준과는 관계없다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님: \"밤똥, 낮똥, 낮오줌, 밤오줌\" – 밤 소변을 가장 늦게 가려 유뇨증의 가장 흔한 형태가 야뇨증. 만 4세에 95%가 대변, 만 5세에 95%가 소변을 가리므로 대변은 만 4세, 소변은 만 5세 이후에도 못 가리면 각각 유분증·유뇨증(퍼센티지 기준).","exps":["반대다.","만 5세다.","만 4세다.","정답.","95% 기준이다."],"ai":"","fl":{}},{"k":"psy-ch1-09","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 1」 16쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD에 가장 많이 동반되는 질환으로 교수님이 꼽은 것은?","choices":["적대적 반항장애","주요우울장애","틱장애(뚜렛)","자폐스펙트럼장애","강박장애"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"교수님: ADHD에 가장 많이 동반되는 질환 하나를 꼽으라면 ODD(뜻대로 안 되면 뻗대는 아이). 품행장애(규칙 위반, 남에게 피해)와 합쳐 행동 문제라 부르고, 동반되면 예후가 나쁘며 반사회성 인격장애로 갈 수 있다.","exps":["정답.","해당 없다.","동반은 되지만 1위로 꼽지 않았다.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ch1-10","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"요즘 소아청소년 정신과 병동 입원의 \"대세\"라고 교수님이 말한 것은?","choices":["자해하는 여학생","자폐 유아","야뇨증 아동","품행장애 남학생","지적장애 성인"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 과거에는 품행장애 입원이 가장 많았지만 지금은 자해·자살사고 아이들이 대세이고 대부분 여자아이. 서로 전염성이 있다. 진통제·항히스타민(수면유도제) 한꺼번에 먹기가 SNS로 다시 퍼지고 있고, 타이레놀 과량은 간독성으로 정신과 약보다 더 위험할 수 있다(리튬도 위험).","exps":["정답.","해당 없다.","해당 없다.","과거의 경향이다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ch1-11","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 1」 25–26쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"자폐스펙트럼장애의 원인에 대한 설명으로 옳은 것은?","choices":["MMR 백신이 원인으로 밝혀졌다","유병률 증가는 실제 발생 증가로만 설명된다","타이레놀 복용이 확실한 원인이다","선천적·생물학적 뇌 기능 문제이며 단일 원인은 없다","부모의 애정 결핍·자극 부족이 주원인이다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 1 25–26쪽·교수님: 환경적 요인(애정 결핍)이 원인? (X), 선천적·생물학적·의학적 원인 (O), 유전·면역 등 단일 원인 없이 복합적. MMR 백신은 자폐를 유발하지 않는다고 결론. 유병률 증가는 진단 기준 변화·인식 증가 등으로 본다(국내 2.64% rep":1,"repyears":"","stem":"ADHD의 3대 핵심 증상으로 짝지어진 것은?","choices":["충동성, 우울, 틱","주의력 결핍, 불안, 강박","과잉행동, 상동행동, 언어 지연","부주의, 환청, 망상","주의력 결핍, 과잉행동, 충동성"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 학령기 ADHD 증상을 부주의·과잉행동·충동성으로 구분 (특별한 TY는 없어 Y 위주 정리)\n\n강의록 3 3쪽·교수님: 이름 그대로 주의력 결핍(부주의), 과잉행동, 충동성. 학령전기에는 과잉행동이 두드러져 잘 다치고, 학교에 들어가 40분 이상 앉아 있어야 하면서 집중 문제가 드러난다.","exps":["해당 없다.","해당 없다.","자폐 쪽이다.","정신병 증상이다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-02","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 3 ADHD」 7–9쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 ADHD 진단 기준에 대한 설명으로 옳은 것은?","choices":["각 영역 9개 중 6개 이상, 12세 이전 시작","집이나 학교 한 곳에서만 있어도 된다","부주의 9개 중 3개 이상이면 된다","뇌파·MRI 검사로 확진한다","증상이 반드시 7세 이전에 시작해야 한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 9개 중 6개 이상·6개월, 12세 이전으로 변경, 학교에서만/집에서만이면 다른 요인 고려, 기능 장해 반드시 확인\n\n강의록 3 7–9쪽·교수님: 부주의 9개, 과잉행동 6개 + 충동성 3개(합쳐 9개) 중 각각 6개 이상, 6개월 이상. DSM-5에서 시작 연령이 7세 → 12세로 바뀌었다. 두 가지 이상의 장면(집·학교 등)에서 나타나야 하고 기능 장애가 있어야 한다. 특정 검사로 확진하지 않는 현상학적 진단.","exps":["정답.","두 장면 이상이어야 한다.","6개 이상이다.","검사로 확진하지 않는다.","DSM-IV 기준이다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-03","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 3 ADHD」 8쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"학교에서는 괜찮은데 집에서만 산만하고 집중을 못 하는 아이에 대한 교수님 설명으로 옳은 것은?","choices":["집에서 산만해지는 다른 이유를 먼저 찾는다","자폐스펙트럼장애로 진단한다","학교에서의 증상은 중요하지 않다","바로 ADHD 혼합형으로 진단한다","ADHD 약을 바로 증량한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 9개 중 6개 이상·6개월, 12세 이전으로 변경, 학교에서만/집에서만이면 다른 요인 고려, 기능 장해 반드시 확인\n\n교수님: ADHD는 장소를 불문하고 증상이 있어야 한다. 집에서만 문제면 학대나 정서적 문제를, 학교에서만 문제면 또래 관계·학업 이해도 등 학교의 다른 문제를 먼저 살핀다.","exps":["정답.","해당 없다.","둘 다 봐야 한다.","두 장면 이상이어야 한다.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-04","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 3 ADHD」 18–23쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD 증상의 연령에 따른 변화로 옳은 것은?","choices":["과잉행동은 성인기에 오히려 늘어난다","충동성은 사춘기에 완전히 사라진다","세 증상 모두 성인기에 완전히 없어진다","과잉행동이 가장 먼저 줄어들고 부주의·충동성은 지속된다","부주의가 가장 먼저 좋아진다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 과잉행동은 빠르게 감소, 부주의는 성인까지, 충동성은 사춘기에 상승 – 행동문제 동반 시 반사회성 인격장애로 이행(재언급)\n\n강의록 3 18·21–23쪽·교수님: 가장 먼저 좋아지는 것은 과잉행동(초1 교실에선 돌아다니지만 5학년쯤엔 앉아서 딴짓) – 그래서 다 나은 줄 오해하기 쉽다. 부주의는 성인기까지 그대로, 충동성은 학령기에 줄었다가 청소년기에 다시 확 올라온다.","exps":["줄어든다.","청소년기에 다시 심해진다.","2/3가 성인까지 지속된다.","정답.","과잉행동이 먼저다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-05","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 3 ADHD」 20쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"성인기 ADHD에 대한 설명으로 옳은 것은?","choices":["남녀 비가 비슷하고 부주의 우세형이 많다","소아용 약물은 성인에게 쓸 수 없다","소아와 마찬가지로 남자가 훨씬 많다","성인기까지 지속되는 경우는 10% 미만이다","과잉행동 우세형이 가장 많다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 50–65% 이상 성인기 지속(Y 선지), 성인은 남녀 비슷·부주의 우세형, 약물 효과는 소아와 유사\n\n강의록 3 20쪽·교수님: 성인의 약 3%. 과잉행동을 주로 보이던 남자들이 줄어들고 부주의 우세형(여자에서 흔함)은 그대로 가서 성인기에는 남녀가 비슷(약 1:1). 예전엔 절반 이하로 봤으나 지금은 3분의 2까지 지속된다고 본다. 소아 약물을 성인에도 쓰도록 승인, 효과 동일.","exps":["정답.","승인되어 쓴다.","성인은 비슷하다.","2/3까지 지속된다고 본다.","부주의 우세형이 많다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-06","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 3 ADHD」 18쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD 아이가 청소년기에 특히 힘들어지는 이유로 교수님이 설명한 것은?","choices":["부주의가 완전히 사라져 버려서","사춘기에 지능이 떨어져서","시냅스 도파민이 지나치게 많아져서","과잉행동이 다시 심해지기 때문에","변연계는 성숙했는데 전전두엽 브레이크는 미숙해서"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 과잉행동은 빠르게 감소, 부주의는 성인까지, 충동성은 사춘기에 상승 – 행동문제 동반 시 반사회성 인격장애로 이행(재언급)\n\n교수님: 사춘기에는 호르몬이 불을 지피고 변연계라는 액셀러레이터는 완성됐는데 전두엽 브레이크는 아직 개발 중 – ADHD 아이가 이를 맞닥뜨리면 불같이 타오를 수 있다. 약물남용, 무면허 운전, 게임 중독, 충동적 자살 시도, 비행 등. 청소년 자살은 성인보다 우울증 없이 충동적으로 일어나는 경우가 많다.","exps":["부주의는 지속된다.","해당 없다.","낮다고 보는 가설이 있다.","과잉행동은 줄어든다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-07","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 3 ADHD」 25–26쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD 평가척도(ADHD rating scale)에 대한 설명으로 옳은 것은?","choices":["주로 자폐 증상을 평가한다","ADHD를 확진하는 검사다","50개 문항으로 이루어져 있다","18문항, 홀수 부주의·짝수 과잉행동-충동성","교사만 작성할 수 있는 척도다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 3 25–26쪽·교수님: 가장 많이 쓰는 스크리닝 도구. 18문항(9+9), 홀수 = 부주의, 짝수 = 과잉행동(앞 6개)·충동성(뒤 3개). 부모용·교사용 – 초1·초4·중1·고1 전체가 받는 정서행동특성검사에도 쓰인다. IOWA 코너스 교사 평가척도(10문항)는 ODD 감별 가능.","exps":["ADHD 척도다.","스크리닝이다.","18문항이다.","정답.","부모용도 있다."],"ai":"","fl":{}},{"k":"psy-ad-08","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 3 ADHD」 28쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"전산화 지속수행검사(CPT)에서 \"세모가 나올 때만 누르라\"고 했을 때, 세모가 아닌데도 자꾸 누르는 것이 주로 반영하는 것은?","choices":["지능 저하","부주의","시력 문제","충동성","불안"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 세모가 나왔는데 못 누르면 부주의(누락 오류), 세모가 아닌데 막 누르면 과잉행동·충동성(오경보 오류). 약 복용 전후 비교, 호전 정도 평가에도 쓴다.","exps":["해당 없다.","세모인데 못 누르는 것이다.","해당 없다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ad-09","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 3 ADHD」 31–32쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD와 동반질환에 대한 설명으로 옳은 것은?","choices":["가장 흔한 동반은 ODD이고 순수 ADHD는 약 30%","동반질환 없는 순수한 ADHD가 대부분이다","불안·우울장애는 거의 동반되지 않는다","틱장애는 거의 동반되지 않는다","동반질환 여부는 예후와 관계가 없다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 가장 흔한 동반질환 ODD(40–50%), 순수 ADHD 30%, 원인 80% 유전 – 비율이 야마 선지로 나와 암기 권장\n\n강의록 3 31–32쪽(MTA study)·교수님: ADHD alone 31%, ODD 40%, 불안/기분 38%, 품행장애 14%, 틱 11%. 순수한 ADHD는 30%밖에 안 되고 나머지는 1–2개, 많게는 3–4개를 동반. 품행 문제가 동반되면 예후가 나쁘다.","exps":["정답.","약 30%뿐이다.","많이 동반된다.","약 10% 동반.","나빠진다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-10","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 4」 1–6쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD의 원인에 대한 설명으로 옳은 것은?","choices":["부모의 양육 잘못이 주원인이다","설탕·식품첨가물이 주원인이다","뇌 MRI 소견으로 진단한다","환경 요인은 전혀 관련이 없다","약 80%는 유전 요인, 일란성 일치율이 높다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 가장 흔한 동반질환 ODD(40–50%), 순수 ADHD 30%, 원인 80% 유전 – 비율이 야마 선지로 나와 암기 권장\n\n강의록 4 1–6쪽·교수님: 80%는 유전적·타고난 요인(일란성 일치율↑), 전전두엽 기능 이상, 도파민·노르에피네프린 이상(이에 작용하는 약이 효과 – 약물치료 근거). 나머지 20%는 환경(임신 중 흡연·음주, 미숙아, 출생 시 뇌손상, 출생 후 납 등 중금속). 뇌 영상 차이는 집단 통계일 뿐 진단에 쓰지 않는다.","exps":["편견이다.","편견이다.","진단에 쓰지 않는다.","20% 정도 관여한다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-11","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 7·31쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD 치료에서 교수님이 \"핵심\"으로 꼽은 두 가지는?","choices":["특수교육과 작업치료","놀이치료와 가족치료","약물치료와 인지행동치료","감각통합과 언어치료","입원치료와 전기경련치료"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 7·31쪽·교수님: 핵심은 약물치료와 인지행동치료(참을성 훈련) – 부모역할 훈련은 이 내용을 부모에게 가르치는 것, 사회기술훈련은 그룹 CBT와 같이. 놀이·가족치료·특수교육은 case by case. 효과는 약물 + 행동치료 병합이 가장 좋고, 여의치 않으면 심한 아이는 약물치료라도 해야 한다.","exps":["보조 치료다.","기타 치료다.","정답.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ad-12","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 8–11쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"methylphenidate에 대한 설명으로 옳은 것은?","choices":["통상 용량에서 중독성과 금단이 심하다","도파민 재흡수를 차단하며 약 80%에서 효과","노르에피네프린만 선택적으로 차단한다","국내에는 아직 들어와 있지 않다","기본형도 작용 시간이 24시간 이상이다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 8–11쪽·교수님: 도파민·NE 재흡수 차단 → 시냅스 농도↑. 약 80%에서 효과(FDA 승인). 국내엔 MPH 계열만 있고 amphetamine은 없다(미국은 Adderall이 많이 팔림). 통상 용량에선 중독·금단이 별로 없지만 갈아서 주사하면 위험. 기본형 IR(리탈린)은 약 4시간 → 하루 1회 서방형(OROS 콘서타 등)을 주로 쓴다.","exps":["별로 없다.","정답.","아토목세틴 설명이다.","MPH만 있다.","IR 약 4시간, 서방형 10–12시간."],"ai":"","fl":{}},{"k":"psy-ad-13","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 12쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"atomoxetine의 특징으로 옳지 않은 것은?","choices":["중추신경자극제가 아니다","불면보다 오히려 졸림이 올 수 있다","틱·불안 동반 ADHD에서 유리하다","methylphenidate보다 효과가 더 강하다","주로 노르에피네프린에 작용한다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 12쪽·교수님: NE 재흡수 억제제, 비자극제, 잠이 오고 메스꺼움, 작용 시간이 길어 하루 1회, 틱·불안 동반 시 유리. 가장 문제는 효과 부족 – MPH가 70–80%라면 atomoxetine은 체감 약 50%.","exps":["옳다.","옳다.","옳다.","정답. 효과는 다소 부족하다.","옳다."],"ai":"","fl":{}},{"k":"psy-ad-14","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 14쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"methylphenidate의 부작용과 대처로 옳지 않은 것은?","choices":["식욕 감소 – 식후 복용","대부분 부작용 때문에 복용을 중단한다","두통·복통 – 대부분 초기에 생겼다가 좋아진다","성장 – 주기적으로 키·몸무게를 잰다","불면 – 복용 시간 조절"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 14쪽·교수님: 식욕 감소(점심 입맛↓, 저녁에 확 올라옴 – 오래감), 수면 문제, 두통·복통, 예민성은 초기 일시적. 부작용으로 중단하는 경우는 약 5%. 성장은 영향 가능성(0.5–2 cm/2년?) – 교수님은 3–6개월마다 키·몸무게를 재고, 안 크면 약을 줄여 본다. 약물 휴일도 쓴다.","exps":["옳다.","정답. 약 5%만 중단한다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-ad-15","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 15–16쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 6시간짜리 ADHD 약을 부모에게 \"신데렐라 같은 약\", \"안경 같은 약\"이라고 설명하는 의미로 옳은 것은?","choices":["한 번 먹으면 영구적으로 낫는다","누구나 공부를 잘하게 하는 약이다","통상 용량에서도 중독성이 강하다","일반인에게도 같은 효과가 크다","약 기운이 떨어지면 원래대로 돌아온다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 15–16쪽·교수님: 학교에서는 차분하다가 1–2시에 집에 오면 원래대로(신데렐라). 안경을 쓴다고 시력이 좋아지진 않지만 써야 칠판이 보이듯. 다만 긍정적 피드백이 쌓이면 나중에 참을성이 생길 여지가 있다 – 경험적으로 약 2년(1–2년은 기본). \"공부 잘하는 약\"은 잘못된 정보.","exps":["아니다.","잘못된 정보다.","통상 용량에선 아니다.","보통 사람은 조금만 좋아진다.","정답."],"ai":"","fl":{}},{"k":"psy-ad-16","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 18–19쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD 아이의 자기지시 훈련(self-instruction training)에 대한 설명으로 옳은 것은?","choices":["큰소리 시범부터 점차 속으로 따라 하게 한다","약물치료 대신 항상 단독으로 쓴다","부모는 참여하지 않는다","잘못했을 때의 처벌을 중심으로 한다","치료자가 처음부터 속으로만 생각하게 한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 18–19쪽·교수님: 문제 파악 → 계획 → 실행 → 선택 → 검토(자기 강화) → 실패 시 coping self-talk. 치료자나 엄마가 큰소리로 중얼중얼 시범을 보이고 점점 작은 소리, 입만 뻥끗, 머릿속으로 – 반복해 각인. 즐거운 분위기에서.","exps":["정답.","병행한다.","부모도 가르친다.","해당 없다.","큰소리부터다."],"ai":"","fl":{}},{"k":"psy-ad-17","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 20쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD 아동 행동치료에서 모델링 방식으로 더 적합하다고 제시된 것은?","choices":["coping behavior modeling","mastery behavior modeling","response cost","flooding","aversion therapy"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 20쪽: mastery 모델링은 아이가 \"선생님은 하지만 난 못 해요\"라고 반응하기 쉬워 효과적이지 못하다. coping 모델링은 치료자가 실수하고 어려움에 부딪혀도 대처하는 모습을 보여 ADHD에 더 적합.","exps":["정답.","덜 효과적이다.","행동 수반성 기법이다.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ad-18","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 21–27쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"행동치료 기법에 대한 교수님 설명으로 옳지 않은 것은?","choices":["보상은 돈으로 주는 것이 가장 바람직하다","할머니 법칙 – 숙제를 먼저 하면 게임 시간을 더 준다","반응 대가 – 잘못하면 토큰을 빼앗는다","토큰 경제 – 바람직한 행동마다 스티커를 주고 모으면 보상","타임아웃 – 벽 보고 5분 서 있기처럼 비학대적인 처벌"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 21–27쪽·교수님: 토큰 경제(포도송이 스티커, 위시리스트 10개), 할머니 법칙, 타임아웃(한 번 기회를 주고), 반응 대가는 뺏는 것이라 좋지는 않아 잘 안 쓴다. 돈으로 주는 것은 바람직하지 않다 – 가뜩이나 물질적인데 돈만 밝히게 된다.","exps":["정답.","옳다.","옳다(잘 쓰지 않음).","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-ad-19","area":"탈야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 26–27쪽","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD 부모역할 훈련 프로그램 내용으로 강의록에 제시되지 않은 것은?","choices":["아이의 문제를 부정하고 기대 수준을 높이기","올바른 처벌 방법(타임아웃·반응 대가)","긍정적 강화 방법","공공장소 문제행동 조절(Think aloud–Think ahead)","ADHD 원인·증상·예후 교육"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 26–27쪽: 부모가 자녀의 결함을 수용하고 기대 수준을 조절하도록 돕는다. ADHD 교육, 상호작용 원리, 긍정적 강화, 올바른 처벌, 공공장소 조절, 자기지시 훈련 소개, 유지·일반화, 1달 후 booster session.","exps":["정답. 수용하고 기대를 조절한다.","제시됨.","제시됨.","제시됨.","제시됨."],"ai":"","fl":{}},{"k":"psy-ad-20","area":"탈야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 32–34쪽","year":"","type":"객","rep":1,"repyears":"","stem":"학교와 부모가 함께하는 행동요법(평가카드 등)의 주의점으로 옳은 것은?","choices":["문제 항목 몇 가지만 골라 교사·부모가 협조","학교에서의 문제에는 효과가 없다","문제 항목을 최대한 많이 넣는다","교사의 객관적 평가는 필요 없다","시행 비용이 많이 들어 부담된다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 32–33쪽: 장점 – 학교 문제 개선에 매우 효과적, 편리, 비용이 들지 않음. 주의 – 교사·부모의 긴밀한 협조, 교사의 객관적 평가. 가장 문제되는 항목 몇 가지를 골라 쓴다. 칭찬 듣는 아이는 칭찬 받을 행동을 한다(자기충족적 예언).","exps":["정답.","매우 효과적이다.","몇 가지만 고른다.","객관적 평가가 중요하다.","비용이 들지 않는다."],"ai":"","fl":{}},{"k":"psy-y-nd-adhd-2025","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2025 객15","type":"객","rep":4,"repyears":"2017 객24 · 2014 객3 · 2011 객42","stem":"한 아이가 수업시간에 자꾸 돌아다니고 친구들이랑 싸워서 병원에 진료를 보러왔다. 다음중 ADHD의 임상특징 중 옳은 것은?","choices":["남자보다 여자가 더 많다","30%에서 다른 질환을 동반한다","과잉행동이 먼저 호전된다","제일 흔한 동반질환은 불안장애이다","성인 ADHD 유병률은 소아의 1/3이다"],"ans":[3],"imgs":[],"vis":[],"notes":["복원자: 문제 문장은 정확히 기억나지 않아 요지만 복원."],"basis":"📌 티야방(고을민): 과잉행동은 빠르게 감소, 부주의는 성인까지, 충동성은 사춘기에 상승 – 행동문제 동반 시 반사회성 인격장애로 이행(재언급)\n\nADHD: 소아는 남아에 많고(성인은 비슷), 순수 ADHD가 30%이고 70%는 동반질환, 가장 흔한 동반은 적대적 반항장애. 과잉행동이 가장 먼저 호전되고 부주의·충동성은 지속 – 성인은 부주의 우세형이 많다. 2/3까지 성인기 지속.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-nd-adhd-2017","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2017 객24","type":"객","rep":4,"repyears":"2025 객15 · 2014 객3 · 2011 객42","stem":"8세 남아가 수업시간에 떠들고 돌아다니며, 친구들을 건드리며, 물건을 자주 잃어버리는 증상으로 내원했다. 지능검사는 정상범위이며 성적은 하위권이다. 이 증상에 대한 설명 중 옳은 것은?","choices":["내년이 되면 물건을 잃어버리는 일이 줄어들 것이다.","어른이 되면 증상이 호전된다.","청소년이 되면 분노가 잘 나타난다.","어른이 되면 사회적 문제는 감소한다.","약물치료보다 행동치료만 하면 예후가 안 좋은 편이다."],"ans":[5],"imgs":[],"vis":[],"notes":["복원자: ③도 애매하지만 수업에서 청소년기는 분노보다 충동성을 강조해 ⑤로 올림."],"basis":"📚 학습지 해설 요약: ADHD 치료 성공률(강의록 4 31쪽): 약물 + 행동치료 > 약물치료 > 행동치료. 부주의는 성인까지, 충동성으로 성인기에도 잦은 이직·충돌.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-adhd-2014","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2014 객3","type":"객","rep":4,"repyears":"2025 객15 · 2017 객24 · 2011 객42","stem":"8세 된 초등학교 2학년 남아가 외래를 방문했다. 어머니에 따르면 환자가 어려서부터 매우 산만했고 학교 수업시간에도 가만히 앉아 있지 못해 선생님으로부터 계속 지적을 받는다고 한다. 위 증례에서 가장 가능성이 높은 질환에 대한 설명이다. 옳은 것은?","choices":["남자보다 여자아이에서 흔하다.","대뇌 부위 중 변연계의 기능저하와 관련 있다.","생후 초기부터 까다롭고 활동이 많았던 경우가 흔하다.","성장하면서 과다행동이 가장 늦게 없어진다.","생후 초기부터 언어발달이 빠른 경우가 많다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설 요약: ADHD: 남아에 많고, 전(전)두엽 기능 저하, 유아기부터 자극에 민감하고 까다로우며 활동이 많다, 과다행동이 가장 먼저 호전.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-adhd-2011","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2011 객42","type":"객","rep":4,"repyears":"2025 객15 · 2017 객24 · 2014 객3","stem":"초등학교 1학년 아이가 수업시간에 돌아다니고 집중을 못한다고 내원하였다. 진료실에서도 가만히 있지 못하고 돌아다녀 주의를 주었으나 이러한 행동이 계속 되었다. 가장 가능성이 높은 질환에 대한 설명 중 옳은 것은?","choices":["충동적인 면은 사춘기가 되면 감소한다.","사춘기 이후 흔히 양극성 장애로 이어진다.","도파민 수용체 길항제를 우선적으로 사용한다.","품행장애가 동반되면 흔히 반사회적 인격장애로 이어진다.","증상이 심한 경우 특수교육적 중재를 우선적으로 시행한다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설 요약: ADHD: 충동성은 청소년기에 오히려 심해지고 성인까지, 약물은 methylphenidate(도파민 재흡수 차단, 길항제 아님), 품행 문제가 동반되면 반사회적 인격장애로 갈 수 있다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-adhd-co-2015","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2015 객26","type":"객","rep":1,"repyears":"","stem":"초등학교 1학년 남아가 수업 중 돌아다니고 친구들을 건들며 물건을 자주 잃어버리는 증상으로 내원했다. 지능검사는 정상범위이며 성적은 하위권이다. 이 질환과 가장 흔히 동반되는 진단은?","choices":["우울장애","불안장애","지적장애","강박장애","행동장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 가장 흔한 동반질환 ODD(40–50%), 순수 ADHD 30%, 원인 80% 유전 – 비율이 야마 선지로 나와 암기 권장\n\nADHD에 가장 흔히 동반되는 것은 적대적 반항장애(약 40%) – 품행장애와 묶어 행동장애(파탄적 행동장애).","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-nd-inatt-2018","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2018 객26","type":"객","rep":2,"repyears":"2013 객41","stem":"10세 남자아이가 (A)과제물을 자주 잊어버리고, (B)수업 중에 돌아다닌다는 증상으로 정신과를 내원하였다. (C)평소 지나치게 말이 많았으며, (D)질문이 끝나기도 전에 불쑥 대답을 하며, (E)순서를 기다리지 못했다. 밑줄 친 증상 중 부주의에 해당되는 증상은?","choices":["(A)","(B)","(C)","(D)","(E)"],"ans":[1],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2013 객41"],"basis":"📌 티야방(고을민): 학령기 ADHD 증상을 부주의·과잉행동·충동성으로 구분 (특별한 TY는 없어 Y 위주 정리)\n\nADHD 부주의 증상: 실수, 집중 곤란, 조직화 곤란, 경청하지 않음, 물건을 잃어버림·잊어버림, 집중 필요한 과목 회피. 과잉행동: 돌아다님·꼼지락·말이 많음. 충동성: 질문이 끝나기 전 대답, 차례를 못 기다림, 끼어듦.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-nd-adhd-tx-2025","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2025 객16","type":"객","rep":4,"repyears":"2014 객4 · 2016 객24 · 2013 객46","stem":"9세 남아가 수업시간에 떠들고 돌아다니면서 친구들을 건든다는 증상으로 내원했다. 적절한 치료법은?","choices":["행동치료","놀이치료","상담치료","언어치료","감각통합훈련"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설 요약: ADHD 핵심 치료는 약물치료(methylphenidate)와 인지행동치료(멈추고 생각하기, 자기지시 훈련, 토큰 경제).","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-adhd-tx-2014","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2014 객4","type":"객","rep":4,"repyears":"2025 객16 · 2016 객24 · 2013 객46","stem":"8세 된 초등학교 2학년 남아가 외래를 방문했다. 어머니에 따르면 환자가 어려서부터 매우 산만했고 학교 수업시간에도 가만히 앉아 있지 못해 선생님으로부터 계속 지적을 받는다고 한다. 위 증례의 일반적인 치료원칙에 대한 설명 중 옳은 것은?","choices":["주변 자극을 줄여주고 조용한 환경을 만들어 준다.","약물치료로는 세로토닌 재흡수 차단제가 선택된다.","문제 행동에 대해서는 종종 체벌이 필요하다.","일대일 방식의 교육지도보다는 그룹형태의 교육이 필요하다.","토큰경제와 같은 보상을 이용하는 행동치료는 사용하지 않는다."],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설 요약: ADHD: 자극을 줄이면 부주의 개선에 도움, 약물은 중추신경자극제(SSRI 아님), 체벌은 충동성 악화, 일대일 지도가 낫고, 토큰 경제 등 행동치료를 쓴다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-adhd-tx-2016","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2016 객24","type":"객","rep":4,"repyears":"2025 객16 · 2014 객4 · 2013 객46","stem":"8세 남아가 수업시간에 떠들고 돌아다니는 증상으로 내원하였다. 다음 중 가장 먼저 시행해야 할 것은?","choices":["약물치료실시","사회성숙도 검사 실시","부모와 아동의 심리검사 실시","부모에게 아이가 집에서는 어떤지 물어본다.","약물치료와 집단인지행동치료를 함께 실시한다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설 요약: ADHD는 두 가지 이상의 장면(학교·집)에서 증상이 있어야 한다 – 먼저 집에서는 어떤지 확인. 교수님: 한 곳에서만 그러면 다른 원인을 먼저 찾는다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-adhd-tx-2013","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2013 객46","type":"객","rep":4,"repyears":"2025 객16 · 2014 객4 · 2016 객24","stem":"초등학교 1학년인 8세 남아가 약속을 잊고 물건을 잃어버렸고 수업 도중에는 자주 끼어들었다. 이에 우선적으로 사용할 수 있는 약물이 아닌 것은?","choices":["Atomoxetine","Clonidine","Dextroamphetamine","Imipramine","Haloperidole"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설 요약: ADHD 약물: 중추신경자극제(methylphenidate, d-amphetamine), atomoxetine(NE), clonidine·guanfacine, TCA(imipramine) 등. haloperidol 같은 항정신병약물은 자폐·지적장애 동반 시 증상 조절용.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-tic-dx-2025","area":"야마","prof":"박태원","sec":"틱장애 (야마 · 수업 전)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2025 객12","type":"객","rep":4,"repyears":"2019 객23 · 2018 객23 · 2016 객23","stem":"9세 여아가 2년 전부터 시작된 이상 운동으로 내원하였다. 환자는 고개를 흔들고, 코를 찡긋거리는 것을 반복하였다. 얼마 전부터 ‘킁킁’거리는 것을 하다가 최근에는 사라졌다. 진단은?","choices":["언어장애","뚜렛장애","잠재성 틱장애","만성 운동틱 장애","주의력결핍과잉행동장애"],"ans":[2],"imgs":[],"vis":[],"notes":["복원자: 박태원 교수님 5분이 각각 10문제씩 총 50문제 객관식."],"basis":"📚 학습지 해설 요약: 틱장애(DSM-5, 모두 18세 이전 발병): 뚜렛장애 = 여러 운동틱 + 1개 이상 음성틱(동시일 필요 없음), 1년 이상 / 지속성(만성) 운동 또는 음성 틱장애 = 한 종류만, 1년 이상 / 잠정적 틱장애 = 1년 미만 / 18세 이후 발병 등 기준에 맞지 않으면 달리 명시된 틱장애. 운동틱 2개 + 음성틱 1개, 2년 → 뚜렛.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-tic-dx-2019","area":"야마","prof":"박태원","sec":"틱장애 (야마 · 수업 전)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2019 객23","type":"객","rep":4,"repyears" 7교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"🤍형성평가 22세 여성이 서서히 체중이 줄어 키 162cm, 체중 33kg가 되었다. 2년 전 부모와 갈등이 생기면서부터 증상이 시작되었는데, 불규칙적으로 식사를 하고 본인이 좋아하는 야채와 음료만을 많이 먹은 후 즉시 토하거나 설사를 자주 하였고, 근래에는 6개월간 생리가 없었다. 그러나 환자는 체중을 더 줄여야 한다며 거의 매일 자전거를 타고 있다. 진단은?","choices":["급식장애","폭식장애","신경성 폭식증","신경성 식욕부진증, 제한형","신경성 식욕부진증, 폭식/제거형"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"수업 중 교수님 풀이: 5번 신경성 식욕부진증, 폭식/제거형. 심한 저체중(신경성 \"저체중증\")이면서 먹고 토하는 제거 행동이 반복되므로 폭식증이 아니라 식욕부진증의 폭식/제거형. 교수님 실제 환자(160cm·26kg, 요플레·양배추만 먹고 토함, 자전거) 이야기와 같은 문제.","exps":["식사 거부가 아니라 섭식장애다.","보상행동이 있다.","저체중이면 식욕부진증이 우선이다.","제거 행동이 반복된다.","정답. 저체중 + 제거 행동."],"ai":"","fl":{}},{"k":"psy-ea-01","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: STT 10/20 7교시(양종철) · 교과서 17장(급식 및 섭식장애)","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 신경성 식욕부진증(anorexia nervosa)을 개념상 \"신경성 저체중증\"이라고 부르자고 한 이유는?","choices":["주관식 답안으로 써도 되기 때문에","젊은 남자에서 더 흔하기 때문에","대부분 체중이 정상이기 때문에","핵심은 저체중이고, 1/3은 폭식·구토도 해서","환자들이 식욕을 항상 잃기 때문에"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 이름 때문에 꼭 안 먹는 것 같지만 많이 먹고 토하기도 잘한다. 핵심은 정상 수준보다 현저히 떨어진 저체중과 신체상 왜곡. 교과서도 환자의 1/3은 폭식 삽화, 1/3은 보상행동이 있다고 한다. 단, 시험 주관식에 \"신경성 저체중증\"이라고 쓰면 틀린다.","exps":["쓰면 틀린다고 했다.","젊은 여성에 많다.","저체중이 핵심이다.","정답.","식욕 상실이 항상 있는 것은 아니다."],"ai":"","fl":{}},{"k":"psy-ea-02","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: STT 10/20 7교시(양종철) · 교과서 17장(급식 및 섭식장애) 421쪽","year":"","type":"객","rep":1,"repyears":"","stem":"폭식과 제거 행동을 반복하는 환자가 신경성 식욕부진증 수준으로 체중이 빠져 있을 때 내리는 진단은?","choices":["신경성 폭식증","두 진단을 함께 붙인다","신경성 식욕부진증, 폭식/제거형","회피적/제한적 음식섭취장애","폭식장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"교수님(교과서 421쪽 감별): 폭식 행동이 신경성 식욕부진증 기간에만 일어나면 anorexia nervosa 폭식/제거형으로 진단하고 bulimia를 추가하지 않는다. 정신과 진단은 더 심각한 것(금메달)을 내린다 – 조현병이 있으면 NOS를 붙이지 않는 것과 같다.","exps":["저체중이면 식욕부진증이다.","추가하지 않는다.","정답.","신체상 왜곡이 없다.","제거 행동이 있다."],"ai":"","fl":{}},{"k":"psy-ea-03","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: STT 10/20 7교시(양종철) · 교과서 17장(급식 및 섭식장애) 421쪽","year":"","type":"객","rep":1,"repyears":"","stem":"5년 전 신경성 식욕부진증(30kg대)이었던 사람이 체중이 50kg로 회복된 뒤에도 먹고 토하기를 반복한다면 현재 진단은?","choices":["급식장애","폭식장애","신경성 식욕부진증, 폭식/제거형","신경성 폭식증","야식증후군"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 초기 진단이 식욕부진증이었더라도 현재 저체중이 아니면서 폭식과 제거 행동을 하면 신경성 폭식증. 식욕부진증은 저체중이 반드시 있어야 한다. (2019 야마와 같은 상황)","exps":["해당 없다.","보상행동이 있다.","저체중이 아니다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ea-04","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: STT 10/20 7교시(양종철) · 교과서 17장(급식 및 섭식장애) 419–423쪽","year":"","type":"객","rep":1,"repyears":"","stem":"신경성 폭식증과 폭식장애를 구별하는 핵심은?","choices":["환자의 성별 분포","처음 발병한 연령","폭식하는 시간대(밤·낮)","한 번에 먹는 폭식의 양","정기적인 보상(제거) 행동의 유무"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 둘 다 폭식은 같고, 폭식장애는 딱 하나 – 보상행동을 하지 않는다(그래서 대개 과체중·비만). \"정기적으로\"를 강조 – 한 번 토한 날이 있다고 폭식증이 되지는 않는다. 폭식증은 체중이 정상 범위이거나 약간 통통.","exps":["해당 없다.","해당 없다.","야식증후군의 기준이다.","둘 다 많이 먹는다.","정답."],"ai":"","fl":{}},{"k":"psy-ea-05","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: 강의록 「2026 급식 및 식사장애」 5쪽 · STT 10/20 7교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 신경성 폭식증 진단 기준으로 옳은 것은?","choices":["체중이 정상의 85% 미만이어야 한다","체형과 체중은 자아 평가와 관계없다","폭식이 하루 1회 이상, 1년 동안","보상행동 없이 폭식만 있으면 된다","폭식과 보상행동이 주 1회 이상, 3개월"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 5쪽·교수님: 폭식(2시간 이내 대부분 사람보다 명백히 많이 + 조절 상실감) + 반복적·부적절한 보상행동, 둘 다 평균 주 1회 이상 3개월, 체형·체중이 자아 평가에 과도한 영향, 식욕부진증 삽화 중에만 있는 것이 아님. 중증도는 보상행동 빈도(경도 주 1–3, 중등도 4–7, 중증 8–13, 극심 14회 이상).","exps":["식욕부진증 기준이다.","과도한 영향을 미친다.","주 1회·3개월이다.","보상행동도 필요하다.","정답."],"ai":"","fl":{}},{"k":"psy-ea-06","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: 강의록 「2026 급식 및 식사장애」 7쪽 · STT 10/20 7교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"야식증후군(night eating syndrome) 기준에 대한 교수님 설명으로 옳은 것은?","choices":["저녁 이후 섭취가 하루의 25% 이상(또는 주 2회 이상)","저녁식사 이후 섭취량이 하루의 10% 이상","아침 식욕은 오히려 증가한다","밤에 한 번이라도 먹으면 진단"," -5 신체증상장애(somatic symptom disorder)에 대한 설명으로 옳은 것은?","choices":["증상이 1개월만 지속되면 진단한다","통증 증상이 4개 이상 있어야 한다","신체 증상이 전혀 없어야 진단한다","검사상 모두 음성이어야 진단할 수 있다","실제 신체 질환이 있어도, 증상이 하나여도 진단 가능"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님(교과서 395–396쪽): 의학적 설명의 유무를 가리지 않는 것이 가장 큰 변화 – 유방암 재발 공포, 당뇨 최악의 합병증만 생각하는 경우도 해당. 증상의 심각성에 대한 지속적 생각, 높은 건강 불안, 과도한 시간·에너지 중 하나, 전반적 상태가 6개월 이상.","exps":["6개월 이상이다.","없어진 기준이다.","질병불안장애다.","DSM-IV 신체형 장애의 조건이다.","정답."],"ai":"","fl":{}},{"k":"psy-so-03","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: STT 10/20 8교시(양종철) · 교과서 16장(신체증상 및 관련 장애) 399–400쪽","year":"","type":"객","rep":1,"repyears":"","stem":"신체 증상은 없거나 아주 경미한데 심각한 병에 걸렸다는 생각에 6개월 이상 몰두하는 경우의 진단은?","choices":["전환장애","질병불안장애","인위성장애","신체이형장애","신체증상장애"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 질병불안장애는 \"생각만\" – 신체 증상이 없다. 있으면 신체증상장애. 머리가 실제로 아프면서 뇌종양이라 하는 사람과, 아프지도 않은데 뇌종양 같다는 사람 중 후자만 질병불안장애. (2019 야마: 두통 + 뇌전이 걱정 → 신체증상장애)","exps":["운동·감각 기능 상실이다.","정답.","일부러 만든다.","외모 결함 몰두다.","증상이 있을 때다."],"ai":"","fl":{}},{"k":"psy-so-04","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 강의록 「Somatic Symptom and Related Disorders」 6쪽 · STT 10/20 8교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"전환장애에 대한 설명으로 옳은 것은?","choices":["주된 방어기제는 승화와 이타주의다","사춘기·초기 성인 여성에 많고 억압과 전환이 관여","교육 수준이 높아지면서 늘고 있다","주로 노인 남성에게 흔하다","환자가 일부러 증상을 만든다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6쪽·교수님: 갑작스러운 수의운동·감각 기능 이상(마비, 실어, 실명). 0.2%, 여자가 2–10배(교과서), 사춘기·초기 성인기. 억압과 전환 – 표현하지 못한 심리적 에너지가 신체 증상으로. 일부러 하는 게 아니다(꾀병 아님). 교육 수준·의학 상식이 늘면서 줄어드는 추세.","exps":["억압과 전환이다.","정답.","줄어드는 추세다.","젊은 여성에 많다.","일부러가 아니다."],"ai":"","fl":{}},{"k":"psy-so-05","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 강의록 「Somatic Symptom and Related Disorders」 6쪽 · STT 10/20 8교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"남편과 다투다 손이 마비되어 더 이상 싸우지 않게 된 것처럼, 증상을 통해 갈등을 피하는 이득은?","choices":["la belle indifference","symptom identification","꾀병","이차 이득(secondary gain)","일차 이득(primary gain)"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 일차 이득 = 갈등 회피(마비가 오면 더 이상 갈등할 게 없어진다). 이차 이득 = 관심과 보호(남편이 \"앞으로 7시면 칼퇴근\"). 나중에 엄청 헷갈리니 구분할 것.","exps":["무관심한 태도다.","증상 모방이다.","일부러가 아니다.","관심·보호를 얻는 것이다.","정답."],"ai":"","fl":{}},{"k":"psy-so-06","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 강의록 「Somatic Symptom and Related Disorders」 6쪽 · STT 10/20 8교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"전환장애에서 주위 사람들은 몹시 걱정하는데 정작 환자는 별로 걱정하지 않는 태도를 무엇이라 하는가?","choices":["primary gain","la belle indifference","Hoover sign","malingering","symptom identification"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"교수님: la belle indifference(만족스러운 무관심) – 심리적 갈등으로 증상이 나왔고 심리적 이득도 있으니 본인은 정작 편하다. symptom identification은 TV·가족(고인)의 증상을 모델로 증상이 나타나는 것.","exps":["갈등 회피 이득이다.","정답.","마비 감별 검사다.","꾀병이다.","증상 모방이다."],"ai":"","fl":{}},{"k":"psy-so-07","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 강의록 「Somatic Symptom and Related Disorders」 6쪽 · STT 10/20 8교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"전환장애의 진단과 치료에 모두 이용되는 것은?","choices":["직면","반복 검사","암시","노출과 반응방지","혐오요법"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"교수님: \"손 펴 보세요 – 안 되죠, 새끼손가락 손톱만 움직여 보세요 – 되죠\" 피암시성으로 진단하고, \"이 주사 맞고 3시간 뒤엔 손가락이 펴질 거예요\"처럼 조금씩 빠져나오게 치료한다(face saving). \"마음의 문제, 신경성\"이라고 직면시키면 안 된다.","exps":["좋지 않다.","한 번에 끝내야 한다.","정답.","강박장애 치료다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-so-08","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: STT 10/20 8교시(양종철) · 교과서 16장(신체증상 및 관련 장애) 400–403쪽","year":"","type":"객","rep":1,"repyears":"","stem":"한쪽 다리 마비를 호소하는 환자에서 건측 다리를 들게 할 때 마비측 발꿈치 아래의 손이 눌리는 것을 확인하는 검사는?","choices":["Babinski sign","Phalen test","Lasègue test","Hoover test","Romberg test"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님: Hoover test – 반듯이 누워 건측 다리를 들면 반대쪽 발꿈치가 바닥을 누르게 된다. 마비라던 다리의 발꿈치 밑 손에 누르는 힘이  shopping: 신체형 장애(신체화장애·동통장애·건강염려증), 신체이형장애(성형외과 전전). 강박장애는 해당 없음.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pm-ibs-2012","area":"야마","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 학습지 「정신신체의학」 224–230쪽","year":"2012 객23","type":"객","rep":1,"repyears":"","stem":"40대 여성이 보통, 설사, 변비가 반복되는 증상으로 소화기 내과에서 각종 검사를 받았으나 특별한 병변을 찾지 못하고, 장이 과민해서 발생한 병으로 진단 받고 수개월간 치료를 받았다. 그러나 큰 호전이 없어 정신과 외래를 방문하였다. 이 여성의 진단명에 대한 설명으로 가장 옳은 것은?","choices":["미주신경 활동의 저하","심적 변화로 장운동변화","대장내 전기활동도 저하","관련 사고장애의 치료","70%에서 내과적 문제"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설 요약: 과민성 대장 증후군: 정서적 스트레스 → 미주신경 활동 증가 → 장운동 변화.","exps":[],"ai":"","fl":{}}]</script>
<script>
(function(){
var APP='psy-app';
var Q=JSON.parse(document.getElementById('data').textContent);
var byK={};Q.forEach(function(q,i){q.i=i;byK[q.k]=q});
var LK=APP+'-state-v1',UK=APP+'-ui-v1';
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
// S.a[k]={c:마지막 선택,ok,w:틀린 횟수,n:푼 횟수,t}  S.f[k]={conf,err,oos,out,t}  S.m[k]={x:메모,t}
var S=lsGet(LK)||{a:{},f:{},m:{}};['a','f','m'].forEach(function(x){S[x]=S[x]||{}});
var U=lsGet(UK)||{};
var $=function(id){return document.getElementById(id)};
function now(){return Date.now()}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- 필터 ---------- */
function opts(sel,first,vals){sel.innerHTML='<option value="">'+first+'</option>'+vals.map(function(v){return '<option value="'+esc(v[0])+'">'+esc(v[1])+'</option>'}).join('')}
var profs=[],secs=[],areas=[];
Q.forEach(function(q){if(q.prof&&profs.indexOf(q.prof)<0)profs.push(q.prof);var s=q.sec;if(s&&!secs.some(function(x){return x[0]===s}))secs.push([s,s+(q.prof?' · '+q.prof:'')]);if(areas.indexOf(q.area)<0)areas.push(q.area)});
opts($('fProf'),'전체 교수',profs.map(function(p){return[p,p]}));
function secOpts(){var p=$('fProf').value;opts($('fSec'),'전체 섹션',secs.filter(function(s){return !p||Q.some(function(q){return q.sec===s[0]&&q.prof===p})}))}
secOpts();
opts($('fArea'),'전체 영역',areas.map(function(a){return[a,a]}));
if(areas.length<2)$('fArea').hidden=true;
if(!Q.some(function(q){return q.rep>1}))$('fRep').hidden=true;
var F={prof:'',sec:'',area:'',type:'',rep:'',st:'',q:'',chip:'',shuf:false,seed:1};
Object.keys(F).forEach(function(k){if(U.f&&U.f[k]!=null)F[k]=U.f[k]});
function syncCtl(){$('fProf').value=F.prof;secOpts();$('fSec').value=F.sec;$('fArea').value=F.area;$('fType').value=F.type;$('fRep').value=F.rep;$('fSt').value=F.st;$('fQ').value=F.q;
  [].forEach.call(document.querySelectorAll('#chips .chip[data-v]'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===F.chip))});$('shuf').setAttribute('aria-pressed',String(!!F.shuf))}
function solved(a){return !!(a&&(a.c!=null||a.self))}
function inWrong(k){var a=S.a[k],f=S.f[k]||{};return !!(a&&a.w>0&&!f.out)}
function memoOf(k){var m=S.m[k];return m&&m.x?m.x:''}
function pass(q){var k=q.k,f=S.f[k]||{},a=S.a[k];
  if(F.prof&&q.prof!==F.prof)return false;if(F.sec&&q.sec!==F.sec)return false;if(F.area&&q.area!==F.area)return false;if(F.type&&q.type!==F.type)return false;
  if(F.rep){var r=q.rep||1;if(F.rep==='3'&&r<3)return false;if(F.rep==='2'&&r!==2)return false;if(F.rep==='23'&&r<2)return false;if(F.rep==='1'&&r!==1)return false}
  var fl=q.fl||{};
  switch(F.st){case'inscope':if(fl.oos||f.oos)return false;break;case'tyb':if(!fl.tyb)return false;break;case'nowarn':if(fl.warn)return false;break;case'chk':if(!fl.chk)return false;break;case'inc':if(!fl.inc)return false;break;case'ydiff':if(!fl.ydiff)return false;break;
    case'img':if(!q.imgs||!q.imgs.length)return false;break;case'noimg':if(q.imgs&&q.imgs.length)return false;break;case'myerr':if(!f.err)return false;break;case'myoos':if(!f.oos)return false;break}
  switch(F.chip){case'new':if(solved(a))return false;break;case'wrong':if(!inWrong(k))return false;break;case'conf':if(!f.conf)return false;break;case'memo':if(!memoOf(k))return false;break}
  if(F.q){var t=(q.year+' '+q.meta+' '+q.stem+' '+q.choices.join(' ')+' '+q.ans.map(function(n){return q.choices[n-1]||''}).join(' ')+' '+q.sec+' '+memoOf(k)).toLowerCase();
    var ws=F.q.toLowerCase().split(/\s+/).filter(Boolean);for(var i=0;i<ws.length;i++)if(t.indexOf(ws[i])<0)return false}
  return true}
function rnd(seed){return function(){seed=(seed*1103515245+12345)%2147483648;return seed/2147483648}}
var L=[],cur=U.cur||null;
function refilter(keep){L=Q.filter(pass);if(F.shuf){var r=rnd(F.seed);for(var i=L.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=L[i];L[i]=L[j];L[j]=t}}
  if(!keep||!L.some(function(q){return q.k===cur}))cur=L.length?L[0].k:null;saveUI();render()}
function saveUI(){lsSet(UK,{f:F,cur:cur})}
function idx(){for(var i=0;i<L.length;i++)if(L[i].k===cur)return i;return -1}

/* ---------- 상단 숫자 ---------- */
function stats(){var n=0,ok=0,wrong=0,memo=0;Q.forEach(function(q){var a=S.a[q.k];if(solved(a)){n++;if(a.ok)ok++}if(inWrong(q.k))wrong++;if(memoOf(q.k))memo++});
  var img=Q.filter(function(q){return q.imgs&&q.imgs.length}).length;
  $('stats').innerHTML='<span>전체<b>'+Q.length+'</b></span>'+(img?'<span>원본 그림<b>'+img+'</b>문항</span>':'')+'<span>푼 것<b>'+n+'</b></span><span>최근 정답<b>'+(n?Math.round(ok/n*100):0)+'%</b></span><span>오답노트<b>'+wrong+'</b></span><span>메모<b>'+memo+'</b></span>'}

/* ---------- 문제 카드 ---------- */
function render(){stats();var i=idx(),v=$('view');
  $('pos').innerHTML=L.length?'<b>'+(i+1)+'</b> / '+L.length:'0 / 0';
  $('prev').disabled=i<=0;$('next').disabled=i<0||i>=L.length-1;
  if(i<0){v.innerHTML='<div class="card empty">조건에 맞는 문제가 없어요. 위 필터나 칩을 바꿔 보세요.</div>';return}
  var q=L[i],k=q.k,a=redo[k]?null:S.a[k],f=S.f[k]||{},hasAns=!!(q.ans&&q.ans.length&&q.choices.length),done=!!(a&&(a.c!=null||a.self||a.pend));
  var h='<article class="card'+(done?' done':'')+'">';
  h+='<div class="head"><span class="pill">'+(q.type==='주'?'주관식':'객관식')+'</span>'+(areas.length>1?'<span class="pill area">'+esc(q.area)+'</span>':'')+(q.rep>1?'<span class="pill king">'+(q.rep>=3?'👑👑 킹킹야':'👑 킹야')+' · '+q.rep+'회</span>':'')+'<span>'+esc(q.prof)+(q.sec?' · '+esc(q.sec):'')+'</span></div>';
  if(q.year||q.meta)h+='<div class="meta">'+esc(q.year?q.year+(q.repyears?' · 반복 '+q.repyears:''):q.meta)+'</div>';
  (q.notes||[]).forEach(function(n){h+='<div class="note'+(/범위\s?외/.test(n)?' oos':'')+'">'+esc(n)+'</div>'});
  if(f.err)h+='<div class="note">⚑ 내가 문제오류로 표시함</div>';if(f.oos)h+='<div class="note oos">내가 범위외로 표시함</div>';
  h+='<div class="stem">'+esc(q.stem)+'</div>';
  if(q.imgs&&q.imgs.length)h+='<div class="imgs">'+q.imgs.map(function(s){return '<img src="'+esc(s)+'" alt="문제 사진" loading="lazy">'}).join('')+'</div>';
  (q.vis||[]).forEach(function(t){h+='<div class="vis">'+esc(t)+'</div>'});
  if(q.choices.length){h+='<div class="choices">';q.choices.forEach(function(c,j){var n=j+1,cl='ch';
      if(done&&hasAns){if(q.ans.indexOf(n)>=0)cl+=' right';else if(a.c===n)cl+=' wrong'}if(done&&a.c===n)cl+=' mine';
      h+='<button class="'+cl+'" data-n="'+n+'"'+(done?' disabled':'')+'><span class="no">'+'①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬'.charAt(j)+'</span><span>'+esc(c)+'</span></button>'});h+='</div>'}
  if(!done&&(!hasAns))h+='<div class="acts"><button class="btn pri" id="reveal">정답·해설 보기</button></div>';
  if(done){
    if(hasAns&&a.c!=null)h+='<div class="result '+(a.ok?'ok':'bad')+'">'+(a.ok?'정답이에요':'오답이에요 · 정답 '+q.ans.join(', ')+'번')+'</div>';
    else h+='<div class="result">'+(hasAns?'정답 '+q.ans.join(', ')+'번':'정답을 확인하고 맞았는지 골라 주세요')+'</div>'+(a&&a.self?'':'<div class="acts"><button class="chip" id="selfOk">⭕ 맞았어요</button><button class="chip" id="selfBad">❌ 틀렸어요</button></div>');
    h+='<div class="exp">';if(q.ai)h+='<div class="ai">'+esc(q.ai)+'</div>';
    if(q.basis)h+='<h3>해설</h3>'+esc(q.basis);
    if(q.exps&&q.exps.length)h+='<h3>선지별 해설</h3><ol>'+q.exps.map(function(e){return '<li>'+esc(e)+'</li>'}).join('')+'</ol>';
    h+='</div>'}
  h+='<div class="acts"><button class="chip" id="tConf" aria-pressed="'+!!f.conf+'">🟡 헷갈림</button>'+(done?'<button class="chip" id="redo">↺ 다시 풀기</button>':'')+(inWrong(k)?'<button class="chip" id="tOut">오답노트에서 빼기</button>':'')+'<button class="chip" id="tErr" aria-pressed="'+!!f.err+'">⚑ 문제오류</button><button class="chip" id="tOos" aria-pressed="'+!!f.oos+'">범위외</button></div>';
  h+='<div class="memo"><label for="memo">내 메모 · 뭐가 헷갈렸는지, 외울 포인트</label><textarea id="memo" placeholder="예: 3번이랑 헷갈림. A는 급성, B는 만성!">'+esc(memoOf(k))+'</textarea><div class="saved" id="memoSt"></div></div>';
  h+='<div class="bottomnav"><button class="btn" id="prev2"'+(i<=0?' disabled':'')+'>이전</button><button class="btn pri" id="next2"'+(i>=L.length-1?' disabled':'')+'>다음</button></div>';
  h+='</article>';v.innerHTML=h;
  [].forEach.call(v.querySelectorAll('.ch'),function(b){b.onclick=function(){answer(q,+b.getAttribute('data-n'))}});
  var r=$('reveal');if(r)r.onclick=function(){var x=S.a[k]||{w:0,n:0};x.c=null;x.self=0;x.pend=1;x.t=now();S.a[k]=x;delete redo[k];changed();render()};
  var so=$('selfOk'),sb=$('selfBad');if(so)so.onclick=function(){self(q,true)};if(sb)sb.onclick=function(){self(q,false)};
  $('tConf').onclick=function(){flag(k,'conf')};$('tErr').onclick=function(){flag(k,'err')};$('tOos').onclick=function(){flag(k,'oos')};
  var o=$('tOut');if(o)o.onclick=function(){flag(k,'out',true)};
  var rd=$('redo');if(rd)rd.onclick=function(){redo[k]=1;render()};
  $('prev2').onclick=go.bind(null,-1);$('next2').onclick=go.bind(null,1);
  var m=$('memo'),mt=null;m.oninput=function(){clearTimeout(mt);$('memoSt').textContent='입력 중…';mt=setTimeout(function(){var x=m.value.trim();if(x)S.m[k]={x:m.value,t:now()};else S.m[k]={x:'',t:now()};changed();stats();$('memoSt').textContent='저장됨'},600)};
}
// 다시 풀기: 기록(틀린 횟수)은 남기고 화면만 처음 상태로
var redo={};
function answer(q,n){var k=q.k,a=S.a[k]||{w:0,n:0};var ok=q.ans.indexOf(n)>=0;
  a.c=n;a.ok=ok;a.self=0;a.n=(a.n||0)+1;if(!ok)a.w=(a.w||0)+1;a.t=now();a.pend=0;S.a[k]=a;delete redo[k];
  if(!ok&&S.f[k]&&S.f[k].out){S.f[k].out=false;S.f[k].t=now()}changed();render()}
function self(q,ok){var k=q.k,a=S.a[k]||{w:0,n:0};a.c=null;a.self=1;a.ok=ok;a.n=(a.n||0)+1;if(!ok)a.w=(a.w||0)+1;a.t=now();a.pend=0;S.a[k]=a;delete redo[k];changed();render()}
function flag(k,name,val){var f=S.f[k]||{};f[name]=val!=null?val:!f[name];f.t=now();S.f[k]=f;changed();render()}
function go(d){var i=idx()+d;if(i<0||i>=L.length)return;cur=L[i].k;saveUI();render();window.scrollTo({top:$('pos').getBoundingClientRect().top+window.scrollY-10})}
$('prev').onclick=go.bind(null,-1);$('next').onclick=go.bind(null,1);
document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});


/* ---------- 필터 이벤트 ---------- */
$('fProf').onchange=function(){F.prof=this.value;F.sec='';secOpts();refilter()};
$('fSec').onchange=function(){F.sec=this.value;refilter()};$('fArea').onchange=function(){F.area=this.value;refilter()};
$('fType').onchange=function(){F.type=this.value;refilter()};$('fRep').onchange=function(){F.rep=this.value;refilter()};$('fSt').onchange=function(){F.st=this.value;refilter()};
var qt=null;$('fQ').oninput=function(){clearTimeout(qt);var v=this.value;qt=setTimeout(function(){F.q=v.trim();refilter()},250)};
[].forEach.call(document.querySelectorAll('#chips .chip[data-v]'),function(b){b.onclick=function(){F.chip=b.getAttribute('data-v');syncCtl();refilter()}});
$('shuf').onclick=function(){F.shuf=!F.shuf;F.seed=Math.floor(Math.random()*1e9)+1;syncCtl();refilter()};

/* ---------- 시트(목록·백업·내보내기) ---------- */
function sheet(h){$('sheetBox').innerHTML=h;$('sheet').hidden=false}
function closeSheet(){$('sheet').hidden=true}
$('sheet').onclick=function(e){if(e.target.id==='sheet')closeSheet()};
$('bList').onclick=function(){var h='<h2>목록 · '+L.length+'문항</h2><ul class="list">';
  L.forEach(function(q,i){var a=S.a[q.k];h+='<li data-k="'+esc(q.k)+'"'+(q.k===cur?' class="cur"':'')+'><span class="n">'+(i+1)+'</span><span class="t"><span class="dot'+(solved(a)?(a.ok?' ok':' bad'):'')+'"></span>'+esc(q.stem.slice(0,70))+(q.stem.length>70?'…':'')+'<div class="s">'+esc((q.area||'')+' · '+q.sec+(q.year?' · '+q.year:''))+(memoOf(q.k)?' · 📝 '+esc(memoOf(q.k).slice(0,30)):'')+'</div></span></li>'});
  h+='</ul><div class="tools"><button class="btn" id="cls">닫기</button></div>';sheet(h);
  [].forEach.call(document.querySelectorAll('.list li'),function(li){li.onclick=function(){cur=li.getAttribute('data-k');saveUI();closeSheet();render()}});
  $('cls').onclick=closeSheet;var c=document.querySelector('.list li.cur');if(c)c.scrollIntoView({block:'center'})};
function copyBox(title,text,note){sheet('<h2>'+esc(title)+'</h2><div class="msg" id="cmsg">'+esc(note||'')+'</div><textarea id="cbox" readonly></textarea><div class="tools"><button class="btn pri" id="ccopy">복사</button><button class="btn" id="cls">닫기</button></div>');
  $('cbox').value=text;$('cls').onclick=closeSheet;
  $('ccopy').onclick=function(){var b=$('cbox');function fb(){b.focus();b.select();$('cmsg').textContent='자동 복사가 막혔어요. 칸을 길게 눌러 전체 선택 → 복사하세요.'}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){$('cmsg').textContent='복사했어요.'},fb);else fb()}}
function exportText(){var out=Q.filter(function(q){var f=S.f[q.k]||{};return inWrong(q.k)||f.conf||memoOf(q.k)});
  return out.map(function(q,i){var a=S.a[q.k]||{},f=S.f[q.k]||{},tags=[];if(inWrong(q.k))tags.push('틀림 '+a.w+'회'+(a.ok?' (마지막엔 맞힘)':''));if(f.conf)tags.push('헷갈림');
    return '=== '+(i+1)+'. '+q.sec+' ['+q.area+'] ('+q.prof+') ===\n'+(q.year?'기출: '+q.year+'\n':'')+(tags.length?'표시: '+tags.join(' / ')+'\n':'')+'문제: '+q.stem+(q.imgs&&q.imgs.length?' [사진 있음]':'')+'\n'+q.choices.map(function(c,j){return (j+1)+'. '+c}).join('\n')+
      '\n정답: '+(q.ans.join(',')||'-')+(memoOf(q.k)?'\n내 메모: '+memoOf(q.k):'')+(q.basis?'\n해설: '+q.basis:'')+(q.exps&&q.exps.length?'\n선지해설:\n'+q.exps.map(function(e,j){return (j+1)+'. '+e}).join('\n'):'')}).join('\n\n')}
$('bExp').onclick=function(){var t=exportText();copyBox('오답·헷갈림·메모 내보내기',t||'아직 틀리거나 헷갈림·메모를 남긴 문제가 없어요.',(t?t.split('\n=== ').length:0)+'문항 · 복사해서 AI 대화창이나 메모장에 붙여넣으세요.')};
$('bBak').onclick=function(){copyBox('기록 백업',JSON.stringify({app:APP,at:new Date().toISOString(),s:S}),'이 글을 복사해 두면 나중에 “백업 불러오기”로 되살릴 수 있어요.')};
$('bRes').onclick=function(){sheet('<h2>백업 불러오기</h2><div class="msg" id="rmsg">“기록 백업”에서 복사한 글을 붙여넣고 불러오기를 누르세요. 지금 기록과 합쳐져요.</div><textarea id="rbox"></textarea><div class="tools"><button class="btn pri" id="rgo">불러오기</button><button class="btn" id="cls">닫기</button></div>');
  $('cls').onclick=closeSheet;$('rgo').onclick=function(){try{var o=JSON.parse($('rbox').value);merge(o.s||o);changed();refilter(true);$('rmsg').textContent='불러왔어요.'}catch(e){$('rmsg').textContent='백업 글 형식이 아니에요. 처음부터 끝까지 그대로 붙여넣었는지 확인해 주세요.'}}};

/* ---------- 저장·계정 동기화 ---------- */
function merge(o){['a','f','m'].forEach(function(x){var src=(o&&o[x])||{};Object.keys(src).forEach(function(k){var v=src[k];if(!v)return;var c=S[x][k];if(!c||(v.t||0)>(c.t||0))S[x][k]=v})})}
var DB=null,UID=null,pt=null,dirty=false;
function changed(){lsSet(LK,S);dirty=true;clearTimeout(pt);pt=setTimeout(push,2500)}
function push(){if(!DB||!UID||!dirty)return;dirty=false;
  var st={a:S.a,f:S.f,updatedAt:new Date().toISOString()},mm={m:S.m,updatedAt:st.updatedAt};
  Promise.all([DB.doc('st/'+UID).set(st),DB.doc('memo/'+UID).set(mm)]).then(function(){$('sync').textContent='계정에 저장됨 · 모든 기기 연결'},function(){dirty=true;$('sync').textContent='계정 저장 실패 · 이 기기에는 저장됨'})}
function pull(){if(!DB||!UID)return Promise.resolve();$('sync').textContent='계정 기록 연결 중…';
  return Promise.all([DB.doc('st/'+UID).get(),DB.doc('memo/'+UID).get()]).then(function(r){
    var s=r[0]&&r[0].exists?r[0].data():null,m=r[1]&&r[1].exists?r[1].data():null;
    if(s)merge({a:s.a,f:s.f});if(m)merge({m:m.m});lsSet(LK,S);refilter(true);$('sync').textContent='계정에 저장됨 · 모든 기기 연결';
    if(!s||!m||Object.keys(S.a).length)dirty=true,push()},function(){$('sync').textContent='계정 연결 실패 · 이 기기에만 저장'})}
$('bSync').onclick=function(){if(DB)pull();else{S=lsGet(LK)||S;refilter(true)}};
window.addEventListener('pagehide',function(){lsSet(LK,S);push()});
if(window.claude&&window.claude.use){Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
  if(!r[0]||!r[1]){$('sync').textContent='이 기기에 저장됨';return}DB=r[0];return r[1].id().then(function(id){if(!id){$('sync').textContent='이 기기에 저장됨';DB=null;return}UID=id;return pull()})}).catch(function(){$('sync').textContent='이 기기에 저장됨'})}
else $('sync').textContent='이 기기에 저장됨';

syncCtl();refilter(true);
})();
</script>
