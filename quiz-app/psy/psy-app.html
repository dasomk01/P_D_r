<title>정신의학 문풀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* layout: 상단 고정 필터 묶음 + 한 문제씩 넘기는 카드 한 장 */
:root{
  --bg:#f3f4f8;--card:#ffffff;--fg:#1d2030;--mute:#6b6f85;--line:#d9dbe6;
  --accent:#3550c0;--accent-fg:#ffffff;--accent-soft:#e8ecfb;
  --ok:#23824a;--ok-soft:#e5f4ea;--bad:#c23a32;--bad-soft:#fbeae8;--warn:#8a6400;--warn-soft:#fff4d6;
  --chip:#ebedf3;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161e;--card:#1d2029;--fg:#e8e9f0;--mute:#9a9db0;--line:#333747;
  --accent:#7d93ff;--accent-fg:#0f1220;--accent-soft:#252d4d;
  --ok:#5fcf8a;--ok-soft:#18321f;--bad:#ff7d73;--bad-soft:#3a1d1b;--warn:#f2c552;--warn-soft:#3a3016;--chip:#272a36;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161e;--card:#1d2029;--fg:#e8e9f0;--mute:#9a9db0;--line:#333747;
  --accent:#7d93ff;--accent-fg:#0f1220;--accent-soft:#252d4d;
  --ok:#5fcf8a;--ok-soft:#18321f;--bad:#ff7d73;--bad-soft:#3a1d1b;--warn:#f2c552;--warn-soft:#3a3016;--chip:#272a36;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
h1{font-size:26px;line-height:1.25;margin:4px 0 10px;font-weight:700;letter-spacing:-.01em}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--mute);font-size:14.5px}
.stats b{color:var(--fg);font-family:var(--f-num);font-weight:500;margin-left:4px}
.sync{text-align:right;color:var(--mute);font-size:13px;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input[type=search],textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px}
select,input[type=search]{width:100%;min-width:0;padding:10px 12px;font-size:15px}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip,.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 16px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{border-radius:12px;padding:9px 14px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.navbar{display:flex;align-items:center;gap:8px}
.navbar .pos{flex:1;font-family:var(--f-num);color:var(--mute);font-size:15px;min-width:0}
.navbar .pos b{color:var(--fg);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;color:var(--mute);font-size:14px}
.pill{background:var(--chip);color:var(--fg);border-radius:8px;padding:2px 9px;font-size:13px;font-weight:600}
.pill.area{background:var(--accent-soft);color:var(--accent)}
.pill.king{background:var(--warn-soft);color:var(--warn)}
.meta{color:var(--accent);font-size:14px;margin-top:8px;font-weight:500}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:7px 11px;font-size:13.5px;margin-top:8px}
.note.oos{background:var(--chip);color:var(--mute)}
.stem{font-size:17px;margin:14px 0 12px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.imgs img{display:block;max-width:100%;height:auto;margin:8px auto;border-radius:8px;border:1px solid var(--line)}
.vis{background:var(--chip);border-radius:10px;padding:8px 11px;font-size:14px;white-space:pre-wrap;margin-bottom:8px}
.choices{display:grid;gap:10px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;word-break:keep-all;overflow-wrap:anywhere}
.ch .no{font-family:var(--f-num);color:var(--mute);font-size:14px;flex:none;width:18px;padding-top:2px}
.ch span:last-child{min-width:0}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ch.mine{box-shadow:inset 0 0 0 1px currentColor}
.done .ch{cursor:default}
.result{margin-top:14px;font-weight:700;font-size:16px}
.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}
.exp{margin-top:8px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.exp h3{font-size:13px;color:var(--mute);margin:14px 0 4px;font-weight:600;letter-spacing:.02em}
.exp ol{margin:0;padding-left:22px;white-space:normal}
.exp li{margin:3px 0}
.ai{background:var(--accent-soft);border-radius:10px;padding:8px 11px;font-size:14px;margin-top:10px;white-space:pre-wrap}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.acts .chip{font-size:14px;padding:6px 13px}
.memo{margin-top:14px}
.memo label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:600}
.memo textarea{width:100%;min-height:84px;padding:10px 12px;font-size:15px;resize:vertical}
.memo .saved{font-size:12px;color:var(--mute);min-height:1em}
.bottomnav{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.sheet{position:fixed;inset:0;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.sheet[hidden]{display:none}
.sheet .box{background:var(--bg);width:100%;max-width:760px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{font-size:18px;margin:0 0 8px}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);padding:9px 2px;cursor:pointer;display:flex;gap:10px}
.list li.cur{background:var(--accent-soft)}
.list .n{font-family:var(--f-num);color:var(--mute);font-size:13px;width:44px;flex:none;padding-top:2px}
.list .t{min-width:0;font-size:14.5px}
.list .s{font-size:12.5px;color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.sheet textarea{width:100%;height:160px;font:12px/1.4 var(--f-num);padding:8px}
.msg{font-size:13px;color:var(--ok);min-height:1.2em;margin:6px 0}
@media (max-width:420px){h1{font-size:23px}.stem{font-size:16.5px}}
@media (prefers-reduced-motion:no-preference){.ch{transition:background .15s,border-color .15s}}
</style>

  <div class="tools">
    <button class="btn" id="bSync">기록 새로고침</button><button class="btn" id="bBak">기록 백업</button><button class="btn" id="bRes">백업 불러오기</button><button class="btn" id="bExp">오답·헷갈림·메모 내보내기</button>
  </div>
  <hr class="sep">
  <div class="navbar">
    <button class="btn" id="prev">이전</button><div class="pos" id="pos"></div><button class="btn" id="bList">목록</button><button class="btn pri" id="next">다음</button>
  </div>
  <div id="view"></div>
</div>

<script id="data" type="application/json">[{"k":"psy-intro-01","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 3쪽(DSM-5 정의) · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5의 정신장애(mental disorder) 정의에 비추어 볼 때, 정신장애로 보지 않는 것은?","choices":["사랑하는 사람이 죽은 뒤 문화적으로 예상되는 정도의 슬픔 반응","사회적·직업적 활동에 현저한 고통이나 장애를 동반하는 증후군","개인 내부의 기능 이상에서 비롯된 사회적 일탈 행동","인지·정서 조절·행동에 임상적으로 유의한 장해가 있는 증후군","심리적·생물학적 발달 과정의 기능 이상을 반영하는 행동 장해"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"DSM-5 정의: 흔한 스트레스나 상실(예: 사랑하는 사람의 죽음)에 대한 예상 가능하거나 문화적으로 용인되는 반응은 정신장애가 아니다. 사회적 일탈(정치·종교·성)이나 개인과 사회의 갈등도 개인 내부의 기능 이상에서 온 것이 아니면 정신장애가 아니다.","exps":["정답. 예상 가능한 애도 반응은 정신장애에서 제외된다.","정신장애는 보통 의미 있는 고통이나 장애(distress or disability)를 동반한다.","일탈 자체는 장애가 아니지만, 개인의 기능 이상에서 비롯되면 정신장애가 될 수 있다.","정의의 핵심 문장 그대로다(cognition, emotion regulation, behavior).","정의에 들어 있는 \"psychological, biological, developmental processes의 기능 이상\"이다."],"ai":"","fl":{}},{"k":"psy-intro-02","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 조현병과 자폐 진단명에 \"스펙트럼(spectrum)\"이라는 말을 붙인 이유로 가장 알맞은 것은?","choices":["같은 범주 안에서도 양상과 정도가 다양하게 나타나기 때문","약물 반응이 모든 환자에게 같기 때문","원인 유전자가 하나로 밝혀졌기 때문","진단에 뇌영상 검사가 필수가 되었기 때문","소아에게만 진단하도록 범위를 좁히기 위해"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"교수님 설명: 빛이 파장에 따라 여러 색으로 나뉘듯, 하나의 영역 안에서도 다양한 양상과 정도 차이를 보이므로 \"스펙트럼\"을 붙였다. 조현병도 DSM-5에 와서야 \"조현 스펙트럼 및 기타 정신병적 장애\"가 되었다.","exps":["정답.","약물 반응은 개인차가 크다.","원인 유전자가 하나로 밝혀진 정신장애는 없다(조현병도 polygenic).","정신과 진단은 여전히 기술적(descriptive) 진단 기준에 따른다.","연령 제한과는 관계없다."],"ai":"","fl":{}},{"k":"psy-intro-03","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 6쪽(목차) · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 분류에서 \"강박 및 관련 장애(Obsessive-Compulsive and Related Disorders)\"에 속하지 않는 것은?","choices":["선택적 함구증","발모광(trichotillomania)","피부뜯기장애(excoriation)","신체이형장애","저장장애"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"DSM-5에서 강박장애는 불안장애에서 분리되어 강박 및 관련 장애로 묶였고, 신체이형장애·저장장애·발모광·피부뜯기장애가 함께 들어간다. 선택적 함구증은 분리불안장애와 함께 불안장애에 속한다.","exps":["정답. 불안 때문에 밖에서 말을 하지 않는 것으로, 불안장애에 속한다.","머리카락 뽑기 → 강박 관련 장애.","상처·피부 뜯기 → 강박 관련 장애.","외모 결함에 대한 집착 → 강박 관련 장애(교수님: 선풍기 아줌마·성형 중독 예).","버리지 못하는 장애 → 강박 관련 장애(신문지를 쌓아 둔 선배 의사 예)."],"ai":"","fl":{}},{"k":"psy-intro-04","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시 · 강의록 「정신장애 소개」 6쪽","year":"","type":"객","rep":1,"repyears":"","stem":"7세 아이가 집에서는 가족과 말을 잘하는데 학교에만 가면 몇 달째 한마디도 하지 않는다. 청력·언어 발달은 정상이다. 교수님 설명에 따르면 이 증상의 바탕이 되는 것은?","choices":["사회적 상황에서의 불안","반항과 적대감","사고의 와해","환청에 대한 반응","지적 능력 저하"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"선택적 함구증(selective mutism): 집에서는 말을 잘하는 아이가 학교 등 밖에서는 입을 닫는다. 밖에서 사람을 상대할 때의 불안 때문이라고 보며, DSM-5에서 불안장애로 분류한다.","exps":["정답.","반항성 장애와 다르다. 말을 \"못 하는\" 불안 상태다.","와해된 사고는 정신병적 증상이며 장소에 따라 선택적으로 나타나지 않는다.","정신병적 증상의 근거가 없다.","언어 발달이 정상이고 집에서는 말을 잘한다."],"ai":"","fl":{}},{"k":"psy-intro-05","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"교통사고로 생명의 위협을 겪은 뒤 악몽·재경험·회피 증상이 나타났다. 증상이 시작된 지 2주가 지났을 때 붙일 수 있는 진단으로 교수님이 설명한 것은?","choices":["적응장애","해리성 정체성 장애","외상후 스트레스 장애","범불안장애","급성 스트레스 장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님 설명: 트라우마(생명을 위협하는 수준의 스트레스) 뒤 증상이 시작된 지 한 달 미만이면 급성 스트레스 장애, 한 달이 넘어가면 PTSD.","exps":["적응장애는 생명을 위협하는 외상이 아닌 일반 스트레스 요인에 대한 반응이다.","정체성 변화가 없다.","한 달이 넘어야 PTSD로 본다.","외상 사건과 관련된 재경험·회피가 핵심이다.","정답. 한 달 미만이다."],"ai":"","fl":{}},{"k":"psy-intro-06","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시 · 강의록 「정신장애 소개」 7쪽","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 해리성 장애를 설명하면서 \"가장 많은 형태\"라고 한 것은?","choices":["전환장애","해리성 기억상실","꾀병","이인증/비현실감 장애","해리성 정체성 장애(다중인격)"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"해리성 장애는 기억이나 정체성이 왔다 갔다 하는 장애로, 일반인이 가장 많이 아는 것은 다중인격이지만 가장 많은 형태는 해리성 기억상실(특정 기억을 기억해 내지 못함)이라고 설명했다. 다중인격은 가장 심각한 형태.","exps":["전환장애는 신체증상 및 관련 장애에 속한다.","정답.","꾀병은 정신장애 진단이 아니다.","해리성 장애에 속하지만 교수님이 가장 흔하다고 한 것은 아니다.","가장 잘 알려졌고 가장 심각한 형태이지 가장 흔한 형태는 아니다."],"ai":"","fl":{}},{"k":"psy-intro-07","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"신경증(neurosis)과 인격장애를 비유한 교수님 설명으로 옳은 것은?","choices":["신경증은 \"구멍 난 스타킹\", 인격장애는 \"신발 속 돌멩이\"","신경증은 \"신발 속 돌멩이\", 인격장애는 \"구멍 난 스타킹\"","신경증은 남에게 피해를 주고, 인격장애는 본인만 괴롭다","둘 다 \"구멍 난 스타킹\"처럼 주변만 괴롭다","둘 다 \"신발 속 돌멩이\"처럼 본인만 괴롭다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"신경증(가벼운 불안장애 등)은 남에게는 보이지 않지만 본인이 괴로운 \"신발 속 돌멩이\", 인격장애는 본인은 불편함을 모르는데 주변 사람이 괴로운 \"구멍 난 스타킹\". 인격장애는 특정한 행동 패턴이 반복되는 것(예: 편집성 – 계속 의심).","exps":["반대로 짝지었다.","정답.","반대로 설명했다.","신경증은 본인이 괴롭다.","인격장애는 본인이 불편함을 잘 모른다."],"ai":"","fl":{}},{"k":"psy-intro-08","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 8·34쪽 · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 인격장애 군집 중 Cluster A(odd/eccentric)에 속하는 것으로만 묶인 것은?","choices":["편집성 · 조현성 · 조현형","회피성 · 의존성 · 강박성","반사회성 · 경계성 · 연극성","편집성 · 경계성 · 회피성","조현형 · 자기애성 · 의존성"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 34쪽 표: A군(odd/eccentric) 편집성(suspicious)·조현성(socially indifferent)·조현형(eccentric) / B군(erratic/impulsive) 반사회성·경계성(unstable)·연극성(attention seeking)·자기애성(self-centered) / C군(anxious/fearful) 회피성(inhibited)·의존성(submissive)·강박성(perfectionistic). 교수님: A군은 의심하거나 조현병과 관련된다는 의미의 인격장애.","exps":["정답.","C군이다.","B군이다.","세 군집이 섞였다.","세 군집이 섞였다."],"ai":"","fl":{}},{"k":"psy-intro-09","area":"탈야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 34쪽","year":"","type":"객","rep":1,"repyears":"","stem":"인격장애 유형과 그 구별 특징(discriminating feature)의 연결이 옳지 않은 것은?","choices":["의존성 – 완벽주의(perfectionistic)","연극성 – 관심 끌기(attention seeking)","조현성 – 사회적 무관심(socially indifferent)","회피성 – 억제(inhibited)","편집성 – 의심(suspicious)"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 34쪽 표 기준. 의존성은 순종(submissive), 완벽주의는 강박성 인격장애의 특징이다.","exps":["정답. 의존성은 submissive, 완벽주의는 강박성(OCPD).","옳다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-intro-10","area":"탈야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 8쪽 · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 목차에서 반사회성 인격장애가 인격장애 외에 함께 실려 있는 진단 범주는?","choices":["조현 스펙트럼 및 기타 정신병적 장애","외상 및 스트레스 관련 장애","해리장애","신경발달장애","파탄적·충동조절 및 품행 장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 8쪽 목차: Disruptive, Impulse-Control, and Conduct Disorders 안에 적대적 반항장애·간헐적 폭발장애·품행장애·반사회성 인격장애·방화광·병적 도벽이 있고, 반사회성 인격장애는 Cluster B 인격장애에도 들어 있다. 교수님: \"반사회성 인격장애는 여기도 들어요.\"","exps":["해당 없다.","해당 없다.","해당 없다.","해당 없다.","정답."],"ai":"","fl":{}},{"k":"psy-intro-11","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신과 진단의 특징에 대한 교수님 설명으로 가장 알맞은 것은?","choices":["원인 병원체를 찾아 그에 따라 진단명을 붙인다","혈액검사 수치를 기준으로 진단을 확정한다","심리검사 결과를 의사의 평가보다 우선한다","한 번의 면담 결과는 시간이 지나도 유지된다","환자 상태를 관찰·기술해 진단 기준에 맞춰 본다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"정신과 진단은 기계로 재는 것이 아니라, 진단 기준(예: ADHD는 9가지 중 6개 이상)을 만들어 두고 환자 상태를 잘 관찰·기술해 맞는지 본다. 심리검사는 보조 수단이며 시점·컨디션에 따라 달라진다.","exps":["원인이 아닌 기술(description)에 따른 진단이다.","고혈압·당뇨처럼 기계로 재는 진단과 다르다고 했다.","\"주객이 전도\"된 것이라며 심리검사는 보조라고 강조했다.","심리검사·상태는 시점에 따라 달라진다.","정답."],"ai":"","fl":{}},{"k":"psy-intro-12","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 \"치료하지 않으면 약 20%가 사망할 수 있는 심각한 상태\"라고 강조한 장애는?","choices":["신경성 폭식증","반추장애(되새김)","이식증(pica)","신경성 식욕부진증","폭식장애(binge eating)"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"거식증(신경성 식욕부진증): 계속 살이 쪘다고 생각하고 살찌면 불안해 체중을 줄이는 장애. 치료하지 않으면 20%가 사망할 수 있고(심장·감염), 간접적 자살 행위로 볼 수 있다고 했다. 부모가 치료를 거부하면 의료적 방임에 해당할 수 있다.","exps":["폭식 후 보상행동이 핵심이다.","음식을 되새김하는 장애.","먹을 수 없는 것을 먹는 장애(아이들이 아무거나 집어먹는 것).","정답.","보상행동 없는 폭식이다."],"ai":"","fl":{}},{"k":"psy-intro-13","area":"탈야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 5쪽 · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 목차에서 우울장애(Depressive Disorders) 범주에 새로 들어간 소아 대상 진단은?","choices":["주의력결핍 과잉행동장애","반응성 애착장애","분리불안장애","적대적 반항장애","파탄적 기분조절곤란장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 5쪽 목차와 STT: 소아의 감정 조절 문제로 DMDD가 우울장애 안에 새로 추가되었다.","exps":["신경발달장애에 속한다.","외상 및 스트레스 관련 장애에 속한다.","불안장애에 속한다.","파탄적·충동조절 및 품행 장애에 속한다.","정답."],"ai":"","fl":{}},{"k":"psy-intro-14","area":"탈야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 8쪽 · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"과거 \"성 정체성 장애(gender identity disorder)\"로 부르던 진단의 DSM-5 명칭은?","choices":["성 불편감","변태성욕장애","성 정체감 혼란증","신체이형장애","성기능부전"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"장애라고 부르면 안 된다는 관점에서, 타고난 성과 경험하는 성의 불일치에서 오는 불편감을 뜻하는 성 불편감(gender dysphoria)으로 바뀌었다.","exps":["정답.","해당 없다.","공식 진단명이 아니다.","외모 결함에 대한 집착이다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-iv-01","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 \"여전히 정신과 진단에서 가장 중요하다\"고 강조한 것과 그 이유가 바르게 짝지어진 것은?","choices":["뇌파 – 불안장애를 감별할 수 있어서","진찰·면담 평가 – 진단을 내릴 표준 검사법이 없어서","뇌 MRI – 조현병을 확진할 수 있어서","혈액검사 – 우울증 표지자가 확립되어서","심리검사 – 법원이 가장 신뢰해서"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"정신과는 진단을 내리는 표준 검사법이 현재 없으므로 진찰·면담 평가가 가장 중요하다. 피검사(특히 갑상선 검사) 등은 신체·기질적 원인을 배제하기 위한 것이지 정신과 진단을 내리기 위한 것이 아니다.","exps":["확진 검사가 아니다.","정답.","MRI 소견은 진단적이지 않다.","갑상선 검사 등은 배제 목적이다.","심리검사는 보조 수단이다."],"ai":"","fl":{}},{"k":"psy-iv-02","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 2·15쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"공격적일 위험이 있는 환자를 면담할 때 진찰실 배치로 옳은 것은?","choices":["의사는 환자보다 높은 의자에 앉아 권위를 보인다","출입문을 열어 두고 의사가 출입문 쪽에 앉는다","환자를 출입문 쪽에 앉혀 언제든 나갈 수 있게 한다","의사와 환자 사이에 큰 책상을 두어 거리를 둔다","단둘이 조용한 방에서 문을 닫고 면담한다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 위험한 환자 면담 배치 \"굉장히 중요\"\n\n강의록 2쪽·STT: 같은 높이 의자, 사이에 가구가 없는 편이 낫다. 위험한 환자는 출입문을 열어 놓고 의사가 출입문 쪽에 앉으며 도와줄 사람을 대기시킨다. 교수님은 실제 사건 뒤 진찰실 사이에 문이 생긴 일을 예로 들며 \"별거 아닌 것 같지만 굉장히 중요하다\"고 했다.","exps":["같은 높이 의자가 원칙이다.","정답.","의사의 대피로가 막힌다.","일반 면담에서는 가구가 없는 편이 낫다.","단독 면담은 안 되고 문을 열어 둔다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-03","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 2–3쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"첫 면담에서 질문하는 순서에 대한 설명으로 가장 알맞은 것은?","choices":["환자가 말을 시작하면 바로 끊고 핵심만 묻는다","가족 정보부터 들은 뒤 환자에게는 확인만 한다","거북한 주제는 환자가 먼저 꺼낼 때까지 묻지 않는다","처음부터 진단 기준 항목을 하나씩 폐쇄형으로 묻는다","처음에는 포괄적(개방형) 질문을 하고 점차 구체적 질문으로 들어간다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 포괄적 질문 → 적극적·지시적 질문, \"순서 중요\"\n\n처음은 포괄적 질문(open-ended)으로 시작해야 환자가 가장 중요하게 여기는 문제가 드러나고, 예민한 환자에게 공격적으로 느껴지지 않는다. 정보 제공이 잘 안 되면 적극적·지시적으로 묻는다. 교수님: \"케이스마다 다르지만 순서는 변하지 않는다.\"","exps":["3–4분은 혼자 이야기하게 허용한다.","환자 면담이 중심이다.","거북한 주제도 반드시 다뤄야 한다.","폐쇄형만 쓰면 심문처럼 느껴지고 중요한 문제를 놓칠 수 있다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-04","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"매우 불안하고 혼란스러우며 초조한 환자를 면담할 때 교수님이 권한 질문 방식은?","choices":["침묵을 오래 유지하며 기다리기","추상적 사고를 묻는 속담 질문","가족 없이 다른 날 다시 면담","구체적이면서 간단하고 직접적인 질문","길고 포괄적인 개방형 질문"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"불안·혼란·초조가 심하면 포괄적 질문이 오히려 환자를 힘들게 한다. 구체적이고 간단하며 직접적인 질문을 받으면 정신을 차리고 대답할 수 있다(보호병동이 오히려 편한 환자가 있는 것과 같은 원리).","exps":["혼란을 키울 수 있다.","상황에 맞지 않다.","면담 방식의 문제다.","정답.","이 상태에서는 오히려 부담이 된다."],"ai":"","fl":{}},{"k":"psy-iv-05","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 3쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"면담 초반 환자가 3–4분 동안 혼자 이야기하도록 허용하는 주된 목적은?","choices":["면담 시간을 줄이기 위해","정보 제공자 면담을 대신하기 위해","진단명을 빨리 알려 주기 위해","사고 진행의 논리성을 확인하기 위해","환자의 기억력을 검사하기 위해"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 3–4분 혼자 이야기하게 두면 진단이 저절로 서기도 함\n\n강의록 3쪽: \"3–4분 혼자 이야기할 수 있도록 허용: 사고진행의 논리성 확인.\" 교수님: 끼어들고 싶어도 참고 따라가면 진단이 저절로 되는 경우도 있다(말의 속도·연속성·논리성 평가).","exps":["목적이 아니다.","정보 제공자 면담은 별도로 중요하다.","목적이 아니다.","정답.","기억력 검사는 따로 한다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-06","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 3·15쪽 · STT 10/13 3교시 · STT 10/13 병식·다축진단·치료계획","year":"","type":"객","rep":1,"repyears":"","stem":"면담에서 \"거북한 주제\"에 대한 설명으로 옳지 않은 것은?","choices":["자살 생각은 환자를 자극할 수 있으므로 묻지 않는다","성적 문제, 술·약물, 환청, 자살을 다뤄야 한다","점진적으로 질문하는 것이 좋다","마약 사용을 물을 때는 비밀보장을 설명할 수 있다","환자가 기분 나빠하면 정확한 평가를 위해 필요하다고 설명한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 거북한 주제(성·마약·자살) \"굉장히 중요\", 자살은 직접 자세히 – 소홀하면 법적 책임\n\n자살은 직접적으로 자세히 물어야 한다. 평가하지 않고 넘어갔다가 환자가 자살하면 의사가 해야 할 의무를 소홀히 한 것으로 법적 문제(소송)까지 이어질 수 있다고 교수님이 실제 사례를 들어 강조했다.","exps":["정답. 반드시 자세히 물어야 한다.","옳다.","옳다(타이밍을 잘 잡는다).","옳다(유학 중 적응 문제 등에서 꼭 물어야 함).","옳다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-07","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: STT 10/13 병식·다축진단·치료계획","year":"","type":"객","rep":1,"repyears":"","stem":"자살 위험성 평가에서 가장 위험한 단계로 봐야 하는 것은?","choices":["힘들어서 잠시 벗어나고 싶다는 생각","죽으면 편하겠다는 막연한 생각","구체적인 방법과 날짜를 생각하고 관련 사이트를 찾아봄","잠들 때 가장 편하다는 말","한 번 떠올랐다가 \"이건 아니지\" 하고 넘긴 생각"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 자살은 계획의 구체성·입원 필요 여부까지 평가\n\n자살 생각도 레벨이 다르다. 가장 약한 것은 힘드니까 벗어나고 싶은 것이고, 가장 심각한 것은 구체적 방법·날짜를 생각하거나 자살 사이트를 계속 찾아보는 등 구체적 행위·생각이 있는 경우다. 이 정도면 입원을 권해야 한다.","exps":["가장 약한 단계다.","구체성이 없다.","정답.","상징적 의미의 표현이다.","스쳐 지나간 생각이다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-08","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 4쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"정보 제공자(가족 등)와의 면담이 특히 중요한 경우는?","choices":["환자가 20세 이상의 성인일 때","환자가 처음 정신과에 내원했을 때에만","환자가 병식이 있고 매우 협조적일 때","환자가 병식이 없거나 증상을 숨기려 할 때","신체검사와 혈액검사가 모두 정상일 때"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 정보제공자 면담이 반드시 필요한 경우, 망상 환자는 본인 말만 들으면 속는다\n\n병식이 없거나 증상을 숨길 때, 또 환자의 성격 파악에 유용하다. 교수님 예: 의처증(망상장애) 환자 본인의 이야기와 피해를 받는 부인의 이야기는 너무 다르다.","exps":["관계없다.","초진에만 한정되지 않는다.","상대적으로 덜 필요하다.","정답.","관계없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-09","area":"탈야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 강의록 「정신의학적 관찰」 4쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"최초 면담 시간에 대한 설명으로 옳은 것은?","choices":["정확한 평가를 위해 항상 3시간 이상 한다","보통 5–10분 정도면 충분하다","정신증이 심한 환자일수록 더 길게 한다","가족 면담까지 포함해 최소 2시간 이상 한다","보통 30분–1시간, 정신증·신체질병이 있으면 짧게"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4쪽: 최초 면담은 30분–1시간 정도, 정신증이나 신체질병이 있는 경우는 짧게. 교수님: 1시간도 한 사람의 20년 인생을 듣기에는 많은 시간이 아니다.","exps":["과하다.","짧다.","반대다.","해당 없다.","정답."],"ai":"","fl":{}},{"k":"psy-iv-10","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 강의록 「정신의학적 관찰」 5쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"현병력을 조사할 때 의사가 반드시 \"pinpoint\"해야 한다고 강조한 것은?","choices":["가족이 처음 병원을 권한 날","증상이 진단 기준을 충족한 시점","처음으로 약을 복용한 날","환자가 처음 불편감을 느낀 날","증상이 가장 심했던 날"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"역치하(subthreshold) 증상과 임상적으로 문제가 되는 증상은 환자 본인에게는 구분이 안 된다. 의사가 언제부터 진단 기준을 충족하는 정도가 되었는지 정확히 짚어야 진단할 수 있다(강의록 5쪽: 첫 증상, 진단기준 충족 시점).","exps":["시점 판단 기준이 아니다.","정답.","해당 없다.","역치하 증상까지 포함될 수 있다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-iv-11","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"처음에는 스트레스를 받을 때만 증상이 생기다가, 악화·호전을 반복하면서 점점 작은 스트레스에도, 나중에는 뚜렷한 유발 요인 없이도 증상이 생기는 현상을 교수님은 무엇이라고 설명했나?","choices":["전이(transference)","내성(tolerance)","점화(kindling)","퇴행(regression)","조건화(conditioning)"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"킨들링(감  10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"30세 남자가 \"요즘 집중이 안 된다\"며 성인 ADHD 약을 처방해 달라고 왔다. 개인력에서 반드시 확인해야 하는 것은?","choices":["어린 시절에도 ADHD 증상이 있었는지","가족 중 의사가 있는지","하루 카페인 섭취량만","현재 하루 근무 시간과 업무량","최근 일주일 수면 시간만"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"어릴 때 ADHD가 없었다면 성인 ADHD가 아니다. 성인이 집중이 안 되는 이유는 우울·불안·강박·공부하기 싫음 등 10가지가 넘는다. 강의록 7쪽: 중기 아동기(3–11세)에 충동성·인지발달·학습장애 등을 본다.","exps":["정답.","해당 없다.","일부일 뿐이다.","핵심이 아니다.","일부일 뿐이다."],"ai":"","fl":{}},{"k":"psy-iv-16","area":"탈야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 강의록 「정신의학적 관찰」 7–8쪽","year":"","type":"객","rep":1,"repyears":"","stem":"개인력 조사에서 초기 아동기(3세까지)에 확인하는 항목이 아닌 것은?","choices":["안정적 양육 여부","군대 생활","수유 및 배변 훈련","낯가림·이별불안","head banging, body rocking"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7쪽: 초기 아동기 – 안정적 양육, 수유·배변 훈련, head banging·body rocking, 낯가림·이별불안, 놀이에서 능동 vs 수동. 군대 생활은 성인기 항목.","exps":["옳다.","정답. 성인기 항목이다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-iv-17","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 치료 경과가 좋지 않다고 본 환자의 특징은?","choices":["지지해 주는 가족이 있는 사람","면담에서 질문을 많이 하는 사람","불편해도 친구를 만나고 놀러 가는 사람","오랫동안 사회적으로 단절되어 혼자 지내는 사람","스스로 병원에 온 사람"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"정신과 증상의 중요한 기전 중 하나가 단절이다. 불편해도 친구를 만나고 놀러 가는 사람은 치료가 잘 되고, 오랫동안 단절된 사람일수록 치료가 잘 안 된다.","exps":["회복이 좋다.","해당 없다.","예후가 좋은 쪽이다.","정답.","면담이 비교적 원활하다."],"ai":"","fl":{}},{"k":"psy-iv-18","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 강의록 「정신의학적 관찰」 9쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신상태검사(MSE)에 대한 설명으로 옳은 것은?","choices":["한 번 기록하면 이후에는 바뀌지 않는다","환자가 직접 작성하는 표준화된 설문지다","가족 면담 내용만을 근거로 작성한다","면담 중 관찰한 현재 상태를 기술하며 며칠 새 바뀔 수 있다","과거 병력을 시간 순으로 정리한 기록이다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 9쪽: 증상과 징후를 체계적으로 평가하는 것. 병력과 비슷할 수 있으나 며칠 사이 바뀔 수 있으므로 현재 상태를 평가하고, 면담 중 관찰된 것을 기술한다(외모·태도·행동, 기분 은 것은?","choices":["진단은 강제치료 결정 시 중요하다","확립된 생물학적 검사로 원인별 분류를 한다","검사보다 병력 청취와 정신상태검사에 의존한다","원인이 아니라 증상에 따라 분류한다","환자뿐 아니라 가족·친구에게서도 정보를 얻어야 한다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 5쪽: 원인이 아니라 증상에 따라 분류, 검사보다 병력 청취·정신상태검사에 의존(interview skill 중요), 주변 정보, 생활의 어려움에서 오는 경우가 많음, 강제치료 결정 시 중요.","exps":["옳다.","정답. 확립된 검사법이 없다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-cl-04","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 6·12쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"차원적(dimensional) 분류와 범주적(categorical) 분류에 대한 설명으로 옳은 것은?","choices":["일반 의학(폐렴·결핵)의 진단은 주로 차원적이다","현재 DSM·ICD는 두 방식이 섞여 있으나 범주적 성격이 더 강하다","정신치료 관점에서는 범주적 분류가 더 유용하다","DSM-IV는 차원적 분류를 전혀 도입하지 않았다","범주적 분류는 건강과 질병을 정도의 차이로 본다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): 차원적·범주적 분류 – 학생 지목 질문, 시험 빈출\n\n범주적: 병이 있는 사람과 없는 사람이 확연히 구분(폐렴·결핵). 차원적: 건강 상태와 정도의 차이. 현재 DSM·ICD는 혼합이나 범주가 더 강하다. 교수님은 원인이 밝혀지지 않았고 누구나 우울·불안할 수 있으므로, 사람을 이해하고 정신치료하는 데는 차원적 관점이 더 맞다고 강조했다. DSM-IV는 bipolar II로 차원적 진단을 일부 도입.","exps":["범주적이다.","정답.","차원적 관점이 더 맞다고 했다.","bipolar II로 일부 도입했다.","그것은 차원적 분류다."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-05","area":"탈야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 7쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"경과를 중요하게 여겨 최초의 현대적 기술적 분류를 만든 사람은?","choices":["Plato","Eugen Bleuler","Hippocrates","Emil Kraepelin","Kurt Schneider"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7쪽: Kraepelin – 최초의 현대적인 기술적 분류(경과를 중요시). Hippocrates는 mania·melancholia·hysteria·phrenitis를 기술, Plato는 신으로부터 받은 것과 신체적인 것으로 나눴다.","exps":["관념적 합리론.","증상을 강조했다.","관찰적 경험론으로 증상을 기술했다.","정답.","1급 증상을 제시했다."],"ai":"","fl":{}},{"k":"psy-cl-06","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 8쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM 다축체계에서 신체질환이 정신증상의 원인인 경우 기록 방법으로 옳은 것은?","choices":["I축에만 기록","V축에 GAF로만 기록","IV축에만 기록","II축과 III축에 기록","I축과 III축에 동시에 기록"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): DSM 각 축의 내용은 고대 야마 빈출\n\n강의록 8쪽: 축 III – 정신장애를 이해하거나 치료하는 데 연관된 일반 의학적 상태(신체질환이 원인인 경우 축 I & III에 동시에 기록). 교수님: 신체질환이 원인이면 III축이 제일 중요하다.","exps":["III축도 기록한다.","V축은 전반적 기능이다.","IV축은 정신사회적·환경적 문제다.","II축은 인격장애·정신지체다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-07","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 8쪽 · STT 10/13 4교시 · STT 10/13 병식·다축진단","year":"","type":"객","rep":1,"repyears":"","stem":"GAF(Global Assessment of Functioning)에 대한 설명으로 옳은 것은?","choices":["인격장애가 있는지를 판정하는 척도다","점수가 높을수록 증상이 심하다는 뜻이다","환자가 스스로 매기는 0–10점 척도다","최근 1년간 스트레스 요인의 개수다","의사가 매기는 0–100점이며 높을수록 기능이 좋다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): DSM 각 축의 내용은 고대 야마 빈출\n\n축 V(GAF 0–100점): 특정 기간 동안 환자의 전반적인 기능(심리적·사회적·직업적)을 의사가 판단. 기능이 좋을수록 높다. 예: 불안하지만 직장·학교는 잘 다니는지.","exps":["II축이다.","반대다.","의사가 판단하고 0–100점이다.","IV축 내용과 관련된다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-08","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 9쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"진단명에 붙는 NOS(not otherwise specified)의 의미는?","choices":["어느 특정 진단에도 딱 맞지 않을 때 붙인다","원인이 밝혀진 장애에 붙인다","여러 진단 중 주진단을 뜻한다","과거에 있었던 병력을 뜻한다","정보가 부족한 잠정 진단을 뜻한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 9쪽: 달리 분류되지 않는 범주(NOS) – 증상이 특정 진단의 역치 이하이거나 비전형적·혼합 양상. 교수님: A도 B도 아닌 것 같아 애매할 때 붙인다.","exps":["정답.","해당 없다.","해당 없다.","prior history다.","provisional diagnosis다."],"ai":"","fl":{}},{"k":"psy-cl-09","area":"탈야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 10쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"ICD-10에 대한 설명으로 옳은 것은?","choices":["ICD-10 범주는 모두 DSM-IV에 있다","신경증 관련 용어를 전혀 쓰지 않는다","다축 체계가 없다","미국정신의학회가 만들었다","축은 임상진단·후유장애·상황적 요인의 3개다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 10쪽: ICD-10도 다축 체계(축 I 임상진단, II 후유장애, III 상황적 요인)이며 조작적 진단기준. 신경증·정신증 구분은 없앴으나 신경증적, 급성 일과성 정신병적 장애 등의 용어는 사용. DSM-IV 범주는 모두 ICD-10에 있지만 반대는 아니다(ICD가 더 광범위). ICD는 WHO.","exps":["반대다.","용어는 사용한다.","다축 체계다.","WHO다.","정답."],"ai":"","fl":{}},{"k":"psy-cl-10","area":"탈야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 11–12쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM의 발달 과정에 대한 설명으로 옳지 않은 것은?","choices":["DSM-III(1980)에서 세밀한 조작적 정의와 다축 체계를 처음 도입했다","DSM-IV에서 조현병 활성기 증상 기간을 1개월에서 1주로 줄였다","DSM-IV에서 신경증이라는 용어가 사라졌다","DSM-I은 1952년에 나왔다","DSM-IV(1994)에서 기질성/기능성 이분법이 사라졌다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 11–12쪽: DSM-IV에서 조현병 활성기 증상 기간은 1주일에서 1개월로 늘었다. 또 brief reactive psychosis → brief psychotic disorder, bipolar II·급성 스트레스 장애 등 추가.","exps":["옳다.","정답. 1주일 → 1개월로 늘었다.","옳다(psychotic disorder라는 용어는 사용).","옳다(130쪽, 106개 장애).","옳다."],"ai":"","fl":{}},{"k":"psy-cl-11","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 13쪽 · STT 10/13 4교시 · 티야방(정소윤)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 새로 생긴 정식 진단이 아니라 제안되었다가 탈락한 것은?","choices":["파탄적 기분조절곤란장애","경도 신경인지장애","월경전 불쾌감 장애","인터넷 중독","저장장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 13쪽: 신설 – 파탄적 기분조절곤란장애, 경도(약한) 신경인지장애, 폭식장애·성인 ADHD·저장장애·월경전 불쾌감 장애·행동 중독. 탈락 – psychosis risk, mixed anxiety/depression, internet·sex addiction. 📌티야방: DSM-5 변화 슬라이드는 최근 시험 빈출이니 전부 읽어 보라.","exps":["신설.","신설(노화로 인한 건망증 → 경도 신경인지장애).","신설.","정답. 탈락했다.","신설."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-12","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 13쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 삭제되어 사별 후 애도 반응도 주요우울장애로 진단될 수 있게 된 조항은?","choices":["6개월 기간 조항","물질 유발 제외 조항","조현병 단일 증상 조항","사별 제외 조항","기분 일치성 조항"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): DSM-5 변화 슬라이드 최근 빈출 – 전부 읽어 보기\n\n사별로 인한 애도도 \"중증 우울증\"으로 진단받을 수 있도록 예외 조항이 삭제되었다. 교수님은 DSM이 미국 사립 보험 체계와 연결되어 있다는 우려 섞인 시각을 함께 설명했다.","exps":["해당 없다.","해당 없다.","조현병 기준 변화다.","정답.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-13","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 14쪽 · STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에 대한 비판으로 교수님이 설명한 것은?","choices":["보험 체계와 무관하다","과잉 진단과 과잉 투약","소아 진단이 빠져 있다","차원적 분류만 쓴다","진단 범주가 너무 적다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"부정적 측면: 과잉 진단·과잉 투약. DSM은 미국 사립 보험 시장과 맞물려 진단이 많을수록 환급이 많아지는 구조라는 비판. \"treat the person not the disease\", 보험 청구·제약사 FDA 승인에 필요할 뿐이라는 비판. 긍정적 측면: 통일된 의사소통, 예방적 개입 진단(MCI 등).","exps":["연결되어 있다고 비판한다.","정답.","해당 없다.","혼합이다.","반대다."],"ai":"","fl":{}},{"k":"psy-cl-14","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 15쪽 · STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"임상적으로 유의한 정신장애로 진단하기 위한 기준에 대한 설명으로 옳은 것은?","choices":["증상이 하나라도 있으면 곧바로 진단한다","고통이나 기능 장해가 있어야 임상적으로 유의하다","개인과 사회의 갈등 자체를 정신장애로 본다","본인이 고통을 느끼지 않으면 진단할 수 없다","역치하 증상도 빠짐없이 모두 진단한다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(전은채): [TY] 임상적 유의성은 고통(distress)이나 장해가 있을 때\n\n임상적 유의성은 고통이나 장해가 있을 때. 교수님 예: 조증 상태는 본인은 기분이 좋아 불편함이 없지만 사건·사고가 생기며 기능이 깨진다(impairment) → 진단 가능.","exps":["임상적 유의성이 필요하다.","정답.","개인과 사회의 갈등은 정신장애가 아니다.","조증처럼 고통 없이 기능 장해만 있어도 된다.","역치하 증상은 진단하지 않는다."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-15","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 15쪽 · STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"논문이나 기록에서 권장되는 표현은?","choices":["a person with schizophrenia","schizophrenic individual","the schizophrenics","a schizophrenic","schizophrenic person"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"질병은 그 개인 자체가 아니라 개인이 지닌 상태라는 철학적 개념: a person with schizophrenia. 영미권 논문 심사에서는 다른 표현을 쓰면 바로 지적한다고 했다.","exps":["정답.","피해야 한다.","피해야 한다.","피해야 한다.","피해야 한다."],"ai":"","fl":{}},{"k":"psy-cl-16","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 16쪽 · STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신증(psychosis)의 특징으로 옳지 않은 것은?","choices":["다른 장애에서도 일시적으로 보일 수 있음","성격의 일부만 관여","현실검정능력의 손상","망상·환청","병식이 없음"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(전은채): 정신증·신경증 구분 – 과거 출제\n\n강의록 16쪽: 정신증 – 현실 지각의 전반적 손상, 병식 없음, 망상·환청, 자아 기능 손상, 사회·직업 기능 저하, 성격 전체가 관여, 다른 장애에서도 일시적으로 보일 수 있음. 신경증 – 병식 있음, 성격 일부만 관여.","exps":["옳다.","정답. 성격의 \"전체\"가 관여한다.","옳다.","옳다.","옳다."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-17","area":"탈야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 16쪽 · STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"강의록에서 신경증적 장애의 예로 든 것이 아닌 것은?","choices":["기분부전장애","신체형장애","해리장애","조현병","불안장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(전은채): 정신증·신경증 구분 – 과거 출제\n\n강의록 16쪽: 신경증 – 불안장애, 신체형장애, 해리장애, 성장애, 기분부전장애. 조현병은 정신증(중증 정신질환, SMI)에 해당한다.","exps":["신경증.","신경증.","신경증.","정답. 정신증이다.","신경증."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-18","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신증 환자에게서 \"경계심 스위치\"가 너무 쉽게 켜진다는 교수님 설명과 연결되는 현상은?","choices":["사회 기능의 전반적 향상","병식 증가와 순응도 향상","기억력과 집중력 향상","감정 둔마의 빠른 회복","확증 편향과 현실감 저하"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"경계심은 필요할 때만 켜지면 자신을 보호하는 장치지만, 정신증 환자는 너무 쉽게·수시로 켜진다. 그래서 확증 편향(한 가지로 모든 사건을 해석)이 일어나고 현실감이 부족해지며 병식이 없어질 수 있다.","exps":["반대다.","반대다.","해당 없다.","해당 없다.","정답."],"ai":"","fl":{}},{"k":"psy-cl-19","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 17쪽 · STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신의학을 관통하는 가장 중요한 개념으로 교수님이 마지막에 강조한 모델은?","choices":["유전 결정 모델","정신역동 모델","생물·심리·사회 모델","행동주의 모델","생물의학 모델"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"생물학적·정신역동적·환경적·유전적 관점을 통합하는 biopsychosocial model이 정신과 진찰·면담·진단을 관통하는 가장 중요한 개념.","exps":["교수님은 유전 결정론에 비판적이었다.","일부만 본다.","정답.","일부만 본다.","일부만 본다."],"ai":"","fl":{}},{"k":"psy-cl-20","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 14쪽 · STT 10/13 5교시 · 티야방(전은채)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 예방적 개입을 위한 진단으로 제안되어 부록에 실린 것으로만 묶인 것은?","choices":["저장장애 · 발모광(털뽑기장애)","조현병 · 양극성장애 제I형","공황장애 · 광장공포증","품행장애 · 반사회성 인격장애","정신증 위험성 증후군 · 경도 신경인지장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 14쪽 \"DSM-5의 명암\": 예방적 개입을 위한 진단 제안 – 정신증 위험성 증후군(psychosis risk syndrome), 부분 신경인지장애(minor neurocognitive disorder), 자살 위험성 평가. 📌티야방(전은채): 직접 강조는 없었으나 구두로 설명했고 야마에 빈출(선지에는 \"정신증 고위험군\", \"경도인지장애\"로 나옴). 교수님: MCI는 정식 진단으로 들어가 있고, 발병 전에 문제가 있으면 잘 봐야 한다는 예방적 측면을 강조한 진단.","exps":["강박 관련 장애 정식 진단이다.","이미 확립된 정식 진단이다.","불안장애 정식 진단이다.","정식 진단이다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-21","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 3쪽 · STT 10/13 4교시 · 티야방(정소윤)","year":"","type":"객","rep":1,"repyears":"","stem":"\"장애(disorder)\"와 \"장해(impairment)\"에 대한 설명으로 옳은 것은?","choices":["장해는 원인이 밝혀진 질병을 뜻한다","둘은 정신의학에서 같은 뜻이다","장애는 신체질환에만 쓰는 말이다","장해는 기능상의 문제로 영구적일 수 있다","장애는 영구적 손상만을 뜻한다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌티야방(정소윤): \"장애와 장해를 이해하는 게 중요하다\", \"병과 장애를 구분하는 것은 굉장히 중요하다\". 장애(disorder)는 원인이 명확하지 않아 질서가 흐트러진 상태(다시 잡으면 좋아질 수 있음), 장해(impairment)는 기능상 문제로 교통사고 후 장애 진단처럼 어느 정도 영구적 손상이 지속되는 것.","exps":["원인이 밝혀진 것은 \"병\"이다.","구분해야 한다고 강조했다.","해당 없다.","정답.","장애는 회복 가능성을 담은 말이다."],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-dsm5-2025","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2025 객2","type":"객","rep":10,"repyears":"2023 객14 · 2022 객14 · 2021 객12 · 2020 객12 · 2019 객12 · 2018 객12 · 2017 객12 · 2016 객12 · 2015 객12","stem":"DSM-5의 변화로 옳은 것을 고르시오.","choices":["우울증의 여러 증상이 4일~13일 지속되면 other specified depressive disorder로 진단이 가능하다","인터넷 중독이 신설되었다","경도인지장애는 진단체계(부록 포함)에서 제외되었다","양성증상이 기이하면 하나만 있어도 조현병 진단이 가능하다","범불안장애 진단기준이 완화되었다"],"ans":[1,5],"imgs":[],"vis":[],"notes":["이의제기 결과 ①·⑤ 복수정답 처리(학습지 기록)."],"basis":"📌 티야방(정소윤): (10/19 추가) 올해 수업 슬라이드에는 \"범불안장애 완화\"가 빠짐 – 작년 ①⑤ 복수정답 선지였으니 바꿔 낼 수 있어 유의\n\nDSM-5 변화 정리(학습지): [신설] 파탄적 기분조절곤란장애(소아의 발작적 짜증), 약한(경도) 신경인지장애(노화로 인한 건망증), 폭식장애, 성인 ADHD, 저장장애, 월경전불쾌감장애, 행동 중독 / [삭제] 사별 제외 조항(애도도 기준을 충족하면 우울증 진단 가능) / [탈락→부록] 정신증 고위험군(psychosis risk), mixed anxiety/depression, 인터넷·섹스 중독 / [완화] 범불안장애. 조현병의 \"기괴한 망상이면 1개 증상만으로도 진단\" 조항은 DSM-5에서 삭제(2개 이상 필요). 급성 스트레스장애 추가, 조현병 활성기 1주→1개월 강화는 DSM-IV의 변화. ① 단기 우울삽화(4–13일) = 기타 특정 우울장애, 킹야로 항상 답이 된 선지. ⑤ 강의록에는 범불안장애 기준 \"완화\"로 나와 있다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-dsm5-2023","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2023 객14","type":"객","rep":10,"repyears":"2025 객2 · 2022 객14 · 2021 객12 · 2020 객12 · 2019 객12 · 2018 객12 · 2017 객12 · 2016 객12 · 2015 객12","stem":"DSM-5의 변화로 옳은 것을 고르시오.","choices":["우울증의 여러증상이 4~13일 지속되면 other specified depressive disorder로 진단 가능하다.","인터넷중독장애가 진단체계에 추가 되었다.","경도인지장애가 진단체계(부록포함)에서 제외되었다.","하나의 증상만 있어도 조현병 진단이 가능하다.","파탄적 기분조절장애가 진단체계(부록포함)에서 삭제되었다."],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤·전은채): 최근 시험 빈출 슬라이드 – 조현병 \"1개 증상만으로 진단\" 조항 삭제(25Y), 정신증 위험 증후군·경도 신경인지장애는 DSM-5 부록\n\nDSM-5 변화 정리(학습지): [신설] 파탄적 기분조절곤란장애(소아의 발작적 짜증), 약한(경도) 신경인지장애(노화로 인한 건망증), 폭식장애, 성인 ADHD, 저장장애, 월경전불쾌감장애, 행동 중독 / [삭제] 사별 제외 조항(애도도 기준을 충족하면 우울증 진단 가능) / [탈락→부록] 정신증 고위험군(psychosis risk), mixed anxiety/depression, 인터넷·섹스 중독 / [완화] 범불안장애. 조현병의 \"기괴한 망상이면 1개 증상만으로도 진단\" 조항은 DSM-5에서 삭제(2개 이상 필요). 급성 스트레스장애 추가, 조현병 활성기 1주→1개월 강화는 DSM-IV의 변화.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-dsm5-2022","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2022 객14","type":"객","rep":10,"repyears":"2025 객2 · 2023 객14 · 2021 객12 · 2020 객12 · 2019 객12 · 2018 객12 · 2017 객12 · 2016 객12 · 2015 객12","stem":"DSM-5의 변화로 옳은 것을 고르시오.","choices":["우울증의 여러증상이 4~13일 지속되면 other specified depressive disorder로 진단 가능하 ·상황적 요인)가 있다. 신경증은 반복적·만성적인 불안·우울이 특징(⑤ \"일시적\" ×).","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-purpose-2011","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2011 객4","type":"객","rep":1,"repyears":"","stem":"정신장애의 진단분류체계에 대한 기술 중 가장 적절한 것은?","choices":["정신장애에서 장애의 개념은 사회적 평균에서 벗어나거나 갈등이 있는 경우를 의미한다.","증상을 일으킨 원인이 무엇이냐에 따라 강제치료를 결정하게 된다.","차원적 분류(dimensional classification)는 질병이 각각 별개이고 분명히 구분되는 것으로 질병유형이라고 주장하며 임상적으로 유용하다.","전문가들 사이의 상호 효율적인 의견교환이 진단분류 목적 중 하나이다.","정신장애는 대부분 원인적 분류를 따른다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤·전은채): 진단분류 목적 중 교수님이 더 중요하게 보는 것은 전문가들의 상호 효율적인 의견 교환(Y) / 평균에서 벗어나거나 갈등만으로는 정신장애 아님(TY)\n\n진단분류의 목적: 임상 현상을 일목요연하게, 전문가들이 효율적으로 의견을 교환할 언어 제공(④○), 유사 장애와의 차이 이해, 치료 계획. ① 평균에서 벗어나거나 갈등만으로는 정신장애가 아니다 – 괴로움·기능저해를 수반하는 임상적 증후군이어야. ③은 범주적 분류에 대한 설명(차원적 분류는 건강과 정도 차이일 뿐 별개가 아니라고 본다). ⑤ 원인 지식이 불충분해 주로 증상에 따라 분류한다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-neurosis-2011","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2011 객5","type":"객","rep":1,"repyears":"","stem":"정신장애의 진단분류에 대한 설명 중 옳은 것을 고르시오.","choices":["정신장애에 대한 체계적이고 현대적인 분류는 Emile Kraepelin으로부터 비롯되었다.","DSM-IV 진단체계에서는 정신장애를 기질적인 것과 심리적인 것으로 구분한다.","DSM-IV 다축체계에서 축 IV에서는 일반 신체적 상태를 기술한다.","정신증은 현실지각의 전반적 손상이 있으나, 성격의 일부만 관여한다.","불안장애, 기분부전장애는 대표적인 신경증 질환으로 일시적인 불안, 우울이 특징적이다."],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(전은채): 정신증(현실지각 전반 손상·성격 전체) vs 신경증(병식 있음·성격 일부) – 구분 문제가 나온 적 있음\n\n① 현대적 분류는 Kraepelin에서 시작(○). ② DSM-IV에서 정신/신체 이분법은 의미가 없어짐. ③ 축 IV는 심리사회적·환경적 문제. ④ 정신증은 현실지각의 전반적 손상 + 성격 전체가 관여(성격 일부만 관여하는 것은 신경증). ⑤ 신경증은 만성·반복적 불안이 특징(일시적 ×).","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-pos-2023","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2023 객15","type":"객","rep":6,"repyears":"2022 객15 · 2021 객13 · 2020 객13 · 2019 객13 · 2018 객13","stem":"19세 남자환자가 얼굴에 표정이 없고, 외부자극에 ","stem":"Emil Kraepelin이 조현병을 \"조발성 치매(dementia praecox)\"라고 부른 근거는?","choices":["1급 증상이 반드시 있어서","사고의 분리와 이완이 특징이어서","환각이 부수적 증상이어서","어린 나이에 발병하고 만성적이며 황폐화되는 경과를 보여서","모든 연령에서 발병하고 삽화 사이에 정상으로 회복되어서"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"Kraepelin은 경과에 주목했다: 어린 나이(20대)에 발병해 만성적으로 나빠져 치매 환자처럼 된다. 반면 조울병은 모든 연령에서 발병하고 삽화 사이에 거의 정상 기능으로 회복된다고 나눴다.","exps":["Schneider의 관점이다.","Bleuler의 관점이다.","Bleuler의 관점이다.","정답.","조울병의 특징이다."],"ai":"","fl":{}},{"k":"psy-sz1-02","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: 강의록 「조현병 1」 3쪽 · STT 10/14 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"Eugen Bleuler의 4A 증상에 해당하지 않는 것은?","choices":["연상 이완(associative loosening)","청각 환각(auditory hallucination)","양가감정(ambivalence)","자폐(autism)","정동 둔마(affective blunting)"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"Bleuler는 경과보다 특징 증상을 강조했고 4A(연상 이완, 양가감정, 자폐, 정동 둔마)를 핵심으로 봤다. 망상·환각은 이런 상태가 지속되며 생기는 부수적(이차적) 증상으로 봤다.","exps":["4A.","정답. 부수적 증상으로 봤다.","4A.","4A(자기 세계에 빠짐).","4A."],"ai":"","fl":{}},{"k":"psy-sz1-03","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: STT 10/14 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"Bleuler가 schizophrenia라는 이름에 담은 뜻에 대한 교수님 설명으로 가장 알맞은 것은?","choices":["뇌가 물리적으로 둘로 나뉜 병","인격이 여러 개로 나뉜 병","치매처럼 계속 진행하는 병","마음이 쪼개질 만큼 힘든 상태","유전으로만 생기는 병"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"schizo(분리되다) + phrenia(횡격막, 고대에 영혼·정신이 있다고 여긴 곳). 환자가 너무 힘들어 가장 중요한 마음이 쪼개질 정도라는, 환자를 인간적으로 이해하려는 마음을 담은 이름이다. 번역 과정에서 \"정신분열\"이 되며 낙인이 생겼다.","exps":["문자적 오해다.","해리성 정체성 장애와 혼동이다.","Kraepelin의 dementia praecox 개념이다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-sz1-04","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: 강의록 「조현병 1」 4쪽 · STT 10/14 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"Kurt Schneider의 1급 증상(first-rank symptoms)에 해당하지 않는 것은?","choices":["행동을 논평하는 목소리","사고 반향(audible thought)","사고 주입·탈취·전파","망상적 지각","정동 둔마"],"ans":[5],"imgs":[],"vis":[],"notes":[],"ba "],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 3쪽: 와해 증상 영역에 정동 불일치(부적절한 정서 반응)가 포함된다. 정동 둔마는 감정 표현·반응의 강도가 줄어드는 음성 증상.","exps":["해당 없다.","해당 없다.","표현이 줄어드는 것이다.","해당 없다.","정답."],"ai":"","fl":{}},{"k":"psy-sz2-08","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 강의록 「조현병 2」 4쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"파킨슨병의 가면 얼굴처럼 표정이 없고 감정 표현과 반응이 줄어든 상태는?","choices":["무쾌감증","정동 둔마","긴장성 혼미","무의욕증","무언증"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"정동 둔마(affective flattening): 감정 표현과 반응의 강도 감소. 교수님은 파킨슨 환자의 masked face와 비슷하다고 했다.","exps":["즐거움을 못 느끼는 것.","정답.","와해된 행동이다.","의욕이 없는 것.","말이 없는 것."],"ai":"","fl":{}},{"k":"psy-sz2-09","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"📌티야방 · 근거: STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"음성 증상 중 우울증에서도 나타나 그것만으로는 조현병의 음성 증상인지 구분하기 어렵다고 한 것은?","choices":["연상 이완과 우원증","무의욕증과 무쾌감증","반향언어와 반향행동","정동 둔마와 무언증","환청과 망상"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤): 무의욕·무쾌감은 우울증에서도 → 정동둔마·무언증 동반을 종합\n\n무의욕증·무쾌감증은 우울증이 심할 때도 있으므로 그것만으로는 구분할 수 없고, 정동 둔마·무언증 등이 함께 나와야 음성 증상으로 판단한다.","exps":["와해 증상이다.","정답.","와해 증상이다.","오히려 구분에 도움이 된다.","양성 증상이다."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz2-10","area":"탈야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 강의록 「조현병 2」 5쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병의 연성 신경학적 징후(soft neurological sign)가 아닌 것은?","choices":["편마비","위치지각(proprioception) 장애","SPEM 장애","입체감각인식불능(astereognosis)","피부글씨감각인식불능(agraphesthesia)"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 5쪽: astereognosis(손에 쥔 물건을 알아맞히지 못함), agraphesthesia(등·손에 쓴 글자 인식 장애), proprioception 장애, SPEM. 편마비는 국소 신경학적 징후로 연성 징후가 아니다.","exps":["정답.","연성 징후.","연성 징후.","연성 징후.","연성 징후."],"ai":"","fl":{}},{"k":"psy-sz2-11","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"📌티야방 · 근거: 강의록 「조현병 2」 6쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 조현병 진단 기준에 대한 설명으로 옳은 것은?","choices":["Schneider 1급 증상 하나면 충분하다","망상이 기괴하면 증상 1개만으로 진단한다","전체 지속 기간이 1개월 이상이면 된다","5개 영역 중 2개 이상이 한 달 중 상당 기간 있다","사회적·직업적 기능 저하는 필요 없다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤·정소윤): 지금은 2개 이상 필수, 1급 증상의 가치가 퇴색 (25Y)\n\n강의록 6쪽: 2개 이상이 한 달 중 상당 기간 + 사회적·직업적·대인관계 기능의 현저한 저하 + 위 두 가지가 6개월 이상. DSM-IV의 \"기괴한 망상이나 간섭·대화하는 환청이면 1개로 충분\" 조항은 DSM-5에서 없어져 1급 증상의 가치가 퇴색했다.","exps":["없어진 조항이다.","DSM-IV 조항으로 DSM-5에서 없어졌다.","6개월 이상이다.","정답.","기능 저하가 필요하다."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz2-12","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"📌티야방 · 근거: 강의록 「조현병 2」 6·10쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병 증상이 있으나 전체 기간이 3개월인 경우와 2주인 경우의 진단을 바르게 짝지은 것은?","choices":["단기 정신병적 장애 – 조현양상장애","조현병 – 조현양상장애","망상장애 – 조현병","조현정동장애 – 망상장애","조현양상장애 – 단기 정신병적 장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤): 단기 정신병적 장애는 1개월 이내 100% 회복\n\n강의록 6쪽: 1개월–6개월 schizophreniform, 1일–1개월 brief psychotic disorder. 단기 정신병적 장애는 한 달 안에 병전 기능 수준으로 완전히 회복된다.","exps":["반대다.","6개월이 안 된다.","해당 없다.","해당 없다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz2-13","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"📌티야방 · 근거: 강의록 「조현병 2」 7쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병 아형 중 가장 흔하고, 20–30대에 비교적 늦게 발병해 결혼·취업을 하는 경우가 많으며 예후가 비교적 좋은 것은?","choices":["잔류형","미분화형","와해형","긴장형","편집형"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤): 편집형이 가장 흔한 아형\n\n강의록 7쪽: 편집형 – 피해·과대망상 흔함, 와해 증상 적음, 늦게 발병해 퇴행 정도가 적고 예후 비교적 좋음, 긴장·의심·적대적. 교수님: DSM-5에서 아형은 없어졌지만 여전히 교과서에 소개된다. \"편집\"이라는 말은 환자에게 거부감이 적어 설명에 유용하다.","exps":["음성 증상 위주.","해당 없다.","어린 나이 발병, 예후 나쁨.","현재 아주 드묾.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz2-14","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 강의록 「조현병 2」 8쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"어린 나이에 발병해 사고가 심하게 와해되고 인지능력이 현저히 손상되며 예후가 가장 나쁜 아 ":"객","rep":1,"repyears":"","stem":"아내가 바람을 피운다고 확신하는 50세 남자가 배우자와 부딪힐 때만 문제가 되고 직장생활과 다른 대인관계는 문제없다. 와해 증상·음성 증상은 없고 환각도 없다. 가장 가능성 높은 진단은?","choices":["조현정동장애","편집성 인격장애","망상장애(의처증)","단기 정신병적 장애","편집형 조현병"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤): 망상장애는 망상 영역 외 기능이 잘 유지됨 – 염두에 두고 이해\n\n망상장애: 와해 증상·음성 증상이 없고 망상이 기괴하지 않으며 관련 환각이 있더라도 짧다. 교수님: 의처증(질투형)을 떠올리면 이해하기 쉽다. 망상장애 = paranoia = 편집증.","exps":["기분 증상이 함께 있어야 한다.","망상 수준의 확신은 인격장애로 설명되지 않는다.","정답.","한 달 안에 완전히 회복된다.","와해·음성 증상과 기능 저하가 있어야 한다."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz2-19","area":"탈야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 강의록 「조현병 2」 11쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병과 감별해야 할 인격장애로 강의록에 제시되지 않은 것은?","choices":["조현성(분열성) 인격장애","편집성 인격장애","의존성 인격장애","경계선 인격장애","조현형(분열형) 인격장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 11쪽: 분열성·분열형·편집성·경계선 인격장애. 그 밖에 이차적·물질에 의한 정신병적 장애, 전반적 발달장애, 꾀병과 허위성 장애.","exps":["제시됨.","제시됨.","정답.","제시됨.","제시됨."],"ai":"","fl":{}},{"k":"psy-y-scz-dx-2018","area":"야마","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2018 객14","type":"객","rep":6,"repyears":"2017 객14 · 2014 객16 · 2016 객14 · 2013 객5 · 2012 객6","stem":"26세 여성환자로, 오랜 취업준비 끝에 8개월 전 대기업 계약직으로 취직하였으나 익숙하지 않은 업무로 인해 상사에게 반복적으로 지적을 받아 큰 스트레스를 받았다. 평소 내성적인 성격으로 동료와 함께 어울려 회식자리를 참석하는 것에도 어려워하였고 업무를 제시간에 끝내지 못해 야근을 일상적으로 하였다. 내원 4개월 전부터 직장 동료들과 상사들이 자신을 얕잡아 보고 험담하는 것 같은 느낌을 받았다고 한다. 그러던 중 내월 2개월 전부터 혼잣말을 하는 모습이 계속 관찰되었고, 누구가 자신을 몰래 훔쳐보고 있다는 생각 때문에 샤워도 하지 못하였다. 회사 사람들 목소리로 자신을 해치겠다는 소리가 들린다며 출근도 하지 않고 불안해하는 모습이 점점 심해지자 보호자와 함께 정신과에 내원하였다. 이 환자에게 가장 합당한 정신과적 진단은?","choices":["조현병(Schizophrenia)","조현정동장애(Schizoaffective disorder)","조현양상장애(Schizophreniform disorder)","망상장애(Delusional disorder)","단기정신병적장애( Brief psychotic disorder)"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(임채원): 조현병·조현양상장애·단기정신병적장애는 기간으로 구분하는 문제가 계속 출제됨\n\nDSM 기준: 특징적 증상 2개 이상이 한 달 중 상당 기간 + 사회·직업 기 은?","choices":["편집형은 다른 아형에 비해 첫 발병 연령이 20-30대로 낮은 편으로 정상적인 사회생활을 하기 어려운 경우가 많다.","와해형은 상동증이나 매너리즘 등이 자주 나타나며, 흥분상태와 혼미상태의 양극단을 오가기도 한다.","미분화형은 모든 다른 아형의 진단 기준을 만족시키는 경우를 의미한다.","잔류형은 한때 정신분열병의 진단기준을 충족하지만 현재는 정신병적 증상 중 현저한 환각이나 망상 증상 중 한 가지만을 보이며 이에 환자가 영향을 받는 경우를 의미한다.","와해형은 혼자서 실실 웃고 부적절하게 킥킥거리거나 퇴행된 행동이 특징적으로 나타내며 주로 어린 나이에 발생한다."],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설 요약: ① 편집형은 20–30대로 약간 늦게 발병, 결혼·취업 등 정상 생활을 하는 경우가 많고 예후가 비교적 좋다. ② 흥분·혼미의 양극단은 긴장형. ③ 미분화형은 다른 아형으로 정의하기 힘든 경우. ④ 잔류형은 정신병적 증상이 없거나 경하고 주로 음성증상. ⑤ 와해형: 어린 나이 발병, 실실 웃고 킥킥거림, 퇴행(○).","exps":[],"ai":"","fl":{}},{"k":"psy-y-scz-schneider-2011","area":"야마","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2011 객17","type":"객","rep":1,"repyears":"","stem":"다음은 한 환자의 증상에 대한 기술이다. 이 환자의 정신병리를 가장 잘 설명하는 용어는? \" 언제부턴가 외부의 자극에 매우 민감해져서 내 내면에 뭔가 고무튜브 같은 딱딱하며 플라스틱같이 휘어지는 것이 느껴졌다. 이 이상한 것이 내 행동과 사고를 방해한다. 내가 어떤 사고를 하고 행동을 취하려고 해도 이 이상한 것이 내가 원하는 방향으로 움직이는 것을 막고 외부의 이상한 자극을 받아들여서 내가 견딜 수 없게 만든다. 가령 내가 어떤 행동을 취하려고 해도 이상한 자극이 들어와서 내가 견딜 수 없게 된다. 경험상 예를 들어 친구들과 만나서 눈을 마주치고 인사를 하려고 해도 눈을 마주치면 이상한 자극이 들어와서 이상한 행동을 취하게끔 만든다.\"","choices":["관계망상 (delusion of reference)","사고탈취 (thought withdrawal)","망상적 지각 (delusional percption)","조종망상 (being controlled delusion)","사고전파 (thought broadcasting)"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설 요약: 조종망상: 외부로부터 자신의 의지·감정·충동·행동이 영향을 받거나 강요당한다는 망상(슈나이더 1급 증상). 사고탈취 = 생각을 빼앗아 감, 망상적 지각 = 정상 지각에 개인적 의미 부여, 사고전파 = 생각이 퍼져 모두 안다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-scz-hist-2011","area":"야마","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2011 객19","type":"객","rep":1,"repyears":"","stem":"DSM-IV에서 정신분열병 진단기준은 ( 가 )에서는 크레펠린의 견해를 강조하였고, ( 나 )에서는 슈나이더의 견해를 강조하였고, 블로일러의 핵심증상은 ( 다 )으로 재개념화한 것으로 현재 세계적으로 널리 사용되고 있다. ( ) 안에 들어갈 순서로 옳은 것은?","choices":["가: 경과 – 나: 증상 – 다: 음성증상","가: 원인 – 나: 치료 – 다: 양성증상","가: 증상 – 나: 경과 – 다: 음성증상","가: 치료 – 나: 원인 – 다: 양성증상","가: 경과 – 나: 원인 – 다: 음성증상"],"ans":[1],"imgs":[],"vis":[],"notes":["선지는 학습지의 가·나·다 표를 한 줄로 옮긴 것."],"basis":"📚 학습지 해설 요약: 미국정신의학회는 경과에서 크레펠린, 증상에서 슈나이더(특정 망상·환각), 블로일러의 핵심증상은 음성증상으로 재개념화해 진단기준을 만들었다.","exps":[],"ai":"","fl":{}},{"k":"psy-ax-fh","area":"야마","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 30쪽(형성평가) · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"🤍형성평가 45세 여자가 평소 걱정이 많아 자주 불면이 있었고 안절부절하다고 병원에 왔다. 최근에는 유행하는 독감에 걸려 죽을지 모른다는 생각이 들어 괴롭고, 집중력이 떨어지며 피곤하고, 근육 긴장과 두통이 자주 생긴다고 하였다. 진단은?","choices":["공황장애","강박장애","범불안장애","질병불안장애","신체증상장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"수업 중 교수님 풀이: 공황장애처럼 피크가 있는 것도 아니고, 강박 생각이 있는 것도 아니며, 특정 질환(암 등)만 걱정하는 질병불안장애나 신체 증상이 주가 되는 신체증상장애와 달리 매사에 불안한 범불안장애. 걱정·불면·안절부절·집중력 저하·피로·근육 긴장이 범불안장애 동반 증상(6개 중 3개 이상)에 해당한다.","exps":["몇 분 안에 최고조에 이르는 공황발작이 없다.","강박사고·강박행동이 없다.","정답.","특정 질병에 대한 집착이 아니라 매사에 대한 걱정이다.","설명되지 않는 신체 증상이 주가 아니다."],"ai":"","fl":{}},{"k":"psy-ax-01","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 6쪽 · 교과서 12장(불안장애) 310쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"불안과 공포에 대한 설명으로 옳은 것은?","choices":["공포는 대상이 모호하고 내부적으로 경험된다","불안은 대상이 모호하고, 공포는 대상이 분명하다","둘은 정신의학적으로 같은 개념이다","공포는 자율신경 반응을 동반하지 않는다","불안은 대상·상황이 알려진 외부적인 것이다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6쪽·교과서 310쪽: 불안은 대상이 모호하고 내부적으로 경험, 공포는 대상 혹은 상황이 알려진 외부적인 것(예: 모서리 공포증 – 모서리만 보면 무서움). 둘 다 빈맥·진전 등 자율신경 반응을 동반한다.","exps":["반대다.","정답.","구분되는 개념이다.","자율신경 반응을 동반한다.","반대다."],"ai":"","fl":{}},{"k":"psy-ax-02","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 6쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"정상 불안과 병적 불안의 차이로 옳지 않은 것은?","choices":["정상 불안은 적응적 기능을 한다","병적 불안은 실제 위험 상황이 아닌데도 생긴다","병적 불안은 시험 공부를 미리 하게 하는 등 도움이 된다","병적 불안은 지나치게 심하고 비적응적 대처로 상황을 악화시킨다","정상 불안은 위험 상황에 대한 정상 반응이다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"시험 전에 불안해서 공부를 미리 하는 것은 정상 불안의 적응적 기능이다. 병적 불안은 실제 위험이 아님에도, 지나치게 심하고, 비적응적 대처로 오히려 불안을 악화시킨다.","exps":["옳다.","옳다.","정답. 정상 불안의 예다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-ax-03","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 6쪽 · 교과서 12장(불안장애) 310쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"불안장애 환자에게 알코올 등 물질사용장애가 흔히 동반되는 이유로 강의에서 설명한 것은?","choices":["불안장애 진단 기준에 음주가 있어서","예민함을 낮추려는 자가처방으로 마셔서","불안과 알코올 의존의 유전자가 같아서","알코올이 세로토닌 재흡수를 억제해서","항불안제가 알코올 갈망을 일으켜서"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"술을 마시면 마음이 편해지고 차분해지므로 너무 예민한 상태를 낮추려고 술을 많이 마신다(자가처방). 불안장애는 다른 불안장애·우울장애와의 공존도 흔하다.","exps":["해당 없다.","정답.","해당 없다.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ax-04","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 이전의 불안장애에서 분리되어 다른 범주가 된 질환으로만 묶인 것은?","choices":["광장공포증, 공황장애","사회불안장애, 특정공포증","강박장애, 외상후 스트레스 장애","공황장애, 범불안장애","분리불안장애, 선택적 함구증"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"DSM-IV까지는 OCD와 PTSD도 불안장애였으나, 뇌 회로 등이 달라 DSM-5에서 강박 및 관련 장애, 외상 및 스트레스 관련 장애로 분리했다. 반대로 분리불안장애·선택적 함구증은 소아 장애에서 불안장애로 들어왔다.","exps":["둘 다 불안장애이며 DSM-5에서 서로 독립 진단이 되었다.","불안장애에 남아 있다.","정답.","불안장애 Big 3에 남아 있다.","불안장애로 들어왔다."],"ai":"","fl":{}},{"k":"psy-ax-05","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 불안장애의 \"Big 3\"라고 한 것은?","choices":["범불안장애 · 질병불안장애 · 신체증상장애","공황장애 · 강박장애 · PTSD","특정공포증 · 광장공포증 · 분리불안장애","공황장애 · 사회불안장애 · 범불안장애","선택적 함구증 · 분리불안장애 · 특정공포증"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"파란색으로 표시된 불안장애 Big 3: 공황장애, 사회불안장애, 범불안장애. 여기에 강박장애와 PTSD를 더해 \"Big 5\"라 하고, 이들 모두 1차 선택약은 SSRI다.","exps":["다른 범주가 섞였다.","OCD·PTSD는 다른 범주로 분리됐다.","Big 3가 아니다.","정답.","소아 관련 불안장애다."],"ai":"","fl":{}},{"k":"psy-ax-06","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 315쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repy s":[3],"imgs":[],"vis":[],"notes":[],"basis":"재흡수 억제로 늘어난 세로토닌이 자가수용체(브레이크 역할)에 작용해 이를 하향조절(down-regulation)시켜야 세로토닌 \"공장\"이 계속 돌아간다. 이 과정에 약 1–2주 걸린다. 교수님: 학생 수준에서는 \"SSRI는 효과가 늦게 나온다\"는 것을 기억하면 된다.","exps":["해당 없다.","해당 없다.","정답.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ax-13","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 311쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"공황장애·사회불안장애·범불안장애·강박장애·PTSD에 공통된 1차 선택 약물은?","choices":["SSRI","항정신병약물","베타차단제","삼환계 항우울제","벤조디아제핀"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"교과서 311쪽(TY): 현재 SSRI는 공황장애·사회불안장애·범불안장애 등 주요 불안장애와 강박장애·PTSD에 모두 1차 선택 약물. 교수님: \"1차 선택약을 모르면 SSRI라고 하면 거의 90%는 맞는다.\"","exps":["정답.","강박장애 증강 요법 등에 쓴다.","수행형 사회불안장애에 일시적으로 쓴다.","부작용 때문에 1차가 아니다.","급성기·단기 사용이다."],"ai":"","fl":{}},{"k":"psy-ax-14","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"📌티야방 · 근거: 교과서 12장(불안장애) 317쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"다음 중 SSRI가 아닌 것은?","choices":["에스시탈로프람(escitalopram)","플루옥세틴(fluoxetine)","서트랄린(sertraline)","부스피론(buspirone)","파록세틴(paroxetine)"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): SSRI 이름(sertraline·fluoxetine·paroxetine·citalopram·fluvoxamine)까지 외우라고 하심\n\n교과서 317쪽(TY): 파록세틴, 서트랄린, 플루복사민, 시탈로프람, 에스시탈로프람, 플루옥세틴. 교수님: 예전에는 \"SSRI\"라고만 냈지만 요즘은 약 이름으로 내니 이 이름들은 알아야 한다. 부스피론은 azapirone 계열 5-HT1A 부분 작용제.","exps":["SSRI.","SSRI.","SSRI.","정답.","SSRI."],"ai":"","fl":{"tyb":1}},{"k":"psy-ax-15","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 317쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"공황장애 약물치료 기간에 대한 설명으로 옳은 것은?","choices":["증상이 없어지면 그날 바로 끊는다","벤조디아제핀을 평생 복용한다","3개월 후 평가, 반응 후 6개월 이상, 1–2년 유지","2주 먹고 효과 없으면 치료를 포기한다","1주일만 먹으면 충분하다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"교과서 317쪽: 효과는 약 3개월 후 평가, 반응한 이후에도 약 6개월 이상 지속, 만성적이고 재발이 잦아 12–24개월 유지치료 권장. 교수님: 연예인들이 약을 한두 달 먹다 말아 재발하는 것이 문제 – 꾸준히 1–2년 먹으면 치료된다.","exps":["재발이 잦다.","의존 위험이 있다.","정답.","효과 평가에 시간이 걸린다.","짧다."],"ai":"","fl":{}},{"k":"psy-ax-16","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 310쪽 · STT 10/14 강박장애 강의(양종철) · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"공황장애에서 SSRI를 시작할 때 저용량(예: 반 알)부터 시작하는 이유는?","choices":["간 독성이 특히 심하게 나타나서","보험 기준상 반 알만 인정되어서","벤조디아제핀과 심한 상호작용이 있어서","초기 자극 작용을 공황으로 오해해 악화될 수 있어서","효과가 너무 빨리 나타나 위험해서"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님: SSRI는 초기에 몸 감각을 약간 자극(stimulating)하는 경향이 있어 몸 감각에 예민한 공황장애 환자가 \"이것도 공황인가\" 하고 악화될 수 있다. 그래서 저용량으로 시작해 서서히 올리고 장기간 유지(교과서 310쪽: 치료 초기에는 오히려 불안을 악화시키는 경우도 있음).","exps":["해당 없다.","해당 없다.","해당 없다.","정답.","반대로 늦다."],"ai":"","fl":{}},{"k":"psy-ax-17","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"공황장애 환자가 \"나는 달리기를 하면 공황이 오는데 운동을 해야 하나요?\"라고 묻는다. 교수님이 권한 답은?","choices":["110% 이상 강하게 해서 한 번에 극복한다","운동은 공황을 유발하니 절대 하지 않는다","해야 하며, 80–90% 강도로 반복하다 점차 늘린다","약을 끊고 운동만으로 치료한다","공황이 올 때만 운동으로 해소한다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"운동은 해야 한다. 일반 운동요법은 약간 넘치게(110%) 하지만 공황장애 환자는 반대로 80–90%를 반복해 익숙해지면 점점 늘린다. 이는 두려운 신체 감각에 일부러 노출시키는 내수용 노출(interoceptive exposure)과 같은 원리.","exps":["오히려 악화될 수 있다.","회피가 공황을 유지시킨다.","정답.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ax-18","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 17쪽 · 교과서 12장(불안장애) 317쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"공황장애 인지행동치료의 구성으로 옳지 않은 것은?","choices":["인지 재구조화","머리 돌리기·계단 오르기 같은 내수용 노출","지하철 두 정거장부터 시작하는 단계적 실제 노출","어린 시절 무의식적 갈등을 장기간 분석","공황에 대한 정신교육(\"죽지 않는다\")"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"공황장애 CBT: 정신교육, 인지 재구조화, 호흡 재훈련·이완, 내수용 노출, 상상 노출, 실제 노출(강의록 17쪽). 교수님: 공황장애는 처음부터 통찰 정신치료를 거의 하지 않는다. 마음의 근본 원인을 찾는 정신분석적 치료는 성격장애 등에 쓴다.","exps":["포함.","포함.","포함.","정답.","포함."],"ai":"","fl":{}},{"k":"psy-ax-19","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta": ],"basis":"생각 = obsession, 행동 = compulsion이 아니다. 강박사고(obsession)를 줄여 주는 방향이면 머릿속에서 하는 정신적 활동(mental act: 기도하기, 숫자 세기, 속으로 단어 반복)도 강박행동이다. 교수님이 \"헷갈리는 것\"이라며 강조했다.","exps":["정답.","\"나는 죄인이다\"가 강박사고다.","해당 없다.","해당 없다.","확신하는 믿음이 아니다."],"ai":"","fl":{}},{"k":"psy-oc-04","area":"티야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 강의록 「1014 양종철pf」 36쪽 · STT 10/14 강박장애 강의(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 강박장애를 불안장애에서 분리한 근거로 강의에서 설명한 것은?","choices":["불안장애와 관여하는 뇌 회로가 달라서","강박장애는 약물 치료가 필요 없어서","강박장애에는 불안이 전혀 없어서","강박장애는 소아에게만 생겨서","강박장애는 정신병에 속해서"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"영상 연구에서 강박장애는 안와전두피질(orbitofrontal cortex)·미상핵(caudate) 등 생각·인지·행동 기억과 관련된 다른 회로가 관여한다(강의록 36쪽: 안와전두피질과 미상핵의 활성 증가).","exps":["정답.","SSRI 등 약물치료를 한다.","불안은 동반된다.","해당 없다.","아니다."],"ai":"","fl":{}},{"k":"psy-oc-05","area":"티야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 교과서 13장(강박 및 관련 장애) 345쪽 · STT 10/14 강박장애 강의(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"강박장애에서 증상의 심각도와 비례해 활성이 증가하고 치료 후 감소한다고 해서 교수님이 \"꼭 기억하라\"고 한 부위는?","choices":["소뇌","후두엽","편도","안와전두피질","시상하부"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교과서 345쪽: 안와전두피질 활성 증가는 강박장애 심각도와 관련되고 치료 후 감소. 교수님: fMRI에서 증상과 밝기가 비례하므로 과학적 근거가 높다. \"강박장애는 OFC, 불안장애(공황)는 편도\"로 기억.","exps":["해당 없다.","해당 없다.","불안장애·공황장애의 핵심이다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-oc-06","area":"티야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"📌티야방 · 근거: 교과서 13장(강박 및 관련 장애) 339쪽 · STT 10/14 강박장애 강의(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"강박 및 관련 장애로 묶인 질환과 DSM-IV에서의 원래 위치가 바르게 짝지어진 것은?","choices":["피부뜯기장애 – 신체형장애","신체이형장애 – 강박장애의 한 아형","신체이형장애 – 충동조절장애","저장장애 – 강박장애의 한 아형","발모광 – 신체형장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): 교과서 340쪽 TY – 전체 페이지(장애별 특징) 읽어 보기\n\n교수님 설명(교과서 339쪽): 신체이형장애는 신체형장애에서 \"데려온\" 것, 발모광·피부뜯기장애는 충동조절장애에 있다가 옮겨온 것, 저장장애는 강박장애의 한 아형이었다가 독립(\"분가\")한 것.","exps":["충동조절장애에서 왔다.","신체형장애에서 왔다.","신체형장애에서 왔다.","정답.","충동조절장애에서 왔다." 양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"강박장애의 SSRI 반응 특성에 대한 설명으로 옳지 않은 것은?","choices":["저용량으로 천천히 올려도 충분하다","더 높은 용량이 필요하다","세로토닌 선택성이 중요하다","부분 반응이 많다","반응이 늦게 나온다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): 강박장애는 우울증 치료보다 용량을 많이, 오래\n\n강의록 40쪽: serotonin selectivity, slower response, requirement of higher doses, partial responsiveness. 교수님: 공황장애는 저용량부터 서서히 올리지만, 강박장애는 처음부터 세게 써도 부작용이 잘 안 나오고 \"질겨서\" 많이 오래 써야 한다. 매년 물어보는 중요한 내용.","exps":["정답. 공황장애와 다르다.","옳다.","옳다.","옳다(절반은 잘 좋아지지 않음).","옳다."],"ai":"","fl":{"tyb":1}},{"k":"psy-oc-15","area":"티야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"📌티야방 · 근거: 교과서 13장(강박 및 관련 장애) 345쪽 · STT 10/14 강박장애 강의(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"SSRI에 충분히 반응하지 않는 강박장애에서 증강 요법으로 쓰는 약과 그 근거가 바르게 짝지어진 것은?","choices":["리튬 – 조증 예방","벤조디아제핀 – GABA 결핍","베타차단제 – 교감신경 억제","비정형 항정신병약물 – 도파민 관여","부스피론 – 5-HT1A 작용"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): 틱장애·망상 동반 시 도파민 차단제(risperidone, olanzapine 등)\n\n세로토닌 제제만으로 잘 좋아지지 않아 항정신병약물(도파민 차단)을 함께 써 보니 좋아졌고, 이를 근거로 강박장애에 도파민도 관여한다고 본다. SSRI 이전에는 clomipramine(삼환계, 부작용은 많지만 세다)을 썼다.","exps":["해당 없다.","장기간 권장되지 않는다.","해당 없다.","정답.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-oc-16","area":"티야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"📌티야방 · 근거: 강의록 「1014 양종철pf」 39쪽 · STT 10/14 강박장애 강의(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"손이 더럽다는 강박이 있는 환자에게 걸레를 5분간 만지게 한 뒤 손을 씻지 못하게 하는 치료는?","choices":["사고 정지","혐오 기법","노출 및 반응 방지","체계적 탈감작","습관 역전"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): 행동치료 ERP – 노출 후 문제 행동을 못 하게 함\n\nERP(exposure and response prevention): 걸레를 만지는 것이 exposure, 손을 못 씻게 하는 것이 response prevention. 강박장애 행동치료의 가장 대표적 방법. 교수님: 잠깐 하다 말면 다시 생기므로 강도 높게 오랫동안 집중적으로 해야 한다(수박씨 세기 예).","exps":["다른 기법이다.","다른 기법이다.","정답.","다른 기법이다.","발모광·피부뜯기장애에 쓴다."],"ai":"","fl":{"tyb":1}},{"k":"psy-oc-17","area":"탈야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 강의록 「1014 양종철pf」 38쪽 · STT 10  대표적이다."],"ai":"","fl":{}},{"k":"psy-sz3-30","area":"티야","prof":"정영철","sec":"10/19 · 조현병 3 (치료·항정신병약물)","meta":"근거: 강의록 「조현병 3(항정신병약물)」 26쪽 · STT 10/19 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"항정신병약물과 임신에 대한 기본 원칙으로 교수님이 설명한 것은?","choices":["임신은 약물 선택과 관계없다","임신 중에도 용량을 늘린다","확실한 기형 유발 약이므로 즉시 모두 끊는다","기형 증거는 없으나 가능하면 first trimester에는 피한다","임신 3기에만 피한다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 26쪽: 기형의 증거는 없으나 유해한 영향(neonatal toxicity 등)이 있을 수 있어 first trimester는 피할 것. 교수님: \"가능하면\"이 중요 – 줄이다 나빠져서 못 끊는 경우도 적지 않다.","exps":["중요한 이슈다.","해당 없다.","기형 증거는 없다.","정답.","first trimester다."],"ai":"","fl":{}},{"k":"psy-sz3-31","area":"탈야","prof":"정영철","sec":"10/19 · 조현병 3 (치료·항정신병약물)","meta":"근거: 강의록 「조현병 3(항정신병약물)」 27쪽 · STT 10/19 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"항정신병약물의 혈중 농도를 낮추는 약물로 짝지어진 것은?","choices":["benztropine, trihexyphenidyl","paroxetine, fluoxetine","phenytoin, carbamazepine","cimetidine, 제산제","lorazepam, alprazolam"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 27쪽: paroxetine·fluoxetine은 농도를 올리고, phenytoin·barbiturate·carbamazepine은 CYP 효소를 유도해 농도를 줄인다. 제산제·cimetidine은 위장관 흡수 저해, 항콜린성 항파킨슨제는 장운동 저하로 다른 약 흡수 증가.","exps":["해당 없다.","농도를 올린다.","정답.","흡수를 저해하는 기전이다(효소 유도 아님).","해당 없다."],"ai":"","fl":{}},{"k":"psy-sz3-32","area":"티야","prof":"정영철","sec":"10/19 · 조현병 3 (치료·항정신병약물)","meta":"근거: 강의록 「조현병 3(항정신병약물)」 29쪽 · STT 10/19 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 \"항비만약 때문에 환청이 생겨서 오는 경우가 있다\"며 정리한, 중추에 작용하는 식욕억제제 계열은?","choices":["orlistat 등 지방 흡수 억제제","phentermine 등 amphetamine 유사체","statin 등 콜레스테롤 합성 억제제","insulin 등 혈당 강하 주사제","metformin 등 biguanide 계열"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 29쪽: 중추 기전 – NE·5-HT에 작용해 식욕 조절(amphetamine 유사체: phentermine, phendimetrazine, diethylpropion). 말초 기전 – 소화·흡수에 작용(orlistat). 조현병 환자의 체중 문제 상담과 연결.","exps":["말초 기전이다.","정답.","해당 없다.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-y-scz-drug-2023","area":"야마","prof":"정영철","sec":"10/19 "","type":"객","rep":1,"repyears":"","stem":"PTSD 약물치료에서 SSRI에 대해 교수님이 \"객관식으로 엄청 많이 나오는 문장\"이라고 한 것은?","choices":["우울 증상만 개선하며 침습·회피 증상에는 효과가 없다","외상 직후 예방 목적으로만 쓰고 치료에는 쓰지 않는다","PTSD의 모든 증상 영역을 감소시킨다고 밝혀진 유일한 약물이다","투여 1주 안에 모든 증상 영역에서 효과가 완전히 나타난다","공황장애보다 훨씬 적은 용량으로 짧게 쓰면 충분하다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(조수안): SSRI는 PTSD 4가지 주요 증상을 \"모두\" 경감(우울만 X) – 객관식으로 많이 나온다고 언급\n\n교과서 365쪽·교수님: SSRI는 PTSD의 모든 영역 증상을 감소시켜 줄 수 있다고 밝혀진 유일한 약물 – 단지 우울을 개선해서 좋아지는 것이 아니라 침습·회피·인지·각성 4가지 척도가 다 좋아진다. 증상이 3–4주 지속되면 SSRI를 시작한다.","exps":["4개 영역 모두다.","치료 약이다.","정답.","수 주가 걸린다.","PTSD·OCD는 우울증보다 2–3배 충분히 쓴다."],"ai":"","fl":{"tyb":1}},{"k":"psy-pt-18","area":"티야","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 강의록 「1019 PTSD」 17쪽 · STT 10/19 3교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"SSRI 용량 원칙에 대한 교수님 설명으로 옳은 것은?","choices":["강박장애는 공황장애보다 적은 용량이면 된다","공황장애는 처음부터 고용량으로 시작한다","PTSD는 최소 용량으로 짧게 쓴다","모든 불안장애는 같은 용량으로 쓴다","PTSD·강박장애는 우울증보다 2–3배 충분한 용량이 필요하다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님: PTSD와 OCD는 우울증에 쓰는 한 알로 시작하더라도 2배, 3배 충분히 써야 한다. 공황장애는 몸이 예민해 소량부터 서서히 올린다.","exps":["강박장애도 충분한 용량이다.","소량부터 서서히 올린다.","충분히 써야 한다.","질환마다 다르다.","정답."],"ai":"","fl":{}},{"k":"psy-pt-19","area":"티야","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 강의록 「1019 PTSD」 18–19쪽 · STT 10/19 3교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"PTSD 예방·초기 치료에서 propranolol과 benzodiazepine에 대한 설명으로 옳은 것은?","choices":["propranolol은 초기에 도입할 수 있으나 3개월 이상 쓸 필요는 없다","propranolol은 평생 유지해야 한다","benzodiazepine을 장기간 써서 예방한다","둘 다 PTSD에는 금기다","benzodiazepine은 PTSD 예방 효과가 확실하다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 18–19쪽·교수님: 높은 심박수를 빨리 떨어뜨리려 propranolol을 썼더니 초기에는 증상이 떨어졌지만 3개월에는 안 쓴 군과 같았다 → 도입은 좋지만 3개월 이상 쓸 필요는 없다. BZD는 초기 불안에 단기간 쓸 수 있으나 예방 효과는 없다(BZD군 69% vs 대조군 15%가 PTSD).","exps":["정답.","3개월 이후 차이가 없다.","장기 사용은 의존성 문제가 있다.","쓸 수 있다.","예방 효과가 없다."],"ai":"","fl":{}},{"k":"psy-pt-20","area":"티야","prof":"양종철","sec":"10  알아야 합니다\" – 편도에 강하게 저장된 기억을 말로 처리해 해마로 재처리\n\n교수님: 외상 기억은 편도·노르에피네프린이 관여해 강하게 각인된다. 이를 충분히 말로 처리하면 탈감작되고 해마로 재처리(reprocessing)되어 잊힐 수 있는 일반 기억이 된다. 다만 말하다 감정에 빠지지 않게 불빛을 좌우로 따라가며 주의를 분산시키는 것 – 원리만 알면 손으로 두드리게 해도 된다.","exps":["치료 기법이다.","기억을 지우는 것이 아니다.","정답.","해당 없다.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-pt-23","area":"티야","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 강의록 「1019 PTSD」 21쪽 · 교과서 14장(외상 및 스트레스 관련 장애) 364쪽 · STT 10/19 3교시(양종철) · STT 10/19 4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"PTSD 정신치료의 일반 원칙으로 교수님이 설명한 것과 다른 것은?","choices":["PTSD로 진단되면 증상이 가벼워도 일단 입원시킨다","외상 사건을 부정하지 않고 받아들이도록 돕는다","의존·만성화되지 않도록 단기간에 한다","이완하도록 돕고 지지를 제공한다","스트레스 원천에서 떼어 놓는다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 21쪽: short-term, 외상 사건에 대한 부정을 극복, 이완, 스트레스 원천에서 분리, 지지 제공. 교수님: 무조건 입원은 틀린 말 – 아주 심하지 않으면 일상생활을 하도록 권고해야 의존·만성화를 막는다(자살·폭력 위험 등에서만 제한적으로 입원).","exps":["정답.","옳다.","옳다.","옳다.","옳다(오토바이 사고 후 다시 타려 하면 말린다)."],"ai":"","fl":{}},{"k":"psy-pt-24","area":"티야","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 강의록 「1019 PTSD」 6·23쪽 · STT 10/19 3교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"세월호 같은 대형 참사 직후 피해자 가족에게 가장 먼저 필요한 개입으로 교수님이 든 예는?","choices":["노출치료를 즉시 시작한다","담요·따뜻한 차 등 지지와 기다림을 제공한다","곧바로 심리 척도로 점수를 매긴다","고용량 BZD를 장기 처방한다","사건을 자세히 말하도록 바로 유도한다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 참사 초기 텐트에서 척도 점수를 묻자 가족들이 화를 냈다 – 초기에는 담요라도 더 주고 따뜻한 차 한잔 대접하며 기다리는 지지가 가장 중요. 1주쯤 지나 슬픔을 달래고, 1–6개월에도 못 빠져나오면 장기 치료 계획 – 시기(phase)에 따라 개입을 달리한다.","exps":["시기가 이르다.","정답.","초기에는 오히려 화를 냈다.","해당 없다.","디브리핑처럼 악화될 수 있다."],"ai":"","fl":{}},{"k":"psy-pt-25","area":"티야","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 강의록 「1019 PTSD」 23쪽 · STT 10/19 3교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"어린 자녀를 사고로 잃은 부모가 \"내가 그날 데려다줬어야 했다\"는 죄책감에 사로잡혀 증상이 오래간다. 교수님이 이런 경우 도움이 된다고 한 치료는?","choices":["역동(정신)치료","디브리핑","홍수법만 단독으로","항정신병약물 단독","혐오요법"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis": s":"📚 학습지 해설 요약: PTSD: 생명을 위협하는 외상 후 재경험(악몽·회상)·회피·과각성. 불안과 두려움의 중추는 편도(amygdala).","exps":[],"ai":"","fl":{}},{"k":"psy-y-pt-amy-2013","area":"야마","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 학습지 「외상 및 스트레스 관련 장애」 196–204쪽","year":"2013 객22","type":"객","rep":2,"repyears":"2012 객30","stem":"[21-22] 미국 뉴욕 ‘세계무역기구가 있던 110층 쌍둥이 빌딩에서 근무하던 한국인 남자가 항공기 테러 공격직후 계단을 통해 필사적으로 뛰어 내려와 목숨을 건졌다. 그러나 얼마 후 그 빌딩이 붕괴된 장면을 보고 큰 충격을 받았다. 이 후 거의 매일 밤 그 때 일이 설명하게 떠오르고 악몽에 시달리며 불안, 초조, 공포감 때문에 고통스러워한다. 그는 고층 건물 근처에도 가는 것을 회피하며, 단층 주택에서 지내고 정신과 진료를 받고 있다. 그는 과거력에서 그 사건이전에는 건강하였다. 상기 증례 환자의 불안과 두려움에 중추적인 역할을 수행하는 뇌부위는?","choices":["시상","시상하부","해마","편도","선조체"],"ans":[4],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2012 객30"],"basis":"📚 학습지 해설 요약: PTSD: 생명을 위협하는 외상 후 재경험(악몽·회상)·회피·과각성. 불안과 두려움의 중추는 편도(amygdala).","exps":[],"ai":"","fl":{}},{"k":"psy-y-pt-adj-2011","area":"야마","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 학습지 「외상 및 스트레스 관련 장애」 196–204쪽","year":"2011 객38","type":"객","rep":1,"repyears":"","stem":"초등학교 2학년 남자아이가 야뇨증세로 내원했다. 환자는 원래 소변을 잘 가렸으나 수개월 전에 전학을 하면서 소변을 지리기 시작했다. 비뇨기과적 검사에서는 별다른 이상 소견이 관찰되지 않았다. 이 환자의 치료에 대한 설명 중 옳은 것은?","choices":["놀이치료가 효과적이다.","플록세틴(fluoxetine)을 먼저 사용해 본다.","리스페리돈(risperidone)을 먼저 사용해 본다.","벨-경보(bell-alarm) 요법은 효과가 제한적이다.","심리적 스트레스가 많은 경우에는 긍정적 강화법이 효과적이지 않다."],"ans":[1],"imgs":[],"vis":[],"notes":["학습지 해설은 \"수개월\"을 3개월 이내로 가정해 풀었다."],"basis":"📚 학습지 해설 요약: 전학이라는 일상 스트레스 후 생긴 증상 → 적응장애. 적응장애는 정신치료가 가장 좋고, 아동에서는 놀이치료·소집단치료·지지적 치료를 강조한다.","exps":[],"ai":"","fl":{}},{"k":"psy-sz5-01","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"📌티야방 · 근거: 강의록 「조현병 5」 2쪽 · STT 10/20 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"망상장애의 망상이 조현병의 망상·관계사고와 구분되는 특징으로 교수님이 강조한 것은?","choices":["망상보다 환청이 훨씬 두드러지게 나타난다","체계적이고 괴이하지 않으며 현실적 근거가 있다","인격과 일상 기능이 빠르게 황폐화된다","망상 내용이 체계 없이 매일 바뀐다","불특정 다수가 이유 없이 자신을 감시한다고 느낀다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이도연): 망상장애: 체계적·괴이하지 않은 망상 1개월 이상, 특정 대상에 국한, 망상 외 기능 정상 – 조현병과는 괴이성·두드러진 환각 여부로 감별, 중년 이후·여성 호발\n\n강의록 2쪽·교수님: 망상장애(paranoia, 편집증)는 체계적이고 괴이하지 않은(실제 생활과 관련된) 망상, 인격 유지가 잘 되고 가족 내 정신병적 유전부하가 적으며 외적 요인이 많이 작용. 위층과 층간소음으로 싸운 뒤 \"일부러 그런다\" – 이유가 있고 논리적이다. 조현병은 모르는 불특정 다수를 이유 없이 의심한다.","exps":["환각은 망상 주제와 연관되고 두드러지지 않는다.","정답.","인격이 잘 유지된다.","지속적이다.","조현병 쪽이다."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz5-02","area":"탈야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 강의록 「조현병 5」 3쪽 · STT 10/20 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"\"망상을 시사하는 양상\"으로 강의록에 제시되지 않은 것은?","choices":["믿음이 지속적이다","반대하려는 시도에 부적절한 감정 반응을 보인다","믿음에 대해 민감해지고 유머를 잃는다","주변 사람과 공유되지 않는다","믿음을 쉽게 바꾸고 농담으로 넘긴다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 3쪽: 지속적, 공유되지 않음, 개인 삶에 강한 영향, 민감해지고 유머를 잃음, 확신하지만 질문받으면 비밀로 하거나 분노, 반대 시도에 부적절한 감정 반응, 일상생활 무시, 행동화할 때 난폭성.","exps":["제시됨.","제시됨.","제시됨.","제시됨.","정답."],"ai":"","fl":{}},{"k":"psy-sz5-03","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"📌티야방 · 근거: 강의록 「조현병 5」 4쪽 · STT 10/20 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"망상장애의 역학으로 옳은 것은?","choices":["미혼·고학력에 많다","10대 후반–20대 초반 남자에 호발","조현병보다 훨씬 흔하다","중년기 이후 발생, 여자에 호발","이민자에서는 드물다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이도연): 망상장애: 체계적·괴이하지 않은 망상 1개월 이상, 특정 대상에 국한, 망상 외 기능 정상 – 조현병과는 괴이성·두드러진 환각 여부로 감별, 중년 이후·여성 호발\n\n강의록 4쪽: 조현병보다 적음(인구 10만 명당 24–30명), 중년기 이후 발생, 여자 호발, 기혼이 많고 사회경제·교육 수준이 낮으며 이민자가 많다. 교수님: 나이가 중요 – 조현병은 10대 후반–30대 초반.","exps":["기혼·낮은 교육 수준.","조현병 쪽이다.","더 적다.","정답.","이민자가 많다."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz5-04","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"📌티야방 · 근거: 강의록 「조현병 5」 5–6쪽 · STT 10/20 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"귀가 잘 안 들리는 사오정이 남들이 속삭이면 화를 내는 장면을 들어, 교수님이 망상장애의 원인으로 설명한 것은?","choices":["중뇌 도파민 과잉","전두엽의 뇌종양","억압된 동성애 충동","어린 시절의 과잉보호","청력 상실 등 기능 상실"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이도연): 원인: 이민·이주·귀머거리·사회적 고립·자존감 저하 등 – 억압된 동성애 이론은 폐기된 옛 이론\n\n강의록 5쪽·교수님: 이민·이주·귀머거리(청력 상실)·급성 발병이 흔한 원인 – 기능 상실·결핍이 있으면 확인하려다 의심으로 넘어간다. 성기능 장애도 흔하다. 편집성 허위사회(Cameron), 친족에 편집성 인격장애. 억압된 동성애 충동(Freud)은 교수님이 \"폐기된 이론\"이라고 했다.","exps":["해당 없다.","해당 없다.","교수님이 폐기된 이론이라고 했다.","해당 없다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz5-05","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"📌티야방 · 근거: 강의록 「조현병 5」 8쪽 · STT 10/20 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"망상장애와 감별해야 할 질환의 특징 연결이 옳지 않은 것은?","choices":["망상장애 – 괴이하지 않은 망상이 1개월 이상","기분장애 – 망상이 단기간","망상장애 – 망상 주제와 무관한 환각이 지속적으로 두드러짐","편집성 인격장애 – 의심·지나친 경계이지 망상 수준은 아님","조현병 – 괴이한 망상, 두드러진 환각"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이도연): 망상장애: 체계적·괴이하지 않은 망상 1개월 이상, 특정 대상에 국한, 망상 외 기능 정상 – 조현병과는 괴이성·두드러진 환각 여부로 감별, 중년 이후·여성 호발\n\n강의록 8쪽: 진단 – 괴이하지 않은 망상이 1개월 이상, 환각은 망상 주제와 연관(두드러지지 않고 일시적), 피해·관계망상이 가장 흔함, 만성 의심과 성기능장애도 흔함. 감별 – 조현병(괴이성·환각), 편집성 인격장애(망상 아님), 기분장애(단기간).","exps":["옳다.","옳다.","정답.","옳다.","옳다."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz5-06","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"📌티야방 · 근거: 강의록 「조현병 5」 9쪽 · STT 10/20 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"망상장애 아형과 설명의 연결이 옳은 것은?","choices":["피해형 – 오델로 증후군, 남자에 많다","색정형 – 이상적 사랑이나 영적 결합, 독신 여자에 많다","질투형 – 가장 흔하고 투서·고소로 이어진다","과대형 – 냄새가 난다고 믿음","신체형 – 위대한 재능·발명"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이도연): 아형: 피해형이 가장 흔함, 질투형(오셀로·의처증)은 남성에 흔함, Capgras(변장)·Cotard(허무망상)\n\n강의록 9쪽: 피해형 – 가장 흔함, 투서·고소(고소광) / 질투형 – 오델로 증후군, 결혼 편집증(의처·의부증), 남자가 많음 / 과대형 – 위대한 재능·발명(교수님 예: 태양열 특허) / 신체형 – 에이즈에 걸렸다·냄새가 난다 / 색정형 – 이상적인 사랑·영적 결합, 여자·독신(연예인 쫓아다니기).","exps":["질투형이다.","정답.","피해형이다.","신체형이다.","과대형이다."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz5-07","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"📌티야방 · 근거: 강의록 「조현병 5」 9쪽 · STT 10/20 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"\"부모님이 진짜가 아니라 다른 사람이 변장해서 나타났다\"고 믿는 증상은?","choices":["고소광","Capgras 증후군","오델로 증후군","Cotard 증후군","folie à deux"]
