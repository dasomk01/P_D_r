em":"외상 직후 PTSD 발생을 예측하는 생물학적·임상적 지표로 강의에서 설명한 것이 아닌 것은?","choices":["외상 직후 코르티솔 저하","외상 후 첫 1개월간 심박수가 90회 이상으로 높게 유지","서술기억 장애·해마 기능 저하","외상 당시의 해리(peritraumatic dissociation)","외상 직후 혈중 프로락틴 증가"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(최지원): \"외상 직후 심박수가 급격히 상승한 후 오래 지속되고 cortisol이 낮은 환자들은 PTSD로 갈 확률이 높더라\"\n\n강의록 7·12·14쪽: 외상 후 1개월 심박수 90 이상(민감도 88%, 특이도 85%), 코르티솔 저하, peritraumatic dissociation(PTSD 발생 4–5배 예측 표지), 서술기억 장애(우측 해마 위축)·주의·작업기억 결손(전전두엽). 교수님: 정설은 아니지만 이런 지표가 있다.","exps":["제시됨.","제시됨.","제시됨.","제시됨.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-pt-17","area":"티야","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"📌티야방 · 근거: 강의록 「1019 PTSD」 16–17쪽 · 교과서 14장(외상 및 스트레스 관련 장애) 365쪽 · STT 10/19 3교시(양종철) · STT 10/19 4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"PTSD 약물치료에서 SSRI에 대해 교수님이 \"객관식으로 엄청 많이 나오는 문장\"이라고 한 것은?","choices":["우울 증상만 개선하며 침습·회피 증상에는 효과가 없다","외상 직후 예방 목적으로만 쓰고 치료에는 쓰지 않는다","PTSD의 모든 증상 영역을 감소시킨다고 밝혀진 유일한 약물이다","투여 1주 안에 모든 증상 영역에서 효과가 완전히 나타난다","공황장애보다 훨씬 적은 용량으로 짧게 쓰면 충분하다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(조수안): SSRI는 PTSD 4가지 주요 증상을 \"모두\" 경감(우울만 X) – 객관식으로 많이 나온다고 언급\n\n교과서 365쪽·교수님: SSRI는 PTSD의 모든 영역 증상을 감소시켜 줄 수 있다고 밝혀진 유일한 약물 – 단지 우울을 개선해서 좋아지는 것이 아니라 침습·회피·인지·각성 4가지 척도가 다 좋아진다. 증상이 3–4주 지속되면 SSRI를 시작한다.","exps":["4개 영역 모두다.","치료 약이다.","정답.","수 주가 걸린다.","PTSD·OCD는 우울증보다 2–3배 충분히 쓴다."],"ai":"","fl":{"tyb":1}},{"k":"psy-pt-18","area":"티야","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 강의록 「1019 PTSD」 17쪽 · STT 10/19 3교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"SSRI 용량 원칙에 대한 교수님 설명으로 옳은 것은?","choices":["강박장애는 공황장애보다 적은 용량이면 된다","공황장애는 처음부터 고용량으로 시작한다","PTSD는 최소 용량으로 짧게 쓴다","모든 불안장애는 같은 용량으로 쓴다","PTSD·강박장애는 우울증보다 2–3배 충분한 용량이 필요하다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님: PTSD와 OCD는 우울증에 쓰는 한 알로 시작하더라도 2배, 3배 충분히 써야 한다. 공황장애는 몸이 예민해 소량부터 서서히 올린다.","exps":["강박장애도 충분한 용량이다.","소량부터 서서히 올린다.","충분히 써야 한다.","질환마다 다르다.","정답."],"ai":"","fl":{}},{"k":"psy-pt-19","area":"티야","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 강의록 「1019 PTSD」 18–19쪽 · STT 10/19 3교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"PTSD 예방·초기 치료에서 propranolol과 benzodiazepine에 대한 설명으로 옳은 것은?","choices":["propranolol은 초기에 도입할 수 있으나 3개월 이상 쓸 필요는 없다","propranolol은 평생 유지해야 한다","benzodiazepine을 장기간 써서 예방한다","둘 다 PTSD에는 금기다","benzodiazepine은 PTSD 예방 효과가 확실하다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 18–19쪽·교수님: 높은 심박수를 빨리 떨어뜨리려 propranolol을 썼더니 초기에는 증상이 떨어졌지만 3개월에는 안 쓴 군과 같았다 → 도입은 좋지만 3개월 이상 쓸 필요는 없다. BZD는 초기 불안에 단기간 쓸 수 있으나 예방 효과는 없다(BZD군 69% vs 대조군 15%가 PTSD).","exps":["정답.","3개월 이후 차이가 없다.","장기 사용은 의존성 문제가 있다.","쓸 수 있다.","예방 효과가 없다."],"ai":"","fl":{}},{"k":"psy-pt-20","area":"티야","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 강의록 「1019 PTSD」 21쪽 · 교과서 14장(외상 및 스트레스 관련 장애) 363쪽 · STT 10/19 3교시(양종철) · STT 10/19 4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"외상 직후 피해자를 바로 불러 사건을 자세히 말하게 하는 단일 회기 심리적 디브리핑(single session debriefing)에 대한 현재 입장은?","choices":["PTSD 1차 약물치료를 대신한다","소아에게만 시행한다","노출치료보다 우선한다","효과가 없거나 오히려 악화시킬 수 있어 하지 않는다","모든 외상 피해자에게 즉시 시행한다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 21쪽·교수님: 20년 전에는 외상 직후 빨리 말하게 해 털어 버리게 하는 것을 강조했지만, 하면 오히려 나쁘다고 해서 지금은 하지 않는다. 학습지 2019 해설: 디브리핑만으로는 효과가 없거나 악화 – 증상이 없는 경우 시행하지 않는다.","exps":["해당 없다.","해당 없다.","노출치료가 대표적 치료다.","정답.","하지 않는다."],"ai":"","fl":{}},{"k":"psy-pt-21","area":"티야","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"📌티야방 · 근거: 강의록 「1019 PTSD」 21–22쪽 · 교과서 14장(외상 및 스트레스 관련 장애) 364쪽 · STT 10/19 3교시(양종철) · STT 10/19 4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"PTSD의 인지행동치료에서 가장 대표적인 치료와 그 적용 원칙으로 옳은 것은?","choices":["노출치료 – 외상을 겪은 사람이라면 증상이 없어도 모두 시행한다","혐오요법 – 외상 장면을 떠올릴 때마다 벌을 준다","정신분석 – 급성기에 매주 4회 시행한다","노출치료 – 회피가 있어 만성화될 것 같을 때 점진적 노출로 시행한다","반응방지 – 손을 못 씻게 한다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(조수안): PTSD 정신치료 중 노출치료가 제일 중요, EMDR이 PTSD 치료법임을 알아야 함\n\n교수님: 강박장애가 ERP라면 PTSD의 대표 인지행동치료는 노출치료 – 차를 못 타면 시내버스 한 정거장부터 점점 길게. 외상을 겪었어도 차를 잘 타는 사람에게 일부러 노출시키지는 않는다. 점진적(graded)·한 번에(flooding), 상상·실제(in vivo) 노출, 이완·인지 재구성 등 스트레스 관리도 쓴다.","exps":["증상이 없으면 하지 않는다.","해당 없다.","해당 없다.","정답.","강박장애 ERP 개념이다."],"ai":"","fl":{"tyb":1}},{"k":"psy-pt-22","area":"티야","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"📌티야방 · 근거: 강의록 「1019 PTSD」 23쪽 · 교과서 14장(외상 및 스트레스 관련 장애) 364–365쪽 · STT 10/19 3교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"EMDR(안구운동 민감소실 및 재처리)에서 안구운동을 시키는 이유에 대한 교수님 설명으로 옳은 것은?","choices":["안구운동 기계로 PTSD 진단을 내리려고","해마를 직접 자극해 외상 기억을 지우려고","말하는 동안 감정에 빠지지 않게 주의를 분산하려고","깊은 최면 상태를 유도해 기억을 바꾸려고","외상 때 긴장했던 안구 근육을 풀어 주려고"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(최지원): \"EMDR하면 PTSD에서 나온 것이구나 하고 실습 돌 때 알아야 합니다\" – 편도에 강하게 저장된 기억을 말로 처리해 해마로 재처리\n\n교수님: 외상 기억은 편도·노르에피네프린이 관여해 강하게 각인된다. 이를 충분히 말로 처리하면 탈감작되고 해마로 재처리(reprocessing)되어 잊힐 수 있는 일반 기억이 된다. 다만 말하다 감정에 빠지지 않게 불빛을 좌우로 따라가며 주의를 분산시키는 것 – 원리만 알면 손으로 두드리게 해도 된다.","exps":["치료 기법이다.","기억을 지우는 것이 아니다.","정답.","해당 없다.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-pt-23","area":"티야","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 강의록 「1019 PTSD」 21쪽 · 교과서 14장(외상 및 스트레스 관련 장애) 364쪽 · STT 10/19 3교시(양종철) · STT 10/19 4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"PTSD 정신치료의 일반 원칙으로 교수님이 설명한 것과 다른 것은?","choices":["PTSD로 진단되면 증상이 가벼워도 일단 입원시킨다","외상 사건을 부정하지 않고 받아들이도록 돕는다","의존·만성화되지 않도록 단기간에 한다","이완하도록 돕고 지지를 제공한다","스트레스 원천에서 떼어 놓는다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 21쪽: short-term, 외상 사건에 대한 부정을 극복, 이완, 스트레스 원천에서 분리, 지지 제공. 교수님: 무조건 입원은 틀린 말 – 아주 심하지 않으면 일상생활을 하도록 권고해야 의존·만성화를 막는다(자살·폭력 위험 등에서만 제한적으로 입원).","exps":["정답.","옳다.","옳다.","옳다.","옳다(오토바이 사고 후 다시 타려 하면 말린다)."],"ai":"","fl":{}},{"k":"psy-pt-24","area":"티야","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 강의록 「1019 PTSD」 6·23쪽 · STT 10/19 3교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"세월호 같은 대형 참사 직후 피해자 가족에게 가장 먼저 필요한 개입으로 교수님이 든 예는?","choices":["노출치료를 정신치료 중 노출치료가 제일 중요\n\n🎓 올해 수업 기준: 교수님(10/19): 20년 전에는 외상 직후 빨리 말하게 해 털어 버리게 했지만(단일 회기 디브리핑) 하면 오히려 나쁘다고 해서 지금은 하지 않는다. PTSD 대표 치료는 노출치료를 포함한 CBT. 티야방(조수안): 정신치료 중 노출치료가 제일 중요, EMDR도 PTSD 치료법으로 알아야 한다.\n\n📚 학습지 해설: 디브리핑만으로는 효과가 없거나 오히려 증상을 악화시키는 경우도 있어, 위기상황 스트레스 관리법의 일환이지만 외상 후 증상이 없는 경우에는 시행하지 않도록 한다. 정신치료는 노출치료·인지처리치료를 포함한 인지행동치료. 마지막 수업날 찝어 주시며 디브리핑하지 않고 인지행동/노출치료를 해야 한다고 언급.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-pt-wtc-2013","area":"야마","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 학습지 「외상 및 스트레스 관련 장애」 196–204쪽","year":"2013 객21","type":"객","rep":2,"repyears":"2012 객29","stem":"[21-22] 미국 뉴욕 ‘세계무역기구가 있던 110층 쌍둥이 빌딩에서 근무하던 한국인 남자가 항공기 테러 공격직후 계단을 통해 필사적으로 뛰어 내려와 목숨을 건졌다. 그러나 얼마 후 그 빌딩이 붕괴된 장면을 보고 큰 충격을 받았다. 이 후 거의 매일 밤 그 때 일이 설명하게 떠오르고 악몽에 시달리며 불안, 초조, 공포감 때문에 고통스러워한다. 그는 고층 건물 근처에도 가는 것을 회피하며, 단층 주택에서 지내고 정신과 진료를 받고 있다. 그는 과거력에서 그 사건이전에는 건강하였다. 상기 증례 환자의 진단명으로 가장 적절한 것은?","choices":["공황장애","적응장애","범불안장애","외상 후 스트레스 장애","공포장애"],"ans":[4],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2012 객29"],"basis":"📚 학습지 해설: 12년 기출 29번과 거의 유사. PTSD: 심각한 외상(전쟁, 사고, 건물 붕괴, 자연재앙, 폭력, 강간 등 생명을 위협하는 충격적 경험)을 보거나 직접 겪은 후의 불안장애. 3가지 주요 임상양상 – 재경험, 감정적 무감각, 자율신경계 과잉각성. 죄책감·이인증·공황발작·약물남용·기억력 저하도. 치료 – SSRI·TCA·MAOI·trazodone·BZD 1년 이상 장기, 정신역동·인지·행동치료, 이완, 최면, 위기개입, 가족 지지.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pt-amy-2013","area":"야마","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 학습지 「외상 및 스트레스 관련 장애」 196–204쪽","year":"2013 객22","type":"객","rep":2,"repyears":"2012 객30","stem":"[21-22] 미국 뉴욕 ‘세계무역기구가 있던 110층 쌍둥이 빌딩에서 근무하던 한국인 남자가 항공기 테러 공격직후 계단을 통해 필사적으로 뛰어 내려와 목숨을 건졌다. 그러나 얼마 후 그 빌딩이 붕괴된 장면을 보고 큰 충격을 받았다. 이 후 거의 매일 밤 그 때 일이 설명하게 떠오르고 악몽에 시달리며 불안, 초조, 공포감 때문에 고통스러워한다. 그는 고층 건물 근처에도 가는 것을 회피하며, 단층 주택에서 지내고 정신과 진료를 받고 있다. 그는 과거력에서 그 사건이전에는 건강하였다. 상기 증례 환자의 불안과 두려움에 중추적인 역할을 수행하는 뇌부위는?","choices":["시상","시상하부","해마","편도","선조체"],"ans":[4],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2012 객30"],"basis":"🎓 올해 수업 기준: 교수님(10/19): 외상 기억은 편도(공포의 중추)·노르에피네프린이 관여해 너무 강하게 달라붙어 계속 떠오르고(침습), 충분히 말로 처리하면 해마로 재처리되어 잊힐 수 있는 일반 기억이 된다(EMDR의 원리).\n\n📚 학습지 해설: 불안과 두려움에 중추적인 역할을 하는 뇌 부위는 편도(정상근 교수님 PPT) → ④.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pt-adj-2011","area":"야마","prof":"양종철","sec":"10/19 · 외상 및 스트레스 관련 장애","meta":"근거: 학습지 「외상 및 스트레스 관련 장애」 196–204쪽","year":"2011 객38","type":"객","rep":1,"repyears":"","stem":"초등학교 2학년 남자아이가 야뇨증세로 내원했다. 환자는 원래 소변을 잘 가렸으나 수개월 전에 전학을 하면서 소변을 지리기 시작했다. 비뇨기과적 검사에서는 별다른 이상 소견이 관찰되지 않았다. 이 환자의 치료에 대한 설명 중 옳은 것은?","choices":["놀이치료가 효과적이다.","플록세틴(fluoxetine)을 먼저 사용해 본다.","리스페리돈(risperidone)을 먼저 사용해 본다.","벨-경보(bell-alarm) 요법은 효과가 제한적이다.","심리적 스트레스가 많은 경우에는 긍정적 강화법이 효과적이지 않다."],"ans":[1],"imgs":[],"vis":[],"notes":["학습지 해설은 \"수개월\"을 3개월 이내로 가정해 풀었다."],"basis":"🎓 올해 수업 기준: 교수님(10/19): 적응장애는 이사·전학·입대 같은 일상의 스트레스 요인 후 3개월 이내 발생, 요인이 끝난 뒤 6개월 안에 관해. 원인은 스트레스 요인 50·개인의 취약성 50이라 역동정신치료 이야기도 나온다.\n\n📚 학습지 해설: 적응장애: 확인 가능한 스트레스 후 3개월 이내 정서·행동 증상, 기대보다 심한 고통이나 기능 장해. 선행요인은 전학·이사·결혼·퇴직처럼 누구나 겪는 스트레스. 치료 – 부담 줄이기, 스트레스 대처 훈련, 지지망, 이차 이득 유의, 약물은 단기간, 3개월 이상 지속 시 다른 진단 고려. 전학은 생명 위협이 없는 흔한 스트레스이고 「수개월」을 3개월 이내로 가정 – 적응장애의 가장 좋은 치료는 정신치료이며 아동은 특히 놀이치료를 강조 → ①.","exps":[],"ai":"","fl":{}},{"k":"psy-sz5-01","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"📌티야방 · 근거: 강의록 「조현병 5」 2쪽 · STT 10/20 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"망상장애의 망상이 조현병의 망상·관계사고와 구분되는 특징으로 교수님이 강조한 것은?","choices":["망상보다 환청이 훨씬 두드러지게 나타난다","체계적이고 괴이하지 않으며 현실적 근거가 있다","인격과 일상 기능이 빠르게 황폐화된다","망상 내용이 체계 없이 매일 바뀐다","불특정 다수가 이유 없이 자신을 감시한다고 느낀다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이도연): 망상장애: 체계적·괴이하지 않은 망상 1개월 이상, 특정 대상에 국한, 망상 외 기능 정상 – 조현병과는 괴이성·두드러진 환각 여부로 감별, 중년 이후·여성 호발\n\n강의록 2쪽·교수님: 망상장애(paranoia, 편집증)는 체계적이고 괴이하지 않은(실제 생활과 관련된) 망상, 인격 유지가 잘 되고 가족 내 정신병적 유전부하가 적으며 외적 요인이 많이 작용. 위층과 층간소음으로 싸운 뒤 \"일부러 그런다\" – 이유가 있고 논리적이다. 조현병은 모르는 불특정 다수를 이유 없이 의심한다.","exps":["환각은 망상 주제와 연관되고 두드러지지 않는다.","정답.","인격이 잘 유지된다.","지속적이다.","조현병 쪽이다."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz5-02","area":"탈야 O의 subtype으로 분류, 가까운 사람 사이에서 우위에 있는 사람의 것이 순종적이고 감수성 있는 사람에게 전달, 이중 정신병(folie à deux), 감응성 편집장애.","exps":["해당 없다.","해당 없다.","해당 없다.","해당 없다.","정답."],"ai":"","fl":{}},{"k":"psy-sz5-14","area":"탈야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 강의록 「조현병 5」 16쪽 · STT 10/20 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신병 증상을 유발할 수 있는 물질·약물로 강의록에 제시되지 않은 것은?","choices":["항콜린성 약물","암페타민 계열 항비만제","부신피질호르몬·스테로이드","아세트아미노펜","대마초·코카인·환각제"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 16쪽: 부신피질호르몬, 합성 스테로이드, 항콜린성 약물, cimetidine·항생제, 암페타민·항비만제, 코카인, 대마초, 환각제. 신체·신경질환: 알츠하이머·헌팅턴·다발경화증, 뇌종양·수두증·측두엽뇌전증·CO 중독, 감염, 포르피린증·저나트륨혈증·간성뇌병증, 갑상선, 비타민 결핍.","exps":["제시됨.","제시됨.","제시됨.","정답.","제시됨."],"ai":"","fl":{}},{"k":"psy-sz5-15","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 강의록 「조현병 5」 17쪽 · STT 10/20 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"60대 노인이 망상 없이 하루 종일 노랫소리·목탁 소리만 들려 괴로워한다. DSM-5에서 이런 경우를 분류하는 곳은?","choices":["달리 명시된 조현병 스펙트럼 장애","단기 정신병적 장애","망상장애(환청 동반형)","조현정동장애(우울형)","해리성 정체성 장애"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 17쪽·교수님: OSSO의 유형 – persistent auditory hallucinations(환청만), delusions with significant overlapping mood episodes, attenuated psychosis syndrome, 망상장애 환자 파트너의 망상 증상. 교수님: 노인에서 노랫소리·찬양·목탁 소리만 들리는 환자, 비듬을 벌레로 여기는 환촉만 있는 경우도 있다.","exps":["정답.","해당 없다.","망상이 없다.","기분 삽화가 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-sz5-16","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 강의록 「조현병 5」 19쪽 · STT 10/20 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"약화된 정신병 증후군(attenuated psychosis syndrome)에 대한 설명으로 옳은 것은?","choices":["DSM-IV부터 있던 진단이다","노인에게만 진단한다","망상에 100% 확신하는 상태다","정신증 고위험군과 똑같이 예방만 목적으로 하고 치료하지 않는다","관계사고와 망상 사이의 중간 단계로 확신도가 흔들리며, 치료 목표는 정신병 수준 진행 예방이다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 19쪽·교수님: 정신증 고위험군 연구 결과로 DSM-5에 새로 제시. 정신증 고위험은 예방 목적, 약화된 정신병증후군은 병적 상태로 치료에 초점. 확신도가 흔들려 \"30%쯤 그럴 수도, 70%는 아닌 것 같다\"고 말한다 – 망상(psychotic) 수준으로 심해지지 않게 하는 것이 목표.","exps":["DSM-5에 새로 제시.","해당 없다.","확신도가 흔들린다.","병적 상태로 치료에 초점을 둔다.","정답."],"ai":"","fl":{}},{"k":"psy-sz5-17","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 강의록 「조현병 5」 20쪽 · STT 10/20 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5의 긴장증(catatonia)에 대한 설명과 교수님의 입장으로 옳은 것은?","choices":["긴장증은 대개 외래 통원 치료가 원칙이다","긴장증 환자는 주변 인식이 전혀 없다","항정신병약물과는 전혀 관련이 없다","DSM-5는 조현병이 35% 정도라 보나 교수님은 경험상 다르다고 했다","DSM-5는 긴장증의 대부분이 조현병이라고 본다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 20쪽: 과거 조현병의 아형, 정신운동성 무반응(주변 인식은 있음)·혼미·강경증·납굴증·함구증·초조·상동증·반향언어/동작. 조현병의 35%, 대다수는 우울증·양극성장애, 항정신병약물(급성 근긴장이상·NMS), 신경학적 상태. 입원 필요, 영양·고열·위생 관리. 교수님: 30년 동안 우울증으로 긴장증이 온 환자는 본 적이 없다 – 미국 사람들 생각.","exps":["입원이 필요하다.","주변 인식은 있다.","원인이 될 수 있다.","정답.","대다수는 기분장애라고 본다."],"ai":"","fl":{}},{"k":"psy-sz5-18","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: STT 10/20 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신병으로 처음 입원하는 환자에게 \"가장 전달되어야 하는 단어\"로 교수님이 영상(간호 장면)을 보여 주며 강조한 것은?","choices":["reality","family","cure","safe","medicine"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 입원 과정(경찰·119·응급실)이 굉장히 공포스럽기 때문에 \"당신은 safe하다, 안전하다\"는 느낌을 전달하는 것이 가장 중요 – 그 바탕 위에서 인지치료·통찰지향 치료가 올라갈 수 있다. 증례(24세 여자, 다중 트라우마·복약 중단·지연성 운동장애·팔리페리돈 장기지속형 주사)도 트라우마를 잘 어루만져야 한다는 취지.","exps":["해당 없다.","해당 없다.","해당 없다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-sz5-19","area":"티야","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: STT 10/20 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"증례 발표 환자(24세, 반복 복약 중단·입원)에게 쓴 치료와 그 이유의 연결로 옳은 것은?","choices":["lithium – 양극성장애라서","팔리페리돈 월 1회 근육주사 – 낮은 복약 순응도 때문에","ECT – 긴장증이 있어서","clozapine – 치료 저항성이라서","propranolol – 정좌불능 때문에"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"STT 증례: 반복적으로 약을 끊고 재발해 입원 → 낮은 복약 순응도에 대해 paliperidone 100 mg 장기지속형 근육주사(월 1회). 혀·다리의 불수의 운동은 지연성 운동장애로 진단(VMAT2 억제제 tetrabenazine 등은 비급여), 항콜린제 감량, 재발 신호 교육, 공동거주시설 연계.","exps":["해당 없다.","정답.","해당 없다.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-y-scz-dxb-2023","area":"야마","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2023 객19","type":"객","rep":2,"repyears":"2022 객19","stem":"25세 농촌에 사는 기혼 여성이 친정 아버지가 한 달 전에 갑자기 돌아가셔서 매우 우울했다 한다. 보고싶은 마음에 밤 늦게 아버지 산소에 갔다 온 뒤로 마음이 무겁고 평소에 친절하게 대하지 못했던 것이 생각나면서 죄책감이 커지면서 잠을 잘 못 자기 시작했다고 한다. 3일 후 부터는 무서운 소리의 환청이 들리고 누군가 자신을 잡으러 온다면서 문 뒤에 숨는 행동을 해 응급실을 통해 정신과로 입원하였다. 입원 후 주사를 맞고 하루 푹 자고 나더니 모든 증상이 깨끗이 좋아졌다. 1주일 후 퇴원하였고 그 후 좋은 상태를 유지중이다. 이 환자의 진단명은?","choices":["조현병","조현양상장애","단기정신병적장애","망상장애","의존성 인격장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(임채원): 조현병·조현양상장애·단기정신병적장애는 기간으로 구분하는 문제가 계속 출제됨\n\n🎓 올해 수업 기준: 올해 수업(10/20 강의록 13쪽·교수님): 단기 정신병적 장애는 1일 이상 1개월 이내, 대개 외상적 스트레스와 시간적 선후관계·급성 발병이 있고, 회복 후 병전 기능으로 \"완전히\"(100%) 돌아온다 – 교수님이 \"중요한 표현\"이라고 짚었다. 다만 반수에서는 이후 조현병이나 기분장애로 진행한다.\n\n📚 학습지 해설: 답 ③. 진단 기준: 환각, 망상, 와해 또는 긴장성 행동, 음성증상 중 2개 이상이 한 달 중 상당 기간 – 6개월 이상이면 조현병, 1–6개월 조현양상장애, 1개월 미만 단기 정신병적 장애. 이 환자는 환청·망상 등 2개 이상이고 1달이 되지 않았으며, 주사를 맞고 하루 푹 자고 나서 모든 증상이 깨끗이 좋아지고 좋은 상태를 유지 – 치료되면 발병 전으로 완벽히 돌아가는 단기 정신병적 장애의 특징. 망상장애: 체계적이고 괴이하지 않은(실제 생활과 관련된) 망상 – 교수님: 의처증·의부증을 생각하면 된다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-dxb-2022","area":"야마","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2022 객19","type":"객","rep":2,"repyears":"2023 객19","stem":"60세 농촌에 사는 여성이 작년 가을부터 옆 주민들이 자신의 농작물을 훔쳐간다고 의심하고 화를 냈다. 훔쳐가는 주민은 평소에 사이가 안 좋았고 작년에 다툰 일이 있다고 한다. 환청과 기억 장애 증상은 없었고 훔쳐간 주민을 제외한 나머지 주민들과는 잘 지냈다고 한다. 의심되는 진단명은?","choices":["조현병","조현양상장애","잠재정신병적장애","망상장애","의존성인격장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이도연): 망상장애 vs 조현병: 괴이성 유무와 두드러진 환각 여부로 감별, 망상 외 기능 유지\n\n🎓 올해 수업 기준: 올해 수업(10/20 STT): 교수님 – 망상장애의 망상은 체계적이고 괴이하지 않으며 현실적 근거가 있다(위층과 층간소음으로 싸운 뒤 \"일부러 그런다\"). 조현병은 모르는 불특정 다수를 이유 없이 의심한다. 나이가 중요 – 망상장애는 중년기 이후·여성 호발, 조현병은 10대 후반–30대 초반. 원인으로 이민·이주·귀머거리(사오정 비유 – 기능 상실이 있으면 확인하다 의심으로 넘어간다).\n\n📚 학습지 해설: 답 ④. 탈야 문제였다. 교수님이 조현병을 설명하실 때 망상장애와 감별하는 것이 중요하다고 하셨다 – 조현병은 불특정 다수를 의심하지만, 망상장애는 의처증처럼 특정인을 의심한다. 문제는 \"주민들이\"로 시작하지만 문맥상 1명의 주민을 지칭하는 것 같다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-dd-2025","area":"야마","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2025 객7","type":"객","rep":1,"repyears":"","stem":"망상장애와 조현병을 감별할 수 있는 특징은?","choices":["와해된 언어를 보인다.","전반적인 기능 손상이 동반된다.","망상과 관련된 일시적인 환청이 동반된다.","괴이한 망상이다.","음성증상을 보인다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이도연): 망상장애 vs 조현병: 괴이성 유무와 두드러진 환각 여부로 감별, 망상 외 기능 유지\n\n🎓 올해 수업 기준: 올해 수업(10/20 STT): 교수님 – 망상장애에서도 환각이 나올 수 있지만 망상 주제와 연관되고, 두드러지지(dominant) 않고 일시적이어야 한다. 조현병과의 구분은 괴이성 – 현실적이냐, 논리적이냐. 인격장애는 의심·경계가 지나칠 뿐 망상 수준까지는 아니다.\n\n📚 학습지 해설: 답 ③. 망상장애: 괴이하지 않은 망상이 한 달 이상, 망상의 주제와 연관된 환각, 피해망상·관계망상이 가장 흔함, 만성적인 의심과 성기능장애도 흔함. 교수님은 조현병과 감별할 때 괴이한 망상, 두드러지는 환각이 주 특징이라고 설명. 환청이 조현병에서도 보이는 특징이라 감별 요소로 적절한지 의문이 들긴 하지만 ①②④⑤는 모두 조현병에 대한 설명이라 답은 ③(복원자).","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-dd2-2011","area":"야마","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2011 객15","type":"객","rep":1,"repyears":"","stem":"다음 망상장애에 대한 설명 중 가장 적절한 것은?","choices":["망상 장애는 인격은 비교적 잘 유지가 되나 체계적이지 않고 괴이한 망상이 특징이다.","망상 장애는 항정신병약물에 잘 반응하지 않기 때문에 통찰지향적 정신치료가 효과적이다.","망상장애는 흔히 성적인 문제와 우울증상을 동반하며, 여자에게 많은 편이다.","망상 장애 중 질투형은 가장 흔한 형태로 여자에게 더 많은 편이다.","망상 장애는 대부분 외래에서 치료가 가능하고, 집단치료가 효과적이다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이도연): 망상장애 vs 조현병: 괴이성 유무와 두드러진 환각 여부로 감별, 망상 외 기능 유지\n\n🎓 올해 수업 기준: 올해 수업(10/20 STT): 교수님 – 피해형이 가장 흔하고 투서·고소로 이어지며 증거를 모은 공책을 들고 온다. 질투형은 의처증·의부증(오델로). 본인 논리와 증거 수집이 철저해 그 사람 말만 들으면 절대 안 되고, 망상 외 생활은 정상이라 입원이 필요 없지만 자타해 위험(예: 의처증으로 부인을 심하게 괴롭힘) 시 격리 입원. 통찰지향적 치료는 부적합. 억압된 동성애 충동(Freud) 원인설은 \"폐기된 이론\".\n\n📚 학습지 해설: 답 ③. ① 망상장애는 아주 체계적이고 괴이하지 않은 망상과 그에 맞는 정동, 인격이 비교적 잘 유지(교과서 436쪽)(X) ② 이유는 잘 모르지만 항정신병약물에 잘 반응하지 않는 것으로 보고되나 시도는 해야 한다 – 초조·불안을 줄일 수 있다(441쪽)(X) ③ 중년기 이후 주로 발병, 남자보다 여자에 많고, 흔히 성적인 문제와 우울증상을 동반(437–438쪽)(O) ④ 가장 흔한 형태는 피해형, 질투형은 남자에 더 많다(439–440쪽)(X) ⑤ 예민하고 매사를 의심해 통찰지향적 정신치료나 집단치료는 도움이 되지 않는다; 대부분 외래 치료가 가능하지만 자해·타해 위험이 높으면 강제입원(441쪽)(X).","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-pp-2025","area":"야마","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2025 객6","type":"객","rep":3,"repyears":"2023 객20 · 2022 객22","stem":"36세 여자로서 출산 후에 신경이 예민해지고 자신의 아이가 바뀌었다면서 안절부절해 한다. 과거 정신과적 병력은 없었다 한다. 이 환자에 대한 설명으로 올바른 것은?","choices":["자살이나 영아 살해 등의 위험성이 매우 높아 즉각적인 격리가 필요하다.","산후 정신병으로 발생 빈도가 100명당 1-2명이다.","예후는 대개 좋아 일회성으로 끝나며 다음 임신 시 재발이 없다.","조현병의 아형으로 볼 수 있다.","출산 후 4주 이내에 발생한다."],"ans":[5],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2023 객20"],"basis":"📌 티야방(임채원): 산후정신병: 시간이 지나 호전되는 경우가 있어 즉각적 격리는 필요하지 않음, 기분조절제·항우울제 사용\n\n🎓 올해 수업 기준: 올해 수업(10/20 강의록 14쪽·교수님): 출산 후 4주 이내(평균 2–3주), 1,000명당 1–2명, 첫 아이·기분장애 가족력, DSM-5에서는 양극성장애·주요우울장애·단기 정신병적 장애의 아형으로 진단. 망상은 아이가 죽었다·장애가 있다·바뀌었다, 아이를 죽이라는 환청. 자살 위험이 있으면 응급으로 입원, 항정신병약·리튬·항우울제.\n\n📚 학습지 해설: 답 ⑤(2023 객20과 동일). 산후정신병: 출산 후 한 달 안에 주로 생기며 아이가 바뀌었다는 망상, 혼란스러움과 약간의 의식 흐림 동반. 심하지 않으면 시간이 지나 호전되지만 너무 불안해하면 정신과적 응급으로 보고 기분조절제·항우울제도 쓴다. ① 불안이 심하면 자살·영아살해 위험이 커질 수 있으나 시간이 지나 호전되는 경우가 있어 즉각적인 격리가 필요하진 않다(X) ② 발생 빈도 1000명당 1–2명(X) ③ 약 50%에서 출산 후 1년 내 기저 기분장애가 재발(X) ④ DSM-5에서는 주로 양극성장애의 아형(X) ⑤ 출산 후 평균 1달 이내(평균 2–3주 후) 시작(O). 교과서: 독자적 질병이 아니라 본질적으로 기분장애 삽화로 보며, 자살·영아살해 행동화 가능성은 크지 않지만 반드시 주의 깊게 감독. 초기엔 피로·불면·안절부절·정서 불안정, 후기엔 의심·혼동·지리멸렬·아기 건강에 대한 강박적 걱정, 아기가 죽었거나 장애아라는 망상. 감별: 산후 우울감(분만 3–5일, 수일, 치료 불필요, 2주 이상이면 산후우울증 고려), 산후우울증(12주 이내, DSM-5에서 주요우울장애의 아형). 자살 가능성이 있으면 입원, 항정신병약·리튬·항우울제 병합, 병전 기능과 가족 지지가 좋으면 예후가 좋다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-pp-2022","area":"야마","prof":"정영철","sec":"10/20 · 조현병 5 (망상장애·기타 정신병적 장애)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2022 객22","type":"객","rep":3,"repyears":"2025 객6 · 2023 객20","stem":"36세 여자로서 출산 후에 신경이 예민해지고 자신의 아이가 바뀌었다면서 안절부절 해한다. 과거 정신 과거병력은 없었다한다. 이 환자에 대한 설명으로 올바른 조합은?","choices":["자살이나 영아 살해 등의 위험성은 적다.","산후 정신병으로 발생 빈도가 1000명당 1-2명이다.","예후는 대개 좋으나 다음 임신 시 재발할 수 있다.","대개 빨리 회복되므로 즉각적인 조치보다는 기다려 보는 것이 좋다.","출산 후 1-2달 이후에 발생한다."],"ans":[],"imgs":[],"vis":[],"notes":["⚠ 정답 확인 필요: 학습지 정답 ②(복원자도 ①·② 중 확실치 않다고 적음).","학습지 정답 그대로는 채점하지 않고, 확인되면 반영할게요.","복원 불완전·확인 필요 문항이라 정답 자동 채점은 하지 않아요."],"basis":"📌 티야방(임채원): 산후정신병: 시간이 지나 호전되는 경우가 있어 즉각적 격리는 필요하지 않음, 기분조절제·항우울제 사용\n\n🎓 올해 수업 기준: 올해 강의록(10/20, 14쪽)으로도 ②(1,000명당 1–2명)는 맞고, ①(자살·영아살해 위험은 적다)도 교과서 문장(\"행동화 가능성은 크지 않다\")과 같아 이 해는 정답이 하나로 갈리지 않는다 – 확인 필요로 둔다. 교수님은 자살 위험이 있으면 응급으로 입원한다고 짚었다.\n\n📚 학습지 해설: 정답 ②(복원자). 교과서(신경정신의학 3판 238쪽) 산후정신병 – 자살 및 영아살해 행동화의 가능성은 크지 않지만 반드시 주의 깊게 감독, 독자적 질병이 아니라 기분장애 삽화로 보며 DSM-5에서 주로 양극성장애 아형, 발병률 1,000명 출산 중 1–2명, 약 50%에서 첫 아이 출산 후 1년 이내 기저 기분장애의 두 번째 삽화, 출산 후 평균 2–3주에 시작. 이 내용대로라면 ①·② 모두 맞아 보이는데 정확하게는 모르겠다 – 확실한 ②로 표기(복원자). ③ 재발하는 것은 기분장애지 산후정신병이 아닌 것 같다 ④ 근거는 찾지 못했지만 자살 사고가 있으면 적극적인 예방 조치가 필요 ⑤ 출산 후 2–3주. (1000명당 1–2명은 수업 시간에 언급하지 않았다고 적혀 있음.)","exps":[],"ai":"","fl":{"warn":1,"chk":1,"inc":1,"tyb":1}},{"k":"psy-ch1-01","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 1」 2쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"소아청소년 정신장애의 특징에 대한 교수님 설명으로 옳은 것은?","choices":["순수하게 한 질환만 있는 경우가 대부분이다","공존질환이 많고 동반되면 예후가 나빠지는 경우가 많다","발달 단계는 평가에 고려하지 않는다","환경의 영향은 거의 없다","성인 정신장애와는 전혀 연속성이 없다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 1 2쪽·교수님: 성인과 연속선적인 측면도 있으나(ADHD·자폐는 성인까지), 소아청소년은 공존질환이 많고(순수한 ADHD만 있는 아이는 흔치 않음 – 틱·우울·불안·행동장애 동반) 환경의 영향에 따라 예후가 좌우되며, 발달학적 개념을 적용해야 한다.","exps":["흔치 않다.","정답.","발달 단계 평가가 중요하다.","환경 영향이 크다.","연속적인 측면도 있다."],"ai":"","fl":{}},{"k":"psy-ch1-02","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 1」 3–4쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"소아청소년 치료 원칙으로 강의록에 제시되지 않은 것 TT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"자폐 특성(대화를 주고받는 화용언어의 어려움)은 있으나 반복·상동 행동이나 제한된 관심은 없는 아이에게 DSM-5에서 붙이는 진단은?","choices":["표현성 언어장애","선택적 함구증","아스퍼거장애(DSM-IV)","사회적 의사소통장애","자폐스펙트럼장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(양서은): KY: 매번 신경발달장애에 속하는 것이 뭔지 물어보심 – 지적·의사소통(사회적 의사소통 포함)·자폐·ADHD·학습·운동(틱)장애\n\n교수님: 사회적(pragmatic) 의사소통장애는 새로 들어온 진단으로 의사소통장애 안에 있다 – 일반 대화는 되지만 핑퐁·사회적 대화가 안 되고, 자폐의 반복·상동 행동이나 특이한 집착은 없는 아이. 아스퍼거장애 등 과거 전반적 발달장애는 자폐스펙트럼장애 하나로 통합.","exps":["언어 자체의 문제다.","불안장애다.","DSM-5에서 없어진 진단명이다.","정답.","반복 행동·제한된 관심이 있어야 한다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ch1-06","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 1」 13쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 선택적 함구증과 분리불안장애를 불안장애로 옮긴 이유로 교수님이 설명한 것은?","choices":["SSRI 약물 반응이 같아서","보험 청구를 편하게 하기 위해서","크면서 사회불안으로 가는 경우가 많아서","관련 유전자가 같다고 밝혀져서","발병 연령이 주로 성인이어서"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 1 13쪽·교수님: 예전에는 기타 장애(소아기 장애)로 분류했지만, 선택적 함구증 아이들이 커서 사람들 앞 발표·낯선 사람을 힘들어하는 사회불안으로 가더라 – 밖에서 말을 안 하는 이유도 부끄러움·불편함.","exps":["해당 없다.","해당 없다.","정답.","해당 없다.","소아기 발병이다."],"ai":"","fl":{}},{"k":"psy-ch1-07","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 1」 14쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 급식 및 섭식장애의 진단 위계(hierarchy)에 대한 교수님 설명으로 옳은 것은?","choices":["세 진단을 동시에 모두 붙인다","신경성 폭식증은 체중이 심각하게 낮아야 한다","식욕부진증 → 폭식증 → 폭식장애 순으로 본다","폭식장애를 가장 먼저 고려한다","체중은 진단과 관계없다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 진단에는 위계가 있어 가장 specific한 기준을 가진 anorexia nervosa가 우선권(제한형·폭식/제거형) – 체중이 심각하게 떨어지면 식욕부진증, 아니면 bulimia(먹고 토하거나 설사약·이뇨제), 보상행동 없는 폭식은 binge-eating disorder.","exps":["위계에 따라 하나를 붙인다.","심각한 저체중이면 식욕부진증이다.","정답.","반대다.","핵심 기준이다."],"ai":"","fl":{}},{"k":"psy-ch1-08","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 1」 15쪽 · STT 10/20 3교 , aripiprazole","naltrexone, melatonin","methylphenidate, atomoxetine","fluoxetine, sertraline"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(문유선): 자폐 약물은 행동조절용: risperidone(공격성·자해), aripiprazole(짜증·예민), 자극제(집중), SSRI(불안·강박), 항경련제(경련)\n\n강의록 2 21–22쪽·교수님: 근본적으로 해결하는 약은 없고 행동 조절용 대증요법. risperidone(5–16세)·aripiprazole(6–17세)가 자극과민성에 FDA 승인 – 부모님이 \"조현병도 아닌데\"라며 놀라므로 설명이 필요. 교수님은 risperidone을 소아에서 3 mg 이내로 쓰며, 12 mg을 쓴 아이를 보고 NMS를 걱정했다. 중추신경자극제는 6세 이상 ADHD.","exps":["해당 없다.","정답.","자해(현재 제한적)·수면에 쓴다.","ADHD 약이다.","불안·강박·상동에 쓴다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ch1-18","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 2」 14–20쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"발달장애 아이의 문제행동을 평가할 때 원인 유형으로 강의록에 제시되지 않은 것은?","choices":["과제 회피","유전자 검사 결과","원하는 것을 얻기 위해","감각적 자기자극","관심 끌기"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 2 15–20쪽: 선행·후속요인을 분석 – 관심 끌기(문제행동엔 관심 X, 안 할 때 충분히 관심), 과제 회피(계속하게 하고 대안행동 교육), 원하는 것 얻기(주지 않음), 감각적 자극(자극 차단·적절한 놀이), 기타(통증 등). 교수님: 머리를 때리는 행동도 어떤 요인인지 보고 접근.","exps":["제시됨.","정답.","제시됨.","제시됨.","제시됨."],"ai":"","fl":{}},{"k":"psy-ch1-19","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 강의록 「2023 정신의학 2」 16쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"관심을 끌기 위해 자기 머리를 때리는 발달장애 아이에게 적절한 대처는?","choices":["때릴 때마다 바로 안아 주며 달랜다","때릴 땐 무시하고, 안 할 때 충분히 관심을 준다","과제를 바로 중단시켜 준다","혼자 있게 두어 감각 자극을 늘려 준다","원하는 과자를 즉시 준다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 2 16쪽: 관심 끌기 – 문제행동으로 타인의 관심이나 반응을 얻지 못하게 하고, 적절한 행동으로 관심을 얻도록 가르친다. 문제행동을 할 때 관심을 보이지 않고, 안 할 때 충분한 관심.","exps":["관심을 주면 강화된다.","정답.","과제 회피를 강화한다.","해당 없다.","원하는 것 얻기를 강화한다."],"ai":"","fl":{}},{"k":"psy-ch1-20","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 2」 2–3쪽 · STT 10/20 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"지적장애에 대한 설명으로 옳은 것은?","choices":["DSM-5에서는 IQ 기준이 빠졌다"," "prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2019 객24","type":"객","rep":3,"repyears":"2025 객13 · 2018 객24","stem":"3세 남아가 말이 늦다고 병원에 왔다. 아이는 20개월이 지나 걷기 시작했는데 현재 10개 가량의 단어만 사용하였다. 상담 중에는 장남감 자동차를 앞뒤로 미는 행동이나 블록쌓기를 주로 반복했다. 치료자가 이름을 부르면 돌아보았고 엄마한테 장난감을 내밀어 계속 귀찮게 했다. 가장 가능성이 높은 진단은?","choices":["지적장애","뚜렛장애","품행장애","자폐스펙트럼장애","주의력결핌 과잉행동장애"],"ans":[1],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2018 객24"],"basis":"🎓 올해 수업 기준: 교수님(10/20 3교시): 언어가 늦어 2–3세에 왔을 때 감별 – 지적장애는 운동 발달도 지능에 비례해 늦다(돌 무렵 걸었는지가 중요), 자폐는 운동 발달은 비교적 정상이고 불러도 반응이 없으며 사회적 상호작용·공동주의가 없다, 언어장애는 비언어적 소통·상상놀이가 정상. 자폐의 약 70%가 지적장애를 동반해 감별이 어렵다. 티야방(문유선) 같은 내용.\n\n📚 학습지 해설: 18년도와 문제·보기만 바뀌고 동일하게 나온 문제. 지적장애와 자폐스펙트럼장애를 감별하는 것이 포인트. 교과서: 자폐는 의사소통·사회적 상호작용이 질적으로 손상되고 관심 범위가 제한적인 데 비해 지적장애는 그런 질적 장애가 뚜렷하지 않다. 수업에서 자폐는 불러도 반응이 없다고 했으므로, 이름을 부르면 돌아보고 엄마에게 장난감을 내밀어 귀찮게 하는 점에서 자폐를 배제 → ① 지적장애.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-id-2025","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2025 객14","type":"객","rep":6,"repyears":"2016 객22 · 2015 객27 · 2013 객43 · 2012 객38 · 2011 객37","stem":"다음은 경도의 지적장애에 대한 설명이다. 옳은 것은?","choices":["훈련가능급 지적장애이다.","지적장애 중 가장 흔하다.","유치원 수준까지 학습이 가능하다.","가장 흔한 원인 아동 신체학대이다.","직업 기능을 수행할 때 전적인 보호감독이 필요하다."],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(문유선): 경도 85%·초6·교육가능급, 중등도 12%·초2·훈련가능급\n\n🎓 올해 수업 기준: 교수님(10/20 3교시): DSM-5에서 IQ 기준은 빠졌지만 장애 진단에서는 여전히 중요. IQ = 정신연령 ÷ 실제연령 × 100, 18세에 완성된다고 치면 18 × 0.7 ≈ 12세(초6) → 경도(IQ 50–70)는 교육가능급·초6 수준, 전체의 80–85%(교과서 70–75%), 중등도(35–49)는 훈련가능급·초2 수준, 약 12%. 고도·최고도는 완전보호급. 티야방(문유선): 경도 85%·초6·교육가능급, 중등도 12%·초2·훈련가능급.\n\n📚 학습지 해설: ① 교육가능급(훈련가능급 X) ② 80–85% 차지 → 가장 흔함(정답) ③ 초등학교 6학년 수준까지 교육 가능 ④ 원인은 다양하고 보통 선천적(신경발달장애) – 아동 신체학대는 후천적이므로 X ⑤ 전적인 보호감독이 필요한 것은 중증·극심, 경도는 때로 지도·감독 필요.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-nd-id-2016","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2016 객22","type":"객","rep":6,"repyears":"2025 객14 · 2015 객27 · 2013 객43 · 2012 객38 · 2011 객37","stem":"정신지체의 분류에 대한 설명으로 옳은 것은?","choices":["경도의 정신지체는 훈련가능급이다.","고도의 정신지체는 교육가능급이다.","중등도 정신지체의 경우 초등학교 2학년 수준까지 도달 할 수 있다.","경도의 정신지체의 경우 초등학교 4학년 수준까지 도달 할 수 있다.","표준지능지수는 실제 연령을 정신연령으로 나눈 후 100을 곱한 수이다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(문유선): 경도 85%·초6·교육가능급, 중등도 12%·초2·훈련가능급\n\n🎓 올해 수업 기준: 교수님(10/20 3교시): DSM-5에서 IQ 기준은 빠졌지만 장애 진단에서는 여전히 중요. IQ = 정신연령 ÷ 실제연령 × 100, 18세에 완성된다고 치면 18 × 0.7 ≈ 12세(초6) → 경도(IQ 50–70)는 교육가능급·초6 수준, 전체의 80–85%(교과서 70–75%), 중등도(35–49)는 훈련가능급·초2 수준, 약 12%. 고도·최고도는 완전보호급. 티야방(문유선): 경도 85%·초6·교육가능급, 중등도 12%·초2·훈련가능급.\n\n📚 학습지 해설: 복원자: 보기를 바꾸었지만 매년 나오는 킹야마. 정신지체(지적장애) 분류(DSM-IV·교과서): 경도 IQ 50–69, 전체의 약 70–75%(강의록 80–85%), 정신연령 9–12세, 교육가능급, 초등 고학년(6학년)까지 / 중등도 IQ 35–49, 약 20%, 정신연령 4–8세, 훈련가능급, 초2 수준 / 고도 IQ 20–34, 3–4%, 정신연령 2–3세, 완전보호급 / 최고도 IQ <20, 1–2%, 완전보호급. IQ = 정신연령 ÷ 실제연령 × 100(실제연령 최대치는 18세로 계산). 경도는 6세 이후에야 진단 가능. DSM-5에서는 IQ 기준이 빠짐. 복원자: \"매번 나오는 킹야마 – IQ, 빈도, 교육가능 수준을 필수로 외우기.\" ①④ 경도는 교육가능급·초등 고학년, ② 고도는 완전보호급, ③ 중등도는 초2까지(정답), ⑤ IQ = 정신연령/실제연령 × 100. 예) IQ 50인 10세 아이의 정신연령은 5세.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-nd-id-2015","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2015 객27","type":"객","rep":6,"repyears":"2025 객14 · 2016 객22 · 2013 객43 · 2012 객38 · 2011 객37","stem":"정신지체의 분류에 대한 설명 중 옳은 것은?","choices":["경도의 정신지체는 전체 정신지체의 10~20%에 해당한다.","경도의 정신지체는 초등학교 고학년 수준까지 배울 수 있다.","중등도 정신지체의 경우 전적으로 주위의 도움을 필요로 한다.","심한 정신지체의 경우 훈련가능급으로 불린다.","중등도 정신지체는 전체 정신지체의 70~80%에 해당한다."],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(문유선): 경도 85%·초6·교육가능급, 중등도 12%·초2·훈련가능급\n\n🎓 올해 수업 기준: 교수님(10/20 3교시): DSM-5에서 IQ 기준은 빠졌지만 장애 진단에서는 여전히 중요. IQ = 정신연령 ÷ 실제연령 × 100, 18세에 완성된다고 치면 18 × 0.7 ≈ 12세(초6) → 경도(IQ 50–70)는 교육가능급·초6 수준, 전체의 80–85%(교과서 70–75%), 중등도(35–49)는 훈련가능급·초2 수준, 약 12%. 고도·최고도는 완전보호급. 티야방(문유선): 경도 85%·초6·교육가능급, 중등도 12 치료(ABA) – 언어치료도 중요하지만 감각통합은 근거가 별로 없다(\"행동치료가 필요한 아이를 언어치료·감통만 보내면 미국이라면 소송감\"). 약은 근본 치료가 아니라 행동 조절용(risperidone 공격성·자해, aripiprazole 짜증·예민). 티야방(문유선): 기출 선지는 \"행동분석 기반 특수교육\". 올해 기준으로도 자폐 – 행동치료가 맞는 짝이다.\n\n📚 학습지 해설: 학습지 정답 칸은 ⑤인데, 복원자 해설은 질병별 치료로 – 소아공포증: 행동치료(체계적 탈감작·홍수법·모델링·긍정적 강화), 사회공포증은 행동치료 + 사회기술훈련·인지구조 재정립 / 강박장애: 약물(SSRI) + 행동치료 / 선택적 함구증: 놀이·정신·행동·언어·가족·약물치료를 종합적·지속적으로 / 자폐: 완치 약물은 없고 특수교육과 행동치료가 필수, 구조화된 교실환경에서 행동수정·언어치료 / ADHD: 문제 영역별 개별화된 통합적 접근. 복원자: \"야마에 자주 나오는 문제 유형, 질병별 치료법을 알아두면 좋다.\" (해설 내용은 ④ 자폐–행동치료를 가리켜 정답 확인 필요)","exps":[],"ai":"","fl":{"warn":1,"chk":1,"inc":1}},{"k":"psy-y-nd-asd-2012","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2012 객34","type":"객","rep":3,"repyears":"2017 객22 · 2018 객25","stem":"3세 남아가 말이 늦다고 찾아왔다. 부모가 불러도 안 돌아보는 경우가 많았으며 다른 사람과 눈을 마주치지 않았다. 자동차를 일렬로 늘어놓는 것에 집착했고, 부모가 못하게 하면 발로 차고 무는 행동을 보여 원래대로 하여 겨우 진정이 되었다. 상기 환아에서 예상되는 진단에 대한 설명 중 옳은 것은?","choices":["부모의 양육 문제가 원인이다.","전체 환자의 30%에서 지적장애를 보인다.","흔히 동반되는 염색체 이상으로 다운증후군을 들 수 있다.","부모교육과 행동요법을 비롯한 특수교육이 중요한 치료이다.","뇌전증(경련성 질환) 동반 여부가 가장 중요한 예후인자이다."],"ans":[4],"imgs":[],"vis":[],"notes":["2017 객22 해설에도 실린 문제."],"basis":"🎓 올해 수업 기준: 교수님(10/20 3교시): 자폐 치료의 핵심은 조기에 지속적·구조화된 특수교육과 행동치료(ABA) – 언어치료도 중요하지만 감각통합은 근거가 별로 없다(\"행동치료가 필요한 아이를 언어치료·감통만 보내면 미국이라면 소송감\"). 약은 근본 치료가 아니라 행동 조절용(risperidone 공격성·자해, aripiprazole 짜증·예민). 티야방(문유선): 기출 선지는 \"행동분석 기반 특수교육\". 원인은 선천적·생물학적(양육 X), 70%가 지적장애 동반.\n\n📚 학습지 해설: 자폐증: 3세 이전부터 언어 표현·이해, 애착, 놀이 관심 저조 → 이후 또래 관심 부족, 상동증, 인지 발달 저하. 원인은 부모의 애정 결핍 등 환경이 아닌 선천적·생물학적 뇌 기능 문제. 70%가 정신지체 동반(40%는 IQ 50 이하), 약체 X 증후군에서 높은 유병률, 20–30%에서 경련성 질환. 예후는 지능과 언어발달(5–7세까지 대화 가능)이 가장 중요. 치료: 조기의 지속적·체계적 구조화된 특수교육, 행동치료, 부모교육, 가족중심 접근 – 장기간의 시설 치료만으로는 비효과적. ① 양육 X ② 70% ③ 약체 X ④ 정답 ⑤ 지능·언어발달이 가장 중요한 예후인자.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-asd-obs-2011","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2011 객40","type":"객","rep":1,"repyears":"","stem":"5세 남자가 말이 늦다는 증상으로 내원했다. 부모가 불러도 돌아보지 않았고 눈을 맞추지 않았다. 가끔씩 눈을 흘기고 손을 터는 행동을 반복했다. 이 아동과 면담 시 관찰될 수 있는 행동이 아닌 것은?","choices":["기계적인 말투로 끝을 올리며 말한다.","면담자의 말을 반복적으로 따라할 때가 많다.","장난감 이것 저것을 쉴 새 없이 조작해 보고 늘어놓는다.","자동차나 주방기구 세트를 일렬로 늘어놓는 것을 반복한다.","손가락을 꼬거나 둥그런 물체만 보면 빙빙 돌리는 행동을 한다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/20 3교시): 자폐의 반복 행동 – 장난감을 기능대로 놀지 않고 일렬로 늘어놓기·바퀴만 보기, 손가락 튕기기·몸 흔들기 같은 상동증, 특정 주제 집착, 루틴 집착. 여러 장난감을 쉴 새 없이 바꿔 만지는 것은 자폐보다는 산만한(ADHD) 양상.\n\n📚 학습지 해설: 자폐증(박태원 교수님 소아청소년 주요 정신장애 ppt): ① 기계적 말투(운율 이상), ② 반향어, ④ 자동차·주방기구를 일렬로 늘어놓기, ⑤ 손가락 꼬기·둥근 물체 돌리기는 모두 자폐에서 관찰되는 행동. ③ 장난감 이것저것을 쉴 새 없이 조작해 보고 늘어놓는 것은 해당하지 않음 → 정답 ③.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-lang-2014","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2014 객10","type":"객","rep":1,"repyears":"","stem":"표현성 언어장애에 대한 설명으로 옳은 것은?","choices":["여자가 남자보다 훨씬 더 많다","지능에 비해 언어를 표현하는 능력이 떨어진다.","혼합 수용-표현성 언어장애보다 예후가 좋지 않다.","자폐장애 환자에 비해 비언어적 표현능력이 떨어진다.","다른 발달학적 장애나 행동장애를 동반하는 경우가 드물다."],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/20 3교시): 발달성 언어장애 – 만 2세까지 한 단어, 만 3세까지 두 단어 어구가 안 되면 지연, 표현성이 가장 흔하고 수용-표현 혼합형이 더 심하다. 비언어적 소통·소꿉놀이는 비교적 온전, 듣기·말하기가 안 되면 읽기·쓰기 학습도 안 되므로 학습 문제로 오면 언어 문제를 감별해야 한다. 티야방(문유선): 연령보다 1.5–2년 이상 늦을 때 진단, 언어 문제로 왔을 때의 감별이 중요하다고 재차 강조.\n\n📚 학습지 해설: 강의록에서는 찾을 수 없어 교과서 24장(의사소통장애)을 인용. ① 남아가 여아보다 2–3배 많다(틀림) ② 소아의 연령과 비언어적 지적 능력을 고려할 때 훨씬 낮은 표현성 언어능력(정답) ③ 수용-표현성 혼합 언어장애의 예후가 표현성보다 나쁘다(틀림) ④ 표현성 언어장애는 언어 표현을 제외하고는 다 정상이므로 자폐보다 비언어적 표현능력이 떨어진다고 볼 수 없음(틀림) ⑤ ADHD·유뇨증·행동장애 등이 흔히 동반된다(틀림).","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-ld-2017","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2017 객25","type":"객","rep":1,"repyears":"","stem":"학습장애에 대한 설명으로 옳은 것은?","choices":["여아가 많다.","지능이 낮다.","교육 부족 때문이다.","특수교육이 중요하다.","가장 흔한 유형은 산술장애이다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/20 3교시): 학습장애는 지능·환경·우울 문제가 아니라 기질적 문제로, 또래보다 1.5–2학년 뒤처질 때 진단 – 읽기·쓰기·산술. ADHD 아이의 산술장애처럼 동반이 흔하다.\n\n📚 학습지 해설: 신경정신의학 3판 194쪽~. 특정 학습장애 아동의 약 75%가 읽기 어려움(가장 흔한 유형은 읽기). 읽기·쓰기 손상은 남아가 2–3배(일부 3–4배) 많고 수학 손상만 여아에 더 흔하다. 정상 지능이어도 읽기장애가 생길 수 있다. DSM-5 기준 D: 지적장애·감각장애·불충분한 교육적 지도 등으로 더 잘 설명되지 않음. 모든 유형에서 특수교육이 치료로 제시되고 수업에서도 특수교육이 중요하다고 언급 → ① X ② X ③ X ④ O(정답) ⑤ X(가장 흔한 유형은 읽기).","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-multi-2013","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2013 객37","type":"객","rep":1,"repyears":"","stem":"다음의 증례를 읽고 답가지(1-10) 중에서 지시하는 수만큼 고르시오. 초등학교 4학년 남아가 ‘음, 음’소리를 반복해서 내고 눈을 찡긋거리고 코를 씰룩거리는 증상으로 내원했다. 또한, 아이는 손을 반복적으로 씻거나 정리된 장난감을 누가 만지거나 하면 굉장히 화를 낸다고 한다. 적절한 진단은? (두 가지)","choices":["ADHD","의사소통장애 (언어발달장애)","읽기장애","틱 장애","지적장애","적대적 반항장애","행실장애","분리불안장애","강박불안장애","아스퍼거장애"],"ans":[4,9],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 1교시): 틱과 강박은 같은 CSTC(피질–선조체–시상–피질) 회로 문제라 \"사촌지간\" – 틱 아이의 80%까지 단일 강박 증상(확인·배열·횟수 맞추기)을 보인다.\n\n📚 학습지 해설: 틱: 갑자기 반복적으로 일정하게 몸짓·소리를 내는 현상, 비수의적, 리듬·목적 없음, 야단쳐도 고쳐지지 않고 잠시 참을 수 있지만 곧 늘어남. 뚜렛(DSM-IV-TR): 다발성 근육틱 + 1개 이상 음성틱, 1년 이상(틱 없는 기간 3개월 초과 X), 18세 이전 발병. 강박장애: 오염 강박사고 → 반복적 손씻기, 대칭·정확하게 맞추기. 해석: \"음음\" 음성틱 + 눈 찡긋·코 씰룩 다발성 근육틱, 18세 미만이지만 지속 기간 언급이 없고 보기에 뚜렛이 없어 ④ 틱장애, 반복적 손씻기·정리정돈 집착으로 ⑨ 강박불안장애 동반.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-asp-2012","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2012 객42","type":"객","rep":1,"repyears":"","stem":"다음의 증례를 읽고 답가지(1-10) 중에서 지시하는 수만큼 고르시오. 초등학교 4학년 남아가 학교를 가지 않는다는 증상으로 내원했다. 지능은 95였고 친구에 대한 관심이 별로 없었다. 3세까지 언어발달은 늦지 않았다. 적절한 진단은? (한 가지)","choices":["ADHD","의사소통장애 (언어발달장애)","학습장애","선택적 함구증","지적장애","적대적 반항장애","행실장애","자폐성장애","강박장애","아스퍼거장애"],"ans":[10],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 언어 발달 지연은 없지만 사회성·행동 발달의 문제가 두드러지는 경우 – 언어·인지 발달의 전체적 지연 없이 사회적 상호교류에서 자폐와 유사한 질적 장애 → 아스퍼거 증후군 의심. 보기 분류: 발달장애(2·3·5·8·10), 정서장애(4·9), 행동장애(1·6·7) – 행동·정서장애 특징은 없으므로 제외, 2·5·8은 언어발달이 떨어지므로 제외, 3(학습장애)은 설명이 없으므로 답은 ⑩. (DSM-5에서는 자폐스펙트럼장애로 통합)","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-sm-2012","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2012 객43","type":"객","rep":2,"repyears":"2011 R46","stem":"다음의 증례를 읽고 답가지(1-10) 중에서 지시하는 수만큼 고르시오. 초등학교 2학년 남아가 학교를 가지 않는다는 증상으로 내원했다. 집에서는 이야기를 잘 하지만 밖에서는 말이 없었다. 언어를 이해하는 것은 적절했으나 표현하는 것은 나이보다 2년 정도 뒤쳐져 있다. 적절한 진단은? (두 가지)","choices":["ADHD","의사소통장애 (언어발달장애)","학습장애","선택적 함구증","지적장애","적대적 반항장애","행실장애","자폐성장애","강박장애","아스퍼거장애"],"ans":[2,4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 2교시): 선택적 함구증은 특정 상황(밖·낯선 사람 앞)에서만 말을 안 하는 아이로 사회불안과 연관, 말이 좀 늦은 경우가 많다. 밖에서는 위축되고 집에서는 오히려 떼쓰고 난리.\n\n📚 학습지 해설: 학교에 안 가려는 증상 – 분리불안·우울·학습장애·행실장애·학교 두려움·공포증 등 감별. 집에서는 말을 잘 하지만 밖에서는 말이 없음 → 선택적 함구증(말할 능력이 있어도 특정 상황에서 말하지 않음, 부끄럼·위축, 분리불안·등교거부·지연된 언어습득·ODD 동반, 최근에는 말하기의 거부보다 말하기의 두려움 개념이 우세). 수용은 적절하나 표현이 2년 뒤처짐 → 의사소통장애(표현성 언어장애: 수용성은 비교적 정상이지만 표현에 장애, 읽기 어려움·학습장애 동반 흔함). 정답 ②④.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-sm-2011","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 1 (자폐·지적장애·의사소통)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2011 R46","type":"객","rep":2,"repyears":"2012 객43","stem":"다음 문제를 읽고 답가지(1-12) 중에서 지시하는 수만큼 고르시오. 8세 남아가 학교에서는 거의 말을 하지 않았지만 집에서는 곧잘 말을 했다. 어려서 말이 늦었는데 언어평가 상 수용언어와 표현언어는 각각 7세 6개월 수준이었다. 지능은 88이었다. 환아는 선생님이나 부모님에게 말대답을 꼬박꼬박하고 대들 때가 많았다. 가능성이 높은 진단은? (두 가지)","choices":["주의력결핍과잉행동장애(ADHD)","표현성 언어장애","표현-수용성 혼재형 언어장애","만성 틱장애","뚜렛장애","소아우울증","적대적 반항장애","품행장애(행실장애)","분리불안장애","강박불안장애","자폐성 장애","선택적 함구증"],"ans":[7,12],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 2교시): 선택적 함구증은 사회불안장애와 유사하게 보고 불안장애로 분류, 밖에서는 얌전하고 집에서는 떼쓰는 경우가 많다.\n\n📚 학습지 해설: 특정 상황에서 말을 하지 않고, 수용·표현 언어가 6개월 느리며, 말대답을 꼬박꼬박하고 대든다. 표현성 언어장애·수용-표현 혼합 언어장애는 6개월 지연 정도이고 말대답을 잘하므로 아님. 적대적 반항장애(DSM-IV-TR): 어른과 말다툼을 자주 함, 어른의 요구·규칙에 자주 반항·거절 → 해당. 선택적 함구증: 다른 상황에서는 말하지만 특수한 상황에서는 말하지 않고 학업·사회적 의사소통에 지장, 1개월 이상 → 해당. 정답 ⑦⑫.","exps":[],"ai":"","fl":{}},{"k":"psy-ad-01","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 3 ADHD」 3–6쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD의 3대 핵심 증상으로 짝지어진 것은?","choices":["충동성, 우울, 틱","주의력 결핍, 불안, 강박","과잉행동, 상동행동, 언어 지연","부주의, 환청, 망상","주의력 결핍, 과잉행동, 충동성"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 학령기 ADHD 증상을 부주의·과잉행동·충동성으로 구분 (특별한 TY는 없어 Y 위주 정리)\n\n강의록 3 3쪽·교수님: 이름 그대로 주의력 결핍(부주의), 과잉행동, 충동성. 학령전기에는 과잉행동이 두드러져 잘 다치고, 학교에 들어가 40분 이상 앉아 있어야 하면서 집중 문제가 드러난다.","exps":["해당 없다.","해당 없다.","자폐 쪽이다.","정신병 증상이다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-02","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 3 ADHD」 7–9쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 ADHD 진단 기준에 대한 설명으로 옳은 것은?","choices":["각 영역 9개 중 6개 이상, 12세 이전 시작","집이나 학교 한 곳에서만 있어도 된다","부주의 9개 중 3개 이상이면 된다","뇌파·MRI 검사로 확진한다","증상이 반드시 7세 이전에 시작해야 한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 9개 중 6개 이상·6개월, 12세 이전으로 변경, 학교에서만/집에서만이면 다른 요인 고려, 기능 장해 반드시 확인\n\n강의록 3 7–9쪽·교수님: 부주의 9개, 과잉행동 6개 + 충동성 3개(합쳐 9개) 중 각각 6개 이상, 6개월 이상. DSM-5에서 시작 연령이 7세 → 12세로 바뀌었다. 두 가지 이상의 장면(집·학교 등)에서 나타나야 하고 기능 장애가 있어야 한다. 특정 검사로 확진하지 않는 현상학적 진단.","exps":["정답.","두 장면 이상이어야 한다.","6개 이상이다.","검사로 확진하지 않는다.","DSM-IV 기준이다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-03","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 3 ADHD」 8쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"학교에서는 괜찮은데 집에서만 산만하고 집중을 못 하는 아이에 대한 교수님 설명으로 옳은 것은?","choices":["집에서 산만해지는 다른 이유를 먼저 찾는다","자폐스펙트럼장애로 진단한다","학교에서의 증상은 중요하지 않다","바로 ADHD 혼합형으로 진단한다","ADHD 약을 바로 증량한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 9개 중 6개 이상·6개월, 12세 이전으로 변경, 학교에서만/집에서만이면 다른 요인 고려, 기능 장해 반드시 확인\n\n교수님: ADHD는 장소를 불문하고 증상이 있어야 한다. 집에서만 문제면 학대나 정서적 문제를, 학교에서만 문제면 또래 관계·학업 이해도 등 학교의 다른 문제를 먼저 살핀다.","exps":["정답.","해당 없다.","둘 다 봐야 한다.","두 장면 이상이어야 한다.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-04","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 3 ADHD」 18–23쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD 증상의 연령에 따른 변화로 옳은 것은?","choices":["과잉행동은 성인기에 오히려 늘어난다","충동성은 사춘기에 완전히 사라진다","세 증상 모두 성인기에 완전히 없어진다","과잉행동이 가장 먼저 줄어들고 부주의·충동성은 지속된다","부주의가 가장 먼저 좋아진다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 과잉행동은 빠르게 감소, 부주의는 성인까지, 충동성은 사춘기에 상승 – 행동문제 동반 시 반사회성 인격장애로 이행(재언급)\n\n강의록 3 18·21–23쪽·교수님: 가장 먼저 좋아지는 것은 과잉행동(초1 교실에선 돌아다니지만 5학년쯤엔 앉아서 딴짓) – 그래서 다 나은 줄 오해하기 쉽다. 부주의는 성인기까지 그대로, 충동성은 학령기에 줄었다가 청소년기에 다시 확 올라온다.","exps":["줄어든다.","청소년기에 다시 심해진다.","2/3가 성인까지 지속된다.","정답.","과잉행동이 먼저다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-05","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 3 ADHD」 20쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"성인기 ADHD에 대한 설명으로 옳은 것은?","choices":["남녀 비가 비슷하고 부주의 우세형이 많다","소아용 약물은 성인에게 쓸 수 없다","소아와 마찬가지로 남자가 훨씬 많다","성인기까지 지속되는 경우는 10% 미만이다","과잉행동 우세형이 가장 많다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 50–65% 이상 성인기 지속(Y 선지), 성인은 남녀 비슷·부주의 우세형, 약물 효과는 소아와 유사\n\n강의록 3 20쪽·교수님: 성인의 약 3%. 과잉행동을 주로 보이던 남자들이 줄어들고 부주의 우세형(여자에서 흔함)은 그대로 가서 성인기에는 남녀가 비슷(약 1:1). 예전엔 절반 이하로 봤으나 지금은 3분의 2까지 지속된다고 본다. 소아 약물을 성인에도 쓰도록 승인, 효과 동일.","exps":["정답.","승인되어 쓴다.","성인은 비슷하다.","2/3까지 지속된다고 본다.","부주의 우세형이 많다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-06","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 3 ADHD」 18쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD 아이가 청소년기에 특히 힘들어지는 이유로 교수님이 설명한 것은?","choices":["부주의가 완전히 사라져 버려서","사춘기에 지능이 떨어져서","시냅스 도파민이 지나치게 많아져서","과잉행동이 다시 심해지기 때문에","변연계는 성숙했는데 전전두엽 브레이크는 미숙해서"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 과잉행동은 빠르게 감소, 부주의는 성인까지, 충동성은 사춘기에 상승 – 행동문제 동반 시 반사회성 인격장애로 이행(재언급)\n\n교수님: 사춘기에는 호르몬이 불을 지피고 변연계라는 액셀러레이터는 완성됐는데 전두엽 브레이크는 아직 개발 중 – ADHD 아이가 이를 맞닥뜨리면 불같이 타오를 수 있다. 약물남용, 무면허 운전, 게임 중독, 충동적 자살 시도, 비행 등. 청소년 자살은 성인보다 우울증 없이 충동적으로 일어나는 경우가 많다.","exps":["부주의는 지속된다.","해당 없다.","낮다고 보는 가설이 있다.","과잉행동은 줄어든다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-07","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 3 ADHD」 25–26쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD 평가척도(ADHD rating scale)에 대한 설명으로 옳은 것은?","choices":["주로 자폐 증상을 평가한다","ADHD를 확진하는 검사다","50개 문항으로 이루어져 있다","18문항, 홀수 부주의·짝수 과잉행동-충동성","교사만 작성할 수 있는 척도다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 3 25–26쪽·교수님: 가장 많이 쓰는 스크리닝 도구. 18문항(9+9), 홀수 = 부주의, 짝수 = 과잉행동(앞 6개)·충동성(뒤 3개). 부모용·교사용 – 초1·초4·중1·고1 전체가 받는 정서행동특성검사에도 쓰인다. IOWA 코너스 교사 평가척도(10문항)는 ODD 감별 가능.","exps":["ADHD 척도다.","스크리닝이다.","18문항이다.","정답.","부모용도 있다."],"ai":"","fl":{}},{"k":"psy-ad-08","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 3 ADHD」 28쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"전산화 지속수행검사(CPT)에서 \"세모가 나올 때만 누르라\"고 했을 때, 세모가 아닌데도 자꾸 누르는 것이 주로 반영하는 것은?","choices":["지능 저하","부주의","시력 문제","충동성","불안"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 세모가 나왔는데 못 누르면 부주의(누락 오류), 세모가 아닌데 막 누르면 과잉행동·충동성(오경보 오류). 약 복용 전후 비교, 호전 정도 평가에도 쓴다.","exps":["해당 없다.","세모인데 못 누르는 것이다.","해당 없다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ad-09","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 3 ADHD」 31–32쪽 · STT 10/20 5교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD와 동반질환에 대한 설명으로 옳은 것은?","choices":["가장 흔한 동반은 ODD이고 순수 ADHD는 약 30%","동반질환 없는 순수한 ADHD가 대부분이다","불안·우울장애는 거의 동반되지 않는다","틱장애는 거의 동반되지 않는다","동반질환 여부는 예후와 관계가 없다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 가장 흔한 동반질환 ODD(40–50%), 순수 ADHD 30%, 원인 80% 유전 – 비율이 야마 선지로 나와 암기 권장\n\n강의록 3 31–32쪽(MTA study)·교수님: ADHD alone 31%, ODD 40%, 불안/기분 38%, 품행장애 14%, 틱 11%. 순수한 ADHD는 30%밖에 안 되고 나머지는 1–2개, 많게는 3–4개를 동반. 품행 문제가 동반되면 예후가 나쁘다.","exps":["정답.","약 30%뿐이다.","많이 동반된다.","약 10% 동반.","나빠진다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-10","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 4」 1–6쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD의 원인에 대한 설명으로 옳은 것은?","choices":["부모의 양육 잘못이 주원인이다","설탕·식품첨가물이 주원인이다","뇌 MRI 소견으로 진단한다","환경 요인은 전혀 관련이 없다","약 80%는 유전 요인, 일란성 일치율이 높다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 가장 흔한 동반질환 ODD(40–50%), 순수 ADHD 30%, 원인 80% 유전 – 비율이 야마 선지로 나와 암기 권장\n\n강의록 4 1–6쪽·교수님: 80%는 유전적·타고난 요인(일란성 일치율↑), 전전두엽 기능 이상, 도파민·노르에피네프린 이상(이에 작용하는 약이 효과 – 약물치료 근거). 나머지 20%는 환경(임신 중 흡연·음주, 미숙아, 출생 시 뇌손상, 출생 후 납 등 중금속). 뇌 영상 차이는 집단 통계일 뿐 진단에 쓰지 않는다.","exps":["편견이다.","편견이다.","진단에 쓰지 않는다.","20% 정도 관여한다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-11","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 4」 7·31쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD 치료에서 교수님이 \"핵심\"으로 꼽은 두 가지는?","choices":["특수교육과 작업치료","놀이치료와 가족치료","약물치료와 인지행동치료","감각통합과 언어치료","입원치료와 전기경련치료"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(김유연): ADHD 치료 핵심은 약물치료와 인지행동치료 – 병행 시 효과 최대\n\n강의록 4 7·31쪽·교수님: 핵심은 약물치료와 인지행동치료(참을성 훈련) – 부모역할 훈련은 이 내용을 부모에게 가르치는 것, 사회기술훈련은 그룹 CBT와 같이. 놀이·가족치료·특수교육은 case by case. 효과는 약물 + 행동치료 병합이 가장 좋고, 여의치 않으면 심한 아이는 약물치료라도 해야 한다.","exps":["보조 치료다.","기타 치료다.","정답.","해당 없다.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-12","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 4」 8–11쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"methylphenidate에 대한 설명으로 옳은 것은?","choices":["통상 용량에서 중독성과 금단이 심하다","도파민 재흡수를 차단하며 약 80%에서 효과","노르에피네프린만 선택적으로 차단한다","국내에는 아직 들어와 있지 않다","기본형도 작용 시간이 24시간 이상이다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(김유연): 가장 많이 쓰는 약 methylphenidate(주관식으로 낸 적 있음), 요즘은 6시간·10시간 서방정\n\n강의록 4 8–11쪽·교수님: 도파민·NE 재흡수 차단 → 시냅스 농도↑. 약 80%에서 효과(FDA 승인). 국내엔 MPH 계열만 있고 amphetamine은 없다(미국은 Adderall이 많이 팔림). 통상 용량에선 중독·금단이 별로 없지만 갈아서 주사하면 위험. 기본형 IR(리탈린)은 약 4시간 → 하루 1회 서방형(OROS 콘서타 등)을 주로 쓴다.","exps":["별로 없다.","정답.","아토목세틴 설명이다.","MPH만 있다.","IR 약 4시간, 서방형 10–12시간."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-13","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 4」 12쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"atomoxetine의 특징으로 옳지 않은 것은?","choices":["중추신경자극제가 아니다","불면보다 오히려 졸림이 올 수 있다","틱·불안 동반 ADHD에서 유리하다","methylphenidate보다 효과가 더 강하다","주로 노르에피네프린에 작용한다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(김유연): MPH는 도파민, atomoxetine은 노르에피네프린 재흡수 차단 – 13년 야마 선지\n\n강의록 4 12쪽·교수님: NE 재흡수 억제제, 비자극제, 잠이 오고 메스꺼움, 작용 시간이 길어 하루 1회, 틱·불안 동반 시 유리. 가장 문제는 효과 부족 – MPH가 70–80%라면 atomoxetine은 체감 약 50%.","exps":["옳다.","옳다.","옳다.","정답. 효과는 다소 부족하다.","옳다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-14","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 14쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"methylphenidate의 부작용과 대처로 옳지 않은 것은?","choices":["식욕 감소 – 식후 복용","대부분 부작용 때문에 복용을 중단한다","두통·복통 – 대부분 초기에 생겼다가 좋아진다","성장 – 주기적으로 키·몸무게를 잰다","불면 – 복용 시간 조절"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 14쪽·교수님: 식욕 감소(점심 입맛↓, 저녁에 확 올라옴 – 오래감), 수면 문제, 두통·복통, 예민성은 초기 일시적. 부작용으로 중단하는 경우는 약 5%. 성장은 영향 가능성(0.5–2 cm/2년?) – 교수님은 3–6개월마다 키·몸무게를 재고, 안 크면 약을 줄여 본다. 약물 휴일도 쓴다.","exps":["옳다.","정답. 약 5%만 중단한다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-ad-15","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 15–16쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 6시간짜리 ADHD 약을 부모에게 \"신데렐라 같은 약\", \"안경 같은 약\"이라고 설명하는 의미로 옳은 것은?","choices":["한 번 먹으면 영구적으로 낫는다","누구나 공부를 잘하게 하는 약이다","통상 용량에서도 중독성이 강하다","일반인에게도 같은 효과가 크다","약 기운이 떨어지면 원래대로 돌아온다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 15–16쪽·교수님: 학교에서는 차분하다가 1–2시에 집에 오면 원래대로(신데렐라). 안경을 쓴다고 시력이 좋아지진 않지만 써야 칠판이 보이듯. 다만 긍정적 피드백이 쌓이면 나중에 참을성이 생길 여지가 있다 – 경험적으로 약 2년(1–2년은 기본). \"공부 잘하는 약\"은 잘못된 정보.","exps":["아니다.","잘못된 정보다.","통상 용량에선 아니다.","보통 사람은 조금만 좋아진다.","정답."],"ai":"","fl":{}},{"k":"psy-ad-16","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 18–19쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD 아이의 자기지시 훈련(self-instruction training)에 대한 설명으로 옳은 것은?","choices":["큰소리 시범부터 점차 속으로 따라 하게 한다","약물치료 대신 항상 단독으로 쓴다","부모는 참여하지 않는다","잘못했을 때의 처벌을 중심으로 한다","치료자가 처음부터 속으로만 생각하게 한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 18–19쪽·교수님: 문제 파악 → 계획 → 실행 → 선택 → 검토(자기 강화) → 실패 시 coping self-talk. 치료자나 엄마가 큰소리로 중얼중얼 시범을 보이고 점점 작은 소리, 입만 뻥끗, 머릿속으로 – 반복해 각인. 즐거운 분위기에서.","exps":["정답.","병행한다.","부모도 가르친다.","해당 없다.","큰소리부터다."],"ai":"","fl":{}},{"k":"psy-ad-17","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 20쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD 아동 행동치료에서 모델링 방식으로 더 적합하다고 제시된 것은?","choices":["coping behavior modeling","mastery behavior modeling","response cost","flooding","aversion therapy"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 20쪽: mastery 모델링은 아이가 \"선생님은 하지만 난 못 해요\"라고 반응하기 쉬워 효과적이지 못하다. coping 모델링은 치료자가 실수하고 어려움에 부딪혀도 대처하는 모습을 보여 ADHD에 더 적합.","exps":["정답.","덜 효과적이다.","행동 수반성 기법이다.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ad-18","area":"티야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"📌티야방 · 근거: 강의록 「2023 정신의학 4」 21–27쪽 · STT 10/20 6교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"행동치료 기법에 대한 교수님 설명으로 옳지 않은 것은?","choices":["보상은 돈으로 주는 것이 가장 바람직하다","할머니 법칙 – 숙제를 먼저 하면 게임 시간을 더 준다","반응 대가 – 잘못하면 토큰을 빼앗는다","토큰 경제 – 바람직한 행동마다 스티커를 주고 모으면 보상","타임아웃 – 벽 보고 5분 서 있기처럼 비학대적인 처벌"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(김유연): 타임아웃: ADHD 비약물 치료 중 가장 비학대적인 처벌 방법\n\n강의록 4 21–27쪽·교수님: 토큰 경제(포도송이 스티커, 위시리스트 10개), 할머니 법칙, 타임아웃(한 번 기회를 주고), 반응 대가는 뺏는 것이라 좋지는 않아 잘 안 쓴다. 돈으로 주는 것은 바람직하지 않다 – 가뜩이나 물질적인데 돈만 밝히게 된다.","exps":["정답.","옳다.","옳다(잘 쓰지 않음).","옳다.","옳다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ad-19","area":"탈야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 26–27쪽","year":"","type":"객","rep":1,"repyears":"","stem":"ADHD 부모역할 훈련 프로그램 내용으로 강의록에 제시되지 않은 것은?","choices":["아이의 문제를 부정하고 기대 수준을 높이기","올바른 처벌 방법(타임아웃·반응 대가)","긍정적 강화 방법","공공장소 문제행동 조절(Think aloud–Think ahead)","ADHD 원인·증상·예후 교육"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 26–27쪽: 부모가 자녀의 결함을 수용하고 기대 수준을 조절하도록 돕는다. ADHD 교육, 상호작용 원리, 긍정적 강화, 올바른 처벌, 공공장소 조절, 자기지시 훈련 소개, 유지·일반화, 1달 후 booster session.","exps":["정답. 수용하고 기대를 조절한다.","제시됨.","제시됨.","제시됨.","제시됨."],"ai":"","fl":{}},{"k":"psy-ad-20","area":"탈야","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 강의록 「2023 정신의학 4」 32–34쪽","year":"","type":"객","rep":1,"repyears":"","stem":"학교와 부모가 함께하는 행동요법(평가카드 등)의 주의점으로 옳은 것은?","choices":["문제 항목 몇 가지만 골라 교사·부모가 협조","학교에서의 문제에는 효과가 없다","문제 항목을 최대한 많이 넣는다","교사의 객관적 평가는 필요 없다","시행 비용이 많이 들어 부담된다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4 32–33쪽: 장점 – 학교 문제 개선에 매우 효과적, 편리, 비용이 들지 않음. 주의 – 교사·부모의 긴밀한 협조, 교사의 객관적 평가. 가장 문제되는 항목 몇 가지를 골라 쓴다. 칭찬 듣는 아이는 칭찬 받을 행동을 한다(자기충족적 예언).","exps":["정답.","매우 효과적이다.","몇 가지만 고른다.","객관적 평가가 중요하다.","비용이 들지 않는다."],"ai":"","fl":{}},{"k":"psy-y-nd-adhd-2025","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2025 객15","type":"객","rep":4,"repyears":"2017 객24 · 2014 객3 · 2011 객42","stem":"한 아이가 수업시간에 자꾸 돌아다니고 친구들이랑 싸워서 병원에 진료를 보러왔다. 다음중 ADHD의 임상특징 중 옳은 것은?","choices":["남자보다 여자가 더 많다","30%에서 다른 질환을 동반한다","과잉행동이 먼저 호전된다","제일 흔한 동반질환은 불안장애이다","성인 ADHD 유병률은 소아의 1/3이다"],"ans":[3],"imgs":[],"vis":[],"notes":["복원자: 문제 문장은 정확히 기억나지 않아 요지만 복원."],"basis":"📌 티야방(고을민): 과잉행동은 빠르게 감소, 부주의는 성인까지, 충동성은 사춘기에 상승 – 행동문제 동반 시 반사회성 인격장애로 이행(재언급)\n\n🎓 올해 수업 기준: 교수님(10/20 5교시): 세 증상 중 과잉행동이 가장 먼저 좋아진다(초1 교실에선 돌아다니지만 5학년쯤엔 앉아서 딴짓) – 그래서 다 나은 줄 오해하기 쉽다. 부주의는 성인까지 그대로, 충동성은 학령기에 줄었다가 사춘기에 다시 확 올라온다(변연계는 성숙, 전두엽 브레이크는 미숙). 예전엔 절반 이하가 성인까지 간다고 봤으나 지금은 3분의 2까지. 성인은 남녀 비슷·부주의 우세형. 가장 흔한 동반은 ODD(40%), 순수 ADHD는 30%뿐, 품행 문제가 동반되면 예후가 나쁘고 반사회성 인격장애로 갈 수 있다. 티야방(고을민): 50–65% 이상 성인기까지 지속(야마 선지), 동반 ODD 40–50%·순수 ADHD 30%·원인 80% 유전 – 비율이 야마 선지로 나옴.\n\n📚 학습지 해설: 복원자: 구체적인 워딩은 기억나지 않지만 ADHD임을 바로 알 수 있는 쉬운 문제. ① 남자가 더 많다(성인 ADHD는 남녀 비슷) ② ADHD 단독이 30%이고 70%는 다른 질환 동반 ③ 맞다 – 과잉행동이 제일 먼저 호전되어 성인은 부주의 우세형이 많다, 충동성은 사춘기에 정점이었다가 살짝 감소하지만 성인에서도 관찰, 주의력결핍은 성인까지 꾸준히 남는다 ④ 제일 흔한 동반질환은 적대적 반항장애 ⑤ 소아 ADHD의 50–75%가 성인까지 유지되므로 1/3보다 많다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-nd-adhd-2017","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2017 객24","type":"객","rep":4,"repyears":"2025 객15 · 2014 객3 · 2011 객42","stem":"8세 남아가 수업시간에 떠들고 돌아다니며, 친구들을 건드리며, 물건을 자주 잃어버리는 증상으로 내원했다. 지능검사는 정상범위이며 성적은 하위권이다. 이 증상에 대한 설명 중 옳은 것은?","choices":["내년이 되면 물건을 잃어버리는 일이 줄어들 것이다.","어른이 되면 증상이 호전된다.","청소년이 되면 분노가 잘 나타난다.","어른이 되면 사회적 문제는 감소한다.","약물치료보다 행동치료만 하면 예후가 안 좋은 편이다."],"ans":[5],"imgs":[],"vis":[],"notes":["복원자: ③도 애매하지만 수업에서 청소년기는 분노보다 충동성을 강조해 ⑤로 올림."],"basis":"🎓 올해 수업 기준: 강의록 4 31쪽(14개월 후 치료 성공률): 약물 + 행동치료 > 약물치료 > 행동치료. 교수님(10/20 6교시): 효과는 약물치료와 인지행동치료를 같이 했을 때 가장 좋고, 여의치 않으면 심한 아이는 약물치료라도 해야 한다 – 학습지 정답 ⑤와 같다. ③(분노)은 수업에서도 청소년기는 \"충동성\"으로 설명했다.\n\n📚 학습지 해설: ① 학령기 동안 부주의·주의집중 부족(X) ② 성인이 되어서도 상당수 지속(X) ③ 청소년기는 충동성이 강함 – 잦은 충돌, 심한 감정 기복, 무모한 행동(X) ④ 성인 ADHD는 충동적 성향으로 사회 적응이 어렵다(잦은 이직·충돌)(X) ⑤ 강의록 그래프에서 약물 + 행동치료 시 가장 효과가 좋고 약물, 행동치료 순 → O. 복원자: \"③도 애매하지만 수업에서 청소년기 ADHD는 분노보다 충동성에 초점을 맞춰 강조해 ⑤로 올림.\"","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-adhd-2014","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2014 객3","type":"객","rep":4,"repyears":"2025 객15 · 2017 객24 · 2011 객42","stem":"8세 된 초등학교 2학년 남아가 외래를 방문했다. 어머니에 따르면 환자가 어려서부터 매우 산만했고 학교 수업시간에도 가만히 앉아 있지 못해 선생님으로부터 계속 지적을 받는다고 한다. 위 증례에서 가장 가능성이 높은 질환에 대한 설명이다. 옳은 것은?","choices":["남자보다 여자아이에서 흔하다.","대뇌 부위 중 변연계의 기능저하와 관련 있다.","생후 초기부터 까다롭고 활동이 많았던 경우가 흔하다.","성장하면서 과다행동이 가장 늦게 없어진다.","생후 초기부터 언어발달이 빠른 경우가 많다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/20 5·6교시): 학령전기엔 과잉행동이 두드러져 사건사고가 많고, 80%는 유전, 전전두엽(브레이크) 기능 저하 – 변연계가 아니다. 과잉행동이 가장 먼저 좋아진다.\n\n📚 학습지 해설: KMLE: 발생빈도 3–5%(초등 저학년), 남아에 3–5배. 원인 – 유전, 뇌손상, NE·도파민 결핍, 전두엽 혈류·대사 저하. 유아기부터 자극에 지나치게 민감하고 잘 자지 않고 우는 아이, 대부분 3세 이전에 전형적 증상. 과다활동은 잘 호전되지만 주의력결핍·충동성은 계속되는 경우가 많고, 품행장애 공존 시 반사회성 인격장애로 이어질 수 있다. ① 남아에 많음 ② 전두엽(변연계 X) ③ 정답 ④ 과다활동은 잘 호전 ⑤ 언어발달이 빠르다는 내용은 없음.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-adhd-2011","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2011 객42","type":"객","rep":4,"repyears":"2025 객15 · 2017 객24 · 2014 객3","stem":"초등학교 1학년 아이가 수업시간에 돌아다니고 집중을 못한다고 내원하였다. 진료실에서도 가만히 있지 못하고 돌아다녀 주의를 주었으나 이러한 행동이 계속 되었다. 가장 가능성이 높은 질환에 대한 설명 중 옳은 것은?","choices":["충동적인 면은 사춘기가 되면 감소한다.","사춘기 이후 흔히 양극성 장애로 이어진다.","도파민 수용체 길항제를 우선적으로 사용한다.","품행장애가 동반되면 흔히 반사회적 인격장애로 이어진다.","증상이 심한 경우 특수교육적 중재를 우선적으로 시행한다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/20 5교시): 세 증상 중 과잉행동이 가장 먼저 좋아진다(초1 교실에선 돌아다니지만 5학년쯤엔 앉아서 딴짓) – 그래서 다 나은 줄 오해하기 쉽다. 부주의는 성인까지 그대로, 충동성은 학령기에 줄었다가 사춘기에 다시 확 올라온다(변연계는 성숙, 전두엽 브레이크는 미숙). 예전엔 절반 이하가 성인까지 간다고 봤으나 지금은 3분의 2까지. 성인은 남녀 비슷·부주의 우세형. 가장 흔한 동반은 ODD(40%), 순수 ADHD는 30%뿐, 품행 문제가 동반되면 예후가 나쁘고 반사회성 인격장애로 갈 수 있다.\n\n📚 학습지 해설: 진단명은 ADHD. ① 충동성은 사춘기 이후까지 지속되는 경우가 많다 ② 양극성 장애로 이어진다는 언급은 없다 – 사춘기 이후 주의력결핍·충동성이 오래 지속되고 25% 이상에서 성인기까지 지속 ③ 국내에서는 methylphenidate(도파민·NE 재흡수 차단)를 가장 흔히 사용 – 도파민 수용체 길항제가 아님 ④ 청소년기 이후 지속 시 행동장애 위험이 크고 상당수에서 반사회적 인격장애나 알코올·약물중독(정답) ⑤ 약물치료만으로 효과가 충분치 않을 때 인지행동치료가 주요 보조치료.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-adhd-co-2015","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2015 객26","type":"객","rep":1,"repyears":"","stem":"초등학교 1학년 남아가 수업 중 돌아다니고 친구들을 건들며 물건을 자주 잃어버리는 증상으로 내원했다. 지능검사는 정상범위이며 성적은 하위권이다. 이 질환과 가장 흔히 동반되는 진단은?","choices":["우울장애","불안장애","지적장애","강박장애","행동장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(고을민): 가장 흔한 동반질환 ODD(40–50%), 순수 ADHD 30%, 원인 80% 유전 – 비율이 야마 선지로 나와 암기 권장\n\n🎓 올해 수업 기준: 교수님(10/20 3·5교시): ADHD에 가장 많이 동반되는 질환 하나를 꼽으라면 ODD(뜻대로 안 되면 뻗대는 아이) – 40–50%, 품행장애와 합쳐 행동 문제라 부른다. 티야방(고을민) 같은 내용.\n\n📚 학습지 해설: 학령기 ADHD 임상양상(부주의 실수, 집중 곤란, 조직화 문제, 경청 X, 물건 분실, 집중 과목 회피 / 안절부절, 뛰어다님, 조용히 못 놂, 말 많음, 불쑥 대답, 순서 못 지킴, 끼어듦). ADHD의 가장 흔한 동반증상은 ODD(적대적 반항장애) – KMLE 정리에 따르면 ODD는 파탄 행동장애의 세부분류(적대적 반항장애 + 행실장애)이므로 답은 ⑤ 행동장애.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-nd-inatt-2018","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2018 객26","type":"객","rep":2,"repyears":"2013 객41","stem":"10세 남자아이가 (A)과제물을 자주 잊어버리고, (B)수업 중에 돌아다닌다는 증상으로 정신과를 내원하였다. (C)평소 지나치게 말이 많았으며, (D)질문이 끝나기도 전에 불쑥 대답을 하며, (E)순서를 기다리지 못했다. 밑줄 친 증상 중 부주의에 해당되는 증상은?","choices":["(A)","(B)","(C)","(D)","(E)"],"ans":[1],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2013 객41"],"basis":"📌 티야방(고을민): 학령기 ADHD 증상을 부주의·과잉행동·충동성으로 구분 (특별한 TY는 없어 Y 위주 정리)\n\n📚 학습지 해설: 학령기 ADHD. 3대 핵심증상: 과잉행동, 충동성, 주의력결핍. 과잉행동·충동성 – 안절부절 움직임(B), 뛰어다니거나 기어오름, 조용히 못 놂, 말을 너무 많이 함(C), 불쑥 대답(D), 순서를 잘 못 지킴(E), 방해·끼어듦. 주의력결핍 – 부주의한 실수, 집중 곤란, 조직화 문제, 경청 X, 물건을 잘 잃어버림, 집중 필요 과목을 싫어함 → (A) 과제물을 잊어버림이 부주의. (2013 해설) 과제 안내를 듣지 않아 잊어버리든 과제물을 잃어버리든 모두 부주의에 해당.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-nd-adhd-tx-2025","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2025 객16","type":"객","rep":4,"repyears":"2014 객4 · 2016 객24 · 2013 객46","stem":"9세 남아가 수업시간에 떠들고 돌아다니면서 친구들을 건든다는 증상으로 내원했다. 적절한 치료법은?","choices":["행동치료","놀이치료","상담치료","언어치료","감각통합훈련"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/20 6교시): 핵심 치료는 약물치료와 인지행동치료(참을성 훈련: 멈추고 생각하기·자기지시 훈련·토큰 경제·타임아웃) – 효과는 약물 + 행동치료 병합이 가장 좋고, 여의치 않으면 심한 아이는 약물치료라도. 약은 methylphenidate(도파민·NE 재흡수 차단, 약 80% 효과, 요즘은 6시간·10시간 서방정), atomoxetine(NE, 비자극제, 효과 다소 부족). 감각통합·놀이치료는 핵심 치료가 아니다. 티야방(김유연): ADHD 치료는 약물치료(야마)와 CBT임을 꼭 기억.\n\n📚 학습지 해설: ADHD는 과잉행동·충동성·주의결핍이 3대 증상이고 초등 저학년 때 수업 집중을 못해 많이 내원. 주 치료는 ① 약물치료 – methylphenidate(도파민·NE 수송체를 막아 재흡수 차단) ② 인지행동치료 – 행동하기 전 멈추고 생각하기, 자기지시훈련, 토큰경제를 강조 → 답은 ① 행동치료.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-adhd-tx-2014","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2014 객4","type":"객","rep":4,"repyears":"2025 객16 · 2016 객24 · 2013 객46","stem":"8세 된 초등학교 2학년 남아가 외래를 방문했다. 어머니에 따르면 환자가 어려서부터 매우 산만했고 학교 수업시간에도 가만히 앉아 있지 못해 선생님으로부터 계속 지적을 받는다고 한다. 위 증례의 일반적인 치료원칙에 대한 설명 중 옳은 것은?","choices":["주변 자극을 줄여주고 조용한 환경을 만들어 준다.","약물치료로는 세로토닌 재흡수 차단제가 선택된다.","문제 행동에 대해서는 종종 체벌이 필요하다.","일대일 방식의 교육지도보다는 그룹형태의 교육이 필요하다.","토큰경제와 같은 보상을 이용하는 행동치료는 사용하지 않는다."],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/20 6교시): 핵심 치료는 약물치료와 인지행동치료(참을성 훈련: 멈추고 생각하기·자기지시 훈련·토큰 경제·타임아웃) – 효과는 약물 + 행동치료 병합이 가장 좋고, 여의치 않으면 심한 아이는 약물치료라도. 약은 methylphenidate(도파민·NE 재흡수 차단, 약 80% 효과, 요즘은 6시간·10시간 서방정), atomoxetine(NE, 비자극제, 효과 다소 부족). 감각통합·놀이치료는 핵심 치료가 아니다. 교수님: 돈으로 보상하는 것은 바람직하지 않고, 처벌은 비학대적인 타임아웃 정도.\n\n📚 학습지 해설: ① ADHD 아동은 유아기부터 소음·빛·온도에 과민 – 자극을 줄여주면 부주의 개선에 도움(O) ② 중추신경자극제(d-amphetamine, methylphenidate, pemoline) – SSRI는 쓰지 않음(X) ③ 체벌은 충동성을 악화시킬 수 있어 좋지 않음(X) ④ 그룹보다 일대일 지도가 필요(X) ⑤ 약물만으로 부족하면 인지행동치료가 주요 보조치료 – 행동치료 효과 있음(X). 신경정신의학 2판 563–567쪽.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-adhd-tx-2016","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2016 객24","type":"객","rep":4,"repyears":"2025 객16 · 2014 객4 · 2013 객46","stem":"8세 남아가 수업시간에 떠들고 돌아다니는 증상으로 내원하였다. 다음 중 가장 먼저 시행해야 할 것은?","choices":["약물치료실시","사회성숙도 검사 실시","부모와 아동의 심리검사 실시","부모에게 아이가 집에서는 어떤지 물어본다.","약물치료와 집단인지행동치료를 함께 실시한다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/20 5교시): 증상이 장소를 불문하고(집·학교 등 두 장면 이상) 있어야 한다 – 학교에서만 그러면 학교의 다른 문제, 집에서만 그러면 학대·정서 문제를 먼저 찾는다. 확진 검사는 없고 면담·관찰·척도로 판단한다.\n\n📚 학습지 해설: ADHD란? 3대 핵심증상, 학령기 증상 목록, 진단과정(면담·행동 관찰·평가 도구·심리검사·주의력 장애 진단 시스템 → 소아청소년정신과 전문의가 임상적 진단). KMLE 진단기준: 부주의 9가지 중 6가지 이상 또는 과다활동·충동성 9가지 중 6가지 이상이 6개월 이상, 7세 이전 시작(DSM-5는 12세), 두 곳 이상(학교·가정), 기능상 장애. 해설: ADHD 진단에는 아이가 어떤 증상을 보이는지가 중요 – 바로 치료나 심리검사를 하기보다 부모에게 집에서 어떤지 물어보는 게 가장 적합 → ④.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-adhd-tx-2013","area":"야마","prof":"박태원","sec":"10/20 · 소아청소년 2 (ADHD)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2013 객46","type":"객","rep":4,"repyears":"2025 객16 · 2014 객4 · 2016 객24","stem":"초등학교 1학년인 8세 남아가 약속을 잊고 물건을 잃어버렸고 수업 도중에는 자주 끼어들었다. 이에 우선적으로 사용할 수 있는 약물이 아닌 것은?","choices":["Atomoxetine","Clonidine","Dextroamphetamine","Imipramine","Haloperidole"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(김유연): MPH는 도파민, atomoxetine은 노르에피네프린 재흡수 차단 – 13년 야마 선지\n\n🎓 올해 수업 기준: 교수님(10/20 6교시): 국내엔 methylphenidate 계열만 있고 amphetamine은 없다(미국은 Adderall이 많이 팔림). atomoxetine은 NE 재흡수 억제제. 티야방(김유연): atomoxetine은 13년 이 야마 선지로 출제.\n\n📚 학습지 해설: ADHD 약물치료(책): 약물치료가 가장 효과적, 중추신경자극제 d-amphetamine·methylphenidate·pemoline, NE 작용 약물 atomoxetine. ① O ② O – 수업에서 clonidine도 ADHD 약이고 틱장애에 더 많이 쓴다고 설명 ③ O ④ O – 직접 언급은 없지만 틱 ppt에 ADHD 동반 틱에 TCA 계열 언급, TCA(imipramine 등)는 자극제가 안 듣거나 기분장애·틱 가족력 등에서 사용 ⑤ X – haloperidol 같은 항정신병약물은 자폐·지적장애·뇌손상 환자에 ADHD가 있을 때 조절용 → 가장 적합하지 않은 것은 haloperidol.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-ea-fh","area":"야마","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: 강의록 「2026 급식 및 식사장애」 8쪽(형성평가) · STT 10/20 7교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"🤍형성평가 22세 여성이 서서히 체중이 줄어 키 162cm, 체중 33kg가 되었다. 2년 전 부모와 갈등이 생기면서부터 증상이 시작되었는데, 불규칙적으로 식사를 하고 본인이 좋아하는 야채와 음료만을 많이 먹은 후 즉시 토하거나 설사를 자주 하였고, 근래에는 6개월간 생리가 없었다. 그러나 환자는 체중을 더 줄여야 한다며 거의 매일 자전거를 타고 있다. 진단은?","choices":["급식장애","폭식장애","신경성 폭식증","신경성 식욕부진증, 제한형","신경성 식욕부진증, 폭식/제거형"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"수업 중 교수님 풀이: 5번 신경성 식욕부진증, 폭식/제거형. 심한 저체중(신경성 \"저체중증\")이면서 먹고 토하는 제거 행동이 반복되므로 폭식증이 아니라 식욕부진증의 폭식/제거형. 교수님 실제 환자(160cm·26kg, 요플레·양배추만 먹고 토함, 자전거) 이야기와 같은 문제.","exps":["식사 거부가 아니라 섭식장애다.","보상행동이 있다.","저체중이면 식욕부진증이 우선이다.","제거 행동이 반복된다.","정답. 저체중 + 제거 행동."],"ai":"","fl":{}},{"k":"psy-ea-01","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"📌티야방 · 근거: STT 10/20 7교시(양종철) · 교과서 17장(급식 및 섭식장애)","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 신경성 식욕부진증(anorexia nervosa)을 개념상 \"신경성 저체중증\"이라고 부르자고 한 이유는?","choices":["주관식 답안으로 써도 되기 때문에","젊은 남자에서 더 흔하기 때문에","대부분 체중이 정상이기 때문에","핵심은 저체중이고, 1/3은 폭식·구토도 해서","환자들이 식욕을 항상 잃기 때문에"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(문성하): \"신경성 저체중증\"이라고 써 놓으라고 하심 – 저체중 강조, 1/3은 폭식/제거형\n\n교수님: 이름 때문에 꼭 안 먹는 것 같지만 많이 먹고 토하기도 잘한다. 핵심은 정상 수준보다 현저히 떨어진 저체중과 신체상 왜곡. 교과서도 환자의 1/3은 폭식 삽화, 1/3은 보상행동이 있다고 한다. 단, 시험 주관식에 \"신경성 저체중증\"이라고 쓰면 틀린다.","exps":["쓰면 틀린다고 했다.","젊은 여성에 많다.","저체중이 핵심이다.","정답.","식욕 상실이 항상 있는 것은 아니다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ea-02","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"📌티야방 · 근거: STT 10/20 7교시(양종철) · 교과서 17장(급식 및 섭식장애) 421쪽","year":"","type":"객","rep":1,"repyears":"","stem":"폭식과 제거 행동을 반복하는 환자가 신경성 식욕부진증 수준으로 체중이 빠져 있을 때 내리는 진단은?","choices":["신경성 폭식증","두 진단을 함께 붙인다","신경성 식욕부진증, 폭식/제거형","회피적/제한적 음식섭취장애","폭식장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(문성하): 감별 부분은 항상 물어보는 중요한 부분 – 식욕부진증 폭식/제거형(저체중+보상행동), 폭식증(정상체중+보상행동), 폭식장애(보상행동 X)\n\n교수님(교과서 421쪽 감별): 폭식 행동이 신경성 식욕부진증 기간에만 일어나면 anorexia nervosa 폭식/제거형으로 진단하고 bulimia를 추가하지 않는다. 정신과 진단은 더 심각한 것(금메달)을 내린다 – 조현병이 있으면 NOS를 붙이지 않는 것과 같다.","exps":["저체중이면 식욕부진증이다.","추가하지 않는다.","정답.","신체상 왜곡이 없다.","제거 행동이 있다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ea-03","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"📌티야방 · 근거: STT 10/20 7교시(양종철) · 교과서 17장(급식 및 섭식장애) 421쪽","year":"","type":"객","rep":1,"repyears":"","stem":"5년 전 신경성 식욕부진증(30kg대)이었던 사람이 체중이 50kg로 회복된 뒤에도 먹고 토하기를 반복한다면 현재 진단은?","choices":["급식장애","폭식장애","신경성 식욕부진증, 폭식/제거형","신경성 폭식증","야식증후군"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(문성하): 감별 부분은 항상 물어보는 중요한 부분 – 식욕부진증 폭식/제거형(저체중+보상행동), 폭식증(정상체중+보상행동), 폭식장애(보상행동 X)\n\n교수님: 초기 진단이 식욕부진증이었더라도 현재 저체중이 아니면서 폭식과 제거 행동을 하면 신경성 폭식증. 식욕부진증은 저체중이 반드시 있어야 한다. (2019 야마와 같은 상황)","exps":["해당 없다.","보상행동이 있다.","저체중이 아니다.","정답.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-ea-04","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"📌티야방 · 근거: STT 10/20 7교시(양종철) · 교과서 17장(급식 및 섭식장애) 419–423쪽","year":"","type":"객","rep":1,"repyears":"","stem":"신경성 폭식증과 폭식장애를 구별하는 핵심은?","choices":["환자의 성별 분포","처음 발병한 연령","폭식하는 시간대(밤·낮)","한 번에 먹는 폭식의 양","정기적인 보상(제거) 행동의 유무"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(문성하): 감별 부분은 항상 물어보는 중요한 부분 – 식욕부진증 폭식/제거형(저체중+보상행동), 폭식증(정상체중+보상행동), 폭식장애(보상행동 X)\n\n교수님: 둘 다 폭식은 같고, 폭식장애는 딱 하나 – 보상행동을 하지 않는다(그래서 대개 과체중·비만). \"정기적으로\"를 강조 – 한 번 토한 날이 있다고 폭식증이 되지는 않는다. 폭식증은 체중이 정상 범위이거나 약간 통통.","exps":["해당 없다.","해당 없다.","야식증후군의 기준이다.","둘 다 많이 먹는다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-ea-05","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"📌티야방 · 근거: 강의록 「2026 급식 및 식사장애」 5쪽 · STT 10/20 7교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 신경성 폭식증 진단 기준으로 옳은 것은?","choices":["체중이 정상의 85% 미만이어야 한다","체형과 체중은 자아 평가와 관계없다","폭식이 하루 1회 이상, 1년 동안","보상행동 없이 폭식만 있으면 된다","폭식과 보상행동이 주 1회 이상, 3개월"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(문성하): 기준 B \"반복적이고 부적절한\" 보상행동, 기준 C \"주 1회 이상 3개월\" 반복 강조\n\n강의록 5쪽·교수님: 폭식(2시간 이내 대부분 사람보다 명백히 많이 + 조절 상실감) + 반복적·부적절한 보상행동, 둘 다 평균 주 1회 이상 3개월, 체형·체중이 자아 평가에 과도한 영향, 식욕부진증 삽화 중에만 있는 것이 아님. 중증도는 보상행동 빈도(경도 주 1–3, 중등도 4–7, 중증 8–13, 극심 14회 이상).","exps":["식욕부진증 기준이다.","과도한 영향을 미친다.","주 1회·3개월이다.","보상행동도 필요하다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-ea-06","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: 강의록 「2026 급식 및 식사장애」 7쪽 · STT 10/20 7교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"야식증후군(night eating syndrome) 기준에 대한 교수님 설명으로 옳은 것은?","choices":["저녁 이후 섭취가 하루의 25% 이상(또는 주 2회 이상)","저녁식사 이후 섭취량이 하루의 10% 이상","아침 식욕은 오히려 증가한다","밤에 한 번이라도 먹으면 진단","야식 후 반드시 구토를 동반한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7쪽·교수님: 저녁 이후 하루 섭취량의 25% 이상 또는 주 2회 이상 야간 섭취, 아침 식욕부진, 잠들려면 먹어야 한다는 믿음 등, 3개월 이상. 교수님: 하루 4끼 먹는 사람은 다 25%가 되니 개념을 너무 고정해서 생각하지 말라.","exps":["정답.","25%다.","아침 식욕부진이다.","기준이 있다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ea-07","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: STT 10/20 7교시(양종철) · 교과서 17장(급식 및 섭식장애) 414–417쪽","year":"","type":"객","rep":1,"repyears":"","stem":"섭식장애 환자의 먹는 행동 조절에 대한 교수님 설명으로 옳은 것은?","choices":["쾌락적·보상적 측면은 없다","렙틴과는 전혀 관계없다","도파민은 전혀 관여하지 않는다","배고픔과 포만감(배)으로만 조절한다","머리로 조절하려 해서 참을수록 식욕이 는다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님(교과서 414쪽): 먹는 행동은 항상성(배로 조절, 렙틴)과 쾌락적 측면(보상 체계)으로 조절된다. anorexia·bulimia는 먹는 것을 머리로 조절하려 해서 사이클이 깨진다. 세로토닌·도파민(먹고 싶은 drive)이 관여하고 뇌 영역은 insula(신체 감각과 뇌 연결) – 다 이론일 뿐.","exps":["있다.","렙틴이 관여한다.","관여한다.","환자는 머리로 조절한다.","정답."],"ai":"","fl":{}},{"k":"psy-ea-08","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: STT 10/20 7교시(양종철) · 교과서 17장(급식 및 섭식장애) 414–417쪽","year":"","type":"객","rep":1,"repyears":"","stem":"신경성 식욕부진증 환자의 특징으로 옳지 않은 것은?","choices":["저체중을 성취의 결과로 여겨 질병으로 생각하지 않는다","회복에 대한 동기가 매우 높다","자율성(autonomy)·통제(control)에 예민하고 완벽주의적이다","무월경·서맥·저혈압·솜털(lanugo)이 나타날 수 있다","젊은 여성에서 많다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"교수님(교과서 414–417쪽): 자기 통제를 중시하고 evasive(핑계 잘 댐), 자신감 부족·완벽주의가 위험요인. 저체중을 문제로 인식하지 않아 회복 동기가 낮다. 무월경은 너무 당연해서 DSM-5 진단 기준에서는 빠졌다. 강박적 특성도 있다.","exps":["옳다.","정답. 동기가 낮다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-ea-09","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: STT 10/20 7교시(양종철) · 교과서 17장(급식 및 섭식장애) 417–418쪽","year":"","type":"객","rep":1,"repyears":"","stem":"신경성 식욕부진증 치료에 대한 교수님 설명으로 옳은 것은?","choices":["신체 질환 감별진단은 필요 없다","억지로 입원시켜 강제로 먹이는 것이 원칙이다","항우울제가 체중을 근본적으로 늘려 준다","olanzapine은 절대 금기다","동기 유발이 먼저이고, 입원은 극소수에 제한"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님(418쪽): 강제로 입원시켜 먹이면 나가서 마찬가지 – 동기 유발이 먼저. 심장·신장 기능 때문에 죽을 수 있을 때만 입원(먹은 뒤 1–2시간 간호사실 앞에 있게 함). 항우울제는 우울·강박 동반 시. 생각이 망상처럼 굳은 경우 olanzapine(체중 증가 부작용)을 쓰기도 한다. 암·내부 출혈 등 신체 질환 감별이 중요.","exps":["신체 질환 감별이 중요하다.","동기 유발이 먼저다.","근본적 효과는 적다.","쓰기도 한다.","정답."],"ai":"","fl":{}},{"k":"psy-ea-10","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: STT 10/20 7교시(양종철) · 교과서 17장(급식 및 섭식장애) 422쪽","year":"","type":"객","rep":1,"repyears":"","stem":"신경성 폭식증의 1차 선택 치료는?","choices":["인지행동치료","장기 입원","정신분석","olanzapine","전기경련치료"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"교수님(422쪽): 1차 선택은 인지행동치료 – 먹는 것은 머리가 아니라 배로 자연스럽게 조절해야 한다는 생각 교정. 항우울제는 성격·우울·스트레스 문제에 쓰지만 체중 증가 부작용에 주의. topiramate(항경련제)는 소량에서 식욕을 떨어뜨려 교과서에 올라와 있다.","exps":["정답.","해당 없다.","해당 없다.","식욕부진증에서 언급.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ea-11","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: STT 10/20 7교시(양종철) · 교과서 17장(급식 및 섭식장애) 417쪽","year":"","type":"객","rep":1,"repyears":"","stem":"회피적/제한적 음식섭취장애(ARFID)가 신경성 식욕부진증과 다른 점은?","choices":["성인에서만 진단할 수 있다","반드시 폭식 삽화가 있다","체중 감소가 전혀 없다","체중 증가 두려움·신체상 왜곡이 없다","구토 등 보상행동이 반드시 있다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님(417쪽 감별): 회피적/제한적 음식섭취장애에는 \"살을 더 빼야 한다\"는 체중 증가 두려움과 신체상 왜곡이 없다.","exps":["해당 없다.","해당 없다.","있을 수 있다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ea-12","area":"티야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: 강의록 「2026 급식 및 식사장애」 6쪽 · STT 10/20 7교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"폭식장애에서 폭식 삽화로 보기 위해 필요한 동반 특징(3가지 이상)에 해당하지 않는 것은?","choices":["먹은 뒤 반드시 구토로 제거한다","먹은 뒤 죄책감·혐오감을 느낀다","정상보다 훨씬 급하게 먹는다","배고프지 않아도 많이 먹는다","속이 불편해질 정도까지 먹는다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6쪽·교수님: 급하게, 불편할 정도까지, 배고프지 않아도, 부끄러워 혼자, 식후 혐오·우울·죄책감 중 3가지 이상, 주 1회 이상 3개월, 보상행동과 연관되지 않음. 교수님: 실제 폭식 정도로 먹기는 쉽지 않다 – 많이 먹는 친구를 다 폭식장애라 하면 안 된다.","exps":["정답. 보상행동이 없다.","해당.","해당.","해당.","해당."],"ai":"","fl":{}},{"k":"psy-ea-13","area":"탈야","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: 강의록 「2026 급식 및 식사장애」 4쪽","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 신경성 식욕부진증의 심각도 기준이 되는 것은?","choices":["병원 방문 횟수","체질량지 ,"신경성 식욕부진증, 제한형","신경성 식욕부진증, 폭식/제거형"],"ans":[5],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2021 객37"],"basis":"📌 티야방(문성하): 감별 부분은 항상 물어보는 중요한 부분 – 저체중이면 식욕부진증, 정상체중이면 폭식증\n\n🎓 올해 수업 기준: 교수님(10/20 7교시): 식욕부진증은 \"신경성 저체중증\"으로 이해하라 – 핵심은 현저한 저체중, 1/3은 폭식하고 토하기도 한다. 저체중이면서 폭식·제거를 반복하면 식욕부진증 폭식/제거형(더 심각한 진단이 우선 – \"금메달\"), 저체중이 아니면서 정기적으로 폭식·제거하면 신경성 폭식증, 보상행동 없이 먹기만 하면 폭식장애. 과거에 식욕부진증이었어도 지금 체중이 회복됐으면 폭식증. 교과서 421쪽 감별은 \"항상 물어보고 헷갈리게 만드는 것\"이라고 했다. 이 해는 160cm·29kg 저체중 + 채소 과식 후 즉시 구토·심한 운동 반복 → 폭식/제거형(형성평가와 같은 유형).\n\n📚 학습지 해설: (송채원, 2022) 식욕부진증과 폭식증의 감별점은 체중 – 식욕부진증은 저체중 유지, 폭식증은 보상행동이 있지만 정상 체중. 많이 먹고 보상행동이 없으면 폭식장애. 식욕부진증은 지난 3개월간 폭식/제거 행동 유무로 제한형과 폭식/제거형으로 나뉜다. (백승화·서민지, 2021) 양종철 교수님은 시험 전 마지막 수업에서 10문제를 모두 찍어 주셨고, 폭식을 한다고 모두 신경성 폭식증이 아니라 식욕부진증에도 폭식-제거형이 있다고 강조하셨는데 정확히 이 유형을 내셨다. 160cm·29kg의 명백한 저체중이며 폭식과 보상행동을 반복 → 식욕부진증 폭식/제거형. 폭식과 보상행동이 있으면 \"저체중 = anorexia, 정상체중 = bulimia\"로 생각하면 쉽다(19년에는 165cm·58kg 정상체중으로 폭식증이 정답).","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-ed-bn-2023","area":"야마","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: 학습지 「급식 및 섭식 장애」 218–223쪽","year":"2023 객41","type":"객","rep":3,"repyears":"2019 객38 · 2012 객19","stem":"35세 여자가 먹고 토하기를 반복한다. 159cm에 64kg이었다. 5년 전에는 39kg이었다. 과다하게 먹고 구토를 반복하는 양상을 보인다. 자신의 체형에 문제가 있다고 느끼지는 않고 있다. 스트레스를 받으면 폭식을 하고 싶은 욕구를 참을 수가 없다고 한다.","choices":["신경성 식욕 부진증","폭식장애","충동조절장애","신체이형장애","신경성 폭식증"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(문성하): 감별 부분은 항상 물어보는 중요한 부분 – 저체중이면 식욕부진증, 정상체중이면 폭식증\n\n📚 학습지 해설: (이은종·이재덕, 2023) 일정하게 제거하려는 양상을 보이고 저체중이 아니므로 신경성 폭식증. 식욕부진증 폭식/제거형은 일정하게 제거하려는 양상 + 저체중, 신경성 폭식증은 일정하게 제거하려는 양상 + 저체중 아님, 폭식장애는 제거양상이 없거나 일정함이 없는 제거행동.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-ed-bn-2019","area":"야마","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: 학습지 「급식 및 섭식 장애」 218–223쪽","year":"2019 객38","type":"객","rep":3,"repyears":"2023 객41 · 2012 객19","stem":"5년 전에 체중에 대해 스트레스를 받으면서 음식을 먹지 않고, 먹다가 토하던 여성 (165cm,30kg대)이 결혼 후 괜찮다가 5개월 전부터 남편 일로 스트레스를 받아 다시 먹고 토하기를 반복하는데 지금은 165cm에 5
