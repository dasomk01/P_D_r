<title>정신의학 문풀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* layout: 상단 고정 필터 묶음 + 한 문제씩 넘기는 카드 한 장 */
:root{
  --bg:#f3f4f8;--card:#ffffff;--fg:#1d2030;--mute:#6b6f85;--line:#d9dbe6;
  --accent:#3550c0;--accent-fg:#ffffff;--accent-soft:#e8ecfb;
  --ok:#23824a;--ok-soft:#e5f4ea;--bad:#c23a32;--bad-soft:#fbeae8;--warn:#8a6400;--warn-soft:#fff4d6;
  --chip:#ebedf3;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161e;--card:#1d2029;--fg:#e8e9f0;--mute:#9a9db0;--line:#333747;
  --accent:#7d93ff;--accent-fg:#0f1220;--accent-soft:#252d4d;
  --ok:#5fcf8a;--ok-soft:#18321f;--bad:#ff7d73;--bad-soft:#3a1d1b;--warn:#f2c552;--warn-soft:#3a3016;--chip:#272a36;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161e;--card:#1d2029;--fg:#e8e9f0;--mute:#9a9db0;--line:#333747;
  --accent:#7d93ff;--accent-fg:#0f1220;--accent-soft:#252d4d;
  --ok:#5fcf8a;--ok-soft:#18321f;--bad:#ff7d73;--bad-soft:#3a1d1b;--warn:#f2c552;--warn-soft:#3a3016;--chip:#272a36;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
h1{font-size:26px;line-height:1.25;margin:4px 0 10px;font-weight:700;letter-spacing:-.01em}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--mute);font-size:14.5px}
.stats b{color:var(--fg);font-family:var(--f-num);font-weight:500;margin-left:4px}
.sync{text-align:right;color:var(--mute);font-size:13px;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input[type=search],textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px}
select,input[type=search]{width:100%;min-width:0;padding:10px 12px;font-size:15px}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip,.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 16px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{border-radius:12px;padding:9px 14px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.navbar{display:flex;align-items:center;gap:8px}
.navbar .pos{flex:1;font-family:var(--f-num);color:var(--mute);font-size:15px;min-width:0}
.navbar .pos b{color:var(--fg);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;color:var(--mute);font-size:14px}
.pill{background:var(--chip);color:var(--fg);border-radius:8px;padding:2px 9px;font-size:13px;font-weight:600}
.pill.area{background:var(--accent-soft);color:var(--accent)}
.pill.king{background:var(--warn-soft);color:var(--warn)}
.meta{color:var(--accent);font-size:14px;margin-top:8px;font-weight:500}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:7px 11px;font-size:13.5px;margin-top:8px}
.note.oos{background:var(--chip);color:var(--mute)}
.stem{font-size:17px;margin:14px 0 12px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.imgs img{display:block;max-width:100%;height:auto;margin:8px auto;border-radius:8px;border:1px solid var(--line)}
.vis{background:var(--chip);border-radius:10px;padding:8px 11px;font-size:14px;white-space:pre-wrap;margin-bottom:8px}
.choices{display:grid;gap:10px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;word-break:keep-all;overflow-wrap:anywhere}
.ch .no{font-family:var(--f-num);color:var(--mute);font-size:14px;flex:none;width:18px;padding-top:2px}
.ch span:last-child{min-width:0}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ch.mine{box-shadow:inset 0 0 0 1px currentColor}
.done .ch{cursor:default}
.result{margin-top:14px;font-weight:700;font-size:16px}
.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}
.exp{margin-top:8px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.exp h3{font-size:13px;color:var(--mute);margin:14px 0 4px;font-weight:600;letter-spacing:.02em}
.exp ol{margin:0;padding-left:22px;white-space:normal}
.exp li{margin:3px 0}
.ai{background:var(--accent-soft);border-radius:10px;padding:8px 11px;font-size:14px;margin-top:10px;white-space:pre-wrap}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.acts .chip{font-size:14px;padding:6px 13px}
.memo{margin-top:14px}
.memo label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:600}
.memo textarea{width:100%;min-height:84px;padding:10px 12px;font-size:15px;resize:vertical}
.memo .saved{font-size:12px;color:var(--mute);min-height:1em}
.bottomnav{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.sheet{position:fixed;inset:0;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.sheet[hidden]{display:none}
.sheet .box{background:var(--bg);width:100%;max-width:760px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{font-size:18px;margin:0 0 8px}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);padding:9px 2px;cursor:pointer;display:flex;gap:10px}
.list li.cur{background:var(--accent-soft)}
.list .n{font-family:var(--f-num);color:var(--mute);font-size:13px;width:44px;flex:none;padding-top:2px}
.list .t{min-width:0;font-size:14.5px}
.list .s{font-size:12.5px;color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.sheet textarea{width:100%;height:160px;font:12px/1.4 var(--f-num);padding:8px}
.msg{font-size:13px;color:var(--ok);min-height:1.2em;margin:6px 0}
@media (max-width:420px){h1{font-size:23px}.stem{font-size:16.5px}}
@media (prefers-reduced-motion:no-preference){.ch{transition:background .15s,border-color .15s}}
</style>

  <div class="tools">
    <button class="btn" id="bSync">기록 새로고침</button><button class="btn" id="bBak">기록 백업</button><button class="btn" id="bRes">백업 불러오기</button><button class="btn" id="bExp">오답·헷갈림·메모 내보내기</button>
  </div>
  <hr class="sep">
  <div class="navbar">
    <button class="btn" id="prev">이전</button><div class="pos" id="pos"></div><button class="btn" id="bList">목록</button><button class="btn pri" id="next">다음</button>
  </div>
  <div id="view"></div>
</div>

<script id="data" type="application/json">[{"k":"psy-intro-01","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 3쪽(DSM-5 정의) · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5의 정신장애(mental disorder) 정의에 비추어 볼 때, 정신장애로 보지 않는 것은?","choices":["사랑하는 사람이 죽은 뒤 문화적으로 예상되는 정도의 슬픔 반응","사회적·직업적 활동에 현저한 고통이나 장애를 동반하는 증후군","개인 내부의 기능 이상에서 비롯된 사회적 일탈 행동","인지·정서 조절·행동에 임상적으로 유의한 장해가 있는 증후군","심리적·생물학적 발달 과정의 기능 이상을 반영하는 행동 장해"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"DSM-5 정의: 흔한 스트레스나 상실(예: 사랑하는 사람의 죽음)에 대한 예상 가능하거나 문화적으로 용인되는 반응은 정신장애가 아니다. 사회적 일탈(정치·종교·성)이나 개인과 사회의 갈등도 개인 내부의 기능 이상에서 온 것이 아니면 정신장애가 아니다.","exps":["정답. 예상 가능한 애도 반응은 정신장애에서 제외된다.","정신장애는 보통 의미 있는 고통이나 장애(distress or disability)를 동반한다.","일탈 자체는 장애가 아니지만, 개인의 기능 이상에서 비롯되면 정신장애가 될 수 있다.","정의의 핵심 문장 그대로다(cognition, emotion regulation, behavior).","정의에 들어 있는 \"psychological, biological, developmental processes의 기능 이상\"이다."],"ai":"","fl":{}},{"k":"psy-intro-02","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 조현병과 자폐 진단명에 \"스펙트럼(spectrum)\"이라는 말을 붙인 이유로 가장 알맞은 것은?","choices":["같은 범주 안에서도 양상과 정도가 다양하게 나타나기 때문","약물 반응이 모든 환자에게 같기 때문","원인 유전자가 하나로 밝혀졌기 때문","진단에 뇌영상 검사가 필수가 되었기 때문","소아에게만 진단하도록 범위를 좁히기 위해"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"교수님 설명: 빛이 파장에 따라 여러 색으로 나뉘듯, 하나의 영역 안에서도 다양한 양상과 정도 차이를 보이므로 \"스펙트럼\"을 붙였다. 조현병도 DSM-5에 와서야 \"조현 스펙트럼 및 기타 정신병적 장애\"가 되었다.","exps":["정답.","약물 반응은 개인차가 크다.","원인 유전자가 하나로 밝혀진 정신장애는 없다(조현병도 polygenic).","정신과 진단은 여전히 기술적(descriptive) 진단 기준에 따른다.","연령 제한과는 관계없다."],"ai":"","fl":{}},{"k":"psy-intro-03","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 6쪽(목차) · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 분류에서 \"강박 및 관련 장애(Obsessive-Compulsive and Related Disorders)\"에 속하지 않는 것은?","choices":["선택적 함구증","발모광(trichotillomania)","피부뜯기장애(excoriation)","신체이형장애","저장장애"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"DSM-5에서 강박장애는 불안장애에서 분리되어 강박 및 관련 장애로 묶였고, 신체이형장애·저장장애·발모광·피부뜯기장애가 함께 들어간다. 선택적 함구증은 분리불안장애와 함께 불안장애에 속한다.","exps":["정답. 불안 때문에 밖에서 말을 하지 않는 것으로, 불안장애에 속한다.","머리카락 뽑기 → 강박 관련 장애.","상처·피부 뜯기 → 강박 관련 장애.","외모 결함에 대한 집착 → 강박 관련 장애(교수님: 선풍기 아줌마·성형 중독 예).","버리지 못하는 장애 → 강박 관련 장애(신문지를 쌓아 둔 선배 의사 예)."],"ai":"","fl":{}},{"k":"psy-intro-04","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시 · 강의록 「정신장애 소개」 6쪽","year":"","type":"객","rep":1,"repyears":"","stem":"7세 아이가 집에서는 가족과 말을 잘하는데 학교에만 가면 몇 달째 한마디도 하지 않는다. 청력·언어 발달은 정상이다. 교수님 설명에 따르면 이 증상의 바탕이 되는 것은?","choices":["사회적 상황에서의 불안","반항과 적대감","사고의 와해","환청에 대한 반응","지적 능력 저하"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"선택적 함구증(selective mutism): 집에서는 말을 잘하는 아이가 학교 등 밖에서는 입을 닫는다. 밖에서 사람을 상대할 때의 불안 때문이라고 보며, DSM-5에서 불안장애로 분류한다.","exps":["정답.","반항성 장애와 다르다. 말을 \"못 하는\" 불안 상태다.","와해된 사고는 정신병적 증상이며 장소에 따라 선택적으로 나타나지 않는다.","정신병적 증상의 근거가 없다.","언어 발달이 정상이고 집에서는 말을 잘한다."],"ai":"","fl":{}},{"k":"psy-intro-05","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"교통사고로 생명의 위협을 겪은 뒤 악몽·재경험·회피 증상이 나타났다. 증상이 시작된 지 2주가 지났을 때 붙일 수 있는 진단으로 교수님이 설명한 것은?","choices":["적응장애","해리성 정체성 장애","외상후 스트레스 장애","범불안장애","급성 스트레스 장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님 설명: 트라우마(생명을 위협하는 수준의 스트레스) 뒤 증상이 시작된 지 한 달 미만이면 급성 스트레스 장애, 한 달이 넘어가면 PTSD.","exps":["적응장애는 생명을 위협하는 외상이 아닌 일반 스트레스 요인에 대한 반응이다.","정체성 변화가 없다.","한 달이 넘어야 PTSD로 본다.","외상 사건과 관련된 재경험·회피가 핵심이다.","정답. 한 달 미만이다."],"ai":"","fl":{}},{"k":"psy-intro-06","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시 · 강의록 「정신장애 소개」 7쪽","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 해리성 장애를 설명하면서 \"가장 많은 형태\"라고 한 것은?","choices":["전환장애","해리성 기억상실","꾀병","이인증/비현실감 장애","해리성 정체성 장애(다중인격)"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"해리성 장애는 기억이나 정체성이 왔다 갔다 하는 장애로, 일반인이 가장 많이 아는 것은 다중인격이지만 가장 많은 형태는 해리성 기억상실(특정 기억을 기억해 내지 못함)이라고 설명했다. 다중인격은 가장 심각한 형태.","exps":["전환장애는 신체증상 및 관련 장애에 속한다.","정답.","꾀병은 정신장애 진단이 아니다.","해리성 장애에 속하지만 교수님이 가장 흔하다고 한 것은 아니다.","가장 잘 알려졌고 가장 심각한 형태이지 가장 흔한 형태는 아니다."],"ai":"","fl":{}},{"k":"psy-intro-07","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"신경증(neurosis)과 인격장애를 비유한 교수님 설명으로 옳은 것은?","choices":["신경증은 \"구멍 난 스타킹\", 인격장애는 \"신발 속 돌멩이\"","신경증은 \"신발 속 돌멩이\", 인격장애는 \"구멍 난 스타킹\"","신경증은 남에게 피해를 주고, 인격장애는 본인만 괴롭다","둘 다 \"구멍 난 스타킹\"처럼 주변만 괴롭다","둘 다 \"신발 속 돌멩이\"처럼 본인만 괴롭다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"신경증(가벼운 불안장애 등)은 남에게는 보이지 않지만 본인이 괴로운 \"신발 속 돌멩이\", 인격장애는 본인은 불편함을 모르는데 주변 사람이 괴로운 \"구멍 난 스타킹\". 인격장애는 특정한 행동 패턴이 반복되는 것(예: 편집성 – 계속 의심).","exps":["반대로 짝지었다.","정답.","반대로 설명했다.","신경증은 본인이 괴롭다.","인격장애는 본인이 불편함을 잘 모른다."],"ai":"","fl":{}},{"k":"psy-intro-08","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 8·34쪽 · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 인격장애 군집 중 Cluster A(odd/eccentric)에 속하는 것으로만 묶인 것은?","choices":["편집성 · 조현성 · 조현형","회피성 · 의존성 · 강박성","반사회성 · 경계성 · 연극성","편집성 · 경계성 · 회피성","조현형 · 자기애성 · 의존성"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 34쪽 표: A군(odd/eccentric) 편집성(suspicious)·조현성(socially indifferent)·조현형(eccentric) / B군(erratic/impulsive) 반사회성·경계성(unstable)·연극성(attention seeking)·자기애성(self-centered) / C군(anxious/fearful) 회피성(inhibited)·의존성(submissive)·강박성(perfectionistic). 교수님: A군은 의심하거나 조현병과 관련된다는 의미의 인격장애.","exps":["정답.","C군이다.","B군이다.","세 군집이 섞였다.","세 군집이 섞였다."],"ai":"","fl":{}},{"k":"psy-intro-09","area":"탈야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 34쪽","year":"","type":"객","rep":1,"repyears":"","stem":"인격장애 유형과 그 구별 특징(discriminating feature)의 연결이 옳지 않은 것은?","choices":["의존성 – 완벽주의(perfectionistic)","연극성 – 관심 끌기(attention seeking)","조현성 – 사회적 무관심(socially indifferent)","회피성 – 억제(inhibited)","편집성 – 의심(suspicious)"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 34쪽 표 기준. 의존성은 순종(submissive), 완벽주의는 강박성 인격장애의 특징이다.","exps":["정답. 의존성은 submissive, 완벽주의는 강박성(OCPD).","옳다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-intro-10","area":"탈야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 8쪽 · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 목차에서 반사회성 인격장애가 인격장애 외에 함께 실려 있는 진단 범주는?","choices":["조현 스펙트럼 및 기타 정신병적 장애","외상 및 스트레스 관련 장애","해리장애","신경발달장애","파탄적·충동조절 및 품행 장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 8쪽 목차: Disruptive, Impulse-Control, and Conduct Disorders 안에 적대적 반항장애·간헐적 폭발장애·품행장애·반사회성 인격장애·방화광·병적 도벽이 있고, 반사회성 인격장애는 Cluster B 인격장애에도 들어 있다. 교수님: \"반사회성 인격장애는 여기도 들어요.\"","exps":["해당 없다.","해당 없다.","해당 없다.","해당 없다.","정답."],"ai":"","fl":{}},{"k":"psy-intro-11","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신과 진단의 특징에 대한 교수님 설명으로 가장 알맞은 것은?","choices":["원인 병원체를 찾아 그에 따라 진단명을 붙인다","혈액검사 수치를 기준으로 진단을 확정한다","심리검사 결과를 의사의 평가보다 우선한다","한 번의 면담 결과는 시간이 지나도 유지된다","환자 상태를 관찰·기술해 진단 기준에 맞춰 본다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"정신과 진단은 기계로 재는 것이 아니라, 진단 기준(예: ADHD는 9가지 중 6개 이상)을 만들어 두고 환자 상태를 잘 관찰·기술해 맞는지 본다. 심리검사는 보조 수단이며 시점·컨디션에 따라 달라진다.","exps":["원인이 아닌 기술(description)에 따른 진단이다.","고혈압·당뇨처럼 기계로 재는 진단과 다르다고 했다.","\"주객이 전도\"된 것이라며 심리검사는 보조라고 강조했다.","심리검사·상태는 시점에 따라 달라진다.","정답."],"ai":"","fl":{}},{"k":"psy-intro-12","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 \"치료하지 않으면 약 20%가 사망할 수 있는 심각한 상태\"라고 강조한 장애는?","choices":["신경성 폭식증","반추장애(되새김)","이식증(pica)","신경성 식욕부진증","폭식장애(binge eating)"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"거식증(신경성 식욕부진증): 계속 살이 쪘다고 생각하고 살찌면 불안해 체중을 줄이는 장애. 치료하지 않으면 20%가 사망할 수 있고(심장·감염), 간접적 자살 행위로 볼 수 있다고 했다. 부모가 치료를 거부하면 의료적 방임에 해당할 수 있다.","exps":["폭식 후 보상행동이 핵심이다.","음식을 되새김하는 장애.","먹을 수 없는 것을 먹는 장애(아이들이 아무거나 집어먹는 것).","정답.","보상행동 없는 폭식이다."],"ai":"","fl":{}},{"k":"psy-intro-13","area":"탈야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 5쪽 · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 목차에서 우울장애(Depressive Disorders) 범주에 새로 들어간 소아 대상 진단은?","choices":["주의력결핍 과잉행동장애","반응성 애착장애","분리불안장애","적대적 반항장애","파탄적 기분조절곤란장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 5쪽 목차와 STT: 소아의 감정 조절 문제로 DMDD가 우울장애 안에 새로 추가되었다.","exps":["신경발달장애에 속한다.","외상 및 스트레스 관련 장애에 속한다.","불안장애에 속한다.","파탄적·충동조절 및 품행 장애에 속한다.","정답."],"ai":"","fl":{}},{"k":"psy-intro-14","area":"탈야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 8쪽 · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"과거 \"성 정체성 장애(gender identity disorder)\"로 부르던 진단의 DSM-5 명칭은?","choices":["성 불편감","변태성욕장애","성 정체감 혼란증","신체이형장애","성기능부전"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"장애라고 부르면 안 된다는 관점에서, 타고난 성과 경험하는 성의 불일치에서 오는 불편감을 뜻하는 성 불편감(gender dysphoria)으로 바뀌었다.","exps":["정답.","해당 없다.","공식 진단명이 아니다.","외모 결함에 대한 집착이다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-iv-01","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 \"여전히 정신과 진단에서 가장 중요하다\"고 강조한 것과 그 이유가 바르게 짝지어진 것은?","choices":["뇌파 – 불안장애를 감별할 수 있어서","진찰·면담 평가 – 진단을 내릴 표준 검사법이 없어서","뇌 MRI – 조현병을 확진할 수 있어서","혈액검사 – 우울증 표지자가 확립되어서","심리검사 – 법원이 가장 신뢰해서"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"정신과는 진단을 내리는 표준 검사법이 현재 없으므로 진찰·면담 평가가 가장 중요하다. 피검사(특히 갑상선 검사) 등은 신체·기질적 원인을 배제하기 위한 것이지 정신과 진단을 내리기 위한 것이 아니다.","exps":["확진 검사가 아니다.","정답.","MRI 소견은 진단적이지 않다.","갑상선 검사 등은 배제 목적이다.","심리검사는 보조 수단이다."],"ai":"","fl":{}},{"k":"psy-iv-02","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 2·15쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"공격적일 위험이 있는 환자를 면담할 때 진찰실 배치로 옳은 것은?","choices":["의사는 환자보다 높은 의자에 앉아 권위를 보인다","출입문을 열어 두고 의사가 출입문 쪽에 앉는다","환자를 출입문 쪽에 앉혀 언제든 나갈 수 있게 한다","의사와 환자 사이에 큰 책상을 두어 거리를 둔다","단둘이 조용한 방에서 문을 닫고 면담한다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 위험한 환자 면담 배치 \"굉장히 중요\"\n\n강의록 2쪽·STT: 같은 높이 의자, 사이에 가구가 없는 편이 낫다. 위험한 환자는 출입문을 열어 놓고 의사가 출입문 쪽에 앉으며 도와줄 사람을 대기시킨다. 교수님은 실제 사건 뒤 진찰실 사이에 문이 생긴 일을 예로 들며 \"별거 아닌 것 같지만 굉장히 중요하다\"고 했다.","exps":["같은 높이 의자가 원칙이다.","정답.","의사의 대피로가 막힌다.","일반 면담에서는 가구가 없는 편이 낫다.","단독 면담은 안 되고 문을 열어 둔다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-03","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 2–3쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"첫 면담에서 질문하는 순서에 대한 설명으로 가장 알맞은 것은?","choices":["환자가 말을 시작하면 바로 끊고 핵심만 묻는다","가족 정보부터 들은 뒤 환자에게는 확인만 한다","거북한 주제는 환자가 먼저 꺼낼 때까지 묻지 않는다","처음부터 진단 기준 항목을 하나씩 폐쇄형으로 묻는다","처음에는 포괄적(개방형) 질문을 하고 점차 구체적 질문으로 들어간다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 포괄적 질문 → 적극적·지시적 질문, \"순서 중요\"\n\n처음은 포괄적 질문(open-ended)으로 시작해야 환자가 가장 중요하게 여기는 문제가 드러나고, 예민한 환자에게 공격적으로 느껴지지 않는다. 정보 제공이 잘 안 되면 적극적·지시적으로 묻는다. 교수님: \"케이스마다 다르지만 순서는 변하지 않는다.\"","exps":["3–4분은 혼자 이야기하게 허용한다.","환자 면담이 중심이다.","거북한 주제도 반드시 다뤄야 한다.","폐쇄형만 쓰면 심문처럼 느껴지고 중요한 문제를 놓칠 수 있다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-04","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"매우 불안하고 혼란스러우며 초조한 환자를 면담할 때 교수님이 권한 질문 방식은?","choices":["침묵을 오래 유지하며 기다리기","추상적 사고를 묻는 속담 질문","가족 없이 다른 날 다시 면담","구체적이면서 간단하고 직접적인 질문","길고 포괄적인 개방형 질문"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"불안·혼란·초조가 심하면 포괄적 질문이 오히려 환자를 힘들게 한다. 구체적이고 간단하며 직접적인 질문을 받으면 정신을 차리고 대답할 수 있다(보호병동이 오히려 편한 환자가 있는 것과 같은 원리).","exps":["혼란을 키울 수 있다.","상황에 맞지 않다.","면담 방식의 문제다.","정답.","이 상태에서는 오히려 부담이 된다."],"ai":"","fl":{}},{"k":"psy-iv-05","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 3쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"면담 초반 환자가 3–4분 동안 혼자 이야기하도록 허용하는 주된 목적은?","choices":["면담 시간을 줄이기 위해","정보 제공자 면담을 대신하기 위해","진단명을 빨리 알려 주기 위해","사고 진행의 논리성을 확인하기 위해","환자의 기억력을 검사하기 위해"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 3–4분 혼자 이야기하게 두면 진단이 저절로 서기도 함\n\n강의록 3쪽: \"3–4분 혼자 이야기할 수 있도록 허용: 사고진행의 논리성 확인.\" 교수님: 끼어들고 싶어도 참고 따라가면 진단이 저절로 되는 경우도 있다(말의 속도·연속성·논리성 평가).","exps":["목적이 아니다.","정보 제공자 면담은 별도로 중요하다.","목적이 아니다.","정답.","기억력 검사는 따로 한다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-06","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 3·15쪽 · STT 10/13 3교시 · STT 10/13 병식·다축진단·치료계획","year":"","type":"객","rep":1,"repyears":"","stem":"면담에서 \"거북한 주제\"에 대한 설명으로 옳지 않은 것은?","choices":["자살 생각은 환자를 자극할 수 있으므로 묻지 않는다","성적 문제, 술·약물, 환청, 자살을 다뤄야 한다","점진적으로 질문하는 것이 좋다","마약 사용을 물을 때는 비밀보장을 설명할 수 있다","환자가 기분 나빠하면 정확한 평가를 위해 필요하다고 설명한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 거북한 주제(성·마약·자살) \"굉장히 중요\", 자살은 직접 자세히 – 소홀하면 법적 책임\n\n자살은 직접적으로 자세히 물어야 한다. 평가하지 않고 넘어갔다가 환자가 자살하면 의사가 해야 할 의무를 소홀히 한 것으로 법적 문제(소송)까지 이어질 수 있다고 교수님이 실제 사례를 들어 강조했다.","exps":["정답. 반드시 자세히 물어야 한다.","옳다.","옳다(타이밍을 잘 잡는다).","옳다(유학 중 적응 문제 등에서 꼭 물어야 함).","옳다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-07","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: STT 10/13 병식·다축진단·치료계획","year":"","type":"객","rep":1,"repyears":"","stem":"자살 위험성 평가에서 가장 위험한 단계로 봐야 하는 것은?","choices":["힘들어서 잠시 벗어나고 싶다는 생각","죽으면 편하겠다는 막연한 생각","구체적인 방법과 날짜를 생각하고 관련 사이트를 찾아봄","잠들 때 가장 편하다는 말","한 번 떠올랐다가 \"이건 아니지\" 하고 넘긴 생각"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 자살은 계획의 구체성·입원 필요 여부까지 평가\n\n자살 생각도 레벨이 다르다. 가장 약한 것은 힘드니까 벗어나고 싶은 것이고, 가장 심각한 것은 구체적 방법·날짜를 생각하거나 자살 사이트를 계속 찾아보는 등 구체적 행위·생각이 있는 경우다. 이 정도면 입원을 권해야 한다.","exps":["가장 약한 단계다.","구체성이 없다.","정답.","상징적 의미의 표현이다.","스쳐 지나간 생각이다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-08","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 4쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"정보 제공자(가족 등)와의 면담이 특히 중요한 경우는?","choices":["환자가 20세 이상의 성인일 때","환자가 처음 정신과에 내원했을 때에만","환자가 병식이 있고 매우 협조적일 때","환자가 병식이 없거나 증상을 숨기려 할 때","신체검사와 혈액검사가 모두 정상일 때"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 정보제공자 면담이 반드시 필요한 경우, 망상 환자는 본인 말만 들으면 속는다\n\n병식이 없거나 증상을 숨길 때, 또 환자의 성격 파악에 유용하다. 교수님 예: 의처증(망상장애) 환자 본인의 이야기와 피해를 받는 부인의 이야기는 너무 다르다.","exps":["관계없다.","초진에만 한정되지 않는다.","상대적으로 덜 필요하다.","정답.","관계없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-09","area":"탈야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 강의록 「정신의학적 관찰」 4쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"최초 면담 시간에 대한 설명으로 옳은 것은?","choices":["정확한 평가를 위해 항상 3시간 이상 한다","보통 5–10분 정도면 충분하다","정신증이 심한 환자일수록 더 길게 한다","가족 면담까지 포함해 최소 2시간 이상 한다","보통 30분–1시간, 정신증·신체질병이 있으면 짧게"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4쪽: 최초 면담은 30분–1시간 정도, 정신증이나 신체질병이 있는 경우는 짧게. 교수님: 1시간도 한 사람의 20년 인생을 듣기에는 많은 시간이 아니다.","exps":["과하다.","짧다.","반대다.","해당 없다.","정답."],"ai":"","fl":{}},{"k":"psy-iv-10","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 강의록 「정신의학적 관찰」 5쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"현병력을 조사할 때 의사가 반드시 \"pinpoint\"해야 한다고 강조한 것은?","choices":["가족이 처음 병원을 권한 날","증상이 진단 기준을 충족한 시점","처음으로 약을 복용한 날","환자가 처음 불편감을 느낀 날","증상이 가장 심했던 날"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"역치하(subthreshold) 증상과 임상적으로 문제가 되는 증상은 환자 본인에게는 구분이 안 된다. 의사가 언제부터 진단 기준을 충족하는 정도가 되었는지 정확히 짚어야 진단할 수 있다(강의록 5쪽: 첫 증상, 진단기준 충족 시점).","exps":["시점 판단 기준이 아니다.","정답.","해당 없다.","역치하 증상까지 포함될 수 있다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-iv-11","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"처음에는 스트레스를 받을 때만 증상이 생기다가, 악화·호전을 반복하면서 점점 작은 스트레스에도, 나중에는 뚜렷한 유발 요인 없이도 증상이 생기는 현상을 교수님은 무엇이라고 설명했나?","choices":["전이(transference)","내성(tolerance)","점화(kindling)","퇴행(regression)","조건화(conditioning)"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"킨들링(감  10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"30세 남자가 \"요즘 집중이 안 된다\"며 성인 ADHD 약을 처방해 달라고 왔다. 개인력에서 반드시 확인해야 하는 것은?","choices":["어린 시절에도 ADHD 증상이 있었는지","가족 중 의사가 있는지","하루 카페인 섭취량만","현재 하루 근무 시간과 업무량","최근 일주일 수면 시간만"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"어릴 때 ADHD가 없었다면 성인 ADHD가 아니다. 성인이 집중이 안 되는 이유는 우울·불안·강박·공부하기 싫음 등 10가지가 넘는다. 강의록 7쪽: 중기 아동기(3–11세)에 충동성·인지발달·학습장애 등을 본다.","exps":["정답.","해당 없다.","일부일 뿐이다.","핵심이 아니다.","일부일 뿐이다."],"ai":"","fl":{}},{"k":"psy-iv-16","area":"탈야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 강의록 「정신의학적 관찰」 7–8쪽","year":"","type":"객","rep":1,"repyears":"","stem":"개인력 조사에서 초기 아동기(3세까지)에 확인하는 항목이 아닌 것은?","choices":["안정적 양육 여부","군대 생활","수유 및 배변 훈련","낯가림·이별불안","head banging, body rocking"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7쪽: 초기 아동기 – 안정적 양육, 수유·배변 훈련, head banging·body rocking, 낯가림·이별불안, 놀이에서 능동 vs 수동. 군대 생활은 성인기 항목.","exps":["옳다.","정답. 성인기 항목이다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-iv-17","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 치료 경과가 좋지 않다고 본 환자의 특징은?","choices":["지지해 주는 가족이 있는 사람","면담에서 질문을 많이 하는 사람","불편해도 친구를 만나고 놀러 가는 사람","오랫동안 사회적으로 단절되어 혼자 지내는 사람","스스로 병원에 온 사람"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"정신과 증상의 중요한 기전 중 하나가 단절이다. 불편해도 친구를 만나고 놀러 가는 사람은 치료가 잘 되고, 오랫동안 단절된 사람일수록 치료가 잘 안 된다.","exps":["회복이 좋다.","해당 없다.","예후가 좋은 쪽이다.","정답.","면담이 비교적 원활하다."],"ai":"","fl":{}},{"k":"psy-iv-18","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 강의록 「정신의학적 관찰」 9쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신상태검사(MSE)에 대한 설명으로 옳은 것은?","choices":["한 번 기록하면 이후에는 바뀌지 않는다","환자가 직접 작성하는 표준화된 설문지다","가족 면담 내용만을 근거로 작성한다","면담 중 관찰한 현재 상태를 기술하며 며칠 새 바뀔 수 있다","과거 병력을 시간 순으로 정리한 기록이다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 9쪽: 증상과 징후를 체계적으로 평가하는 것. 병력과 비슷할 수 있으나 며칠 사이 바뀔 수 있으므로 현재 상태를 평가하고, 면담 중 관찰된 것을 기술한다(외모·태도·행동, 기분 교수님이 \"첫째도 중요하지만 더 중요하다\"고 한 것은?","choices":["보험료와 수가 산정","정신장애의 원인 규명","법원 제출용 진단서 작성","전문가 간 통일된 의사소통","위험 환자의 분류와 격리"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): 교수님이 느끼기에 더 중요한 것은 전문가들의 상호 효율적인 의견 교환 (Y)\n\n궁극적 목적은 원인을 밝히고 치료법을 개발하는 것이지만 현재는 미약하다. 교수님은 전문가들이 통일된 기준으로 의사소통·토론할 수 있게 하는 것이 더 중요하다고 봤다.","exps":["해당 없다.","궁극적 목적이지만 현재 미약하다.","해당 없다.","정답.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-03","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 5쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"현재 정신과 진단분류의 특징으로 옳지 않은 것은?","choices":["진단은 강제치료 결정 시 중요하다","확립된 생물학적 검사로 원인별 분류를 한다","검사보다 병력 청취와 정신상태검사에 의존한다","원인이 아니라 증상에 따라 분류한다","환자뿐 아니라 가족·친구에게서도 정보를 얻어야 한다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 5쪽: 원인이 아니라 증상에 따라 분류, 검사보다 병력 청취·정신상태검사에 의존(interview skill 중요), 주변 정보, 생활의 어려움에서 오는 경우가 많음, 강제치료 결정 시 중요.","exps":["옳다.","정답. 확립된 검사법이 없다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-cl-04","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 6·12쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"차원적(dimensional) 분류와 범주적(categorical) 분류에 대한 설명으로 옳은 것은?","choices":["일반 의학(폐렴·결핵)의 진단은 주로 차원적이다","현재 DSM·ICD는 두 방식이 섞여 있으나 범주적 성격이 더 강하다","정신치료 관점에서는 범주적 분류가 더 유용하다","DSM-IV는 차원적 분류를 전혀 도입하지 않았다","범주적 분류는 건강과 질병을 정도의 차이로 본다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): 차원적·범주적 분류 – 학생 지목 질문, 시험 빈출\n\n범주적: 병이 있는 사람과 없는 사람이 확연히 구분(폐렴·결핵). 차원적: 건강 상태와 정도의 차이. 현재 DSM·ICD는 혼합이나 범주가 더 강하다. 교수님은 원인이 밝혀지지 않았고 누구나 우울·불안할 수 있으므로, 사람을 이해하고 정신치료하는 데는 차원적 관점이 더 맞다고 강조했다. DSM-IV는 bipolar II로 차원적 진단을 일부 도입.","exps":["범주적이다.","정답.","차원적 관점이 더 맞다고 했다.","bipolar II로 일부 도입했다.","그것은 차원적 분류다."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-05","area":"탈야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 7쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"경과를 중요하게 여겨 최초의 현대적 기술적 분류를 만든 사람은?","choices":["Plato","Eugen Bleuler","Hippocrates","Emil Kraepelin","Kurt Schneider"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7쪽: Kraepelin – 최초의 현대적인 기술적 분류(경과를 중요시). Hippocrates는 mania·melancholia·hysteria·phrenitis를 기술, Plato는 신으로부터 받은 것과 신체적인 것으로 나눴다.","exps":["관념적 합리론.","증상을 강조했다.","관찰적 경험론으로 증상을 기술했다.","정답.","1급 증상을 제시했다."],"ai":"","fl":{}},{"k":"psy-cl-06","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 8쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM 다축체계에서 신체질환이 정신증상의 원인인 경우 기록 방법으로 옳은 것은?","choices":["I축에만 기록","V축에 GAF로만 기록","IV축에만 기록","II축과 III축에 기록","I축과 III축에 동시에 기록"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): DSM 각 축의 내용은 고대 야마 빈출\n\n강의록 8쪽: 축 III – 정신장애를 이해하거나 치료하는 데 연관된 일반 의학적 상태(신체질환이 원인인 경우 축 I & III에 동시에 기록). 교수님: 신체질환이 원인이면 III축이 제일 중요하다.","exps":["III축도 기록한다.","V축은 전반적 기능이다.","IV축은 정신사회적·환경적 문제다.","II축은 인격장애·정신지체다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-07","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 8쪽 · STT 10/13 4교시 · STT 10/13 병식·다축진단","year":"","type":"객","rep":1,"repyears":"","stem":"GAF(Global Assessment of Functioning)에 대한 설명으로 옳은 것은?","choices":["인격장애가 있는지를 판정하는 척도다","점수가 높을수록 증상이 심하다는 뜻이다","환자가 스스로 매기는 0–10점 척도다","최근 1년간 스트레스 요인의 개수다","의사가 매기는 0–100점이며 높을수록 기능이 좋다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): DSM 각 축의 내용은 고대 야마 빈출\n\n축 V(GAF 0–100점): 특정 기간 동안 환자의 전반적인 기능(심리적·사회적·직업적)을 의사가 판단. 기능이 좋을수록 높다. 예: 불안하지만 직장·학교는 잘 다니는지.","exps":["II축이다.","반대다.","의사가 판단하고 0–100점이다.","IV축 내용과 관련된다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-08","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 9쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"진단명에 붙는 NOS(not otherwise specified)의 의미는?","choices":["어느 특정 진단에도 딱 맞지 않을 때 붙인다","원인이 밝혀진 장애에 붙인다","여러 진단 중 주진단을 뜻한다","과거에 있었던 병력을 뜻한다","정보가 부족한 잠정 진단을 뜻한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 9쪽: 달리 분류되지 않는 범주(NOS) – 증상이 특정 진단의 역치 이하이거나 비전형적·혼합 양상. 교수님: A도 B도 아닌 것 같아 애매할 때 붙인다.","exps":["정답.","해당 없다.","해당 없다.","prior history다.","provisional diagnosis다."],"ai":"","fl":{}},{"k":"psy-cl-09","area":"탈야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 10쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"ICD-10에 대한 설명으로 옳은 것은?","choices":["ICD-10 범주는 모두 DSM-IV에 있다","신경증 관련 용어를 전혀 쓰지 않는다","다축 체계가 없다","미국정신의학회가 만들었다","축은 임상진단·후유장애·상황적 요인의 3개다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 10쪽: ICD-10도 다축 체계(축 I 임상진단, II 후유장애, III 상황적 요인)이며 조작적 진단기준. 신경증·정신증 구분은 없앴으나 신경증적, 급성 일과성 정신병적 장애 등의 용어는 사용. DSM-IV 범주는 모두 ICD-10에 있지만 반대는 아니다(ICD가 더 광범위). ICD는 WHO.","exps":["반대다.","용어는 사용한다.","다축 체계다.","WHO다.","정답."],"ai":"","fl":{}},{"k":"psy-cl-10","area":"탈야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 11–12쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM의 발달 과정에 대한 설명으로 옳지 않은 것은?","choices":["DSM-III(1980)에서 세밀한 조작적 정의와 다축 체계를 처음 도입했다","DSM-IV에서 조현병 활성기 증상 기간을 1개월에서 1주로 줄였다","DSM-IV에서 신경증이라는 용어가 사라졌다","DSM-I은 1952년에 나왔다","DSM-IV(1994)에서 기질성/기능성 이분법이 사라졌다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 11–12쪽: DSM-IV에서 조현병 활성기 증상 기간은 1주일에서 1개월로 늘었다. 또 brief reactive psychosis → brief psychotic disorder, bipolar II·급성 스트레스 장애 등 추가.","exps":["옳다.","정답. 1주일 → 1개월로 늘었다.","옳다(psychotic disorder라는 용어는 사용).","옳다(130쪽, 106개 장애).","옳다."],"ai":"","fl":{}},{"k":"psy-cl-11","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 13쪽 · STT 10/13 4교시 · 티야방(정소윤)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 새로 생긴 정식 진단이 아니라 제안되었다가 탈락한 것은?","choices":["파탄적 기분조절곤란장애","경도 신경인지장애","월경전 불쾌감 장애","인터넷 중독","저장장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 13쪽: 신설 – 파탄적 기분조절곤란장애, 경도(약한) 신경인지장애, 폭식장애·성인 ADHD·저장장애·월경전 불쾌감 장애·행동 중독. 탈락 – psychosis risk, mixed anxiety/depression, internet·sex addiction. 📌티야방: DSM-5 변화 슬라이드는 최근 시험 빈출이니 전부 읽어 보라.","exps":["신설.","신설(노화로 인한 건망증 → 경도 신경인지장애).","신설.","정답. 탈락했다.","신설."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-12","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 13쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 삭제되어 사별 후 애도 반응도 주요우울장애로 진단될 수 있게 된 조항은?","choices":["6개월 기간 조항","물질 유발 제외 조항","조현병 단일 증상 조항","사별 제외 조항","기분 일치성 조항"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): DSM-5 변화 슬라이드 최근 빈출 – 전부 읽어 보기\n\n사별로 인한 애도도 \"중증 우울증\"으로 진단받을 수 있도록 예외 조항이 삭제되었다. 교수님은 DSM이 미국 사립 보험 체계와 연결되어 있다는 우려 섞인 시각을 함께 설명했다.","exps":["해당 없다.","해당 없다.","조현병 기준 변화다.","정답.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-13","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 14쪽 · STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에 대한 비판으로 교수님이 설명한 것은?","choices":["보험 체계와 무관하다","과잉 진단과 과잉 투약","소아 진단이 빠져 있다","차원적 분류만 쓴다","진단 범주가 너무 적다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"부정적 측면: 과잉 진단·과잉 투약. DSM은 미국 사립 보험 시장과 맞물려 진단이 많을수록 환급이 많아지는 구조라는 비판. \"treat the person not the disease\", 보험 청구·제약사 FDA 승인에 필요할 뿐이라는 비판. 긍정적 측면: 통일된 의사소통, 예방적 개입 진단(MCI 등).","exps":["연결되어 있다고 비판한다.","정답.","해당 없다.","혼합이다.","반대다."],"ai":"","fl":{}},{"k":"psy-cl-14","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 15쪽 · STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"임상적으로 유의한 정신장애로 진단하기 위한 기준에 대한 설명으로 옳은 것은?","choices":["증상이 하나라도 있으면 곧바로 진단한다","고통이나 기능 장해가 있어야 임상적으로 유의하다","개인과 사회의 갈등 자체를 정신장애로 본다","본인이 고통을 느끼지 않으면 진단할 수 없다","역치하 증상도 빠짐없이 모두 진단한다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(전은채): [TY] 임상적 유의성은 고통(distress)이나 장해가 있을 때\n\n임상적 유의성은 고통이나 장해가 있을 때. 교수님 예: 조증 상태는 본인은 기분이 좋아 불편함이 없지만 사건·사고가 생기며 기능이 깨진다(impairment) → 진단 가능.","exps":["임상적 유의성이 필요하다.","정답.","개인과 사회의 갈등은 정신장애가 아니다.","조증처럼 고통 없이 기능 장해만 있어도 된다.","역치하 증상은 진단하지 않는다."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-15","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 15쪽 · STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"논문이나 기록에서 권장되는 표현은?","choices":["a person with schizophrenia","schizophrenic individual","the schizophrenics","a schizophrenic","schizophrenic person"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"질병은 그 개인 자체가 아니라 개인이 지닌 상태라는 철학적 개념: a person with schizophrenia. 영미권 논문 심사에서는 다른 표현을 쓰면 바로 지적한다고 했다.","exps":["정답.","피해야 한다.","피해야 한다.","피해야 한다.","피해야 한다."],"ai":"","fl":{}},{"k":"psy-cl-16","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 16쪽 · STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신증(psychosis)의 특징으로 옳지 않은 것은?","choices":["다른 장애에서도 일시적으로 보일 수 있음","성격의 일부만 관여","현실검정능력의 손상","망상·환청","병식이 없음"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(전은채): 정신증·신경증 구분 – 과거 출제\n\n강의록 16쪽: 정신증 – 현실 지각의 전반적 손상, 병식 없음, 망상·환청, 자아 기능 손상, 사회·직업 기능 저하, 성격 전체가 관여, 다른 장애에서도 일시적으로 보일 수 있음. 신경증 – 병식 있음, 성격 일부만 관여.","exps":["옳다.","정답. 성격의 \"전체\"가 관여한다.","옳다.","옳다.","옳다."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-17","area":"탈야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 16쪽 · STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"강의록에서 신경증적 장애의 예로 든 것이 아닌 것은?","choices":["기분부전장애","신체형장애","해리장애","조현병","불안장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(전은채): 정신증·신경증 구분 – 과거 출제\n\n강의록 16쪽: 신경증 – 불안장애, 신체형장애, 해리장애, 성장애, 기분부전장애. 조현병은 정신증(중증 정신질환, SMI)에 해당한다.","exps":["신경증.","신경증.","신경증.","정답. 정신증이다.","신경증."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-18","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신증 환자에게서 \"경계심 스위치\"가 너무 쉽게 켜진다는 교수님 설명과 연결되는 현상은?","choices":["사회 기능의 전반적 향상","병식 증가와 순응도 향상","기억력과 집중력 향상","감정 둔마의 빠른 회복","확증 편향과 현실감 저하"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"경계심은 필요할 때만 켜지면 자신을 보호하는 장치지만, 정신증 환자는 너무 쉽게·수시로 켜진다. 그래 밝혀진 것은 \"병\"이다.","구분해야 한다고 강조했다.","해당 없다.","정답.","장애는 회복 가능성을 담은 말이다."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz1-01","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: 강의록 「조현병 1」 2쪽 · STT 10/14 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"Emil Kraepelin이 조현병을 \"조발성 치매(dementia praecox)\"라고 부른 근거는?","choices":["1급 증상이 반드시 있어서","사고의 분리와 이완이 특징이어서","환각이 부수적 증상이어서","어린 나이에 발병하고 만성적이며 황폐화되는 경과를 보여서","모든 연령에서 발병하고 삽화 사이에 정상으로 회복되어서"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"Kraepelin은 경과에 주목했다: 어린 나이(20대)에 발병해 만성적으로 나빠져 치매 환자처럼 된다. 반면 조울병은 모든 연령에서 발병하고 삽화 사이에 거의 정상 기능으로 회복된다고 나눴다.","exps":["Schneider의 관점이다.","Bleuler의 관점이다.","Bleuler의 관점이다.","정답.","조울병의 특징이다."],"ai":"","fl":{}},{"k":"psy-sz1-02","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: 강의록 「조현병 1」 3쪽 · STT 10/14 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"Eugen Bleuler의 4A 증상에 해당하지 않는 것은?","choices":["연상 이완(associative loosening)","청각 환각(auditory hallucination)","양가감정(ambivalence)","자폐(autism)","정동 둔마(affective blunting)"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"Bleuler는 경과보다 특징 증상을 강조했고 4A(연상 이완, 양가감정, 자폐, 정동 둔마)를 핵심으로 봤다. 망상·환각은 이런 상태가 지속되며 생기는 부수적(이차적) 증상으로 봤다.","exps":["4A.","정답. 부수적 증상으로 봤다.","4A.","4A(자기 세계에 빠짐).","4A."],"ai":"","fl":{}},{"k":"psy-sz1-03","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: STT 10/14 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"Bleuler가 schizophrenia라는 이름에 담은 뜻에 대한 교수님 설명으로 가장 알맞은 것은?","choices":["뇌가 물리적으로 둘로 나뉜 병","인격이 여러 개로 나뉜 병","치매처럼 계속 진행하는 병","마음이 쪼개질 만큼 힘든 상태","유전으로만 생기는 병"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"schizo(분리되다) + phrenia(횡격막, 고대에 영혼·정신이 있다고 여긴 곳). 환자가 너무 힘들어 가장 중요한 마음이 쪼개질 정도라는, 환자를 인간적으로 이해하려는 마음을 담은 이름이다. 번역 과정에서 \"정신분열\"이 되며 낙인이 생겼다.","exps":["문자적 오해다.","해리성 정체성 장애와 혼동이다.","Kraepelin의 dementia praecox 개념이다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-sz1-04","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: 강의록 「조현병 ear":"","type":"객","rep":1,"repyears":"","stem":"조현병의 연성 신경학적 징후(soft neurological sign)가 아닌 것은?","choices":["편마비","위치지각(proprioception) 장애","SPEM 장애","입체감각인식불능(astereognosis)","피부글씨감각인식불능(agraphesthesia)"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 5쪽: astereognosis(손에 쥔 물건을 알아맞히지 못함), agraphesthesia(등·손에 쓴 글자 인식 장애), proprioception 장애, SPEM. 편마비는 국소 신경학적 징후로 연성 징후가 아니다.","exps":["정답.","연성 징후.","연성 징후.","연성 징후.","연성 징후."],"ai":"","fl":{}},{"k":"psy-sz2-11","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"📌티야방 · 근거: 강의록 「조현병 2」 6쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 조현병 진단 기준에 대한 설명으로 옳은 것은?","choices":["Schneider 1급 증상 하나면 충분하다","망상이 기괴하면 증상 1개만으로 진단한다","전체 지속 기간이 1개월 이상이면 된다","5개 영역 중 2개 이상이 한 달 중 상당 기간 있다","사회적·직업적 기능 저하는 필요 없다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤·정소윤): 지금은 2개 이상 필수, 1급 증상의 가치가 퇴색 (25Y)\n\n강의록 6쪽: 2개 이상이 한 달 중 상당 기간 + 사회적·직업적·대인관계 기능의 현저한 저하 + 위 두 가지가 6개월 이상. DSM-IV의 \"기괴한 망상이나 간섭·대화하는 환청이면 1개로 충분\" 조항은 DSM-5에서 없어져 1급 증상의 가치가 퇴색했다.","exps":["없어진 조항이다.","DSM-IV 조항으로 DSM-5에서 없어졌다.","6개월 이상이다.","정답.","기능 저하가 필요하다."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz2-12","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"📌티야방 · 근거: 강의록 「조현병 2」 6·10쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병 증상이 있으나 전체 기간이 3개월인 경우와 2주인 경우의 진단을 바르게 짝지은 것은?","choices":["단기 정신병적 장애 – 조현양상장애","조현병 – 조현양상장애","망상장애 – 조현병","조현정동장애 – 망상장애","조현양상장애 – 단기 정신병적 장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤): 단기 정신병적 장애는 1개월 이내 100% 회복\n\n강의록 6쪽: 1개월–6개월 schizophreniform, 1일–1개월 brief psychotic disorder. 단기 정신병적 장애는 한 달 안에 병전 기능 수준으로 완전히 회복된다.","exps":["반대다.","6개월이 안 된다.","해당 없다.","해당 없다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz2-13","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"📌티야방 · 근거: 강의록 「조현병 2」 7쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병 아형 중 가장 흔하고, 20–30대에 비교적 늦게 발병해 ,"질병불안장애","신체증상장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"수업 중 교수님 풀이: 공황장애처럼 피크가 있는 것도 아니고, 강박 생각이 있는 것도 아니며, 특정 질환(암 등)만 걱정하는 질병불안장애나 신체 증상이 주가 되는 신체증상장애와 달리 매사에 불안한 범불안장애. 걱정·불면·안절부절·집중력 저하·피로·근육 긴장이 범불안장애 동반 증상(6개 중 3개 이상)에 해당한다.","exps":["몇 분 안에 최고조에 이르는 공황발작이 없다.","강박사고·강박행동이 없다.","정답.","특정 질병에 대한 집착이 아니라 매사에 대한 걱정이다.","설명되지 않는 신체 증상이 주가 아니다."],"ai":"","fl":{}},{"k":"psy-ax-01","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 6쪽 · 교과서 12장(불안장애) 310쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"불안과 공포에 대한 설명으로 옳은 것은?","choices":["공포는 대상이 모호하고 내부적으로 경험된다","불안은 대상이 모호하고, 공포는 대상이 분명하다","둘은 정신의학적으로 같은 개념이다","공포는 자율신경 반응을 동반하지 않는다","불안은 대상·상황이 알려진 외부적인 것이다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6쪽·교과서 310쪽: 불안은 대상이 모호하고 내부적으로 경험, 공포는 대상 혹은 상황이 알려진 외부적인 것(예: 모서리 공포증 – 모서리만 보면 무서움). 둘 다 빈맥·진전 등 자율신경 반응을 동반한다.","exps":["반대다.","정답.","구분되는 개념이다.","자율신경 반응을 동반한다.","반대다."],"ai":"","fl":{}},{"k":"psy-ax-02","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 6쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"정상 불안과 병적 불안의 차이로 옳지 않은 것은?","choices":["정상 불안은 적응적 기능을 한다","병적 불안은 실제 위험 상황이 아닌데도 생긴다","병적 불안은 시험 공부를 미리 하게 하는 등 도움이 된다","병적 불안은 지나치게 심하고 비적응적 대처로 상황을 악화시킨다","정상 불안은 위험 상황에 대한 정상 반응이다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"시험 전에 불안해서 공부를 미리 하는 것은 정상 불안의 적응적 기능이다. 병적 불안은 실제 위험이 아님에도, 지나치게 심하고, 비적응적 대처로 오히려 불안을 악화시킨다.","exps":["옳다.","옳다.","정답. 정상 불안의 예다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-ax-03","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 6쪽 · 교과서 12장(불안장애) 310쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"불안장애 환자에게 알코올 등 물질사용장애가 흔히 동반되는 이유로 강의에서 설명한 것은?","choices":["불안장애 진단 기준에 음주가 있어서","예민함을 낮추려는 자가처방으로 마셔서","불안과 알코올 의존의 유전자가 같아서","알코올이 세로토닌 재흡수를 억제해서","항불안제가 알코올 갈망을 일으켜서"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"술을 마시면 마음이 편해지고 차분해지므로 너무 예민한 상태를 낮추려고  서서히 올리고 장기간 유지(교과서 310쪽: 치료 초기에는 오히려 불안을 악화시키는 경우도 있음).","exps":["해당 없다.","해당 없다.","해당 없다.","정답.","반대로 늦다."],"ai":"","fl":{}},{"k":"psy-ax-17","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"공황장애 환자가 \"나는 달리기를 하면 공황이 오는데 운동을 해야 하나요?\"라고 묻는다. 교수님이 권한 답은?","choices":["110% 이상 강하게 해서 한 번에 극복한다","운동은 공황을 유발하니 절대 하지 않는다","해야 하며, 80–90% 강도로 반복하다 점차 늘린다","약을 끊고 운동만으로 치료한다","공황이 올 때만 운동으로 해소한다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"운동은 해야 한다. 일반 운동요법은 약간 넘치게(110%) 하지만 공황장애 환자는 반대로 80–90%를 반복해 익숙해지면 점점 늘린다. 이는 두려운 신체 감각에 일부러 노출시키는 내수용 노출(interoceptive exposure)과 같은 원리.","exps":["오히려 악화될 수 있다.","회피가 공황을 유지시킨다.","정답.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-ax-18","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 17쪽 · 교과서 12장(불안장애) 317쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"공황장애 인지행동치료의 구성으로 옳지 않은 것은?","choices":["인지 재구조화","머리 돌리기·계단 오르기 같은 내수용 노출","지하철 두 정거장부터 시작하는 단계적 실제 노출","어린 시절 무의식적 갈등을 장기간 분석","공황에 대한 정신교육(\"죽지 않는다\")"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"공황장애 CBT: 정신교육, 인지 재구조화, 호흡 재훈련·이완, 내수용 노출, 상상 노출, 실제 노출(강의록 17쪽). 교수님: 공황장애는 처음부터 통찰 정신치료를 거의 하지 않는다. 마음의 근본 원인을 찾는 정신분석적 치료는 성격장애 등에 쓴다.","exps":["포함.","포함.","포함.","정답.","포함."],"ai":"","fl":{}},{"k":"psy-ax-19","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"같은 \"늦게 오는 학생\" 예에서 치료 방식이 바르게 짝지어진 것은?","choices":["\"늦어도 괜찮아\"라며 지각을 허용 – 정신분석 치료","부모와의 갈등 때문에 규제를 벗어나려는 마음의 원인을 찾음 – 정신분석 치료","\"빨리 오면 만 원, 늦으면 청소\" – 인지치료","\"빨리 오면 집중이 잘 되니 이익이야\"라고 생각을 바꿈 – 행동치료","\"힘들지? 잘하고 있어\" 격려 – 인지치료"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"인지치료는 생각을 바꾸고, 행동치료는 보상·처벌로 행동만 바꾸며, 정신분석 치료는 마음의 원인(무의식적 갈등)을 찾는다. 지지 정신치료는 힘든 것을 격려·지지한다. 불안장애에는 주로 단시간에 효과적인 CBT를 한다.","exps":["해당 없다.","정답.","행동치료다.","인지치료다.","지지 정신치료다."],"ai":"","fl":{}},{"k":"psy-ax-20","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 325쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"공황장애에서 광장공포증(agoraphobia)이 잘 동반되는 이유는?","choices":["넓은 광장이라는 공간 자체가 무서워서","사람들의 부정적 평가가 두려워서","발작 때 도움받거나 빠져나가기 어려울까 두려워서","높은 곳에서 떨어질까 무서워서","바깥 물건에 오염될까 두려워서"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"광장공포증은 광장 자체가 아니라 혼자서 도움을 받지 못하는 상황(대중교통, 공원, 줄 서기, 극장 가운데 자리 등)을 두려워하는 것. 공황발작이 오면 죽을 것 같은데 도움을 못 받을까 봐 피한다. DSM-5에서는 공황장애와 독립된 진단(dual diagnosis).","exps":["문자적 오해다.","사회불안장애다.","정답.","특정공포증(자연환경형)이다.","강박장애다."],"ai":"","fl":{}},{"k":"psy-ax-21","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 312·325쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 공황장애와 광장공포증의 관계로 옳은 것은?","choices":["광장공포증은 진단명에서 삭제되었다","두 진단은 독립적이며 둘 다 붙일 수 있다","공황장애가 있으면 광장공포증은 진단 불가다","광장공포증은 강박 관련 장애로 옮겨졌다","광장공포증은 공황장애의 아형이다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"DSM-III-R~IV에서는 \"광장공포증을 동반한/동반하지 않는 공황장애\"처럼 아형으로 다뤘으나, DSM-5에서는 광장공포증을 독립된 질병으로 분류해 dual diagnosis를 내린다.","exps":["독립 진단이다.","정답.","둘 다 진단한다.","불안장애다.","DSM-IV까지의 개념이다."],"ai":"","fl":{}},{"k":"psy-ax-22","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 311–312쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"공황장애의 역학에 대한 설명으로 옳은 것은?","choices":["유병률은 0.01% 미만으로 드물다","여자가 2–3배 많고 젊은 성인에 흔하다","남자가 여자보다 2–3배 많다","노인에서 가장 흔하게 발병한다","성별에 따른 차이가 없다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"교과서·교수님: 공황장애는 여자가 남자보다 2–3배 많고, 호발 연령은 젊은 성인. 평생 유병률 약 5%(교과서 311쪽). 위험 요인: 청장년 여성, 사회적 자원 결핍 등.","exps":["약 5%로 흔하다.","정답.","반대다.","젊은 성인이다.","여자가 많다."],"ai":"","fl":{}},{"k":"psy-ax-23","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 316쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"신체 감각(빈맥 등)을 위험 신호로 파국적으로 해석해 불안이 커지고, 그 불안이 다시 자율신경 각성을 일으키는 악순환을 설명한 이론은?","choices":["Freud의 무의식 갈등설","Kraepelin의 경과 이론","Clark의 파국적 해석 오류","Mowrer의 2요인 이론","Klein의 가성질식경보 가설"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"교과서 316쪽: Clark의 파국적 해석 오류는 양성 되먹이기 고리(positive feedback loop)를 활성화한다. 계단을 오를 때 생기는 빈맥을 공황 증상으로 오인해 불안해지고 실제 공황을 겪는다. 내수용 조건화(interoceptive conditioning)도 같은 맥락.","exps":["범불안장애의 정신분석 이론과 관련된다.","조현병 분류의 역사다.","정답.","고전적 조건화로 공포를 학습하고 회피로 유지된다는 두 단계 이론이다.","CO2에 대한 과민성으로 잘못된 질식 신호가 울린다는 가설이다."],"ai":"","fl":{}},{"k":"psy-ax-24","area":"탈야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 315쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"공황장애의 생물학적 가설 중 이산화탄소에 대한 비정상적 민감성으로 질식 감시기가 잘못된 신호를 보낸다는 것은?","choices":["Barlow의 통합 모델","Klein의 가성질식경보 가설","노르아드레날린 과민 가설","Clark의 파국적 해석 오류","신경회로 모델"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"교과서 315쪽: 산소가 부족하다는 잘못된 신호로 질식경고 시스템이 활성화되어 호흡곤란·과호흡 등 공황발작을 일으킨다. 이산화탄소·젖산나트륨·요힘빈·카페인 등은 공황유발인자(panicogen).","exps":["생물학적·심리적 취약성을 통합한 원인 모델이다.","정답.","청반의 노르아드레날린 과민성 이론이다.","신체 감각을 파국적으로 해석한다는 인지 이론이다.","감정생성·조절 영역의 연결성 이상을 말한다."],"ai":"","fl":{}},{"k":"psy-ax-25","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 교과서 12장(불안장애) 316쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"공황장애·불안장애의 신경회로 모델에서 공포조절회로의 핵심으로 교과서에 강조된 부위가 아닌 것은?","choices":["해마(hippocampus)","흑질(substantia nigra)","전대상피질(anterior cingulate cortex)","섬엽(insula)","편도(amygdala)"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"교과서 316쪽(TY): 불안장애에 공통적으로 편도·전대상피질·해마의 변화, 감정생성 부위(편도·섬엽)와 조절 영역(내측전전두피질)의 연결성 저하. 교수님: 편도처럼 공포 반응 중추가 너무 예민하다. 신경전달물질은 세로토닌·노르아드레날린(청반).","exps":["핵심.","정답. 조현병 도파민 경로와 관련된다.","핵심.","핵심.","핵심."],"ai":"","fl":{}},{"k":"psy-ax-26","area":"티야","prof":"양종철","sec":"10/14 · 불안장애","meta":"근거: 강의록 「1014 양종철pf」 19–20쪽 · STT 10/14 3–4교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"범불안장애의 DSM-5 진단 기준으로 옳은 것은?","choices":["과도한 걱정이 6개월 이상, 그렇지 않은 날보다 많음","특정 대상에 대한 공포가 6개월 이상","사회적 상황에서만 나타나는 불안","과도한 걱정이 최소 1개월 동안 매일","13개 중 4개 이상이 수 분 안에 최고조"],"ans":[1],"imgs":[],"vis":[],"notes":[],"ba  느낀다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교과서 340쪽: 강박사고는 반복적·자아비동조적(자기도 틀리다는 것을 앎)·침습적(갑자기 떠오름)이며, 말이 안 되고 불쾌한 것으로 경험된다.","exps":["불쾌하게 경험된다.","사고 주입(정신병적 증상)이다.","\"침습적\"의 뜻이다.","정답.","인격장애(ego-syntonic)의 특징이다."],"ai":"","fl":{}},{"k":"psy-oc-11","area":"티야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 교과서 13장(강박 및 관련 장애) 341쪽 · STT 10/14 강박장애 강의(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"강박장애의 성별 역학에 대한 설명으로 옳은 것은?","choices":["평생 남자가 더 많다","소아기엔 여자, 성인기엔 남자가 많다","성별에 따른 차이가 없다","평생 여자가 더 많다","소아기엔 남자, 성인기엔 여자가 많다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님: \"헷갈리게 하는 말\" – 소년기는 남자가 더 흔하지만 어른이 되면 여자가 더 흔하다. 중고등학생은 남학생이 더 많이 온다. 유병률은 약 2–3%.","exps":["연령에 따라 다르다.","반대다.","차이가 있다.","연령에 따라 다르다.","정답."],"ai":"","fl":{}},{"k":"psy-oc-12","area":"티야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 교과서 13장(강박 및 관련 장애) 342쪽 · STT 10/14 강박장애 강의(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"강박장애 환자의 절반 이상에서 관찰되는 가장 흔한 강박행동은?","choices":["확인과 반복 세척","정렬과 대칭 맞추기","고백하기와 묻기","머리카락 뽑기","숫자 세기와 수집"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"교과서 342쪽: 절반 이상에서 관찰되는 흔한 강박행동은 확인과 반복 세척. 강박사고 내용은 오염이 가장 흔하다. 세척·회피는 여성에서 흔하다.","exps":["정답.","있지만 가장 흔하지 않다.","있지만 가장 흔하지 않다.","발모광이다.","있지만 가장 흔하지 않다."],"ai":"","fl":{}},{"k":"psy-oc-13","area":"티야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 강의록 「1014 양종철pf」 35쪽 · 교과서 13장(강박 및 관련 장애) 343쪽 · STT 10/14 강박장애 강의(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"틱 관련(tic-related) 명시자가 붙는 강박장애의 특징으로 옳은 것은?","choices":["노년 여성에게 흔하고 예후가 좋다","SSRI 단독에 가장 잘 반응한다","저장장애와 같은 질환이다","병식이 항상 양호하다","일찍 발병하고 남자에 많으며 예후가 나쁘다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"틱 가족력이나 강박이 서로 공유될 때가 많고, 틱은 도파민과 관계되므로 도파민 관련성이 시사된다. 틱이 있으면 일찍 발병하고 예후가 안 좋다.","exps":["반대다.","도파민 관련이 시사되어 증강 요법을 쓴다.","해당 없다.","해당 없다.","정답."],"ai":"","fl":{}},{"k":"psy-oc-14","area":"티야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"📌티야방 · 근거: 강의록 「1014 양종철pf」 40쪽 · STT 10/14 강박장애 강의(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"강박장애의 SSRI 반응 특성에 대한 설명으로 옳지 않은 것은?","choices":["저용량으로 천천히 올려도 충분하다","더 높은 용량이 필요하다","세로토닌 선택성이 중요하다","부분 반응이 많다","반응이 늦게 나온다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): 강박장애는 우울증 치료보다 용량을 많이, 오래\n\n강의록 40쪽: serotonin selectivity, slower response, requirement of higher doses, partial responsiveness. 교수님: 공황장애는 저용량부터 서서히 올리지만, 강박장애는 처음부터 세게 써도 부작용이 잘 안 나오고 \"질겨서\" 많이 오래 써야 한다. 매년 물어보는 중요한 내용.","exps":["정답. 공황장애와 다르다.","옳다.","옳다.","옳다(절반은 잘 좋아지지 않음).","옳다."],"ai":"","fl":{"tyb":1}},{"k":"psy-oc-15","area":"티야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"📌티야방 · 근거: 교과서 13장(강박 및 관련 장애) 345쪽 · STT 10/14 강박장애 강의(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"SSRI에 충분히 반응하지 않는 강박장애에서 증강 요법으로 쓰는 약과 그 근거가 바르게 짝지어진 것은?","choices":["리튬 – 조증 예방","벤조디아제핀 – GABA 결핍","베타차단제 – 교감신경 억제","비정형 항정신병약물 – 도파민 관여","부스피론 – 5-HT1A 작용"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): 틱장애·망상 동반 시 도파민 차단제(risperidone, olanzapine 등)\n\n세로토닌 제제만으로 잘 좋아지지 않아 항정신병약물(도파민 차단)을 함께 써 보니 좋아졌고, 이를 근거로 강박장애에 도파민도 관여한다고 본다. SSRI 이전에는 clomipramine(삼환계, 부작용은 많지만 세다)을 썼다.","exps":["해당 없다.","장기간 권장되지 않는다.","해당 없다.","정답.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-oc-16","area":"티야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"📌티야방 · 근거: 강의록 「1014 양종철pf」 39쪽 · STT 10/14 강박장애 강의(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"손이 더럽다는 강박이 있는 환자에게 걸레를 5분간 만지게 한 뒤 손을 씻지 못하게 하는 치료는?","choices":["사고 정지","혐오 기법","노출 및 반응 방지","체계적 탈감작","습관 역전"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이종은): 행동치료 ERP – 노출 후 문제 행동을 못 하게 함\n\nERP(exposure and response prevention): 걸레를 만지는 것이 exposure, 손을 못 씻게 하는 것이 response prevention. 강박장애 행동치료의 가장 대표적 방법. 교수님: 잠깐 하다 말면 다시 생기므로 강도 높게 오랫동안 집중적으로 해야 한다(수박씨 세기 예).","exps":["다른 기법이다.","다른 기법이다.","정답.","다른 기법이다.","발모광·피부뜯기장애에 쓴다."],"ai":"","fl":{"tyb":1}},{"k":"psy-oc-17","area":"탈야","prof":"양종철","sec":"10/14 · 강박 및 관련 장애","meta":"근거: 강의록 「1014 양종철pf」 38쪽 · STT 10/14 강박장애 m":"강박장애에 ERP를 하면 처음에는 불편감이 심하지만 반복할수록 강도가 약해지고 빨리 가라앉는다. 이 현상은?","choices":["조건화된 회피","내성","퇴행","습관화(탈감작)","전이"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌티야방(이종은) 교과서 345쪽: 자극에 노출시키고 문제 행동을 못 하게 하면 처음엔 불편감이 심하지만 갈수록 약해지고 불편감이 줄어드는 시간도 짧아진다 → 탈감작, 습관화(habituation). 교수님: 걸레를 만지고 손을 못 씻게 하면 \"나중에는 점점 견뎌서 습관화\"된다.","exps":["회피는 오히려 강박을 유지시킨다.","약물 개념이다.","방어기제다.","정답.","정신치료 개념이다."],"ai":"","fl":{"tyb":1}}]</script>
<script>
(function(){
var APP='psy-app';
var Q=JSON.parse(document.getElementById('data').textContent);
var byK={};Q.forEach(function(q,i){q.i=i;byK[q.k]=q});
var LK=APP+'-state-v1',UK=APP+'-ui-v1';
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
// S.a[k]={c:마지막 선택,ok,w:틀린 횟수,n:푼 횟수,t}  S.f[k]={conf,err,oos,out,t}  S.m[k]={x:메모,t}
var S=lsGet(LK)||{a:{},f:{},m:{}};['a','f','m'].forEach(function(x){S[x]=S[x]||{}});
var U=lsGet(UK)||{};
var $=function(id){return document.getElementById(id)};
function now(){return Date.now()}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* ---------- 필터 ---------- */
function opts(sel,first,vals){sel.innerHTML='<option value="">'+first+'</option>'+vals.map(function(v){return '<option value="'+esc(v[0])+'">'+esc(v[1])+'</option>'}).join('')}
var profs=[],secs=[],areas=[];
Q.forEach(function(q){if(q.prof&&profs.indexOf(q.prof)<0)profs.push(q.prof);var s=q.sec;if(s&&!secs.some(function(x){return x[0]===s}))secs.push([s,s+(q.prof?' · '+q.prof:'')]);if(areas.indexOf(q.area)<0)areas.push(q.area)});
opts($('fProf'),'전체 교수',profs.map(function(p){return[p,p]}));
function secOpts(){var p=$('fProf').value;opts($('fSec'),'전체 섹션',secs.filter(function(s){return !p||Q.some(function(q){return q.sec===s[0]&&q.prof===p})}))}
secOpts();
opts($('fArea'),'전체 영역',areas.map(function(a){return[a,a]}));
if(areas.length<2)$('fArea').hidden=true;
if(!Q.some(function(q){return q.rep>1}))$('fRep').hidden=true;
var F={prof:'',sec:'',area:'',type:'',rep:'',st:'',q:'',chip:'',shuf:false,seed:1};
Object.keys(F).forEach(function(k){if(U.f&&U.f[k]!=null)F[k]=U.f[k]});
function syncCtl(){$('fProf').value=F.prof;secOpts();$('fSec').value=F.sec;$('fArea').value=F.area;$('fType').value=F.type;$('fRep').value=F.rep;$('fSt').value=F.st;$('fQ').value=F.q;
  [].forEach.call(document.querySelectorAll('#chips .chip[data-v]'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===F.chip))});$('shuf').setAttribute('aria-pressed',String(!!F.shuf))}
function solved(a){return !!(a&&(a.c!=null||a.self))}
function inWrong(k){var a=S.a[k],f=S.f[k]||{};return !!(a&&a.w>0&&!f.out)}
function memoOf(k){var m=S.m[k];return m&&m.x?m.x:''}
function pass(q){var k=q.k,f=S.f[k]||{},a=S.a[k];
  if(F.prof&&q.prof!==F.prof)return false;if(F.sec&&q.sec!==F.sec)return false;if(F.area&&q.area!==F.area)return false;if(F.type&&q.type!==F.type)return false;
  if(F.rep){var r=q.rep||1;if(F.rep==='3'&&r<3)return false;if(F.rep==='2'&&r!==2)return false;if(F.rep==='23'&&r<2)return false;if(F.rep==='1'&&r!==1)return false}
  var fl=q.fl||{};
  switch(F.st){case'inscope':if(fl.oos||f.oos)return false;break;case'tyb':if(!fl.tyb)return false;break;case'nowarn':if(fl.warn)return false;break;case'chk':if(!fl.chk)return false;break;case'inc':if(!fl.inc)return false;break;case'ydiff':if(!fl.ydiff)return false;break;
    case'img':if(!q.imgs||!q.imgs.length)return false;break;case'noimg':if(q.imgs&&q.imgs.length)return false;break;case'myerr':if(!f.err)return false;break;case'myoos':if(!f.oos)return false;break}
  switch(F.chip){case'new':if(solved(a))return false;break;case'wrong':if(!inWrong(k))return false;break;case'conf':if(!f.conf)return false;break;case'memo':if(!memoOf(k))return false;break}
  if(F.q){var t=(q.year+' '+q.meta+' '+q.stem+' '+q.choices.join(' ')+' '+q.ans.map(function(n){return q.choices[n-1]||''}).join(' ')+' '+q.sec+' '+memoOf(k)).toLowerCase();
    var ws=F.q.toLowerCase().split(/\s+/).filter(Boolean);for(var i=0;i<ws.length;i++)if(t.indexOf(ws[i])<0)return false}
  return true}
function rnd(seed){return function(){seed=(seed*1103515245+12345)%2147483648;return seed/2147483648}}
var L=[],cur=U.cur||null;
function refilter(keep){L=Q.filter(pass);if(F.shuf){var r=rnd(F.seed);for(var i=L.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=L[i];L[i]=L[j];L[j]=t}}
  if(!keep||!L.some(function(q){return q.k===cur}))cur=L.length?L[0].k:null;saveUI();render()}
function saveUI(){lsSet(UK,{f:F,cur:cur})}
function idx(){for(var i=0;i<L.length;i++)if(L[i].k===cur)return i;return -1}

/* ---------- 상단 숫자 ---------- */
function stats(){var n=0,ok=0,wrong=0,memo=0;Q.forEach(function(q){var a=S.a[q.k];if(solved(a)){n++;if(a.ok)ok++}if(inWrong(q.k))wrong++;if(memoOf(q.k))memo++});
  var img=Q.filter(function(q){return q.imgs&&q.imgs.length}).length;
  $('stats').innerHTML='<span>전체<b>'+Q.length+'</b></span>'+(img?'<span>원본 그림<b>'+img+'</b>문항</span>':'')+'<span>푼 것<b>'+n+'</b></span><span>최근 정답<b>'+(n?Math.round(ok/n*100):0)+'%</b></span><span>오답노트<b>'+wrong+'</b></span><span>메모<b>'+memo+'</b></span>'}

/* ---------- 문제 카드 ---------- */
function render(){stats();var i=idx(),v=$('view');
  $('pos').innerHTML=L.length?'<b>'+(i+1)+'</b> / '+L.length:'0 / 0';
  $('prev').disabled=i<=0;$('next').disabled=i<0||i>=L.length-1;
  if(i<0){v.innerHTML='<div class="card empty">조건에 맞는 문제가 없어요. 위 필터나 칩을 바꿔 보세요.</div>';return}
  var q=L[i],k=q.k,a=redo[k]?null:S.a[k],f=S.f[k]||{},hasAns=!!(q.ans&&q.ans.length&&q.choices.length),done=!!(a&&(a.c!=null||a.self||a.pend));
  var h='<article class="card'+(done?' done':'')+'">';
  h+='<div class="head"><span class="pill">'+(q.type==='주'?'주관식':'객관식')+'</span>'+(areas.length>1?'<span class="pill area">'+esc(q.area)+'</span>':'')+(q.rep>1?'<span class="pill king">'+(q.rep>=3?'👑👑 킹킹야':'👑 킹야')+' · '+q.rep+'회</span>':'')+'<span>'+esc(q.prof)+(q.sec?' · '+esc(q.sec):'')+'</span></div>';
  if(q.year||q.meta)h+='<div class="meta">'+esc(q.year?q.year+(q.repyears?' · 반복 '+q.repyears:''):q.meta)+'</div>';
  (q.notes||[]).forEach(function(n){h+='<div class="note'+(/범위\s?외/.test(n)?' oos':'')+'">'+esc(n)+'</div>'});
  if(f.err)h+='<div class="note">⚑ 내가 문제오류로 표시함</div>';if(f.oos)h+='<div class="note oos">내가 범위외로 표시함</div>';
  h+='<div class="stem">'+esc(q.stem)+'</div>';
  if(q.imgs&&q.imgs.length)h+='<div class="imgs">'+q.imgs.map(function(s){return '<img src="'+esc(s)+'" alt="문제 사진" loading="lazy">'}).join('')+'</div>';
  (q.vis||[]).forEach(function(t){h+='<div class="vis">'+esc(t)+'</div>'});
  if(q.choices.length){h+='<div class="choices">';q.choices.forEach(function(c,j){var n=j+1,cl='ch';
      if(done&&hasAns){if(q.ans.indexOf(n)>=0)cl+=' right';else if(a.c===n)cl+=' wrong'}if(done&&a.c===n)cl+=' mine';
      h+='<button class="'+cl+'" data-n="'+n+'"'+(done?' disabled':'')+'><span class="no">'+'①②③④⑤⑥⑦⑧'.charAt(j)+'</span><span>'+esc(c)+'</span></button>'});h+='</div>'}
  if(!done&&(!hasAns))h+='<div class="acts"><button class="btn pri" id="reveal">정답·해설 보기</button></div>';
  if(done){
    if(hasAns&&a.c!=null)h+='<div class="result '+(a.ok?'ok':'bad')+'">'+(a.ok?'정답이에요':'오답이에요 · 정답 '+q.ans.join(', ')+'번')+'</div>';
    else h+='<div class="result">'+(hasAns?'정답 '+q.ans.join(', ')+'번':'정답을 확인하고 맞았는지 골라 주세요')+'</div>'+(a&&a.self?'':'<div class="acts"><button class="chip" id="selfOk">⭕ 맞았어요</button><button class="chip" id="selfBad">❌ 틀렸어요</button></div>');
    h+='<div class="exp">';if(q.ai)h+='<div class="ai">'+esc(q.ai)+'</div>';
    if(q.basis)h+='<h3>해설</h3>'+esc(q.basis);
    if(q.exps&&q.exps.length)h+='<h3>선지별 해설</h3><ol>'+q.exps.map(function(e){return '<li>'+esc(e)+'</li>'}).join('')+'</ol>';
    h+='</div>'}
  h+='<div class="acts"><button class="chip" id="tConf" aria-pressed="'+!!f.conf+'">🟡 헷갈림</button>'+(done?'<button class="chip" id="redo">↺ 다시 풀기</button>':'')+(inWrong(k)?'<button class="chip" id="tOut">오답노트에서 빼기</button>':'')+'<button class="chip" id="tErr" aria-pressed="'+!!f.err+'">⚑ 문제오류</button><button class="chip" id="tOos" aria-pressed="'+!!f.oos+'">범위외</button></div>';
  h+='<div class="memo"><label for="memo">내 메모 · 뭐가 헷갈렸는지, 외울 포인트</label><textarea id="memo" placeholder="예: 3번이랑 헷갈림. A는 급성, B는 만성!">'+esc(memoOf(k))+'</textarea><div class="saved" id="memoSt"></div></div>';
  h+='<div class="bottomnav"><button class="btn" id="prev2"'+(i<=0?' disabled':'')+'>이전</button><button class="btn pri" id="next2"'+(i>=L.length-1?' disabled':'')+'>다음</button></div>';
  h+='</article>';v.innerHTML=h;
  [].forEach.call(v.querySelectorAll('.ch'),function(b){b.onclick=function(){answer(q,+b.getAttribute('data-n'))}});
  var r=$('reveal');if(r)r.onclick=function(){var x=S.a[k]||{w:0,n:0};x.c=null;x.self=0;x.pend=1;x.t=now();S.a[k]=x;delete redo[k];changed();render()};
  var so=$('selfOk'),sb=$('selfBad');if(so)so.onclick=function(){self(q,true)};if(sb)sb.onclick=function(){self(q,false)};
  $('tConf').onclick=function(){flag(k,'conf')};$('tErr').onclick=function(){flag(k,'err')};$('tOos').onclick=function(){flag(k,'oos')};
  var o=$('tOut');if(o)o.onclick=function(){flag(k,'out',true)};
  var rd=$('redo');if(rd)rd.onclick=function(){redo[k]=1;render()};
  $('prev2').onclick=go.bind(null,-1);$('next2').onclick=go.bind(null,1);
  var m=$('memo'),mt=null;m.oninput=function(){clearTimeout(mt);$('memoSt').textContent='입력 중…';mt=setTimeout(function(){var x=m.value.trim();if(x)S.m[k]={x:m.value,t:now()};else S.m[k]={x:'',t:now()};changed();stats();$('memoSt').textContent='저장됨'},600)};
}
// 다시 풀기: 기록(틀린 횟수)은 남기고 화면만 처음 상태로
var redo={};
function answer(q,n){var k=q.k,a=S.a[k]||{w:0,n:0};var ok=q.ans.indexOf(n)>=0;
  a.c=n;a.ok=ok;a.self=0;a.n=(a.n||0)+1;if(!ok)a.w=(a.w||0)+1;a.t=now();a.pend=0;S.a[k]=a;delete redo[k];
  if(!ok&&S.f[k]&&S.f[k].out){S.f[k].out=false;S.f[k].t=now()}changed();render()}
function self(q,ok){var k=q.k,a=S.a[k]||{w:0,n:0};a.c=null;a.self=1;a.ok=ok;a.n=(a.n||0)+1;if(!ok)a.w=(a.w||0)+1;a.t=now();a.pend=0;S.a[k]=a;delete redo[k];changed();render()}
function flag(k,name,val){var f=S.f[k]||{};f[name]=val!=null?val:!f[name];f.t=now();S.f[k]=f;changed();render()}
function go(d){var i=idx()+d;if(i<0||i>=L.length)return;cur=L[i].k;saveUI();render();window.scrollTo({top:$('pos').getBoundingClientRect().top+window.scrollY-10})}
$('prev').onclick=go.bind(null,-1);$('next').onclick=go.bind(null,1);
document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});


/* ---------- 필터 이벤트 ---------- */
$('fProf').onchange=function(){F.prof=this.value;F.sec='';secOpts();refilter()};
$('fSec').onchange=function(){F.sec=this.value;refilter()};$('fArea').onchange=function(){F.area=this.value;refilter()};
$('fType').onchange=function(){F.type=this.value;refilter()};$('fRep').onchange=function(){F.rep=this.value;refilter()};$('fSt').onchange=function(){F.st=this.value;refilter()};
var qt=null;$('fQ').oninput=function(){clearTimeout(qt);var v=this.value;qt=setTimeout(function(){F.q=v.trim();refilter()},250)};
[].forEach.call(document.querySelectorAll('#chips .chip[data-v]'),function(b){b.onclick=function(){F.chip=b.getAttribute('data-v');syncCtl();refilter()}});
$('shuf').onclick=function(){F.shuf=!F.shuf;F.seed=Math.floor(Math.random()*1e9)+1;syncCtl();refilter()};

/* ---------- 시트(목록·백업·내보내기) ---------- */
function sheet(h){$('sheetBox').innerHTML=h;$('sheet').hidden=false}
function closeSheet(){$('sheet').hidden=true}
$('sheet').onclick=function(e){if(e.target.id==='sheet')closeSheet()};
$('bList').onclick=function(){var h='<h2>목록 · '+L.length+'문항</h2><ul class="list">';
  L.forEach(function(q,i){var a=S.a[q.k];h+='<li data-k="'+esc(q.k)+'"'+(q.k===cur?' class="cur"':'')+'><span class="n">'+(i+1)+'</span><span class="t"><span class="dot'+(solved(a)?(a.ok?' ok':' bad'):'')+'"></span>'+esc(q.stem.slice(0,70))+(q.stem.length>70?'…':'')+'<div class="s">'+esc((q.area||'')+' · '+q.sec+(q.year?' · '+q.year:''))+(memoOf(q.k)?' · 📝 '+esc(memoOf(q.k).slice(0,30)):'')+'</div></span></li>'});
  h+='</ul><div class="tools"><button class="btn" id="cls">닫기</button></div>';sheet(h);
  [].forEach.call(document.querySelectorAll('.list li'),function(li){li.onclick=function(){cur=li.getAttribute('data-k');saveUI();closeSheet();render()}});
  $('cls').onclick=closeSheet;var c=document.querySelector('.list li.cur');if(c)c.scrollIntoView({block:'center'})};
function copyBox(title,text,note){sheet('<h2>'+esc(title)+'</h2><div class="msg" id="cmsg">'+esc(note||'')+'</div><textarea id="cbox" readonly></textarea><div class="tools"><button class="btn pri" id="ccopy">복사</button><button class="btn" id="cls">닫기</button></div>');
  $('cbox').value=text;$('cls').onclick=closeSheet;
  $('ccopy').onclick=function(){var b=$('cbox');function fb(){b.focus();b.select();$('cmsg').textContent='자동 복사가 막혔어요. 칸을 길게 눌러 전체 선택 → 복사하세요.'}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){$('cmsg').textContent='복사했어요.'},fb);else fb()}}
function exportText(){var out=Q.filter(function(q){var f=S.f[q.k]||{};return inWrong(q.k)||f.conf||memoOf(q.k)});
  return out.map(function(q,i){var a=S.a[q.k]||{},f=S.f[q.k]||{},tags=[];if(inWrong(q.k))tags.push('틀림 '+a.w+'회'+(a.ok?' (마지막엔 맞힘)':''));if(f.conf)tags.push('헷갈림');
    return '=== '+(i+1)+'. '+q.sec+' ['+q.area+'] ('+q.prof+') ===\n'+(q.year?'기출: '+q.year+'\n':'')+(tags.length?'표시: '+tags.join(' / ')+'\n':'')+'문제: '+q.stem+(q.imgs&&q.imgs.length?' [사진 있음]':'')+'\n'+q.choices.map(function(c,j){return (j+1)+'. '+c}).join('\n')+
      '\n정답: '+(q.ans.join(',')||'-')+(memoOf(q.k)?'\n내 메모: '+memoOf(q.k):'')+(q.basis?'\n해설: '+q.basis:'')+(q.exps&&q.exps.length?'\n선지해설:\n'+q.exps.map(function(e,j){return (j+1)+'. '+e}).join('\n'):'')}).join('\n\n')}
$('bExp').onclick=function(){var t=exportText();copyBox('오답·헷갈림·메모 내보내기',t||'아직 틀리거나 헷갈림·메모를 남긴 문제가 없어요.',(t?t.split('\n=== ').length:0)+'문항 · 복사해서 AI 대화창이나 메모장에 붙여넣으세요.')};
$('bBak').onclick=function(){copyBox('기록 백업',JSON.stringify({app:APP,at:new Date().toISOString(),s:S}),'이 글을 복사해 두면 나중에 “백업 불러오기”로 되살릴 수 있어요.')};
$('bRes').onclick=function(){sheet('<h2>백업 불러오기</h2><div class="msg" id="rmsg">“기록 백업”에서 복사한 글을 붙여넣고 불러오기를 누르세요. 지금 기록과 합쳐져요.</div><textarea id="rbox"></textarea><div class="tools"><button class="btn pri" id="rgo">불러오기</button><button class="btn" id="cls">닫기</button></div>');
  $('cls').onclick=closeSheet;$('rgo').onclick=function(){try{var o=JSON.parse($('rbox').value);merge(o.s||o);changed();refilter(true);$('rmsg').textContent='불러왔어요.'}catch(e){$('rmsg').textContent='백업 글 형식이 아니에요. 처음부터 끝까지 그대로 붙여넣었는지 확인해 주세요.'}}};

/* ---------- 저장·계정 동기화 ---------- */
function merge(o){['a','f','m'].forEach(function(x){var src=(o&&o[x])||{};Object.keys(src).forEach(function(k){var v=src[k];if(!v)return;var c=S[x][k];if(!c||(v.t||0)>(c.t||0))S[x][k]=v})})}
var DB=null,UID=null,pt=null,dirty=false;
function changed(){lsSet(LK,S);dirty=true;clearTimeout(pt);pt=setTimeout(push,2500)}
function push(){if(!DB||!UID||!dirty)return;dirty=false;
  var st={a:S.a,f:S.f,updatedAt:new Date().toISOString()},mm={m:S.m,updatedAt:st.updatedAt};
  Promise.all([DB.doc('st/'+UID).set(st),DB.doc('memo/'+UID).set(mm)]).then(function(){$('sync').textContent='계정에 저장됨 · 모든 기기 연결'},function(){dirty=true;$('sync').textContent='계정 저장 실패 · 이 기기에는 저장됨'})}
function pull(){if(!DB||!UID)return Promise.resolve();$('sync').textContent='계정 기록 연결 중…';
  return Promise.all([DB.doc('st/'+UID).get(),DB.doc('memo/'+UID).get()]).then(function(r){
    var s=r[0]&&r[0].exists?r[0].data():null,m=r[1]&&r[1].exists?r[1].data():null;
    if(s)merge({a:s.a,f:s.f});if(m)merge({m:m.m});lsSet(LK,S);refilter(true);$('sync').textContent='계정에 저장됨 · 모든 기기 연결';
    if(!s||!m||Object.keys(S.a).length)dirty=true,push()},function(){$('sync').textContent='계정 연결 실패 · 이 기기에만 저장'})}
$('bSync').onclick=function(){if(DB)pull();else{S=lsGet(LK)||S;refilter(true)}};
window.addEventListener('pagehide',function(){lsSet(LK,S);push()});
if(window.claude&&window.claude.use){Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
  if(!r[0]||!r[1]){$('sync').textContent='이 기기에 저장됨';return}DB=r[0];return r[1].id().then(function(id){if(!id){$('sync').textContent='이 기기에 저장됨';DB=null;return}UID=id;return pull()})}).catch(function(){$('sync').textContent='이 기기에 저장됨'})}
else $('sync').textContent='이 기기에 저장됨';

syncCtl();refilter(true);
})();
</script>
