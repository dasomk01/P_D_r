보상행동, 둘 다 3개월간 주 1회 이상, 자기평가가 체형·체중에 과도하게 영향, 식욕부진증 삽화 동안이 아님.","exps":[],"ai":"","fl":{}},{"k":"psy-y-ed-an-2015","area":"야마","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: 학습지 「급식 및 섭식 장애」 218–223쪽","year":"2015 객34","type":"객","rep":3,"repyears":"2014 객32 · 2011 객29","stem":"신경성 식욕부진증(anorexia nervosa)에 대한 설명으로 옳은 것은?","choices":["체중은 보통 사람보다 약간 과체중인 경우가 많다.","폭식은 관찰되지 않는다.","식욕의 상실이 항상 나타난다.","체중 증가에 매우 과민하다.","정상 체중보다 15% 이상 감소 시에 입원 치료를 해야 한다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님: 식욕부진증 환자는 체중계에 500g만 올라가도 울고, \"허벅지가 쪘다\"며 신체상이 왜곡되어 있다(체중 증가에 매우 과민). 1/3은 폭식하고 토하므로 폭식이 없다거나 식욕 상실이 항상 있다는 선지는 틀림. 입원은 심장·신장 기능 때문에 죽을 수 있을 때만, 극소수에 제한.\n\n📚 학습지 해설: (김병진, 2015) ① 생명을 위협할 정도의 극단적 체중감소가 특징 (X). ② 아형 중 폭식/제거형은 규칙적인 폭식·제거행동이 있다 (X). ③ 폭식/제거형은 폭식 후 제거하므로 식욕 상실이 항상 있는 것은 아니다 (X). ④ 적은 체중 변화에도 아주 민감해 헐렁했던 옷이 딱 맞는다는 느낌만 있어도 체중이 늘었다고 느끼고, 성장·임신으로 인한 정상 체중 증가조차 두려워한다 (O). ⑤ 정상 체중의 85% 이하는 진단 기준이고, 입원은 정상체중의 30% 이상 체중저하가 있을 때 (X).","exps":[],"ai":"","fl":{}},{"k":"psy-y-ed-an-2014","area":"야마","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: 학습지 「급식 및 섭식 장애」 218–223쪽","year":"2014 객32","type":"객","rep":3,"repyears":"2015 객34 · 2011 객29","stem":"신경성 식욕부진증 환자에 대한 것으로 맞는 것은?","choices":["자연회복은 없다.","폭식은 나타나지 않는다.","항상 식욕상실이 관찰된다.","신체상에 대한 왜곡은 흔하지 않다.","정상체중의 30% 이상 체중저하를 나타낼 때는 입원치료를 시행한다."],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님: 식욕부진증의 1/3은 폭식·제거를 하고, 식욕 상실이 항상 있는 것은 아니며, 신체상 왜곡이 핵심. 입원은 심장·신장 기능이 위험할 때 극소수에게만(강제로 먹이는 게 아니라 약속하고 먹은 뒤 1–2시간 간호사실 앞에 있게 함). 30% 이상 저하 시 입원은 교과서 기준.\n\n📚 학습지 해설: (김창곤, 2014) 복원 해설 없음(\"복원안됨\"). 참고로 2015 객34 해설: 입원치료를 요하는 경우는 정상체중의 30% 이상 체중저하가 있을 때. 2011 객29 해설: 식욕부진증은 약 40% 회복, 1/3 호전, 약 20% 장기 장애로 자연회복이 없는 것은 아니고, 폭식/제거형이 있어 폭식이 없거나 식욕상실이 항상 있다는 것은 틀리며, 신체상 왜곡은 흔하다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-ed-an-2011","area":"야마","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: 학습지 「급식 및 섭식 장애」 218–223쪽","year":"2011 객29","type":"객","rep":3,"repyears":"2015 객34 · 2014 객32","stem":"신경성 식욕부진증 (Anorexia nervosa) 환자에 대한 설명 중 맞는 것은?","choices":["자연회복은 없다.","폭식은 나타나지 않는다.","항상 식욕상실이 관찰된다.","자율성 확립에 어려움을 겪는다.","신체상에 대한 왜곡은 흔하지 않다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님: 식욕부진증 환자는 autonomy·control에 예민하다 – 교수님 환자도 아버지와 갈등 후 \"먹는 것은 내 몸인데 왜 부모가 간섭하냐\"며 살을 뺐다. 자기 통제·완벽주의가 특징이고 신체상 왜곡이 흔하며, 1/3은 폭식한다.\n\n📚 학습지 해설: (김수연B, 2011, 당시 정상근 교수님 파트) ① 자연회복은 없다 (X) – 식욕부진증은 약 40% 회복, 약 1/3 호전, 나머지 약 20%가 장기적 장애. ② 폭식은 나타나지 않는다 (X), ③ 항상 식욕상실이 관찰된다 (X) – 폭식/제거형은 규칙적인 폭식·제거행동이 있다. ⑤ 신체상 왜곡은 흔하지 않다 (X) – 적은 체중 변화에도 민감해 헐렁했던 옷이 맞는다는 느낌만으로 체중이 늘었다고 느끼고 정상적인 체중 증가조차 두려워한다. 정답 ④ 자율성 확립에 어려움.","exps":[],"ai":"","fl":{}},{"k":"psy-y-ed-tx-2016","area":"야마","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: 학습지 「급식 및 섭식 장애」 218–223쪽","year":"2016 객33","type":"객","rep":1,"repyears":"","stem":"어느 여인이 자신의 딸의 교통사고 이후 집중을 잘 하지 못하며, 폭식을 하기 시작하였는데, 체중이 증가되는 것은 원치 않아한다. 이때 사용될 수 있는 치료제는?","choices":["SSRI","Benzodiazepine","Zolpidem","Propranolol","Busprion"],"ans":[],"imgs":[],"vis":[],"notes":["⚠ 정답 확인 필요: 학습지 정답 칸 ⑤(Buspirone) – 교과서·수업 내용과 맞지 않아 보류.","학습지 정답 그대로는 채점하지 않고, 확인되면 반영할게요.","복원 불완전·확인 필요 문항이라 정답 자동 채점은 하지 않아요."],"basis":"🎓 올해 수업 기준: 교수님(10/20): 식욕부진증은 항우울제가 근본적으로 체중을 늘리지는 못하고 우울·강박 동반 시 SSRI, 생각이 굳으면 olanzapine을 쓰기도 한다. 폭식증은 1차 치료가 인지행동치료이고 약물은 항우울제(체중 증가 부작용 주의), 교과서에 topiramate도 있다. Buspirone은 올해 수업에서 섭식장애 치료로 언급되지 않았다 – 학습지 정답 ⑤는 확인 필요.\n\n📚 학습지 해설: (천상옥, 2016) 이 여인은 현재 신경성 식욕부진증을 앓고 있다 – 폭식을 하고 있으며 체중 증가에 매우 과민하기 때문. 2015년도까지와 달리 치료제를 묻는 문제가 나왔다. 답은 Buspirone.","exps":[],"ai":"","fl":{"warn":1,"chk":1,"inc":1}},{"k":"psy-y-ed-hypo-2011","area":"야마","prof":"양종철","sec":"10/20 · 급식 및 섭식장애","meta":"근거: 학습지 「급식 및 섭식 장애」 218–223쪽","year":"2011 객25","type":"객","rep":1,"repyears":"","stem":"성장애, 식사장애, 수면장애와 가장 밀접한 관련이 있는 뇌 부위는?","choices":["Hypothalamus","Hippocampus","Amygdala","Caudate nucleus","Nucleus accumbens"],"ans":[1],"imgs":[],"vis":[],"notes":["복원자: 다른 답이 있으면 공유 부탁."],"basis":"🎓 올해 수업 기준: 올해 수업에서는 직접 다루지 않음 – 교수님은 먹는 행동을 항상성(렙틴)과 쾌락적 측면(보상 체계)으로 설명했고, 섭식장애 관련 뇌 영역으로 insula를 언급했다(이론일 뿐). 섭식·성·수면·체온·내분비 조절의 중추는 시상하부.\n\n📚 학습지 해설: (김상민, 2011, 당시 정상근 교수님) 수면장애 ppt: 일반의학적 상태에 의한 불면증 – 시상하부 종양 등. 식사장애 ppt: 시상하부의 기능부전은 식사장애의 원인 및 결과의 가능성. 성장애 관련은 못 찾음. KMLE: 시상하부는 각종 호르몬 분비 인자를 내는 기관으로 자율신경과 내분비 기관을 조절하고 섭식행위, 성행위, 체온, 수면-각성 주기 등을 조절. 다른 답 있으면 공유 부탁.","exps":[],"ai":"","fl":{}},{"k":"psy-so-01","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 강의록 「Somatic Symptom and Related Disorders」 3쪽 · STT 10/20 8교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 신체증상 및 관련 장애의 재편에 대한 설명으로 옳은 것은?","choices":["건강염려증이라는 진단명을 그대로 쓴다","통증장애는 독립 진단으로 그대로 남았다","신체화장애는 여전히 증상 개수 기준이 있다","DSM-IV의 신체형 장애를 그대로 유지했다","전환장애·질병불안장애·신체증상장애로 재편했다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님: DSM-IV 신체형 장애(전환장애·신체화장애·미분화형·통증장애·건강염려증)를 풀어서, 드라마틱한 전환장애는 살리고, 건강염려증 중 아프지 않은데 생각만으로 병이 있다는 사람만 질병불안장애로 빼고, 나머지는 몽땅 신체증상장애로. 신체화장애의 \"통증 4·소화기 2·성 1·신경 1\" 종합선물세트 기준은 없어졌다.","exps":["둘로 나뉘었다.","신체증상장애에 들어갔다.","없어졌다.","풀어서 재편했다.","정답."],"ai":"","fl":{}},{"k":"psy-so-02","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: STT 10/20 8교시(양종철) · 교과서 16장(신체증상 및 관련 장애) 395–396쪽","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 신체증상장애(somatic symptom disorder)에 대한 설명으로 옳은 것은?","choices":["증상이 1개월만 지속되면 진단한다","통증 증상이 4개 이상 있어야 한다","신체 증상이 전혀 없어야 진단한다","검사상 모두 음성이어야 진단할 수 있다","실제 신체 질환이 있어도, 증상이 하나여도 진단 가능"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님(교과서 395–396쪽): 의학적 설명의 유무를 가리지 않는 것이 가장 큰 변화 – 유방암 재발 공포, 당뇨 최악의 합병증만 생각하는 경우도 해당. 증상의 심각성에 대한 지속적 생각, 높은 건강 불안, 과도한 시간·에너지 중 하나, 전반적 상태가 6개월 이상.","exps":["6개월 이상이다.","없어진 기준이다.","질병불안장애다.","DSM-IV 신체형 장애의 조건이다.","정답."],"ai":"","fl":{}},{"k":"psy-so-03","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: STT 10/20 8교시(양종철) · 교과서 16장(신체증상 및 관련 장애) 399–400쪽","year":"","type":"객","rep":1,"repyears":"","stem":"신체 증상은 없거나 아주 경미한데 심각한 병에 걸렸다는 생각에 6개월 이상 몰두하는 경우의 진단은?","choices":["전환장애","질병불안장애","인위성장애","신체이형장애","신체증상장애"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 질병불안장애는 \"생각만\" – 신체 증상이 없다. 있으면 신체증상장애. 머리가 실제로 아프면서 뇌종양이라 하는 사람과, 아프지도 않은데 뇌종양 같다는 사람 중 후자만 질병불안장애. (2019 야마: 두통 + 뇌전이 걱정 → 신체증상장애)","exps":["운동·감각 기능 상실이다.","정답.","일부러 만든다.","외모 결함 몰두다.","증상이 있을 때다."],"ai":"","fl":{}},{"k":"psy-so-04","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 강의록 「Somatic Symptom and Related Disorders」 6쪽 · STT 10/20 8교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"전환장애에 대한 설명으로 옳은 것은?","choices":["주된 방어기제는 승화와 이타주의다","사춘기·초기 성인 여성에 많고 억압과 전환이 관여","교육 수준이 높아지면서 늘고 있다","주로 노인 남성에게 흔하다","환자가 일부러 증상을 만든다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6쪽·교수님: 갑작스러운 수의운동·감각 기능 이상(마비, 실어, 실명). 0.2%, 여자가 2–10배(교과서), 사춘기·초기 성인기. 억압과 전환 – 표현하지 못한 심리적 에너지가 신체 증상으로. 일부러 하는 게 아니다(꾀병 아님). 교육 수준·의학 상식이 늘면서 줄어드는 추세.","exps":["억압과 전환이다.","정답.","줄어드는 추세다.","젊은 여성에 많다.","일부러가 아니다."],"ai":"","fl":{}},{"k":"psy-so-05","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 강의록 「Somatic Symptom and Related Disorders」 6쪽 · STT 10/20 8교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"남편과 다투다 손이 마비되어 더 이상 싸우지 않게 된 것처럼, 증상을 통해 갈등을 피하는 이득은?","choices":["la belle indifference","symptom identification","꾀병","이차 이득(secondary gain)","일차 이득(primary gain)"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 일차 이득 = 갈등 회피(마비가 오면 더 이상 갈등할 게 없어진다). 이차 이득 = 관심과 보호(남편이 \"앞으로 7시면 칼퇴근\"). 나중에 엄청 헷갈리니 구분할 것.","exps":["무관심한 태도다.","증상 모방이다.","일부러가 아니다.","관심·보호를 얻는 것이다.","정답."],"ai":"","fl":{}},{"k":"psy-so-06","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 강의록 「Somatic Symptom and Related Disorders」 6쪽 · STT 10/20 8교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"전환장애에서 주위 사람들은 몹시 걱정하는데 정작 환자는 별로 걱정하지 않는 태도를 무엇이라 하는가?","choices":["primary gain","la belle indifference","Hoover sign","malingering","symptom identification"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"교수님: la belle indifference(만족스러운 무관심) – 심리적 갈등으로 증상이 나왔고 심리적 이득도 있으니 본인은 정작 편하다. symptom identification은 TV·가족(고인)의 증상을 모델로 증상이 나타나는 것.","exps":["갈등 회피 이득이다.","정답.","마비 감별 검사다.","꾀병이다.","증상 모방이다."],"ai":"","fl":{}},{"k":"psy-so-07","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 강의록 「Somatic Symptom and Related Disorders」 6쪽 · STT 10/20 8교시(양종철)","year":"","type":"객","rep":1,"repyears":"","stem":"전환장애의 진단과 치료에 모두 이용되는 것은?","choices":["직면","반복 검사","암시","노출과 반응방지","혐오요법"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"교수님: \"손 펴 보세요 – 안 되죠, 새끼손가락 손톱만 움직여 보세요 – 되죠\" 피암시성으로 진단하고, \"이 주사 맞고 3시간 뒤엔 손가락이 펴질 거예요\"처럼 조금씩 빠져나오게 치료한다(face saving). \"마음의 문제, 신경성\"이라고 직면시키면 안 된다.","exps":["좋지 않다.","한 번에 끝내야 한다.","정답.","강박장애 치료다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-so-08","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: STT 10/20 8교시(양종철) · 교과서 16장(신체증상 및 관련 장애) 400–403쪽","year":"","type":"객","rep":1,"repyears":"","stem":"한쪽 다리 마비를 호소하는 환자에서 건측 다리를 들게 할 때 마비측 발꿈치 아래의 손이 눌리는 것을 확인하는 검사는?","choices":["Babinski sign","Phalen test","Lasègue test","Hoover test","Romberg test"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님: Hoover test – 반듯이 누워 건측 다리를 들면 반대쪽 발꿈치가 바닥을 누르게 된다. 마비라던 다리의 발꿈치 밑 손에 누르는 힘이 느껴지면 마비가 아니다 → 전환장애 양성. 신경학적 해부와 맞지 않는 감각 소실, 사람 있는 쪽·소파 쪽으로 쓰러지는 것도 단서.","exps":["해당 없다.","해당 없다.","해당 없다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-so-09","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: STT 10/20 8교시(양종철) · 교과서 16장(신체증상 및 관련 장애) 402–403쪽","year":"","type":"객","rep":1,"repyears":"","stem":"전환장애가 의심되는 환자의 검사·설명 방법으로 옳은 것은?","choices":["검사를 며칠에 걸쳐 하나씩 순서대로 한다","심리적 요인이 확인되지 않으면 진단할 수 없다","검사는 한꺼번에 하고, 기능적 변화로 설명한다","꾀병일 가능성이 높다고 알려 준다","\"검사가 정상이니 신경성입니다\"라고 바로 말한다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 검사를 나눠 하면 결과가 나올 때까지 환자는 계속 아프다. 한 번에 몽땅 하고 설명. 우리나라에선 \"신경성\"이라 하면 꾀병이란 말로 받아들이니, 체면을 세워 주며 설명. DSM-5에서는 관련 심리적 요인이 없어도(명시만 하고) 전환장애로 진단할 수 있다. 오래 가면 lorazepam 등으로 안정.","exps":["한꺼번에 해야 한다.","DSM-5는 없어도 진단 가능.","정답.","꾀병이 아니다.","기분 나빠한다."],"ai":"","fl":{}},{"k":"psy-so-10","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: STT 10/20 8교시(양종철) · 교과서 16장(신체증상 및 관련 장애) 408–409쪽","year":"","type":"객","rep":1,"repyears":"","stem":"전환장애·인위성장애·꾀병을 구분하는 기준으로 옳은 것은?","choices":["꾀병은 무의식적으로 생긴다","인위성장애는 타인에게는 생기지 않는다","인위성장애는 군대를 빠지려는 것이 목적이다","꾀병만 병역 회피·보상금 같은 현실적 이득이 목적이다","셋 다 증상을 일부러 만든다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님(408–409쪽): 세 단계 – 전환장애(일부러 아님), 인위성장애(일부러, 의학적 치료를 받는 것 자체가 목적, 해야 할 일 회피나 경제적 이득은 아님 – 자녀를 다치게 해 데려오는 경우도), 꾀병 malingering(소송·보상금·병역 등 현실적 이득).","exps":["의도적이다.","자녀에게 하기도 한다.","꾀병이다.","정답.","전환장애는 아니다."],"ai":"","fl":{}},{"k":"psy-so-11","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: STT 10/20 8교시(양종철) · 교과서 16장(신체증상 및 관련 장애) 397–398쪽","year":"","type":"객","rep":1,"repyears":"","stem":"만성 통증·신체증상장애 환자의 치료 목표로 교수님이 강조한 것은?","choices":["모든 증상이 마음의 문제라고 직면시키는 것","원인을 찾을 때까지 검사를 반복하는 것","통증이 있어도 사회적 기능을 할 수 있게 하는 것(기능 회복)","매주 병원에 오게 하는 것","통증을 완전히 없애는 것"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 급성 통증은 통증을 없애 주는 게 좋은 의사, 만성 통증은 통증이 있어도 기능하게 하는 게 목표 – \"시험 때마다 배 아픈 건 인정, 그래도 시험은 보자\". 처음엔 2주마다 → 한 달 → 6개월처럼 정기 방문(regular visit)으로 안정시키고, 갑자기 \"오지 마세요\" 하면 다른 병원으로 간다.","exps":["좋지 않다.","검사 반복은 피한다.","정답.","점점 간격을 늘린다.","만성 통증의 목표가 아니다."],"ai":"","fl":{}},{"k":"psy-so-12","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: STT 10/20 8교시(양종철) · 교과서 26장(정신신체의학) 648–649쪽","year":"","type":"객","rep":1,"repyears":"","stem":"정신신체의학의 인물과 이론 연결로 옳지 않은 것은?","choices":["Alexander – 특정 갈등이 특정 질환(7가지)을 일으킨다는 특이성 이론","Friedman & Rosenman – A형 성격과 심혈관 질환","Dunbar – 특정 성격 이론","Selye – 생물·심리·사회 모델","Holmes & Rahe – 스트레스의 정량화"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님(648–649쪽): 역사 이론은 몇 사람만 알면 된다. Alexander(고혈압·소화성 궤양·갑상선항진·궤양성 대장염·신경피부염·류마티스 관절염·천식), Dunbar(성격), Friedman & Rosenman(A형), Selye(스트레스에 대한 공통 생리 반응, HPA axis), Holmes & Rahe(서양은 배우자 사망, 동양은 자식 사망이 1등), Engel(biopsychosocial model – 정신의학 전체를 대변).","exps":["옳다.","옳다.","옳다.","정답. Engel이다.","옳다."],"ai":"","fl":{}},{"k":"psy-so-13","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: STT 10/20 8교시(양종철) · 교과서 26장(정신신체의학) 661쪽","year":"","type":"객","rep":1,"repyears":"","stem":"좋은 일(복권 당첨)로 생기는 스트레스와 암 환자가 겪는 고통스러운 스트레스를 각각 무엇이라 하는가?","choices":["eustress – distress","strain – stress","primary – secondary","stressor – coping","distress – eustress"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"교수님(661쪽): 스트레스는 원래 물리학 용어로 정상 상태에 변화를 주는 힘 – 좋은 것은 eustress(100억 로또: 어디 쓸지·누구한테 말할지 고민), 안 좋은 것은 distress(암 환자의 디스트레스). 정신종양학(psycho-oncology)이 따로 있을 만큼 암의 정신신체적 요소를 중시한다.","exps":["정답.","해당 없다.","해당 없다.","해당 없다.","반대다."],"ai":"","fl":{}},{"k":"psy-so-14","area":"티야","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: STT 10/20 8교시(양종철) · 교과서 26장(정신신체의학) 650–661쪽","year":"","type":"객","rep":1,"repyears":"","stem":"스트레스와 관련이 뚜렷하며 이완요법·안정제(근육이완 효과)가 도움이 된다고 교수님이 예로 든 두통은?","choices":["뇌종양에 의한 두통","약물과용 두통","긴장성 두통","군발두통","편두통"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"교수님(661쪽): 긴장성 두통은 스트레스로 뒷목 근육 긴장이 올라가 생기고 오후에 심하다. 복식호흡 등 이완요법, 안정제의 근육이완 효과로 편해진다. 편두통은 상대적으로 덜 관련. 정신신체 질환으로는 심혈관·천식·과민성 대장·관절염·SLE·섬유근육통(SSRI)·갑상샘·아토피·건선·원형탈모 등.","exps":["해당 없다.","해당 없다.","정답.","해당 없다.","덜 관련된다고 했다."],"ai":"","fl":{}},{"k":"psy-y-so-sug-2025","area":"야마","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 학습지 「신체증상 및 관련 장애」 231–236쪽","year":"2025 객29","type":"객","rep":3,"repyears":"2022 객45 · 2020 객38","stem":"전환장애의 진단과 치료 모두에 이용되는 전략은?","choices":["강화","암시","직면","혐오요법","노출과 반응 방지"],"ans":[],"imgs":[],"vis":[],"notes":["⚠ 정답 확인 필요: 학습지 정답 칸이 ⑤인데, 해설(피암시성·암시)과 같은 문제(2022·2020) 정답은 ② 암시.","학습지 정답 그대로는 채점하지 않고, 확인되면 반영할게요.","복원 불완전·확인 필요 문항이라 정답 자동 채점은 하지 않아요."],"basis":"🎓 올해 수업 기준: 교수님(10/20 8교시): 전환장애는 일부러가 아니다(꾀병 아님). 억압과 전환, 일차 이득(갈등 회피)·이차 이득(관심·보호), la belle indifference, symptom identification. \"암시성으로 진단도 하고 치료도 한다\" – 손 펴기 안 되면 새끼손가락 손톱만 움직여 보게 하고, \"주사 맞고 3시간 뒤엔 손가락이 펴질 거예요\"처럼 조금씩 빠져나오게(face saving). \"마음의 문제, 신경성\"이라고 직면시키면 안 되고, 검사는 한꺼번에 하고 반복하지 않는다. 정답은 ② 암시 – 학습지 정답 칸 ⑤(노출과 반응 방지)는 강박장애 치료로, 올해 수업·같은 문제(2022·2020) 정답과 맞지 않아 확인 필요.\n\n📚 학습지 해설: (송예원, 2025) \"환자의 성격은 연극적이고 의존적, 자기중심적이며, 피암시성이 강하고 성적으로 미숙한 경우가 많다\", \"전환장애에 특별한 치료법은 없으나 설득하고 암시를 주며 스트레스를 줄여주는 것이 도움이 된다\". 수업시간에 교수님께서 전환장애의 특징 중 하나로 피암시성을 언급: 팔을 못 드시겠죠? → 못함, 손목을 못 드시겠죠? → 못함, 새끼손가락은 할 수 있을걸요? → 함. (정답 칸에는 ⑤로 적혀 있음)","exps":[],"ai":"","fl":{"warn":1,"chk":1,"inc":1}},{"k":"psy-y-so-sug-2022","area":"야마","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 학습지 「신체증상 및 관련 장애」 231–236쪽","year":"2022 객45","type":"객","rep":3,"repyears":"2025 객29 · 2020 객38","stem":"전환장애의 진단과 치료 모두에 이용되는 전략은?","choices":["강화","암시","직면","혐오요법","노출과 반응 방지"],"ans":[2],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2020 객38","강의 마지막 티야였다(복원자)."],"basis":"🎓 올해 수업 기준: 교수님(10/20 8교시): 전환장애는 일부러가 아니다(꾀병 아님). 억압과 전환, 일차 이득(갈등 회피)·이차 이득(관심·보호), la belle indifference, symptom identification. \"암시성으로 진단도 하고 치료도 한다\" – 손 펴기 안 되면 새끼손가락 손톱만 움직여 보게 하고, \"주사 맞고 3시간 뒤엔 손가락이 펴질 거예요\"처럼 조금씩 빠져나오게(face saving). \"마음의 문제, 신경성\"이라고 직면시키면 안 되고, 검사는 한꺼번에 하고 반복하지 않는다.\n\n📚 학습지 해설: (송정은, 2022) 전환장애에 특별한 치료법은 없으나, 설득하고 암시를 주며 스트레스를 줄여주는 것이 도움이 된다. 강의 마지막 티야였으며, 20년 38번과 동일한 문제. (김희수, 2020) 전환이란 정신적인 에너지가 신체증상으로 변환되었다는 의미. 갑작스런 감각·수의운동 기능 상실로 나타나 처음에는 신경계·내과 질환을 의심하지만 정밀검사로 설명할 수 없고, 환자 스스로 증상을 조절할 수 없으며 의도적으로 만드는 것이 아니다. 치료: 설득·암시·스트레스 감소, 병의 상태와 심적 요소를 설명하되 \"마음의 문제\"라고 직면시키는 것은 좋지 않다(기능 상실은 환자에게 실제 상황). 따라서 진단과 치료에 이용되는 것은 암시.","exps":[],"ai":"","fl":{}},{"k":"psy-y-so-cvtx-2021","area":"야마","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 학습지 「신체증상 및 관련 장애」 231–236쪽","year":"2021 객38","type":"객","rep":2,"repyears":"2018 객39","stem":"33세 여자환자가 남편과 말다툼을 하다가 팔의 마비증상을 주소로 응급실에 내원하였다. 추가검사 결과 이상 소견은 없었다. 3개월 전에도 딸에게 화를 내다가 비슷한 증상이 나타났고 5일만에 호전되었다. 의사가 치료로 행해야 할 것은?","choices":["암시","홍수법","반복검사","바이오피드백","노출 및 반응방지"],"ans":[1],"i  펴질 거예요\"처럼 조금씩 빠져나오게(face saving). \"마음의 문제, 신경성\"이라고 직면시키면 안 되고, 검사는 한꺼번에 하고 반복하지 않는다. 피암시성이 강하다고 꾀병이 아니고(일부러 하는 게 아님), \"상상에 의한 병\"이라고 설명하면 안 된다.\n\n📚 학습지 해설: (김정우, 2014) 책으로 수업하시기 때문에 반드시 책을 읽어볼 것. ① 젊은 나이에 거의 발생하지 않는다 (X) – 사춘기·성인 초기, 여자가 2–10배. ② 상상에 의한 병이라고 설명 (X) – 설득·암시·스트레스 감소, \"마음의 문제\"라며 직면시키지 않는다. ③ 증상 형성에 주로 관여하는 방어기제는 억압과 전환 (O) – 성적·공격적·본능적 충동을 억압하고자 하는 갈등이 원인, 억압된 욕구가 신체증상으로 상징적으로 표현되며 환자는 증상의 의미를 모른다. ④ 피암시성이 강하면 꾀병 (X) – 샤르코: 피암시성 높은 사람에서 강한 감정이 히스테리 증상을 만들 수 있다, 환자 성격은 연극적·의존적·피암시성 강함. ⑤ 내적 갈등을 의식하지 않는 것은 이차성 (X) – 일차성 이득 = 갈등회피, 이차성 이득 = 회피·보호·관심.","exps":[],"ai":"","fl":{}},{"k":"psy-y-so-cv-2011","area":"야마","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 학습지 「신체증상 및 관련 장애」 231–236쪽","year":"2011 객26","type":"객","rep":3,"repyears":"2015 객37 · 2014 객29","stem":"29세 여자 환자가 갑자기 화를 내다가 팔의 마비 증상을 주소로 응급실로 내원하였다. 신경과적인 검사 후 별다른 이상소견이 발견되지 않아 정신과로 의뢰되었다. 이 질환에 관하여 맞는 것은?","choices":["증상 형성에 주로 관여하는 방어기제는 승화이다.","젊은 나이에는 거의 발생되지 않는다.","치료법으로 설득과 암시를 사용한다.","피암시성이 강하면 꾀병(malingering)으로 진단하여야 한다.","상상에 의한 병이라고 설명하며 안심시킨다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: (김상헌, 2011) ① 주된 방어기전은 억압과 전환. ② 사춘기나 성인초기 발병, 여자가 남자의 2–10배. ③ 특별한 치료법은 없으나 설득하고 암시를 주며 스트레스를 줄여주는 것이 도움 (정답). ④ 과거 히스테리, 히스테리 신경증 전환형으로 불렸다 – 샤르코는 피암시성이 높은 사람에서 강한 감정이 히스테리 증상을 만들어낼 수 있다고 했다. ⑤ \"마음의 문제\"라며 직면시키는 것은 좋지 않다 – 기능 상실은 환자에게 실제 상황.","exps":[],"ai":"","fl":{}},{"k":"psy-y-so-ssd-2019","area":"야마","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 학습지 「신체증상 및 관련 장애」 231–236쪽","year":"2019 객39","type":"객","rep":1,"repyears":"","stem":"51세 여성이 1년전부터 두통이 심하고, 뇌종양에 걸린 것 같아 불안하다고 병원에 왔다. 2년 전 유방암이 진단되어 수술과 타목시펜 유지요법을 받았는데, 뇌로 전이된 것 같다는 걱정 때문에 지나치게 자주 재검사를 받고 있다고 한다. 의사로부터 안심하라는 설명을 계속 듣지만, 그래도 두통과 불안이 멈추지 않아 직장생활도 그만두고 싶다고 하였다. 진단은?","choices":["전환장애","인위성장애","신체이형장애","신체증상장애","질병불안장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/20 8교시): DSM-5에서 건강염려증을 둘로 나눴다 – 실제로 머리가 아프면서 뇌종양이라 하는 사람은 신체증상장애, 아프지도 않은데 생각만으로 병이 있다는 사람은 질병불안장애. 신체증상장애는 의학적 설명 유무를 가리지 않아 유방암처럼 실제 질환이 있어도, 증상이 하나여도 비이성적으로 매달리면 진단(교과서 396쪽 증례 2 = 유방암 재발 공포).\n\n📚 학습지 해설: (김형록, 2019) DSM-IV 건강염려증이 DSM-5로 넘어오며 신체증상이 있으면 \"신체증상장애\", 없으면 \"질병불안장애\"로 진단. 신체증상장애: 하나 이상의 신체증상에 대한 오해에 근거해 심각한 질환에 걸렸을 것이라는 생각과 집착으로 일상생활에 어려움이 6개월 이상 – 의학적 설명 유무를 가리지 않고 신체질환이 실제로 있어도, 단 하나의 신체증상이어도 진단 가능한 것이 가장 큰 변화. 질병불안장애: 신체증상이 없는데도 심각한 병이 났을 것이라는 생각만으로 불안·비합리적 질병행동. 이 문제는 \"두통\"이라는 신체증상이 있고 뇌종양 걱정으로 과도한 시간·에너지 소비와 높은 불안이 6개월 이상 → 신체증상장애.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pm-who-2025","area":"야마","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 학습지 「정신신체의학」 224–230쪽","year":"2025 객28","type":"객","rep":1,"repyears":"","stem":"생물심리사회적(biopsychosocial) 모델을 만든 사람은?","choices":["엥겔","셀리에","덴버","프리드만","알렉산더"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/20 8교시): \"역사적 이론은 공부할 필요 없지만 몇 사람은 알아야 한다\" – Alexander(특정 갈등 → 특정 질환 7가지, 특이성 이론), Dunbar(특정 성격 이론), Friedman·Rosenman(A형 성격), Selye(스트레스에 대한 공통 생리 반응, HPA axis), Holmes·Rahe(스트레스 정량화 – 서양은 배우자 사망, 동양은 자식 사망이 1등), Engel(biopsychosocial – \"이 말은 굉장히 중요하다\", 정신의학 전체를 대변).\n\n📚 학습지 해설: (최화영·학습부원, 2025) 신경정신의학 3판 26장 648–649쪽, 탈야·25TY. 출제빈도가 매우 낮은 파트에서 새 문제였지만 강의 중 정신신체의학 몇 사람은 기억해야 한다고 티야 주신 교과서 내용에서 출제. 알렉산더 – 특이성이론, 7가지 내과계질환과 정신적 갈등 / 덴버 – 특정성격이론 / 프리드만·로젠만 – A형 성격, 심혈관계질환 위험 / 셀리에 – 스트레스 모형 / 홈즈·래히 – 스트레스 정량화 측정법 / 엥겔 – 생물심리사회적 모델. 수업시간에 사람 이름을 외워야 한다고 티야로 알려주셨다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pm-kr-2014","area":"야마","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 학습지 「정신신체의학」 224–230쪽","year":"2014 객34","type":"객","rep":1,"repyears":"","stem":"갑자기 말기 암 진단을 받은 환자의 심리적 반응을 기술한 퀴블러-로스의 심리반응 5 단계 중, 가장 처음에 나타나는 것은?","choices":["우울","부정","투사","억압","승화"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 올해 수업에서는 직접 다루지 않음 – 교수님은 암에 대해 정신종양학(psycho-oncology)이 따로 있을 정도로 진단 때부터의 스트레스가 중요하다고 했고, 암 환자의 고통을 distress(↔ eustress)라고 설명했다. 퀴블러-로스 5단계는 교과서 내용: 부정 → 분노 → 타협 → 우울 → 수용.\n\n📚 학습지 해설: (김홍진, 2014) 신경정신의학 13장 정신신체의학과 스트레스. 퀴블러-로스의 암환자 심리반응 5단계: 부정 – 분노 – 타협 – 우울 – 받아들임. 정답 ② 부정.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pm-typea-2013","area":"야마","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 학습지 「정신신체의학」 224–230쪽","year":"2013 객23","type":"객","rep":1,"repyears":"","stem":"40 대 남자가 내과 진료 후 정신건강의학과 외래를 방문하였다. 그는 평소 성격이 매우 급하고 남에게 지기 싫어하고 공격적이며, 화를 잘 내고 적개심이 많다. 또한 과도한 성취욕구로 인해 항상 시간에 쫓긴다. 주위 친구들은 그의 성격을 ‘불같다’, ‘다혈질’이라고 평가한다. 이 남자에서 발생 가능성이 가장 높은 신체질환은?","choices":["과민성대장증후군","류마티스 관절염","관상동맥질환","당뇨병","갑상선기능항진증"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: (양은혜, 2013, 당시 정상근 교수님) 관상동맥질환 – A형 성격: 경쟁적 욕구, 적대적, 증가된 공격성, 야망, 만성화된 조급성, 급성 스트레스(두려움·흥분·급작스런 분노)로 급사할 위험성이 높음. \"밴댕이 같은 놈\". 정답 ③.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pm-th-2013","area":"야마","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 학습지 「정신신체의학」 224–230쪽","year":"2013 객24","type":"객","rep":2,"repyears":"2012 객24","stem":"30 세 회사원이 두통을 주소로 내원하였다. 평소에 성실히 일을 수행했으며 성취 지향적이었다. 최근에 맡은 일이 많아 불안하고 초조했었다. 최근에 큰 스트레스를 받은 후부터 머리에 띠를 누른 듯이 묵직하게 통증이 나타났다. 뇌에는 특이 소견이 없었다. 이때 치료 약물은?","choices":["Propranolol","Cafergot","Sumatriptan","Verapamil","Lorazepam"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/20 8교시, 교과서 661쪽): 편두통은 상대적으로 덜하고 긴장성 두통은 확실히 스트레스와 관련 – 오후에 심하고 뒷목 근육 긴장이 혈관을 눌러 생긴다. 복식호흡 등 이완요법, 안정제(근육이완 효과)로 편해진다 → lorazepam. cafergot·sumatriptan·propranolol·verapamil은 편두통 약.\n\n📚 학습지 해설: (어재은, 2013, 당시 정상근 교수님) 긴장성 두통: 가장 흔한 두통, A형 성격에서 호발, 정서적 스트레스(우울·불안)와 관련, 스트레스가 두경부 근육을 수축시키고 허혈을 초래, 머리에 띠를 두른 듯한 양측성 묵직한 통증, 전구증상 없음, 주말·초저녁에 발생·악화. 치료: 초기(항불안제, 근육이완제, 마사지, 찜질, 항우울제), 만성 시 정신치료, 긴장대처법 교육, 근전도 바이오피드백, 이완기법, 명상, 생활 스타일 변화. lorazepam은 벤조디아제핀(진정·최면·항불안·근이완·항경련). 정답 ⑤.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pm-th-2012","area":"야마","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 학습지 「정신신체의학」 224–230쪽","year":"2012 객24","type":"객","rep":2,"repyears":"2013 객24","stem":"30대 회사 간부가 두통, 불안, 우울을 주증상으로 정신과 외래를 방문하였다. 그는 수일 전부터 회사일 때문에 스트레스를 많이 받아왔다. 두통은 이마 주위를 띠로 두른 듯한 양측성이다. 이 남자에게 적절한 진단명의 초기약물로서 가장 적절한 것은?","choices":["Cafergot","Propranolol","Lorazepam","Verapamil","Sumatriptan"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: (이원동, 2012, 당시 정상근 교수님) 긴장성 두통(이마 주위를 띠로 두른 듯한 양측성, 스트레스) → 초기약물은 항불안제 ③ lorazepam. ① cafergot(ergotamine+caffeine): 편두통 전구기 ② propranolol: 편두통 예방 ④ verapamil: 편두통 예방 ⑤ sumatriptan: 편두통 단기치료. 교과서: 긴장성 두통은 두경부 근육이 스트레스에 반응해 계속 수축 → 허혈, 띠를 두른 듯 양측성, 오후에 심함, 경쟁적 성격 – 초기 항불안제·근육이완제·마사지, 우울하면 항우울제, 바이오피드백·이완·최면. 편두통은 편측성 발작적 혈관성 두통, 오심·구토·광선공포증, 완벽주의적·분노 억제 성격, 전구기 ergot·진통제, 예방 propranolol·verapamil, 단기 sumatriptan(관상동맥질환에선 피함).","exps":[],"ai":"","fl":{}},{"k":"psy-y-pm-ds-2013","area":"야마","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 학습지 「정신신체의학」 224–230쪽","year":"2013 객30","type":"객","rep":2,"repyears":"2012 객25","stem":"40 대 여성이 수년 전부터 내과, 가정의학과, 통증의학과, 재활의학과, 한의원 등을 전전하며 진료를 받아왔다. 그러나 반복적인 진찰과 여러 가지 정밀검사에서 특이 소견이 확인되지 않았다. 그녀가 의사들에게 “내 병명이 뭐에요?” 라고 물러볼 때마다, 해당 병원들의 의사들은 대부분 “신경성 같군요. 조금 더 지켜봅시다.”고 말할 뿐이었다. 이 환자의 질병 특성과 관련된 정신과적 질환으로 옳지 않은 것은?","choices":["신체화장애","동통장애","신체이형장애","건강염려증","강박장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: (윤진희, 2013, 당시 정상근 교수님) 신체형장애와 Doctor Shopping: 대개 정신과 의사보다 내과·일차진료의사를 찾는다. Doctor shopping은 비정상적인 질병행동 – 자신의 병 원인을 신체적으로 보아 불필요한 검사를 반복하고, \"검사상 이상이 없다\"고 해도 안심하지 못하고 다른 의사·유명 병원을 전전. ICD-10 신체형장애: 신체화 장애, 미분화성 신체형 장애, 건강염려증성 장애, 신체형 자율신경계 기능부전, 지속성 신체형 동통장애 등. 정답 ⑤ 강박장애.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pm-ds-2012","area":"야마","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 학습지 「정신신체의학」 224–230쪽","year":"2012 객25","type":"객","rep":2,"repyears":"2013 객30","stem":"의사쇼핑(doctor shopping)과 관련되어 있는 정신과적 질환은?","choices":["우울장애","외상후 스트레스장애","신체화 장애","적응장애","강박장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/20 8교시): 신체증상장애(옛 신체화장애)는 여기저기 아프다며 병원을 전전하고 검사를 반복한다. 치료는 통증을 없애기보다 기능 회복, 정기 방문(regular visit)으로 간격을 점점 늘려 안정시키고 – 갑자기 \"오지 마세요\" 하면 다른 병원을 간다.\n\n📚 학습지 해설: (이윤찬, 2012, 당시 정상근 교수님) 신체형 장애: 신체질환처럼 보이는 정신장애, 합당한 병리 소견 없이 다양한 신체증상, 심리적 요소가 우세, doctor shopping. DSM-5에서는 신체증상관련장애로 통칭(신체증상장애, 질병불안장애, 전환장애 등). 신체화 장애: 다양한 신체증상 호소, 대개 여자, 가족력, 대인관계 장애와 불안·우울 동반, 수술 반복·자살시도. 신체이형장애는 성형외과 doctor shopping과 관련. 교수님 수업 강조 – 신체형 장애 중 신체화 장애가 doctor shopping과 관련. 정답 ③.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pm-ibs-2012","area":"야마","prof":"양종철","sec":"10/20 · 신체증상 및 관련 장애 · 정신신체의학","meta":"근거: 학습지 「정신신체의학」 224–230쪽","year":"2012 객23","type":"객","rep":1,"repyears":"","stem":"40대 여성이 보통, 설사, 변비가 반복되는 증상으로 소화기 내과에서 각종 검사를 받았으나 특별한 병변을 찾지 못하고, 장이 과민해서 발생한 병으로 진단 받고 수개월간 치료를 받았다. 그러나 큰 호전이 없어 정신과 외래를 방문하였다. 이 여성의 진단명에 대한 설명으로 가장 옳은 것은?","choices":["미주신경 활동의 저하","심적 변화로 장운동변화","대장내 전기활동도 저하","관련 사고장애의 치료","70%에서 내과적 문제"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/20 8교시): 소화기계는 대표적인 정신신체 영역 – 스트레스 받으면 소화가 안 되고 과민성 대장 증후군도 생긴다(교과서 652쪽). 세부 기전은 수업에서 다루지 않았다.\n\n📚 학습지 해설: (이용재, 2012, 당시 정상근 교수님) 정신신체장애 소화기계 – 소화성 궤양: 강한 구강적 의존 욕구 좌절로 인한 무의식적 배고픔과 분노, 실제는 유전·스트레스·성격·카페인·니코틴·술·H. pylori 등 복합. 과민성 대장 증후군: 정서적 스트레스에 의해 미주신경 활동이 증가해 증상 발생(심적 변화로 장운동 변화). 역류성 식도염: 심리적 스트레스가 증상 유발. 궤양성 대장염: 강박적 성향에서 스트레스 시 유발·악화, Crohn병 일부는 발병 전 공황장애 관련. 정답 ②.","exps":[],"ai":"","fl":{}},{"k":"psy-pd-01","area":"티야","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 강의록 「2026 성격장애」 2–3쪽 · STT 10/21 1교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"성격장애 진단에 대한 교수님 설명으로 옳은 것은?","choices":["한 번의 일시적 문제 행동으로도 진단한다","성격장애 진단은 성인 이후에 내리며, 성격으로 사회생활 문제가 지속될 때 진단한다","사회적 기능 저하는 진단과 관계없다","성격은 성인기 이후에도 쉽게 바뀌므로 진단하지 않는다","소아에게도 흔히 성격장애 진단을 내린다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 2–3쪽·교수님: 성격은 어릴 때부터 형성되어 성인기에 거의 고정된다. 그래서 미성년자에게는 성격장애 진단을 내리지 않고 성인 이후에 진단한다. 성격 때문에 사회생활에서 여러 문제가 지속적으로 나타날 때 성격장애라 한다.","exps":["지속성이 필요하다.","정답.","임상적 고통·손상이 필요하다.","잘 변하지 않는다.","성인 이후에 진단한다."],"ai":"","fl":{}},{"k":"psy-pd-02","area":"티야","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: STT 10/21 1교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 성격장애 일반 진단기준 A에서 지속적 편향이 2가지 이상 나타나야 하는 영역이 아닌 것은?","choices":["정동","지능","대인관계 기능","인지","충동 조절"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 내적 경험과 행동의 지속적 유형이 문화적 기대에서 현저히 편향되고, 인지·정동·대인관계·충동 조절 4가지 중 2가지 이상에서 나타날 때 진단. 청소년기나 성인기 초기부터 시작하며, 다른 정신질환이나 물질로 설명되지 않아야 한다.","exps":["해당.","정답.","해당.","해당.","해당."],"ai":"","fl":{}},{"k":"psy-pd-03","area":"티야","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 강의록 「2026 성격장애」 3쪽 · STT 10/21 1교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"성격장애를 정의할 때 함께 고려해야 하는 두 가지 요소는?","choices":["급성 발병과 회복","환청과 망상","지능과 학력","지속성과 부적응","유전성과 가족력"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 3쪽·교수님: 지속성(청소년기·초기 성인기에 시작해 여러 상황에서 일관되게 나타나고 잘 변하지 않음)과 부적응(고통과 손상, 직업·사회 기능 저하)을 함께 본다.","exps":["삽화적이면 다른 질환을 생각한다.","정신병 증상이다.","해당 없다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-pd-04","area":"티야","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 강의록 「2026 성격장애」 5쪽 · STT 10/21 1교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"성격장애 환자의 일반적 특성에 대한 교수님 설명으로 옳은 것은?","choices":["주변 사람보다 본인이 더 괴로워한다","대부분 자아이질적이라 스스로 치료를 원한다","스스로 외래를 찾아오는 경우가 가장 흔하다","대개 자아동조적이라 치료 필요성을 잘 못 느낀다","불안장애 환자보다 치료를 더 원한다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 우울·불안·강박 환자는 자아이질적이라 본인이 힘들어 치료를 원하지만, 성격장애 환자는 본인보다 주변 사람이 힘든 경우가 대부분이고 문제를 인식하지 못한다. 법적 문제·사고로 오거나 불면·불안·우울 같은 동반 질환으로 병원에 온다(경계성은 자아이질적인 부분도 있음).","exps":["주변이 더 힘들다.","반대다.","법적 문제·동반 질환으로 온다.","정답.","반대다."],"ai":"","fl":{}},{"k":"psy-pd-05","area":"티야","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 강의록 「2026 성격장애」 4쪽 · STT 10/21 1교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"성격장애 군(cluster)과 특징의 연결로 옳은 것은?","choices":["A군 – 괴상하고 편벽됨","B군 – 괴상하고 편벽됨","C군 – 극적이고 변덕스러움","B군 – 불안하고 의존적임","A군 – 불안하고 겁이 많음"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4쪽·교수님: A군(편집성·조현성·조현형) 괴상하고 현실적이지 않음, B군(반사회성·경계성·히스테리성·자기애성) 극적·감정적·변덕스럽고 정동이 불안정, C군(회피성·의존성·강박성) 불안하고 겁이 많음.","exps":["정답.","A군이다.","B군이다.","C군이다.","C군이다."],"ai":"","fl":{}},{"k":"psy-pd-06","area":"티야","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 강의록 「2026 성격장애」 6쪽 · STT 10/21 1교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"성격장애 치료에 대한 설명으로 옳은 것은?","choices":["장기 정신치료로 사회 적응을 돕고 약물은 보조로 쓴다","약물치료만으로 성격을 바꿀 수 있다","치료 목표는 성격을 완전히 바꾸는 것이다","정신치료는 효과가 없다고 이미 밝혀졌다","성격장애 진단은 첫 면담에서 가볍게 내린다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6쪽·교수님: 한 인간의 성격은 약으로만 조절되지 않는다. 장기간 정신치료로 좋아질 수 있는데, 좋아진다는 것은 사회에 적응하도록 돕는 의미. 정신역동·인지행동·지지 정신치료가 자연 경과보다 빠른 회복과 연관. 충동성·공격성·불안정한 기분·유사 정신병적 경험에는 약물. 진단 자체도 조심스럽게 내린다.","exps":["정답.","약만으로는 안 된다.","적응을 돕는 것이다.","도움이 된다는 보고가 있다.","조심스럽게 내린다."],"ai":"","fl":{}},{"k":"psy-pd-07","area":"티야","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: STT 10/21 1교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"성격장애 환자 정신치료의 원칙으로 교수님이 설명한 것과 다른 것은?","choices":["치료 동기를 위해 다 좋아질 거라고 약속한다","역전이를 조심해서 다룬다","중립적이면서 공감적인 태도","행동의 원인보다 그 행동이 비적응적임을 인식하게 한다","협력자로서의 관계를 맺는다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 중립적·공감적 태도, 역전이 주의, 왜 그랬는지 원인 설명보다 그 행동이 비적응적이고 문제라는 걸 인식시키고 어떻게 대처하면 도움이 되는지 다룬다. 협력 관계와 치료 계약, 치료에 대한 환상을 갖게 해서는 안 되고 선의라도 거짓말하지 않는다. 자기 행동에 책임지게 한다.","exps":["정답. 환상을 주면 안 된다.","원칙이다.","원칙이다.","원칙이다.","원칙이다."],"ai":"","fl":{}},{"k":"psy-pd-08","area":"티야","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 강의록 「2026 성격장애」 8–9쪽 · STT 10/21 1교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"20년째 근무하는 49세 남자가 부하직원들이 자기 눈을 피해 시간만 축낸다고 생각하고, 아내가 다른 남자를 만난다고 의심하며 농담을 받아들이지 못한다. 가장 적절한 성격장애는?","choices":["자기애성 성격장애","조현성 성격장애","강박성 성격장애","편집성 성격장애","반사회성 성격장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 8쪽(증례)·교수님: 타인의 동기를 악의적으로 해석하고 전반적으로 불신·의심해 깊은 관계를 맺지 못한다. 배우자 외도를 의심하기도 한다. 조현병 망상처럼 삽화적이지 않고 성인기 이후 지속된다. 조현병 발생 전에 진단 기준을 만족했으면 \"병전\"을 붙인다.","exps":["과대감이 핵심이다.","관계 자체를 원하지 않는다.","완벽주의가 핵심이다.","정답.","권리 무시·폭력이 핵심이다."],"ai":"","fl":{}},{"k":"psy-pd-09","area":"티야","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 강의록 「2026 성격장애」 10–11·25–26쪽 · STT 10/21 1교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"조현성(schizoid)과 회피성 성격장애를 구별하는 핵심으로 교수님이 설명한 것은?","choices":["조현성은 C군, 회피성은 A군에 속한다","회피성은 기이한 믿음과 마술적 사고가 핵심이다","조현성은 관계를 원하지만 거절이 두려워 피한다","조현성은 관계를 원하지 않고, 회피성은 원하지만 두려워한다","둘 다 친밀한 관계 자체를 원하지 않는다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 조현성은 친밀한 관계를 바라지도 즐기지도 않고 혼자 하는 활동을 택하며 감정 표현이 제한적. 회피성은 관계를 원하지만 사람들에게 어떻게 비칠지 불안해 관계를 맺기 어렵다. 이름이 비슷한 조현형과도 구분해 기억할 것.","exps":["조현성 A군, 회피성 C군.","조현형 설명이다.","회피성 설명이다.","정답.","회피성은 원한다."],"ai":"","fl":{}},{"k":"psy-pd-10","area":"티야","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 강의록 「2026 성격장애」 12–13쪽 · STT 10/21 1교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"카드점·손금을 보며 지내고, 텔레파시로 외계 생명체와 소통한다고 믿으며, 기이한 옷차림을 하고 자기 생일과 같은 번호의 좌석에만 앉는 34세 여성. 가장 적절한 성격장애는?","choices":["조현성 성격장애","편집성 성격장애","조현형 성격장애","강박성 성격장애","히스테리성 성격장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 12–13쪽(증례)·교수님: 조현형은 인지·지각의 왜곡과 괴이한 행동·외모, 관계사고, 문화에 맞지 않는 이상한 믿음(마술적 사고), 제한된 정동, 편집적 성향. 조증 삽화나 조현병처럼 삽화적인지, 지속적으로 생각·행동에 영향을 주는지 감별이 중요.","exps":["기이한 믿음이 없다.","의심이 핵심이다.","정답.","완벽주의가 핵심이다.","관심 끌기가 핵심이다."],"ai":"","fl":{}},{"k":"psy-pd-11","area":"티야","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 강의록 「2026 성격장애」 15–16쪽 · STT 10/21 1교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"반사회성 성격장애 DSM-5 진단 기준으로 옳은 것은?","choices":["18세 이상이고 15세 이전 품행장애가 있어야 한다","자신의 행동에 양심의 가책을 깊이 느낀다","7가지 기준 중 1가지만 충족하면 된다","15세 이상이면 바로 진단할 수 있다","조현병의 경과 중에만 나타나도 진단한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 16쪽·교수님: 15세 이후 시작되는 타인의 권리를 무시하는 양상, 7가지 중 3가지 이상(법 위반, 거짓말·사기, 충동성, 싸움, 무모함, 무책임, 양심의 가책 결여). 최소 18세 이상, 15세 이전 품행장애가 있어야 한다. 사이코패스라 부르는 사람들이 여기에 들어오고, 조현병·양극성장애 경과 중에만 생기면 안 된다.","exps":["정답.","가책이 결여된다.","3가지 이상이다.","18세 이상이다.","그 경과 중에만이면 안 된다."],"ai":"","fl":{}},{"k":"psy-pd-12","area":"티야","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 강의록 「2026 성격장애」 17–18쪽 · STT 10/21 1교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"경계성 성격장애의 특징으로 옳지 않은 것은?","choices":["이상화와 평가절하를 ":"탈야","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 강의록 「2026 성격장애」 31쪽 · STT 10/21 1교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"\"성격장애 주차장\" 그림에서 성격장애와 주차 방식의 연결이 옳지 않은 것은?","choices":["강박성 – 주차선에 완벽하게 맞춰 주차","회피성 – 주차장 구석에 숨듯이 주차","의존성 – 다른 차와 가까이 있는 것을 견디지 못함","히스테리성 – 극적인 효과를 위해 한가운데 주차","반사회성 – 다른 차의 길을 막고 주차"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 31쪽·교수님: 히스테리성은 가운데, 강박성은 완벽한 정렬, 회피성은 구석, 반사회성은 길 막기, 조현형은 은하계 주차. 다른 차와 가까이 있는 걸 견디지 못하는 것은 조현성, 의존성은 다른 차들 사이에서 보호받는 느낌이 필요하다.","exps":["옳다.","옳다.","정답. 조현성이다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-pd-20","area":"탈야","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 강의록 「2026 성격장애」 11·13쪽","year":"","type":"객","rep":1,"repyears":"","stem":"조현성·조현형 성격장애 진단기준을 조현병 발생 전에 이미 만족했을 때 붙이는 것은?","choices":["\"부분 관해\"","\"정신병적 양상 동반\"","\"달리 명시된\"","\"병전(premorbid)\"","\"급성 발병\""],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 11·13쪽 주의점: 조현병·정신병적 양상 동반 기분장애·자폐스펙트럼장애의 경과 중에만 생긴 것은 진단하지 않는다. 조현병 발생 전에 기준을 만족했다면 \"조현성(조현형) 인격장애(병전)\"처럼 \"병전\"을 추가한다.","exps":["해당 없다.","해당 없다.","해당 없다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-y-pd-nar-2025","area":"야마","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 학습지 「성격장애」 14–23쪽","year":"2025 객32","type":"객","rep":1,"repyears":"","stem":"다음 중 자기애성(narcissistic) 성격장애는?","choices":["위법행위","자신의 중요성에 대해 과대한 느낌을 가지며 특별대우받기를 원한다","대인관계에 관심이 없다","버림받는 걸 두려워한다","과시하길 좋아하고 외모에 대한 집착이 크다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/21 STT·강의록 22–23쪽): 자기애성은 자신의 중요성에 대한 과대한 느낌, 특별하다고 믿고 과도한 찬사·특별대우를 원함, 착취적이고 공감 결여. 증례는 \"사람들이 한심하고 내 능력만 이용하고 배신한다\"고 생각하는 45세 남성. 선지는 B군을 섞어 낸다 – ① 위법행위 반사회성, ③ 무관심 조현성, ④ 버림받을 두려움 경계성, ⑤ 과시·외모 히스테리성.\n\n📚 학습지 해설: 2025 박종일 교수님 성격장애 강의록. ① 반사회성 인격장애 ② 자기애성 성격장애(정답) ③ 조현성 성격장애 ④ 경계선 성격장애 ⑤ 히스테리.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pd-nar2-2025","area":"야마","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 학습지 「성격장애」 14–23쪽","year":"2025 객37","type":"객","rep":1,"repyears":"","stem":"자기애성 성격장애(Narcissistic personality disorder)에 대한 주요특징으로 옳은 것은?","choices":["규칙과 법 위반을 자주 위반하고, 위법행동을 보인다.","자신의 중요성을 과대평가하고, 특별대우 받기를 원한다.","타인과의 관계에 있어 불편함을 느끼고, 기이한 사고를 보인다.","감정 변화가 심하고, 버림받는 것에 대한 불안감이 있다.","타인의 감정에 민감하고, 관심을 끌기 위해 과도하게 치장한다."],"ans":[2],"imgs":[],"vis":[],"notes":["복원자: 완벽한 문장 복원은 아니지만 주요 내용은 모두 담음."],"basis":"📚 학습지 해설: 2025 박종일 교수님 성격장애 강의록 p.23. 완벽한 문장 복원은 아니지만 주요 내용은 모두 담았다. 1 반사회성 성격장애, 2 자기애성 성격장애(정답), 3 조현형 성격장애, 4 경계성 성격장애, 5 히스테리성 성격장애. 각 성격장애의 특징을 정확히 알아두면 된다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pd-avd-2023","area":"야마","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 학습지 「성격장애」 14–23쪽","year":"2023 객44","type":"객","rep":5,"repyears":"2022 객49 · 2021 객43 · 2019 객36 · 2016 객38","stem":"38세 여성이 자존심이 쎄고 주장이 강하지만 속으로만 생각하고 내색을 안한다고 한다. 주변사람들 눈치를 많이 보고 밖에 나가는걸 꺼려한다. 이 여성에게서 의심되는 성격장애는?","choices":["편집성 성격장애","조현성 성격장애","의존성 성격장애","회피성 성격정애","자기애성 성격장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 양종철 교수님 personality disorder 강의록, 2022 야마. 편집성: 타인의 동기를 악의가 있는 것으로 해석하고 지속적인 의심과 불신을 가지고 대한다. 조현성: 가족을 포함해 친밀한 관계를 바라지도 즐기지도 않고, 항상 혼자 하는 행위를 선택하며 근본적으로 대인관계를 싫어한다. 의존성: 타인의 과도한 충고·확신 없이는 일상 판단이 어렵고 혼자 있기 불안해 버팀목이 필요하며, 미움을 살까 봐 싫은 일도 자청한다. 회피성: 창피당할까 봐 앞에 나서는 것을 피한다. 대인관계에 대한 열망은 있지만 소극적이고 수치를 당할까 봐 염려하며 눈맞춤을 회피한다. 자기애성: 자신의 중요성에 대한 과대한 느낌, 성취·능력 과장, 적절한 성취 없이 특별대우를 기대하며 대인관계에서 착취적이다. 위의 여성은 회피성 인격장애에 해당.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pd-avd-2022","area":"야마","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 학습지 「성격장애」 14–23쪽","year":"2022 객49","type":"객","rep":5,"repyears":"2023 객44 · 2021 객43 · 2019 객36 · 2016 객38","stem":"29세 여성이 판단력이 빠르지만 속으로만 생각할 뿐 자신의 의견을 잘 표현하지 않는다고 한다. 수줍음이 많아서 밖에 잘 나가지 않는다. 친구들과 어울리고 싶지만 자신이 말을 하면 다른 사람이 비웃거나 무시할까봐 위축된다고 한다. 진단은?","choices":["편집성 인격장애","조현성 인격장애","의존성 인격장애","회피성 인격장애","자기애성 인격장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 편집성: 타인의 동기를 악의가 있는 것으로 해석하고 지속적인 의심과 불신을 가지고 대한다. 조현성: 가족을 포함해 친밀한 관계를 바라지도 즐기지도 않고, 항상 혼자 하는 행위를 선택하며 근본적으로 대인관계를 싫어한다. 의존성: 타인의 과도한 충고·확신 없이는 일상 판단이 어렵고 혼자 있기 불안해 버팀목이 필요하며, 미움을 살까 봐 싫은 일도 자청한다. 회피성: 창피당할까 봐 앞에 나서는 것을 피한다. 대인관계에 대한 열망은 있지만 소극적이고 수치를 당할까 봐 염려하며 눈맞춤을 회피한다. 자기애성: 자신의 중요성에 대한 과대한 느낌, 성취·능력 과장, 적절한 성취 없이 특별대우를 기대하며 대인관계에서 착취적이다. 사람을 피하는 증상을 보이는 인격장애는 조현성과 회피성이 있고, 두 인격장애의 감별은 교수님께서도 강조하신 부분이다. 조현성은 대인관계에 대한 관심 자체가 없고, 회피성은 사람을 사귀고 싶은 마음은 있다. 위 환자는 어울리고 싶지만 창피를 당할까 봐 위축되므로 회피성.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pd-avd-2021","area":"야마","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 학습지 「성격장애」 14–23쪽","year":"2021 객43","type":"객","rep":5,"repyears":"2023 객44 · 2022 객49 · 2019 객36 · 2016 객38","stem":"27세 여성은 어릴 때부터 부끄러움이 많아서 사람들 앞에서는 것을 힘들어 했다. 사람들을 사귀고는 싶지만 거절당할까봐 위축되어버린다. 알바도 편한 것만 하고 만일 손님을 봐야 할 상황이면 다른 알바를 부른다. 이 여성에게서 의심되는 인격장애는?","choices":["의존성 인격장애","히스테리성 인격장애","경계성 인격장애","강박성 인격장애","회피성 인격장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님: 조현성은 스스로 관계를 바라지 않고 혼자 하는 활동을 택하며 감정 표현도 제한적이다. 회피성은 관계를 원하지만 자신이 사람들에게 어떻게 비칠지 불안해서 관계를 맺기 어렵다 – 두 장애를 구분해서 기억하라고 했다. 강의록 25–26쪽 증례(연주 반응에 크게 상처받고, 꼭 필요한 아르바이트도 거절될까 봐 지원하지 못하는 음대생)도 회피성. → \"어울리고 싶은데 창피·거절이 두려워 위축\" = 회피성.\n\n📚 학습지 해설: (박종일 교수님 출제) 주어진 정보로는 사람을 피하고 있는데 이는 조현성, 회피성에서 흔히 나타나는 증상이다. 이 여성은 사람을 사귀고 싶어 하는 마음이 있으므로 조현성보다는 회피성 인격장애로 볼 수 있다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pd-avd-2019","area":"야마","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 학습지 「성격장애」 14–23쪽","year":"2019 객36","type":"객","rep":5,"repyears":"2023 객44 · 2022 객49 · 2021 객43 · 2016 객38","stem":"27세 여성이 평소에 친구들을 사귀고 싶지만 자기가 말하는 것이 바보처럼 들릴까봐 위축되버린다. 원래 알고 있던 사이나 친한 친구들과는 대화하는데 아무 거리낌이 없다고 한다.이 여성에게 의심되는 인격장애 유형은?","choices":["의존성 인격장애","조현성 인격장애","히스테리성 인격장애","회피성 인격장애","자기애성 인격장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 양종철 교수님 인격장애. 양종철 교수님은 10문제를 다 집어 주셨다(교수님별 10문제, 총 50문제). \"인격장애의 여러 종류 중에서 조현성 인격장애와 회피성 인격장애를 감별할 줄 알아야 한다.\" \"조현성 인격장애는 사회적 활동을 피하고 집에만 있으려 하고, 회피성 인격장애는 사회적 대인관계에 대한 열망이 있지만 수줍어한다.\" 기존에 매우 비슷한 문제가 출제되었다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pd-avd-2016","area":"야마","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 학습지 「성격장애」 14–23쪽","year":"2016 객38","type":"객","rep":5,"repyears":"2023 객44 · 2022 객49 · 2021 객43 · 2019 객36","stem":"27세 여성이 평소에 자존심이 강하고 판단력이 빠름에도 창피를 당할까봐 속으로만 생각한다. 평소에 친구들을 사귀고 싶지만 자기가 말하는 것이 바보처럼 들릴까봐 위축되버린다. 친구들은 이 여성을 평소에 소심하고 부끄러움을 많이 타는 사람으로 생각하고 있다한다. 이 여성에게 의심되는 인격장애 유형은?","choices":["의존성 인격장애","조현성 인격장애","히스테리성 인격장애","회피성 인격장애","자기애성 인격장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 정신과 양종철 교수님 \"인격장애\" 강의록, KMLE. 회피성 인격장애: 확고한 보장 없는 한 대인관계 회피, 거절과 배척에 대한 극도의 예민성, 사회적 위축 – 내적으로는 친밀한 관계를 원한다. 여성에 많고 사회공포증 동반 가능. 감별: 조현성 인격장애는 혼자 있을뿐더러 대인관계에 대한 관심도 부족하다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pd-szd-2020","area":"야마","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 학습지 「성격장애」 14–23쪽","year":"2020 객43","type":"객","rep":2,"repyears":"2013 객13","stem":"35세 남자가 주변 사람들과 잘 어울리지 않는다고 아내가 데려와 병원에 왔다. 직장에서도 혼자 하는 일은 잘 해냈지만 다른 동료들과는 잘 지내지 못했다. 잘 지내려는 의욕이 없었고 성관계도 적었고 혼자 있는 걸 좋아했다. 이사람의 인격장애 유형은?","choices":["회피성 인격장애","반사회성 인격장애","편집성 인격장애","조현성 인격장애","조현형 인격장애"],"ans":[4],"imgs":[],"vis":[],"notes":["복원자: ④⑤ 외의 선지는 임의로 적음."],"basis":"🎓 올해 수업 기준: 교수님(10/21 STT): 32세 남자 증례(어려서부터 친구 없음, 가족에게도 친밀감 없음, 퇴근 후 혼자 TV·게임, 이성 교제 경험 없고 \"친밀한 관계를 맺고 싶지 않다\") = 조현성. 조현형과 이름이 비슷하니 구분해 기억하라고 했다. 조현성은 관계 자체를 바라지 않고, 회피성은 관계를 원하지만 비칠 모습이 불안해 못 맺는다. 이 문제의 \"잘 지내려는 의욕이 없다\"가 결정적.\n\n📚 학습지 해설: 박종일 교수님 2020 성격장애 PPT 10쪽. 모든 글자를 완벽하게 복원하진 못했으나 내용은 거의 일치, 보기는 ④⑤ 외에는 임의로 적었다. #문제의 키워드: 주변 사람들과 잘 어울리지 않음, 잘 어울릴 의욕이 없음. #해설: 정답 ④ 조현성 인격장애는 주변 사람들과 잘 지내지 않으며 잘 지내고 싶은 마음이 없다 – ① 회피성(잘 지내고 싶은데 잘 못 지냄)과의 감별점. 교수님 PPT 예시 정리 – A군: 편집성(다른 사람·아내 의심), 조현성(사교성 부족, 어울리고 싶은 마음 없음), 조현형(가까운 관계 없음, 외계인 등 이상한 믿음) / B군: 반사회성(폭력·협박), 경계성(자해, 헤어지는 것이 두려움), 연극성(짙은 화장, 유혹적), 자기애성(다른 사람 한심, 난 똑똑해) / C군: 회피성(비판이 무서워 회피, 친밀한 관계는 갖고 싶음), 의존성(어머니한테 계속 전화, 남 의견 따름), 강박성(계획대로 안 되면 분노, 완벽).","exps":[],"ai":"","fl":{}},{"k":"psy-y-pd-szd-2013","area":"야마","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 학습지 「성격장애」 14–23쪽","year":"2013 객13","type":"객","rep":2,"repyears":"2020 객43","stem":"다음 중 분열성 인격장애의 특징이 아닌 것은?","choices":[" 장애","자기애성 성격장애","반사회성 성격장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/21 STT): 대인관계·자아상·정동의 불안정과 현저한 충동성이 성인기 초기부터 – 버림받는 것에 대한 두려움 때문에 미친 듯이 노력하고, 사람을 극단적으로 이상화하거나 평가절하한다. 정체성 장애, 충동성, 자해, 정동 불안정, 만성적 공허감, 분노 조절 곤란, 스트레스 시 피해사고·해리. 강의록 17쪽 증례(중2 때 성폭행, 가정폭력, 남자친구와 다툰 뒤 술 마시고 손목 자해)처럼 어린 시절 학대력과 물질남용 동반이 흔하다. 대상관계 이론으로 설명 – 좋고 나쁨을 통합하지 못해 splitting과 투사를 주로 쓴다.\n\n📚 학습지 해설: 신경정신의학 교과서 p.624. <경계성 성격장애 DSM-5 진단기준> 대인관계·자아상·정동의 불안정성과 현저한 충동성이 성인기 초기에 시작, 다음 중 5가지 이상: 1. 실제 혹은 상상 속에서 버림받지 않기 위해 미친 듯이 노력 2. 과대이상화와 과소평가의 극단을 반복하는 불안정하고 격렬한 대인관계 3. 정체성 장애 4. 자신을 손상할 수 있는 2가지 이상의 충동성(소비, 물질 남용, 좀도둑질, 부주의한 운전, 과식 등) 5. 반복적 자살 행동·제스처·위협·자해 6. 현저한 기분 반응성으로 인한 정동 불안정 7. 만성적인 공허감 8. 부적절하고 심한 분노·조절 곤란 9. 일시적·스트레스 연관 피해적 사고 혹은 심한 해리 증상. 정답 ③.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pd-bpd-2014","area":"야마","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 학습지 「성격장애」 14–23쪽","year":"2014 객33","type":"객","rep":3,"repyears":"2017 객37 · 2012 객15","stem":"29세 여성이 대인관계에서 거절에 대해 매우 두려워하고, 혼자 남겨질 때는 공허함과 우울함을 느끼다가 자살시도를 반복하며, 타인에 대한 갑작스러운 이상화 및 평가절하를 반복하는 불안정한 대인관계를 지속적으로 나타내고 있다. 이 사람의 인격유형은?","choices":["편집성 인격","분열성 인격","경계성 인격","자기애적 인격","반사회성 인격"],"ans":[3],"imgs":[],"vis":[],"notes":["복원자: 비슷하게 복원."],"basis":"📚 학습지 해설: 신경정신의학 p368–370. 비슷하게 복원. <경계성 인격장애의 임상양상> 충동성, 자제력 부족, 만성적 공허감, 자살 및 자해행위. 정서·행동·대인관계의 불안정과 주체성의 혼란으로 모든 면에서 변동이 심함, 신경학적 장애와 정신병적 장애의 경계선, 실제 혹은 상상의 버림받음을 피하기 위해 미친 듯이 노력, 과대이상화와 과소평가 사이를 오가는 불안정한 대인관계, 자살·자해, 만성적 공허감(히스테리 성격에서는 드묾), 부적절한 분노, 일시적·스트레스 연관 피해사고 혹은 해리. 반사회적 인격장애와 달리 본질적으로 남을 해치지는 않으며 짧은 기간 psychotic 증상이 나타나기도 한다. 정답 ③.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pd-bpd-2012","area":"야마","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 학습지 「성격장애」 14–23쪽","year":"2012 객15","type":"객","rep":3,"repyears":"2017 객37 · 2014 객33","stem":"28세 여자가 남자친구에게 버림을 받을까봐 걱정되어서 자해를 하여 내원하였다. 어린 시절에 양아버지에게 성학대를 당했다. 평소 매일 술에 취해 쉽게 아무 남자와 잠자리를 가졌다. 인생이 허무하다며 자살을 시도한 적이 여러 번 있었다. 이 환자에 해당하는 인격장애는?","choices":["편집성","히스테릭","의존성","경계성","강박성"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 2013 KMLE 294page 03번 문제와 동일. 자해·자살행위를 하고 여러 남자들과 잠자리(자제력 부족), 갑자기 화를 냄(충동성, 정서적 불안정) – 경계성 인격장애의 전형적인 환자. 자해·자살행위를 보이는 환자의 경우 경계성을 가장 먼저 의심해야 한다. 경계성은 B군(히스테리성·자기애적·반사회적과 함께)이며 B군 다른 질환과 동반 가능성이 높다. 특징: 자기 평가·정체성·정서·타인 평가의 극도의 불안정, 자제력 부족, 충동성, 행동 예측 불능, 자해·자살 행위, 주요우울증 합병, 여성에 많고 가족력. 원인: Kernberg(발달 초기 어머니와의 양가감정, splitting), Mahler & Masterson(분리개별화 장애), Gunderson. 치료: 분석적 정신치료(역전이 조절), 인지행동치료, 대증적 약물치료(우울증에 항우울제, 기분변동에 리튬·카바마제핀).","exps":[],"ai":"","fl":{}},{"k":"psy-y-pd-bpd2-2013","area":"야마","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 학습지 「성격장애」 14–23쪽","year":"2013 객14","type":"객","rep":1,"repyears":"","stem":"다음 중 경계성 인격장애 (Borderline personality disorder)에 대한 특징이 아닌 것은 무엇인가?","choices":["대인관계가 불안정하고 극단적이다.","감정을 자제하지 못하고 충동적으로 화를 낸다.","자살, 위협 등의 행위를 자주 한다.","다른 사람을 칭찬하지 않고, 항상 비난만 한다.","인생에 대한 허무함과 공허함을 자주 느낀다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 신경정신의학 p368–370. <경계성 인격장애의 임상양상> 충동성, 자제력 부족, 만성적 공허감, 자살 및 자해행위, 실제 혹은 상상의 버림받음을 피하기 위해 미친 듯이 노력, 과대이상화와 과소평가의 극단을 오가는 불안정한 대인관계. 정답 ④: 항상 비난만 하는 것이 아니다. 예측 불가능한 충동성이 특징 – 평소 지지적이고 다정하다가도 일상적인 분쟁이나 불일치가 있으면 과민반응을 보여 극도로 우울해지고 화를 내며 상처받는다. 즉, 왔다 갔다 한다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pd-cls-2013","area":"야마","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 학습지 「성격장애」 14–23쪽","year":"2013 객12","type":"객","rep":1,"repyears":"","stem":"다음 인격장애 중 C군에 속하는 인격장애는?","choices":["편집성 인격장애","경계성 인격장애","자기애성 인격장애","분열형 인격장애","회피성 인격장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/21 STT·강의록 4쪽): A군(편집성·조현성·조현형) 괴상하고 현실적이지 않음, B군(반사회성·경계성·히스테리성·자기애성) 극적·감정적·변덕스러움, C군(회피성·의존성·강박성) 불안하고 겁이 많음. 교수님은 C군을 \"피하거나 의존하거나 강박적이고, 불안·두려움이 많은\" 군으로 설명.\n\n📚 학습지 해설: 신경정신의학 교과서 p.357 인격장애 표16-1. 정답: ⑤ 회피성 인격장애.","exps":[],"ai":"","fl":{}},{"k":"psy-y-pd-ocpd-2012","area":"야마","prof":"박종일","sec":"10/21 · 성격장애","meta":"근거: 학습지 「성격장애」 14–23쪽","year":"2012 객16","type":"객","rep":1,"repyears":"","stem":"다음 중 강박성 인격장애에 대해 맞게 설명한 것은?","choices":["대부분 융통성이 없다.","Freud 정신발달 단계 중 구강기와 관련이 있다.","지나치게 강한 자아를 가지고 있다.","시간이 지나면 대부분 강박장애로 발전한다.","대인관계에 전혀 문제가 없다."],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 정신의학 강의록, 두산백과. 강박성 인격장애: 결단력이 부족하고 감정이 없는 일에 몰두. 질서정돈주의, 완벽주의, 마음과 대인관계의 통제가 특징이라 ① 융통성이 없고 개방성과 효율성이 상실되어 있다(정답). ② Freud에 따르면 생후 2–4세 대소변 가리기 훈련 과정의 갈등(항문기)을 해결하지 못한 경우 – 구강기가 아니다. ④ 성장하며 온화한 성인이 되기도 하고 정신분열증·강박장애·정신신체장애·갱년기 우울증으로 발전하기도 한다(대부분 강박장애로 가는 것은 아님). ⑤ 대인관계는 수평적이기보다 지배와 복종 관계로 유지되고 자신의 행동이 남을 얼마나 괴롭히는지 모른다. 비판에 지나치게 민감하고, 완벽주의가 좌절되면 쉽게 우울증에 빠진다.","exps":[],"ai":"","fl":{}},{"k":"psy-di-01","area":"티야","prof":"박종일","sec":"10/21 · 해리장애","meta":"근거: 강의록 「2026-해리장애」 2–3쪽 · STT 10/21 2교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"해리(dissociation)에 대한 설명으로 옳은 것은?","choices":["생명을 위협하는 외상과는 관련이 없다","장기적으로는 외상 극복을 적극적으로 돕는다","정신 활동 일부를 분리시키는 무의식적 방어기제다","의식적으로 기억을 숨기려는 의도적 행동이다","만성화되면 해마 용적이 오히려 늘어난다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 2–3쪽·교수님: 해리는 스트레스·갈등이나 생명을 위협하는 외상을 벗어나기 위한 무의식적 방어기제. 외상 기억을 회피하게 하지만 장기적으로는 외상 극복 자체를 회피하게 된다. 생물학적으로는 과도한 신경전달물질·펩티드가 편도·해마에 영향을 주어 회상을 방해하고, 만성화되면 해마 등 용적이 감소한다.","exps":["외상에 대한 방어로도 생긴다.","극복을 회피하게 한다.","정답.","무의식적이다.","용적이 감소한다."],"ai":"","fl":{}},{"k":"psy-di-02","area":"티야","prof":"박종일","sec":"10/21 · 해리장애","meta":"근거: 강의록 「2026-해리장애」 6쪽 · STT 10/21 2교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"해리장애 중 임상에서 가장 흔한 형태로 교수님이 언급한 것은?","choices":["해리성 기억상실","이인성장애","해리성 둔주","비현실감장애","해리성 주체장애"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 가장 흔한 형태는 해리성 기억상실(예전 이름 정신적 기억상실, psychogenic amnesia). 해리성 주체장애는 매우 드물어 교수님도 실제로 본 적이 없다고 했다.","exps":["정답.","흔하지 않다.","기억상실의 세부 명시다.","흔하지 않다.","매우 드물다."],"ai":"","fl":{}},{"k":"psy-di-03","area":"티야","prof":"박종일","sec":"10/21 · 해리장애","meta":"근거: 강의록 「2026-해리장애」 10–17쪽 · STT 10/21 2교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"해리성 기억상실을 진단할 때 교수님이 \"가장 중요하다\"고 한 것은?","choices":["최면으로 기억을 되살려 보는 것","즉시 항우울제를 투여해 보는 것","해리장애 가족력을 먼저 확인하는 것","지능검사로 인지 수준을 평가하는 것","기질적 원인·물질을 먼저 배제하는 것"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 갑자기 기억을 못 한다고 오면 우선 여러 검사로 기질적 원인(뇌 MRI·뇌파 등)과 물질 사용을 배제하는 것이 첫 번째. 그 뒤에 다른 원인이 없을 때 해리성 기억상실로 진단한다.","exps":["치료 기법이다.","진단 전 단계가 아니다.","진단의 핵심은 아니다.","해당 없다.","정답."],"ai":"","fl":{}},{"k":"psy-di-04","area":"티야","prof":"박종일","sec":"10/21 · 해리장애","meta":"근거: 강의록 「2026-해리장애」 6·13쪽 · STT 10/21 2교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"해리성 기억상실과 일상적 건망증·치매의 차이로 옳은 것은?","choices":["해리성 기억상실은 언어·주의력 장애가 두드러진다","해리성 기억상실은 서서히 진행한다","해리성 기억상실은 스트레스 뒤 갑자기 생긴다","건망증은 스트레스와 밀접하다","치매는 개인 정보만 선택적으로 잊는다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6·13쪽·교수님: 일상적 건망증은 양성이고 스트레스와 무관. 해리성 기억상실은 범위가 훨씬 넓고 스트레스 사건 뒤 갑자기 발생. 치매·섬망·의학적 상태는 언어·주의력·행동 등 광범위한 인지 문제가 함께 보이고, 치매는 서서히 진행한다.","exps":["다른 인지는 대개 정상이다.","갑자기 생긴다.","정답.","무관하다.","광범위한 인지 문제가 있다."],"ai":"","fl":{}},{"k":"psy-di-05","area":"티야","prof":"박종일","sec":"10/21 · 해리장애","meta":"근거: 강의록 「2026-해리장애」 11쪽 · STT 10/21 2교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"자신의 정체성이나 중요한 개인 정보를 잊고 목적을 가진 듯 여행하거나 방황하는 경우 해리성 기억상실에 붙이는 명시자는?","choices":["비현실감","이인증","해리성 둔주","가성경련","일과성 전반성 기억상실"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 11쪽·교수님: 해리성 둔주(with dissociative fugue) – 흔하지는 않다. 평소 생활하지 않던 곳에서 발견되기도 한다.","exps":["환경이 낯선 느낌이다.","자신에게서 분리된 느낌이다.","정답.","해리성 경련이다.","신경학적 질환이다."],"ai":"","fl":{}},{"k":"psy-di-06","area":"티야","prof":"박종일","sec":"10/21 · 해리장애","meta":"근거: 강의록 「2026-해리장애」 16쪽 · STT 10/21 2교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"일과성 전반성 기억상실(TGA)이 해리성 기억상실과 다른 점으로 옳지 않은 것은?","choices":["발생 전 스트레스가 선행하는 일은 없다","대개 수 시간 내에 회복된다","대개 50세 이상이며 뇌혈관질환 위험인자가 있다","기억상실을 스스로 인지하고 불안해한다","개인적 정체성에 관한 기억은 보존된다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 16쪽·교수님: TGA도 증상 전에 스트레스 상황이 있다고 보고하는 경우가 있어 해리성 기억상실로 오인될 수 있다. 갑작스러운 전향·후향 기억상실, 정체성 기억은 보존, 기억상실 인지·불안, 신경학적 이상 없음, 단시간 회복 – 영상 등으로 확인 필요.","exps":["정답. 스트레스가 선행할 수 있어 오인된다.","옳다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-di-07","area":"탈야","prof":"박종일","sec":"10/21 · 해리장애","meta":"근거: 강의록 「2026-해리장애」 14쪽 · STT 10/21 2교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"해리성 기억상실의 감별에서 전기경련치료(ECT)로 인한 기억상실의 특징으로 옳은 것은?","choices":["뇌 영상에서 반드시 출혈이 보인다","기억상실은 항상 영구적으로 남는다","ECT는 기억에 전혀 영향을 주지 않는다","ECT 전·시행 중의 기억이 소실되고 외상과 무관하다","외상 경험과 관련된 기억만 선택적으로 잃는다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 14쪽: ECT도 현저한 일시적 기억상실을 일으키고 일부는 지속되기도 하지만, 외상과 관련되지 않고 보통 ECT 전이나 시행 중의 기억이 소실된다. 교수님도 ECT 부작용으로 일시적 기억상실을 볼 수 있다고 언급.","exps":["해당 없다.","대개 일시적이다.","일시적 기억상실을 일으킨다.","정답.","외상과 무관하다."],"ai":"","fl":{}},{"k":"psy-di-08","area":"티야","prof":"박종일","sec":"10/21 · 해리장애","meta":"근거: 강의록 「2026-해리장애」 19–20쪽 · STT 10/21 2교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"해리성 기억상실의 치료로 강의록과 교수님이 제시한 것이 아닌 것은?","choices":["비슷한 환자를 모은 그룹 정신치료","기억이 돌아올 때까지 반복적인 뇌 MRI 촬영","약물 매개 면담(sodium amobarbital 등)","외상 관련 인지 왜곡을 다루는 인지치료","최면"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 19–20쪽·교수님: 인지치료(외상 관련 장애에서 특히 효과), 그룹 정신치료(참전용사·학대 아동에서 효과 보고), 약물 매개 면담, 최면. 불안·죄책감·수치심 같은 감정 반응을 다뤄 주는 것이 중요.","exps":["제시됨.","정답.","제시됨.","제시됨.","제시됨."],"ai":"","fl":{}},{"k":"psy-di-09","area":"티야","prof":"박종일","sec":"10/21 · 해리장애","meta":"근거: 강의록 「2026-해리장애」 21쪽 · STT 10/21 2교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"해리성 기억상실의 경과에 대한 설명으로 옳은 것은?","choices":["반드시 요양 시설에 입소한다","외상 환경에서 벗어나면 저절로 회복되는 경우가 많다","경과가 잘 연구되어 예후가 명확하다","치매로 진행한다","모두 영구적으로 지속된다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 21쪽·교수님: 경과에 대해 알려진 것은 거의 없다(최근 연구가 적고 환자가 병원에 계속 다니지 않음). 급성은 외상·압도적 환경에서 벗어나면 자연스럽게 회복되는 경우가 많고, 일부는 만성화되어 요양원 등 돌봄이 필요해진다.","exps":["일부만 그렇다.","정답.","알려진 것이 거의 없다.","해당 없다.","자연 회복이 흔하다."],"ai":"","fl":{}},{"k":"psy-di-10","area":"티야","prof":"박종일","sec":"10/21 · 해리장애","meta":"근거: 강의록 「2026-해리장애」 23–30쪽 · STT 10/21 2교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"해리성 주체장애에 대한 설명으로 옳은 것은?","choices":["아동기 외상 경험과는 관련이 거의 없다","둘 이상의 구별되는 인격 았고 1/3 정도에서 외상 스트레스가 유발 요인. 일시적이면 안심시키기만으로 호전, 만성 환자는 적응해서 병원에 오지 않기도 한다. 계속 찾아오는 환자는 오히려 심해서 치료 반응이 나쁜 경우가 많다. 동반 장애가 좋아지면 함께 호전.","exps":["정답.","도움이 되기도 한다.","반응이 나쁜 경우가 많다.","함께 호전되기도 한다.","밝혀지지 않았다."],"ai":"","fl":{}},{"k":"psy-y-di-amn-2023","area":"야마","prof":"박종일","sec":"10/21 · 해리장애","meta":"근거: 학습지 「해리장애」 237–241쪽","year":"2023 객43","type":"객","rep":7,"repyears":"2022 객48 · 2017 객39 · 2016 객39 · 2015 객35 · 2014 객30 · 2011 객27","stem":"대뇌 손상에 의한 기억상실이 아닌 해리성 기억상실에서 주로 보이는 소견은?","choices":["인지장애와 운동장애가 동반된다.","심리적 스트레스와 연관성이 있다.","자전거 타기, 악기 연주와 같은 능력은 상실된다.","완전히 회복되는 경우는 거의 없다.","선행성 기억상실이 대부분이다."],"ans":[2],"imgs":[],"vis":[],"notes":["선지만 바꿔 계속 나오는 문제(복원자)."],"basis":"🎓 올해 수업 기준: 교수님(10/21 STT·강의록): 해리는 스트레스·갈등이나 외상을 벗어나기 위한 무의식적 방어기제. 해리성 기억상실은 가장 흔한 해리장애로 스트레스 사건 뒤 갑자기 생기고, 중요한 개인 정보를 회상하지 못하지만 새 학습·일반 지식·지남력은 유지된다. 진단에서 가장 중요한 것은 먼저 뇌 MRI·뇌파 등으로 기질적 원인과 물질을 배제하는 것. 치매·섬망·의학적 상태는 광범위한 인지 문제가 함께 있고 서서히 진행한다.\n\n📚 학습지 해설: 양종철 교수님 해리장애 ppt, 정신의학 교과서 382p. 야마에 여러 번 출제된 문제. 대뇌 손상에 의한 기억상실과 해리성 기억상실은 구분해야 한다. 해리 증상은 주로 스트레스나 갈등을 벗어나기 위한 방어기제로 발생한다. 해리성 기억상실은 물질·신경학적·의학적 상태로 인한 기억상실을 제외하고, 뇌 손상과 달리 기억은 존재하지만 마음 속 깊이 묻혀 회상되지 않는 상태. 기억상실 동안 신체형·전환 증상, 의식 변화, 이인화, 현실감 상실, 트랜스 상태, 자발적 퇴화 등을 보일 수 있다. 정답 ②.","exps":[],"ai":"","fl":{}},{"k":"psy-y-di-amn-2022","area":"야마","prof":"박종일","sec":"10/21 · 해리장애","meta":"근거: 학습지 「해리장애」 237–241쪽","year":"2022 객48","type":"객","rep":7,"repyears":"2023 객43 · 2017 객39 · 2016 객39 · 2015 객35 · 2014 객30 · 2011 객27","stem":"대뇌손상에 의한 기억상실보다는 해리성 기억상실에서 주로 보이는 소견은?","choices":["발병과 종결에서 심리적 스트레스와는 연관성이 희박하다.","자전거 타는 방법, 악기 연주 등과 같은 기술은 유지된다.","서서히 좋아지고 완전히 회복되는 경우는 없다.","지남력 장애가 있다.","선행성 기억상실이 대부분이다."],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 양종철 교수님 해리장애 강의록. 선지만 바뀌고 계속 출제된 문제. 해리성 기억상실 1) 유발인자: 외상이나 스트레스와 관련된 사건, 아동기 학대, 상해나 죽음의 위협, 중요한 인물·대상의 상실, 심한 수치심. 2) 임상양상: 쉽게 기억할 수 있는 중요한 개인 정보를 회상하지 못함, 대부분 기억상실이 있음을 인지하지 못함, 스트레스가 심했거나 상처가 큰 사건에 대한 기억을 retrograde하게 망각(후향적 기억상실), 새로운 정보를 학습하는 능력과 일반 지식은 유지되어 지남력 장애 없음, 갑작 며 회복이 가능하다(⑤ 틀림 – 11야마에는 \"선행성 기억상실이 대부분\"이 정답으로 되어 있는데 잘못된 풀이 같고, 11야마 답은 ④인 것 같다).","exps":[],"ai":"","fl":{}},{"k":"psy-y-di-amn-2011","area":"야마","prof":"박종일","sec":"10/21 · 해리장애","meta":"근거: 학습지 「해리장애」 237–241쪽","year":"2011 객27","type":"객","rep":7,"repyears":"2023 객43 · 2022 객48 · 2017 객39 · 2016 객39 · 2015 객35 · 2014 객30","stem":"의학적 질환이나 물질의 효과에 의한 기억상실이기 보다는 해리성 기억상실에서 주로 보이는 소견은?","choices":["발병과 종결이 심리적 스트레스와 연관성이 희박하다.","기억상실이 장기 기억보다는 단기 기억에 대한 손상이 심각하다.","아주 서서히 회복되고 환전히 회복되는 경우는 거의 없다.","집중력 장애와 지남력 장애가 거의 없다.","선행성 기억상실이 대부분이다."],"ans":[],"imgs":[],"vis":[],"notes":["⚠ 정답 확인 필요: 학습지 정답 칸은 ⑤(선행성 기억상실)인데, 해리성 기억상실은 후향성이 대부분이고 2014 복원자도 이 해 답은 ④(집중력·지남력 장애가 거의 없다)일 것이라고 지적.","학습지 정답 그대로는 채점하지 않고, 확인되면 반영할게요.","복원 불완전·확인 필요 문항이라 정답 자동 채점은 하지 않아요."],"basis":"🎓 올해 수업 기준: 교수님(10/21 STT·강의록): 해리는 스트레스·갈등이나 외상을 벗어나기 위한 무의식적 방어기제. 해리성 기억상실은 가장 흔한 해리장애로 스트레스 사건 뒤 갑자기 생기고, 중요한 개인 정보를 회상하지 못하지만 새 학습·일반 지식·지남력은 유지된다. 진단에서 가장 중요한 것은 먼저 뇌 MRI·뇌파 등으로 기질적 원인과 물질을 배제하는 것. 치매·섬망·의학적 상태는 광범위한 인지 문제가 함께 있고 서서히 진행한다. 올해 강의록 기준으로도 해리성 기억상실은 후향성이고 집중력·지남력 장애가 드물다 → 학습지 정답 ⑤(선행성)와 맞지 않아 ④로 보인다.\n\n📚 학습지 해설: (복원자 해설, 정답 ⑤) 신경정신의학 265–266p, 정상근 교수님. 해리성 기억상실증: 심리적 원인, 일상적 망각 수준이 아님, 신체 질환 없음, 스트레스·외상과 관련, \"선행성 기억상실이 대부분이다 ⑤\" – 책에 나오진 않지만 교수님이 p267 임상증례를 강조했고, 증례에서 충격적 사건 이후의 일을 주로 기억 못했으므로 선행성 같다고 추정. 해리성 둔주 감별: 발병·종결이 심인성 스트레스와 연관성 희박①, remote보다 recent 기억 손상②, 서서히·불완전 회복③, 집중력·지남력·정동 장해는 해리장애에서 드묾④. 역행(retrograde) 기억상실 = 원인 이전 일을 기억 못함, 전향(anterograde) = 선행성 = 원인 이후 일을 기억 못함. (2014 복원자는 이 해 답이 ④일 것이라고 지적)","exps":[],"ai":"","fl":{"warn":1,"chk":1,"inc":1}},{"k":"psy-y-di-dd-2021","area":"야마","prof":"박종일","sec":"10/21 · 해리장애","meta":"근거: 학습지 「해리장애」 237–241쪽","year":"2021 객50","type":"객","rep":1,"repyears":"","stem":"다음 중 해리성 기억상실의 진단을 위해 감별해야 할 상태는? 가. 급성 스트레스 장애(Acute stress disorder) 나. 물질(substance) 사용에 의한 의학적 상태 다. 대뇌 혈관질환(Cerebral vascular attack) 라. 일과성 전기억상실(Transient global amnesia)","choices":["가, 나, 다","가, 다","나, 라","라","가, 나, 다, 라"],"ans":[5],"imgs":[],"vis":[],"notes":["박종일 교수님 출제(복원자)."],"basis":"🎓 올해 수업 기준: 교수님(10/21 STT·강의록 13–16쪽): 해리성 기억상실 진단은 먼저 기질적 원인(뇌 MRI·뇌파)과 물질을 배제하는 것이 첫 번째. 감별: 치매·섬망·의학적 상태, 뇌혈관 질환, 코르사코프, 수술 후, 경련 장애, ECT(외상과 무관한 일시적 기억상실), 일과성 전반성 기억상실(TGA – 스트레스 후 생기기도 해 오인될 수 있으나 정체성 기억 보존·단시간 회복). DSM-5 기준상 PTSD·급성 스트레스 장애·해리성 정체성 장애로 잘 설명되지 않아야 한다 → 가·나·다·라 모두.\n\n📚 학습지 해설: \"해리장애\" 강의록 중 \"해리성 기억상실\"(박종일 교수님). 강의록 전반적으로 퍼져 있던 내용 – 이렇게 내실 줄 몰랐다. 해리성 기억상실 DSM-5 진단기준: A. 중요한 개인 정보를 회상하지 못하는데 대개 외상성·스트레스성이며 일상적 망각과 부합하지 않음. B. 임상적으로 유의한 고통·장애. C. 물질(알코올, 약물, 처방약)이나 신경학적·의학적 상태(부분복합발작, 일과성 전반적 기억상실, 두개 내 손상, 외상성 뇌 손상 등)가 원인이 아님. D. 해리성 정체성 장애, 외상후 스트레스 장애, 급성 스트레스 장애, 신체 증상 장애, 신경인지장애로 잘 설명되지 않음. 그 외 강의록에서 읽어 주신 감별: 기질적 기억력 장애(코르사코프 증후군, 대뇌 혈관 질환, 수술 후 기억상실), 전기경련치료(현저한 일시적 기억상실), 경련 장애(분명한 경련과 후유증). 이인증 퀴즈도 냈다(이인증 = 자신으로부터 분리되어 있는 느낌이 지속적·반복적 – 참).","exps":[],"ai":"","fl":{}},{"k":"psy-sx-01","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 4쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"성(sexuality)을 이루는 네 가지 정신성적 요인에 해당하지 않는 것은?","choices":["성적 선호(sexual preference)","성적 행동(sexual behavior)","성 정체성(sexual identity)","성적 지향(sexual orientation)","성별 정체성(gender identity)"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4쪽·교수님: 성은 성 정체성, 성별 정체성, 성적 지향, 성적 행동의 네 가지 상호 연관된 요인으로 이루어지고, 이 요인들은 성격·성장·발달·기능에 영향을 준다. \"성적 선호장애\"는 ICD-10에서 변태성욕장애를 부르는 이름이다.","exps":["정답. ICD-10 장애명에 쓰인 말이다.","해당.","해당.","해당.","해당."],"ai":"","fl":{}},{"k":"psy-sx-02","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 5쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"염색체·외부/내부 생식기·호르몬·생식선·이차 성징 같은 생물학적 성적 특성으로 표현되는 양상은?","choices":["성적 지향(sexual orientation)","성별 정체성(gender identity)","성 정체성(sexual identity)","성별 역할(gender role)","성적 행동(sexual behavior)"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 5쪽·교수님: 성 정체성 = 생물학적 성적 특성들로 표현되는 양상. 성별 정체성 = 남성다움·여성다움에 대한 스스로의 지각(심리적 측면). 둘은 서로 영향을 준다.","exps":["성적 충동의 대상이다.","스스로의 지각(심리적 측면)이다.","정답.","외부로 드러나는 행동 양식이다.","뇌·신경전달물질과 관련된 행동이다."],"ai":"","fl":{}},{"k":"psy-sx-03","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 6쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"성별 정체성(gender identity)과 성별 역할(gender role)에 대한 설명으로 옳은 것은?","choices":["성별 역할은 출생 때 이미 확립되어 있다","성별 역할은 후천적 학습 경험이 쌓여 형성된다","성별(gender)은 생물학적 측면, 성(sex)은 사회적 측면을 말한다","성별 정체성과 성별 역할은 보통 일치하지 않는다","성별 정체성은 부모나 문화의 영향을 받지 않는다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6쪽·교수님: 성별(gender)은 사회적 측면, 성(sex)은 생물학적 측면. 성별 정체성은 부모·문화적 태도, 외부 생식기, 유전의 영향으로 형성된다. 성별 역할은 성별 정체성에서 일부 유래하며 출생 때 확립된 것이 아니라 후천적 학습 경험이 누적되어 형성되고, 보편적으로 둘은 일치한다.","exps":["후천적으로 형성된다.","정답.","반대다.","보편적으로 일치한다.","부모·문화의 영향을 받는다."],"ai":"","fl":{}},{"k":"psy-sx-04","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 7쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"동성애·이성애·양성애처럼 개인의 성적 충동이 향하는 대상을 가리키는 개념과 현재의 관점으로 옳은 것은?","choices":["성별 역할 – 질병으로 간주하지 않는다","성별 정체성 – 질병으로 본다","성 정체성 – 인간의 성의 변형으로 본다","성적 지향 – 질병으로 간주하지 않는다","성적 지향 – DSM-5에서 성장애로 분류한다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7쪽·교수님: 성적 지향은 개인의 성적 충동들의 대상(이성·동성·양성). 과거에는 동성애를 질환으로 봤지만 1973년 미국정신의학회 진단범주에서, 1980년 DSM에서 삭제됐고 ICD-10은 \"성적 지향은 질병으로 간주되어서는 안 된다\"고 기술한다 – 지금은 인간의 성의 변형으로 본다.","exps":["개념이 다르다.","개념이 다르다.","개념이 다르다.","정답.","성장애가 아니다."],"ai":"","fl":{}},{"k":"psy-sx-05","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 8쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"성적 행동에 관여하는 신경전달물질·호르몬의 작용으로 옳은 것은?","choices":["에스트로겐 – 여성의 성적 흥분과 무관","세로토닌 – 성기능 억제","프로락틴 증가 – 성욕 증가","옥시토신 – 오르가즘을 억제","도파민 증가 – 리비도 감소"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 8쪽·교수님: 도파민이 증가하면 리비도가 증가하는 것으로 추정, 세로토닌은 성기능을 억제, 옥시토신은 오르가즘 때 분비되어 성적 쾌락 활동을 강화, 에스트로겐은 여성 성적 흥분의 윤활작용에 중요, 프로게스테론·과도한 프로락틴·코티솔은 성욕을 경하게 떨어뜨린다. 그래서 여러 약이 성기능에 영향을 준다.","exps":["윤활작용에 중요하다.","정답.","성욕을 떨어뜨린다.","분비되어 쾌락을 강화한다.","리비도가 증가한다."],"ai":"","fl":{}},{"k":"psy-sx-06","area":"탈야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 8쪽","year":"","type":"객","rep":1,"repyears":"","stem":"성적 흥분과 절정이 궁극적으로 조직화되는 수준은?","choices":["뇌간","변연계","소뇌","대뇌피질","척수"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 8쪽: 대뇌피질·변연계·뇌간이 성적 행동에 관여하지만, 성적 흥분과 절정은 궁극적으로 척수 수준에서 조직화되어 있다.","exps":["관여하지만 최종 수준은 아니다.","관여하지만 최종 수준은 아니다.","해당 없다.","관여하지만 최종 수준은 아니다.","정답."],"ai":"","fl":{}},{"k":"psy-sx-07","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 10–11쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 성장애의 세 가지 범주로 옳은 것은?","choices":["성기능장애, 성별 정체성장애, 성적 선호장애","성기능장애, 성별불만족(성별불쾌감), 변태성욕장애","성별불쾌감, 성적 지향장애, 성 정체성장애","성기능장애, 동성애, 변태성욕장애","성욕장애, 성적 지향장애, 변태성욕장애"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 10–11쪽·교수님: DSM-5는 성기능장애, 성별불만족(gender dysphoria), 변태성욕장애의 세 종류. ICD-10에서는 성기능장애, 성별 정체성장애, 성적 선호장애로 부른다. 원인은 심리적·생물학적 원인으로 나뉜다.","exps":["ICD-10의 이름이다.","정답.","해당 없다.","동성애는 장애가 아니다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-sx-08","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 13쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"항우울제 중 성기능장애 발생률이 적은 약물로 짝지어진 것은?","choices":["imipramine, clomipramine","phenelzine, venlafaxine","sertraline, escitalopram","bupropion, mirtazapine","fluoxetine, paroxetine"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 13쪽·교수님: 세로토닌이 성기능을 억제하므로 MAOI·TCA·SSRI·SNRI 등 많은 항우울제가 성기능장애를 일으킨다. bupropion·mirtazapine은 세로토닌에 직접 작용하지 않아 발생률이 적다. 물질/약물 유도성 성기능장애는 DSM-5에 새로 추가된 진단.","exps":["TCA다.","MAOI·SNRI다.","SSRI다.","정답.","SSRI다."],"ai":"","fl":{}},{"k":"psy-sx-09","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 14쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"SSRI 복용 후 성기능장애가 생긴 환자에서 도움이 되는 조치로 강의록에 제시된 것은?","choices":["paroxetine으로 교체한다","SSRI 용량을 두 배로 늘린다","항정신병약물을 추가한다","benzodiazepine을 고용량 추가한다","bupropion으로 바꾸거나 추가, 또는 buspirone 추가"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 14쪽·교수님: 원인 약물을 찾아 성기능 부작용이 없는 약으로 대체한다. SSRI에 의한 경우 bupropion으로 변경·추가 또는 buspirone 추가. 약물에 의한 발기부전에는 sildenafil 같은 PDE-5 억제제. 항정신병약물에 의한 경우는 감량하거나 프로락틴을 올리지 않는 약으로 교체.","exps":["같은 SSRI다.","악화된다.","프로락틴을 올릴 수 있다.","고용량에선 극치감 문제가 있다.","정답."],"ai":"","fl":{}},{"k":"psy-sx-10","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 13–14쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"항정신병약물에 의한 성기능장애의 주된 기전과 대처로 옳은 것은?","choices":["도파민 증가 – 용량 증량","프로락틴 증가 – 감량하거나 프로락틴을 올리지 않는 약으로 교체","코티솔 감소 – 스테로이드 추가","세로토닌 증가 – bupropion 추가","옥시토신 증가 – 항안드로겐 추가"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 13–14쪽·교수님: 프로락틴을 증가시키는 항정신병약물에서 성기능장애 빈도가 높다. 우선 감량을 시도하거나 프로락틴 상승이 적은 약으로 교체한다. 기분안정제와 성기능장애의 관계는 명확하지 않고, benzodiazepine은 고용량에서 극치감 문제가 있을 수 있다.","exps":["해당 없다.","정답.","해당 없다.","SSRI의 경우다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-sx-11","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 15–17쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"성별불쾌감(gender dysphoria)에 대한 설명으로 옳은 것은?","choices":["성전환 후에는 어떤 진단도 붙이지 않는다","청소년도 원하면 바로 수술을 시행한다","동성애와 본질적으로 같은 개념이다","불일치가 1개월만 지속되어도 진단한다","출생 성별과 경험하는 성별의 불일치·고통이 핵심이다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 15–17쪽·교수님: 동성애와는 다른 개념. 출생 성별(natal gender)과 경험·표현하는 성별의 뚜렷한 불일치와 그로 인한 고통이 진단의 핵심이고, 청소년·성인 기준은 6개월 이상. 성전환 후에도 호르몬·수술·보험 등 현실적 필요로 \"전환 후 상태\"를 명시한다. 청소년은 비가역적 수술을 법적 성인이 된 뒤에, 그 전에 1년 동안 원하는 성 역할로 살아 보도록 한다.","exps":["\"전환 후 상태\"를 명시한다.","법적 성인 이후다.","다른 개념이다.","6개월 이상이다.","정답."],"ai":"","fl":{}},{"k":"psy-sx-12","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 17–18쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"성인 성별불쾌감 환자의 치료 원칙으로 옳은 것은?","choices":["호르몬 치료 없이 바로 수술한다","정신치료는 필요 없다","증상을 없애기보다 증상을 가지고 어떻게 살지에 초점을 둔다","성별 정체성 문제를 부정하도록 돕는다","이성이 되고 싶은 욕구를 줄이는 약물을 먼저 쓴다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 17–18쪽·교수님: 치료는 성별 정체성에 문제가 있다는 것을 받아들이는 데서 시작한다. 성인은 생각을 바꾸기 어렵고 욕구 자체를 줄이는 약은 없으므로, 증상을 가지고 어떻게 살아갈지에 초점. 수술은 가장 최종적·근본적 단계로, 보통 호르몬 치료로 이성의 삶을 충분히 살아 본 뒤 결정한다(되돌리기 어렵기 때문).","exps":["호르몬 치료 기간을 먼저 거친다.","정신치료와 탐색을 포함한다.","정답.","받아들이는 데서 시작한다.","그런 약은 없다."],"ai":"","fl":{}},{"k":"psy-sx-13","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 21–22쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 변태성욕장애(paraphilic disorder) 진단에서 가장 중요하게 고려하는 점은?","choices":["일탈된 성적 환상이 있는지 여부","성기능장애가 동반되는지 여부","성적 지향이 동성인지 여부","일탈된 환상·충동의 행동화 여부","환자 본인이 불편을 느끼는지 여부"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 21–22쪽·교수님: 가장 중요한 것은 행동화 여부 – 부적절하거나 불법적인 것에 집착해도 욕구·환상만 있고 행동하지 않으면 변태성욕장애가 아니다. 6개월 이상, 사람이 아닌 대상이나 동의할 수 없는 상대에게 행동으로 이어져야 진단. 본인은 불편을 느끼지 않아 대부분 법적 문제로 강제로 병원에 온다.","exps":["환상만으로는 진단하지 않는다.","해당 없다.","해당 없다.","정답.","대개 불편을 느끼지 않는다."],"ai":"","fl":{}},{"k":"psy-sx-14","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 23쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"변태성욕장애의 종류와 설명의 연결로 옳지 않은 것은?","choices":["물품음란장애 – 타인을 괴롭히며 성적 흥분","의상도착장애 – 반대 성의 복장으로 성적 흥분","접촉도착장애 – 신체 일부에 문지르는 행동","노출장애 – 노출 행동","관음장애 – 몰래 훔쳐보는 행동"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 23쪽·교수님: 관음(몰래 훔쳐봄), 노출, 접촉도착(문지름), 성적피학(모욕·구타당하는 상황), 성적가학(타인을 괴롭히며 흥분), 소아성애, 물품음란(신체 일부와 밀접한 물건), 의상도착(반대 성 복장).","exps":["정답. 성적가학장애 설명이다.","옳다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-sx-15","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 24–25쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"변태성욕장애의 약물치료에 대한 설명으로 옳은 것은?","choices":["항안드로겐(CPA·MPA)이 널리 쓰인다","SSRI가 항안드로겐보다 효과가 크다","치료 효과가 대규모 연구로 잘 밝혀져 있다","호르몬 치료로는 GnRH 길항제만 쓴다","수술적 거세가 늘어나는 추세다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 24–25쪽·교수님: 항안드로겐(CPA, MPA)이 가장 널리 쓰이고, 호르몬 치료로 GnRH agonist(leuprolide, triptorelin). SSRI는 기전은 모르지만 도착 증상 감소에 효과가 있으나 항안드로겐·호르몬 치료보다 부족 – 불안·우울 동반 시 고려. 약물이 도입되며 수술적 거세는 줄어드는 추세. 연구가 대부분 수감자 대상이라 효과는 알려진 바가 적다.","exps":["정답.","효과가 부족하다.","알려진 바가 적다.","agonist를 쓴다.","감소하는 추세다."],"ai":"","fl":{}},{"k":"psy-sx-16","area":"티야","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 강의록 「2026-성장애」 26–27쪽 · STT 10/21 3교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"법원 명령으로 치료받는 성폭력 가해자 치료에 대한 설명으로 옳은 것은?","choices":["사전 동의가 자발적이므로 전통적 의료 윤리가 그대로 적용된다","환자는 원하면 언제든 치료를 중단할 수 있다","치료 정보는 치료자 외에 공유되지 않는다","의사는 어떤 경우에도 증언을 거부할 수 있다","비밀보장과 법적 특권이 침해될 수밖에 없다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 26–27쪽·교수님: 법으로 명령된 치료는 시작부터 자발적이 아니어서 다른 치료를 선택하거나 중단할 권리가 없다. 형사소송법 149조: 의사는 업무상 알게 된 비밀에 대한 증언을 거부할 수 있으나 본인 승낙이나 중대한 공익상 필요가 있으면 예외. 치료를 시작하면 정보가 보호관찰 등 교정 전문가·가족·피해자에게도 공유된다.","exps":["적용하기 어렵다.","중단할 권리가 없다.","여러 사람에게 공유된다.","예외가 있다.","정답."],"ai":"","fl":{}},{"k":"psy-y-sx-gd-2025","area":"야마","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 학습지 「성장애」 8–13쪽","year":"2025 객35","type":"객","rep":1,"repyears":"","stem":"다음 중 태어나면서 정해진 성별(natal gender)과 경험하고 표현하는 성별 사이에 뚜렷한 불일치를 보이는 것과 관련된 것은?","choices":["관음장애","의상도착장애","성기능 장애(sexual dysfunction)","동성애","성별 불쾌감 (gender dysphoria)"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 박종일 교수님 성장애 강의록 p.7, 11, 12, 15, 23. 관음장애: 몰래 훔쳐보는 행동. 의상도착장애: 반대 성의 복장으로 성적 흥분. 성기능 장애: 성적 자극에 반응할 수 있는 능력이 없거나 성행위 중 통증. 동성애: 성적 지향(이성·동성·양성) – ICD-10은 \"성적 지향은 질병으로 간주되어서는 안 된다\"(강의록 7p). 성별 불쾌감: 정해진 출생성별과 경험·표현하는 성별 사이의 뚜렷한 불일치. DSM-5 성장애는 성기능 장애, 성별 불만족, 변태성욕장애의 세 종류(강의록 11p). 상식적으로도 풀 수 있는 문제였고, 성장애는 이전에 양종철 교수님 파트였는데 기존과는 전혀 다른 방식이지만 매우 쉬운 난이도로 출제.","exps":[],"ai":"","fl":{}},{"k":"psy-y-sx-para-2023","area":"야마","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 학습지 「성장애」 8–13쪽","year":"2023 객42","type":"객","rep":1,"repyears":"","stem":"반대 성별의 옷을 입고 성적인 흥분을 느끼는 것은?","choices":["voyeuristic disorder","frotteuristic disorder","pedophilic disorder","fetishistic disorder","transvestic disorder"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/21 STT·강의록 21–23쪽): 변태성욕장애의 종류 – 관음(voyeuristic), 노출, 접촉도착(frotteuristic, 문지름), 성적피학, 성적가학, 소아성애(pedophilic), 물품음란(fetishistic, 신체와 밀접한 물건), 의상도착(transvestic, 반대 성 복장으로 성적 흥분). 진단에서 가장 중요한 것은 행동화 여부 – 환상만 있고 행동하지 않으면 진단하지 않는다(6개월 이상).\n\n📚 학습지 해설: 신경정신의학 479p 변태성욕장애(paraphilic disorder). DSM-5에서 변태성욕장애로 지정한 관음장애, 노출장애, 접촉도착장애, 성적피학장애, 성적가학장애, 소아성애장애, 물품음란장애, 의상도착장애를 설명해 주셨다. 탈야 문제 – 영어 용어까진 안 본 상태에선 영어 시험에 가까웠지만 \"반대 성\", \"바꿔 입는다\"로 ⑤ 유추 가능. 탈야이더라도 포기하지 말라는 희망을 주는 문제.","exps":[],"ai":"","fl":{}},{"k":"psy-y-sx-orient-2022","area":"야마","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 학습지 「성장애」 8–13쪽","year":"2022 객47","type":"객","rep":2,"repyears":"2018 객38","stem":"동성애, 이성애와 같이 성적 충동의 대상을 의미하는 용어는?","choices":["성","성 정체성","성별 역할","성적 지향","성별 정체성"],"ans":[4],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2018 객38"],"basis":"🎓 올해 수업 기준: 교수님(10/21 STT·강의록 4–7쪽): 성은 성 정체성, 성별 정체성, 성적 지향, 성적 행동의 네 요인. 성 정체성(sexual identity) = 염색체·생식기·호르몬 등 생물학적 성적 특성, 성별 정체성(gender identity) = 남성다움·여성다움에 대한 스스로의 심리적 지각, 성별 역할(gender role) = 성별 정체성에서 일부 유래해 후천적 학습으로 형성되는 외부 행동 양식(의상 등), 성적 지향 = 성적 충동의 대상. 동성애는 1973년 APA, 1980년 DSM에서 질환에서 삭제 – 지금은 성의 변형으로 본다.\n\n📚 학습지 해설: 신경정신의학 3판 chapter 20 성 장애. ① 성(sexuality)은 네 가지 상호 연관된 정신성적 요인들[성 정체성, 성별 정체성, 성적 지향, 성적 행동]에 달려 있다. ② 성 정체성은 개인의 생물학적 성적 특성들[염색체, 외부·내부생식기, 호르몬, 생식선, 이차 성징]로 표현되는 양상. ③ 성별 역할 행동은 성별 정체성과 관련되어 있고 일부 유래되며, 출생 당시 확립된 것이 아니라 후천적 학습 경험들이 누적되어 형성된다. ⑤ 성별 정체성: 명료한 성 정체성을 갖는 아이들은 생후 2–3세경 \"나는 남자다/여자다\"라는 확신을 가진다 – 남성다움·여성다움의 심리적 측면(성별 gender는 사회적, 성 sex는 생물학적 측면). 정답 ④ 성적 지향: 개인의 성적 충동들의 대상(이성, 동성, 양성).","exps":[],"ai":"","fl":{}},{"k":"psy-y-sx-role-2020","area":"야마","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 학습지 「성장애」 8–13쪽","year":"2020 객37","type":"객","rep":4,"repyears":"2019 객37 · 2017 객38 · 2015 객36","stem":"자신이 남자 혹은 여자라는 느낌을 의상 등으로 반영해 나타내는 것은?","choices":["Sexual identity","Sexual orientation","Gender identity","Gender role","Homosexuality"],"ans":[4],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2019 객37","매년 강조하던 티야·킹야(복원자, 양종철 교수님 시절)."],"basis":"📚 학습지 해설: 정신과 \"성 장애\" 단원(20 학습부·2019 복원자). Sexual identity: 해부학적 성주체성. Gender identity: 정신적 성주체성 – 자신이 남자 혹은 여자라는 \"내적인 느낌\"을 반영하는 심리적인 상태. Gender role: 성주체성에 대한 내적 감각을 외부적으로 나타내는 행동 양식. 매년 강조하시는 티야 및 킹야 – 용어 설명만 잘 외우면 한 문제는 먹고 들어간다. 양종철 교수님 수업 예시: 교수님이 스스로를 여자라고 생각하지만 교수인데 어떻게 치마를 입고 다니겠냐며 남성복장을 고수하시면 sexual identity 남자, gender identity 여자, gender role 남자. (교과서) 성별 역할 행동은 출생 당시 확립된 것이 아니라 후천적 학습 경험이 누적되어 형성되며, 의류·헤어스타일 등에서 정반대 성의 것을 채택할 수도 있다. 성적 지향은 개인의 성적 충동들의 대상(이성·동성·양성).","exps":[],"ai":"","fl":{}},{"k":"psy-y-sx-role-2017","area":"야마","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 학습지 「성장애」 8–13쪽","year":"2017 객38","type":"객","rep":4,"repyears":"2020 객37 · 2019 객37 · 2015 객36","stem":"성정체성에서 여성스러운 옷을 입고자 하는 것은?","choices":["Sexual identity","Sexual orientation","Gender identity","Gender role","Homosexuality"],"ans":[],"imgs":[],"vis":[],"notes":["⚠ 정답 확인 필요: 학습지 정답 칸이 ③인데, \"의상 등으로 나타내는 것\"을 물은 2019·2020·2015 문제의 정답은 ④ Gender role이다.","학습지 정답 그대로는 채점하지 않고, 확인되면 반영할게요.","복원 불완전·확인 필요 문항이라 정답 자동 채점은 하지 않아요."],"basis":"🎓 올해 수업 기준: 교수님(10/21 STT·강의록 4–7쪽): 성은 성 정체성, 성별 정체성, 성적 지향, 성적 행동의 네 요인. 성 정체성(sexual identity) = 염색체·생식기·호르몬 등 생물학적 성적 특성, 성별 정체성(gender identity) = 남성다움·여성다움에 대한 스스로의 심리적 지각, 성별 역할(gender role) = 성별 정체성에서 일부 유래해 후천적 학습으로 형성되는 외부 행동 양식(의상 등), 성적 지향 = 성적 충동의 대상. 동성애는 1973년 APA, 1980년 DSM에서 질환에서 삭제 – 지금은 성의 변형으로 본다. \"여성스러운 옷을 입고자 하는 것\"은 의상 등 외부로 나타내는 행동 양식이므로 올해 강의록 정의로도 gender role(④)에 해당 – 학습지 정답 칸 ③과 맞지 않는다.\n\n📚 학습지 해설: (정답 칸 ③으로 적은 복원자) 예전 기출문제를 참고 바람. 1. sexual identity / 해부학적 성주체성 2. sexual orientation 3. gender identity / 정신적 성주체성 4. gender role / 성역할. (같은 페이지의 다른 해 해설) 신경정신의학 3판 p.462–463 – 성별 역할 행동은 성별 정체성에서 일부 유래, 출생 당시 확립된 것이 아니라 후천적 학습으로 형성되며 의류·헤어스타일 등에서 정반대 성의 것을 채택할 수도 있다.","exps":[],"ai":"","fl":{"warn":1,"chk":1,"inc":1}},{"k":"psy-y-sx-role-2015","area":"야마","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 학습지 「성장애」 8–13쪽","year":"2015 객36","type":"객","rep":4,"repyears":"2020 객37 · 2019 객37 · 2017 객38","stem":"자신이 남자 혹은 여자라는 내적인 느낌을 외부적으로 나타내는 행동양식은?","choices":["Sexual identity","Sexual orientation","Gender identity","Gender role","Homosexuality"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 신경정신의학 2판 p286. 성주체성(gender identity): 자신이 남자 혹은 여자라는 내적인 느낌을 반영하는 심리적인 상태로 소속된 사회·문화와 연루된 태도, 행동양식, 남성·여성과 연관된 속성 등이 포함. 성 역할(gender role): 성주체성에 대한 내적 감각을 외부적으로 나타내는 행동 양식. [14년도 풀이 예시] 교수님이 스스로를 여자라고 생각하지만 교수인데 어떻게 치마를 입고 다니겠냐며 남성복장을 고수하면 sexual identity 남자, gender identity 여자, gender role 남자. 답 ④.","exps":[],"ai":"","fl":{}},{"k":"psy-y-sx-gi-2014","area":"야마","prof":"박종일","sec":"10/21 · 성장애","meta":"근거: 학습지 「성장애」 8–13쪽","year":"2014 객31","type":"객","rep":2,"repyears":"2011 객28","stem":"자신이 남자 혹은 여자라는 내적인 느낌을 반영하는 것은?","choices":["Sexual identity","Sexual orientation","Gender identity","Gender role","Homosexuality"],"ans":[3],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2011 객28"],"basis":"📚 학습지 해설: 신경정신의학 2판 p286. 책에 나와 있지 않은 내용으로 교수님이 수업시간에 언급. ③ gender identity 정신적 성주체성, ① sexual identity 해부학적 성주체성, ② sexual orientation, ④ gender role, ⑤ homosexuality. 수업 예시: 스스로를 여자라고 생각하지만 남성복장을 고수하는 남자 교수 → sexual identity 남자, gender identity 여자, gender role 남자. (2011 해설) \"성주체성은 자신이 남자 혹은 여자라는 내적인 느낌을 반영하는 심리적인 상태로서 소속된 사회·문화와 연루된 태도, 행동양식, 남성 및 여성과 연관된 속성 등이 포함되어 있다\"고 책에 그대로 있다. gender role은 그 내적 감각을 외부적으로 나타내는 행동양식.","exps":[],"ai":"","fl":{}},{"k":"psy-ge-01","area":"티야","prof":"박종일","sec":"10/21 · 노인정신의학 1","meta":"근거: 강의록 「2026 노인정신의학-1」 4–5쪽 · STT 10/21 4교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"노인과 노화에 대한 설명으로 옳은 것은?","choices":["노화는 순수하게 생물학적인 과정일 뿐이다","노화의 속도에는 사람 간 개인차가 거의 없다","노화는 65세가 되어야 시작된다","노인은 인위적으로 75세 이상을 말한다","노화는 기능이 시간에 따라 비가역적으로 소진하는 과정이다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4–5쪽·교수님: 노인은 인위적으로 65세 이상. 노화는 성숙한 유기체의 제반 기능이 시간이 경과함에 따라 비가역적으로 소진해 가는 과정 – 20·30대에서도 진행 중. 단순한 생물학적 과정이 아니라 생물·심리·사회적 복합 과정이고 개인차가 있다.","exps":["생물심리사회적 과정이다.","개인차가 있다 록 28쪽·교수님: 성인에서는 BDI 등을, 노인에서는 GDS를 많이 쓴다. HRSD·MADRS는 객관적 척도로 모든 연령에서, SCID·MINI는 구조화 면담도구. MMSE는 인지기능 척도, BPRS는 일반 상태 평가.","exps":["객관적(평가자) 척도다.","구조화 면담도구다.","인지기능 척도다.","정답.","일반 상태 평가 척도다."],"ai":"","fl":{}},{"k":"psy-ge-09","area":"티야","prof":"박종일","sec":"10/21 · 노인정신의학 1","meta":"근거: 강의록 「2026 노인정신의학-1」 22·33쪽 · STT 10/21 4교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"노인 섬망에 대한 설명으로 옳은 것은?","choices":["수술 후 갑자기 치매가 생긴 것이므로 경과 관찰만 한다","증상이 하루 종일 일정하다","밤에 악화되는 일중 변동이 특징이고, 섬망 자체가 사망률 증가와 관련된다","심장 수술 환자에서는 드물다","정신과 약물 투여는 금기다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 22·33쪽·교수님: 인지기능의 일중 변동(낮엔 괜찮고 밤에 지남력 저하, 환시, 수면·행동장애). 보호자는 \"수술 후 치매가 왔다\"고 오해. 원인(내과·외과적 상태) 회복이 가장 중요하고 행동장애가 심하면 정신과 약물. 내과 입원 10–30%, 심장수술 90% 이상, 섬망 경험 노인의 1년 사망률 50%.","exps":["원인 교정이 우선이다.","일중 변동이 있다.","정답.","90% 이상이다.","증상에 따라 쓴다."],"ai":"","fl":{}},{"k":"psy-ge-10","area":"티야","prof":"박종일","sec":"10/21 · 노인정신의학 1","meta":"근거: 강의록 「2026 노인정신의학-1」 36쪽 · STT 10/21 4교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"노인 자살에 대한 설명으로 옳은 것은?","choices":["우리나라 노인의 자살 위험은 낮은 편이다","시도 방법이 더 치명적이고 발견이 늦어 중요하다","신체 질병은 유발 요인이 아니다","혼자 사는 것은 위험 요인이 아니다","자살 시도 횟수는 노인이 성인보다 훨씬 많다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 36쪽·교수님: 우리나라 노인 자살 위험이 특히 높다. 시도 횟수는 성인이 더 많지만 노인은 방법이 치명적이고 발견이 잘 안 된다. 이유: 고독·재정·건강·우울증, 가장 흔한 유발요인: 신체 질병과 상실.","exps":["높은 편이다.","정답.","가장 흔한 유발요인이다.","위험 요인이다.","성인이 더 많다."],"ai":"","fl":{}},{"k":"psy-ge-11","area":"티야","prof":"박종일","sec":"10/21 · 노인정신의학 1","meta":"근거: 강의록 「2026 노인정신의학-1」 39쪽 · STT 10/21 4교시(박종일)","year":"","type":"객","rep":1,"repyears":"","stem":"노인에서 정신과 약물 사용 원칙으로 옳은 것은?","choices":["성인 용량의 1/3–1/2로 시작해 서서히 증량한다","빠른 효과를 위해 성인과 같은 용량으로 시작한다","효과가 불충분해도 저용량에서 멈춰야 한다","부작용이 생기면 조절 약을 추가하는 것이 원칙이다","여러 기전의 약을 처음부터 함께 쓴다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 39쪽·교수님: polypharmacy 주의 – 여러 과 약이 계속 추가되기 쉽고, 원인 약 감량 대신 부작용 조절 약만 추가하지 말 것. Low dose, slow titration(성인 용량의 1/3–1/2). 그렇다고 효과가 불충분한데 사용을 일","sec":"10/21 · 노인정신의학 1","meta":"근거: 학습지 「노인정신의학」 54–57쪽","year":"2025 객39","type":"객","rep":1,"repyears":"","stem":"78세 남성이 우울감, 식욕저하, 불면을 주소로 내원하였다. 고혈압과 경도의 신장기능 저하를 보이고 현재 로다핀을 복약중이다. 우울증 진단 후 항우울제 치료를 고려중이다. 이 중 고려해야할 사항은?","choices":["다양한 기전을 가진 약물을 함께 도입","항콜린성 작용이 있는 삼환계 항우울제 고려","성인과 같은 용량으로 시작해서 천천히 증량","고혈압 치료 중이므로 SNRI 계열 항우울제 사용 시 주의","초기 항우울제의 효과가 늦을 수 있어 benzodiazepine 고용량 복용"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/21 STT·강의록 37–40쪽): 노인 약물은 polypharmacy 주의(원인 약 감량 대신 부작용 조절 약만 추가하지 말 것), low dose·slow titration(성인 용량의 1/3–1/2로 시작), 그렇다고 효과가 불충분한데 사용을 제한하라는 뜻은 아니다. 항콜린성 약물·벤조디아제핀은 뇌 예비력이 떨어진 노인에서 인지 저하·섬망을 유발(벤조는 낙상도). 치료 목표는 삶의 질 향상과 요양원 입소를 늦추거나 피하는 것. 회상치료는 우울 개선에 효과, 인지기능 효과는 불충분. 이 문제: ① 여러 약 동시 도입은 polypharmacy, ② 삼환계는 항콜린성, ③ 성인 용량이 아니라 1/3–1/2로 시작, ⑤ 벤조 고용량은 인지 저하·낙상 → 남는 것은 ④(SNRI는 노르에피네프린 작용으로 혈압 상승 가능).\n\n📚 학습지 해설: 2025 박종일 교수님 노인정신의학 강의록. 1번: polypharmacy를 유의해야 함. 2번, 5번: 항콜린성 약물·벤조디아제핀은 뇌의 예비력이 저하되는 노인에서 인지기능 저하를 유발하거나 섬망 발생에 기여할 수 있음. 3번: 성인 용량의 약 1/3–1/2로 시작해야 함. 정답 ④.","exps":[],"ai":"","fl":{}},{"k":"psy-y-ge-tx-2021","area":"야마","prof":"박종일","sec":"10/21 · 노인정신의학 1","meta":"근거: 학습지 「노인정신의학」 54–57쪽","year":"2021 객48","type":"객","rep":3,"repyears":"2020 객48 · 2019 객50","stem":"노인의 정신약물학적 치료에 대한 내용 중 옳은 것은?","choices":["벤조디아제핀은 진정작용이나 낙상에 주의가 필요하다.","콜린성약물은 인지기능의 저하나 섬망의 위험성을 높인다.","빠른 효과를 위해 초기에 성인에서와 동일하게 처방할 필요가 있다.","인지기능 개선목표로 화상치료를 한다.","건강 향상 및 삶의 질을 높이기 위해 조기 요양시설에 입소가 필요하다."],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 올해 강의록(37–40쪽)도 학습지 해설과 같은 내용. 다만 ② 선지는 \"항\"콜린성 약물이어야 맞는 설명이라 오답 – 교수님이 강조한 대로 항콜린성 약물·벤조디아제핀이 인지 저하·섬망 위험을 높인다.\n\n📚 학습지 해설: 박종일 교수님 \"노인정신의학\" 강의록 – 노화에 따른 약물동력학과 약력학의 변화. ① 벤조디아제핀, ② 항콜린성 약물 – 뇌의 예비력이 저하되는 노인에서 인지기능 저하를 유발하거나 섬망 발생에 기여할 수 있음. 벤조디아제핀은 혼동·지남력 저하·기억력 장애 등 인지기능 저하와 낙상 위험 증가(교과서 p.721). 노인 약물치료의 주요 목표는 삶의 질 향상, 지역사회 거주, 요양원 입소를 늦추는 것. 부작용을 피하기 위해 성인 용량의 약 1/3–1/2로 시작해 서서히 증량. 회상치료(reminiscence therapy): 과거 사건·경험을 이야기하며 통합된 느낌을 갖게 함 – 인지기능 효과는 불충분하지만 우울증상 개선에 효과. (2019 해설) 전부 교수님이 수업시간에 읽으신 부분에서 나왔다. 삼환계 같은 항콜린성 약물은 변비·빈맥·요정체 등 부작용.","exps":[],"ai":"","fl":{}},{"k":"psy-y-ge-tx-2020","area":"야마","prof":"박종일","sec":"10/21 · 노인정신의학 1","meta":"근거: 학습지 「노인정신의학」 54–57쪽","year":"2020 객48","type":"객","rep":3,"repyears":"2021 객48 · 2019 객50","stem":"노인의 정신약물치료와 관련된 내용 중 옳은 것은?","choices":["벤조다이아제핀 같은 약물은 인지기능 저하와 낙상의 위험을 증가시킨다.","콜린성 약물의 경우 인지기능을 저하시키고 섬망의 위험성을 높인다.","빠른 효과를 위해 초기에 성인에서와 동일하게 처방할 필요가 있다.","인지기능 개선을 목표로 화상치료를 실시한다.","건강 향상 및 삶의 질을 높이기 위해 조기 요양시설에 입소가 필요하다."],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 노인정신의학 강의록 37–40p(교과서 p.704–706). 노화에 따른 약력학 변화: 알파 차단제는 혈압 조절능력이 저하된 노인에서 기립성 저혈압·실신 유발 – clozapine·quetiapine처럼 알파 차단이 강한 항정신병약물 주의, 추체외로 증상, 항콜린성 약물·벤조디아제핀은 뇌 예비력이 저하된 노인에서 인지 저하·섬망. 약물 사용 원칙: polypharmacy 유의(원인 약 감량보다 부작용 조절 약만 추가 처방 주의), 고령자 대상 임상시험 정보 부족, low dose·slow titration(성인 용량의 1/3–1/2), risk vs benefit, 효과를 보이는 최소 용량 – 그렇다고 효과가 불충분한데 사용을 제한하라는 의미는 아님. 주요 목표: 삶의 질 향상, 지역사회 거주, 요양원 입소를 늦추거나 피하기. 순응도 문제(기억력·시력·청력 저하, 복잡한 복용법). 정신치료: 역동·인지행동·대인관계·가족치료, 회상치료(우울 개선, 인지 효과 불충분). 정답 ①.","exps":[],"ai":"","fl":{}},{"k":"psy-y-ge-tx-2019","area":"야마","prof":"박종일","sec":"10/21 · 노인정신의학 1","meta":"근거: 학습지 「노인정신의학」 54–57쪽","year":"2019 객50","type":"객","rep":3,"repyears":"2021 객48 · 2020 객48","stem":"노인의 정신과적 치료와 관련된 내용 중 옳은 것은??","choices":["노인의 건강 향상 및 삶의 질을 높이기 위해 조기 요양시설에 입소가 필요하다.","빠른 효과를 위해 초기에 성인에서와 동일하게 처방할 필요가 있다.","콜린성 약물의 경우 인지기능을 저하시키고 섬망의 위험성을 높인다.","벤조다이아제핀 같은 약물은 인지기능 저하와 낙상의 위험을 증가시킨다.","노인의 인지기능 개선을 목표로 회상치료를 실시한다."],"ans":[4],"imgs":[],"vis":[],"notes":["수업 시간에 교수님이 읽은 부분에서 모두 출제(복원자)."],"basis":"📚 학습지 해설: 신경정신의학 28장 \"노인정신의학\" p.719–722. 전부 교수님이 수업시간에 읽으신 부분에서 나왔다. ① 벤조디아제핀, ② 항콜린성 약물 – 뇌의 예비력이 저하되는 노인에서 인지기능 저하를 유발하거나 섬망 발생에 기여할 수 있음. 벤조디아제핀은 혼동·지남력 저하·기억력 장애 등 인지기능 저하와 낙상 위험 증가(교과서 p.721). 노인 약물치료의 주요 목표는 삶의 질 향상, 지역사회 거주, 요양원 입소를 늦추는 것. 부작용을 피하기 위해 성인 용량의 약 1/3–1/2로 시작해 서서히 증량. 회상치료(reminiscence therapy): 과거 사건·경험을 이야기하며 통합된 느낌을 갖게 함 – 인지기능 효과는 불충분하지만 우울증상 개선에 효과. (
