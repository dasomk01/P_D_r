 확인(요즘은 휴대폰), 초1에 학교를 안 가려 하고, 감정 표현 대신 아침마다 머리·배가 아프다가 학교에 가면 괜찮아진다, 분리 주제의 악몽. 18세 이전 발병 조건은 없어져 성인도 진단할 수 있다. 엄마도 아이와 떨어지기 힘들어하는 경우가 30% – 엄마도 같이 치료, 때로 분리 연습을 위해 입원. 치료는 행동치료·놀이치료(노출하고 버티면 둔감해지는 원리).\n\n📚 학습지 해설: 분리불안장애: 어느 정도의 분리불안은 정상 발달에서도 관찰, 일상생활을 위협할 정도로 심하고 지속적일 때 진단. 역학 – 남=여, 7–8세 호발. 원인 – 애착 장애, 부모의 불안(과잉보호), 공황장애·광장공포증이 있는 부모, 가족의 죽음·잦은 전학 등. 증상 – 학교 거부증(응급상황, 학교가 무서운 게 아니라 애착대상과의 분리가 두려움), 악몽, 애착대상 확인, 두통·복통. ④ 전자레인지 반복 확인은 강박 증상 → 정답 ④.","exps":[],"ai":"","fl":{}},{"k":"psy-y-c4-sm-2022","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 학습지 「소아청소년 정신의학」 113–144쪽(새 학습지)","year":"2022 객28","type":"객","rep":2,"repyears":"2013 객47","stem":"초등학교 1학년 여아가 학교에서 말을 잘 하지 않는 증상으로 내원하였다. 집에서는 말을 곧잘 한다고 하였으며 부모님에게 짜증을 내기도 하였다. 진단과 가장 관련성 있는 질환은?","choices":["우울장애","강박장애","공황장애","사회불안장애","주의력결핍과잉행동장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 2교시): 선택적 함구증은 밖에서 낯선 사람 앞일수록 더 심해 사회불안장애와 유사하게 보고 DSM-5에서 불안장애로 옮겼다 – 여아에 많고 유치원·초등학교 때 시작, 밖에서는 위축되고 집에서는 떼쓴다(분노발작). 치료는 밖에서 말하는 연습(행동요법) + 놀이·상담치료.\n\n📚 학습지 해설: 박태원 교수님 불안장애 강의록. 여아의 증상으로 보아 선택적 함구증이 합당한 진단. 선택적 함구증은 과거에는 소아기 기타 장애로 분류되었는데 현재는 불안장애로 분류 – 그 이유는 사회불안장애와의 연관성 → ④.","exps":[],"ai":"","fl":{}},{"k":"psy-y-c4-sm-2013","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 학습지 「소아청소년 정신의학」 113–144쪽(새 학습지)","year":"2013 객47","type":"객","rep":2,"repyears":"2022 객28","stem":"아래 열거된 질환 중에서 임상적으로 선택적 함구증과 관련이 높다고 알려진 것은 무엇인가?","choices":["사회공포증","광장공포증","범불안장애","주요우울장애","양극성장애"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 2교시): 선택적 함구증은 사회불안장애와 연관성이 높다고 본다(밖·낯선 사람 앞에서 더 심함).\n\n📚 학습지 해설: 선택적 함구증: 말할 줄 아는 능력이 있어도 특정 상황에서 말하지 않음 – 집·친숙한 환경에서는 잘 하지만 집 밖·유치원·학교에서는 말하지 않음, 부끄럼이 많고 위축, 분리불안·등교거부·지연된 언어습득·ODD 동반. 최근에는 말하기의 거부보다 말하기의 두려움 개념이 우세, 다양한 심리적 요인. 사회공포증: 당혹감을 줄 수 있는 사회적 상황·수행 상황을 지속적으로 두려워하고 피함 → 정답 ① 사회공포증.","exps":[],"ai":"","fl":{}},{"k":"psy-y-c4-soc-2018","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 학습지 「소아청소년 정신의학」 113–144쪽(새 학습지)","year":"2018 객21","type":"객","rep":1,"repyears":"","stem":"다음중 소아보다 청소년에서 잘 나타나는 불안장애는?","choices":["이인불안","사회불안","벌레공포","분리불안","혈액,주사 공포"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 2교시): 무서워하는 대상은 발달에 따라 바뀐다 – 6–10개월 분리불안·낯가림(외인 불안), 학령전기 어둠·상상·동물, 만 9세쯤 죽음 개념이 생기면 죽음·질병, 청소년기에는 다른 사람의 평가가 중요해져 사회불안(시선 공포, 관계 사고)이 초등 고학년·청소년기에 많이 시작된다.\n\n📚 학습지 해설: 분리불안장애·특정공포증 – 소아 초기 5–8세 이전 발병, 사회불안장애·강박장애 – 초기 청소년기 12–14세 이전 발병. ① 이인불안(낯가림)은 흔히 분리불안으로 나타나며 10–18개월에 고조되고 2–3세경 대부분 소멸 ② 정답 – 사회불안의 평균 발병연령은 13세 ③⑤ 특정공포증 ④ 분리불안은 소아에서 가장 흔한 불안장애 중 하나로 7–8세 호발.","exps":[],"ai":"","fl":{}},{"k":"psy-y-c4-ptsd-2018","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 학습지 「소아청소년 정신의학」 113–144쪽(새 학습지)","year":"2018 객27","type":"객","rep":1,"repyears":"","stem":"7세 남아가 두 달 전부터 잠을 안자고 야뇨증상과 불안증상이 있다. 이 증상은 아빠가 엄마를 때리는 장면을 목격 후에 시작되었다. 엄마와 떨어지지 않으려한다. 또한 남성 치료자를 보고 공포심을 느낀다. 이 환자의 진단은?","choices":["우울장애","불안장애","자폐증","주의력결핍","외상후스트레스장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 2교시): 가정폭력(아빠가 엄마를 때리고 협박)을 겪은 아이에서 엄마와 떨어지지 않으려는 분리불안이 생긴 증례를 들었다. 이 문제처럼 외상 사건 목격 후 1개월이 넘었으면 PTSD(1개월 이내는 급성 스트레스 장애).\n\n📚 학습지 해설: 신경정신의학 3판. 외상후 스트레스 장애 진단기준 – 외상성 사건의 직접 경험, 다른 사람에게 일어난 것을 생생하게 목격, 가족·친한 사람에게 일어난 것을 알게 됨, 혐오스러운 세부 사항에 반복 노출. 엄마가 아빠에게 폭행당하는 장면을 직접 목격했고 두 달 전이므로 ⑤ 외상후스트레스 장애. cf. 급성스트레스장애는 외상 후 1개월 이내.","exps":[],"ai":"","fl":{}},{"k":"psy-y-c4-tx-2021","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 학습지 「소아청소년 정신의학」 113–144쪽(새 학습지)","year":"2021 객27","type":"객","rep":5,"repyears":"2019 객25 · 2013 객40 · 2012 객40 · 2011 객36","stem":"다음 중 아동의 정싱장애와 일차적으로 사용되는 치료법을 연결한 것이다. 옳은 것은?","choices":["공포장애-언어치료","강박장애-인지행동치료","선택적 함구증-작업치료","자폐스펙트럼장애-미술치료","주의력 결핍 과다행동장애-감각통합훈련"],"ans":[2],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2019 객25","매년 나오는 야마 유형(복원자)."],"basis":"🎓 올해 수업 기준: 교수님(10/22 2교시): 소아 불안장애는 말로 하는 상담보다 행동으로 버티는 연습(노출)이 훨씬 효과적 – 특정공포는 점진적 노출이 1차(강아지 그림 → 장난감 → 강아지), 소아에게 홍수법(한 번에 노출)은 잘 쓰지 않는다. 사회불안도 노출(발표 시키기), 선택적 함구증은 밖에서 말하는 연습 + 놀이·상담치료, 범불안장애는 상담치료(정신치료)가 가장 효과적.\n\n📚 학습지 해설: 복원자: 매년 나오는 야마 유형, 각 질환별 치료법을 잘 정리해 두면 좋다. 공포장애 – 행동치료(체계적 탈감작·홍수법), 강박장애 – 약물 + 인지행동치료(정답 ②), 선택적 함구증 – 종합적 치료, 자폐 – 특수교육·행동치료, ADHD – 약물 + 인지행동치료.","exps":[],"ai":"","fl":{}},{"k":"psy-y-c4-tx-2013","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 학습지 「소아청소년 정신의학」 113–144쪽(새 학습지)","year":"2013 객40","type":"객","rep":5,"repyears":"2021 객27 · 2019 객25 · 2012 객40 · 2011 객36","stem":"다음은 아동의 정신장애와 일차적으로 사용되는 치료법을 짝지은 것이다. 옳은 것은?","choices":["주의력 결핍 과잉 행동장애 - 입원치료","공포장애 - 항정신약물","과잉불안장애 - 정신치료","의사소통장애 - 미술치료","소아 우울증 - 음악치료"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 2교시): 소아 불안장애는 말로 하는 상담보다 행동으로 버티는 연습(노출)이 훨씬 효과적 – 특정공포는 점진적 노출이 1차(강아지 그림 → 장난감 → 강아지), 소아에게 홍수법(한 번에 노출)은 잘 쓰지 않는다. 사회불안도 노출(발표 시키기), 선택적 함구증은 밖에서 말하는 연습 + 놀이·상담치료, 범불안장애는 상담치료(정신치료)가 가장 효과적.\n\n📚 학습지 해설: ① ADHD – 입원치료(X): 핵심은 약물·부모역할 훈련·인지행동·사회기술훈련 ② 공포장애 – 항정신약물(X): 행동치료(체계적 탈감작·홍수법·모델링·긍정적 강화), 사회공포증은 행동치료 + 사회기술훈련·인지 재정립 ③ 과잉불안장애 – 정신치료(O): 정신치료가 1차, 가족치료, 인지·집단·놀이치료, 약물은 항불안제 ④ 의사소통장애 – 미술치료(X) ⑤ 소아 우울증 – 음악치료(X).","exps":[],"ai":"","fl":{}},{"k":"psy-y-c4-tx-2012","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 학습지 「소아청소년 정신의학」 113–144쪽(새 학습지)","year":"2012 객40","type":"객","rep":5,"repyears":"2021 객27 · 2019 객25 · 2013 객40 · 2011 객36","stem":"다음은 소아기 정신장애와 주요치료 기법을 묶은 조합이다. 옳은 것은?","choices":["분리불안장애 - 노출 및 반응억제(exposure and response prevention)","기능성 유뇨증 - 인지치료","만성 틱장애 - 최면치료","범불안장애(과잉불안장애) - 정신치료","사회공포증(회피성장애) - 습관뒤집기 훈련(habit reversal)"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 2교시): 소아 불안장애는 말로 하는 상담보다 행동으로 버티는 연습(노출)이 훨씬 효과적 – 특정공포는 점진적 노출이 1차(강아지 그림 → 장난감 → 강아지), 소아에게 홍수법(한 번에 노출)은 잘 쓰지 않는다. 사회불안도 노출(발표 시키기), 선택적 함구증은 밖에서 말하는 연습 + 놀이·상담치료, 범불안장애는 상담치료(정신치료)가 가장 효과적.\n\n📚 학습지 해설: 1. 분리불안장애: 정신과적 응급, 대화로 해결, 가족치료 병행, 지지적 면담(놀이치료), 인지행동치료, 차선책으로 핸드폰, 지속적 등교거부 시 약물·입원 2. 유뇨증: imipramine(가장 많이)·desmopressin, 행동치료(bell and pad, bladder training), 정신치료는 심리적 갈등이 주요인일 때만 3. 틱: haloperidol·pimozide·risperidone·aripiprazole, 습관뒤집기·노출 및 반응억제 4. 범불안장애: 정신치료가 1차(정답 ④), 가족·인지·집단·놀이치료, 항불안제 5. 사회공포증: 행동치료가 가장 효과적(점진적 노출·홍수요법·모델링·긍정적 강화), 약물·긴장이완.","exps":[],"ai":"","fl":{}},{"k":"psy-y-c4-tx-2011","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 학습지 「소아청소년 정신의학」 113–144쪽(새 학습지)","year":"2011 객36","type":"객","rep":5,"repyears":"2021 객27 · 2019 객25 · 2013 객40 · 2012 객40","stem":"다음은 소아의 정신장애와 일차적으로 사용되는 치료법을 짝지은 것이다. 옳은 것은?","choices":["읽기장애 - 행동수정","과잉불안장애 - 정신치료","공포장애 - 항불안제 투여","우울증 - 습관뒤집기 훈련","주의력결핍 과잉행동장애 - 일대일 교정치료"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 2교시): 소아 불안장애는 말로 하는 상담보다 행동으로 버티는 연습(노출)이 훨씬 효과적 – 특정공포는 점진적 노출이 1차(강아지 그림 → 장난감 → 강아지), 소아에게 홍수법(한 번에 노출)은 잘 쓰지 않는다. 사회불안도 노출(발표 시키기), 선택적 함구증은 밖에서 말하는 연습 + 놀이·상담치료, 범불안장애는 상담치료(정신치료)가 가장 효과적.\n\n📚 학습지 해설: ① 읽기장애 – 언어치료와 특수치료, 읽기교육·집단치료·특수교육 ② 과잉불안장애 – 항불안제가 도움이 되나 1차적 치료는 정신치료적 접근(정답) ③ 공포장애 – 행동치료가 우선 ④ 우울증 – 가족·개인정신·인지치료·사회기술훈련 등 복합 접근, 습관뒤집기 훈련은 틱장애의 비약물 치료 ⑤ ADHD – 일대일 교정치료가 1차는 아님. (복원자: 풀이가 정확하지 않을 수 있다.)","exps":[],"ai":"","fl":{}},{"k":"psy-y-c4-dep-2025","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 학습지 「소아청소년 정신의학」 113–144쪽(새 학습지)","year":"2025 객20","type":"객","rep":4,"repyears":"2022 객34 · 2014 객2 · 2011 객44","stem":"소아청소년의 우울장애의 특징으로 옳은 것은?","choices":["조현병을 주로 동반한다.","SSRI를 주로 사용한다.","성인보다 약물치료 효과가 좋다.","성인까지 이어지는 경우는 드물다.","소아 발병 우울증이 성인 발병 우울증보다 재발이 드물다."],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 3교시): 소아청소년 우울증 진단 기준은 성인과 같지만 짜증·분노·신체 증상·행동 문제로 많이 나타나 우울해 보이지 않는다(가면 우울증) – 갑작스러운 성적 저하·반항·식사·수면 변화를 잘 살핀다. 약물은 SSRI·SNRI·NDRI(bupropion), TCA는 효과가 별로 없고 소아는 심장독성(QT 연장)에 취약해 거의 퇴출 (imipramine은 야뇨증에 가끔). 소아 발병 우울증은 유전 요인이 더 많고 재발도 많아 예후가 더 안 좋다. 교수님은 공존질환(ADHD 등)은 따로 언급하지 않았다.\n\n📚 학습지 해설: 박태원 교수님 우울장애 강의록, 22Y. 1. 주로 불안장애·행동장애 등을 동반 2. 소아 우울증에서는 SSRI를 사용(SNRI·NDRI 계열도 가능, 정답) 3. 약물치료 반응이 성인보다 낮은 편 4. 흔히 성인기 우울증으로 이어짐 5. 재발 가능성이 성인보다 높음(20–60%가 1–2년 내 재발, 70%가 5년 내 재발).","exps":[],"ai":"","fl":{}},{"k":"psy-y-c4-dep-2022","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 학습지 「소아청소년 정신의학」 113–144쪽(새 학습지)","year":"2022 객34","type":"객","rep":4,"repyears":"2025 객20 · 2014 객2 · 2011 객44","stem":"소아에서의 우울장애의 특징중 맞는 것은?","choices":["조현병을 동발한다.","삼환기 우울증 약이 치료효과가 좋다.","성인보다 약물치료 효과가 좋다.","소아에서 성인보다 재발이 드물다.","소아에서 성인보다 ADHD 발병이 높다."],"ans":[5],"imgs":[],"vis":[],"notes":["복원자 해설은 \"소아에서 성인보다 adhd 발병이 높습니다\" 한 줄뿐 – 나머지 선지가 모두 틀려 ⑤."],"basis":"🎓 올해 수업 기준: 교수님(10/22 3교시): 소아청소년 우울증 진단 기준은 성인과 같지만 짜증·분노·신체 증상·행동 문제로 많이 나타나 우울해 보이지 않는다(가면 우울증) – 갑작스러운 성적 저하·반항·식사·수면 변화를 잘 살핀다. 약물은 SSRI·SNRI·NDRI(bupropion), TCA는 효과가 별로 없고 소아는 심장독성(QT 연장)에 취약해 거의 퇴출 (imipramine은 야뇨증에 가끔). 소아 발병 우울증은 유전 요인이 더 많고 재발도 많아 예후가 더 안 좋다. 교수님은 공존질환(ADHD 등)은 따로 언급하지 않았다. ⑤(ADHD)는 올해 수업에서 직접 다루지 않아 학습지 해설 그대로 외우는 수밖에 없다.\n\n📚 학습지 해설: 소아 우울장애. 복원자 해설은 \"소아에서 성인보다 ADHD 발병이 높습니다\" 한 줄뿐. 나머지 – ① 조현병 동반 X ② 삼환계는 효과가 없고 심장독성 ③ 약물 반응은 성인보다 낮음 ④ 재발은 더 흔함 → ⑤.","exps":[],"ai":"","fl":{}},{"k":"psy-y-c4-dep-2014","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 학습지 「소아청소년 정신의학」 113–144쪽(새 학습지)","year":"2014 객2","type":"객","rep":4,"repyears":"2025 객20 · 2022 객34 · 2011 객44","stem":"다음 중 성인과 달리 소아기 주요우울장애에서 특징적인 것은?","choices":["짜증 대신 우울을 자주 보인다.","여자에게 2~3배 더 흔히 발생한다.","가족 중 기분장애 발생 빈도가 높다.","수면다원 검사에서 특이적인 소견을 보인다.","약물치료에 대한 효과가 더 크고 재발비율이 낮다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 3교시): 소아청소년 우울증 진단 기준은 성인과 같지만 짜증·분노·신체 증상·행동 문제로 많이 나타나 우울해 보이지 않는다(가면 우울증) – 갑작스러운 성적 저하·반항·식사·수면 변화를 잘 살핀다. 약물은 SSRI·SNRI·NDRI(bupropion), TCA는 효과가 별로 없고 소아는 심장독성(QT 연장)에 취약해 거의 퇴출 (imipramine은 야뇨증에 가끔). 소아 발병 우울증은 유전 요인이 더 많고 재발도 많아 예후가 더 안 좋다. 교수님은 공존질환(ADHD 등)은 따로 언급하지 않았다.\n\n📚 학습지 해설: 신경정신의학 583쪽 소아기 기분장애: 성인의 전형적 우울감·죄책감 외에 짜증·분노발작·신체증상 호소를 흔히 나타냄(①). 소아는 성인과 달리 남녀 빈도 차이가 별로 없고 초등학생은 오히려 남아가 많음(②). 유전적 요인의 증거로 소아 우울장애 아 function secOpts(){var p=$('fProf').value;opts($('fSec'),'전체 섹션',secs.filter(function(s){return !p||Q.some(function(q){return q.sec===s[0]&&q.prof===p})}))}
secOpts();
opts($('fArea'),'전체 영역',areas.map(function(a){return[a,a]}));
if(areas.length<2)$('fArea').hidden=true;
if(!Q.some(function(q){return q.rep>1}))$('fRep').hidden=true;
var F={prof:'',sec:'',area:'',type:'',rep:'',st:'',q:'',chip:'',shuf:false,seed:1};
Object.keys(F).forEach(function(k){if(U.f&&U.f[k]!=null)F[k]=U.f[k]});
function syncCtl(){$('fProf').value=F.prof;secOpts();$('fSec').value=F.sec;$('fArea').value=F.area;$('fType').value=F.type;$('fRep').value=F.rep;$('fSt').value=F.st;$('fQ').value=F.q;
  [].forEach.call(document.querySelectorAll('#chips .chip[data-v]'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===F.chip))});$('shuf').setAttribute('aria-pressed',String(!!F.shuf))}
function solved(a){return !!(a&&(a.c!=null||a.self))}
function inWrong(k){var a=S.a[k],f=S.f[k]||{};return !!(a&&a.w>0&&!f.out)}
function memoOf(k){var m=S.m[k];return m&&m.x?m.x:''}
function pass(q){var k=q.k,f=S.f[k]||{},a=S.a[k];
  if(F.prof&&q.prof!==F.prof)return false;if(F.sec&&q.sec!==F.sec)return false;if(F.area&&q.area!==F.area)return false;if(F.type&&q.type!==F.type)return false;
  if(F.rep){var r=q.rep||1;if(F.rep==='3'&&r<3)return false;if(F.rep==='2'&&r!==2)return false;if(F.rep==='23'&&r<2)return false;if(F.rep==='1'&&r!==1)return false}
  var fl=q.fl||{};
  switch(F.st){case'inscope':if(fl.oos||f.oos)return false;break;case'tyb':if(!fl.tyb)return false;break;case'nowarn':if(fl.warn)return false;break;case'chk':if(!fl.chk)return false;break;case'inc':if(!fl.inc)return false;break;case'ydiff':if(!fl.ydiff)return false;break;
    case'img':if(!q.imgs||!q.imgs.length)return false;break;case'noimg':if(q.imgs&&q.imgs.length)return false;break;case'myerr':if(!f.err)return false;break;case'myoos':if(!f.oos)return false;break}
  switch(F.chip){case'new':if(solved(a))return false;break;case'wrong':if(!inWrong(k))return false;break;case'conf':if(!f.conf)return false;break;case'memo':if(!memoOf(k))return false;break}
  if(F.q){var t=(q.year+' '+q.meta+' '+q.stem+' '+q.choices.join(' ')+' '+q.ans.map(function(n){return q.choices[n-1]||''}).join(' ')+' '+q.sec+' '+memoOf(k)).toLowerCase();
    var ws=F.q.toLowerCase().split(/\s+/).filter(Boolean);for(var i=0;i<ws.length;i++)if(t.indexOf(ws[i])<0)return false}
  return true}
function rnd(seed){return function(){seed=(seed*1103515245+12345)%2147483648;return seed/2147483648}}
var L=[],cur=U.cur||null;
function refilter(keep){L=Q.filter(pass);if(F.shuf){var r=rnd(F.seed);for(var i=L.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=L[i];L[i]=L[j];L[j]=t}}
  if(!keep||!L.some(function(q){return q.k===cur}))cur=L.length?L[0].k:null;saveUI();render()}
function saveUI(){lsSet(UK,{f:F,cur:cur})}
function idx(){for(var i=0;i<L.length;i++)if(L[i].k===cur)return i;return -1}

/* ---------- 상단 숫자 ---------- */
function stats(){var n=0,ok=0,wrong=0,memo=0;Q.forEach(function(q){var a=S.a[q.k];if(solved(a)){n++;if(a.ok)ok++}if(inWrong(q.k))wrong++;if(memoOf(q.k))memo++});
  var img=Q.filter(function(q){return q.imgs&&q.imgs.length}).length;
  $('stats').innerHTML='<span>전체<b>'+Q.length+'</b></span>'+(img?'<span>원본 그림<b>'+img+'</b>문항</span>':'')+'<span>푼 것<b>'+n+'</b></span><span>최근 정답<b>'+(n?Math.round(ok/n*100):0)+'%</b></span><span>오답노트<b>'+wrong+'</b></span><span>메모<b>'+memo+'</b></span>'}

/* ---------- 문제 카드 ---------- */
function render(){stats();var i=idx(),v=$('view');
  $('pos').innerHTML=L.length?'<b>'+(i+1)+'</b> / '+L.length:'0 / 0';
  $('prev').disabled=i<=0;$('next').disabled=i<0||i>=L.length-1;
  if(i<0){v.innerHTML='<div class="card empty">조건에 맞는 문제가 없어요. 위 필터나 칩을 바꿔 보세요.</div>';return}
  var q=L[i],k=q.k,a=redo[k]?null:S.a[k],f=S.f[k]||{},hasAns=!!(q.ans&&q.ans.length&&q.choices.length),done=!!(a&&(a.c!=null||a.self||a.pend));
  var h='<article class="card'+(done?' done':'')+'">';
  h+='<div class="head"><span class="pill">'+(q.type==='주'?'주관식':'객관식')+'</span>'+(areas.length>1?'<span class="pill area">'+esc(q.area)+'</span>':'')+(q.rep>1?'<span class="pill king">'+(q.rep>=3?'👑👑 킹킹야':'👑 킹야')+' · '+q.rep+'회</span>':'')+'<span>'+esc(q.prof)+(q.sec?' · '+esc(q.sec):'')+'</span></div>';
  if(q.year||q.meta)h+='<div class="meta">'+esc(q.year?q.year+(q.repyears?' · 반복 '+q.repyears:''):q.meta)+'</div>';
  (q.notes||[]).forEach(function(n){h+='<div class="note'+(/범위\s?외/.test(n)?' oos':'')+'">'+esc(n)+'</div>'});
  if(f.err)h+='<div class="note">⚑ 내가 문제오류로 표시함</div>';if(f.oos)h+='<div class="note oos">내가 범위외로 표시함</div>';
  h+='<div class="stem">'+esc(q.stem)+'</div>';
  if(q.imgs&&q.imgs.length)h+='<div class="imgs">'+q.imgs.map(function(s){return '<img src="'+esc(s)+'" alt="문제 사진" loading="lazy">'}).join('')+'</div>';
  (q.vis||[]).forEach(function(t){h+='<div class="vis">'+esc(t)+'</div>'});
  if(q.choices.length){h+='<div class="choices">';q.choices.forEach(function(c,j){var n=j+1,cl='ch';
      if(done&&hasAns){if(q.ans.indexOf(n)>=0)cl+=' right';else if(a.c===n)cl+=' wrong'}if(done&&a.c===n)cl+=' mine';
      h+='<button class="'+cl+'" data-n="'+n+'"'+(done?' disabled':'')+'><span class="no">'+'①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬'.charAt(j)+'</span><span>'+esc(c)+'</span></button>'});h+='</div>'}
  if(!done&&(!hasAns))h+='<div class="acts"><button class="btn pri" id="reveal">정답·해설 보기</button></div>';
  if(done){
    if(hasAns&&a.c!=null)h+='<div class="result '+(a.ok?'ok':'bad')+'">'+(a.ok?'정답이에요':'오답이에요 · 정답 '+q.ans.join(', ')+'번')+'</div>';
    else h+='<div class="result">'+(hasAns?'정답 '+q.ans.join(', ')+'번':'정답을 확인하고 맞았는지 골라 주세요')+'</div>'+(a&&a.self?'':'<div class="acts"><button class="chip" id="selfOk">⭕ 맞았어요</button><button class="chip" id="selfBad">❌ 틀렸어요</button></div>');
    h+='<div class="exp">';if(q.ai)h+='<div class="ai">'+esc(q.ai)+'</div>';
    if(q.basis)h+='<h3>해설</h3>'+esc(q.basis);
    if(q.exps&&q.exps.length)h+='<h3>선지별 해설</h3><ol>'+q.exps.map(function(e){return '<li>'+esc(e)+'</li>'}).join('')+'</ol>';
    h+='</div>'}
  h+='<div class="acts"><button class="chip" id="tConf" aria-pressed="'+!!f.conf+'">🟡 헷갈림</button>'+(done?'<button class="chip" id="redo">↺ 다시 풀기</button>':'')+(inWrong(k)?'<button class="chip" id="tOut">오답노트에서 빼기</button>':'')+'<button class="chip" id="tErr" aria-pressed="'+!!f.err+'">⚑ 문제오류</button><button class="chip" id="tOos" aria-pressed="'+!!f.oos+'">범위외</button></div>';
  h+='<div class="memo"><label for="memo">내 메모 · 뭐가 헷갈렸는지, 외울 포인트</label><textarea id="memo" placeholder="예: 3번이랑 헷갈림. A는 급성, B는 만성!">'+esc(memoOf(k))+'</textarea><div class="saved" id="memoSt"></div></div>';
  h+='<div class="bottomnav"><button class="btn" id="prev2"'+(i<=0?' disabled':'')+'>이전</button><button class="btn pri" id="next2"'+(i>=L.length-1?' disabled':'')+'>다음</button></div>';
  h+='</article>';v.innerHTML=h;
  [].forEach.call(v.querySelectorAll('.ch'),function(b){b.onclick=function(){answer(q,+b.getAttribute('data-n'))}});
  var r=$('reveal');if(r)r.onclick=function(){var x=S.a[k]||{w:0,n:0};x.c=null;x.self=0;x.pend=1;x.t=now();S.a[k]=x;delete redo[k];changed();render()};
  var so=$('selfOk'),sb=$('selfBad');if(so)so.onclick=function(){self(q,true)};if(sb)sb.onclick=function(){self(q,false)};
  $('tConf').onclick=function(){flag(k,'conf')};$('tErr').onclick=function(){flag(k,'err')};$('tOos').onclick=function(){flag(k,'oos')};
  var o=$('tOut');if(o)o.onclick=function(){flag(k,'out',true)};
  var rd=$('redo');if(rd)rd.onclick=function(){redo[k]=1;render()};
  $('prev2').onclick=go.bind(null,-1);$('next2').onclick=go.bind(null,1);
  var m=$('memo'),mt=null;m.oninput=function(){clearTimeout(mt);$('memoSt').textContent='입력 중…';mt=setTimeout(function(){var x=m.value.trim();if(x)S.m[k]={x:m.value,t:now()};else S.m[k]={x:'',t:now()};changed();stats();$('memoSt').textContent='저장됨'},600)};
}
// 다시 풀기: 기록(틀린 횟수)은 남기고 화면만 처음 상태로
var redo={};
function answer(q,n){var k=q.k,a=S.a[k]||{w:0,n:0};var ok=q.ans.indexOf(n)>=0;
  a.c=n;a.ok=ok;a.self=0;a.n=(a.n||0)+1;if(!ok)a.w=(a.w||0)+1;a.t=now();a.pend=0;S.a[k]=a;delete redo[k];
  if(!ok&&S.f[k]&&S.f[k].out){S.f[k].out=false;S.f[k].t=now()}changed();render()}
function self(q,ok){var k=q.k,a=S.a[k]||{w:0,n:0};a.c=null;a.self=1;a.ok=ok;a.n=(a.n||0)+1;if(!ok)a.w=(a.w||0)+1;a.t=now();a.pend=0;S.a[k]=a;delete redo[k];changed();render()}
function flag(k,name,val){var f=S.f[k]||{};f[name]=val!=null?val:!f[name];f.t=now();S.f[k]=f;changed();render()}
function go(d){var i=idx()+d;if(i<0||i>=L.length)return;cur=L[i].k;saveUI();render();window.scrollTo({top:$('pos').getBoundingClientRect().top+window.scrollY-10})}
$('prev').onclick=go.bind(null,-1);$('next').onclick=go.bind(null,1);
document.addEventListener('keydown',function(e){if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});


/* ---------- 필터 이벤트 ---------- */
$('fProf').onchange=function(){F.prof=this.value;F.sec='';secOpts();refilter()};
$('fSec').onchange=function(){F.sec=this.value;refilter()};$('fArea').onchange=function(){F.area=this.value;refilter()};
$('fType').onchange=function(){F.type=this.value;refilter()};$('fRep').onchange=function(){F.rep=this.value;refilter()};$('fSt').onchange=function(){F.st=this.value;refilter()};
var qt=null;$('fQ').oninput=function(){clearTimeout(qt);var v=this.value;qt=setTimeout(function(){F.q=v.trim();refilter()},250)};
[].forEach.call(document.querySelectorAll('#chips .chip[data-v]'),function(b){b.onclick=function(){F.chip=b.getAttribute('data-v');syncCtl();refilter()}});
$('shuf').onclick=function(){F.shuf=!F.shuf;F.seed=Math.floor(Math.random()*1e9)+1;syncCtl();refilter()};

/* ---------- 시트(목록·백업·내보내기) ---------- */
function sheet(h){$('sheetBox').innerHTML=h;$('sheet').hidden=false}
function closeSheet(){$('sheet').hidden=true}
$('sheet').onclick=function(e){if(e.target.id==='sheet')closeSheet()};
$('bList').onclick=function(){var h='<h2>목록 · '+L.length+'문항</h2><ul class="list">';
  L.forEach(function(q,i){var a=S.a[q.k];h+='<li data-k="'+esc(q.k)+'"'+(q.k===cur?' class="cur"':'')+'><span class="n">'+(i+1)+'</span><span class="t"><span class="dot'+(solved(a)?(a.ok?' ok':' bad'):'')+'"></span>'+esc(q.stem.slice(0,70))+(q.stem.length>70?'…':'')+'<div class="s">'+esc((q.area||'')+' · '+q.sec+(q.year?' · '+q.year:''))+(memoOf(q.k)?' · 📝 '+esc(memoOf(q.k).slice(0,30)):'')+'</div></span></li>'});
  h+='</ul><div class="tools"><button class="btn" id="cls">닫기</button></div>';sheet(h);
  [].forEach.call(document.querySelectorAll('.list li'),function(li){li.onclick=function(){cur=li.getAttribute('data-k');saveUI();closeSheet();render()}});
  $('cls').onclick=closeSheet;var c=document.querySelector('.list li.cur');if(c)c.scrollIntoView({block:'center'})};
function copyBox(title,text,note){sheet('<h2>'+esc(title)+'</h2><div class="msg" id="cmsg">'+esc(note||'')+'</div><textarea id="cbox" readonly></textarea><div class="tools"><button class="btn pri" id="ccopy">복사</button><button class="btn" id="cls">닫기</button></div>');
  $('cbox').value=text;$('cls').onclick=closeSheet;
  $('ccopy').onclick=function(){var b=$('cbox');function fb(){b.focus();b.select();$('cmsg').textContent='자동 복사가 막혔어요. 칸을 길게 눌러 전체 선택 → 복사하세요.'}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){$('cmsg').textContent='복사했어요.'},fb);else fb()}}
function exportText(){var out=Q.filter(function(q){var f=S.f[q.k]||{};return inWrong(q.k)||f.conf||memoOf(q.k)});
  return out.map(function(q,i){var a=S.a[q.k]||{},f=S.f[q.k]||{},tags=[];if(inWrong(q.k))tags.push('틀림 '+a.w+'회'+(a.ok?' (마지막엔 맞힘)':''));if(f.conf)tags.push('헷갈림');
    return '=== '+(i+1)+'. '+q.sec+' ['+q.area+'] ('+q.prof+') ===\n'+(q.year?'기출: '+q.year+'\n':'')+(tags.length?'표시: '+tags.join(' / ')+'\n':'')+'문제: '+q.stem+(q.imgs&&q.imgs.length?' [사진 있음]':'')+'\n'+q.choices.map(function(c,j){return (j+1)+'. '+c}).join('\n')+
      '\n정답: '+(q.ans.join(',')||'-')+(memoOf(q.k)?'\n내 메모: '+memoOf(q.k):'')+(q.basis?'\n해설: '+q.basis:'')+(q.exps&&q.exps.length?'\n선지해설:\n'+q.exps.map(function(e,j){return (j+1)+'. '+e}).join('\n'):'')}).join('\n\n')}
$('bExp').onclick=function(){var t=exportText();copyBox('오답·헷갈림·메모 내보내기',t||'아직 틀리거나 헷갈림·메모를 남긴 문제가 없어요.',(t?t.split('\n=== ').length:0)+'문항 · 복사해서 AI 대화창이나 메모장에 붙여넣으세요.')};
$('bBak').onclick=function(){copyBox('기록 백업',JSON.stringify({app:APP,at:new Date().toISOString(),s:S}),'이 글을 복사해 두면 나중에 “백업 불러오기”로 되살릴 수 있어요.')};
$('bRes').onclick=function(){sheet('<h2>백업 불러오기</h2><div class="msg" id="rmsg">“기록 백업”에서 복사한 글을 붙여넣고 불러오기를 누르세요. 지금 기록과 합쳐져요.</div><textarea id="rbox"></textarea><div class="tools"><button class="btn pri" id="rgo">불러오기</button><button class="btn" id="cls">닫기</button></div>');
  $('cls').onclick=closeSheet;$('rgo').onclick=function(){try{var o=JSON.parse($('rbox').value);merge(o.s||o);changed();refilter(true);$('rmsg').textContent='불러왔어요.'}catch(e){$('rmsg').textContent='백업 글 형식이 아니에요. 처음부터 끝까지 그대로 붙여넣었는지 확인해 주세요.'}}};

/* ---------- 저장·계정 동기화 ---------- */
function merge(o){['a','f','m'].forEach(function(x){var src=(o&&o[x])||{};Object.keys(src).forEach(function(k){var v=src[k];if(!v)return;var c=S[x][k];if(!c||(v.t||0)>(c.t||0))S[x][k]=v})})}
var DB=null,UID=null,pt=null,dirty=false;
function changed(){lsSet(LK,S);dirty=true;clearTimeout(pt);pt=setTimeout(push,2500)}
function push(){if(!DB||!UID||!dirty)return;dirty=false;
  var st={a:S.a,f:S.f,updatedAt:new Date().toISOString()},mm={m:S.m,updatedAt:st.updatedAt};
  Promise.all([DB.doc('st/'+UID).set(st),DB.doc('memo/'+UID).set(mm)]).then(function(){$('sync').textContent='계정에 저장됨 · 모든 기기 연결'},function(){dirty=true;$('sync').textContent='계정 저장 실패 · 이 기기에는 저장됨'})}
function pull(){if(!DB||!UID)return Promise.resolve();$('sync').textContent='계정 기록 연결 중…';
  return Promise.all([DB.doc('st/'+UID).get(),DB.doc('memo/'+UID).get()]).then(function(r){
    var s=r[0]&&r[0].exists?r[0].data():null,m=r[1]&&r[1].exists?r[1].data():null;
    if(s)merge({a:s.a,f:s.f});if(m)merge({m:m.m});lsSet(LK,S);refilter(true);$('sync').textContent='계정에 저장됨 · 모든 기기 연결';
    if(!s||!m||Object.keys(S.a).length)dirty=true,push()},function(){$('sync').textContent='계정 연결 실패 · 이 기기에만 저장'})}
$('bSync').onclick=function(){if(DB)pull();else{S=lsGet(LK)||S;refilter(true)}};
window.addEventListener('pagehide',function(){lsSet(LK,S);push()});
if(window.claude&&window.claude.use){Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
  if(!r[0]||!r[1]){$('sync').textContent='이 기기에 저장됨';return}DB=r[0];return r[1].id().then(function(id){if(!id){$('sync').textContent='이 기기에 저장됨';DB=null;return}UID=id;return pull()})}).catch(function(){$('sync').textContent='이 기기에 저장됨'})}
else $('sync').textContent='이 기기에 저장됨';

syncCtl();refilter(true);
})();
</script>
