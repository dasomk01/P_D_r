애(신체형)","주요우울장애(정신병적 양상)","편집형 조현병(피해형)","양극성장애 조증 삽화","알츠하이머형 치매(초기)"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 15·19쪽·교수님: 사고장애가 심해지면 빈곤망상·질병망상·허무망상·죄책망상까지 갈 수 있다. 망상·환각이 있다고 다 조현병이 아니고, 기분 증상이 심할 때 \"with psychotic features\"가 붙는다. 집도 있고 돈도 있는데 100만 원 잃고 굶어 죽는다는 건 현실과 동떨어진 망상.","exps":["기분 증상이 동반된다.","정답.","기분 증상이 핵심이다.","우울 삽화다.","검사 정상, 급성 발병."],"ai":"","fl":{}},{"k":"psy-md-08","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 16–18쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"우울증의 정신운동 증상과 신체 증상에 대한 설명으로 옳은 것은?","choices":["노인에서는 인지 저하가 생기지 않는다","초조나 지체가 모두 나타날 수 있다","정신운동 증상은 주관적 호소로만 평가한다","수면은 항상 줄고 식욕은 항상 줄어든다","두통 등 신체 증상은 동반되지 않는다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 16–18쪽·교수님: 정신운동 증상은 객관적으로 평가 – 초조(손을 계속 움직이고 시선이 불안)와 지체(목소리가 작고 느리며 시선이 아래, 손을 거의 안 움직임). 노인에서 지체가 심하면 기억력·지남력 저하(가성치매). 수면·식욕은 감소도 증가도 있고, 두통·소화장애 등 신체 증상도 흔하다.","exps":["가성치매가 나타난다.","정답.","객관적으로 평가한다.","양방향 모두 가능하다.","흔히 동반된다."],"ai":"","fl":{}},{"k":"psy-md-09","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 23쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"주요우울장애 치료에서 가장 중요한 주의사항과 가장 효과적인 전략의 연결로 옳은 것은?","choices":["활동량 강요 – 정신치료 단독","빠른 퇴원 – 약물 단독","자살 예방·전신쇠약 교정 – 약물 + 정신치료","가족 면담 금지 – 약물 + 정신치료","체중 증가 방지 – 약물 단독"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 23쪽·교수님: 경한 우울증은 외래 가능(가족의 관심·지지 필요). 가장 중요한 것은 자살 예방과 전신쇠약 교정. 입원: 진단 절차, 자살·타살 위험, 의식주 해결 불가, 급작스런 악화, 지지구조 미약. 가장 효과적인 전략은 약물 + 정신치료(매년 나오는 야마).","exps":["강요하지 않는다.","해당 없다.","정답.","가족 면담을 많이 한다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-md-10","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 25쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"항우울제의 효과를 판단하기 위해 필요한 최소 복용 기간과 교수님의 설명이 옳게 짝지어진 것은?","choices":["1년 – 그전에는 평가하지 않는다","1–2일 – 수면제처럼 바로 효과가 난다","최소 3–5주 – 막힌 고속도로에 새 도로를 내는 것과 같다","1주 – 느낌이 없으면 중단한다","6개월 – 효과가 없으면 바로 끊는다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 25쪽·교수님: 최소 3–5주(교수님은 4–6주로도 설명). 수면제·항불안제는 바로 효과가 나지만 항우울제는 신경전달물질이 새 도로를 건설하는 것과 같아 시간이 걸린다. 일주일 먹고 느낌이 없다고 끊는 경우가 많다.","exps":["해당 없다.","항불안제 설명이다.","정답.","너무 짧다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-md-11","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 26쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"항우울제 복약 순응도와 중단에 대한 설명으로 옳은 것은?","choices":["50%가 3개월 내 중단하고, 끊으면 금단증상이 생길 수 있다","항우울제는 내성과 의존성이 매우 강하다","반감기가 긴 약일수록 중단 증상이 심하다","처음 투여받은 환자 대부분이 1년 이상 꾸준히 복용한다","중단 증상은 약물 중독의 확실한 증거다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 26쪽·교수님: 약 30%가 1개월, 50%가 3개월 이내 중단. 장기 사용하거나 반감기가 짧은 약을 끊으면 감기 유사 증상·불면·구역·두통·어지럼 등. 담배 끊을 때 금단처럼 생기는 것이지 독하거나 중독된 것이 아니다 – 정해진 만큼 먹으면 의존성·내성 걱정은 없다고 설명.","exps":["정답.","그렇지 않다고 설명한다.","반감기가 짧을수록 심하다.","절반이 3개월 안에 끊는다.","중독이 아니다."],"ai":"","fl":{}},{"k":"psy-md-12","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 27–29쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"우울증 환자에 대한 가족·친구의 대처로 옳지 않은 것은?","choices":["거절하면 정중하게 다시 권유한다","\"왜 게으름 피우냐\"며 빨리 움직이게 다그친다","자살을 언급하면 담당 의사에게 알린다","이야기를 주의 깊게 경청한다","진료 예약을 돕고 약을 잘 먹도록 권한다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 27–29쪽·교수님: 비난하지 말 것(꾀병·게으름), 너무 조급하게 강요하거나 많이 요구하지 말 것 – 주변에서 너무 부담을 주면 그것 때문에 죄책감이 생긴다는 환자도 있다. 그래서 가족 면담을 많이 한다.","exps":["옳다.","정답.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-md-13","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 33–34쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"지속성 우울장애(기분저하증)에 대한 설명으로 옳은 것은?","choices":["아동에서는 3년 이상이어야 한다","주요우울장애와 동시에 진단할 수 없다","심한 우울 증상이 2주 이상 지속된다","조증 삽화가 있어야 한다","경한 우울이 2년 이상, 우울한 날이 없는 날보다 많다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 33–34쪽·교수님: 주요우울장애는 심한 증상이 2주 이상 거의 매일, 지속성 우울장애는 경한 우울이 2년 이상(아동·청소년 1년) 있는 날이 더 많은 것. 최근 2주가 주요우울장애 기준도 만족하면 함께 진단(dual diagnosis)하는 경우도 많다.","exps":["1년이다.","함께 진단하기도 한다.","주요우울장애다.","없어야 한다.","정답."],"ai":"","fl":{}},{"k":"psy-md-14","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 37·75쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"양극성 우울증(bipolar depression)에 대한 교수님 설명으로 옳은 것은?","choices":["항우울제 단독 치료가 원칙이다","항우울제로 조증 전환(mood switch)이 올 수 있다","양극성장애에서 우울 삽화는 드물게만 온다","조증 없이 우울 삽화만 있는 경우다","단극성 우울증보다 자살 위험이 낮다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 37·75쪽·교수님: 조증 없이 우울만 있으면 단극성. 양극성 우울증에 항우울제를 쓰면 무드 스위치로 조증이 확 떠서 응급실로 오기도 한다. 자살 충동·실행도 단극성보다 높다. 항우울제는 심한 우울 기간에 기분안정제와 함께, 전환 위험이 적은 MAOI·bupropion·일부 SSRI.","exps":["기분안정제와 병행한다.","정답.","중요한 삽화다.","단극성 우울증이다.","더 높다."],"ai":"","fl":{}},{"k":"psy-md-15","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 39쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"산후 우울감(baby blues)과 산후 우울증의 비교로 옳은 것은?","choices":["산후 우울증은 출산 6개월 후에 시작한다","산후 우울감은 반드시 약물치료가 필요하다","산후 우울증은 아이에게는 영향이 없다","우울감은 대부분 3–4일, 우울증은 2주 이상 심하다","산후 우울감은 산모의 5% 정도에서만 생긴다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 39쪽·교수님: baby blues는 산모의 75–80%가 겪고 3–4일 기분이 오락가락하다 금방 괜찮아진다. 산후 우울증은 2주 이상 주요우울장애를 진단할 정도로 심하고 산모·영아 모두 위험해 빠르게 대처한다(산후 4주 이내 발생).","exps":["4주 이내 발생.","금방 좋아진다.","아이도 위험하다.","정답.","대부분 겪는다."],"ai":"","fl":{}},{"k":"psy-md-16","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 40–41쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"연령별 우울증 양상에 대한 설명으로 옳지 않은 것은?","choices":["집중력이 떨어진 아이는 모두 ADHD로 진단한다","노인은 신체 증상 호소가 젊은 사람보다 많다","소아는 학교 가기를 힘들어하고 부모에게 과도하게 애착할 수 있다","청소년은 비행 문제로 오기도 한다","소아는 우울하다고 표현하기보다 복통 같은 신체 증상을 호소하기도 한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 40–41쪽·교수님: 소아는 신체 증상·학교공포·애착, 집중력·기억력 저하로 ADHD가 아닌가 하고 오는 경우가 많아 히스토리와 가정환경을 면밀히 본다. 청소년은 비행 뒤에 우울·불안이 숨어 있다. 노인은 신체 증상이 많고 치매와 감별.","exps":["정답. 우울증도 감별해야 한다.","옳다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-md-17","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 42쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"노인 우울증의 가성치매(pseudodementia)를 진성치매와 감별하는 특징으로 옳은 것은?","choices":["최근·먼 기억이 모두 장애","하루 중 변화가 없다","질문에 작화증을 보인다","항우울제에 반응이 없다","서서히 발병한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 42쪽(매년 나오는 표)·교수님: 가성치매 – 급성 발병(우울이 인지 저하보다 선행), 일중 변화 있음, \"모른다\"는 식의 대답(의욕이 없어 계속 물으면 다 하기 싫어함), 최근·먼 기억 모두 장애, 항우울제에 호전. 진성치매 – 서서히, 일중 변화 없음, 작화증, 최근 기억 장애, 전반적 인지 장애.","exps":["정답.","진성치매다.","진성치매다.","가성치매는 호전된다.","진성치매다."],"ai":"","fl":{}},{"k":"psy-md-18","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 47·50쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"제I형 양극성장애의 역학으로 옳은 것은?","choices":["여자가 남자보다 2배 많다","유전 요인은 우울장애보다 덜 중요하다","평균 발병 연령은 노년기다","성비 1:1, 우울장애보다 이른 20대 발병","평생 유병률이 20% 이상이다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 47·50쪽·교수님: 유병률 0.6–2.5%(3–6.5% 보고도), 우울증은 여자가 많지만 양극성 I형은 1:1, 발병은 우울증보다 빠른 20대. I형에서 유전 요인이 주요우울장애보다 더 중요(특정 유전자는 아직 없음).","exps":["성비 차이가 없다.","더 중요하다.","20대다.","정답.","0.6–2.5%다."],"ai":"","fl":{}},{"k":"psy-md-19","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 51–59쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"조증 삽화에 대한 설명으로 옳은 것은?","choices":["증상이 반드시 2주 이상 지속되어야 한다","지남력이 대부분 심하게 손상된다","1주 이상이나, 입원이 필요하면 기간 무관","수면 욕구가 평소보다 증가한다","가장 흔한 기분은 유쾌한 기분이다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 51–52·59쪽·교수님: 조증 삽화는 1주 이상이지만 입원이 필요하면 기간 무관. 기분이 좋기만 한 것이 아니고 가장 흔한 기분은 과민한 기분(71%), 유쾌 63%, 대범 60%. 잠을 안 자도 피곤하지 않다. 지남력·기억력은 대체로 건전(심하면 섬망성 조증).","exps":["1주다.","대체로 보존된다.","정답.","감소한다.","과민한 기분이다."],"ai":"","fl":{}},{"k":"psy-md-20","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 53–56쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"조증 환자가 말이 매우 빠르고 많아서 상대방이 말을 멈추게 할 수 없는 상태를 무엇이라 하는가?","choices":["신어 조작증","사고 이탈(탈선)","보속증(반복)","함구증(무언증)","언어 압력"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 53·55쪽·교수님: 조증은 정신운동 활성화 – 말이 많고 목소리가 크며 본인도 말을 따라가지 못한다. 말을 멈추게 하기 어려운 것이 언어 압력(pressure of speech), 생각이 빠르게 꼬리를 무는 것이 사고의 비약. 심하면 음향연상·신어조작·지리멸렬도.","exps":["심할 때 나타날 수 있다.","조현병의 사고장애다.","해당 없다.","반대다.","정답."],"ai":"","fl":{}},{"k":"psy-md-21","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 57–60쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"조증의 사고·지각 장애에 대한 설명으로 옳은 것은?","choices":["환각이 가장 흔한 증상이다","망상은 피해망상만 나타난다","조증에서 망상은 매우 드물다","병식이 대부분 잘 유지된다","약 75%에서 망상이 있고 주로 과대망상이다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 57–60쪽·교수님: 75%에서 망상, 기분에 일치하는 과대망상(\"모 그룹의 숨겨진 아들\", \"퇴원하면 소나무 10그루 기부\"). 환각은 드물고 착각은 많다. 판단력 장애가 특징이고 병식은 전혀 없다. 약 75%가 공격적·위협적.","exps":["환각은 드물다.","과대망상이 주다.","75%에서 있다.","병식이 없다.","정답."],"ai":"","fl":{}},{"k":"psy-md-22","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 62–64쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"제II형 양극성장애에 대한 설명으로 옳은 것은?","choices":["조증 삽화가 한 번 이상 있어야 한다","자살 위험은 거의 없는 편이다","경조증에서 망상·환청이 흔하다","남자에서 더 흔하게 나타난다","주요우울과 경조증이 번갈아 오고, 대개 우울로 온다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 62–64쪽·교수님: II형은 주요우울 + 경조증(정신병적 양상 없음, 짧고 가벼움). 경조증 때문이 아니라 우울해서 오고, 히스토리를 들어보면 \"대학 때 3–4일 생각이 빨라지고 돈을 많이 썼다\". 여성에 더 흔하고 자살이 10–15% – 그래서 히스토리 테이킹이 중요.","exps":["I형이다.","10–15%다.","정신병적 양상이 없다.","여성에 흔하다.","정답."],"ai":"","fl":{}},{"k":"psy-md-23","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 68–69쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"양극성장애의 예후가 나쁜 요인이 아닌 것은?","choices":["발병 전 사회 적응과 기능이 좋음","정신병적 증상 동반","이전 삽화 횟수가 많음","급속순환형","이른 나이에 발병"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 68–69쪽·교수님: 조기 발병·잦은 삽화·급속순환형·정신병적 증상은 예후 불량, 병전 기능이 좋고 순응도가 좋으면 예후 양호. 양극성장애는 주요우울장애보다 예후가 나쁘고 약도 더 복잡하게 쓴다.","exps":["정답. 예후가 좋다.","나쁘다.","나쁘다.","나쁘다.","나쁘다."],"ai":"","fl":{}},{"k":"psy-md-24","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 71–76쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"조증 환자 치료에 대한 설명으로 옳은 것은?","choices":["경조증도 반드시 입원시켜 치료한다","항우울제를 단독으로 먼저 투여한다","본인이 원하지 않으면 어떤 경우에도 입원시킬 수 없다","급성기에는 정신역동적 정신치료가 가장 효과적이다","피해 방지가 가장 중요하고 자존심을 건드리지 않는다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 71–74·76쪽·교수님: 경조증은 외래 가능(자주 방문). 조증에서는 안전이 가장 중요하고, 자존심을 건드리지 않는 부드럽고 설득력 있는 태도(응급실에서 많이 터진다). 자타해 위험이 있고 정신과 의사가 필요하다고 하면 보호의무자 2명 동의로 보호입원. 급성기는 항정신병약물(haloperidol 등)·benzodiazepine, 항조증 약물은 lithium·valproate·carbamazepine·비정형 항정신병약물. 급성기 정신치료는 관계 형성 목적.","exps":["외래 가능하다.","조증을 악화시킨다.","보호입원이 가능하다.","약물치료가 주다.","정답."],"ai":"","fl":{}},{"k":"psy-md-25","area":"티야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 84–87쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"순환성장애(cyclothymia)에 대한 설명으로 옳은 것은?","choices":["조증과 주요우울 삽화가 번갈아 나타난다","대부분 스스로 검사를 받으러 온다","경조증과 경한 우울이 불규칙하게 반복된다","과대망상이 흔히 동반된다","제I형보다 기분 순환이 느리다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 84–87쪽·교수님: 경조증과 경한 우울이 같이 있는 II형의 경한 형태, I형보다 순환이 빠르고 불규칙해 주변 사람이 힘들다. \"원래 성격이 괴팍하다\"고 여겨 본인이 검사하러 오는 경우는 거의 없고 주변 권유로 온다.","exps":["I형 양극성이다.","주변 권유로 온다.","정답.","경한 형태다.","더 빠르다."],"ai":"","fl":{}},{"k":"psy-md-26","area":"탈야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 69쪽","year":"","type":"객","rep":1,"repyears":"","stem":"양극성장애의 장기 예후와 리튬 예방 효과로 강의록에 제시된 것은?","choices":["주요우울장애보다 예후가 좋다","대부분 만성화 없이 완치되는 편이다","리튬 예방은 약 50–60%에서만 효과, 40% 만성화","한 번 회복되면 재발은 거의 없다","리튬 예방 시 90% 이상 완전히 조절된다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 69쪽: 주요우울장애보다 예후 불량, 리튬 예방적 사용 시 약 50–60%에서만 의미 있게 조절, 전반적으로 15% 양호, 45% 잘 지내지만 다발성 재발, 40% 만성화.","exps":["더 나쁘다.","40% 만성화.","정답.","재발이 많다.","50–60%다."],"ai":"","fl":{}},{"k":"psy-md-27","area":"탈야","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 강의록 「1021 기분장애」 38쪽 · STT 10/21 5–6교시(정재희)","year":"","type":"객","rep":1,"repyears":"","stem":"계절형 우울증의 특징으로 옳은 것은?","choices":["매년 서로 다른 시기에 시작된다","불면과 식욕 저하가 특징이다","주로 가을·겨울 시작, 과수면·과식","양극성장애에서는 나타나지 않는다","봄에 시작해 가을에 회복된다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 38쪽·교수님: 주요우울장애나 조울증의 우울이 해마다 일정한 시기에 시작·회복, 대부분 가을·겨울 시작 봄 회복, 기력 감퇴·과수면·과식. 그 시기에만 약을 복용하는 경우도 있다.","exps":["일정한 시기다.","과수면·과식이다.","정답.","조울증에서도 나타난다.","반대다."],"ai":"","fl":{}},{"k":"psy-y-dp-nt-2025","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「우울장애」 341–362쪽","year":"2025 객41","type":"객","rep":9,"repyears":"2023 객1 · 2022 객1 · 2021 객1 · 2020 객1 · 2019 객1 · 2018 객1 · 2017 객1 · 2016 객1","stem":"60대 후반의 남자가 3년 전 정년퇴직 후 특별한 일거리 없이 지내왔다. 그러던 중 2년 전 큰 수익금을 배당해 준다는 후배 사업가 회사에 퇴직금을 모두 투자했었다. 그의 실제 경제적 형편은 부인의 수익사업으로 부유하다. 그러나 두달 전 후배 회사가 부도로 갑자기 망했다. 이후 그는 기분이 점점 더 침울해지고 평소와 달리 바깥 활동을 전혀 하지 않고 집안에서만 지내왔다. 사소한 일에 대해서 후회하고, (가)만사 허무하게 느끼며, 눈물을 흘린다. “나 때문에 집안이 망했고 굶어죽게 생겼다.”, “나는 죄인이다”고 자책했다. 또한 소화가 잘 되지 않는 증상을 자신의 위암 때문이라고 굳게 믿고 있다. 끊임없이 자살에 대해 생각하고 수일 전 자해를 시도한 바 있다. 면담 결과, 기분이 늘 울적하고 재미나 흥미도 없으며 만사 귀찮다고 했다. (나)정신운동 속도 저하, 주의 집중력과 기억력 저하 등 인지기능의 장애를 보였다. 식욕 부진과 체중 감소도 있었다. 그러나 신체적 과거 병력은 전혀 없었고, 내과적 정밀검사나 뇌 영상검사 결과도 특이소견이 없었다.\n상기 증례 진단명의 신경생화학적 요인으로 가장 연관성이 깊고, 전구물질이 트립토판인 생체아민(또는 신경전달물질로 옳은 것은?","choices":["노르에피네프린","세로토닌","도파민","글루타메이트","GABA"],"ans":[2],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2023 객1 · 2022 객1","2025년 정재희 교수님이 정상근 교수님 21–23년 문제를 그대로 출제, 강의록 별표 부분."],"basis":"🎓 올해 수업 기준: 교수님: 우울장애와 가장 연관성이 깊고 연구 근거가 가장 많은 것은 세로토닌 – 그래서 국제 가이드라인에서 SSRI를 1차(first line)로 쓴다. 노르에피네프린은 변연계·대뇌피질에서 각성을 유도·유지하며 세로토닌보다 무기력·무쾌감증과 더 연관 – 그래서 SNRI도 쓴다. 강의록: 세로토닌의 전구물질은 트립토판(트립토판 제한 식이로 재발 유발). 정재희 교수님은 별표 슬라이드 위주로 공부하라고 했다.\n\n📚 학습지 해설: 우울증의 신경생화학적 원인: ① 세로토닌 ② 노르에피네프린 ③ 도파민 ④ 글루타메이트와 GABA ⑤ 기타 신경전달물질(아세틸콜린). 우울증의 발병원인으로 추정되는 신경생화학적 원인으로 가장 가능성이 높은 물질은 세로토닌이며, 세로토닌의 전구물질은 트립토판입니다. 세로토닌의 전구물질을 묻는 문제도 과거 야마에 출제된 적이 있으니 세로토닌과 트립토판 둘 다 암기하시기 바랍니다. (2025 해설) 정재희 교수님은 올해 처음 강의에 들어오셨는데, 정상근 교수님이 21–23년 출제하셨던 문제가 그대로 나왔습니다. 강의록에 별표 표시도 되어 있는 부분입니다. (2022 해설) 교수님이 퀴즈로 내시고, 우울증의 main neurotransmitter는 NE·세로토닌·도파민이며 이 중 트립토판이 전구물질인 것은 세로토닌이라고 하셨습니다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-dp-nt-2021","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「우울장애」 341–362쪽","year":"2021 객1","type":"객","rep":9,"repyears":"2025 객41 · 2023 객1 · 2022 객1 · 2020 객1 · 2019 객1 · 2018 객1 · 2017 객1 · 2016 객1","stem":"60대 남자가 3년 전 정년퇴직 후 별다른 일을 하지 않고 지냈다. 2년 전 아는 후배의 회사에 투자하였다가 회사가 부도가 나는 바람에 큰돈을 잃었다. 그 후 평소와는 다르게 집안에만 머무르고 기분이 늘 울적한 상태로 지냈다. 사소한 것에도 스스로를 자책하고 자기 때문에 집안이 망했다고 이야기 하였다. 자신이 소화가 안되는게 위암 때문이라 말하였다. 환자는 자주 죽고싶다고 이야기 하였다. (가) 정신운동능력 저하, 주의 집중력 그리고 기억력의 저하 등 인지 기능의 장애를 보였다. 식욕부진과 체중감소도 있었다. 과거 병력은 없었으며 뇌 영상검사 결과 특이 소견은 없었다.\n상기 증례 진단명의 신경생화학적 원인으로 가장 연관성이 높고, 전구물질이 트립토판인 생체아민(또는 신경전달물질)로 옳은 것은?","choices":["노르에피네프린","세로토닌","도파민","글루타메이트","GABA"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님: 우울장애와 가장 연관성이 깊고 연구 근거가 가장 많은 것은 세로토닌 – 그래서 국제 가이드라인에서 SSRI를 1차(first line)로 쓴다. 노르에피네프린은 변연계·대뇌피질에서 각성을 유도·유지하며 세로토닌보다 무기력·무쾌감증과 더 연관 – 그래서 SNRI도 쓴다. 강의록: 세로토닌의 전구물질은 트립토판(트립토판 제한 식이로 재발 유발). 정재희 교수님은 별표 슬라이드 위주로 공부하라고 했다.\n\n📚 학습지 해설: 우울증의 신경생화학적 원인: ① 세로토닌 ② 노르에피네프린 ③ 도파민 ④ 글루타메이트와 GABA ⑤ 기타 신경전달물질(아세틸콜린). 우울증의 발병원인으로 추정되는 신경생화학적 원인으로 가장 가능성이 높은 물질은 세로토닌이며, 세로토닌의 전구물질은 트립토판입니다. 세로토닌의 전구물질을 묻는 문제도 과거 야마에 출제된 적이 있으니 세로토닌과 트립토판 둘 다 암기하시기 바랍니다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-dp-nt-2020","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「우울장애」 341–362쪽","year":"2020 객1","type":"객","rep":9,"repyears":"2025 객41 · 2023 객1 · 2022 객1 · 2021 객1 · 2019 객1 · 2018 객1 · 2017 객1 · 2016 객1","stem":"60대 남자가 3년 전 정년퇴직 후 별다른 일을 하지 않고 지냈다. 2년 전 아는 후배의 회사에 투자하였다가 회사가 부도가 나는 바람에 큰돈을 잃었다. 그 후 평소와는 다르게 집안 이 점점 더 침울해지고 평소와 달리 바깥 활동을 전혀 하지 않고 집안에서만 지내왔다. 사소한 일에 대해서 후회하고, (가)만사 허무하게 느끼며, 눈물을 흘린다. “나 때문에 집안이 망했고 굶어죽게 생겼다.”, “나는 죄인이다”고 자책했다. 또한 소화가 잘 되지 않는 증상을 자신의 위암 때문이라고 굳게 믿고 있다. 끊임없이 자살에 대해 생각하고 수일 전 자해를 시도한 바 있다. 면담 결과, 기분이 늘 울적하고 재미나 흥미도 없으며 만사 귀찮다고 했다. (나)정신운동 속도 저하, 주의 집중력과 기억력 저하 등 인지기능의 장애를 보였다. 식욕 부진과 체중 감소도 있었다. 그러나 신체적 과거 병력은 전혀 없었고, 내과적 정밀검사나 뇌 영상검사 결과도 특이소견이 없었다.\n상기 증례의 밑줄 친(가)에서 관찰할 수 있는 망상의 종류들의 조합으로 가장 옳은 것은?","choices":["피해망상, 관계망상, 빈곤망상, 질병망상","질병망상, 빈곤망상, 색정망상, 허무망상","빈곤망상, 질병망상, 허무망상, 죄책망상","신체망상, 관계망상, 빈곤망상, 질병망상","질병망상, 빈곤망상, 피해망상, 죄책망상"],"ans":[3],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2023 객2 · 2022 객2","정상근 교수님 킹야 문제를 선지도 바꾸지 않고 그대로 출제(복원자)."],"basis":"🎓 올해 수업 기준: 교수님: 우울증에서 부정적 사고·죄책감이 커져 사고장애가 심해지면 망상까지 간다 – 빈곤망상(재산을 모두 잃었거나 이 때문에 가족이 어렵다고 믿음), 질병망상(검사가 다 정상인데 분명히 뇌종양이 있다고 믿음). 망상·환각이 있다고 다 조현병이 아니고, 기분 증상이 심할 때 \"정신병적 양상 동반(with psychotic features)\"이 붙는다. 증례(66세, 소액 손실 후 \"굶어 죽게 됐다, 육체가 병균으로 썩어 들어간다\")처럼 현실과 동떨어진 것이 망상.\n\n📚 학습지 해설: 킹야 문제입니다. 만사 허무하게 느끼며 눈물을 흘린다 → 허무망상 / \"나 때문에 집안이 망했고 굶어죽게 생겼다\" → 빈곤망상 / \"나는 죄인이다\" 자책 → 죄책망상 / 소화가 잘 되지 않는 증상을 위암 때문이라고 굳게 믿음 → 질병망상(신체망상). 특히 \"나 때문에 집안이 망했고 굶어죽게 생겼다\"는 죄책망상이 아니고 빈곤망상으로 기억하셔야 할 것 같습니다. <망상의 종류> 과대망상(자신의 힘·능력·중요성을 과장), 피해망상(누군가 자신이나 가족을 해치려 하거나 감시한다고 믿음), 관계망상(다른 사람들이 자신에 관한 이야기를 한다고 생각), 색정망상(모든 이성이 자기를 사랑한다고 굳게 믿음), 신체망상(수많은 검사에도 자신의 신체가 이상하다고 믿어 병원을 찾아다님), 우울망상 – 자책망상·질병망상·허무망상·빈곤망상. (2025 해설) 정재희 교수님 첫 수업이셨는데 야마를 타겠다고 하셨고 선지도 바꾸지 않고 그대로 내셨습니다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-dp-del-2021","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「우울장애」 341–362쪽","year":"2021 객3","type":"객","rep":9,"repyears":"2025 객42 · 2023 객2 · 2022 객2 · 2020 객3 · 2019 객2 · 2018 객2 · 2017 객2 · 2016 객2","stem":"60대 남자가 3년 전 정년퇴직 후 별다른 일을 하지 않고 지냈다. 2년 전 아는 후배의 회사에 투자하였다가 회사가 부도가 나는 바람에 큰돈을 잃었다. 그 후 평소와는 다르게 집안에만 머무르고 기분이 늘 울적한 상태로 지냈다. 사소한 것에도 스스로를 자책하고 자기 때문에 집안이 망했다고 이야기 하였다. 자신이 소화가 안되는게 위암 때문이라 말하였다. 환자는 자주 죽고싶다고 이야기 하였다. (가) 정신운동능력 저하, 주의 집중력 그리고 기억력의 저하 등 인지 기능의 책했다. 또한 소화가 잘 되지 않는 증상을 자신의 위암 때문이라고 굳게 믿고 있다. 끊임없이 자살에 대해 생각하고 수일 전 자해를 시도한 바 있다. 면담 결과, 기분이 늘 울적하고 재미나 흥미도 없으며 만사 귀찮다고 했다. (나)정신운동 속도 저하, 주의 집중력과 기억력 저하 등 인지기능의 장애를 보였다. 식욕 부진과 체중 감소도 있었다. 그러나 신체적 과거 병력은 전혀 없었고, 내과적 정밀검사나 뇌 영상검사 결과도 특이소견이 없었다.\n상기 증례에서 밑줄 친 (나)에 해당하는 정신병리로 옳은 것은?","choices":["서서히 발병한다.","일중변화가 없다.","인지기능 수행에 전반적인 장애가 있다.","질문에 대해 작화증을 보인다.","먼 기억과 최근 기억 장애가 있다."],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님: 노인에서 정신운동 지체가 심하면 기억력·지남력이 떨어져 자녀들이 \"치매 같다\"며 데려오므로 노인 우울증과 치매는 항상 감별해야 한다. 치매(알츠하이머)는 서서히 진행하지만 노인 우울증은 갑자기 급하게 오고, 일중 변화가 있으며, MMSE 같은 질문에 \"몰라, 귀찮아\"라고 한다(의욕 저하로 다 하기 싫어함), 항우울제로 호전. 요즘은 \"가성치매(pseudodementia)\"라는 말을 잘 쓰지 말자는 추세지만 기억하기 좋아 그대로 가져왔다고 했다 – 자세한 내용은 박종일 교수님 노인정신의학.\n\n📚 학습지 해설: 가성치매와 진성치매의 감별 문제입니다. 매년 나오는 문제이니 표의 내용을 잘 알아둬야 합니다. 증례의 환자는 우울증으로 인해 가성치매가 나타나고 있습니다. 가성치매 – 급성이며 우울증이 지적(인지)기능 상실보다 선행 / 일중변화가 있다 / 질문에 대해 모른다는 식 / 최근 기억과 먼 기억 모두 장애 / 기억력 장애에 국한 / 항우울제에 호전반응. 진성치매 – 서서히 진행, 인지기능 상실이 우울보다 선행 / 일중변화 없다 / 작화증 / 최근 기억 장애 / 인지기능 수행에 전반적인 장애, 지속적 불량 / 항우울제에 변화가 없다. 나머지 보기는 모두 진성치매에 관한 내용이고 정답 보기만 가성치매에 관한 내용입니다. (2025 해설) 정재희 교수님이 야마를 타 주시고 티야도 선지까지 상세하게 짚어 주셨습니다 – 티야와 야마 위주로 보셔도 됩니다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-dp-pd-2023","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「우울장애」 341–362쪽","year":"2023 객3","type":"객","rep":8,"repyears":"2025 객43 · 2022 객3 · 2021 객2 · 2020 객2 · 2018 객3 · 2019 객3 · 2017 객3","stem":"60대 후반의 남자가 3년 전 정년퇴직 후 특별한 일거리 없이 지내왔다. 그러던 중 2년 전 큰 수익금을 배당해 준다는 후배 사업가 회사에 퇴직금을 모두 투자했었다. 그의 실제 경제적 형편은 부인의 수익사업으로 부유하다. 그러나 두달 전 후배 회사가 부도로 갑자기 망했다. 이후 그는 기분이 점점 더 침울해지고 평소와 달리 바깥 활동을 전혀 하지 않고 집안에서만 지내왔다. 사소한 일에 대해서 후회하고, (가)만사 허무하게 느끼며, 눈물을 흘린다. “나 때문에 집안이 망했고 굶어죽게 생겼다.”, “나는 죄인이다”고 자책했다. 또한 소화가 잘 되지 않는 증상을 자신의 위암 때문이라고 굳게 믿고 있다. 끊임없이 자살에 대해 생각하고 수일 전 자해를 시도한 바 있다. 면담 결과, 기분이 늘 울적하고 재미나 흥미도 없으며 만사 귀찮다고 했다. (나)정신운동 속도 저하, 주의 집중력과 기억력 저하 등 인지기능의 장애를 보였다. 식욕 부진과 체중 감소도 있었다. 그러나 신체적 과거 병력은 전혀 없었고, 내과적 정밀검사나 뇌 영상검사 결과도 특이소견이 없었다.\n상기 증례 진단명에서 밑줄 친 (나)에 해당하는 정 의욕 저하로 다 하기 싫어함), 항우울제로 호전. 요즘은 \"가성치매(pseudodementia)\"라는 말을 잘 쓰지 말자는 추세지만 기억하기 좋아 그대로 가져왔다고 했다 – 자세한 내용은 박종일 교수님 노인정신의학.\n\n📚 학습지 해설: 정상근 교수님 우울증 ppt 내용에 비교된 표가 있습니다. 증례의 환자는 우울증으로 인해 가성치매가 나타나고 있습니다. 가성치매 – 급성이며 우울증이 지적(인지)기능 상실보다 선행 / 일중변화가 있다 / 질문에 대해 모른다는 식 / 최근 기억과 먼 기억 모두 장애 / 기억력 장애에 국한 / 항우울제에 호전반응. 진성치매 – 서서히 진행, 인지기능 상실이 우울보다 선행 / 일중변화 없다 / 작화증 / 최근 기억 장애 / 인지기능 수행에 전반적인 장애, 지속적 불량 / 항우울제에 변화가 없다. 나머지 보기는 모두 진성치매에 관한 내용이고 정답 보기만 가성치매에 관한 내용입니다. 위의 (나)는 가성치매에 해당되는 내용으로 선택지를 고르면 된다(⑤ 단기·장기기억 모두 손상).","exps":[],"ai":"","fl":{}},{"k":"psy-y-dp-tx-2025","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「우울장애」 341–362쪽","year":"2025 객44","type":"객","rep":12,"repyears":"2023 객4 · 2022 객4 · 2021 객4 · 2020 객4 · 2019 객4 · 2018 객4 · 2017 객4 · 2015 객4 · 2013 객25 · 2012 객31 · 2011 객8","stem":"60대 후반의 남자가 3년 전 정년퇴직 후 특별한 일거리 없이 지내왔다. 그러던 중 2년 전 큰 수익금을 배당해 준다는 후배 사업가 회사에 퇴직금을 모두 투자했었다. 그의 실제 경제적 형편은 부인의 수익사업으로 부유하다. 그러나 두달 전 후배 회사가 부도로 갑자기 망했다. 이후 그는 기분이 점점 더 침울해지고 평소와 달리 바깥 활동을 전혀 하지 않고 집안에서만 지내왔다. 사소한 일에 대해서 후회하고, (가)만사 허무하게 느끼며, 눈물을 흘린다. “나 때문에 집안이 망했고 굶어죽게 생겼다.”, “나는 죄인이다”고 자책했다. 또한 소화가 잘 되지 않는 증상을 자신의 위암 때문이라고 굳게 믿고 있다. 끊임없이 자살에 대해 생각하고 수일 전 자해를 시도한 바 있다. 면담 결과, 기분이 늘 울적하고 재미나 흥미도 없으며 만사 귀찮다고 했다. (나)정신운동 속도 저하, 주의 집중력과 기억력 저하 등 인지기능의 장애를 보였다. 식욕 부진과 체중 감소도 있었다. 그러나 신체적 과거 병력은 전혀 없었고, 내과적 정밀검사나 뇌 영상검사 결과도 특이소견이 없었다.\n상기 증례의 환자에 대한 치료원칙으로 옳은 것은?","choices":["외래 진료실에서 설명없이 한 번에 한달분 약물을 처방해준다.","체중감소, 식욕부진, 불면증상에 mordafinil이 효과적이다.","”왜그렇게 게을러요!”,”꾸물대지말고 빨리 움직여요!”라고 혼낸다.","심리사회적 치료와 약물치료를 병행할 때 단독 치료보다 치료효과가 가장좋다.","환자가 힘들어해도 무시하고, 활동을 많이 하라고 지시한다."],"ans":[4],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2023 객4"],"basis":"🎓 올해 수업 기준: 교수님: 경하면(자살사고가 적고 학교·회사 생활 유지) 외래 통원 가능 – 가족·보호자의 세심한 관심과 지지가 필요. 가장 중요하게 보는 것은 자살과 전신 상태(못 먹고 못 씻어 빠르게 마르면 주의). 입원: 진단 절차가 필요할 때, 자살·타살 위험, 의식주 해결 불가, 증상이 갑자기 나빠질 때(단순 기분장애가 아닐 수도), 지지구조가 미약할 때. 가족이 비난하거나(\"정신력이 부족해, 나가서 움직여\") 너무 조급하게 강요하면 환자가 오히려 죄책감·무가치감을 느낀다고 해서 가족 면담을 많이 한다. 항우울제 선택(mirtazapine 등)은 다음 주 약물치료 시간에 자세히 다룬다고 했다.\n\n📚 학습지 해설: 킹야입니다. 주요우울장애의 일반적인 치료 및 관리원칙: 1) 경한 우울증은 외래 통원 가능하지만 가족 등 보호자의 세심한 관심과 지지가 필요. 2) 가장 중요한 주의사항: 자살예방, 전신쇠약상태 교정. 3) 입원이 필요한 경우: 진단절차가 필요할 때, 자살 또는 타살의 위험성, 의식주 해결능력이 적을 때, 증상이 급작스럽게 나빠질 때, 지지구조가 미약할 때. 4) 치료적 태도: 따뜻하고 진지, 자상한 설명. 5) 가장 효과적인 전략: 약물 + 정신치료. 선지별 – 설명 없이 한 달분 처방(X): 설명을 하고 처방해야 하고, 한꺼번에 많은 약을 주면 자살 위험이 있어 짧은 간격으로 여러 번 오게 해야 함. 힘들어도 무시하고 활동 지시(X): 이해·인내·공감·격려하며 조금씩 활동량이 늘도록 유도. \"게으르다\" 혼냄(X): 비난하지 않는다. 식욕부진·체중감소·불면에 효과적인 약은 mirtazapine(잘 먹고 잘 자게 해 줌) – modafinil은 기면병 약, methylphenidate·amphetamine은 중추신경자극제(오히려 식욕부진·불면 부작용), bupropion은 각성·체중 증가 우려 시 쓰는 약. 심리치료만으로 약물치료와 효과 동일(X). (2025 해설) 정상근 교수님 킹야 문제를 정재희 교수님이 그대로 내셨습니다. 순서도 같습니다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-dp-tx-2022","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「우울장애」 341–362쪽","year":"2022 객4","type":"객","rep":12,"repyears":"2025 객44 · 2023 객4 · 2021 객4 · 2020 객4 · 2019 객4 · 2018 객4 · 2017 객4 · 2015 객4 · 2013 객25 · 2012 객31 · 2011 객8","stem":"60대 후반의 남자가 3년 전 정년퇴직 후 특별한 일거리 없이 지내왔다. 그러던 중 2년 전 큰 수익금을 배당해 준다는 후배 사업가 회사에 퇴직금을 모두 투자했었다. 그의 실제 경제적 형편은 부인의 수익사업으로 부유하다. 그러나 두달 전 후배 회사가 부도로 갑자기 망했다. 이후 그는 기분이 점점 더 침울해지고 평소와 달리 바깥 활동을 전혀 하지 않고 집안에서만 지내왔다. 사소한 일에 대해서 후회하고, (가)만사 허무하게 느끼며, 눈물을 흘린다. “나 때문에 집안이 망했고 굶어죽게 생겼다.”, “나는 죄인이다”고 자책했다. 또한 소화가 잘 되지 않는 증상을 자신의 위암 때문이라고 굳게 믿고 있다. 끊임없이 자살에 대해 생각하고 수일 전 자해를 시도한 바 있다. 면담 결과, 기분이 늘 울적하고 재미나 흥미도 없으며 만사 귀찮다고 했다. (나)정신운동 속도 저하, 주의 집중력과 기억력 저하 등 인지기능의 장애를 보였다. 식욕 부진과 체중 감소도 있었다. 그러나 신체적 과거 병력은 전혀 없었고, 내과적 정밀검사나 뇌 영상검사 결과도 특이소견이 없었다.\n상기 증례의 환자에 대한 치료원칙으로 옳은 것은?","choices":["외래 진료실에서 설명 없이 한 번에 한 달분 약물을 처방해준다.","식욕부진, 체중감소, 불면 증상에 methylphenidate가 효과적이다.","“왜 그렇게 게을러요!”, “꾸물대지 말고 빨리 움직여요!”라고 혼낸다.","심리사회적 치료와 약물치료를 병행할 때 단독 치료보다 치료효과가 가장 좋다.","환자가 힘들어해도 무시하고, 활동을 많이 하라고 지시한다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님: 경하면(자살사고가 적고 학교·회사 생활 유지) 외래 통원 가능 – 가족·보호자의 세심한 관심과 지지가 필요. 가장 중요하게 보는 것은 자살과 전신 상태(못 먹고 못 씻어 빠르게 마르면 주의). 입원: 진단 절차가 필요할 때, 자살·타살 위험, 의식주 해결 불가, 증 지 기타 증상. 주요우울장애의 치료 전략: 외래 vs 입원, 정신사회적 치료(인지치료·대인관계치료·정신역동적 정신치료·가족치료) + 생물학적 치료(항우울제·lithium·AAP, T3/T4, ECT·TMS 등)를 함께 하는 것이 가장 이상적. Mirtazapine: 비정형 항우울제로 식욕부진·체중감소·불면에 효과적(④). ⑤ 심리치료만으로 약물과 효과 동일(X).","exps":[],"ai":"","fl":{}},{"k":"psy-y-dp-tx-2015","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「우울장애」 341–362쪽","year":"2015 객4","type":"객","rep":12,"repyears":"2025 객44 · 2023 객4 · 2022 객4 · 2021 객4 · 2020 객4 · 2019 객4 · 2018 객4 · 2017 객4 · 2013 객25 · 2012 객31 · 2011 객8","stem":"50대 초반의 회사원이 갑자기 권고사직을 당한 후, 최근 한 달 전부터 사소한 일에 대해서 후회하고 눈물을 흘리며, 자기 때문에 집안이 망했고 암에 걸렸다면서 끊임없이 죽어야 한다고 생각하고 있다. 면담결과, 기분이 울적하고 재미도 없으며 만사 귀찮아하고, 주의 집중력도 저하되어 있었으며, 식욕도 없고 체중감소도 있었다. 과거병력은 전혀 없었고, 내과에서 종합검사결과 특이소견은 없었다. 상기 질환명 환자에 대한 치료로 가장 옳은 것은?","choices":["외래에서 간단한 보호자 교육 후 한달 분 약물을 처방해준다.","환자가 힘들어 해도 무시하고, 활동을 많이 하라고 지시한다.","‘왜 그렇게 게으르냐!’ ‘꾸물대지 말고 빨리 움직여라’고 혼낸다.","식욕부진, 불면, 성기능 장애에 Fluoxetine 단독 요법이 효과적이다.","심리사회적 치료와 약물치료를 병행할 때 치료효과가 가장 좋다."],"ans":[5],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2013 객25 · 2012 객31"],"basis":"🎓 올해 수업 기준: 교수님: 경하면(자살사고가 적고 학교·회사 생활 유지) 외래 통원 가능 – 가족·보호자의 세심한 관심과 지지가 필요. 가장 중요하게 보는 것은 자살과 전신 상태(못 먹고 못 씻어 빠르게 마르면 주의). 입원: 진단 절차가 필요할 때, 자살·타살 위험, 의식주 해결 불가, 증상이 갑자기 나빠질 때(단순 기분장애가 아닐 수도), 지지구조가 미약할 때. 가족이 비난하거나(\"정신력이 부족해, 나가서 움직여\") 너무 조급하게 강요하면 환자가 오히려 죄책감·무가치감을 느낀다고 해서 가족 면담을 많이 한다. 항우울제 선택(mirtazapine 등)은 다음 주 약물치료 시간에 자세히 다룬다고 했다.\n\n📚 학습지 해설: 우울증 진단지침(ICD-10): 최소 2주, 3가지 전형적 증상 + 7가지 기타 증상. 주요우울장애 치료 전략: 정신사회적 치료 + 생물학적 치료 병행이 가장 이상적·효과적(⑤). ④ fluoxetine 단독은 식욕부진·불면·성기능 장애에 효과적이지 않다(SSRI는 오히려 불면·성기능장애 부작용 가능, 이런 증상에는 mirtazapine). (2013·2012 같은 문제)","exps":[],"ai":"","fl":{}},{"k":"psy-y-dp-tx-2011","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「우울장애」 341–362쪽","year":"2011 객8","type":"객","rep":12,"repyears":"2025 객44 · 2023 객4 · 2022 객4 · 2021 객4 · 2020 객4 · 2019 객4 · 2018 객4 · 2017 객4 · 2015 객4 · 2013 객25 · 2012 객31","stem":"50대 남자가 사업에 실패한 후 최근 한 달 전부터 사소한 일에 대해서 후회하고 눈물을 흘리며, 자기 때문에 집안이 망했고 암에 걸렸다면서 끊임없이 죽어야 한다고 생각하고 있다. 면담 결과, 기분도 늘 울적하고 재미나 흥미도 없으며 만사 귀찮다 하고, 주의 집중력도 저하되어 있었으며, 식욕도 없고 체중 감소도 있었다. 신체적 과거 병력은 전혀 없었다. 상기 진단명 환자에 대한 치료원칙으로 옳은 것은?","choices":["외래에서 간단한 보호자 교육 후 한 달분 약물을 처방해준다.","환자가 힘들어 하더라도 산책 등 활동을 많이 하라고 지시한다.","환자의 동의가 입원치료 결정에 가장 중요한 요인이다.","약물치료가 효과적이며 필수적이라는 사실을 충분히 설명한다.","증상이 호전될 경우 환자와 상의하여 1~2개월 내에 약물치료를 중단한다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님: 경하면(자살사고가 적고 학교·회사 생활 유지) 외래 통원 가능 – 가족·보호자의 세심한 관심과 지지가 필요. 가장 중요하게 보는 것은 자살과 전신 상태(못 먹고 못 씻어 빠르게 마르면 주의). 입원: 진단 절차가 필요할 때, 자살·타살 위험, 의식주 해결 불가, 증상이 갑자기 나빠질 때(단순 기분장애가 아닐 수도), 지지구조가 미약할 때. 가족이 비난하거나(\"정신력이 부족해, 나가서 움직여\") 너무 조급하게 강요하면 환자가 오히려 죄책감·무가치감을 느낀다고 해서 가족 면담을 많이 한다. 항우울제 선택(mirtazapine 등)은 다음 주 약물치료 시간에 자세히 다룬다고 했다. 2011 문제의 ③ \"환자의 동의가 입원 결정에 가장 중요\"는 X – 자살 위험 등 입원 적응증이 되면 입원시킬 수 있다.\n\n📚 학습지 해설: 진단명: 주요우울장애(5가지 이상 2주, 우울 기분·흥미 감소, 체중감소, 자책, 집중력 감퇴, 반복적 자살사고 등). ① (X) 끊임없이 죽어야 한다고 생각 – 자살 위험이 있어 입원치료. ② (X) 너무 조급하게 강요하거나 많은 것을 요구하면 좌절감. ③ (X) 입원 적응증(증상이 심함, 자살 위험, 위기 개입, 진단 목적, 내과적 병발질환·ECT 등)이 되면 입원시킬 수 있음. ④ (O) 약물치료가 효과적이며 필수적이라는 사실을 충분히 설명. ⑤ (X) 최소 6개월은 복용해야 함.","exps":[],"ai":"","fl":{}},{"k":"psy-y-dp-drug-2025","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「우울장애」 341–362쪽","year":"2025 객45","type":"객","rep":1,"repyears":"","stem":"60대 후반의 남자가 3년 전 정년퇴직 후 특별한 일거리 없이 지내왔다. 그러던 중 2년 전 큰 수익금을 배당해 준다는 후배 사업가 회사에 퇴직금을 모두 투자했었다. 그의 실제 경제적 형편은 부인의 수익사업으로 부유하다. 그러나 두달 전 후배 회사가 부도로 갑자기 망했다. 이후 그는 기분이 점점 더 침울해지고 평소와 달리 바깥 활동을 전혀 하지 않고 집안에서만 지내왔다. 사소한 일에 대해서 후회하고, (가)만사 허무하게 느끼며, 눈물을 흘린다. “나 때문에 집안이 망했고 굶어죽게 생겼다.”, “나는 죄인이다”고 자책했다. 또한 소화가 잘 되지 않는 증상을 자신의 위암 때문이라고 굳게 믿고 있다. 끊임없이 자살에 대해 생각하고 수일 전 자해를 시도한 바 있다. 면담 결과, 기분이 늘 울적하고 재미나 흥미도 없으며 만사 귀찮다고 했다. (나)정신운동 속도 저하, 주의 집중력과 기억력 저하 등 인지기능의 장애를 보였다. 식욕 부진과 체중 감소도 있었다. 그러나 신체적 과거 병력은 전혀 없었고, 내과적 정밀검사나 뇌 영상검사 결과도 특이소견이 없었다.\n상기 환자의 치료 약물로 올바른 것은?","choices":["escitalopram","donepezil","methylphenidate","atomoxetine","acamprosate"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님: 국제 가이드라인에서 1차로 쓰는 것이 SSRI(세로토닌 재흡수를 억제해 농도를 올림), NE에도 작용하는 SNRI도 있다. 항우울제 효과는 최소 3–5주(4–6주) 복용해야 판단할 수 있다 – 수면제·항불안제처럼 바로 듣지 않고 \"새 도로를 건설하는 것\". 약 30%가 1개월, 50%가 3개월 안에 임의 중단하며, 끊으면 독감 같은 금단 증상이 생길 수 있지만 정해진 만큼 먹으면 중독·내성 걱정은 없다.\n\n📚 학습지 해설: 우울증에 관한 내용으로 약물치료는 보통 SSRI 계열 항우울제를 사용합니다. 선지 중 SSRI 약물로는 paroxetine, fluoxetine, escitalopram, fluvoxamine, sertraline 등이 있어 1번입니다. (② donepezil – 알츠하이머 치매, ③ methylphenidate·④ atomoxetine – ADHD, ⑤ acamprosate – 알코올 의존)","exps":[],"ai":"","fl":{}},{"k":"psy-y-dp-sleep-2015","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「우울장애」 341–362쪽","year":"2015 객6","type":"객","rep":3,"repyears":"2013 객27 · 2011 객9","stem":"50대 후반의 남자가 불면을 주소로 정신과에 내원하였다. 그는 약 한 달 전부터 새벽 2-3시경에 깨어 더 이상 자지 못하고, 하루 종일 차분히 있지 못하고 집안을 왔다 갔다 하는 일이 많았다. 밤에 잠이 들면 꿈을 많이 꾸고 꿈자리가 사납다고 한다. 과거 사소한 일에 대해서는 후회하고 눈물을 흘렸다. 자기 때문에 집안이 망했다면서 끊임없이 죽어야 한다고 생각하고 있다. 기분도 늘 울적하고 재미나 흥미도 없으며 만사 귀찮다 하고, 주의 집중력도 저하되어 있었으며, 식욕도 없고 체중도 감소하였다. 신체적 과거 병력은 없었다. 상기환자의 진단명에서 정상인과 다른 특징적인 수면검사소견으로 가장 옳은 것은?","choices":["REM 수면의 비율 감소","짧은 첫 번째 REM 시간","REM 수면 잠재기 지연","REM 수면 밀도 증가","N3단계 수면 비율 증가"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 14 야마와 동일한 문제가 출제되었습니다. 환자는 현재 우울증으로 진단할 수 있습니다. ♪ 주요우울장애의 특징적인 수면양상: 1. 전체 수면 시간 감소 2. 전체 수면 중 REM 수면의 비율 증가 3. REM 잠재기(latency) 단축, REM 밀도(density) 증가 4. 잠이 드는 시간이 지연됨 5. 첫 번째 REM 시간이 길다 6. 서파 수면 시간이 감소. 그러므로 답은 ④입니다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-dp-sleep-2013","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「우울장애」 341–362쪽","year":"2013 객27","type":"객","rep":3,"repyears":"2015 객6 · 2011 객9","stem":"50대 남자가 사업에 실패한 후 최근 한 달 전부터 사소한 일에 대해서 후회하고 눈물을 흘리며, 자기 때문에 집안이 망했고 암에 걸렸다면서 끊임없이 죽어야 한다고 생각하고 있다. 면담 결과, 기분도 늘 울적하고 재미나 흥미도 없으며 만사 귀찮다 하고, 주의 집중력도 저하되어 있었으며, 식욕도 없고 체중 감소도 있었다. 신체적 과거 병력은 전혀 없었다. 이 환자에서 나타나는 수면장애에 대한 설명으로 옳은 것은?","choices":["REM 수면 감소","짧은 첫 번째 REM 수면 시간","REM 수면 잠재기 증가","REM 수면 밀도 증가","N3 수면 증가"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 주요우울장애의 특징적인 수면양상: 전체 수면 시간 감소, 전체 수면 중 REM 수면의 비율 증가, REM 잠재기 단축, REM 밀도 증가, 잠이 드는 시간이 지연됨, 첫 번째 REM 시간이 길다, 서파 수면(N3) 중 제4단계 수면시간 감소. 따라서 옳은 것은 ④ REM 수면 밀도 증가.","exps":[],"ai":"","fl":{}},{"k":"psy-y-dp-sleep-2011","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「우울장애」 341–362쪽","year":"2011 객9","type":"객","rep":3,"repyears":"2015 객6 · 2013 객27","stem":"주요우울장애에서 주로 나타나는 수면장애에 대한 설명으로 옳은 것은?","choices":["서파수면 증가","총 수면시간의 증가","REM 수면 감소","REM 잠복기 단축","3,4단계 수면 증가"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: @ 주요우울장애의 특징적인 수면양상: 전체 수면 시간 감소(②X), 전체 수면 중 REM 수면의 비율 증가(③X), REM 잠재기 단축(④O), REM 밀도 증가, 잠이 드는 시간 지연, 첫 번째 REM 시간이 길다, 서파 수면 중 제4단계 수면시간 감소(①⑤X).","exps":[],"ai":"","fl":{}},{"k":"psy-y-bp-sp-2025","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「양극성 관련 장애」 326–340쪽","year":"2025 객46","type":"객","rep":6,"repyears":"2023 객5 · 2022 객5 · 2019 객6 · 2018 객6 · 2017 객6","stem":"30대 패션회사 직원이 10일 전부터 잠을 거의 자지 않고, 피곤한 줄을 모른다. 자신이 세계 최고의 패션 디자이너이고 일주일 후 서울 소재 특급 호텔에서 ‘국제 패션쇼’에 관한 기자회견을 열겠다고 호텔 행사용 홀을 예약하였다. 평소 성격과 달리, 최근 기분이 들떠 있고 (가) 말이 매우 빠르며 말수가 쉴새 없이 많아져서 상대방이 말을 멈추게 할 수가 없었다. 월급이 200만원인 그녀는 기자회견을 위해 세계적인 유명 브랜드의 옷과 구두를 1000만원어치나 구입하였다.\n밑줄 친 (가)에 해당하는 것은?","choices":["사고 이탈","사고 비약","언어압력","과대망상","신어 조작"],"ans":[3],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2023 객5","정상근 교수님 야마 문제 그대로, 강의록 별표 부분(복원자)."],"basis":"🎓 올해 수업 기준: 교수님: 조증에서는 정신운동이 활성화(psychomotor activation)되어 활동도 많고 말을 정말 많이 하며 목소리가 크고, 본인이 본인의 말을 다 따라가지 못한다. 생각도 따라가지 못할 정도로 많고 빠르다(사고의 비약). 말을 멈추게 하기 힘들고, 멈추게 하면 \"지금 내 말 무시한 거야?\"라며 화를 내기도 한다(가장 흔한 기분은 과민한 기분). 심하면 알아들을 수 없는 말(음향연상·신어조작·지리멸렬)까지 나와 정신병 증상처럼 보이기도 한다.\n\n📚 학습지 해설: 정상근 교수님 킹야입니다. 매년 똑같은 걸 물어보시는 증례입니다. 환자는 현재 조증 삽화를 보이고 있습니다. [교과서] 빠른 정신운동활동은 조증의 현저한 특징인데, 과도한 에너지와 활동, 말이 많음(다변), 빠른 말투 및 압출언어(pressured speech)와 같은 특징으로 나타난다. 압출언어 = 다변증, 병적수다, 언어압력, 언어압박 – 빠르고 가속화되고 격앙된 언어로, 말의 흐름이 매우 빠르고 많아서 중단시키기가 어려운 상태(예: 조증). 교수님께서 강의록에 나온 정신병리는 모두 알아두라고 하셨습니다. (2025 해설) 정재희 교수님도 정상근 교수님 야마 그대로 – 강의록 별표 부분만 보면 되고, 과대망상도 야마 빈출. 조증의 임상양상: 정신운동 항진(목표지향적 활동 증가), 사고의 흐름이 빠르고 쉽게 주의산만, 사고의 비약, 연상의 이완, 충동조절장애, 판단력 장애와 병식 없음, 수면욕구 감소.","exps":[],"ai":"","fl":{}},{"k":"psy-y-bp-sp-2022","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「양극성 관련 장애」 326–340쪽","year":"2022 객5","type":"객","rep":6,"repyears":"2025 객46 · 2023 객5 · 2019 객6 · 2018 객6 · 2017 객6","stem":"30대 패션회사 직원이 10일 전부터 잠을 거의 자지 않고, 피곤한 줄을 모른다. (가) 자신이 세계 최고의 패션 디자이너이고 일주일 후 서울 소재 특급 호텔에서 ‘국제 패션쇼’에 관한 기자 회견을 열겠다고 호텔 행사용홀을 예약하였다. 평소 성격과 달리, 최근 기분이 들떠 있고 (나) 말이 많았으며, 말을 멈추게 할 수 없었다. 월급이 200만원인 그녀는 기자회견을 위해 세계적인 유명 브랜드의 옷과 구두를 1000만원어치나 구입하였다.\n(나)에 해당하는 것은?","choices":["언어풍부","언어압력","언어능란","언어화려","언어준수"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님: 조증에서는 정신운동이 활성화(psychomotor activation)되어 활동도 많고 말을 정말 많이 하며 목소리가 크고, 본인이 본인의 말을 다 따라가지 못한다. 생각도 따라가지 못할 정도로 많고 빠르다(사고의 비약). 말을 멈추게 하기 힘들고, 멈추게 하면 \"지금 내 말 무시한 거야?\"라며 화를 내기도 한다(가장 흔한 기분은 과민한 기분). 심하면 알아들을 수 없는 말(음향연상·신어조작·지리멸렬)까지 나와 정신병 증상처럼 보이기도 한다.\n\n📚 학습지 해설: 정상근 교수님 킹야입니다. 매년 똑같은 걸 물어보시는 증례입니다. 환자는 현재 조증 삽화를 보이고 있습니다. [교과서] 빠른 정신운동활동은 조증의 현저한 특징인데, 과도한 에너지와 활동, 말이 많음(다변), 빠른 말투 및 압출언어(pressured speech)와 같은 특징으로 나타난다. 압출언어 = 다변증, 병적수다, 언어압력, 언어압박 – 빠르고 가속화되고 격앙된 언어로, 말의 흐름이 매우 빠르고 많아서 중단시키기가 어려운 상태(예: 조증). 교수님께서 강의록에 나온 정신병리는 모두 알아두라고 하셨습니다. (2025 해설) 정재희 교수님도 정상근 교수님 야마 그대로 – 강의록 별표 부분만 보면 되고, 과대망상도 야마 빈출. 조증의 임상양상: 정신운동 항진(목표지향적 활동 증가), 사고의 흐름이 빠르고 쉽게 주의산만, 사고의 비약, 연상의 이완, 충동조절장애, 판단력 장애와 병식 없음, 수면욕구 감소.","exps":[],"ai":"","fl":{}},{"k":"psy-y-bp-sp-2019","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「양극성 관련 장애」 326–340쪽","year":"2019 객6","type":"객","rep":6,"repyears":"2025 객46 · 2023 객5 · 2022 객5 · 2018 객6 · 2017 객6","stem":"30대 패션회사 직원이 10일 전부터 잠을 거의 자지 않고, 피곤한 줄을 모른다. (가) 자신이 세계 최고의 패션 디자이너이고 일주일 후 서울 소재 특급 호텔에서 ‘국제 패션쇼’에 관한 기자 회견을 열겠다고 호텔 행사용홀을 예약하였다. 평소 성격과 달리, 최근 기분이 들떠 있고 (나) 말이 많았으며, 말을 멈추게 할 수 없었다. 월급이 200만원인 그녀는 기자회견을 위해 세계적 연상이완이나 사고의 비약, 과대망상. 해설: 증례는 조증삽화이고 ④ 사고단절은 조증의 임상양상에 해당하지 않는다(조현병의 사고장애).","exps":[],"ai":"","fl":{}},{"k":"psy-y-bp-tx-2025","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「양극성 관련 장애」 326–340쪽","year":"2025 객47","type":"객","rep":13,"repyears":"2023 객6 · 2022 객6 · 2021 객6 · 2020 객6 · 2019 객7 · 2017 객7 · 2018 객7 · 2016 객4 · 2015 객5 · 2013 객26 · 2012 객33 · 2011 객10","stem":"30대 패션회사 직원이 10일 전부터 잠을 거의 자지 않고, 피곤한 줄을 모른다. 자신이 세계 최고의 패션 디자이너이고 일주일 후 서울 소재 특급 호텔에서 ‘국제 패션쇼’에 관한 기자회견을 열겠다고 호텔 행사용 홀을 예약하였다. 평소 성격과 달리, 최근 기분이 들떠 있고 (가) 말이 매우 빠르며 말수가 쉴새 없이 많아져서 상대방이 말을 멈추게 할 수가 없었다. 월급이 200만원인 그녀는 기자회견을 위해 세계적인 유명 브랜드의 옷과 구두를 1000만원어치나 구입하였다.\n상기 증례 환자의 치료에 대한 설명으로 가장 옳은 것은?","choices":["보호병동에 입원시키고 환자의 행동을 호되게 체벌한다.","급성 조증 흥분 상태에서 haloperidol 주사가 효과적이다.","정신역동적 정신치료가 약물치료보다 훨씬 효과적이다.","기분안정제로 gabapentin, topiramate를 처방 투여한다.","methylphenidate나 venlafaxine 등을 저녁식후 투여한다."],"ans":[2],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2023 객6","복원자: 교수님이 임상에서 haloperidol + lorazepam 조합을 잘 쓴다고 언급."],"basis":"🎓 올해 수업 기준: 교수님: 조증에서는 안전이 가장 중요 – 환자 자신·가족·사회에 대한 피해 방지. 자존심을 건드리지 않는 부드럽고 설득력 있는 태도가 정말 중요하고 쉽지 않다(응급실에서 많이 터진다). 본인이 입원을 원하지 않으면 원칙적으로 입원시킬 수 없지만, 자타해 위험이 있고 정신과 의사가 필요하다고 하면 보호의무자 2명 동의로 보호입원(옛 강제입원) – 조증 환자는 보호입원이 많다. 경조증은 외래 가능하나 자주 와야 한다. 약물: 기분안정제 lithium·valproate·carbamazepine, 요즘은 비정형 항정신병약물도 많이 쓴다(강의록: 급성기 haloperidol 등 항정신병약물·benzodiazepine). 항우울제는 양극성 우울에서 mood switch(조증 전환) 위험 때문에 조심스럽게 – MAOI·bupropion·일부 SSRI. 자세한 약은 다음 주 약물치료 시간.\n\n📚 학습지 해설: <양극성 정동장애 및 조증의 치료> 1) 경조증: 외래 통원치료 가능, 병원을 자주 방문. 2) 가장 중요한 주의사항: 환자 자신·가족·사회에 대한 피해방지. 3) 치료적 태도: 자존심을 건드리지 않도록 부드럽고 설득력 있는 태도. 4) 양극성 우울증 치료: 주요우울장애와 거의 비슷, 기분안정제 병행, 항우울제 중 조증 유발효과가 적은 MAOI·bupropion이 바람직. 5) 입원: 대부분 강제입원(병식 결여) – 진단절차, 자살·타살 위험, 의식주 해결 불가, 급작스런 악화, 지지구조 미약, 재산·재정적 낭비가 심할 때, 가족·사회에 해를 끼치는 심한 행동장애. (1) 약물치료 – 급성기: 리튬 효과가 약 2주 지나야 나오므로 항정신병약물(haloperidol), 벤조디아제핀(lorazepam, clonazepam)으로 급성기 행동장애·수면장애를 조절 후 감량·중단, 최근 비정형 항정신병약물 사용 증가. 항조증 약물: lithium(기본약물, 투약 전 신장·갑상선 기능·전해질·소변·심전도·혈액검사, 혈중농도 급성기 0.8–1.2, 유지기 0.6–0.8 mEq/L), carbamazepine·valproic acid(정기적 혈액검사), 비정형 항정신병약물(quetiapine, olanzapine 등), 전기경련요법. (2) 정신치료: 급성기엔 무의미하고 치료관계 형성 목적, 급성 증상 호전 후 인지치료·가족치료 병행. (4) 유지치료: lithium, valproate, lamotrigine. 선지별 – 체벌·꾸짖음(X), 정신역동적 정신치료가 약물보다 효과적(X: 약물치료가 절대적), gabapentin·topiramate는 기분안정제로 쓰지 않는 항경련제(X, topiramate는 폭식증에서 식욕 저하용), imipramine·amphetamine·methylphenidate·venlafaxine·armodafinil(X), quetiapine·olanzapine 저녁 식후 투여(O), 수면박탈·광치료는 우울증 치료(X). (2025 해설) 정재희 교수님은 정상근 교수님 야마를 그대로 타셨습니다. 조증 환자의 기본 치료는 기분안정제 + 항정신병약물, 급성 조증에서는 haloperidol 주사가 효과 있고, 임상에서 haloperidol + lorazepam 조합을 잘 쓴다고 수업 중에도 언급하셨습니다(작년 수업 기준).","exps":[],"ai":"","fl":{}},{"k":"psy-y-bp-tx-2022","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「양극성 관련 장애」 326–340쪽","year":"2022 객6","type":"객","rep":13,"repyears":"2025 객47 · 2023 객6 · 2021 객6 · 2020 객6 · 2019 객7 · 2017 객7 · 2018 객7 · 2016 객4 · 2015 객5 · 2013 객26 · 2012 객33 · 2011 객10","stem":"30대 패션회사 직원이 10일 전부터 잠을 거의 자지 않고, 피곤한 줄을 모른다. (가) 자신이 세계 최고의 패션 디자이너이고 일주일 후 서울 소재 특급 호텔에서 ‘국제 패션쇼’에 관한 기자 회견을 열겠다고 호텔 행사용홀을 예약하였다. 평소 성격과 달리, 최근 기분이 들떠 있고 (나) 말이 많았으며, 말을 멈추게 할 수 없었다. 월급이 200만원인 그녀는 기자회견을 위해 세계적인 유명 브랜드의 옷과 구두를 1000만원어치나 구입하였다.\n이 환자의 치료에 대한 설명으로 옳은 것은?","choices":["정신과 보호병동에 입원시키고 환자의 행동을 호되게 처벌한다.","급성 조증에 haloeridol을 사용한다","정신역동적치료가 약물치료보다 효과적이다.","기분안정제로 toparamate, lurasidone 등을 처방한다.","일차치료약물은 imipramine, amphetamine이다."],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님: 조증에서는 안전이 가장 중요 – 환자 자신·가족·사회에 대한 피해 방지. 자존심을 건드리지 않는 부드럽고 설득력 있는 태도가 정말 중요하고 쉽지 않다(응급실에서 많이 터진다). 본인이 입원을 원하지 않으면 원칙적으로 입원시킬 수 없지만, 자타해 위험이 있고 정신과 의사가 필요하다고 하면 보호의무자 2명 동의로 보호입원(옛 강제입원) – 조증 환자는 보호입원이 많다. 경조증은 외래 가능하나 자주 와야 한다. 약물: 기분안정제 lithium·valproate·carbamazepine, 요즘은 비정형 항정신병약물도 많이 쓴다(강의록: 급성기 haloperidol 등 항정신병약물·benzodiazepine). 항우울제는 양극성 우울에서 mood switch(조증 전환) 위험 때문에 조심스럽게 – MAOI·bupropion·일부 SSRI. 자세한 약은 다음 주 약물치료 시간.\n\n📚 학습지 해설: <양극성 정동장애 및 조증의 치료> 1) 경조증: 외래 통원치료 가능, 병원을 자주 방문. 2) zapine 등), 전기경련요법. (2) 정신치료: 급성기엔 무의미하고 치료관계 형성 목적, 급성 증상 호전 후 인지치료·가족치료 병행. (4) 유지치료: lithium, valproate, lamotrigine. 선지별 – 체벌·꾸짖음(X), 정신역동적 정신치료가 약물보다 효과적(X: 약물치료가 절대적), gabapentin·topiramate는 기분안정제로 쓰지 않는 항경련제(X, topiramate는 폭식증에서 식욕 저하용), imipramine·amphetamine·methylphenidate·venlafaxine·armodafinil(X), quetiapine·olanzapine 저녁 식후 투여(O), 수면박탈·광치료는 우울증 치료(X). (2016 해설) 매해 보기 순서만 다르게 출제되거나 보기를 하나 정도만 바꾸시는 야마입니다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-bp-tx-2015","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「양극성 관련 장애」 326–340쪽","year":"2015 객5","type":"객","rep":13,"repyears":"2025 객47 · 2023 객6 · 2022 객6 · 2021 객6 · 2020 객6 · 2019 객7 · 2017 객7 · 2018 객7 · 2016 객4 · 2013 객26 · 2012 객33 · 2011 객10","stem":"30대 미용사가 10일전부터 잠을 거의 자지 않고, 피곤할 줄을 모른다. 자신이 세계 최고의 헤어디자인이고, 일주일 후 서울 소재 특급호텔에서 ‘국제 헤어 쇼’에 관한 기자회견을 열겠다고 호텔 행사용 홀을 예약하였으며, 친척, 친구들에게 수시로 전화하여 참석을 강요하였다. 평소 성격과 달리, 최근 기분이 들떠 있고 말이 많아졌으며, 매사에 자신감이 넘쳐있고 활동이 너무 많다. 월급이 150만원인 그녀는 기자회견을 위해 세계적인 유명 브랜드의 옷 두벌과 구두 두 켤레를 1000만원어치나 구입하였다. 각종 신체검사에서 특이사항은 없었다. 이 여성의 치료에 대한 설명으로 옳은 것은?","choices":["정신과 보호병동에 가두어두고 체벌을 가하면서 호되게 꾸짖는다.","병식이 있으므로 정신과 외래에서 통원치료를 실시한다.","이 환자에게 lorazepam이나 haloperidol 약물이 치료에 도움이 된다.","이 환자를 입원 시킨 후 일차선택약물은 amphetamine, imiprmine, fluoxetine 이다.","정신역동적 정신치료가 이러한 상황에서 약물보다 더 효과적이다."],"ans":[3],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2013 객26"],"basis":"🎓 올해 수업 기준: 교수님: 조증에서는 안전이 가장 중요 – 환자 자신·가족·사회에 대한 피해 방지. 자존심을 건드리지 않는 부드럽고 설득력 있는 태도가 정말 중요하고 쉽지 않다(응급실에서 많이 터진다). 본인이 입원을 원하지 않으면 원칙적으로 입원시킬 수 없지만, 자타해 위험이 있고 정신과 의사가 필요하다고 하면 보호의무자 2명 동의로 보호입원(옛 강제입원) – 조증 환자는 보호입원이 많다. 경조증은 외래 가능하나 자주 와야 한다. 약물: 기분안정제 lithium·valproate·carbamazepine, 요즘은 비정형 항정신병약물도 많이 쓴다(강의록: 급성기 haloperidol 등 항정신병약물·benzodiazepine). 항우울제는 양극성 우울에서 mood switch(조증 전환) 위험 때문에 조심스럽게 – MAOI·bupropion·일부 SSRI. 자세한 약은 다음 주 약물치료 시간.\n\n📚 학습지 해설: <양극성 정동장애 및 조증의 치료> 1) 경조증: 외래 통원치료 가능, 병원을 자주 방문. 2) 가장 중요한 주의사항: 환자 자신·가족·사회에 대한 피해방지. 3) 치료적 태도: 자존심을 건드리지 않도록 부드럽고 설득력 있는 태도. 4) 양극성 우울증 치료: 주요우울 성의 치료에 대한 설명으로 옳은 것은?","choices":["현재 자해 및 타해, 자살 시도의 가능성이 없으므로 우선은 지켜본다.","병식이 결여되어 있으나 환자의 인권이 있으므로 환자가 원하지 않는 경우 입원시킬 수 없다.","정신역동적 정신치료가 이러한 상황에서 약물보다 더 효과적이다.","이 환자에서 일차선택약물은 imipramine, MAOI, bupropion이다.","이 환자에서 valproic acid 및 lithium과 함께 벤조디아제핀, 항정신병약물도 치료에 도움이 된다."],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님: 조증에서는 안전이 가장 중요 – 환자 자신·가족·사회에 대한 피해 방지. 자존심을 건드리지 않는 부드럽고 설득력 있는 태도가 정말 중요하고 쉽지 않다(응급실에서 많이 터진다). 본인이 입원을 원하지 않으면 원칙적으로 입원시킬 수 없지만, 자타해 위험이 있고 정신과 의사가 필요하다고 하면 보호의무자 2명 동의로 보호입원(옛 강제입원) – 조증 환자는 보호입원이 많다. 경조증은 외래 가능하나 자주 와야 한다. 약물: 기분안정제 lithium·valproate·carbamazepine, 요즘은 비정형 항정신병약물도 많이 쓴다(강의록: 급성기 haloperidol 등 항정신병약물·benzodiazepine). 항우울제는 양극성 우울에서 mood switch(조증 전환) 위험 때문에 조심스럽게 – MAOI·bupropion·일부 SSRI. 자세한 약은 다음 주 약물치료 시간.\n\n📚 학습지 해설: 조증 삽화(최소 1주 이상 고양·과대·과민한 기분, 수면욕구 감소, 다변, 무절제한 물건 구입). 조증 치료 시 입원이 필요한 경우: 대부분 강제입원(병식 결여) – 진단절차, 자살·타살 위험, 의식주 해결 불가, 급작스런 악화, 지지구조 미약, 재산·재정적 낭비가 심할 때(①②X), 가족·사회에 해를 끼치는 심한 행동장애. ③ 정신치료는 급성기에 무의미하고 치료관계 형성 목적(X) ④ 양극성 우울증의 치료약물(X) ⑤ valproic acid·lithium과 함께 벤조디아제핀, 항정신병약물도 도움(O).","exps":[],"ai":"","fl":{}},{"k":"psy-y-bp-li-2011","area":"야마","prof":"정재희","sec":"10/21 · 기분장애 (우울장애·양극성장애)","meta":"근거: 학습지 「양극성 관련 장애」 326–340쪽","year":"2011 객11","type":"객","rep":1,"repyears":"","stem":"수년 전부터 조증과 우울증의 반복적인 삽화로 고통 받아 오던 28세 여성이 내원하였다. 내원하여 실시한 혈액 검사 상 갑상선 기능 검사는 정상이었으나, 백혈구 감소 및 간기능 저하 소견을 보였다. 상기 환자에게 가장 적절한 기분 조절제 중 옳은 것은?","choices":["Carbamazepine","Clozapine","Lithium","Amitriptyline","Valproic acid"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 올해 수업에서는 기분안정제로 lithium·valproate·carbamazepine을 소개만 했고, 약물별 부작용은 다음 주 약물치료 시간에 다룰 예정.\n\n📚 학습지 해설: carbamazepine은 조혈기관 장애, valproic acid는 간기능 장애가 심하다. clozapine은 agranulocytosis 등을 야기한다. 양극성장애로 횟수가 명시되지 않아 급속순환형이라고 볼 증거가 없다. 일차치료는 리튬이다(③). (백혈구 감소·간기능 저하 → carbamazepine·valproate 피함, 갑상선 기능 정상 → lithium 가능)","exps":[],"ai":"","fl":{}},{"k":"psy-c3-fh","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 27쪽(문제) · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"🤍형성평가 7세 여자아이가 이상 운동 증세로 내원했다. 수년 전부터 눈을 깜빡거리고 입을 씰룩거리는 행동이 나타났으며 최근에는 “음음”소리를 반복해서 냈다. 안과적, 이비인후과적 이상은 없었다고 한다. 이 진단의 임상경과에 대한 설명 중 옳은 것은?","choices":["보통 증상이 가장 심해지는 시기는 10대 후반이다.","절반 이상에서 욕설증(corprolalia)를 보인다.","대체로 수면 중에는 증상이 심해지는 편이다.","대개는 음성틱이 운동틱보다 먼저 시작한다.","주의력결핍 과잉행동증상이 동반되면 예후가 나쁘다."],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"수업 중 교수님 풀이: 여러 운동틱 + 음성틱 → 뚜렛. 가장 심한 시기는 10–12세(10대 후반엔 많이 좋아짐), 욕설증은 30% 미만, 수면 중엔 감소, 운동틱(단순틱)이 먼저 오고 2–3년 뒤 음성틱. ADHD가 동반되면 예후가 나쁘다.","exps":["10–12세가 최고조다.","30% 미만이다.","수면 중엔 감소한다.","운동틱이 먼저다.","정답."],"ai":"","fl":{}},{"k":"psy-c3-01","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 2쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 신경발달장애 중 운동장애(motor disorders)에 속하지 않는 것은?","choices":["잠정적 틱장애","지연성 운동이상증","상동증적 운동장애","뚜렛장애","발달성 협응장애"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 2쪽·교수님: 신경발달장애 맨 마지막 운동장애 = 발달성 협응장애, 상동증적 운동장애, 틱장애(뚜렛·지속성·잠정적·달리 명시된/명시되지 않은). 지연성 운동이상증은 항정신병약물 부작용으로 틱과 감별할 대상.","exps":["속한다.","정답. 약물 유발 운동장애다.","속한다.","속한다.","속한다."],"ai":"","fl":{}},{"k":"psy-c3-02","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 2쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"발달성 협응장애에 대한 교수님 설명으로 옳은 것은?","choices":["틱장애의 한 종류로 분류된다","소근육까지 서툴고 ADHD와 많이 동반된다","아주 드문 질환이라 거의 볼 수 없다","자폐스펙트럼장애와만 동반된다","대근육만 서툴고 소근육 발달은 정상이다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 운동 신경이 떨어져 균형 잡기·소근육(글쓰기, 종이접기, 오리기, 단추 채우기)이 많이 서툴고 어설프다(clumsy). 꽤 많고 ADHD와 많이 동반된다.","exps":["별개 진단이다.","정답.","꽤 많다.","ADHD와 많이 동반.","소근육도 서툴다."],"ai":"","fl":{}},{"k":"psy-c3-03","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 4쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"틱의 특징으로 옳지 않은 것은?","choices":["잠시 참을 수는 있지만 곧 더 늘어난다","수면 중에는 대개 크게 감소한다","갑자기, 반복적으로 나타난다","일정한 리듬이 없다","야단치면 의지로 고칠 수 있다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4쪽·교수님: 비수의적, 일정한 리듬 없음(떨림은 리듬이 있음), 뚜렷한 목적 없음, 야단친다고 고쳐지지 않고 의지로 조절되지 않음, 잠시 참을 수 있으나 곧 더 늘어남, 수면 중엔 많이 감소(할 수도 있음). 틱 내용은 계속 바뀐다.","exps":["옳다.","옳다.","옳다.","옳다.","정답. 의지로 조절되지 않는다."],"ai":"","fl":{}},{"k":"psy-c3-04","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 5–11쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"틱의 분류와 예가 바르게 연결된 것은?","choices":["단순 운동틱 – 외설스런 동작(copropraxia)","복합 운동틱 – 눈 깜빡이기","복합 음성틱 – 킁킁거리기","단순 음성틱 – 코 훌쩍거리기·헛기침","단순 음성틱 – 욕설증(coprolalia)"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 5–11쪽·교수님: 단순틱은 1–2개 근육군이 짧게(1초 이내), 복합틱은 여러 근육이 관여해 의도한 행동처럼 보인다(꼬집기, 벌떡 일어나기, 뒤로 젖히다 넘어지기). 단순 음성틱 = 의성어(기침, 헛기침, 훌쩍, 킁킁 – 비염으로 오진되기도), 복합 음성틱 = 말(단어, 문구, 욕설증, 반향어, 동어반복).","exps":["복합 운동틱이다.","단순 운동틱이다.","단순 음성틱이다.","정답.","복합 음성틱이다."],"ai":"","fl":{}},{"k":"psy-c3-05","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 9·11쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"상대방이 한 말을 따라 하는 것과 자신이 한 말을 반복하는 것을 순서대로 짝지은 것은?","choices":["echolalia – palilalia","coprolalia – echolalia","copropraxia – palilalia","palilalia – echolalia","echopraxia – coprolalia"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 9·11쪽·교수님: 반향어(echolalia) = 남의 말 따라 하기, 동어반복(palilalia) = 자기 말 반복(\"how are you\"를 1분에 세 번), 욕설증(coprolalia) = 외설스러운 말, echopraxia = 동작 따라 하기, copropraxia = 외설스러운 동작.","exps":["정답.","순서가 다르다.","해당 없다.","반대다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-c3-06","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 9쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"뚜렛장애에서 욕설증(coprolalia)에 대한 설명으로 옳은 것은?","choices":["진단에 반드시 필요하다","단순 음성틱에 속한다","약 20–30%(1/3 미만)에서 나타나며 진단의 필수 조건이 아니다","성인에서만 나타난다","뚜렛 환자의 대부분(80% 이상)에서 나타난다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"교수님·수업 영상: 가장 극적이고 사회적으로 괴로운 복합 음성틱이지만 뚜렛 환자의 1/3 미만(20–30%)에서만 나타나며 진단 기준에 필수가 아니다. 말이므로 복합 음성틱.","exps":["필수가 아니다.","복합 음성틱이다.","정답.","해당 없다.","1/3 미만이다."],"ai":"","fl":{}},{"k":"psy-c3-07","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 12–16쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"틱장애의 DSM 분류에 대한 설명으로 옳은 것은?","choices":["두 종류 틱이 반드시 동시에 있어야 뚜렛이다","여러 운동틱과 음성틱이 경과 중 있고 1년 이상이면 뚜렛장애다","1년 미만이면 운동틱·음성틱이 다 있어도 뚜렛이다","음성틱만 1년 이상이면 뚜렛장애다","발병 연령 제한은 없다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 12–16쪽·교수님: 1년 미만 = 잠정적(일과성) 틱장애(일과성이라 하면 가볍게 볼까 봐 이름을 바꿈), 1년 이상 운동틱만/음성틱만 = 지속성(만성) 운동/음성 틱장애, 1년 이상 둘 다(동시일 필요 없음) = 뚜렛. 모두 18세 이전 발병 – 이후면 달리 명시된 틱장애(군대 등, 헌팅턴 등 다른 원인 감별).","exps":["동시일 필요 없다.","정답.","잠정적 틱장애다.","만성 음성 틱장애다.","18세 이전이다."],"ai":"","fl":{}},{"k":"psy-c3-08","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 16–17쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"틱장애의 빈도에 대한 설명으로 옳은 것은?","choices":["뚜렛병이 가장 흔하다","잠정적(일과성) 틱장애가 아동의 10–15%로 가장 흔하다","만성 음성틱만 나타나는 경우가 가장 흔하다","뚜렛병은 10% 정도다","여자아이가 훨씬 많다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 16–17쪽·교수님: 잠정적 틱장애 10–15%로 상당히 흔하고 그다음 만성 틱장애(약 1.5%), 뚜렛 0.1–0.6%(100명에 1명까지 보기도). 남아가 1.5–9배 – 신경발달장애는 거의 다 남자가 많다. 만성적으로 음성틱만 나타나는 경우는 아주 드물다. 인종별로는 백인 최다, 흑인 최소, 한국은 중간.","exps":["가장 흔한 것은 잠정적 틱장애.","정답.","아주 드물다.","0.1–0.6%다.","남아가 많다."],"ai":"","fl":{}},{"k":"psy-c3-09","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 18–19쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"뚜렛장애의 원인과 악화 요인에 대한 설명으로 옳은 것은?","choices":["도파민과 관련되어 항도파민 약을 쓴다","학교에서 집보다 훨씬 심하게 나온다","환경 요인이 주된 발병 원인이다","게임 자체가 틱을 일으키는 원인이다","유전적 요인은 관계없다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 18–19쪽·교수님: 원인은 도파민(그래서 risperidone·aripiprazole 같은 항도파민 약 – 부모님께 \"조현병 약\"이 아님을 설명), 유전(약 70%), 면역(연구했으나 지금은 덜함). 환경 요인은 원인이 아니라 악화·완화 요인 – 게임·TV에 빠져 있을 때·긴장할 때 많이 나온다. 학교에선 눈치 보며 참다가 집에서 많이 한다. CSTC 회로 이상(강박증과 같은 회로).","exps":["정답.","집에서 더 많다.","악화·완화 요인이다.","악화 요인일 뿐이다.","유전 요인이 크다."],"ai":"","fl":{}},{"k":"psy-c3-10","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 19쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"틱장애와 강박장애가 공통으로 관련된다고 교수님이 설명한 뇌 회로는?","choices":["소뇌-전정 회로","시상하부-뇌하수체-부신 축","Papez 회로","피질-선조체-시상-피질(CSTC) 회로","중뇌변연계 경로만"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 19쪽·교수님: CSTC 회로 이상으로 생기는 뇌발달학적 질환 – 강박증 회로와 같아 틱과 강박은 \"사촌지간\"이다. 틱장애 아이의 강박 증상은 80%까지(확인·정렬·특정 횟수).","exps":["해당 없다.","스트레스 축이다.","해당 없다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-c3-11","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 21–22쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"뚜렛장애의 임상경과로 옳은 것은?","choices":["틱은 다리에서 시작해 위로 올라간다","음성틱이 먼저 시작하고 운동틱이 나중에 온다","대부분 성인기에 더 심해진다","복합틱이 단순틱보다 먼저 온다","3–8세 시작, 10–12세 최고조, 10대 후반 호전"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 21–22쪽·교수님: 단순 운동틱이 3–8세에 시작, 2–3년 뒤 음성틱(8–15세), 10–12세 최고조(이때 병원에 가장 많이 옴), 약 75%가 성인이 되기 전 많이 줄어든다(장애 진단도 만 20세 이후). 단순틱 → 복합틱, 위(눈)에서 아래로, 몸 중심에서 바깥쪽으로 진행.","exps":["위에서 아래로 내려간다.","운동틱이 먼저다.","대부분 호전된다.","단순틱이 먼저다.","정답."],"ai":"","fl":{}},{"k":"psy-c3-12","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 23쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"뚜렛장애에 흔히 동반되는 질환과 비율로 교수님이 언급한 것은?","choices":["ADHD 약 50%, 강박장애 약 30%","동반 질환은 대부분 없다","양극성장애가 약 40%에서 동반","조현병이 약 50%에서 동반","자폐스펙트럼장애가 약 70%"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 23쪽·교수님: ADHD 약 50%, 강박증 약 30%(둘 다도 가능), 분노·충동 조절 문제, 학습장애. 틱 자체보다 동반 질환 때문에 더 심각한 경우가 많아 예일대에서는 틱 아이들에게 분노 조절 훈련을 했다. ADHD 동반 시 예후가 나쁘다.","exps":["정답.","흔하다.","해당 없다.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-c3-13","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 24–26쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"틱장애 치료 원칙에 대한 설명으로 옳은 것은?","choices":["틱이 있으면 무조건 약물치료를 한다","가족 교육이 우선, 잘 기능하면 치료 불필요","틱이 심해지면 즉시 약을 증량한다","틱 가짓수가 많으면 약을 올린다","행동치료는 효과가 없다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 24–26쪽·교수님: 가족(부모) 교육이 가장 중요 – 불필요한 치료를 피함. 사회·학교에서 잘 기능하면 치료 불필요. 약은 틱의 빈도·심각도보다 아이의 주관적 고통, 학교생활 영향(놀림), 신체 손상 위험(목 흔들기, 혀 깨물기), 공존질환을 보고 결정. 틱은 심했다 덜했다(waxing-waning) 하므로 심하다고 바로 증량하지 않는다. 가장 좋은 치료는 약물 + 행동치료.","exps":["고통·기능을 보고 결정한다.","정답.","waxing-waning을 고려한다.","가짓수 기준이 아니다.","효과적이다."],"ai":"","fl":{}},{"k":"psy-c3-14","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 25쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"틱을 하려는 전조충동이 사라질 때까지 틱과 반대되는 근육을 써서 버티게 하는 행동치료는?","choices":["토큰 경제","홍수법","체계적 탈감작법","습관역전 훈련","혐오요법"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 25쪽·교수님: 습관역전 – 음성틱이면 입 다물고 코로 숨 쉬며, 목 흔드는 틱이면 턱을 당겨 목 뒤로 버티며 전조충동이 없어질 때까지 참는 연습. 반응억제(강박증에서 온 방법)는 여러 틱을 한꺼번에 참게 한다. 그 외 교육, 유발인자 회피, 스트레스 관리, 이완요법(복식호흡·점진적 근육이완).","exps":["ADHD 행동치료다.","해당 없다.","공포증 치료다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-c3-15","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 강의록 「2023 정신의학 5」(운동장애) 26쪽 · STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"틱장애 약물치료에 대한 설명으로 옳은 것은?","choices":["모든 틱에서 SSRI가 1차 약이다","중추신경자극제가 1차 약으로 쓰인다","벤조디아제핀이 표준 치료로 쓰인다","aripiprazole·risperidone, clonidine을 쓴다","haloperidol은 틱에 효과가 전혀 없다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 26쪽·교수님: 도파민 수용체 차단제 – haloperidol은 효과가 가장 좋은 편이나 부작용(지연성 운동이상증 등)으로 잘 안 쓰고, 현재는 aripiprazole·risperidone(sulpiride 계열도). α2 효현제 clonidine(NE 시스템 다운, ADHD 동반 시, 미국에서 많이 씀), guanfacine은 국내에 없다.","exps":["강박 동반 시.","해당 없다.","해당 없다.","정답.","효과는 좋지만 부작용."],"ai":"","fl":{}},{"k":"psy-c3-16","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"할로페리돌을 오래 먹던 고등학생이 혀를 반복적으로 깨물어 입원했다. 틱 외에 가장 먼저 감별해야 할 것으로 교수님이 꼽은 것은?","choices":["지연성 운동이상증","레쉬-니한 증후군(자해)","시덴함 무도병(류마티스열)","근간대경련(myoclonus)","레트 증후군(여아 상동운동)"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"교수님: 자해 형태의 틱도 있지만, 고역가 항정신병약물을 오래 먹어 입 주변(orobuccal–mandibular) 지연성 운동이상증이 온 것은 아닌지 감별해야 한다(결국 clozapine을 썼다). 지연성 운동이상증은 고용량·고역가 장기 사용 시 약 20%, 여자·노인에 많다.","exps":["정답.","고요산혈증·자해.","연쇄상구균 감염 후 무도병.","빛·소리에 유발, 참을 수 없음.","여아의 손 상동운동."],"ai":"","fl":{}},{"k":"psy-c3-17","area":"탈야","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: STT 10/22 1교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"틱과 감별해야 할 운동장애의 특징 연결이 옳지 않은 것은?","choices":["레트 증후군 – 남아에서만 생긴다","레쉬-니한 증후군 – 고요산혈증·자해","무도병 – 더 연속적이고 흐르듯 불규칙하다","근간대경련 – 틱처럼 참을 수 없고 뇌파가 진단에 도움","시덴함 무도병 – milkmaid's grip, 연쇄상구균 항체 검사"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"수업 영상(감별진단): 무도병은 틱보다 연속적·불규칙하고 상동적이지 않다. 시덴함 무도병(류마티스열 – 교수님이 틱의 자가면역 연구를 함), 신경극세포증(적혈구 검사), 레쉬-니한(고요산혈증), 레트 증후군은 여아에서만(손 상동운동·자폐 양상·지적 퇴행), 근간대경련은 참을 수 없음. 근긴장이상증(dystonia)은 특이한 자세를 유지 – 항정신병약 초기 급성 dystonia는 항콜린제로 좋아진다.","exps":["정답. 여아에서만 생긴다.","옳다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-y-nd-tic-dx-2025","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2025 객12","type":"객","rep":4,"repyears":"2019 객23 · 2018 객23 · 2016 객23","stem":"9세 여아가 2년 전부터 시작된 이상 운동으로 내원하였다. 환자는 고개를 흔들고, 코를 찡긋거리는 것을 반복하였다. 얼마 전부터 ‘킁킁’거리는 것을 하다가 최근에는 사라졌다. 진단은?","choices":["언어장애","뚜렛장애","잠재성 틱장애","만성 운동틱 장애","주의력결핍과잉행동장애"],"ans":[2],"imgs":[],"vis":[],"notes":["복원자: 박태원 교수님 5분이 각각 10문제씩 총 50문제 객관식."],"basis":"🎓 올해 수업 기준: 교수님(10/22 1교시): 틱장애 4분류 – 1년 미만이면 운동·음성 상관없이 잠정적(예전 \"일과성\"인데 가볍게 볼까 봐 이름을 바꿈), 1년 이상 운동틱만·음성틱만이면 지속성(만성) 운동/음성 틱장애, 여러 운동틱 + 음성틱(동시일 필요 없음, 경과 중 한 번이라도)이 1년 이상이면 뚜렛. 18세 넘어 시작하면(예: 군대) 드물고 다른 원인(헌팅턴 무도병 등)을 찾아야 해서 달리 명시된 틱장애. 부모는 음성틱을 놓치거나 \"몇 달 전 시작\"이라고 하지만 실제로는 대부분 1년 넘은 경우가 많다.\n\n📚 학습지 해설: 2개의 운동틱(고개 흔들기 + 코 찡긋)과 1개의 음성틱(\"킁킁\")이 있으므로 뚜렛장애 – 야마. 뚜렛 DSM 기준: 다발성 운동틱 + 1가지 이상 음성틱이 경과 중 나타남(동시일 필요 없음), 1년 이상, 18세 이전 발병, 약물·내과 질환에 의한 것이 아님. 언어장애 – 다른 발달은 문제없고 언어 의사소통만 어려움, 틱은 운동장애. 잠재성(일과성) 틱장애 – 1년 미만, 종류·개수 무관. 만성 운동틱 장애 – 1년 이상, 한 종류만. ADHD – 틱은 운동장애. 뚜렛은 ADHD·OCD를 자주 동반. 복원자: 교수님 5분이 각각 10문제씩 총 50문제 객관식.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-tic-dx-2019","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2019 객23","type":"객","rep":4,"repyears":"2025 객12 · 2018 객23 · 2016 객23","stem":"7세 남아가 3년전부터 눈을 깜박인다고 내원했다. 2년 전부터는 ‘음음’소리를 내기 시작했다고 한다. 진단은?","choices":["뚜렛증후군","신체적 강박증","잠재적 틱장애","만성 운동 틱장애","상세불병의 틱장애"],"ans":[1],"imgs":[],"vis":[],"notes":["복원자: ③④⑤ 선지는 복원 실패로 표시."],"basis":"🎓 올해 수업 기준: 교수님(10/22 1교시): 틱장애 4분류 – 1년 미만이면 운동·음성 상관없이 잠정적(예전 \"일과성\"인데 가볍게 볼까 봐 이름을 바꿈), 1년 이상 운동틱만·음성틱만이면 지속성(만성) 운동/음성 틱장애, 여러 운동틱 + 음성틱(동시일 필요 없음, 경과 중 한 번이라도)이 1년 이상이면 뚜렛. 18세 넘어 시작하면(예: 군대) 드물고 다른 원인(헌팅턴 무도병 등)을 찾아야 해서 달리 명시된 틱장애. 부모는 음성틱을 놓치거나 \"몇 달 전 시작\"이라고 하지만 실제로는 대부분 1년 넘은 경우가 많다.\n\n📚 학습지 해설: 신경정신의학 8장 신경발달장애 틱장애. 눈 깜박임(운동틱) 3년 + \"음음\"(음성틱) 2년, 18세 이전 → 정답 ① 뚜렛증후군. 복원자: ③④⑤ 선지는 복원 실패.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-tic-dx-2018","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2018 객23","type":"객","rep":4,"repyears":"2025 객12 · 2019 객23 · 2016 객23","stem":"5개월 전에 입대한 22세 남자가 입이 벌어지고 얼굴이 떨려서 도무지 사격을 할 수가 없다며 내원하였다. 환자는 ‘음음’ 소리를 반복하여 내었고, 아버지와 환자는 환자가 이전까지는 이런 적이 없었다고 말하였으며 입대 하고 나서부터 이런 증상이 나타나였다고 한다. 진단은?","choices":["뚜렛장애","잠정적 틱장애","만성 운동성 틱장애","달리 분류되는 틱장애","강박장애가 동반된 틱장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 1교시): 틱장애 4분류 – 1년 미만이면 운동·음성 상관없이 잠정적(예전 \"일과성\"인데 가볍게 볼까 봐 이름을 바꿈), 1년 이상 운동틱만·음성틱만이면 지속성(만성) 운동/음성 틱장애, 여러 운동틱 + 음성틱(동시일 필요 없음, 경과 중 한 번이라도)이 1년 이상이면 뚜렛. 18세 넘어 시작하면(예: 군대) 드물고 다른 원인(헌팅턴 무도병 등)을 찾아야 해서 달리 명시된 틱장애. 부모는 음성틱을 놓치거나 \"몇 달 전 시작\"이라고 하지만 실제로는 대부분 1년 넘은 경우가 많다. 교수님이 대표 예로 \"18세 넘어 오는 경우 – 군대\"를 들었다.\n\n📚 학습지 해설: 1. 운동틱과 음성틱이 모두 존재 → 투렛장애 또는 달리 명시된 틱장애 2. 22세로 18세 이전이 아님 → 달리 명시된 틱장애(④). 교과서 203쪽: 경과 중 동시에 있지 않았더라도 음성틱과 운동틱이 있었으면 투렛. 달리 명시된 틱장애: 틱 장애 특징이 두드러지지만 틱장애·신경발달장애 기준을 완전히 만족하지 않는 경우, 이유를 명시(예: \"18세 이후에 발병한 경우\").","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-tic-dx-2016","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2016 객23","type":"객","rep":4,"repyears":"2025 객12 · 2019 객23 · 2018 객23","stem":"7세 남아가 고개를 흔들고 눈알을 굴리는 증상으로 내원하였다. 이러한 증상은 5세부터 시작되었다고 한다. 진단은?","choices":["뚜렛 증후군","신체적 강박증","잠재적 틱장애","만성 운동성 틱장애","달리 분류되지 않는 틱장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 1교시): 틱장애 4분류 – 1년 미만이면 운동·음성 상관없이 잠정적(예전 \"일과성\"인데 가볍게 볼까 봐 이름을 바꿈), 1년 이상 운동틱만·음성틱만이면 지속성(만성) 운동/음성 틱장애, 여러 운동틱 + 음성틱(동시일 필요 없음, 경과 중 한 번이라도)이 1년 이상이면 뚜렛. 18세 넘어 시작하면(예: 군대) 드물고 다른 원인(헌팅턴 무도병 등)을 찾아야 해서 달리 명시된 틱장애. 부모는 음성틱을 놓치거나 \"몇 달 전 시작\"이라고 하지만 실제로는 대부분 1년 넘은 경우가 많다.\n\n📚 학습지 해설: DSM-5 틱장애는 뚜렛장애, 지속성 틱장애, 잠정적 틱장애, 달리 분류하는/분류할 수 없는 틱장애로 구별. 1년 이상이면 지속성 틱장애나 뚜렛, 경과 중 음성틱과 운동틱이 있었으면 뚜렛, 평생 한 종류만이면 지속성 운동/음성 틱장애, 1년 미만은 DSM-IV 일과성 → DSM-5 잠정적 틱장애. 해설: 음성틱 없이 고개 흔들기·눈알 굴리기, 18세 이전 발생, 1년 이상(5세부터) → ④ 지속성(만성) 운동성 틱장애. 복원자: \"이건 티야이니 꼭 알아두기 – 매년 뚜렛장애만 나오다가 이번엔 바꾸신 것 같다.\"","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-tic-tx-2014","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2014 객5","type":"객","rep":3,"repyears":"2015 객21 · 2012 객36","stem":"8세 남아가 1년 전부터 눈을 깜빡거리고 머리를 흔들더니, 1개월 전부터는 킁킁거리는 소리를 낸다. 적합한 치료제는?","choices":["클로자핀","리스페리돈","발프로에이트","클로나제팜","메틸페니데이트"],"ans":[2],"imgs":[],"vis":[],"notes":["2017 객23은 같은 증례에 정답 ⑤ Aripiprazole로 나왔으나 나머지 선지가 복원되지 않아 제외."],"basis":"🎓 올해 수업 기준: 교수님(10/22 1교시): 뚜렛은 보통 3–8세 시작, 8–12세 무렵 가장 심하고 75%는 성인 전 많이 줄어든다. 운동틱이 먼저, 몇 년 뒤 음성틱 / 단순틱이 먼저, 복합틱이 나중 / 위(눈)에서 아래로, 몸 중심에서 바깥으로. 수면 중 감소, 잠깐 참을 수 있어 학교에선 참고 집에서 많이 한다. 동반: ADHD 약 50%, 강박 30%(CSTC 회로 공유), 분노·충동조절 – 순수 틱보다 동반 문제가 더 심각한 경우가 많고, ADHD가 동반되면 예후가 나쁘다. 치료는 가족(부모) 교육이 가장 중요, 틱이 많다고 무조건 약을 쓰지 않고 괴로움·기능 손상이 있을 때 약물 – aripiprazole·risperidone(가장 많이 씀), haloperidol(효과 좋지만 부작용), clonidine. 행동치료는 습관역전(다른 근육으로 버티기)·노출 및 반응억제, 이완요법.\n\n📚 학습지 해설: 틱장애: 불수의적으로 갑자기 빠르게 반복적·불규칙하게 움직이는 근육의 상동적 움직임이나 발성, 리듬·목적 없음, 야단쳐도 고쳐지지 않고 의지로 조절되지 않음, 잠시 참을 수는 있지만 곧 더 늘어남, 대개 얼굴·목(특히 눈)에서 시작해 아래로 진행. 단순/복합 × 운동/음성 4가지 조합. 뚜렛: 유병률 4–5명/10,000, 운동틱 7세·음성틱 10–11세, 남아 3–4배, 도파민 등 원인, ADHD 40–50%·강박 40% 동반. 치료는 약물 + 행동치료 – 약물 haloperidol·pimozide·risperidone, 행동 habit reversal·exposure & response prevention. 오답: clozapine(2세대 항정신병), valproate(양극성 유지), clonazepam(BZD), methylphenidate(ADHD). 2017 객23은 같은 증례로 정답이 aripiprazole이었다.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-tic-tx-2015","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2015 객21","type":"객","rep":3,"repyears":"2014 객5 · 2012 객36","stem":"뚜렛병에 관한 여자아이증례였습니다.","choices":["정신치료가 일차적 치료이다.","SSRI이 효과적이다.","습관반전(Habit reversal)이 효과적이다.","강박장애시 BZD을 사용한다.","도파민성 약물은 상대적 금기이다."],"ans":[3],"imgs":[],"vis":[],"notes":["복원자: 증례 문장은 복원되지 않음."],"basis":"🎓 올해 수업 기준: 교수님(10/22 1교시): 뚜렛은 보통 3–8세 시작, 8–12세 무렵 가장 심하고 75%는 성인 전 많이 줄어든다. 운동틱이 먼저, 몇 년 뒤 음성틱 / 단순틱이 먼저, 복합틱이 나중 / 위(눈)에서 아래로, 몸 중심에서 바깥으로. 수면 중 감소, 잠깐 참을 수 있어 학교에선 참고 집에서 많이 한다. 동반: ADHD 약 50%, 강박 30%(CSTC 회로 공유), 분노·충동조절 – 순수 틱보다 동반 문제가 더 심각한 경우가 많고, ADHD가 동반되면 예후가 나쁘다. 치료는 가족(부모) 교육이 가장 중요, 틱이 많다고 무조건 약을 쓰지 않고 괴로움·기능 손상이 있을 때 약물 – aripiprazole·risperidone(가장 많이 씀), haloperidol(효과 좋지만 부작용), clonidine. 행동치료는 습관역전(다른 근육으로 버티기)·노출 및 반응억제, 이완요법.\n\n📚 학습지 해설: ① 틱 증상에 대한 가족 교육이 우선적이며 필수적이다 ② 기능 장애가 없으면 뚜렛병·만성 틱장애에서도 약물치료는 추천되지 않는다 ③ 습관반전이 효과적이라고 교수님께서 말씀하셨고 티야마 ④ 강박장애 동반 시 SSRI를 사용 ⑤ 강의록에 금기인 약물은 없다 → 정답 ③.","exps":[],"ai":"","fl":{}},{"k":"psy-y-nd-tic-tx-2012","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 3 (운동장애·틱장애)","meta":"근거: 학습지 「신경발달장애」 76–100쪽","year":"2012 객36","ty "vis":[],"notes":[],"basis":"강의록 6 13쪽: 청소년기 발병 시 동반된 정신과적 문제가 많아 예후가 나쁘다. 1/2에서 만성 경과, 성인기 광장공포증을 동반한 공황장애나 우울증으로 발전할 수 있다.","exps":["관계있다.","1/2은 만성이다.","반대다.","정답.","발전할 수 있다."],"ai":"","fl":{}},{"k":"psy-c4-06","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 6_불안장애 2」 15–16쪽 · STT 10/22 2교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"발달 단계별 정상 공포의 연결로 옳지 않은 것은?","choices":["청소년기 – 부정적 평가와 거절에 대한 두려움","영아기 – 큰 소리, 깜짝 놀람, 낯선 사람","걸음마기 – 상상 속 존재, 어둠, 분리","학령기 – 죽음·질병 (죽음의 불가역성 개념이 생김)","청소년기 – 정상 공포가 늘고 불안장애는 줄어든다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6 15–16쪽·교수님: 6–10개월 낯가림·분리불안은 정상. 만 9세쯤 죽음이 영원한 이별·되돌릴 수 없다는 개념이 생기며 죽음·질병을 무서워함. 청소년기에는 다른 사람의 평가가 중요해져 사회불안이 초등 고학년·청소년기에 시작 – 정상 공포는 줄고 불안장애가 증가.","exps":["옳다.","옳다.","옳다.","옳다.","정답. 반대다."],"ai":"","fl":{}},{"k":"psy-c4-07","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 6_불안장애 2」 18쪽 · STT 10/22 2교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"사회불안장애 환자가 발표할 때 핵심적으로 두려워하는 것으로 교수님이 설명한 것은?","choices":["남들 앞에서 창피를 당하는 것","애착 대상인 가족과의 분리","미래에 일어날 막연한 일들","시험 점수가 떨어지는 것","준비한 발표 내용을 잊어버리는 것"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6 18쪽·교수님: 사회불안(시선·응시 공포)이 심한 사람은 \"발표를 잘할까\"가 아니라 \"창피를 안 당할까\"가 핵심. 저 사람이 웃으면 나 때문인가(관계사고). 남 앞에서 말하기·쓰기·먹기, 옆에 사람이 있으면 소변이 안 나오는 것도 사회불안. 범불안장애의 시험 불안과는 다르다.","exps":["정답.","분리불안이다.","범불안장애다.","범불안장애의 시험 불안이다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-c4-08","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 6_불안장애 2」 20쪽 · STT 10/22 2교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"개를 무서워하는 아이에게 강아지 그림 → 장난감 개 → 새끼 강아지 → 큰 개 순으로 노출하는 치료와 그에 대한 설명으로 옳은 것은?","choices":["습관역전 – 경쟁 반응으로 틱을 대체한다","홍수법 – 소아에서 1차로 권장","정신분석 – 무의식 갈등을 해석한다","점진적 노출 – 소아에서는 홍수법보다 선호","혐오요법 – 공포 대상과 불쾌 자극을 짝짓는다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6 20쪽·교수님: 불안은 버틸수록 둔감해진다(habituation). 고소공포증 환자를 바로 옥상에 데려가면 홍수요법, 1층부터 올라가며 주차장 차를 세게 하면 점진적 노출. 성인은 둘 다 쓰지만 소아는 너무 무서워해 한 방에 노출시키는 홍수법은 잘 쓰지 않는다. 가상현실 치료가 기대되는 분야.","exps":["해당 없다.","소아에선 잘 쓰지 않는다.","해당 없다.","정답.","해당 없다."],"ai":"","fl":{}},{"k":"psy-c4-09","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 6_불안장애 2」 22–26쪽 · STT 10/22 2교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"선택적 함구증에 대한 설명으로 옳은 것은?","choices":["10세가 넘어도 대부분 저절로 좋아진다","말하는 능력 자체가 발달하지 않았다","사회불안장애와 연관이 높고 여아에 많다","집에서도 가족과 전혀 말하지 않는다","몸짓 등 비언어적 소통도 불가능하다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6 23–26쪽·교수님: 적절한 언어 능력이 있지만 특정 상황(밖·학교)에서 말을 안 함 – 집에서는 오히려 떼쓰고 짜증. 사회불안과 연관성이 많고 여아>남아, 유치원·초등 저학년 발병, 말이 늦은 경우가 많다. 외상(어린이집 학대) 후 갑자기 생기기도. 비언어적 소통은 가능. 10세까지 좋아지지 않으면 장기화·예후 불량.","exps":["10세까지 안 좋아지면 장기화.","능력은 있다.","정답.","집에서는 말한다.","가능하다."],"ai":"","fl":{}},{"k":"psy-c4-10","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 6_불안장애 2」 28–31쪽 · STT 10/22 2교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"소아 범불안장애(과잉불안장애)에 대한 설명으로 옳은 것은?","choices":["1차 치료는 항정신병약물 투여다","학령전기 유아에게서 가장 흔하다","초등 고학년에 흔하고 1차 치료는 정신치료다","공부를 못하는 아이에게서만 생긴다","주로 하류층 가정에서 흔하다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6 28–31쪽·교수님: 피아제 인지발달상 구체적 조작기→형식적 조작기로 넘어가며 보이지 않는 미래를 상상·가설할 수 있게 되자 근심 걱정이 많아진다 – 초등 고학년, 공부 잘하는 아이, 성취욕 강한 가족의 첫아이·상류층. 시험 불안. 1차 치료는 정신치료(상담), 그 외 가족·인지·약물(SSRI·SNRI).","exps":["정신치료가 1차다.","초등 고학년이다.","정답.","모범생에게도 많다.","상류층에 많다."],"ai":"","fl":{}},{"k":"psy-c4-11","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 6_불안장애 2」 32–33쪽 · STT 10/22 2교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"중1 여학생: 밖에서는 말이 없고 집에서는 곧잘 말함 / 새 학년·캠프 때 집을 떠나기 힘들어함 / 책 읽기를 시키자 얼굴이 달아오르고 목소리가 안 나와 이후 발표가 두려움. 교수님이 이 증례에서 짚은 진단 조합은?","choices":["선택적 함구증, 분리불안장애, 사회불안장애","ADHD, 틱장애, 학습장애","자폐, 지적장애, 언어장애","우울장애, 품행장애, 반항장애","조현병, 강박장애, 공황장애"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6 32–33쪽(주관식 문제)·교수님: 밖에서 말 안 하고 집에서 잘함 → 선택적 함구증, 캠프·새 친구 못 감 → 분리불안, 수업 중 낭독에 얼굴이 달아오름 → 사회불안. 외모를 창피해하는 것은 강박관련장애의 신체이형장애도 생각해볼 수 있다. 불안한 아이는 다른 불안을 동반할 가능성이 높다.","exps":["정답.","해당 없다.","해당 없다.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-c4-12","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 7_우울장애 2」 4–6쪽 · STT 10/22 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"소아청소년 우울증의 특징으로 옳은 것은?","choices":["진단 기준이 성인과 다르다","성적 변화는 거의 없다","자해와는 관련이 없다","우울감보다 짜증·분노·신체 증상·행동 문제로 많이 나타난다(가면 우울증)","남아는 주로 신체 증상, 여아는 주로 행동 문제로 나타난다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7 4–6쪽·교수님: 소아청소년의 약 5%가 경험. 진단 기준은 성인과 동일하지만 짜증·분노·신체 이상으로 많이 오고, 우울해 보이지 않는 가면 우울증이 많다(남아는 문제 행동, 여아는 신체 증상). 갑작스러운 성적 저하, 반항, 기분 변화, 식사·수면 변화, 비행 청소년과 어울림, 술·담배 시작 시 의심. 자해·자살사고 아이의 상당수에 우울증이 깔려 있다.","exps":["동일하다.","갑자기 떨어진다.","상당수에 깔려 있다.","정답.","반대로 설명했다."],"ai":"","fl":{}},{"k":"psy-c4-13","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 7_우울장애 2」 8–10쪽 · STT 10/22 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"친구에게 놀자고 했다가 거절당한 아이가 \"아이들은 다 나를 싫어해\"라고 생각할 때, 인지치료에서 하는 것은?","choices":["\"정말 그런가?\" 대안적 사고를 찾게 한다","부모의 양육 태도를 원인으로 지적한다","그 생각이 맞다고 그대로 인정해 준다","생각은 다루지 않고 약물만 증량한다","다른 친구를 사귀라고 바로 지시한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7 8–10쪽·교수님: 우울증 환자는 단서 하나를 극단적·자기 탓으로 해석한다(잘못된 귀인). \"그 친구가 거절했다고 나를 싫어하는 건 아니다, 다른 약속이 있을 수 있다\" 식으로 brainstorming해 대안적 사고를 연습. 행동적 기법은 활동 계획·과제 등 활동을 늘리는 것. IPT, 부모교육, 사회기술훈련도 쓴다.","exps":["정답.","해당 없다.","해당 없다.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-c4-14","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 7_우울장애 2」 11쪽 · STT 10/22 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"소아청소년 우울증 약물치료에 대한 설명으로 옳은 것은?","choices":["어떤 약을 써도 심전도는 볼 필요가 없다","삼환계 항우울제(TCA)가 지금도 1차 약이다","소아는 성인보다 약물 반응이 더 좋다","TCA는 심장독성·효과 부족으로 퇴출되고 SSRI를 쓴다","bupropion은 세로토닌 재흡수만 차단한다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7 11–12쪽·교수님: TCA는 소아에서 심장에 더 취약해 심전도(QT interval)를 보며 썼고 효과도 별로라 거의 퇴출(imipramine은 야뇨증·불안에 가끔). 지금은 SSRI, SNRI, NDRI(bupropion – NE·도파민, 금연약으로도 약 30% 효과). 약물 반응은 성인보다 낮은 편.","exps":["TCA는 심전도를 봤다.","퇴출됐다.","낮은 편이다.","정답.","NE·도파민이다."],"ai":"","fl":{}},{"k":"psy-c4-15","area":"탈야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 7_우울장애 2」 12쪽 · STT 10/22 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"소아청소년 우울증의 경과·예후로 강의록에 제시된 것은?","choices":["자살·약물남용과는 관련이 없다","불안·행동장애 등 공존질환은 드물다","재발이 성인보다 드문 편이다","재발이 흔하고(5년 내 70%) 성인기로 이어진다","약물 반응이 성인보다 높은 편이다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7 12쪽: 일반적으로 성인보다 예후 불량(?), 약물 반응이 성인보다 낮고, 공존질환(불안·행동장애)이 흔하며, 재발 가능성이 높다(20–60%가 1–2년, 70%가 5년 내). 행실장애·성격장애·약물남용·자살·비만·사회부적응. 교수님: 환경을 잘 만들어 주면(부모 싸움에서 분리 등) 도움이 될 수 있다.","exps":["관련 있다.","흔하다.","더 흔하다.","정답.","낮다."],"ai":"","fl":{}},{"k":"psy-c4-16","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 7_우울장애 2」 13–15쪽 · STT 10/22 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"파괴적 기분조절부전장애(DMDD)에 대한 설명으로 옳은 것은?","choices":["분노 발작이 한 달에 한 번이면 된다","DSM-5에서 양극성장애에 속한다","청소년기 이후 주로 양극성장애로 간다","지속적 짜증과 분노 폭발, 10세 이전 시작","기분 증상이 삽화적으로 나타난다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7 13–15쪽·교수님: 평소 계속 짜증 내다가 한 번씩 폭발하는 아이들 – 커서 양극성보다 우울·불안장애로 가는 경우가 많아 우울장애에 포함. 소아 양극성 과잉진단·비정형 항정신병약물/기분안정제 남용을 막기 위해 DSM-5에서 도입. 주 3회 이상, 1년 이상, 2개 이상 장면.","exps":["주 3회 이상이다.","우울장애에 속한다.","우울·불안으로 많이 간다.","정답.","비삽화적이다."],"ai":"","fl":{}},{"k":"psy-c4-17","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 7_우울장애 2」 18쪽 · STT 10/22 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"청소년 자살의 특징으로 교수님이 강조한 것은?","choices":["우울증과는 거의 무관하다","10대 사망원인 중 하위권이다","충동적이고 동반·모방자살이 흔하다","성인보다 예측하기가 쉽다","대부분 오랜 계획 끝에 실행한다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7 18쪽·교수님: 가장 큰 차이는 충동적 – 한 번 야단맞고 바로 자살하기도. 동반자살·모방·유행자살(Werther), SNS에 자해 사진을 올리며 퍼진다. 지금 10–40대 사망원인 1위가 자살(노인은 자살률은 가장 높지만 질병 사망이 많아 1위가 아님).","exps":["상당수에 우울이 깔려 있다.","1위다.","정답.","어렵다.","충동적이다."],"ai":"","fl":{}},{"k":"psy-c4-18","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 7_우울장애 2」 19–21쪽 · STT 10/22 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"자살 이야기를 자주 하는 청소년에 대한 대처로 교수님이 설명한 것은?","choices":["화가 나면 \"죽어라\"라고 말해도 괜찮다","물어보면 자살을 부추기므로 절대 묻지 않는다","비밀을 지켜 주고 아무에게도 알리지 않는다","생각·계획·시도를 구체적으로 묻고 필요하면 입원","\"맨날 저래도 안 죽는다\"며 무시한다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7 19–21쪽·교수님: 자살 이야기는 도와달라는 신호 – 자주 할수록 생각이 많은 것. 물어본다고 일이 벌어지지 않고 아이는 물어봐 주기를 기대하기도. \"차라리 죽는 게 낫겠다\"인지 \"죽고 싶다\"인지, 구체적 계획(언제·어디서·어떻게)을 묻는다. 최근 3–6개월 내 시도가 가장 큰 위험인자 – 입원. 학교와의 협력·비상연락망. 자해 자체로 입원하진 않는다.","exps":["삼가야 한다.","묻는 게 맞다.","비상연락망이 필요하다.","정답.","도움 신호다."],"ai":"","fl":{}},{"k":"psy-c4-19","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 7_우울장애 2」 22–27쪽 · STT 10/22 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"행실(품행)장애에 대한 설명으로 옳은 것은?","choices":["지금도 소아 정신과 입원의 가장 흔한 이유다","보호자 동의만 있으면 언제든 강제 입원 가능하다","ADHD 동반은 예후와 관계없다","냉담-무정서 아형을 따로 두며 예후가 나쁘다","상담자는 문제행동을 인정해 주어야 한다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7 22–27쪽·교수님: 규칙 위반→거짓말·도둑질→파괴→공격으로 점점 세짐. 과거엔 입원의 가장 큰 이유였지만 지금은 자해 아이가 제일 많고, 정신건강복지법상 타해 우려가 높을 때만 강제 입원. 사이코패스·반사회성으로 갈 아이를 구별하려 냉담-무정서(callous-unemotional) 아형을 둠. 일찍 발병·공격적일수록 예후 불량, ADHD 동반 시 불량하나 치료로 개선 가능. 중립적 입장(인정도 비난도 X), warm & firm approach.","exps":["지금은 자해 아이가 가장 많다.","타해 우려 시에만 가능.","동반 시 예후 불량.","정답.","인정도 비난도 하지 않는다."],"ai":"","fl":{}},{"k":"psy-c4-20","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 7_우울장애 2」 29–36쪽 · STT 10/22 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"적대적 반항장애(ODD) 아이에 대한 교수님 설명으로 옳은 것은?","choices":["ADHD 아이와는 동반 관계가 거의 없다","부모가 기분에 따라 다르게 대하는 것이 도움이 된다","부모나 교사가 아니라 또래에게만 반항한다","남에게 심각한 피해를 주는 것이 핵심 증상이다","권위자에게 반항하며, 일관된 규칙과 분노조절 훈련이 중요"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7 29–36쪽·교수님: 품행장애는 남에게 피해를 주지만 ODD는 주지 않는다 – authority figure와 계속 트러블. ADHD 아이의 절반이 해당. 엄마 기분에 따라, 엄마·아빠가 다르게 대하면 혼란 – 일관성. 화가 날 때 몸의 반응을 일찍 캐치(분노 온도계·화산), 빨강 멈춰/노랑 생각해봐/초록 계속해 곰돌이. 진단은 4개 이상.","exps":["ADHD의 절반이 해당.","일관성이 중요하다.","권위자에게 주로 한다.","품행장애 설명이다.","정답."],"ai":"","fl":{}},{"k":"psy-c4-21","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 7_우울장애 2」 38쪽 · STT 10/22 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"야경증(night terror)에 대한 설명으로 옳은 것은?","choices":["대부분 성인기까지 그대로 지속된다","아침에 무서운 꿈 내용을 자세히 말한다","NREM 깊은 수면(전반부)에 깨며 기억하지 못한다","주로 REM 수면인 수면 후반부에 생긴다","반드시 항정신병약물 치료가 필요하다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7 38쪽·교수님: 악몽은 REM(수면 후반부)이라 기억하고 달래면 됨. 야경증은 NREM 3–4단계(전반부)에 비명·땀·자율신경 항진, 혼란스러운 상태로 기억 못함. 수면보행증도 전반부 – 안 좋아지면 뇌파로 뇌전증 감별. 대부분 자라면서 좋아진다.","exps":["자라면서 좋아진다.","기억하지 못한다.","정답.","악몽 설명이다.","대개 필요 없다."],"ai":"","fl":{}},{"k":"psy-c4-22","area":"티야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 7_우울장애 2」 39–40쪽 · STT 10/22 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"유뇨증·유분증에 대한 설명으로 옳지 않은 것은?","choices":["잘 가리던 아이가 다시 못 가리면 동생 출생·입학·입원·이사 같은 스트레스를 찾는다","유뇨증 행동치료로 잠들기 직전에 물을 충분히 마시게 한다","유분증은 변비로 인한 overflow 타입이 약 70%라 먼저 장을 비운다","유뇨증 약물로 desmopressin·imipramine을 쓴다","유뇨증은 만 5세가 넘어도 소변을 못 가릴 때 진단한다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7 39–40쪽·교수님: 유뇨증 – 5세 이후, 남아 많음, 유전·CNS 미숙·깊은 수면(못 깨서 봐 버림). 행동요법: 자기 전 3시간은 먹지 않고, 자다가 한두 시간 뒤 깨워 소변, 잘 가리면 스티커. 이차성이면 스트레스 탐색. 약물: 항이뇨호르몬(desmopressin), imipramine. 유분증 – 4세 이후, overflow 70% → 장 비우기 후 식이·행동요법.","exps":["옳다.","정답. 3시간 전부터 먹지 않는다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-c4-23","area":"탈야","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 강의록 「2023 정신의학 7_우울장애 2」 42–43쪽 · STT 10/22 3교시(박태원)","year":"","type":"객","rep":1,"repyears":"","stem":"학습장애에 대한 설명으로 옳은 것은?","choices":["여럿이 함께하는 학원 수업이 가장 효과적이다","교육을 충분히 받지 못한 것이 주원인이다","정상 지능인데 1.5–2년 이상 뒤처지며 ADHD와 흔히 동반","지능지수가 70 미만인 아이에게 진단한다","읽기·쓰기·산수 장애는 서로 동반되지 않는다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7 42–43쪽·교수님: 정상 지능, 우울·불안 등 정서 문제 없이 제대로 교육해도 읽기·쓰기·산수가 1.5–2년 이상 지연 – 타고나는 면이 많다. 세 가지는 서로 동반되고 ADHD 아이의 약 30%가 동반. 치료는 아이 수준에 맞춘 1:1 교정교육(학원은 아이보다 높은 수준을 가르쳐 어렵다).","exps":["1:1 교정교육이다.","타고나는 면이 많다.","정답.","정상 지능이다.","서로 동반된다."],"ai":"","fl":{}},{"k":"psy-y-c4-sad-2025","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 학습지 「소아청소년 정신의학」 113–144쪽(새 학습지)","year":"2025 객11","type":"객","rep":4,"repyears":"2023 객30 · 2019 객22 · 2018 객22","stem":"초등학교 3학년 아동이 3개월전부터 평일아침마다 배가 아픈 증상으로 소아과에서 의뢰되었다. 아이는 가족과 떨어지길 싫어하여 캠핑을 가본 적이 없었다. 학교에서 가끔식 집으로 와 어머니가 무사한지 확인하였다. 환자의 진단과 가까운것은?","choices":["우울장애","불안장애","반항장애","품행장애","주의력결핍 과잉행동장애"],"ans":[2],"imgs":[],"vis":[],"notes":["23·19·18년은 진단명(분리불안장애), 22년은 치료법으로 출제(복원자)."],"basis":"🎓 올해 수업 기준: 교수님(10/22 2교시): 분리불안장애는 소아 불안장애 중 가장 흔하다 – 엄마가 살아있는지 쉬는 시간마다 확인(요즘은 휴대폰), 초1에 학교를 안 가려 하고, 감정 표현 대신 아침마다 머리·배가 아프다가 학교에 가면 괜찮아진다, 분리 주제의 악몽. 18세 이전 발병 조건은 없어져 성인도 진단할 수 있다. 엄마도 아이와 떨어지기 힘들어하는 경우가 30% – 엄마도 같이 치료, 때로 분리 연습을 위해 입원. 치료는 행동치료·놀이치료(노출하고 버티면 둔감해지는 원리).\n\n📚 학습지 해설: 박태원 교수님 불안장애 강의록 p.9. 야마에서 자주 출제되는 문항으로 23·19·18년에는 분리불안장애라는 진단명을 고르는 문제로, 22년에는 가장 적절한 치료법을 고르는 문제로 출제. 야마는 많이 타되 물어보는 것이나 선지가 간혹 바뀌니 파라야마로 공부하면 쉽게 풀 수 있다. 이 해는 큰 범주를 물어 ② 불안장애.","exps":[],"ai":"","fl":{}},{"k":"psy-y-c4-sad-2023","area":"야마","prof":"박태원","sec":"10/22 · 소아청소년 4 (불안·우울)","meta":"근거: 학습지 「소아청소년 정신의학」 113–144쪽(새 학습지)","year":"2023 객30","type":"객","rep":4,"repyears":"2025 객11 · 2019 객22 · 2018 객22","stem":"초등학교 5학년 남자아이가 소아청소년과에 내원하였다. 평일아침마다 배가 아프다고 하였고 학교에 가면 괜찮아진다고 한다. 학교에 있을 때 할머니가 걱정되어 쉬는 시간마다 할머니께 전화를 하고 가족과 떨어지는 것을 싫어해 수련회와 캠프도 가지 않으려고 한다고 한다. 가장 가능성 높은 진단은?","choices":["범불안장애","사회불안장애","분리불안장애","외상후 스트레스장애","주의력결핍과잉행동장애"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 교수님(10/22 2교시): 분리불안장애는 소아 불안장애 중 가장 흔하다 – 엄마가 살아있는지 쉬는 시간마다 확인(요즘은 휴대폰), 초1에 학교를 안 가려 하고, 감정 표현 대신 아침마다 머리·배가 아프다가 학교에 가면 괜
