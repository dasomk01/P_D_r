<title>정신의학 문풀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* layout: 상단 고정 필터 묶음 + 한 문제씩 넘기는 카드 한 장 */
:root{
  --bg:#f3f4f8;--card:#ffffff;--fg:#1d2030;--mute:#6b6f85;--line:#d9dbe6;
  --accent:#3550c0;--accent-fg:#ffffff;--accent-soft:#e8ecfb;
  --ok:#23824a;--ok-soft:#e5f4ea;--bad:#c23a32;--bad-soft:#fbeae8;--warn:#8a6400;--warn-soft:#fff4d6;
  --chip:#ebedf3;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161e;--card:#1d2029;--fg:#e8e9f0;--mute:#9a9db0;--line:#333747;
  --accent:#7d93ff;--accent-fg:#0f1220;--accent-soft:#252d4d;
  --ok:#5fcf8a;--ok-soft:#18321f;--bad:#ff7d73;--bad-soft:#3a1d1b;--warn:#f2c552;--warn-soft:#3a3016;--chip:#272a36;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161e;--card:#1d2029;--fg:#e8e9f0;--mute:#9a9db0;--line:#333747;
  --accent:#7d93ff;--accent-fg:#0f1220;--accent-soft:#252d4d;
  --ok:#5fcf8a;--ok-soft:#18321f;--bad:#ff7d73;--bad-soft:#3a1d1b;--warn:#f2c552;--warn-soft:#3a3016;--chip:#272a36;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
h1{font-size:26px;line-height:1.25;margin:4px 0 10px;font-weight:700;letter-spacing:-.01em}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--mute);font-size:14.5px}
.stats b{color:var(--fg);font-family:var(--f-num);font-weight:500;margin-left:4px}
.sync{text-align:right;color:var(--mute);font-size:13px;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input[type=search],textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px}
select,input[type=search]{width:100%;min-width:0;padding:10px 12px;font-size:15px}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip,.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 16px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{border-radius:12px;padding:9px 14px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.navbar{display:flex;align-items:center;gap:8px}
.navbar .pos{flex:1;font-family:var(--f-num);color:var(--mute);font-size:15px;min-width:0}
.navbar .pos b{color:var(--fg);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;color:var(--mute);font-size:14px}
.pill{background:var(--chip);color:var(--fg);border-radius:8px;padding:2px 9px;font-size:13px;font-weight:600}
.pill.area{background:var(--accent-soft);color:var(--accent)}
.pill.king{background:var(--warn-soft);color:var(--warn)}
.meta{color:var(--accent);font-size:14px;margin-top:8px;font-weight:500}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:7px 11px;font-size:13.5px;margin-top:8px}
.note.oos{background:var(--chip);color:var(--mute)}
.stem{font-size:17px;margin:14px 0 12px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.imgs img{display:block;max-width:100%;height:auto;margin:8px auto;border-radius:8px;border:1px solid var(--line)}
.vis{background:var(--chip);border-radius:10px;padding:8px 11px;font-size:14px;white-space:pre-wrap;margin-bottom:8px}
.choices{display:grid;gap:10px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;word-break:keep-all;overflow-wrap:anywhere}
.ch .no{font-family:var(--f-num);color:var(--mute);font-size:14px;flex:none;width:18px;padding-top:2px}
.ch span:last-child{min-width:0}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ch.mine{box-shadow:inset 0 0 0 1px currentColor}
.done .ch{cursor:default}
.result{margin-top:14px;font-weight:700;font-size:16px}
.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}
.exp{margin-top:8px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.exp h3{font-size:13px;color:var(--mute);margin:14px 0 4px;font-weight:600;letter-spacing:.02em}
.exp ol{margin:0;padding-left:22px;white-space:normal}
.exp li{margin:3px 0}
.ai{background:var(--accent-soft);border-radius:10px;padding:8px 11px;font-size:14px;margin-top:10px;white-space:pre-wrap}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.acts .chip{font-size:14px;padding:6px 13px}
.memo{margin-top:14px}
.memo label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:600}
.memo textarea{width:100%;min-height:84px;padding:10px 12px;font-size:15px;resize:vertical}
.memo .saved{font-size:12px;color:var(--mute);min-height:1em}
.bottomnav{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.sheet{position:fixed;inset:0;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.sheet[hidden]{display:none}
.sheet .box{background:var(--bg);width:100%;max-width:760px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{font-size:18px;margin:0 0 8px}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);padding:9px 2px;cursor:pointer;display:flex;gap:10px}
.list li.cur{background:var(--accent-soft)}
.list .n{font-family:var(--f-num);color:var(--mute);font-size:13px;width:44px;flex:none;padding-top:2px}
.list .t{min-width:0;font-size:14.5px}
.list .s{font-size:12.5px;color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.sheet textarea{width:100%;height:160px;font:12px/1.4 var(--f-num);padding:8px}
.msg{font-size:13px;color:var(--ok);min-height:1.2em;margin:6px 0}
@media (max-width:420px){h1{font-size:23px}.stem{font-size:16.5px}}
@media (prefers-reduced-motion:no-preference){.ch{transition:background .15s,border-color .15s}}
</style>

  <div class="tools">
    <button class="btn" id="bSync">기록 새로고침</button><button class="btn" id="bBak">기록 백업</button><button class="btn" id="bRes">백업 불러오기</button><button class="btn" id="bExp">오답·헷갈림·메모 내보내기</button>
  </div>
  <hr class="sep">
  <div class="navbar">
    <button class="btn" id="prev">이전</button><div class="pos" id="pos"></div><button class="btn" id="bList">목록</button><button class="btn pri" id="next">다음</button>
  </div>
  <div id="view"></div>
</div>

<script id="data" type="application/json">[{"k":"psy-intro-01","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 3쪽(DSM-5 정의) · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5의 정신장애(mental disorder) 정의에 비추어 볼 때, 정신장애로 보지 않는 것은?","choices":["사랑하는 사람이 죽은 뒤 문화적으로 예상되는 정도의 슬픔 반응","사회적·직업적 활동에 현저한 고통이나 장애를 동반하는 증후군","개인 내부의 기능 이상에서 비롯된 사회적 일탈 행동","인지·정서 조절·행동에 임상적으로 유의한 장해가 있는 증후군","심리적·생물학적 발달 과정의 기능 이상을 반영하는 행동 장해"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"DSM-5 정의: 흔한 스트레스나 상실(예: 사랑하는 사람의 죽음)에 대한 예상 가능하거나 문화적으로 용인되는 반응은 정신장애가 아니다. 사회적 일탈(정치·종교·성)이나 개인과 사회의 갈등도 개인 내부의 기능 이상에서 온 것이 아니면 정신장애가 아니다.","exps":["정답. 예상 가능한 애도 반응은 정신장애에서 제외된다.","정신장애는 보통 의미 있는 고통이나 장애(distress or disability)를 동반한다.","일탈 자체는 장애가 아니지만, 개인의 기능 이상에서 비롯되면 정신장애가 될 수 있다.","정의의 핵심 문장 그대로다(cognition, emotion regulation, behavior).","정의에 들어 있는 \"psychological, biological, developmental processes의 기능 이상\"이다."],"ai":"","fl":{}},{"k":"psy-intro-02","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 조현병과 자폐 진단명에 \"스펙트럼(spectrum)\"이라는 말을 붙인 이유로 가장 알맞은 것은?","choices":["같은 범주 안에서도 양상과 정도가 다양하게 나타나기 때문","약물 반응이 모든 환자에게 같기 때문","원인 유전자가 하나로 밝혀졌기 때문","진단에 뇌영상 검사가 필수가 되었기 때문","소아에게만 진단하도록 범위를 좁히기 위해"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"교수님 설명: 빛이 파장에 따라 여러 색으로 나뉘듯, 하나의 영역 안에서도 다양한 양상과 정도 차이를 보이므로 \"스펙트럼\"을 붙였다. 조현병도 DSM-5에 와서야 \"조현 스펙트럼 및 기타 정신병적 장애\"가 되었다.","exps":["정답.","약물 반응은 개인차가 크다.","원인 유전자가 하나로 밝혀진 정신장애는 없다(조현병도 polygenic).","정신과 진단은 여전히 기술적(descriptive) 진단 기준에 따른다.","연령 제한과는 관계없다."],"ai":"","fl":{}},{"k":"psy-intro-03","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 6쪽(목차) · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 분류에서 \"강박 및 관련 장애(Obsessive-Compulsive and Related Disorders)\"에 속하지 않는 것은?","choices":["선택적 함구증","발모광(trichotillomania)","피부뜯기장애(excoriation)","신체이형장애","저장장애"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"DSM-5에서 강박장애는 불안장애에서 분리되어 강박 및 관련 장애로 묶였고, 신체이형장애·저장장애·발모광·피부뜯기장애가 함께 들어간다. 선택적 함구증은 분리불안장애와 함께 불안장애에 속한다.","exps":["정답. 불안 때문에 밖에서 말을 하지 않는 것으로, 불안장애에 속한다.","머리카락 뽑기 → 강박 관련 장애.","상처·피부 뜯기 → 강박 관련 장애.","외모 결함에 대한 집착 → 강박 관련 장애(교수님: 선풍기 아줌마·성형 중독 예).","버리지 못하는 장애 → 강박 관련 장애(신문지를 쌓아 둔 선배 의사 예)."],"ai":"","fl":{}},{"k":"psy-intro-04","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시 · 강의록 「정신장애 소개」 6쪽","year":"","type":"객","rep":1,"repyears":"","stem":"7세 아이가 집에서는 가족과 말을 잘하는데 학교에만 가면 몇 달째 한마디도 하지 않는다. 청력·언어 발달은 정상이다. 교수님 설명에 따르면 이 증상의 바탕이 되는 것은?","choices":["사회적 상황에서의 불안","반항과 적대감","사고의 와해","환청에 대한 반응","지적 능력 저하"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"선택적 함구증(selective mutism): 집에서는 말을 잘하는 아이가 학교 등 밖에서는 입을 닫는다. 밖에서 사람을 상대할 때의 불안 때문이라고 보며, DSM-5에서 불안장애로 분류한다.","exps":["정답.","반항성 장애와 다르다. 말을 \"못 하는\" 불안 상태다.","와해된 사고는 정신병적 증상이며 장소에 따라 선택적으로 나타나지 않는다.","정신병적 증상의 근거가 없다.","언어 발달이 정상이고 집에서는 말을 잘한다."],"ai":"","fl":{}},{"k":"psy-intro-05","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"교통사고로 생명의 위협을 겪은 뒤 악몽·재경험·회피 증상이 나타났다. 증상이 시작된 지 2주가 지났을 때 붙일 수 있는 진단으로 교수님이 설명한 것은?","choices":["적응장애","해리성 정체성 장애","외상후 스트레스 장애","범불안장애","급성 스트레스 장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"교수님 설명: 트라우마(생명을 위협하는 수준의 스트레스) 뒤 증상이 시작된 지 한 달 미만이면 급성 스트레스 장애, 한 달이 넘어가면 PTSD.","exps":["적응장애는 생명을 위협하는 외상이 아닌 일반 스트레스 요인에 대한 반응이다.","정체성 변화가 없다.","한 달이 넘어야 PTSD로 본다.","외상 사건과 관련된 재경험·회피가 핵심이다.","정답. 한 달 미만이다."],"ai":"","fl":{}},{"k":"psy-intro-06","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시 · 강의록 「정신장애 소개」 7쪽","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 해리성 장애를 설명하면서 \"가장 많은 형태\"라고 한 것은?","choices":["전환장애","해리성 기억상실","꾀병","이인증/비현실감 장애","해리성 정체성 장애(다중인격)"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"해리성 장애는 기억이나 정체성이 왔다 갔다 하는 장애로, 일반인이 가장 많이 아는 것은 다중인격이지만 가장 많은 형태는 해리성 기억상실(특정 기억을 기억해 내지 못함)이라고 설명했다. 다중인격은 가장 심각한 형태.","exps":["전환장애는 신체증상 및 관련 장애에 속한다.","정답.","꾀병은 정신장애 진단이 아니다.","해리성 장애에 속하지만 교수님이 가장 흔하다고 한 것은 아니다.","가장 잘 알려졌고 가장 심각한 형태이지 가장 흔한 형태는 아니다."],"ai":"","fl":{}},{"k":"psy-intro-07","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"신경증(neurosis)과 인격장애를 비유한 교수님 설명으로 옳은 것은?","choices":["신경증은 \"구멍 난 스타킹\", 인격장애는 \"신발 속 돌멩이\"","신경증은 \"신발 속 돌멩이\", 인격장애는 \"구멍 난 스타킹\"","신경증은 남에게 피해를 주고, 인격장애는 본인만 괴롭다","둘 다 \"구멍 난 스타킹\"처럼 주변만 괴롭다","둘 다 \"신발 속 돌멩이\"처럼 본인만 괴롭다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"신경증(가벼운 불안장애 등)은 남에게는 보이지 않지만 본인이 괴로운 \"신발 속 돌멩이\", 인격장애는 본인은 불편함을 모르는데 주변 사람이 괴로운 \"구멍 난 스타킹\". 인격장애는 특정한 행동 패턴이 반복되는 것(예: 편집성 – 계속 의심).","exps":["반대로 짝지었다.","정답.","반대로 설명했다.","신경증은 본인이 괴롭다.","인격장애는 본인이 불편함을 잘 모른다."],"ai":"","fl":{}},{"k":"psy-intro-08","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 8·34쪽 · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 인격장애 군집 중 Cluster A(odd/eccentric)에 속하는 것으로만 묶인 것은?","choices":["편집성 · 조현성 · 조현형","회피성 · 의존성 · 강박성","반사회성 · 경계성 · 연극성","편집성 · 경계성 · 회피성","조현형 · 자기애성 · 의존성"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 34쪽 표: A군(odd/eccentric) 편집성(suspicious)·조현성(socially indifferent)·조현형(eccentric) / B군(erratic/impulsive) 반사회성·경계성(unstable)·연극성(attention seeking)·자기애성(self-centered) / C군(anxious/fearful) 회피성(inhibited)·의존성(submissive)·강박성(perfectionistic). 교수님: A군은 의심하거나 조현병과 관련된다는 의미의 인격장애.","exps":["정답.","C군이다.","B군이다.","세 군집이 섞였다.","세 군집이 섞였다."],"ai":"","fl":{}},{"k":"psy-intro-09","area":"탈야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 34쪽","year":"","type":"객","rep":1,"repyears":"","stem":"인격장애 유형과 그 구별 특징(discriminating feature)의 연결이 옳지 않은 것은?","choices":["의존성 – 완벽주의(perfectionistic)","연극성 – 관심 끌기(attention seeking)","조현성 – 사회적 무관심(socially indifferent)","회피성 – 억제(inhibited)","편집성 – 의심(suspicious)"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 34쪽 표 기준. 의존성은 순종(submissive), 완벽주의는 강박성 인격장애의 특징이다.","exps":["정답. 의존성은 submissive, 완벽주의는 강박성(OCPD).","옳다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-intro-10","area":"탈야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 8쪽 · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 목차에서 반사회성 인격장애가 인격장애 외에 함께 실려 있는 진단 범주는?","choices":["조현 스펙트럼 및 기타 정신병적 장애","외상 및 스트레스 관련 장애","해리장애","신경발달장애","파탄적·충동조절 및 품행 장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 8쪽 목차: Disruptive, Impulse-Control, and Conduct Disorders 안에 적대적 반항장애·간헐적 폭발장애·품행장애·반사회성 인격장애·방화광·병적 도벽이 있고, 반사회성 인격장애는 Cluster B 인격장애에도 들어 있다. 교수님: \"반사회성 인격장애는 여기도 들어요.\"","exps":["해당 없다.","해당 없다.","해당 없다.","해당 없다.","정답."],"ai":"","fl":{}},{"k":"psy-intro-11","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신과 진단의 특징에 대한 교수님 설명으로 가장 알맞은 것은?","choices":["원인 병원체를 찾아 그에 따라 진단명을 붙인다","혈액검사 수치를 기준으로 진단을 확정한다","심리검사 결과를 의사의 평가보다 우선한다","한 번의 면담 결과는 시간이 지나도 유지된다","환자 상태를 관찰·기술해 진단 기준에 맞춰 본다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"정신과 진단은 기계로 재는 것이 아니라, 진단 기준(예: ADHD는 9가지 중 6개 이상)을 만들어 두고 환자 상태를 잘 관찰·기술해 맞는지 본다. 심리검사는 보조 수단이며 시점·컨디션에 따라 달라진다.","exps":["원인이 아닌 기술(description)에 따른 진단이다.","고혈압·당뇨처럼 기계로 재는 진단과 다르다고 했다.","\"주객이 전도\"된 것이라며 심리검사는 보조라고 강조했다.","심리검사·상태는 시점에 따라 달라진다.","정답."],"ai":"","fl":{}},{"k":"psy-intro-12","area":"티야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 \"치료하지 않으면 약 20%가 사망할 수 있는 심각한 상태\"라고 강조한 장애는?","choices":["신경성 폭식증","반추장애(되새김)","이식증(pica)","신경성 식욕부진증","폭식장애(binge eating)"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"거식증(신경성 식욕부진증): 계속 살이 쪘다고 생각하고 살찌면 불안해 체중을 줄이는 장애. 치료하지 않으면 20%가 사망할 수 있고(심장·감염), 간접적 자살 행위로 볼 수 있다고 했다. 부모가 치료를 거부하면 의료적 방임에 해당할 수 있다.","exps":["폭식 후 보상행동이 핵심이다.","음식을 되새김하는 장애.","먹을 수 없는 것을 먹는 장애(아이들이 아무거나 집어먹는 것).","정답.","보상행동 없는 폭식이다."],"ai":"","fl":{}},{"k":"psy-intro-13","area":"탈야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 5쪽 · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5 목차에서 우울장애(Depressive Disorders) 범주에 새로 들어간 소아 대상 진단은?","choices":["주의력결핍 과잉행동장애","반응성 애착장애","분리불안장애","적대적 반항장애","파탄적 기분조절곤란장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 5쪽 목차와 STT: 소아의 감정 조절 문제로 DMDD가 우울장애 안에 새로 추가되었다.","exps":["신경발달장애에 속한다.","외상 및 스트레스 관련 장애에 속한다.","불안장애에 속한다.","파탄적·충동조절 및 품행 장애에 속한다.","정답."],"ai":"","fl":{}},{"k":"psy-intro-14","area":"탈야","prof":"박태원","sec":"10/13 · 정신장애 소개 (DSM-5)","meta":"근거: 강의록 「정신장애 소개」 8쪽 · STT 10/13 1–2교시","year":"","type":"객","rep":1,"repyears":"","stem":"과거 \"성 정체성 장애(gender identity disorder)\"로 부르던 진단의 DSM-5 명칭은?","choices":["성 불편감","변태성욕장애","성 정체감 혼란증","신체이형장애","성기능부전"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"장애라고 부르면 안 된다는 관점에서, 타고난 성과 경험하는 성의 불일치에서 오는 불편감을 뜻하는 성 불편감(gender dysphoria)으로 바뀌었다.","exps":["정답.","해당 없다.","공식 진단명이 아니다.","외모 결함에 대한 집착이다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-iv-01","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 \"여전히 정신과 진단에서 가장 중요하다\"고 강조한 것과 그 이유가 바르게 짝지어진 것은?","choices":["뇌파 – 불안장애를 감별할 수 있어서","진찰·면담 평가 – 진단을 내릴 표준 검사법이 없어서","뇌 MRI – 조현병을 확진할 수 있어서","혈액검사 – 우울증 표지자가 확립되어서","심리검사 – 법원이 가장 신뢰해서"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"정신과는 진단을 내리는 표준 검사법이 현재 없으므로 진찰·면담 평가가 가장 중요하다. 피검사(특히 갑상선 검사) 등은 신체·기질적 원인을 배제하기 위한 것이지 정신과 진단을 내리기 위한 것이 아니다.","exps":["확진 검사가 아니다.","정답.","MRI 소견은 진단적이지 않다.","갑상선 검사 등은 배제 목적이다.","심리검사는 보조 수단이다."],"ai":"","fl":{}},{"k":"psy-iv-02","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 2·15쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"공격적일 위험이 있는 환자를 면담할 때 진찰실 배치로 옳은 것은?","choices":["의사는 환자보다 높은 의자에 앉아 권위를 보인다","출입문을 열어 두고 의사가 출입문 쪽에 앉는다","환자를 출입문 쪽에 앉혀 언제든 나갈 수 있게 한다","의사와 환자 사이에 큰 책상을 두어 거리를 둔다","단둘이 조용한 방에서 문을 닫고 면담한다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 위험한 환자 면담 배치 \"굉장히 중요\"\n\n강의록 2쪽·STT: 같은 높이 의자, 사이에 가구가 없는 편이 낫다. 위험한 환자는 출입문을 열어 놓고 의사가 출입문 쪽에 앉으며 도와줄 사람을 대기시킨다. 교수님은 실제 사건 뒤 진찰실 사이에 문이 생긴 일을 예로 들며 \"별거 아닌 것 같지만 굉장히 중요하다\"고 했다.","exps":["같은 높이 의자가 원칙이다.","정답.","의사의 대피로가 막힌다.","일반 면담에서는 가구가 없는 편이 낫다.","단독 면담은 안 되고 문을 열어 둔다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-03","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 2–3쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"첫 면담에서 질문하는 순서에 대한 설명으로 가장 알맞은 것은?","choices":["환자가 말을 시작하면 바로 끊고 핵심만 묻는다","가족 정보부터 들은 뒤 환자에게는 확인만 한다","거북한 주제는 환자가 먼저 꺼낼 때까지 묻지 않는다","처음부터 진단 기준 항목을 하나씩 폐쇄형으로 묻는다","처음에는 포괄적(개방형) 질문을 하고 점차 구체적 질문으로 들어간다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 포괄적 질문 → 적극적·지시적 질문, \"순서 중요\"\n\n처음은 포괄적 질문(open-ended)으로 시작해야 환자가 가장 중요하게 여기는 문제가 드러나고, 예민한 환자에게 공격적으로 느껴지지 않는다. 정보 제공이 잘 안 되면 적극적·지시적으로 묻는다. 교수님: \"케이스마다 다르지만 순서는 변하지 않는다.\"","exps":["3–4분은 혼자 이야기하게 허용한다.","환자 면담이 중심이다.","거북한 주제도 반드시 다뤄야 한다.","폐쇄형만 쓰면 심문처럼 느껴지고 중요한 문제를 놓칠 수 있다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-04","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"매우 불안하고 혼란스러우며 초조한 환자를 면담할 때 교수님이 권한 질문 방식은?","choices":["침묵을 오래 유지하며 기다리기","추상적 사고를 묻는 속담 질문","가족 없이 다른 날 다시 면담","구체적이면서 간단하고 직접적인 질문","길고 포괄적인 개방형 질문"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"불안·혼란·초조가 심하면 포괄적 질문이 오히려 환자를 힘들게 한다. 구체적이고 간단하며 직접적인 질문을 받으면 정신을 차리고 대답할 수 있다(보호병동이 오히려 편한 환자가 있는 것과 같은 원리).","exps":["혼란을 키울 수 있다.","상황에 맞지 않다.","면담 방식의 문제다.","정답.","이 상태에서는 오히려 부담이 된다."],"ai":"","fl":{}},{"k":"psy-iv-05","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 3쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"면담 초반 환자가 3–4분 동안 혼자 이야기하도록 허용하는 주된 목적은?","choices":["면담 시간을 줄이기 위해","정보 제공자 면담을 대신하기 위해","진단명을 빨리 알려 주기 위해","사고 진행의 논리성을 확인하기 위해","환자의 기억력을 검사하기 위해"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 3–4분 혼자 이야기하게 두면 진단이 저절로 서기도 함\n\n강의록 3쪽: \"3–4분 혼자 이야기할 수 있도록 허용: 사고진행의 논리성 확인.\" 교수님: 끼어들고 싶어도 참고 따라가면 진단이 저절로 되는 경우도 있다(말의 속도·연속성·논리성 평가).","exps":["목적이 아니다.","정보 제공자 면담은 별도로 중요하다.","목적이 아니다.","정답.","기억력 검사는 따로 한다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-06","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 3·15쪽 · STT 10/13 3교시 · STT 10/13 병식·다축진단·치료계획","year":"","type":"객","rep":1,"repyears":"","stem":"면담에서 \"거북한 주제\"에 대한 설명으로 옳지 않은 것은?","choices":["자살 생각은 환자를 자극할 수 있으므로 묻지 않는다","성적 문제, 술·약물, 환청, 자살을 다뤄야 한다","점진적으로 질문하는 것이 좋다","마약 사용을 물을 때는 비밀보장을 설명할 수 있다","환자가 기분 나빠하면 정확한 평가를 위해 필요하다고 설명한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 거북한 주제(성·마약·자살) \"굉장히 중요\", 자살은 직접 자세히 – 소홀하면 법적 책임\n\n자살은 직접적으로 자세히 물어야 한다. 평가하지 않고 넘어갔다가 환자가 자살하면 의사가 해야 할 의무를 소홀히 한 것으로 법적 문제(소송)까지 이어질 수 있다고 교수님이 실제 사례를 들어 강조했다.","exps":["정답. 반드시 자세히 물어야 한다.","옳다.","옳다(타이밍을 잘 잡는다).","옳다(유학 중 적응 문제 등에서 꼭 물어야 함).","옳다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-07","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: STT 10/13 병식·다축진단·치료계획","year":"","type":"객","rep":1,"repyears":"","stem":"자살 위험성 평가에서 가장 위험한 단계로 봐야 하는 것은?","choices":["힘들어서 잠시 벗어나고 싶다는 생각","죽으면 편하겠다는 막연한 생각","구체적인 방법과 날짜를 생각하고 관련 사이트를 찾아봄","잠들 때 가장 편하다는 말","한 번 떠올랐다가 \"이건 아니지\" 하고 넘긴 생각"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 자살은 계획의 구체성·입원 필요 여부까지 평가\n\n자살 생각도 레벨이 다르다. 가장 약한 것은 힘드니까 벗어나고 싶은 것이고, 가장 심각한 것은 구체적 방법·날짜를 생각하거나 자살 사이트를 계속 찾아보는 등 구체적 행위·생각이 있는 경우다. 이 정도면 입원을 권해야 한다.","exps":["가장 약한 단계다.","구체성이 없다.","정답.","상징적 의미의 표현이다.","스쳐 지나간 생각이다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-08","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 4쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"정보 제공자(가족 등)와의 면담이 특히 중요한 경우는?","choices":["환자가 20세 이상의 성인일 때","환자가 처음 정신과에 내원했을 때에만","환자가 병식이 있고 매우 협조적일 때","환자가 병식이 없거나 증상을 숨기려 할 때","신체검사와 혈액검사가 모두 정상일 때"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 정보제공자 면담이 반드시 필요한 경우, 망상 환자는 본인 말만 들으면 속는다\n\n병식이 없거나 증상을 숨길 때, 또 환자의 성격 파악에 유용하다. 교수님 예: 의처증(망상장애) 환자 본인의 이야기와 피해를 받는 부인의 이야기는 너무 다르다.","exps":["관계없다.","초진에만 한정되지 않는다.","상대적으로 덜 필요하다.","정답.","관계없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-iv-09","area":"탈야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 강의록 「정신의학적 관찰」 4쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"최초 면담 시간에 대한 설명으로 옳은 것은?","choices":["정확한 평가를 위해 항상 3시간 이상 한다","보통 5–10분 정도면 충분하다","정신증이 심한 환자일수록 더 길게 한다","가족 면담까지 포함해 최소 2시간 이상 한다","보통 30분–1시간, 정신증·신체질병이 있으면 짧게"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 4쪽: 최초 면담은 30분–1시간 정도, 정신증이나 신체질병이 있는 경우는 짧게. 교수님: 1시간도 한 사람의 20년 인생을 듣기에는 많은 시간이 아니다.","exps":["과하다.","짧다.","반대다.","해당 없다.","정답."],"ai":"","fl":{}},{"k":"psy-iv-10","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 강의록 「정신의학적 관찰」 5쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"현병력을 조사할 때 의사가 반드시 \"pinpoint\"해야 한다고 강조한 것은?","choices":["가족이 처음 병원을 권한 날","증상이 진단 기준을 충족한 시점","처음으로 약을 복용한 날","환자가 처음 불편감을 느낀 날","증상이 가장 심했던 날"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"역치하(subthreshold) 증상과 임상적으로 문제가 되는 증상은 환자 본인에게는 구분이 안 된다. 의사가 언제부터 진단 기준을 충족하는 정도가 되었는지 정확히 짚어야 진단할 수 있다(강의록 5쪽: 첫 증상, 진단기준 충족 시점).","exps":["시점 판단 기준이 아니다.","정답.","해당 없다.","역치하 증상까지 포함될 수 있다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-iv-11","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"처음에는 스트레스를 받을 때만 증상이 생기다가, 악화·호전을 반복하면서 점점 작은 스트레스에도, 나중에는 뚜렷한 유발 요인 없이도 증상이 생기는 현상을 교수님은 무엇이라고 설명했나?","choices":["전이(transference)","내성(tolerance)","점화(kindling)","퇴행(regression)","조건화(conditioning)"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"킨들링(감  10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"30세 남자가 \"요즘 집중이 안 된다\"며 성인 ADHD 약을 처방해 달라고 왔다. 개인력에서 반드시 확인해야 하는 것은?","choices":["어린 시절에도 ADHD 증상이 있었는지","가족 중 의사가 있는지","하루 카페인 섭취량만","현재 하루 근무 시간과 업무량","최근 일주일 수면 시간만"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"어릴 때 ADHD가 없었다면 성인 ADHD가 아니다. 성인이 집중이 안 되는 이유는 우울·불안·강박·공부하기 싫음 등 10가지가 넘는다. 강의록 7쪽: 중기 아동기(3–11세)에 충동성·인지발달·학습장애 등을 본다.","exps":["정답.","해당 없다.","일부일 뿐이다.","핵심이 아니다.","일부일 뿐이다."],"ai":"","fl":{}},{"k":"psy-iv-16","area":"탈야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 강의록 「정신의학적 관찰」 7–8쪽","year":"","type":"객","rep":1,"repyears":"","stem":"개인력 조사에서 초기 아동기(3세까지)에 확인하는 항목이 아닌 것은?","choices":["안정적 양육 여부","군대 생활","수유 및 배변 훈련","낯가림·이별불안","head banging, body rocking"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7쪽: 초기 아동기 – 안정적 양육, 수유·배변 훈련, head banging·body rocking, 낯가림·이별불안, 놀이에서 능동 vs 수동. 군대 생활은 성인기 항목.","exps":["옳다.","정답. 성인기 항목이다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-iv-17","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"교수님이 치료 경과가 좋지 않다고 본 환자의 특징은?","choices":["지지해 주는 가족이 있는 사람","면담에서 질문을 많이 하는 사람","불편해도 친구를 만나고 놀러 가는 사람","오랫동안 사회적으로 단절되어 혼자 지내는 사람","스스로 병원에 온 사람"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"정신과 증상의 중요한 기전 중 하나가 단절이다. 불편해도 친구를 만나고 놀러 가는 사람은 치료가 잘 되고, 오랫동안 단절된 사람일수록 치료가 잘 안 된다.","exps":["회복이 좋다.","해당 없다.","예후가 좋은 쪽이다.","정답.","면담이 비교적 원활하다."],"ai":"","fl":{}},{"k":"psy-iv-18","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 강의록 「정신의학적 관찰」 9쪽 · STT 10/13 3교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신상태검사(MSE)에 대한 설명으로 옳은 것은?","choices":["한 번 기록하면 이후에는 바뀌지 않는다","환자가 직접 작성하는 표준화된 설문지다","가족 면담 내용만을 근거로 작성한다","면담 중 관찰한 현재 상태를 기술하며 며칠 새 바뀔 수 있다","과거 병력을 시간 순으로 정리한 기록이다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 9쪽: 증상과 징후를 체계적으로 평가하는 것. 병력과 비슷할 수 있으나 며칠 사이 바뀔 수 있으므로 현재 상태를 평가하고, 면담 중 관찰된 것을 기술한다(외모·태도·행동, 기분 확한 진단명","심리검사의 점수"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"치료에서 가장 중요한 것은 의사와 환자의 관계. 초진에서는 형성될 수 없고 드라이하게 확인하는 단계지만, 관계가 잘 쌓이면 증상이 남아도 큰 문제 없이 살아가도록 도울 수 있다.","exps":["정답.","해당 없다.","핵심으로 꼽지 않았다.","해당 없다.","해당 없다."],"ai":"","fl":{}},{"k":"psy-iv-33","area":"티야","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"📌티야방 · 근거: 강의록 「정신의학적 관찰」 15–16쪽 · STT 10/13 병식·다축진단·치료계획 · 티야방(정소윤)","year":"","type":"객","rep":1,"repyears":"","stem":"특수 상황 면담에서 상황과 대처가 바르게 짝지어진 것은?","choices":["자살 위험이 있는 우울증 – 섣불리 \"다 괜찮아질 거예요\"라고 안심시킨다","잠재적으로 난폭한 환자 – 말은 해도 되지만 행동화는 안 된다고 분명히 한다","잠재적으로 난폭한 환자 – 단둘이 문을 닫고 차분히 면담한다","망상이 있는 환자 – 망상이 틀렸다고 즉시 직면시킨다","가족 면담 – 타살 의도도 환자가 원하면 비밀로 한다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌티야방(정소윤): 야첵 p.26–27 특수상황 면담 슬라이드는 \"시험 빈출!! 각 상황에서 뭘 해야 하는지 선지를 골고루 내시니 꼭 보고 가세요.\" 우울·자살: 섣부른 안심 금물, 직접 자세히 질문 / 난폭: 단독 면담 금지, 문 열고 문 쪽에, 단호하게, 행동화 불가 명확히, 현실판단 문제면 약물부터 / 망상: 이해하되 동조·직면하지 않음 / 가족: 자살·타살 의도는 비밀보장 불가.","exps":["섣부른 안심·확신은 금물이다.","정답.","단독 면담은 안 되고 문을 열어 둔다.","직접 도전·직면은 삼간다.","자살·타살 의도는 비밀보장이 안 된다."],"ai":"","fl":{"tyb":1}},{"k":"psy-y-iv-suicide-2025","area":"야마","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 학습지 「정신과적 면담 및 평가」 243–251쪽","year":"2025 객1","type":"객","rep":1,"repyears":"","stem":"자살사고가 있는 환자를 대할 때 적절한 것은?","choices":["예민한 사안이므로 간접적으로 접근하는 것이 좋다.","구체적으로 자살 생각이 있고 심하더라도 외래치료를 우선한다.","자살은 옳지 않음을 교육한다.","과거 자살 시도력이 있는지 반드시 확인한다.","개인정보이므로 가족에게도 비밀로 유지한다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 자살은 직접적으로 자세히(가족력·시도력·계획의 구체성·입원 필요 여부), 소홀하면 법적 책임\n\n🎓 올해 수업 기준: 교수님: 자살은 직접적으로 자세히 – 가족력, 시도력, 계획의 구체성, 입원 필요 여부까지 묻는다. 평가를 소홀히 하면 의료사고·법적 책임으로 직결된다. 가족 면담에서도 환자 의견 존중이 원칙이지만 자살·타살 의도는 비밀보장이 될 수 없음을 환자에게 이해시켜야 한다.\n\n📚 학습지 해설: 정답 ④ (복원: 공어진·이윤재, 2025 정영철 강의록 15–16쪽)\n우울증과 잠재적 자살 가능성이 있는 경우: 자신의 상태를 잘 설명 못할 수 있어 자세히 묻는 것이 중요. 절망감 – 섣부른 안심·확신은 금물, 공감과 지지, 최선을 다할 것임을 전달. 자살 – 직접적으로 자세히 물을 것; 자살의 가족력, 자살 시도력, 충동성, 염세주의가 있을 때 위험; 심각할 때는 입원 조치, 충동 시 반드시 전화 상의.\n① 틀림 – 자살은 정신과적 응급이므로 구체적인 계획이 있는지 직접 물어봐야 한다.\n② 틀림 – 환자가 자살할 계획을 갖고 있다면 특별히 위험한 징후다(입원 여부 결정 인자).\n③ 틀림 – 자살이 옳지 않음을 교육하기보다 공감과 지지, 최선을 다할 것임을 전달하는 게 좋다.\n④ 정답 – 자살의 심각성 평가를 위해 자살 시도력(구체적 계획을 세운 적 있는지), 자살 가족력 등을 질문해야 한다.\n⑤ 틀림 – 환자 안전 확보와 자타해 방지를 위해 필요시 가족·보호자에게 통보할 수 있다. 비밀보장은 환자 의견 존중이 원칙이지만 자살이나 타살 의도는 비밀보장이 될 수 없다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-iv-violent-2023","area":"야마","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 학습지 「정신과적 면담 및 평가」 243–251쪽","year":"2023 객13","type":"객","rep":1,"repyears":"","stem":"난폭한 환자를 대할 때 적절한 것은?","choices":["단독으로 면담한다","같이 화를 내서는 안 되지만 단호하고 분명한 태도를 가져야 한다","면담실은 격리되어 조용한 공간에서 하는 것이 바람직하다","의사가 진찰실 안쪽의 벽 방향으로 앉는 것이 바람직하다","약물 투여를 먼저 들어가는 것이 안전하다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(박준영): 위험한 환자 면담 배치 \"굉장히 중요\" – 문 열어 두기, 의사는 문 쪽, 도와줄 사람 대기\n\n🎓 올해 수업 기준: 교수님(티야방 박준영 정리): 위험한 환자는 굉장히 중요 – 출입문을 열어 두고, 의사는 출입문 쪽에 앉고, 도와줄 사람을 대기시킨다. 교수님은 환자에게 \"말은 해도 되지만 행동화는 안 된다\"는 것을 분명히 하라고 했다.\n\n📚 학습지 해설: 정답 ② (복원: 천승환·최민국, 정영철 정신의학적 진찰 ppt)\n<잠재적으로 난폭한 환자의 면담 주의 사항>\n1. 단독으로 면담은 안 됨\n2. 적어도 한 사람(안전요원이나 경찰관)이 항시 같이\n3. 면담실 문은 열어놓고 의사가 문 쪽에\n4. 화내지 말고 단호하고 분명하게\n5. 환자는 어떤 말도 할 수 있으나 행동화는 할 수 없음을 명확히\n6. 환자를 자극하거나 경멸하는 일은 절대로 피할 것\n7. 현실판단에 문제 있으면 약물 투여부터\n따라서 정답은 2번. 3번이 헷갈릴 수 있는데 면담실을 열어놓고 대피할 수 있게 해야 한다(완전 격리하면 의사가 위험할 수 있음).","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-iv-tech-2022","area":"야마","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 학습지 「정신과적 면담 및 평가」 243–251쪽","year":"2022 객13","type":"객","rep":11,"repyears":"2021 객11 · 2020 객11 · 2019 객11 · 2017 객11 · 2016 객11 · 2015 객11 · 2014 객13 · 2013 객2 · 2012 객2 · 2011 객2","stem":"다음 자살사고가 있는 환자의 면담기법에 관한 설명 중 가장 적절한 것은?","choices":["자살사고가 있을 때 자살에 대한 간접적인 평가를 위주로 조심스럽게 접근하는 것이 좋다.","처음부터 구체적인 질문을 하여 평가하는 것이 빠른 평가가 이루어질 수 있다.","절망감이 심한 우울증 환자의 경우 위로와 안심보다는 충분한 경청과 공감이 중요하다.","구체적인 자살 방법을 묻는 것은 자극적이므로 피하는 것이 좋다.","스스로 자살에 관련된 말이 나올 때까지 기다리는 것이 좋다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): 특수상황 면담 슬라이드 시험 빈출 – 각 상황에서 뭘 해야 하는지 선지를 골고루 냄\n\n🎓 올해 수업 기준: 교수님: 자살은 직접적으로 자세히 묻는다 – 평가하지 않고 넘어갔다가 환자가 자살하면 의사의 의무를 소홀히 한 것으로 소송까지 갈 수 있다(실제 사례 언급). 절망한 환자에게는 섣부른 안심 대신 \"같이 고민해 보자, 같이 찾아보자, 같이 노력해 보자\"는 식으로 공감·지지를 전한다. 자살 생각도 단계가 있어 구체적 방법·날짜를 생각하거나 자살 사이트를 찾아보는 수준이 가장 위험하다. 티야방(정소윤): 특수상황 면담 슬라이드 2장(야첵 26–27쪽)은 시험 빈출 – 상황별로 선지를 골고루 낸다.\n\n📚 학습지 해설: 정답 ③ (복원: 김상헌, 정영철 강의록)\n우울증과 잠재적 자살 가능성이 있는 경우 면담은 자살을 직접적으로 자세히 물어야 한다 – 자살의 가족력, 자살 시도력 등을 자세히. 일반적 면담 기법으로 처음에는 포괄적인 질문으로 시작해야 한다. 절망감이 심한 우울증 환자에서는 섣부른 안심·확신은 금물이고 공감과 지지, 최선을 다할 것임을 전달해야 한다. 그래서 답은 3번.\n\n특수 상황 면담기법(교과서 2판 124–127쪽)\n① 우울한 환자에서는 자살 가능성을 반드시 염두 – 지금 자살 의도나 계획이 있는지 직접 묻는다. 유서, 자살 가족력, 자살 기도 전력이 있으면 다시 시도할 위험이 높다. 자살은 중요한 내용이라 먼저 직접적으로 물어볼 필요가 있다.\n② 섣불리 모든 것이 다 잘 될 것이라고 안심시키지 않는다. 특정 치료가 꼭 효과가 있을 것이라고 약속하지 않는다 – 효과가 없을 때 환자의 마지막 희망을 제거해 버릴 수 있다.\n③ 환자가 비관적으로 느끼고 있다는 것을 의사가 이해하고 있음을 보여 주고, 그럼에도 분명히 도와줄 수 있으며, 환자 입장에서 도움이 불가능하리라 생각하는 것도 이해가 된다고 설명해 준다. (정답)\n④ 망상을 직접 도전·공격하는 것은 삼간다. 망상은 엄습하는 불안, 낮아진 자존심, 혼란에 대한 (비적응적이지만) 방어적·자기보호적 방책 – 틀렸다고 매도하면 불안이 증폭되고 더 필사적으로 매달린다.\n⑤ 난폭한 환자를 경멸하거나 자극하는 일은 절대 피한다 – 충동적인 환자를 권위적으로 대하지 않는다. 우울한 환자에서 충동성이 있으면 자살 위험이 높으므로 대화를 빨리 끝내기보다 자살 생각을 자세히 물어야 한다.\n(복원자) 매년 야마 그대로, 보기 조사 정도만 바뀌어 나오는 문제.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-iv-tech-2021","area":"야마","prof":"정영철","sec":"10/13 · 정신의학적 관찰: 면담 및 평가","meta":"근거: 학습지 「정신과적 면담 및 평가」 243–251쪽","year":"2021 객11","type":"객","rep":11,"repyears":"2022 객13 · 2020 객11 · 2019 객11 · 2017 객11 · 2016 객11 · 2015 객11 · 2014 객13 · 2013 객2 · 2012 객2 · 2011 객2","stem":"다음 면담기법에 대한 설명 중 가장 적절한 것은?","choices":["자살 사고가 있는 환자에게는 자살에 대해서 간접적으로 조심스럽게 면담을 접근해야 한다.","처음부터 구체적으로 물어보는 것이 빠른 진단과 분석을 하는데 도움이 된다.","절망감이 심한 우울증 환자의 경우 일차적으로 안심이나 위로보다는 얘기를 경청해주고 공감해주는 것이 좋다.","머릿속에 도청장치가 있다는 망상이 있는 경우 영상 검사를 통해 환자의 잘못된 믿음을 반복적으로 확인시켜주는 것이 치료에 효과적일 수 있다.","공격적이며 충동조절이 되지 않는 환자에게는 권위적인 태도를 유지하고 단독으로 면담하는 것이 바람직하다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): 특수상황 면담 슬라이드 시험 빈출 – 각 상황에서 뭘 해야 하는지 선지를 골고루 냄\n\n🎓 올해 수업 기준: 교수님: 자살은 직접적으로 자세히 묻는다 – 평가하지 않고 넘어갔다가 환자가 자살하면 의사의 의무를 소홀히 한 ,"보험 청구 절차가 더 간단해서","영구적인 기능 손상을 뜻하기 때문"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): \"병과 장애를 구분하는 것은 굉장히 중요하다\"\n\ndis-order: 질서가 흐트러진 상태라 질서를 다시 잡으면 좋아질 수 있다는 긍정적·희망적 표현. 원인이 복합적(biopsychosocial)이라 하나로 밝혀진 병(disease)이라 하지 않는다. 장해(impairment)는 기능상 문제로 어느 정도 영구적 손상이 지속되는 것.","exps":["원인이 밝혀졌다면 병이라 한다.","정답.","해당 없다.","해당 없다.","그것은 장해(impairment)에 가깝다."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-02","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 4쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"진단분류의 목적 중 교수님이 \"첫째도 중요하지만 더 중요하다\"고 한 것은?","choices":["보험료와 수가 산정","정신장애의 원인 규명","법원 제출용 진단서 작성","전문가 간 통일된 의사소통","위험 환자의 분류와 격리"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): 교수님이 느끼기에 더 중요한 것은 전문가들의 상호 효율적인 의견 교환 (Y)\n\n궁극적 목적은 원인을 밝히고 치료법을 개발하는 것이지만 현재는 미약하다. 교수님은 전문가들이 통일된 기준으로 의사소통·토론할 수 있게 하는 것이 더 중요하다고 봤다.","exps":["해당 없다.","궁극적 목적이지만 현재 미약하다.","해당 없다.","정답.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-03","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 5쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"현재 정신과 진단분류의 특징으로 옳지 않은 것은?","choices":["진단은 강제치료 결정 시 중요하다","확립된 생물학적 검사로 원인별 분류를 한다","검사보다 병력 청취와 정신상태검사에 의존한다","원인이 아니라 증상에 따라 분류한다","환자뿐 아니라 가족·친구에게서도 정보를 얻어야 한다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 5쪽: 원인이 아니라 증상에 따라 분류, 검사보다 병력 청취·정신상태검사에 의존(interview skill 중요), 주변 정보, 생활의 어려움에서 오는 경우가 많음, 강제치료 결정 시 중요.","exps":["옳다.","정답. 확립된 검사법이 없다.","옳다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-cl-04","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 6·12쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"차원적(dimensional) 분류와 범주적(categorical) 분류에 대한 설명으로 옳은 것은?","choices":["일반 의학(폐렴·결핵)의 진단은 주로 차원적이다","현재 DSM·ICD는 두 방식이 섞여 있으나 범주적 성격이 더 강하다","정신치료 관점에서는 범주적 분류가 더 유용하다","DSM-IV는 차원적 분류를 전혀 도입하지 않았다","범주적 분류는 건강과 질병을 정도의 차이로 본다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): 차원적·범주적 분류 – 학생 지목 질문, 시험 빈출\n\n범주적: 병이 있는 사람과 없는 사람이 확연히 구분(폐렴·결핵). 차원적: 건강 상태와 정도의 차이. 현재 DSM·ICD는 혼합이나 범주가 더 강하다. 교수님은 원인이 밝혀지지 않았고 누구나 우울·불안할 수 있으므로, 사람을 이해하고 정신치료하는 데는 차원적 관점이 더 맞다고 강조했다. DSM-IV는 bipolar II로 차원적 진단을 일부 도입.","exps":["범주적이다.","정답.","차원적 관점이 더 맞다고 했다.","bipolar II로 일부 도입했다.","그것은 차원적 분류다."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-05","area":"탈야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 7쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"경과를 중요하게 여겨 최초의 현대적 기술적 분류를 만든 사람은?","choices":["Plato","Eugen Bleuler","Hippocrates","Emil Kraepelin","Kurt Schneider"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7쪽: Kraepelin – 최초의 현대적인 기술적 분류(경과를 중요시). Hippocrates는 mania·melancholia·hysteria·phrenitis를 기술, Plato는 신으로부터 받은 것과 신체적인 것으로 나눴다.","exps":["관념적 합리론.","증상을 강조했다.","관찰적 경험론으로 증상을 기술했다.","정답.","1급 증상을 제시했다."],"ai":"","fl":{}},{"k":"psy-cl-06","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 8쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM 다축체계에서 신체질환이 정신증상의 원인인 경우 기록 방법으로 옳은 것은?","choices":["I축에만 기록","V축에 GAF로만 기록","IV축에만 기록","II축과 III축에 기록","I축과 III축에 동시에 기록"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): DSM 각 축의 내용은 고대 야마 빈출\n\n강의록 8쪽: 축 III – 정신장애를 이해하거나 치료하는 데 연관된 일반 의학적 상태(신체질환이 원인인 경우 축 I & III에 동시에 기록). 교수님: 신체질환이 원인이면 III축이 제일 중요하다.","exps":["III축도 기록한다.","V축은 전반적 기능이다.","IV축은 정신사회적·환경적 문제다.","II축은 인격장애·정신지체다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-07","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 8쪽 · STT 10/13 4교시 · STT 10/13 병식·다축진단","year":"","type":"객","rep":1,"repyears":"","stem":"GAF(Global Assessment of Functioning)에 대한 설명으로 옳은 것은?","choices":["인격장애가 있는지를 판정하는 척도다","점수가 높을수록 증상이 심하다는 뜻이다","환자가 스스로 매기는 0–10점 척도다","최근 1년간 스트레스 요인의 개수다","의사가 매기는 0–100점이며 높을수록 기능이 좋다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): DSM 각 축의 내용은 고대 야마 빈출\n\n축 V(GAF 0–100점): 특정 기간 동안 환자의 전반적인 기능(심리적·사회적·직업적)을 의사가 판단. 기능이 좋을수록 높다. 예: 불안하지만 직장·학교는 잘 다니는지.","exps":["II축이다.","반대다.","의사가 판단하고 0–100점이다.","IV축 내용과 관련된다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-08","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 9쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"진단명에 붙는 NOS(not otherwise specified)의 의미는?","choices":["어느 특정 진단에도 딱 맞지 않을 때 붙인다","원인이 밝혀진 장애에 붙인다","여러 진단 중 주진단을 뜻한다","과거에 있었던 병력을 뜻한다","정보가 부족한 잠정 진단을 뜻한다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록 9쪽: 달리 분류되지 않는 범주(NOS) – 증상이 특정 진단의 역치 이하이거나 비전형적·혼합 양상. 교수님: A도 B도 아닌 것 같아 애매할 때 붙인다.","exps":["정답.","해당 없다.","해당 없다.","prior history다.","provisional diagnosis다."],"ai":"","fl":{}},{"k":"psy-cl-09","area":"탈야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 10쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"ICD-10에 대한 설명으로 옳은 것은?","choices":["ICD-10 범주는 모두 DSM-IV에 있다","신경증 관련 용어를 전혀 쓰지 않는다","다축 체계가 없다","미국정신의학회가 만들었다","축은 임상진단·후유장애·상황적 요인의 3개다"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 10쪽: ICD-10도 다축 체계(축 I 임상진단, II 후유장애, III 상황적 요인)이며 조작적 진단기준. 신경증·정신증 구분은 없앴으나 신경증적, 급성 일과성 정신병적 장애 등의 용어는 사용. DSM-IV 범주는 모두 ICD-10에 있지만 반대는 아니다(ICD가 더 광범위). ICD는 WHO.","exps":["반대다.","용어는 사용한다.","다축 체계다.","WHO다.","정답."],"ai":"","fl":{}},{"k":"psy-cl-10","area":"탈야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 11–12쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM의 발달 과정에 대한 설명으로 옳지 않은 것은?","choices":["DSM-III(1980)에서 세밀한 조작적 정의와 다축 체계를 처음 도입했다","DSM-IV에서 조현병 활성기 증상 기간을 1개월에서 1주로 줄였다","DSM-IV에서 신경증이라는 용어가 사라졌다","DSM-I은 1952년에 나왔다","DSM-IV(1994)에서 기질성/기능성 이분법이 사라졌다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록 11–12쪽: DSM-IV에서 조현병 활성기 증상 기간은 1주일에서 1개월로 늘었다. 또 brief reactive psychosis → brief psychotic disorder, bipolar II·급성 스트레스 장애 등 추가.","exps":["옳다.","정답. 1주일 → 1개월로 늘었다.","옳다(psychotic disorder라는 용어는 사용).","옳다(130쪽, 106개 장애).","옳다."],"ai":"","fl":{}},{"k":"psy-cl-11","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 13쪽 · STT 10/13 4교시 · 티야방(정소윤)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 새로 생긴 정식 진단이 아니라 제안되었다가 탈락한 것은?","choices":["파탄적 기분조절곤란장애","경도 신경인지장애","월경전 불쾌감 장애","인터넷 중독","저장장애"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 13쪽: 신설 – 파탄적 기분조절곤란장애, 경도(약한) 신경인지장애, 폭식장애·성인 ADHD·저장장애·월경전 불쾌감 장애·행동 중독. 탈락 – psychosis risk, mixed anxiety/depression, internet·sex addiction. 📌티야방: DSM-5 변화 슬라이드는 최근 시험 빈출이니 전부 읽어 보라.","exps":["신설.","신설(노화로 인한 건망증 → 경도 신경인지장애).","신설.","정답. 탈락했다.","신설."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-12","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 13쪽 · STT 10/13 4교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 삭제되어 사별 후 애도 반응도 주요우울장애로 진단될 수 있게 된 조항은?","choices":["6개월 기간 조항","물질 유발 제외 조항","조현병 단일 증상 조항","사별 제외 조항","기분 일치성 조항"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): DSM-5 변화 슬라이드 최근 빈출 – 전부 읽어 보기\n\n사별로 인한 애도도 \"중증 우울증\"으로 진단받을 수 있도록 예외 조항이 삭제되었다. 교수님은 DSM이 미국 사립 보험 체계와 연결되어 있다는 우려 섞인 시각을 함께 설명했다.","exps":["해당 없다.","해당 없다.","조현병 기준 변화다.","정답.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-13","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 14쪽 · STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에 대한 비판으로 교수님이 설명한 것은?","choices":["보험 체계와 무관하다","과잉 진단과 과잉 투약","소아 진단이 빠져 있다","차원적 분류만 쓴다","진단 범주가 너무 적다"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"부정적 측면: 과잉 진단·과잉 투약. DSM은 미국 사립 보험 시장과 맞물려 진단이 많을수록 환급이 많아지는 구조라는 비판. \"treat the person not the disease\", 보험 청구·제약사 FDA 승인에 필요할 뿐이라는 비판. 긍정적 측면: 통일된 의사소통, 예방적 개입 진단(MCI 등).","exps":["연결되어 있다고 비판한다.","정답.","해당 없다.","혼합이다.","반대다."],"ai":"","fl":{}},{"k":"psy-cl-14","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 15쪽 · STT 10/13 5교시" is":"📌 티야방(전은채): 정신증·신경증 구분 – 과거 출제\n\n강의록 16쪽: 신경증 – 불안장애, 신체형장애, 해리장애, 성장애, 기분부전장애. 조현병은 정신증(중증 정신질환, SMI)에 해당한다.","exps":["신경증.","신경증.","신경증.","정답. 정신증이다.","신경증."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-18","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신증 환자에게서 \"경계심 스위치\"가 너무 쉽게 켜진다는 교수님 설명과 연결되는 현상은?","choices":["사회 기능의 전반적 향상","병식 증가와 순응도 향상","기억력과 집중력 향상","감정 둔마의 빠른 회복","확증 편향과 현실감 저하"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"경계심은 필요할 때만 켜지면 자신을 보호하는 장치지만, 정신증 환자는 너무 쉽게·수시로 켜진다. 그래서 확증 편향(한 가지로 모든 사건을 해석)이 일어나고 현실감이 부족해지며 병식이 없어질 수 있다.","exps":["반대다.","반대다.","해당 없다.","해당 없다.","정답."],"ai":"","fl":{}},{"k":"psy-cl-19","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 강의록 「정신의학적 진단분류」 17쪽 · STT 10/13 5교시","year":"","type":"객","rep":1,"repyears":"","stem":"정신의학을 관통하는 가장 중요한 개념으로 교수님이 마지막에 강조한 모델은?","choices":["유전 결정 모델","정신역동 모델","생물·심리·사회 모델","행동주의 모델","생물의학 모델"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"생물학적·정신역동적·환경적·유전적 관점을 통합하는 biopsychosocial model이 정신과 진찰·면담·진단을 관통하는 가장 중요한 개념.","exps":["교수님은 유전 결정론에 비판적이었다.","일부만 본다.","정답.","일부만 본다.","일부만 본다."],"ai":"","fl":{}},{"k":"psy-cl-20","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 14쪽 · STT 10/13 5교시 · 티야방(전은채)","year":"","type":"객","rep":1,"repyears":"","stem":"DSM-5에서 예방적 개입을 위한 진단으로 제안되어 부록에 실린 것으로만 묶인 것은?","choices":["저장장애 · 발모광(털뽑기장애)","조현병 · 양극성장애 제I형","공황장애 · 광장공포증","품행장애 · 반사회성 인격장애","정신증 위험성 증후군 · 경도 신경인지장애"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록 14쪽 \"DSM-5의 명암\": 예방적 개입을 위한 진단 제안 – 정신증 위험성 증후군(psychosis risk syndrome), 부분 신경인지장애(minor neurocognitive disorder), 자살 위험성 평가. 📌티야방(전은채): 직접 강조는 없었으나 구두로 설명했고 야마에 빈출(선지에는 \"정신증 고위험군\", \"경도인지장애\"로 나옴). 교수님: MCI는 정식 진단으로 들어가 있고, 발병 전에 문제가 있으면 잘 봐야 한다는 예방적 측면을 강조한 진단.","exps":["강박 관련 장애 정식 진단이다.","이미 확립된 정식 진단이다.","불안장애 정식 진단이다.","정식 진단이다.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-cl-21","area":"티야","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"📌티야방 · 근거: 강의록 「정신의학적 진단분류」 3쪽 · STT 10/13 4교시 · 티야방(정소윤)","year":"","type":"객","rep":1,"repyears":"","stem":"\"장애(disorder)\"와 \"장해(impairment)\"에 대한 설명으로 옳은 것은?","choices":["장해는 원인이 밝혀진 질병을 뜻한다","둘은 정신의학에서 같은 뜻이다","장애는 신체질환에만 쓰는 말이다","장해는 기능상의 문제로 영구적일 수 있다","장애는 영구적 손상만을 뜻한다"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌티야방(정소윤): \"장애와 장해를 이해하는 게 중요하다\", \"병과 장애를 구분하는 것은 굉장히 중요하다\". 장애(disorder)는 원인이 명확하지 않아 질서가 흐트러진 상태(다시 잡으면 좋아질 수 있음), 장해(impairment)는 기능상 문제로 교통사고 후 장애 진단처럼 어느 정도 영구적 손상이 지속되는 것.","exps":["원인이 밝혀진 것은 \"병\"이다.","구분해야 한다고 강조했다.","해당 없다.","정답.","장애는 회복 가능성을 담은 말이다."],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-dsm5-2025","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2025 객2","type":"객","rep":10,"repyears":"2023 객14 · 2022 객14 · 2021 객12 · 2020 객12 · 2019 객12 · 2018 객12 · 2017 객12 · 2016 객12 · 2015 객12","stem":"DSM-5의 변화로 옳은 것을 고르시오.","choices":["우울증의 여러 증상이 4일~13일 지속되면 other specified depressive disorder로 진단이 가능하다","인터넷 중독이 신설되었다","경도인지장애는 진단체계(부록 포함)에서 제외되었다","양성증상이 기이하면 하나만 있어도 조현병 진단이 가능하다","범불안장애 진단기준이 완화되었다"],"ans":[1,5],"imgs":[],"vis":[],"notes":["이의제기 결과 ①·⑤ 복수정답 처리(학습지 기록)."],"basis":"📌 티야방(정소윤): (10/19 추가) 올해 수업 슬라이드에는 \"범불안장애 완화\"가 빠짐 – 작년 ①⑤ 복수정답 선지였으니 바꿔 낼 수 있어 유의\n\n🎓 올해 수업 기준: 작년(2025) 이의제기로 ①⑤ 복수정답 처리된 문제. 티야방(정소윤, 10/19 추가): 올해 수업 슬라이드에는 \"범불안장애 완화\"가 빠졌다 – 올해 바꿔 낸다면 ⑤는 정답이 아닐 수 있으니 ①(4–13일 단기 우울 삽화)을 확실한 답으로 기억. 또 올해 슬라이드에는 \"조현병은 2개 이상의 증상이 있어야 진단 가능(기이한 망상 1개 특례 삭제)\"이 추가되어 ④는 오답.\n\n📚 학습지 해설: 정답 ①, ⑤(이의제기 결과 복수정답) (복원: 공진영·이은종, 2025 강의록 정신의학적 진단분류 13쪽)\nKY. DSM-5의 변화는 거의 매년 출제되는 문제.\n① (O) DSM-5의 \"기타 특정 우울장애\"의 예시인 단기 우울 삽화 – 핵심 증상이 4일 이상 13일 이하로 지속. 킹야로 항상 답이 되었던 선지.\n② (X) 인터넷 중독은 탈락 – 인터넷 게임 장애는 \"추가 연구가 필요한 질환\"으로 부록(Section III)에만 포함.\n③ (X) 경도인지장애는 신설되었다.\n④ (X) DSM-IV에서는 망상이 기이하면 한 증상만으로 기준 A를 만족했으나 DSM-5에서 이 특례가 삭제 – 다른 양성증상 1가지 이상이 추가로 있어야 한다.\n⑤ (?) 강의록에는 범불안장애가 \"3가지 이상 증상 3개월 이상 → 1개 이상 증상 1개월 이상\"으로 완화되었다고 나오지만, 인터넷 검색으로는 GAD는 6개월 이상·3가지 이상 증상으로 바뀌지 않았다고 나온다.\n\n[신설] 파탄적 기분조절곤란장애(소아의 발작적 짜증), 약한(경도) 신경인지장애(노화로 인한 건망증, MCI), 폭식장애, 성인 ADHD, 저장장애, 월경전불쾌감장애, 행동 중독\n[삭제] 사별로 인한 애도도 주요우울증으로 진단받을 수 있도록 사별 예외조항 삭제\n[탈락] psychosis risk(정신증 고위험군 – 부록으로 도입, 부록에서도 빠진 것은 아님), mixed anxiety/depression, internet·sex addiction(인터넷 게임 장애는 부록 Section III)\n[완화] 범불안장애(강의록: 3가지 이상 증상 3개월 이상 → 1개 이상 1개월 이상)\nDSM-IV에서의 변화(오답 선지로 자주 나옴): 조현병 활성기 증상 기간 1주 → 1개월로 강화, 급성 스트레스 장애·양극성 II형 추가.\n조현병: DSM-IV에는 망상이 기이하면 한 증상만으로도 기준 A를 만족했으나 DSM-5에서 이 특례가 삭제 – 2개 이상 증상이 있어야 한다.\nother specified depressive disorder: 짧은 기간 우울 삽화(4–13일) – 킹야로 항상 답이 된 선지.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-dsm5-2023","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2023 객14","type":"객","rep":10,"repyears":"2025 객2 · 2022 객14 · 2021 객12 · 2020 객12 · 2019 객12 · 2018 객12 · 2017 객12 · 2016 객12 · 2015 객12","stem":"DSM-5의 변화로 옳은 것을 고르시오.","choices":["우울증의 여러증상이 4~13일 지속되면 other specified depressive disorder로 진단 가능하다.","인터넷중독장애가 진단체계에 추가 되었다.","경도인지장애가 진단체계(부록포함)에서 제외되었다.","하나의 증상만 있어도 조현병 진단이 가능하다.","파탄적 기분조절장애가 진단체계(부록포함)에서 삭제되었다."],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤·전은채): 최근 시험 빈출 슬라이드 – 조현병 \"1개 증상만으로 진단\" 조항 삭제(25Y), 정신증 위험 증후군·경도 신경인지장애는 DSM-5 부록\n\n🎓 올해 수업 기준: 올해 슬라이드에 \"조현병 진단 기준에서 1개 증상만 있어도 된다는 사항 삭제 → 2개 이상의 증상 필요\"가 추가되어 ④가 확실한 오답. 정답 ①은 강의록에는 없지만 매년 정답으로 나온 킹야 선지.\n\n📚 학습지 해설: 정답 ① (복원: 최수지·최우석, 정영철 진단분류체계 강의록)\n1. 강의록에는 존재하지 않는 선지 – 2021·2022 야마에 나온 선지이고 다른 선지가 오답이라 맞는 선지임을 알 수 있다. (정답)\n2. DSM-5 신설 항목에 인터넷 중독장애는 들어가지 않는다.\n3. 경도인지장애(약한 신경인지장애)가 신설되었다.\n4. 조현병 진단기준에 중증인 경우 한 개 증상만 있어도 된다는 주의사항이 없어졌다(기존 야마 선지이면서 2023 추가 강의록에 새로 추가).\n5. 소아의 발작적 짜증이 \"파탄적 기분조절곤란장애\"로 신설되었다.\n\n[신설] 파탄적 기분조절곤란장애(소아의 발작적 짜증), 약한(경도) 신경인지장애(노화로 인한 건망증, MCI), 폭식장애, 성인 ADHD, 저장장애, 월경전불쾌감장애, 행동 중독\n[삭제] 사별로 인한 애도도 주요우울증으로 진단받을 수 있도록 사별 예외조항 삭제\n[탈락] psychosis risk(정신증 고위험군 – 부록으로 도입, 부록에서도 빠진 것은 아님), mixed anxiety/depression, internet·sex addiction(인터넷 게임 장애는 부록 Section III)\n[완화] 범불안장애(강의록: 3가지 이상 증상 3개월 이상 → 1개 이상 1개월 이상)\nDSM-IV에서의 변화(오답 선지로 자주 나옴): 조현병 활성기 증상 기간 1주 → 1개월로 강화, 급성 스트레스 장애·양극성 II형 추가.\n조현병: DSM-IV에는 망상이 기이하면 한 증상만으로도 기준 A를 만족했으나 DSM-5에서 이 특례가 삭제 – 2개 이상 증상이 있어야 한다.\nother specified depressive disorder: 짧은 기간 우울 삽화(4–13일) – 킹야로 항상 답이 된 선지.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-dsm5-2022","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2022 객14","type":"객","rep":10,"repyears":"2025 객2 · 2023 객14 · 2021 객12 · 2020 객12 · 2019 객12 · 2018 객12 · 2017 객12 · 2016 객12 · 2015 객12","stem":"DSM-5의 변화로 옳은 것을 고르시오.","choices":["우울증의 여러증상이 4~13일 지속되면 other specified depressive disorder로 진단 가능하다","정신증 고위험군은 진단체계(부록포함)에서 제외되었다.","경도인지장애는 진단체계(부록포함)에서 제외되었다","양성증상이 기인하면 하나만 있어도 조현병 진단이","파탄적 기분조절곤란 장애가 삭제되었다."],"ans":[1],"imgs":[],"vis":[],"notes":["④ 선지는 학습지 복원 원문 그대로(끝부분 누락)."],"basis":"📌 티야방(정소윤·전은채): 최근 시험 빈출 슬라이드 – 조현병 \"1개 증상만으로 진단\" 조항 삭제(25Y), 정신증 위험 증후군·경도 신경인지장애는 DSM-5 부록\n\n📚 학습지 해설: 정답 ① (복원: 김상형, \"항상 나오는 문제로 조금씩 변형\")\n<신설> 소아의 발작적 짜증 → 파탄적 기분조절곤란장애, 노화로 인한 건망증 → 약한 신경인지장애. 폭식장애, 성인 ADHD, 저장장애, 월경전불쾌감장애, 행동 중독 포함.\n<삭제/탈락> 사별로 인한 애도도 중증 우울증으로 진단받을 수 있도록 예외조항 삭제. 탈락: psychosis risk, mixed anxiety/depression, internet and sex addiction.\n<완화> 범불안장애: 3가지 이상 증상 최소 3개월 이상 → 1개 이상 증상 한 달 이상.\n② 정신증 고위험군은 부록으로 들어갔다(부록에서도 빠진 것은 아님).","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-dsm5-2021","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2021 객12","type":"객","rep":10,"repyears":"2025 객2 · 2023 객14 · 2022 객14 · 2020 객12 · 2019 객12 · 2018 객12 · 2017 객12 · 2016 객12 · 2015 객12","stem":"DSM-5의 변화로 옳은 것을 고르시오","choices":["우울증의 여러증상이 4~13일 지속되면 other specified depressive disorder로 진단 가능하다","정신증 고위험군은 진단체계(부록포함)에서 제외되었다","경도인지장애는 진단체계(부록포함)에서 제외되었다","양성증상이 기인하면 하나만 있어도 조현병 진단이 가능해졌다","급성 스트레스 장애가 추가되었다"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤·전은채): 최근 시험 빈출 슬라이드 – 조현병 \"1개 증상만으로 진단\" 조항 삭제(25Y), 정신증 위험 증후군·경도 신경인지장애는 DSM-5 부록\n\n📚 학습지 해설: 정답 ① (복원: 김주안·이지혜 – \"기존 킹야 문제에서 조금 변형, ①번은 근거를 몰라 인터넷에서 찾음\")\n① other specified depressive disorder(달리 명시된 우울장애): 짧은 기간 우울 삽화(4–13일) – 주요우울장애 기준 8가지 중 최소 4가지와 연관된 증상이 최소 4일 이상, 14일 미만 지속. (정답)\n② 정신증 고위험군은 DSM-5에서 탈락되어 부록으로 도입(부록에서도 제외된 것은 아님).\n③ 노화로 인한 건망증을 약한 신경인지장애(경도인지장애)로 규정 – 새롭게 추가.\n④ 망상·환각·와해 언어·와해/긴장성 행동·음성증상 중 2개 이상이 한 달 중 상당 기간 – 증상이 하나라면 조현병 진단 X.\n⑤ 급성 스트레스 장애는 DSM-IV에서 추가, DSM-5에서는 유지(기존 야마에도 있던 보기).","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-dsm5-2020","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2020 객12","type":"객","rep":10,"repyears":"2025 객2 · 2023 객14 · 2022 객14 · 2021 객12 · 2019 객12 · 2018 객12 · 2017 객12 · 2016 객12 · 2015 객12","stem":"DSM-5의 변화로 옳은 것을 고르시오.","choices":["사별로 인한 애도는 진단기준을 충족하더라도 일정 기간 내라면 우울증 진단이 내리지 않음.","정신증 고위험군은 부록으로 도입됨.","경도인지장애는 제외됨.","조현병 활성기 증상의 기간을 1개월에서 1주로 수정함.","급성 스트레스 장애가 추가됨."],"ans":[2],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2019 객12"],"basis":"📌 티야방(정소윤·전은채): 최근 시험 빈출 슬라이드 – 조현병 \"1개 증상만으로 진단\" 조항 삭제(25Y), 정신증 위험 증후군·경도 신경인지장애는 DSM-5 부록\n\n📚 학습지 해설: 정답 ② (복원: 손유준 – 2019 객12와 동일, 19 해설 첨부; 2019 복원 김가영)\n① (X) 사별로 인한 애도도 진단기준을 충족하면 중증 우울증으로 진단받을 수 있도록 예외조항이 삭제되었다.\n② (O) 정신증 고위험군은 DSM-5에서 탈락되어 부록으로 도입되었다.\n③ (X) 경도인지장애를 포함한다.\n④ (X) DSM-IV에서 조현병 활성기 증상 기간을 1주에서 1개월로 강화했다.\n⑤ (X) DSM-IV에서 추가된 내용이다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-dsm5-2018","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2018 객12","type":"객","rep":10,"repyears":"2025 객2 · 2023 객14 · 2022 객14 · 2021 객12 · 2020 객12 · 2019 객12 · 2017 객12 · 2016 객12 · 2015 객12","stem":"다음 중 DSM-5에 대한 설명으로 옳은 것은?","choices":["사별로 인한 애도는 증상기간을 만족하지 않으면 진단이 불가해졌다.","정신증 고위험군이 추가되었다.","노화로 인한 건망증을 약한 신경인지장애로 규정했다.","조현병 활성기 증상의 기간이 1주일에서 1개월로 강화되었다.","급성스트레스장애가 추가되었다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤·전은채): 최근 시험 빈출 슬라 DSM-5에서는 진단기준을 충족하면 우울증 진단 가능. 답: ①","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-axis-2014","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2014 객14","type":"객","rep":3,"repyears":"2013 객3 · 2012 객4","stem":"정신장애의 진단분류에 대한 설명 중 옳은 것을 고르시오.","choices":["DSM-IV에는 모두 범주적 분류 진단체계로 구성되어 있다.","DSM-IV 진단체계에서는 정신장애를 기질적인 것과 심리적인 것으로 구분한다.","DSM-IV 다축체계에서 축 V에서는 특정기간동안의 전반적인 기능을 기술한다.","DSM-IV 다축체계에서 축 III에서는 습관적으로 사용하는 방어기제를 기술한다.","ICD 진단체계는 다축체계의 개념이 전혀 없다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): DSM 각 축의 내용은 고대 야마 빈출\n\n🎓 올해 수업 기준: 교수님(STT): 축 V(GAF 0–100점)는 특정 기간 동안 환자의 전반적 기능을 의사가 판단 – 예컨대 불안하지만 직장·학교는 잘 다니는지. 신체질환이 원인이면 축 I과 III에 동시에 기록하고 그때는 III축이 제일 중요하다. 교수님은 DSM·ICD가 범주적·차원적 분류가 섞여 있으나 범주적 성격이 더 강하고, 원인이 밝혀지지 않은 정신장애에는 차원적 관점이 더 맞다고 봤다.\n\n📚 학습지 해설: 정답 ③ (복원: 김도연, 강의록 정신장애의 진단분류체계)\n① 틀림 – DSM-IV는 일부 차원적 진단체계를 도입했다.\n② 틀림 – 기질적인 것과 심리적인 것으로 나누는 이분법적 개념은 DSM-IV에서 사라졌다.\n③ 맞음 – 축 V: 특정 기간 동안 환자의 전반적인 기능을 의사가 판단(GAF).\n④ 틀림 – 축 III은 일반 의학적 상태. 습관적으로 사용하는 방어기제는 축 II.\n⑤ 틀림 – ICD-10도 다축체계가 있다(축 I 임상진단, II 후유장애, III 상황적 요인).","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-axis-2013","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2013 객3","type":"객","rep":3,"repyears":"2014 객14 · 2012 객4","stem":"DSM-Ⅳ 진단분류체계에 대한 설명 중 옳은 것은?","choices":["일부에서 차원적 진단체계를 도입하였다.","기질적인 것과 심리적인 것으로 나뉜다.","DSM-Ⅳ 축Ⅱ에서는 특정기간 동안 환자의 전반적인 기능을 의사가 판단한 것이다.","DSM-Ⅳ 축Ⅲ에서는 ?","ICD-10에는 다축체계가 없다."],"ans":[1],"imgs":[],"vis":[],"notes":["④ 선지는 학습지에서도 복원되지 않았다(원문 그대로 \"?\")."],"basis":"📌 티야방(정소윤): DSM 각 축의 내용은 고대 야마 빈출\n\n🎓 올해 수업 기준: 학습지에는 이 해 해설이 두 개 섞여 있다(하나는 \"③ 맞음\"이라고 적었지만 그것은 2014 객14의 축 V 선지 설명이고, 이 해 ③은 \"축 Ⅱ에서 전반적 기능\"이라 오답). 강의록(올해 수업): DSM-IV는 bipolar II 등으로 차원적 분류를 일부 도입했다 → ①이 정답.\n\n📚 학습지 해설: 정답 ① (복원: 박세은, 교과서 2판 133–137쪽)\n①(O) 범주적 → 차원적인 진단체계 중심으로 변화(일부 도입).\n②(X) 기질적인 것과 심리적인(기능성) 것으로 나누는 이분법적 개념 사라짐 – 정신장애의 생물학적 이상 소견이 밝혀지면서 신체적·정신적 구분이 모호해졌기 때문.\n③(X) 축 V가 특정 시기의 환자 기능의 전반적인 수준을 임상가가 판단하여 기록한 것(GAF scale). 축 Ⅱ가 아니다.\n④(X) 복원하지 못함.\n⑤(X) ICD-10의 다축체계는 축 I 임상진단, 축 II 후유장애, 축 III 상황적 요인의 세 축 – 간단할 뿐 없는 것은 아님.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-axis-2012","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2012 객4","type":"객","rep":3,"repyears":"2014 객14 · 2013 객3","stem":"정신장애의 진단분류에 대한 설명 중 옳은 것을 고르시오.","choices":["DSM-IV에는 일부 차원적 진단체계를 도입하였다.","DSM-IV 진단체계에서는 정신장애를 기질적인 것과 심리적인 것으로 구분한다.","DSM-IV 다축체계에서 축 II에서는 심리사회적 스트레스를 기술한다.","DSM-IV 다축체계에서 축 IV에서는 일반 신체적 상태를 기술한다.","불안장애, 기분부전장애는 대표적인 신경증 질환으로 일시적인 불안, 우울이 특징적이다."],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤): DSM 각 축의 내용은 고대 야마 빈출\n\n📚 학습지 해설: 정답 ① (복원: 어재은, 정영철 강의록 slide 9–11·15)\n* DSM-III: 세밀한 정의적 개념 처음 도입, 다축체계 도입.\n* DSM-IV: 기질적/심리적 이분법 사라짐(기질성 증후군 없어짐, ICD-10에서는 존속) → ② 틀림. 신경증이라는 용어 사라짐. 축 II의 특수 발달장애 중 일부 소아기 발병 장애가 축 I로, 축 II에는 정신지체만 남음 → ③ 틀림. 차원적 진단체계 일부 도입 → ① 맞음. 정신분열병 활성기 증상 기간 1주 → 1개월. 추가 질환: 레트장애 등 소아기 장애, 기면병, 호흡관련 수면장애, 양극성 II형, 급성 스트레스장애 등.\n* 다축: 축 I 인격장애·정신지체 외 모든 정신장애 / 축 II 인격장애·정신지체·습관적 방어기제 / 축 III 일반 의학적 상태(신체질환이 원인이면 축 I & III 동시 기록) / 축 IV 정신사회적·환경적 문제 → ④ 틀림 / 축 V GAF(0–100).\n* 신경증(slide 15): 병식 있음, 주관적 경험과 현실 구분 가능, 성격의 일부만 관여, 반복적이며 만성적인 불안·우울이 특징 → ⑤ \"일시적\" 틀림. 불안장애·신체형장애·해리장애·성장애·기분부전장애.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-purpose-2011","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2011 객4","type":"객","rep":1,"repyears":"","stem":"정신장애의 진단분류체계에 대한 기술 중 가장 적절한 것은?","choices":["정신장애에서 장애의 개념은 사회적 평균에서 벗어나거나 갈등이 있는 경우를 의미한다.","증상을 일으킨 원인이 무엇이냐에 따라 강제치료를 결정하게 된다.","차원적 분류(dimensional classification)는 질병이 각각 별개이고 분명히 구분되는 것으로 질병유형이라고 주장하며 임상적으로 유용하다.","전문가들 사이의 상호 효율적인 의견교환이 진단분류 목적 중 하나이다.","정신장애는 대부분 원인적 분류를 따른다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(정소윤·전은채): 진단분류 목적 중 교수님이 더 중요하게 보는 것은 전문가들의 상호 효율적인 의견 교환(Y) / 평균에서 벗어나거나 갈등만으로는 정신장애 아님(TY)\n\n🎓 올해 수업 기준: 교수님: 진단분류의 궁극적 목적은 원인을 밝히고 치료법을 개발하는 것이지만 현재는 미약하고, \"그것보다 더 중요한 것\"은 전문가들이 통일된 기준으로 의사소통·토론할 수 있게 하는 것이라고 강조(티야방 정소윤도 같은 정리). 정신장애는 고통이나 장해가 있어야 하며, 사회적 평균에서 벗어나거나 갈등이 있다는 것만으로는 정신장애가 아니다(티야방 전은채 TY).\n\n📚 학습지 해설: 정답 ④ (복원: 진보미, 교과서 2판 Ch.5 130쪽~)\n① (X) 개인적 기능저하 없이 평균에서 벗어나거나 갈등이 있는 것만으로는 정신장애가 아니다 – 괴로움·기능저해를 수반하는 임상적이고 인지 가능한 일군의 증상이나 형태가 나타나야 함(수업 PPT 필기).\n② (X) 정신의학에서는 정신장애를 증상으로 보고 치료를 결정하므로 틀림.\n③ (X) 차원적 분류: 질병 상태는 병전 특성의 차원적 변화로, 건강한 상태와 정도의 차이일 뿐 별개가 아니라고 보는 것(131쪽). 설명된 것은 범주적 분류.\n④ (O) 진단분류의 목적: 임상 현상의 복잡성을 일목요연하게 볼 수 있게 함, 전문가들이 서로 효율적으로 의견을 교환할 수 있는 언어를 제공, 장애의 특징을 정의해 유사장애와 차이점 이해, 치료적 접근을 합리적으로 계획하도록 도움(130쪽).\n⑤ (X) 원인에 관한 지식이 아직 불충분해 정신장애를 주로 증상에 따라 분류한다(131쪽).","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-neurosis-2011","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2011 객5","type":"객","rep":1,"repyears":"","stem":"정신장애의 진단분류에 대한 설명 중 옳은 것을 고르시오.","choices":["정신장애에 대한 체계적이고 현대적인 분류는 Emile Kraepelin으로부터 비롯되었다.","DSM-IV 진단체계에서는 정신장애를 기질적인 것과 심리적인 것으로 구분한다.","DSM-IV 다축체계에서 축 IV에서는 일반 신체적 상태를 기술한다.","정신증은 현실지각의 전반적 손상이 있으나, 성격의 일부만 관여한다.","불안장애, 기분부전장애는 대표적인 신경증 질환으로 일시적인 불안, 우울이 특징적이다."],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(전은채): 정신증(현실지각 전반 손상·성격 전체) vs 신경증(병식 있음·성격 일부) – 구분 문제가 나온 적 있음\n\n🎓 올해 수업 기준: 강의록(올해): Kraepelin – 최초의 현대적인 기술적 분류(경과 중시). 정신증은 현실 지각의 전반적 손상·병식 없음·성격 전체가 관여, 신경증은 병식 있음·성격의 일부만 관여·반복적이고 만성적인 불안·우울. 교수님은 DSM-5가 정신증/신경증을 구분하지 않지만 차이를 설명했고(티야방 전은채), 정신증 환자는 \"경계심 스위치\"가 너무 쉽게 켜져 확증편향이 생긴다고 비유했다.\n\n📚 학습지 해설: 정답 ① (복원: 진우정, 신경정신의학 2판 130–143쪽)\n① O – 132쪽 진단분류의 변천 첫 문장: 체계적이고 현대적인 분류는 Kraepelin으로부터.\n② X – DSM-IV에서는 정신과 신체, 기질적/심리적 같은 이분법적 개념은 더 이상 의미가 없어짐(133–134쪽).\n③ X – 135쪽 표 5-3: Axis IV는 현 정신장애의 발병 혹은 악화에 작용한 심리사회적·환경적 문제(일반 신체적 상태는 Axis III).\n④ X – 142쪽 정신증: 현실지각의 손상과 망상·환청·기억력 장애로 표현되는 정신기능 장애(사회적 위축, 자아의 퇴행 정도가 새로 추가) – 성격 전체가 관여.\n⑤ X – 143쪽 신경증: 만성적·반복적인 비정신병적 장애로 불안이 특징 – 불안장애·기분부전장애가 신경증은 맞으나 불안이 일시적이지 않음.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-cl-pos-2023","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2023 객15","type":"객","rep":6,"repyears":"2022 객15 · 2021 객13 · 2020 객13 · 2019 객13 · 2018 객13","stem":"19세 남자환자가 얼굴에 표정이 없고, 외부자극에 반응하지 않으며, 말수가 줄어드는 등의 증상으로 정신과에 입원을 하였다. 이 환자가 보이는 증상 중에서 약물에 가장 잘 반응하는 증상은?","choices":["얼굴에 표정이 없음","외부자극에 반응하지 않음","말수가 줄어듦","친구들과 만나지 않음","귓가에 이름을 부르는 소리가 들림"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 10/19 조현병 치료 수업: 항정신병약물의 핵심 기전은 시냅스 후 D2 수용체 차단. 1주 내 흥분·초조·불면(진정효과), 2주부터 호전 시작, 4–6주에 핵심 증상(망상·환청)이 개선된다(티야방 박도연 KY). 2세대(비정형) 약물은 음성·인지 증상에 1세대보다 더 효과적이라고 하지만, 보기 중 약에 가장 잘 반응하는 것은 여전히 양성증상인 환청(⑤).\n\n📚 학습지 해설: 정답 ⑤ (2023 복원: 최정윤·최혜원, 정영철 조현병 강의록·18Y 객13 / 2022 복원: 윤동혁 – 18·19·20·21년에도 나온 문제)\n항정신병 약물의 주요 기전은 도파민 D2 수용체 차단. 음성증상(①–④)은 도파민 활성 저하로, 양성증상(⑤)은 도파민 활성 과잉으로 생기므로 유일한 양성증상인 5번이 답 – 양성증상이 먼저 호전된다.\n<정신병적 증상 영역(양성증상)> 1. 환각 – 환청: 사람 목소리, 소리, 음악(⑤), 환시·환후·환미 2. 망상 – 교육적·문화적 배경을 고려해도 사실이 아닌 것을 사실이라 확신(관계·피해·과대·신체·종교·성적 망상)\n<음성증상 영역> 1. 정동둔마 – 감정 표현(①)과 반응의 강도(②) 감소 2. 무의욕증(④) 3. 무언증(③) – 인지기능의 빈곤, 언어빈곤·언어내용 빈곤 4. 무쾌감증 5. 주의력 손상","exps":[],"ai":"","fl":{}},{"k":"psy-y-cl-pos-2022","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2022 객15","type":"객","rep":6,"repyears":"2023 객15 · 2021 객13 · 2020 객13 · 2019 객13 · 2018 객13","stem":"19세 남자가 표정이 없고 자극에도 반응하지 않고 말수가 없고 친구를 만나지 않으려 하며 귀에서 자신의 이름을 부르는 소리가 들린다고 하였다. 항정신병약물 사용시 이 중 치료효과가 가장 잘 나타나는 것은?","choices":["얼굴 표정이 없음","외부 자극에 반응하지 않음","말수가 없음","친구를 만나지 않으려 함","귀에서 자신의 이름을 부르는 소리가 들림"],"ans":[5],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2021 객13"],"basis":"🎓 올해 수업 기준: 10/19 조현병 치료 수업: 항정신병약물은 시냅스 후 D2 차단이 핵심이고 4–6주에 망상·환청이 개선된다. 2세대 약물이 음성증상에 더 낫다고 해도 가장 잘 반응하는 것은 양성증상(환청 ⑤).\n\n📚 학습지 해설: 정답 ⑤ (복원: 윤동혁, 정영철 정신의학적 진단분류 강의록 – 18·19·20·21년에도 나왔던 문제, 작년 해설 첨부)\n항정신병 약물의 주요 기전은 도파민 D2 수용체 차단. 음성증상(1–4번)은 도파민 활성 저하, 양성증상(5번)은 도파민 활성 과잉에 기인하므로 유일한 양성증상인 5번이 답.\n<양성증상> 환각(환청 – 사람 목소리·소리·음악 ⑤, 환시·환후·환미), 망상\n<음성증상> 정동둔마(감정 표현 ①·반응 강도 ② 감소), 무의욕증 ④, 무언증 ③(언어빈곤·언어내용 빈곤), 무쾌감증, 주의력 손상","exps":[],"ai":"","fl":{}},{"k":"psy-y-cl-pos-2020","area":"야마","prof":"정영철","sec":"10/13 · 정신장애의 진단분류체계","meta":"근거: 학습지 「정신장애의 진단분류체계」 256–267쪽","year":"2020 객13","type":"객","rep":6,"repyears":"2023 객15 · 2022 객15 · 2021 객13 · 2019 객13 · 2018 객13","stem":"19세 남자가 표정이 없고 자극에도 반응하지 않고 말수가 없고 친구를 만나지 않으려 하며 귀에서 자신의 이름을 부르는 소리가 들린다고 하였다. 항정신병약물 사용시 이 중 치료효과가 가장 잘 나타나는 것은?","choices":["표정 없음","자극에도 반응하지 않음","말수 없음","친구를 만나지 않으려 함","귀에서 자신의 이름을 부르는 소리가 들림"],"ans":[5],"imgs":[],"vis":[],"notes":["같은 문제(문제·선지 거의 동일): 2019 객13 · 2018 객13"],"basis":"🎓 올해 수업 기준: 10/19 조현병 치료 수업: 항정신병약물은 시냅스 후 D2 차단이 핵심이고 4–6주에 망상·환청이 개선된다. 2세대 약물이 음성증상에 더 낫다고 해도 가장 잘 반응하는 것은 양성증상(환청 ⑤).\n\n📚 학습지 해설: 정답 ⑤ (2020 복원: 20 학습부 / 2019 복원: 박지현 – \"작년 기출과 동일한 문제, 그 풀이를 옮겨옴\")\n항정신병 약물의 주요 기전은 도파민 D2 수용체 차단. 음성증상(①–④)은 도파민 활성 저하, 양성증상(⑤)은 도파민 활성 과잉에 기인하므로 유일한 양성증상인 5번이 답.\n[조현병 임상양상(강의록)]\n<양성 – 정신병적 증상> 1. 환각: 환청(⑤), 환시·환후·환미 2. 망상: 관계·피해·과대·신체·종교·성적 망상\n<양성 – 와해증상> 1. 와해된 언어: 연상이완(말비빔·지리멸렬), 우원증·사고이탈, 음향연상·반향언어증·음송증·신어조작증 2. 와해된 행동: 긴장성 혼미·흥분, 상동증·매너리즘, 반향행동증, 자동복종, 거부증, 괴이한 위생·의복 3. 정동 불일치\n<음성증상> 1. 정동둔마 – 감정 표현(①)과 반응 강도(②) 감소 2. 무의욕증(④) 3. 무언증(③) – 언어빈곤·언어내용 빈곤 4. 무쾌감증 5. 주의력 손상","exps":[],"ai":"","fl":{}},{"k":"psy-sz1-01","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: 강의록 「조현병 1」 2쪽 · STT 10/14 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"Emil Kraepelin이 조현병을 \"조발성 치매(dementia praecox)\"라고 부른 근거는?","choices":["1급 증상이 반드시 있어서","사고의 분리와 이완이 특징이어서","환각이 부수적 증상이어서","어린 나이에 발병하고 만성적이며 황폐화되는 경과를 보여서","모든 연령에서 발병하고 삽화 사이에 정상으로 회복되어서"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"Kraepelin은 경과에 주목했다: 어린 나이(20대)에 발병해 만성적으로 나빠져 치매 환자처럼 된다. 반면 조울병은 모든 연령에서 발병하고 삽화 사이에 거의 정상 기능으로 회복된다고 나눴다.","exps":["Schneider의 관점이다.","Bleuler의 관점이다.","Bleuler의 관점이다.","정답.","조울병의 특징이다."],"ai":"","fl":{}},{"k":"psy-sz1-02","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인) oices":["착각(illusion)","사고 전파","사고 반향","망상적 지각","환청"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"망상적 지각: 지각 자체는 정상인데 지각된 것에 망상적 해석이 따라붙는다. 소음 때문에 화가 나 관리실에 전화하는 것까지는 정상이지만, \"일부러 나를 괴롭히려고\"라는 확신이 붙으면 망상적 지각.","exps":["실제 자극을 잘못 지각하는 것이다.","내 생각이 남에게 전달된다는 것이다.","자기 생각이 들리는 것이다.","정답.","실제 소리가 있다."],"ai":"","fl":{}},{"k":"psy-sz1-06","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: STT 10/14 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"\"내 몸이 내 의지대로 움직이지 않고 외부의 무언가에 의해 조종된다\"는 경험은 어느 1급 증상인가?","choices":["thought broadcasting","audible thought","somatic passivity","delusional perception","voices arguing"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"somatic passivity: 내 몸동작·행동이 내 의지대로 되지 않고 누군가에게 조종되는 느낌. 자아 경계가 깨져 생긴다.","exps":["생각이 퍼지는 것.","생각이 들리는 것.","정답.","정상 지각에 망상 해석.","목소리끼리 논쟁."],"ai":"","fl":{}},{"k":"psy-sz1-07","area":"탈야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: 강의록 「조현병 1」 5쪽 · STT 10/14 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병 병명 개정에 대한 설명으로 옳은 것은?","choices":["병명 개정은 Kraepelin이 처음 제안했다","일본은 2002년 \"사각실조\"로 바꿨다","한국은 2011년 개정, 2012년 1월 공표했다","한국은 아직 정신분열병이 공식 명칭이다","홍콩은 \"통합실조증\"으로 바꿨다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 5쪽: 일본 2002년 통합실조증, 홍콩 사각실조, 한국 2011년 조현병 개정 → 2012년 1월 국회 공표.","exps":["해당 없다.","일본은 통합실조증.","정답.","조현병으로 개정됐다.","홍콩은 사각실조."],"ai":"","fl":{}},{"k":"psy-sz1-08","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: STT 10/14 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"\"조현(調絃)\"이라는 이름의 비유에서, 현을 너무 조여 소리가 날카로운 상태와 너무 느슨해 축 처진 상태가 각각 뜻하는 것은?","choices":["기분 증상 – 불안 증상","와해 증상 – 인지 증상","전구기 – 잔류기","음성 증상 – 양성 증상","양성 증상 – 음성 증상"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"조현은 현악기의 줄을 조율한다는 뜻(어원은 불경: 수행을 너무 쉬지 않고 하는 제자에게 부처가 한 말). 너무 조여 음이 날카로운 것이 양성 증상, 너무 느슨해 처진 것이 음성 증상.","exps":["해당 없다.","해당 없다.","해당 없다.","반대다.","정답."],"ai":"","fl":{}},{"k":"psy-sz1-09","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: 강의록 「조현병 1」 6쪽 · STT 10/14 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병 역학에 대한 설명으로 옳지 않은 것은?","choices":["남자는 15–25세, 여자는 25–35세에 주로 발병한다","평생 유병률은 약 1%다","발생률은 여자가 남자보다 2배 높다","연간 발생률은 만 명당 0.5–5명이다","45세 이후 발병하면 만발성이라 한다"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 6쪽: 평생 유병률 1%(한국 0.4–0.7%), 연간 발생률 만 명당 0.5–5명, 남 15–25세(평균 21세)·여 25–35세(27세)로 남자가 빠르지만 발생률은 성별 차이가 없다. 10세 이전·60세 이후는 드물고 45세 이후는 만발성.","exps":["옳다.","옳다.","정답. 발생률은 성별 차이가 없다.","옳다.","옳다."],"ai":"","fl":{}},{"k":"psy-sz1-10","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: STT 10/14 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"60세에 처음으로 환청과 의심 증상이 생겨 외래에 왔다. 교수님이 \"항상 생각해야 한다\"고 한 것은?","choices":["꾀병 가능성","대마초 사용 여부","양극성장애 가능성","편집형 조현병으로 확진","치매 초기 가능성"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"60세 이후 발병은 드물기 때문에, 이 나이에 처음 정신병적 증상이 생기면 치매 초기 증상일 가능성을 반드시 확인해야 한다.","exps":["근거 없다.","젊은 층의 위험인자다.","감별 대상이지만 강조점이 아니다.","확진 전에 배제할 것이 있다.","정답."],"ai":"","fl":{}},{"k":"psy-sz1-11","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: 강의록 「조현병 1」 7쪽 · STT 10/14 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병 위험 인자로 강의에서 다룬 것이 아닌 것은?","choices":["고령 아버지","겨울·초봄 출생","임신 중 영양 결핍(Dutch hunger)","농촌 출생","대마초 흡연"],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"강의록 7쪽: 겨울·초봄 출생(출산 전후 감염), 고령 아버지, 임신 시 영양 결핍·산과적 합병증, Toxoplasma gondii, 소아기 외상(3배), 도시 출생, 이민, 대마초. 교수님: 이 요인들이 하나로 결정하는 것이 아니라 합쳐져 그림을 형성한다.","exps":["위험 인자.","위험 인자.","위험 인자.","정답. 도시 출생이 위험 인자다.","위험 인자(유럽·미국에서 매우 중요한 이슈)."],"ai":"","fl":{}},{"k":"psy-sz1-12","area":"티야","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: STT 10/14 1교시","year":"","type":"객","rep":1,"repyears":"","stem":"이민자에게서 조현병 발생이 높은 이유로 교수님이 가장 중요하게 본 것은?","choices":["특정 유전자 변이가 흔해서","언어 능력이 빨리 늘어서","무시·배제 경험이 피해망상의 씨앗이 되어서","기후 변화에 적응하지 못해서","식습관이 크게 바뀌어서"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"무시되거나 배제되는 경험이 피해망상이 생기는 중요한 첫 씨앗. 교수님 연구: 북한이탈주민 약 5 ."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📚 학습지 해설: 답 ④. 역학: 평생 유병률 1%(한국 0.4–0.7%), 연간 발생률 만 명당 0.5–5명, 발병 연령 남 15–25세(21세)·여 25–35세(27세)이나 발생률은 성별 차이 없음, 10세 이전·60세 이후 드묾(45세 이후 만발성), 낮은 사회계층, 일반인보다 사망률 높음. 유전: 일차 가족 1.4–6.5%, 일란성 40–60%, 이란성 10–15%, polygenic·multifactorial diathesis-stress model, 반복 재현된 이상 염색체 부위 없음. ② 조현병이 치매로 진행한다는 말은 없다(우울증의 가성치매와 혼동 주의).","exps":[],"ai":"","fl":{}},{"k":"psy-y-scz-cause-2012","area":"야마","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2012 객5","type":"객","rep":2,"repyears":"2011 객13","stem":"다음 중 조현병 발병 요인에 대한 설명으로 맞는 것은?","choices":["조현병 환자의 형제의 유병율은 1.0%이다.","최근 수정된 도파민 가설에 의하면 음성증상은 중뇌 번연계 경로의 도파민 활성 저하, 양성증상은 중뇌 피질 경로의 도파민 활성 과잉에 의한 것이다.","CT, MRI 등의 신경 영상학적 검사상 측뇌실 3뇌실의 위축, 대뇌 피질의 비대 등이 보고되었다.","클라인은 출생 후 6개월 동안 유아가 어머니에게 파괴적 충동을 경험하면서 편집성 불안을 느끼는 과정을 발병 요인으로 보았다.","발병은 주요하게 유전적인 요인에 의해 결정되며 이에 대한 연구는 반복적으로 재현되고 있다."],"ans":[4],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤): 심리사회적 요인(Klein paranoid position) – 교수님 입장에선 더 중요하다고 함\n\n🎓 올해 수업 기준: 올해 수업(10/14 STT): 교수님은 심리사회적 요인을 \"교수님 입장에서는 더 중요하다\"며 갈등설과 부족-결핍설을 나눠 설명했다 – 갈등설: 문제없이 자라다 대인관계 갈등으로 자아 기능이 약해져 퇴행, Klein의 paranoid position(생후 6개월, 낯선 자극을 경계하는 정상 단계가 모성 돌봄 부족으로 순화되지 못하고 남음) / 부족-결핍설: 정신지체·경계성 지능 같은 선천적 결핍. 뇌 구조 이상(측뇌실·제3뇌실 \"확장\", 상측두회 용적 감소)은 초발에서 이미 보여 신경발달학적 문제를 시사한다.\n\n📚 학습지 해설: 답 ④. ① 형제 유병률 8%(일반 1%, 부모 한 명 12%, 이란성 12%, 부모 모두 40%, 일란성 47%)(X) ② 수정 도파민 가설: 음성증상 = 중뇌피질 도파민 활성 저하, 양성증상 = 중뇌변연계 도파민 활성 과잉 – 경로가 서로 바뀜(X) ③ MRI·CT: 측뇌실·제3뇌실 \"확장\", 측두엽(특히 상측두회) 용적 감소, 대뇌피질 \"위축\", 대뇌반구 비대칭, 소뇌 위축 – 초발 환자에서 보이고 경과에 따라 차이 없음(X) ④ Klein: 생후 첫 6개월 유아가 어머니에게 파괴적 충동을 경험하며 편집성 불안·상실 불안을 느끼고 분리·함입·투사 등 원시적 방어기제를 쓰는 데서 발병 요인을 찾음(O) ⑤ 이상 염색체 부위는 반복 재현된 것이 없다(X). 그 밖에 세로토닌(LSD, clozapine의 5-HT–DA 길항), 글루타메이트(PCP·ketamine – 양성·음성·인지 증상 모두), SPEM·ERP(P300·P50)는 trait marker, 가족관계 이론(Lidz·Bateson 이중구속·Wynne)은 이제 원인이 아니라 치료 자원으로 본다.","exps":[],"ai":"","fl":{"tyb":1}},{"k":"psy-y-scz-cause-2011","area":"야마","prof":"정영철","sec":"10/14 · 조현병 1 (역사·역학·원인)","meta":"근거: 학습지 「조현병 스펙트럼 및 기타 정신병적 장애」 268–301쪽","year":"2011 객13","type":"객","rep":2,"repyears":"2012 객5","stem":"정신분열병의 원인에 관련된 기술 중 가장 적절한 것은?","choices":["정신분열병의 발병에 관여할 것으로 추정되는 염색체 부위들이 있으며 상당수가 여러 연구에서 반복재현되는 것으로 보고되고 있다.","클로자핀을 비롯한 새로운 항정신병 약물인 5-HT-DA(세로토닌-도파민) 차단제는 세로토닌이 도파민 차단작용을 강화시켜 1세대 약물보다 더욱 효과적이다.","음성증상은 중뇌피질 경로의 도파민 활성저하와, 양성증상은 중뇌변연계 경로의 도파민 활성과잉에 기인할 것으로 여겨지고 있다.","신경생리학적 요인으로 SPEM (smooth eye movement) 장애는 임상경과와 연관되는 상태표지자일 가능성이 많다.","가족관계 이론에서 볼 수 있듯이 왜곡된 가족관계가 중요한 원인이라는 견해가 지배적이다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"🎓 올해 수업 기준: 올해 수업(10/14 STT): 교수님 – GWAS로 수십만 개를 분석해도 하나의 원인 유전자는 나오지 않고 여러 변이가 합쳐져 생긴다(polygenic·multifactorial diathesis-stress model이 정설), 가족 연구의 높은 수치도 sporadic case까지 보면 유전이 그렇게 높지 않다. SPEM·ERP는 환자와 가족에서 함께 보이는 trait marker.\n\n📚 학습지 해설: 답 ③. ① 발병 관여 추정 염색체 부위는 여럿 제시되지만 반복 재현된 것은 없다(X) ② clozapine 등은 5-HT–DA 길항 – 5-HT는 중뇌·전두엽·선조체에서 DA 활성을 억제하는데, 5-HT2A 길항·5-HT1A 효현이 이 억제를 막아 DA 활성을 \"증가\"시켜 음성·인지 증상을 개선하고 D2 길항에 의한 추체외로 부작용을 줄인다(X) ③ 음성증상은 중뇌피질 도파민 저하, 양성증상은 중뇌변연계 도파민 과잉(O) ④ SPEM 장애는 환자 50–85%, 직계가족 34–58%에서 보이고 임상경과와 무관 → trait marker(X) ⑤ 가족이 원인이라는 견해는 거의 받아들여지지 않고 치료의 중요한 자원으로 본다(X).","exps":[],"ai":"","fl":{}},{"k":"psy-sz2-01","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 강의록 「조현병 2」 2쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"조현병에서 가장 흔한 환각은?","choices":["환촉","환청","환시","환후","환미"],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"환각 중 환청이 가장 흔하다. 전형적으로 사람 목소리(나쁜 내용)가 들리고, 소음·음악·자기 이름을 부르는 소리 등도 있다.","exps":["드물다.","정답.","가장 흔하지 않다.","드물다.","드물다."],"ai":"","fl":{}},{"k":"psy-sz2-02","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 강의록 「조현병 2」 2쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"망상의 정의로 가장 알맞은 것은?","choices":["반복되는 원치 않는 생각에 시달리는 것","꿈 내용을 현실과 혼동하는 것","배경을 고려해도 틀린 것을 확신하며 교정되지 않는 것","실제 자극을 순간적으로 잘못 지각하는 것","실제 자극 없이 무언가를 지각하는 것"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록 2쪽: 그 사람의 교육적·문화적 배경을 고려하더라도 사실이 아닌 것을 사실이라고 확신하는 경우(사고 내용의 장애). 관계·피해·과대·신체·종교·성적 망상 등.","exps":["강박사고에 가깝다.","해당 없다.","정답.","해당 없다.","환각이다."],"ai":"","fl":{}},{"k":"psy-sz2-03","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"📌티야방 · 근거: 강의록 「조현병 2」 3쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"질문과 상관없는 이야기로 빠져서 끝내 질문에 답하지 못하는 것과, 딴 이야기를 길게 하다가 결국 질문에 답하는 것을 바르게 짝지은 것은?","choices":["신어조작 – 음송증","우원증 – 사고이탈","사고이탈 – 우원증","음향연상 – 반향언어","사고차단 – 함구증"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤): 와해된 언어 – 사고이탈/우원증\n\n사고이탈(tangentiality): 아예 빠져서 돌아오지 않음. 우원증(circumstantiality): 잠깐 딴 얘기를 했다가 결국 대답해 줌. 둘 다 와해된 언어(사고 과정의 장애).","exps":["해당 없다.","반대다.","정답.","해당 없다.","해당 없다."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz2-04","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"📌티야방 · 근거: 강의록 「조현병 2」 3·14쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"\"무슨 과 할래요?\" \"예과요. 절창, 족창, 자창, 열창을 예쁘게 해 주잖아요.\"처럼 뜻보다 발음이 같은 말로 이어 가는 증상은?","choices":["신어조작증","반향언어증","사고차단","우원증","음향연상"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"📌 티야방(이서윤): 음향연상 – 수업 마지막 퀴즈(절창·족창·자창·열창)\n\n음향연상: 말의 뜻은 없고 발음(음)이 같은 말로 계속 이어진다(끝말잇기와 비슷). 강의록 14쪽의 사례. 반향언어증은 남의 말을 그대로 따라 하는 것, 음송증은 의미 없는 단어·말을 반복하는 것.","exps":["새 단어를 만듦.","남의 말을 앵무새처럼 따라 함.","생각이 갑자기 끊김.","돌아서 결국 답함.","정답."],"ai":"","fl":{"tyb":1}},{"k":"psy-sz2-05","area":"티야","prof":"정영철","sec":"10/14 · 조현병 2 (임상양상·진단·아형·감별)","meta":"근거: 강의록 「조현병 2」 3쪽 · STT 10/14 2교시","year":"","type":"객","rep":1,"repyears":"","stem":"상대방의 말을 앵무새처럼 따라 하는 것과 상대방의 행동을 따라 하는 것을 바르게 짝지은 것은?","choices":["신어조작증 – 매너리즘","함구증 – 거부증","반향언어증 – 반향행동증","음송증 – 상동증","반향행동증 – 반향언어증"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"반향언어(echolalia)는 말을, 반향행동(echopraxia)은 행동을 따라 한다. 교수님: 엄청난 공포에 압도되어 정지된 상태에서는 자아 기능이 없으니 남이 하는 대로 따라간다고 이해하라.","exps":["해당 없다.","해당 없다.","정답.","해당 없다.","반대다."],"ai":"","fl":{}},{"k":"psy-sz2-06","area":"티야","prof":"정영철"
