<title>안과 문풀</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* layout: 상단 고정 필터 묶음 + 한 문제씩 넘기는 카드 한 장 */
:root{
  --bg:#f3f4f8;--card:#ffffff;--fg:#1d2030;--mute:#6b6f85;--line:#d9dbe6;
  --accent:#3550c0;--accent-fg:#ffffff;--accent-soft:#e8ecfb;
  --ok:#23824a;--ok-soft:#e5f4ea;--bad:#c23a32;--bad-soft:#fbeae8;--warn:#8a6400;--warn-soft:#fff4d6;
  --chip:#ebedf3;
  --f-body:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161e;--card:#1d2029;--fg:#e8e9f0;--mute:#9a9db0;--line:#333747;
  --accent:#7d93ff;--accent-fg:#0f1220;--accent-soft:#252d4d;
  --ok:#5fcf8a;--ok-soft:#18321f;--bad:#ff7d73;--bad-soft:#3a1d1b;--warn:#f2c552;--warn-soft:#3a3016;--chip:#272a36;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161e;--card:#1d2029;--fg:#e8e9f0;--mute:#9a9db0;--line:#333747;
  --accent:#7d93ff;--accent-fg:#0f1220;--accent-soft:#252d4d;
  --ok:#5fcf8a;--ok-soft:#18321f;--bad:#ff7d73;--bad-soft:#3a1d1b;--warn:#f2c552;--warn-soft:#3a3016;--chip:#272a36;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.6 var(--f-body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 60px}
h1{font-size:26px;line-height:1.25;margin:4px 0 10px;font-weight:700;letter-spacing:-.01em}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--mute);font-size:14.5px}
.stats b{color:var(--fg);font-family:var(--f-num);font-weight:500;margin-left:4px}
.sync{text-align:right;color:var(--mute);font-size:13px;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select,input[type=search],textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:12px}
select,input[type=search]{width:100%;min-width:0;padding:10px 12px;font-size:15px}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip,.btn{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 16px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn{border-radius:12px;padding:9px 14px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.navbar{display:flex;align-items:center;gap:8px}
.navbar .pos{flex:1;font-family:var(--f-num);color:var(--mute);font-size:15px;min-width:0}
.navbar .pos b{color:var(--fg);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;color:var(--mute);font-size:14px}
.pill{background:var(--chip);color:var(--fg);border-radius:8px;padding:2px 9px;font-size:13px;font-weight:600}
.pill.area{background:var(--accent-soft);color:var(--accent)}
.pill.king{background:var(--warn-soft);color:var(--warn)}
.meta{color:var(--accent);font-size:14px;margin-top:8px;font-weight:500}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:7px 11px;font-size:13.5px;margin-top:8px}
.note.oos{background:var(--chip);color:var(--mute)}
.stem{font-size:17px;margin:14px 0 12px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.imgs img{display:block;max-width:100%;height:auto;margin:8px auto;border-radius:8px;border:1px solid var(--line)}
.vis{background:var(--chip);border-radius:10px;padding:8px 11px;font-size:14px;white-space:pre-wrap;margin-bottom:8px}
.choices{display:grid;gap:10px}
.ch{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;word-break:keep-all;overflow-wrap:anywhere}
.ch .no{font-family:var(--f-num);color:var(--mute);font-size:14px;flex:none;width:18px;padding-top:2px}
.ch span:last-child{min-width:0}
.ch.right{border-color:var(--ok);background:var(--ok-soft)}
.ch.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ch.mine{box-shadow:inset 0 0 0 1px currentColor}
.ch.sel{border-color:var(--fg);box-shadow:inset 0 0 0 2px var(--fg)}
.done .ch{cursor:default}
.result{margin-top:14px;font-weight:700;font-size:16px}
.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}
.exp{margin-top:8px;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.exp h3{font-size:13px;color:var(--mute);margin:14px 0 4px;font-weight:600;letter-spacing:.02em}
.exp ol{margin:0;padding-left:22px;white-space:normal}
.exp li{margin:3px 0}
.ai{background:var(--accent-soft);border-radius:10px;padding:8px 11px;font-size:14px;margin-top:10px;white-space:pre-wrap}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.acts .chip{font-size:14px;padding:6px 13px}
.memo{margin-top:14px}
.memo label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:600}
.fam{margin:12px 0;padding:10px 12px;border:1px solid var(--line);border-radius:12px}.fam summary{cursor:pointer;font-weight:600}.famq{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}.famch{margin:6px 0 0;padding-left:24px}.famch li.ok{font-weight:700;color:var(--accent)}
.memo textarea{width:100%;min-height:220px;max-height:75vh;padding:12px 14px;font-size:15px;line-height:1.6;resize:vertical;overflow-y:auto}
.memo .saved{font-size:12px;color:var(--mute);min-height:1em}
.bottomnav{display:flex;gap:8px;justify-content:space-between;margin-top:14px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.sheet{position:fixed;inset:0;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding-top:env(safe-area-inset-top,0px)}
.sheet[hidden]{display:none}
.sheet .box{background:var(--bg);width:100%;max-width:760px;max-height:86vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h2{font-size:18px;margin:0 0 8px}
.list{list-style:none;margin:0;padding:0}
.list li{border-top:1px solid var(--line);padding:9px 2px;cursor:pointer;display:flex;gap:10px}
.list li.cur{background:var(--accent-soft)}
.list .n{font-family:var(--f-num);color:var(--mute);font-size:13px;width:44px;flex:none;padding-top:2px}
.list .t{min-width:0;font-size:14.5px}
.list .s{font-size:12.5px;color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.sheet textarea{width:100%;height:160px;font:12px/1.4 var(--f-num);padding:8px}
.msg{font-size:13px;color:var(--ok);min-height:1.2em;margin:6px 0}
@media (max-width:420px){h1{font-size:23px}.stem{font-size:16.5px}}
@media (prefers-reduced-motion:no-preference){.ch{transition:background .15s,border-color .15s}}
</style>

막.","각막 두께의 약 90%.","신경말단이 풍부한 층."],"ai":"","pick":0,"fl":{}},{"k":"oph-es-04","fam":"","area":"티야","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: 강의록 「2026 눈의 구조와 기능」 · STT 11/12 5교시(이행진)","year":"","type":"객","rep":1,"repyears":"","stem":"공막에 대한 설명으로 옳은 것은?","choices":["바깥쪽은 혈관이 없는 상공막으로 덮여 있다.","시신경이 통과하는 체 모양의 부분을 사상판이라 한다.","직근이 부착하는 부위가 가장 두껍다.","아교질이 규칙적으로 배열되어 투명하다.","안구 외막의 앞쪽 1/6을 차지한다."],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록: 공막 = 뒤쪽 5/6, 치밀한 섬유조직(하얗고 단단), 직근 부착부 0.3mm(가장 얇음)·시신경 주위 1mm(가장 두꺼움), 공막이 얇아지고 작은 구멍이 뚫린 체 모양 → 시신경섬유가 통과하는 사상판(lamina cribrosa), 바깥은 상공막(영양 공급 혈관 많음). STT: \"사상판 쪽에 변화가 생기면서 생기는 질환을 녹내장이라고 해요\", \"각막은 균일해서 투명한데 공막은 얼기설기 얽혀 불투명.\"","exps":["상공막에는 혈관이 많다.","정답.","직근 부착부가 0.3mm로 가장 얇다.","불규칙·불투명(투명한 건 각막).","뒤쪽 5/6(앞 1/6은 각막)."],"ai":"","pick":0,"fl":{}},{"k":"oph-es-05","fam":"","area":"티야","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: 강의록 「2026 눈의 구조와 기능」 · STT 11/12 5교시(이행진)","year":"","type":"객","rep":1,"repyears":"","stem":"동공과 동공근에 대한 설명으로 옳은 것은?","choices":["정상 동공 크기는 대략 2~4mm이다.","동공확대근은 부교감신경의 지배를 받는다.","동공조임근은 교감신경의 지배를 받는다.","동공이 4mm보다 작으면 동공수축이라 한다.","동공조임근은 방사상으로 배열되어 있다."],"ans":[1],"imgs":[],"vis":[],"notes":["정상 동공 크기를 STT에선 \"2에서 3mm 정도\"라고 말씀하셨고, 강의록 표는 2–4mm예요."],"basis":"강의록: 동공확대근 – 교감신경, 동공조임근 – 부교감신경. <2mm 동공수축(miosis), 2–4mm 정상, >4mm 동공확대(mydriasis). STT: \"조여주는 근육은 서큘러하게(sphincter) – 부교감, 확대근은 레디얼하게 – 교감, 서로 다른 신경의 지배를 받는다.\" 멀미약(스코폴라민 패치) 같은 약으로 동공이 커져서 오기도 함(약 이름은 외울 필요 없음).","exps":["정답.","교감.","부교감.","2mm 미만이 동공수축.","조임근은 원형(circular), 방사상은 확대근."],"ai":"","pick":0,"fl":{}},{"k":"oph-es-06","fam":"","area":"티야","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: 강의록 「2026 눈의 구조와 기능」 · STT 11/12 5교시(이행진)","year":"","type":"객","rep":1,"repyears":"","stem":"섬모체에 대한 설명으로 옳지 않은 것은?","choices":["맥락막 앞쪽 끝에서 홍채뿌리까지 걸친 직각삼각형 모양 조직이다.","섬모체근이 수축하면 섬모체소대가 팽팽해진다.","조절 시 수정체가 두꺼워져 굴절력이 증가한다.","섬모체돌기에서 방수를 생성한다.","평면부는 톱니둘레를 지나 망막으로 이어진다."],"ans":[2],"imgs":[],"vis":[],"notes":[],"basis":"강의록: 섬모체 = 맥락막 앞 끝~홍채뿌리 직각삼각형, 방수 생성(섬모체돌기), 조절력 – 섬모체근 수축 → 섬모체소대가 늘어짐(이완) → 수정체 두꺼워짐 → 중심만곡·굴절력 증가. STT: \"소대는 해먹처럼 끈으로 잡고 있어서, 근육이 수축하면 끈이 느슨해지고 수정체가 통통해진다. 가까운 걸 보면 수정체가 통통해져야 굴절력이 증가.\"","exps":["맞음.","정답(옳지 않음) – 수축하면 소대는 느슨해진다.","맞음.","맞음.","맞음 – 톱니둘레(ora serrata)."],"ai":"","pick":0,"fl":{}},{"k":"oph-es-07","fam":"","area":"티야","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: 강의록 「2026 눈의 구조와 기능」 · STT 11/12 5교시(이행진)","year":"","type":"객","rep":1,"repyears":"","stem":"맥락막의 기능으로 옳은 것은?","choices":["혈관이 거의 없는 얇은 섬유막이다.","방수를 생성해 안압을 유지한다.","색소가 풍부해 공막으로 들어오는 광선을 차단한다.","망막 안쪽 1/3의 대사를 담당한다.","수정체를 지지하는 섬모체소대가 붙는다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록: 맥락막 = 망막과 공막 사이, 두께 0.1~0.2mm의 혈관으로 이루어진 막, 시신경유두 가장자리에서 톱니둘레까지. 기능 – 망막 바깥쪽 1/3 대사, 색소 풍부 → 공막 통해 들어오는 광선 차단. STT: \"색소가 풍부해서 자외선 같은 나쁜 광선 차단, 혈관이 어마무시하게 많아 공막·망막에 영양 공급.\"","exps":["혈관으로 이루어진 막.","섬모체돌기의 기능.","정답.","바깥쪽 1/3.","섬모체의 이야기."],"ai":"","pick":0,"fl":{}},{"k":"oph-es-08","fam":"","area":"티야","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: STT 11/12 5교시(이행진) · 강의록 「2026 눈의 구조와 기능」(망막 10층 그림)","year":"","type":"객","rep":1,"repyears":"","stem":"망막 10개 층 중 교수님이 가장 중요하다고 강조한 두 층으로, 맥락막에서 망막으로 물질이 들어오지 못하게 막는 장벽 역할을 하는 층은?","choices":["망막색소상피층","바깥경계막","속핵층","신경절세포층","신경섬유층"],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"STT: \"10개 층 다 외우진 않아도 되는데(망막 교수님은 외우라고 하신대요), 제일 중요한 두 층은 첫 번째(색소상피)랑 두 번째(광수용세포층). 맥락막 다음 맞닿은 층이 pigment epithelium인데 tight junction으로 잘 연결되어 맥락막의 물질이 망막으로 못 들어오게 막는 barrier.\" 요즘은 OCT로 층을 나눠 보기 때문에 층을 알아야 함.","exps":["정답.","광수용세포 안쪽의 경계.","두극세포 등이 있는 층.","시신경 축삭의 세포체 층.","시신경유두로 모이는 축삭 층."],"ai":"","pick":0,"fl":{}},{"k":"oph-es-09","fam":"","area":"티야","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: 강의록 「2026 눈의 구조와 기능」 · STT 11/12 5교시(이행진)","year":"","type":"객","rep":1,"repyears":"","stem":"원뿔세포와 막대세포에 대한 설명으로 옳은 것은?","choices":["원뿔세포는 주로 망막 주변부에 분포한다.","막대세포는 밝은 빛에서 형태와 색을 인식한다.","막대세포는 어두운 곳의 명암감각(암순응)을 담당한다.","중심오목에는 막대세포만 존재한다.","원뿔세포는 약 1억 개로 막대세포보다 많다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록: 원뿔세포 – 밝은 빛, 형태·색각, 600만 개, 황반에 밀집(15만/mm²), R/G/B cone. 막대세포 – 어두운 빛, 명암감각, 1억 개, 주변부. STT: \"원뿔세포는 포비아에 가장 많이 집결, 어두울 때 볼 수 있게 암순응하는 게 막대세포고 주변부에 더 있습니다. 파장별 세포는 외우지 않아도 – 색맹·적록색각이상이 이 세포 기능 저하.\"","exps":["원뿔세포는 황반에 밀집.","원뿔세포의 기능.","정답.","중심오목엔 원뿔세포만.","원뿔 600만, 막대 1억."],"ai":"","pick":0,"fl":{}},{"k":"oph-es-10","fam":"","area":"티야","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: 강의록 「2026 눈의 구조와 기능」 · STT 11/12 5교시(이행진)","year":"","type":"객","rep":1,"repyears":"","stem":"황반과 중심오목에 대한 설명으로 옳은 것은?","choices":["중심오목은 맥락막에서 영양을 공급받는다.","중심오목에는 망막중심동맥 분지가 풍부하다.","황반은 시신경유두보다 약간 위쪽에 있다.","중심오목에는 원뿔세포와 막대세포가 섞여 있다.","황반은 시신경유두의 코쪽에 있다."],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록: 황반 = 시신경유두의 약 3mm 바깥쪽 약간 아래의 타원형 함몰부, 중심오목(fovea)에는 원뿔세포만. STT: \"망막중심동맥 혈관들이 공급해주는데 이 포비아에는 혈관이 없어요. 원뿔세포만 있고 영양 공급은 맥락막에서 받는 거예요. 포비아에 문제가 생기는 대표 질환이 황반변성 – 너무너무 중요한 구조물이니까 꼭 알고 계세요.\"","exps":["정답.","중심오목엔 혈관이 없다.","약간 아래.","원뿔세포만.","귀쪽(바깥쪽)."],"ai":"","pick":0,"fl":{}},{"k":"oph-es-11","fam":"","area":"티야","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: 강의록 「2026 눈의 구조와 기능」 · STT 11/12 5교시(이행진)","year":"","type":"객","rep":1,"repyears":"","stem":"방수의 생성과 배출 경로로 옳은 것은?","choices":["홍채 생성 → 앞방 → 섬유주 → 뒷방 → 쉴렘관","수정체 생성 → 뒷방 → 유리체 → 앞방 → 섬유주","섬모체돌기 생성 → 뒷방 → 동공 → 앞방 → 섬유주","섬모체돌기 생성 → 앞방 → 동공 → 뒷방 → 쉴렘관","맥락막 생성 → 앞방 → 동공 → 뒷방 → 섬유주"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록: 방수 – 각막 형태 유지, 각막·수정체 영양 공급, 용적 약 0.2ml(80% 앞방, 20% 뒷방). 배출 ① 앞방각 섬유주 → 쉴렘관 → 정맥(주경로) ② 섬모체를 거쳐 포도막-공막 경로. 앞방 = 각막 뒷면~홍채, 뒷방 = 홍채~수정체 앞면. STT: \"섬모체돌기에서 만들어져 뒷방 → 동공 → 앞방 → trabecular meshwork → Schlemm canal → episcleral vein이 가장 많이 나가는 배출구, uveoscleral outflow도 있다. 배출구에 문제가 생겨 안압이 오르는 게 녹내장.\"","exps":["생성은 섬모체돌기.","생성은 섬모체돌기, 유리체로 가지 않음.","정답.","뒷방이 먼저.","생성은 섬모체돌기."],"ai":"","pick":0,"fl":{}},{"k":"oph-es-12","fam":"","area":"티야","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: 강의록 「2026 눈의 구조와 기능」 · STT 11/12 5교시(이행진)","year":"","type":"객","rep":1,"repyears":"","stem":"시신경과 시신경유두에 대한 설명으로 옳지 않은 것은?","choices":["시신경유두에는 시세포가 없어 생리적 암점이 생긴다.","약 100만~120만 개의 신경절세포 축삭으로 이루어진다.","시신경유두 위쪽 섬유가 손상되면 위쪽 시야가 결손된다.","안와 내 시신경은 S자 모양으로 여유 있게 주행한다.","위쪽과 아래쪽을 담당하는 섬유가 수평선을 경계로 나뉜다."],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록: 망막 신경섬유층 = 약 100만 개 신경절세포 축삭 → 시신경유두 → 눈알을 빠져나옴, 시신경유두엔 시세포 없음 – 생리적 암점. S자 모양 25~30mm, 공막–시신경구멍 18mm. STT: \"horizontal raphe로 위·아래 담당 부분이 나뉘어 있다. 시신경 위쪽에 피가 나면 아래쪽 시야에 문제가 생긴다 – 시신경 담당 구획이 나뉘어 있다는 건 꼭 알고 계세요. 대표 질환이 녹내장.\" \"S자로 여유가 있어서 갑상샘눈병증처럼 눈알이 튀어나와도 어느 정도 보완.\"","exps":["맞음.","맞음(교과서마다 100만~120만).","정답(옳지 않음) – 위쪽 섬유 손상 → 아래쪽 시야.","맞음.","맞음."],"ai":"","pick":0,"fl":{}},{"k":"oph-es-13","fam":"","area":"티야","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: 강의록 「2026 눈의 구조와 기능」 · STT 11/12 5교시(이행진)","year":"","type":"객","rep":1,"repyears":"","stem":"시신경 섬유 중 약 20%를 차지하며 가쪽무릎체를 거치지 않고 중간뇌로 가서 동공대광반사에 관여하는 섬유는?","choices":["시각부챗살(optic radiation)","시섬유(visual fiber)","동공섬유(pupillary fiber)","교차하지 않는 귀쪽 섬유","망막중심동맥 주위 섬유"],"ans":[3],"imgs":[],"vis":[],"notes":[],"basis":"강의록: 시신경 섬유 – 80%는 시섬유(visual fiber)로 lateral geniculate body → optic radiation → visual cortex, 20%는 동공섬유(pupillary fiber)로 가쪽무릎체를 거치지 않고 midbrain으로 가서 동공대광반사. STT: \"80%는 보는 데 관여, 20%는 동공 움직임 – 이게 왜 중요하냐면 동공반사는 보이든 안 보이든 빛을 받으면 조여져야 하거든요. 신경섬유는 제니큘레이트 바디를 절대 거치지 않는다, 바로 미드브레인으로.\" 시각경로: 신경절세포 → 시신경 → 시신경교차(코쪽 망막 섬유가 교차) → 시각로 → 가쪽무릎체 → 시각부챗살 → 시각피질.","exps":["가쪽무릎체 → 시각피질 경로.","80% – 가쪽무릎체로 가서 보는 기능.","정답.","시신경교차에서 같은 쪽으로 가는 섬유.","해당 없음."],"ai":"","pick":0,"fl":{}},{"k":"oph-es-14","fam":"","area":"티야","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: STT 11/12 5교시(이행진) · 강의록 「2026 눈의 구조와 기능」","year":"","type":"객","rep":1,"repyears":"","stem":"안와에 대한 설명으로 옳은 것은?","choices":["안와축과 시축은 약 23°의 각을 이룬다.","외상 시 위벽과 바깥벽이 가장 잘 부러진다.","안와는 총 9개의 뼈로 구성된다.","안와사이막은 눈꺼풀판과 결막 사이의 막이다.","시신경구멍으로는 위눈정맥이 지나간다."],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"STT: \"안쪽벽(medial wall)이랑 아래벽(inferior wall)이 안와골절 때 가장 많이 부러지는 곳 – 상대적으로 위벽·바깥벽은 거의 안 다쳐요, 이거는 중요해요.\" \"orbital axis랑 visual axis가 23도 – 숫자 강조 안 하고 싶지만 중요하니까 알고 있으세요.\" \"안와가장자리 골막과 눈꺼풀판을 연결하는 막이 orbital septum – 눈꺼풀 감염이 뒤(안와·뇌)로 넘어가지 않게 barrier, 꼭 이름은 알고.\" 강의록: 안와 7개 뼈, 시신경구멍(지름 약 6mm) – 시신경·눈동맥·교감신경 섬유, 위안와틈새 – CN III·IV·VI·V1, 위눈정맥.","exps":["정답.","안쪽벽·아래벽.","7개.","안와가장자리 골막~눈꺼풀판 연결막.","위눈정맥은 위안와틈새."],"ai":"","pick":0,"fl":{}},{"k":"oph-es-15","fam":"","area":"티야","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: 강의록 「2026 눈의 구조와 기능」 · STT 11/12 5교시(이행진)","year":"","type":"객","rep":1,"repyears":"","stem":"눈꺼풀 근육과 그 신경지배가 옳게 연결된 것은?","choices":["눈꺼풀올림근 – 교감신경","이마근 – 눈돌림신경","눈꺼풀올림근 – 얼굴신경","눈둘레근 – 눈돌림신경","뮐러근 – 교감신경"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록: 눈둘레근(orbicularis oculi) – facial nerve, 안와부(주변) = 질끈 감을 때, 눈꺼풀부(중앙) = 무의식적 깜빡임. 눈꺼풀올림근 – oculomotor nerve(3번), 널힘줄로 넓게 부착. 뮐러근 – 교감신경. STT: \"감는 근육은 하나, 뜨는 근육은 둘(levator, Müller). 3번 신경 문제면 ptosis, 호너증후군(교감신경)도 눈꺼풀이 처져서 와요. 보조로 이마근(frontalis) – 눈꺼풀처짐 있으면 이마에 주름, 이마근걸기술.\"","exps":["눈돌림신경.","얼굴신경(보조 근육).","눈돌림신경.","얼굴신경.","정답."],"ai":"","pick":0,"fl":{}},{"k":"oph-es-16","fam":"","area":"티야","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: 강의록 「2026 눈의 구조와 기능」 · STT 11/12 5교시(이행진)","year":"","type":"객","rep":1,"repyears":"","stem":"눈물막의 층과 분비 기관이 옳게 연결된 것은?","choices":["지방층 – 결막 술잔세포","지방층 – 크라우제샘","수성층 – 마이봄샘","점액층 – 주눈물샘","점액층 – 결막 술잔세포"],"ans":[5],"imgs":[],"vis":[],"notes":[],"basis":"강의록: 눈물막 – 지방층 ← 마이봄샘, 수성층 ← 눈물샘, 점액층 ← 결막 술잔세포. 주눈물샘(눈물샘오목, 자극·울음), 덧눈물샘(크라우제·볼프링, 습윤 유지). STT: \"셋 중 하나라도 문제가 생기면 안구건조증. 각막에 가장 닿아있는 부분이 뮤커스, 그 위가 수성층, 맨 위를 지방층이 코팅.\" 마이봄샘은 눈꺼풀판(tarsus)에 일렬로 – 막히면 다래끼·안구건조.","exps":["지방층은 마이봄샘.","크라우제샘은 수성층(덧눈물샘).","수성층은 눈물샘.","주눈물샘은 수성층.","정답."],"ai":"","pick":0,"fl":{}},{"k":"oph-es-17","fam":"","area":"티야","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: 강의록 「2026 눈의 구조와 기능」 · STT 11/12 5교시(이행진)","year":"","type":"객","rep":1,"repyears":"","stem":"외안근에 대한 설명으로 옳지 않은 것은?","choices":["위빗근은 도르래를 통과하며 외회선을 일으킨다.","위곧은근과 아래곧은근은 광축과 약 23°를 이룬다.","회선은 각막 위쪽 12시 부위가 도는 방향을 기준으로 한다.","위빗근과 아래빗근은 광축과 약 51°를 이룬다.","각막가장자리에서 가장 가까이 부착하는 직근은 안쪽곧은근이다."],"ans":[1],"imgs":[],"vis":[],"notes":[],"basis":"강의록: SR·IR – 광축과 23°, SO – 시신경구멍 안쪽에서 시작·trochlea 통과·가장 긴 외안근·광축과 51°, IO – 51°. 부착: MR 5 / IR 6 / LR 7 / SR 8mm. SO = 내회선·내림·가쪽돌림, IO = 외회선·올림·가쪽돌림. 3번 – SR·MR·IR·IO, 4번 – SO, 6번 – LR. STT: \"23도·51도는 사시 공부할 때 이해가 쉬우니 꼭 외우도록\", \"회선은 12시 부위가 코쪽이면 내회선, 귀쪽이면 외회선 – 너무 중요해요\", \"superior oblique는 내회선, inferior oblique는 외회선 – 꼭 알고 있으세요.\"","exps":["정답(옳지 않음) – 위빗근은 내회선.","맞음.","맞음.","맞음.","맞음(약 5mm)."],"ai":"","pick":0,"fl":{}},{"k":"oph-y-newborn-2025","fam":"newborn","area":"야마","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: 학습지 「눈의 구조와 기능」 5–17쪽","year":"2025 객1","type":"객","rep":1,"repyears":"","stem":"출생 시 정상 신생아의 눈 설명으로 가장 맞는 것은?","choices":["안축장은 약 22mm이다.","안구부피는 성인의 80% 정도이다.","망막중심오목은 미성숙한 상태이다.","시신경유두 크기는 성인에 비해 아주 작은 상태이다.","성인에 비해 외안근부착부가 각막가장자리로부터 좀 더 먼 거리에 위치해있다."],"ans":[3],"imgs":[],"vis":[],"notes":["✍️ 출제: 이행진 교수님 (2025)"],"basis":"📚 학습지 해설(요약): ① 신생아 평균 안축장은 약 17mm. ② 안구 용적은 성인의 절반 정도. ③ 망막중심오목은 미숙한 상태(정답). ④ 시신경은 신생아가 유일하게 성인과 비슷한 정도로 갖고 태어나는 것(노화로 시신경세포 감소). ⑤ 신생아는 외안근 부착부가 더 가깝다. 복원자: \"이행진 교수님은 수치도 정확하게 외워두는 게 좋다.\"","exps":[],"ai":"","pick":0,"fl":{}},{"k":"oph-y-struct-2025","fam":"struct","area":"야마","prof":"이행진","sec":"11/12 5교시 · 눈의 구조와 기능","meta":"근거: 학습지 「눈의 구조와 기능」 5–17쪽","year":"2025 객2","type":"객","rep":8,"repyears":"2023 객1 · 2022 객1 · 2021 객1 · 2020 객1 · 2019 객3 · 2017 객1 · 2016 객1","stem":"눈의 구조에 관한 설명으로 가장 맞는 것은?","choices":["직근에 혈액을 공급하는 혈관은 앞섬모체 동맥이며 한눈에 총 8개가 있다.","망막은 10개 층으로 구성되어 있으며 원뿔세포는 색소상피층에 위치해 있다.","각막내피세포는 손상에 취약하고 나이가 들면서 감소하지만 재생이 잘 된다.","섬모체는 주름이 많은 주름부와 평평한 평면부로 구분되며, 평면부는 톱니둘레로 연결된다.","공막은 안구 뒷부분의 5/6를 차지하며, 공막을 구성하는 아교질 섬유는 크기가 일정하고 배열이 규칙적이다."],"ans":[4],"imgs":[],"vis":[],"notes":["✍️ 출제: 이행진 교수님 (2025)"],"basis":"📚 학습지 해설(요약): ① 앞섬모체동맥은 한눈에 7개(직근마다 2개, 외직근만 1개). ② 원뿔세포는 광수용세포층. ③ $('bRes').onclick=function(){sheet('<h2>백업 불러오기</h2><div class="msg" id="rmsg">“기록 백업”에서 복사한 글을 붙여넣고 불러오기를 누르세요. 지금 기록과 합쳐져요.</div><textarea id="rbox"></textarea><div class="tools"><button class="btn pri" id="rgo">불러오기</button><button class="btn" id="cls">닫기</button></div>');
  $('cls').onclick=closeSheet;$('rgo').onclick=function(){try{var o=JSON.parse($('rbox').value);merge(o.s||o);changed();refilter(true);$('rmsg').textContent='불러왔어요.'}catch(e){$('rmsg').textContent='백업 글 형식이 아니에요. 처음부터 끝까지 그대로 붙여넣었는지 확인해 주세요.'}}};

/* ---------- 저장·계정 동기화 ---------- */
// 계정에서 읽어 온 값은 고칠 수 없는(얼린) 객체라 그대로 넣으면 이후 빼기·헷갈림·풀이 기록이 조용히 무시됨 → 복사해서 넣는다
function merge(o){['a','f','m'].forEach(function(x){var src=(o&&o[x])||{};Object.keys(src).forEach(function(k){var v=src[k];if(!v)return;var c=S[x][k];if(!c||(v.t||0)>(c.t||0))S[x][k]=JSON.parse(JSON.stringify(v))})})}
var DB=null,UID=null,pt=null,dirty=false,busy=false,again=false,fails=0;
// 진단 기록: 최근 40개 동작을 ost/<UID>/x/log 에 남겨 Claude가 읽을 수 있게(오답노트 빼기 문제 추적)
var DBG=[];function dlog(m){DBG.push(new Date().toISOString().slice(11,19)+' '+m);if(DBG.length>40)DBG.shift()}
function dflush(){if(!DB||!UID)return;DB.doc('ost/'+UID+'/x/log').set({v:'11/12 15:49',ua:navigator.userAgent.slice(0,120),log:DBG.slice()}).catch(function(){})}
function changed(){lsSet(LK,S);dirty=true;clearTimeout(pt);pt=setTimeout(push,2500)}
// 메모는 문서 하나에 256KB까지라 4개 문서로 나눠 저장(omemo/UID, omemo/UID/p/1~3 – 각자 자기 하위 경로). 기록(st)은 한 문서.
var MB=4;function mdoc(i){return 'omemo/'+UID+(i?'/p/'+i:'')}
function mbucket(k){var h=0;for(var i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;return h%MB}
function readAll(){var ps=[DB.doc('ost/'+UID).get()];for(var i=0;i<MB;i++)ps.push(DB.doc(mdoc(i)).get());
  return Promise.all(ps).then(function(r){var s=r[0]&&r[0].exists?r[0].data():null,any=false;if(s)merge({a:s.a,f:s.f});
    for(var i=1;i<r.length;i++){var m=r[i]&&r[i].exists?r[i].data():null;if(m){any=true;merge({m:m.m})}}lsSet(LK,S);return {s:s,m:any}})}
function writeAll(){var ts=new Date().toISOString(),parts=[];for(var i=0;i<MB;i++)parts.push({});
  Object.keys(S.m).forEach(function(k){parts[mbucket(k)][k]=S.m[k]});
  // 같은 문서에 동시에 여러 번 쓰면 거절되므로 하나씩 차례로 쓴다
  var p=DB.doc('ost/'+UID).set({a:S.a,f:S.f,updatedAt:ts});
  parts.forEach(function(m,i){p=p.then(function(){return DB.doc(mdoc(i)).set({m:m,updatedAt:ts})})});return p}
function push(){if(!DB||!UID||!dirty){dlog('push skip db='+!!DB+' uid='+!!UID+' dirty='+dirty);return}if(busy){again=true;dlog('push busy->again');return}busy=true;dirty=false;again=false;dlog('push start');
  // 다른 기기·다른 탭이 먼저 저장한 기록(더 최신 t)을 덮어쓰지 않도록 서버 것을 먼저 합친 뒤 저장
  readAll().catch(function(e){dlog('read fail '+(e&&e.code))}).then(writeAll).then(function(){fails=0;busy=false;dlog('push ok');dflush();$('sync').textContent='계정에 저장됨 · 모든 기기 연결';if(again||dirty){dirty=true;push()}},
    function(e){busy=false;dirty=true;fails++;dlog('push fail '+(e&&(e.code+' '+e.message)));$('sync').textContent='계정 저장 실패'+(e&&e.code?' ('+e.code+')':'')+' · 다시 시도 중';
      if(fails<6){clearTimeout(pt);pt=setTimeout(push,2000*fails)}})}
function pull(){if(!DB||!UID)return Promise.resolve();dlog('pull');$('sync').textContent='계정 기록 연결 중…';
  return readAll().then(function(r){refilter(true);$('sync').textContent='계정에 저장됨 · 모든 기기 연결';
    if(!r.s||!r.m||Object.keys(S.a).length){dirty=true;push()}},function(){$('sync').textContent='계정 연결 실패 · 이 기기에만 저장'})}
$('bSync').onclick=function(){if(DB)pull();else{S=lsGet(LK)||S;refilter(true)}};
window.addEventListener('pagehide',function(){lsSet(LK,S);push()});
if(window.claude&&window.claude.use){Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
  if(!r[0]||!r[1]){$('sync').textContent='이 기기에 저장됨';return}DB=r[0];return r[1].id().then(function(id){if(!id){$('sync').textContent='이 기기에 저장됨';DB=null;return}UID=id;return pull()})}).catch(function(){$('sync').textContent='이 기기에 저장됨'})}
else $('sync').textContent='이 기기에 저장됨';

syncCtl();refilter(true);
})();
</script>
